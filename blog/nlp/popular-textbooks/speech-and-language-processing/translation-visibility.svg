<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Three attention patterns in translation</title><desc id="desc">Encoder self-attention is a full three by three matrix. Decoder self-attention is a lower triangular four by four matrix. Cross-attention has four decoder query rows and three source key columns, all visible. Decoder inputs are start, the, cat, sleeps; their targets are the, cat, sleeps, end.</desc><rect width="960" height="560" fill="#fffdf7"/><g font-family="Arial, sans-serif" fill="#172b24">

 <title>Eight triangular filters equally spaced on a mel scale</title>
 <metadata>
  <rdf:RDF xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
   <cc:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
    <dc:title>Eight triangular filters equally spaced on a mel scale</dc:title>
    <dc:description>Eight triangular filters use edges equally spaced on the mel scale 1127 log(1 plus frequency divided by 700). Their widths increase in hertz; each peak weight is one.</dc:description>
    <dc:format>image/svg+xml</dc:format>

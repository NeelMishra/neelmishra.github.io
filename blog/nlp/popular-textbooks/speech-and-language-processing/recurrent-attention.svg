<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 536" role="img" aria-labelledby="title desc">
<title id="title">A numerical recurrent encoder-decoder attention lookup</title><desc id="desc">Query 1,0 gives dot-product scores 1,0,1 for encoder states 1,0; 0,1; and 1,1. Softmax weights are 0.422319,0.155362,0.422319. Their weighted context is 0.844638,0.577681. Query 0,1 swaps the context coordinates.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
<rect width="780" height="536" fill="#fffdf9"/><g font-family="Arial,sans-serif"><text x="28" y="36" font-size="23" fill="#13201a" font-weight="700" text-anchor="start">Attention reads a different source mixture at each step</text><text x="28" y="68" font-size="16" fill="#4a5a53" font-weight="400" text-anchor="start">Current decoder query q = [1, 0]; dot products are not divided by √d here.</text><rect x="28" y="99" width="220" height="99" rx="10" fill="#133e32"/><text x="138" y="128" font-size="15" fill="#ffffff" font-weight="400" text-anchor="middle">Encoder state 1</text><text x="138" y="171" font-size="27" fill="#ffffff" font-weight="700" text-anchor="middle">[1, 0]</text><text x="138" y="234" font-size="19" fill="#13201a" font-weight="700" text-anchor="middle">q · h = 1</text><rect x="28" y="258" width="220" height="51" rx="10" fill="#edf2ec"/><rect x="28" y="258" width="92.91018" height="51" rx="8" fill="#b7d9c6"/><text x="138" y="291" font-size="18" fill="#087354" font-weight="700" text-anchor="middle">α = 0.422319</text><path d="M138 320L138 347" fill="none" stroke="#087354" stroke-width="2" marker-end="url(#arrow)"/><rect x="280" y="99" width="220" height="99" rx="10" fill="#133e32"/><text x="390" y="128" font-size="15" fill="#ffffff" font-weight="400" text-anchor="middle">Encoder state 2</text><text x="390" y="171" font-size="27" fill="#ffffff" font-weight="700" text-anchor="middle">[0, 1]</text><text x="390" y="234" font-size="19" fill="#13201a" font-weight="700" text-anchor="middle">q · h = 0</text><rect x="280" y="258" width="220" height="51" rx="10" fill="#edf2ec"/><rect x="280" y="258" width="34.17964" height="51" rx="8" fill="#b7d9c6"/><text x="390" y="291" font-size="18" fill="#087354" font-weight="700" text-anchor="middle">α = 0.155362</text><path d="M390 320L390 347" fill="none" stroke="#087354" stroke-width="2" marker-end="url(#arrow)"/><rect x="532" y="99" width="220" height="99" rx="10" fill="#133e32"/><text x="642" y="128" font-size="15" fill="#ffffff" font-weight="400" text-anchor="middle">Encoder state 3</text><text x="642" y="171" font-size="27" fill="#ffffff" font-weight="700" text-anchor="middle">[1, 1]</text><text x="642" y="234" font-size="19" fill="#13201a" font-weight="700" text-anchor="middle">q · h = 1</text><rect x="532" y="258" width="220" height="51" rx="10" fill="#edf2ec"/><rect x="532" y="258" width="92.91018" height="51" rx="8" fill="#b7d9c6"/><text x="642" y="291" font-size="18" fill="#087354" font-weight="700" text-anchor="middle">α = 0.422319</text><path d="M642 320L642 347" fill="none" stroke="#087354" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="361" width="724" height="86" rx="10" fill="#eef4fb"/><text x="48" y="393" font-size="17" fill="#3b6493" font-weight="700" text-anchor="start">Context = 0.422319[1, 0] + 0.155362[0, 1] + 0.422319[1, 1]</text><text x="48" y="427" font-size="24" fill="#3b6493" font-weight="700" text-anchor="start">= [0.844638, 0.577681]</text><text x="28" y="482" font-size="18" fill="#13201a" font-weight="700" text-anchor="start">Change q to [0, 1]: context becomes [0.577681, 0.844638].</text><text x="28" y="512" font-size="16" fill="#4a5a53" font-weight="400" text-anchor="start">The source states stay fixed. The decoder changes which mixture it retrieves.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="590" viewBox="0 0 960 590" role="img" aria-labelledby="bpe-title bpe-desc">
<title id="bpe-title">BPE learns merge rules, then reuses them</title><desc id="bpe-desc">Training corpus play times 4, played times 2, player times 1, and stay times 2 yields the three rules a plus y to ay with count 9, p plus l to pl with count 7, then pl plus ay to play with count 7. Encoding replay yields r, e, play.</desc>
<rect width="960" height="590" rx="14" fill="#fffdf9"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#13201a}.muted{fill:#4a5a53}.green{fill:#087354}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.eyebrow{font-size:17px;font-weight:700;letter-spacing:1.8px}.title{font-size:29px;font-weight:700}.label{font-size:22px;font-weight:700}.small{font-size:19px}</style>
<text x="24" y="30" class="eyebrow green">BYTE-PAIR ENCODING</text>
<text x="24" y="72" class="title">Learn once. Apply the same ordered rules.</text>
<rect x="24" y="96" width="912" height="238" rx="12" fill="#f3f0e8" stroke="#d9cfba"/>
<text x="46" y="133" class="label">TRAINING: frequencies select the next merge</text>
<rect x="46" y="154" width="260" height="151" rx="12" fill="#fffdf9" stroke="#d9cfba"/>
<text x="64" y="185" class="eyebrow green">RULE 1</text>
<text x="64" y="225" class="mono" font-size="25">a + y → ay</text>
<text x="64" y="260" class="label">Count 9</text>
<text x="64" y="286" class="small muted">4 + 2 + 1 + 2</text>
<rect x="350" y="154" width="260" height="151" rx="12" fill="#fffdf9" stroke="#d9cfba"/>
<text x="368" y="185" class="eyebrow green">RULE 2</text>
<text x="368" y="225" class="mono" font-size="25">p + l → pl</text>
<text x="368" y="260" class="label">Count 7</text>
<text x="368" y="286" class="small muted">4 + 2 + 1</text>
<rect x="654" y="154" width="260" height="151" rx="12" fill="#fffdf9" stroke="#d9cfba"/>
<text x="672" y="185" class="eyebrow green">RULE 3</text>
<text x="672" y="225" class="mono" font-size="25">pl + ay → play</text>
<text x="672" y="260" class="label">Count 7</text>
<text x="672" y="286" class="small muted">4 + 2 + 1</text>
<text x="24" y="369" class="small muted">Freeze the merge list before reading new input.</text>
<rect x="24" y="389" width="912" height="177" rx="12" fill="#e8f3ed" stroke="#b5cbbf"/>
<text x="46" y="427" class="label">ENCODING: unseen word “replay”</text>
<text x="46" y="468" class="eyebrow muted">START</text>
<text x="46" y="507" class="mono" font-size="22">r e p l a y</text>
<text x="275" y="468" class="eyebrow muted">AFTER RULE 1</text>
<text x="275" y="507" class="mono" font-size="22">r e p l ay</text>
<text x="510" y="468" class="eyebrow muted">AFTER RULE 2</text>
<text x="510" y="507" class="mono" font-size="22">r e pl ay</text>
<text x="745" y="468" class="eyebrow muted">AFTER RULE 3</text>
<text x="745" y="507" class="mono" font-size="22">r e play</text>
<text x="247" y="508" class="green" font-size="24">→</text>
<text x="480" y="508" class="green" font-size="24">→</text>
<text x="717" y="508" class="green" font-size="24">→</text>
<text x="46" y="545" class="small green">No new counts. No new vocabulary entries. Final output: 3 tokens.</text>
</svg>
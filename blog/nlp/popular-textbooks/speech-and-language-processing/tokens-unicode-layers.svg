<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="unicode-title unicode-desc">
<title id="unicode-title">One visible word, two Unicode representations</title><desc id="unicode-desc">The precomposed café uses 4 code points and 5 UTF-8 bytes. The decomposed café uses 5 code points and 6 bytes. NFC maps both examples to the same precomposed spelling.</desc>
<rect width="960" height="430" rx="14" fill="#fffdf9"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#13201a}.muted{fill:#4a5a53}.green{fill:#087354}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.eyebrow{font-size:17px;font-weight:700;letter-spacing:1.8px}.title{font-size:29px;font-weight:700}.label{font-size:22px;font-weight:700}.small{font-size:19px}</style>
<text x="24" y="30" class="eyebrow green">TEXT REPRESENTATION</text>
<text x="24" y="72" class="title">A screen can hide a difference in the data</text>
<rect x="24" y="100" width="446" height="230" rx="12" fill="#f3f0e8" stroke="#d9cfba"/>
<text x="46" y="136" class="eyebrow muted">PRECOMPOSED</text>
<text x="46" y="195" font-size="48">café</text>
<text x="204" y="176" class="label">4 code points</text>
<text x="204" y="207" class="small muted">5 UTF-8 bytes</text>
<text x="46" y="251" class="mono" font-size="20">U+ 0063 0061 0066 00E9</text>
<text x="46" y="293" class="mono muted" font-size="18">63 61 66 C3 A9  (hex bytes)</text>
<rect x="490" y="100" width="446" height="230" rx="12" fill="#f3f0e8" stroke="#d9cfba"/>
<text x="512" y="136" class="eyebrow muted">DECOMPOSED</text>
<text x="512" y="195" font-size="48">café</text>
<text x="670" y="176" class="label">5 code points</text>
<text x="670" y="207" class="small muted">6 UTF-8 bytes</text>
<text x="512" y="251" class="mono" font-size="20">U+ 0063 0061 0066 0065 0301</text>
<text x="512" y="293" class="mono muted" font-size="18">63 61 66 65 CC 81  (hex bytes)</text>
<rect x="24" y="353" width="912" height="54" rx="12" fill="#e8f3ed"/>
<text x="480" y="388" class="label green" text-anchor="middle">NFC normalization → café   ·   4 code points   ·   5 bytes</text>
</svg>
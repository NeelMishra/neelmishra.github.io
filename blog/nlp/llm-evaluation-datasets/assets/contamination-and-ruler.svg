<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="920" height="430" rx="14" fill="#0f172a"/>
  <text x="460" y="34" text-anchor="middle" fill="#f8fafc" font-size="17" font-weight="700">Truthfulness, Effective Long-Context (RULER) &amp; Contamination Diagnostics</text>
  <text x="460" y="54" text-anchor="middle" fill="#94a3b8" font-size="12">TruthfulQA MC1/MC2/MC3, RULER multi-hop/aggregation vs. NIAH, and 13-gram + Min-K% decontamination</text>

  <!-- Panel 1: TruthfulQA & FActScore -->
  <rect x="24" y="74" width="280" height="334" rx="10" fill="#1e293b" stroke="#ec4899" stroke-width="1.5"/>
  <text x="40" y="98" fill="#f472b6" font-size="13" font-weight="700">1. TruthfulQA &amp; FActScore</text>
  <text x="40" y="116" fill="#94a3b8" font-size="10">Testing imitative falsehoods &amp; atomic facts</text>

  <rect x="40" y="130" width="248" height="76" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="52" y="148" fill="#f8fafc" font-size="10.5" font-weight="700">Imitative Falsehoods (N = 817)</text>
  <text x="52" y="165" fill="#cbd5e1" font-size="9.5">High-frequency web misconceptions</text>
  <text x="52" y="180" fill="#f87171" font-size="9.5">• Inverse scaling on raw base models</text>
  <text x="52" y="195" fill="#34d399" font-size="9.5">• Corrected via SFT / RLHF alignment</text>

  <rect x="40" y="218" width="248" height="92" rx="6" fill="#0f172a" stroke="#ec4899"/>
  <text x="52" y="236" fill="#f472b6" font-size="10.5" font-weight="700">TruthfulQA MC1 / MC2 / MC3</text>
  <text x="52" y="254" fill="#e2e8f0" font-size="9.5">• MC1: 𝕀[ℓ(a⁺_best) &gt; max ℓ(a⁻)]</text>
  <text x="52" y="271" fill="#e2e8f0" font-size="9.5">• MC2: Σ exp ℓ(a⁺) / Σ_{all} exp ℓ(a)</text>
  <text x="52" y="288" fill="#e2e8f0" font-size="9.5">• MC3: mean_{a⁺} 𝕀[ℓ(a⁺) &gt; max ℓ(a⁻)]</text>

  <rect x="40" y="322" width="248" height="70" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="52" y="340" fill="#60a5fa" font-size="10.5" font-weight="700">FActScore Atomic Decomposition</text>
  <text x="52" y="357" fill="#cbd5e1" font-size="9.5">Split generation y → atomic facts {f₁..f_m}</text>
  <text x="52" y="373" fill="#cbd5e1" font-size="9.5">Verify each f_k against Wikipedia retrieval</text>

  <!-- Panel 2: NIAH vs RULER -->
  <rect x="320" y="74" width="280" height="334" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="336" y="98" fill="#60a5fa" font-size="13" font-weight="700">2. Long-Context: NIAH vs. RULER</text>
  <text x="336" y="116" fill="#94a3b8" font-size="10">Claimed context vs. Effective Context Length</text>

  <rect x="336" y="130" width="248" height="76" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="348" y="148" fill="#f8fafc" font-size="10.5" font-weight="700">Why Single-Needle NIAH Saturates</text>
  <text x="348" y="165" fill="#cbd5e1" font-size="9.5">Single passkey in Paul Graham essays</text>
  <text x="348" y="180" fill="#fbbf24" font-size="9.5">Solved by 1-layer induction head copy</text>
  <text x="348" y="195" fill="#94a3b8" font-size="9.5">99%+ at 128K even when reasoning fails</text>

  <rect x="336" y="218" width="248" height="92" rx="6" fill="#0f172a" stroke="#3b82f6"/>
  <text x="348" y="236" fill="#60a5fa" font-size="10.5" font-weight="700">RULER (4 Task Families, 4K→128K)</text>
  <text x="348" y="254" fill="#e2e8f0" font-size="9.5">1. Multi-Key / Multi-Value / Multi-Query</text>
  <text x="348" y="270" fill="#e2e8f0" font-size="9.5">2. Variable Tracking (X1 → X2 → ... → Xk)</text>
  <text x="348" y="286" fill="#e2e8f0" font-size="9.5">3. Aggregation (Frequent Words CWE/FWE)</text>
  <text x="348" y="301" fill="#e2e8f0" font-size="9.5">4. Multi-Document Long-Context QA</text>

  <rect x="336" y="322" width="248" height="70" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="348" y="340" fill="#34d399" font-size="10.5" font-weight="700">Effective Context Length (L_eff)</text>
  <text x="348" y="357" fill="#cbd5e1" font-size="9.5">Max L where RULER score ≥ τ (85.6%)</text>
  <text x="348" y="373" fill="#f87171" font-size="9.5">Many "128K" models drop below τ at 32K</text>

  <!-- Panel 3: Contamination & Decontamination -->
  <rect x="616" y="74" width="280" height="334" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="632" y="98" fill="#34d399" font-size="13" font-weight="700">3. Benchmark Decontamination</text>
  <text x="632" y="116" fill="#94a3b8" font-size="10">Corpus hygiene &amp; post-hoc leakage audits</text>

  <rect x="632" y="130" width="248" height="76" rx="6" fill="#0f172a" stroke="#10b981"/>
  <text x="644" y="148" fill="#34d399" font-size="10.5" font-weight="700">13-Gram Span Decontamination</text>
  <text x="644" y="165" fill="#cbd5e1" font-size="9.5">Index all 13-word eval benchmark spans</text>
  <text x="644" y="180" fill="#cbd5e1" font-size="9.5">Ignore frequent boilerplate (&gt;10 docs)</text>
  <text x="644" y="195" fill="#cbd5e1" font-size="9.5">Excise ±200 token window on match</text>

  <rect x="632" y="218" width="248" height="92" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="644" y="236" fill="#f8fafc" font-size="10.5" font-weight="700">Min-K% Prob Leakage Detector</text>
  <text x="644" y="254" fill="#e2e8f0" font-size="9.5">Select bottom k% (20%) lowest log-prob</text>
  <text x="644" y="270" fill="#e2e8f0" font-size="9.5">tokens E_min-k% in test instance x:</text>
  <text x="644" y="287" fill="#fbbf24" font-size="9.5">Score(x) = (1/|E|) Σ_{t ∈ E} ln P_θ(w_t|w_&lt;t)</text>
  <text x="644" y="301" fill="#94a3b8" font-size="9">High outlier floor ⇒ training memorization</text>

  <rect x="632" y="322" width="248" height="70" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="644" y="340" fill="#c084fc" font-size="10.5" font-weight="700">Option Permutation &amp; Canaries</text>
  <text x="644" y="357" fill="#cbd5e1" font-size="9.5">Circular shift (A,B,C,D) → accuracy drop</text>
  <text x="644" y="373" fill="#cbd5e1" font-size="9.5">measures pure answer-letter memorization</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img" aria-labelledby="title desc">
  <title id="title">Taxonomy of LLM Evaluation Datasets Across Pretraining and Post-Training</title>
  <desc id="desc">Four-column visual taxonomy mapping LLM evaluation benchmarks across Pretraining Intrinsic Perplexity (WikiText-103, C4, The Pile, Paloma), Pretraining Task &amp; Knowledge (MMLU, ARC, HellaSwag, WinoGrande, PIQA), Post-Training Reasoning &amp; Code (GSM8K, MATH, GPQA, HumanEval+, LiveCodeBench, SWE-bench), and Post-Training Instruction, Chat &amp; Diagnostics (IFEval, MT-Bench, AlpacaEval 2.0, Chatbot Arena, TruthfulQA, RULER).</desc>
  <style>
    .bg { fill: #fbfaf6; stroke: #d7d0c4; stroke-width: 1.5; rx: 14; }
    .panel { fill: #ffffff; stroke: #dcd4c6; stroke-width: 1.25; rx: 10; }
    .hdr-pre1 { fill: #e9f2ee; stroke: #285e4a; stroke-width: 1.4; rx: 8; }
    .hdr-pre2 { fill: #edf4f9; stroke: #2b5b84; stroke-width: 1.4; rx: 8; }
    .hdr-post1 { fill: #fdf3e6; stroke: #b45309; stroke-width: 1.4; rx: 8; }
    .hdr-post2 { fill: #f7edf8; stroke: #6d3b7e; stroke-width: 1.4; rx: 8; }
    .card { fill: #fcfbf9; stroke: #e3dcd0; stroke-width: 1.1; rx: 7; }
    .h1 { font: 700 18px "Manrope", system-ui, sans-serif; fill: #1d2a24; }
    .sub { font: 500 12.5px "Manrope", system-ui, sans-serif; fill: #526058; }
    .col-title { font: 800 13.5px "Manrope", system-ui, sans-serif; }
    .col-sub { font: 600 11px "Manrope", system-ui, sans-serif; fill: #4a5750; }
    .item-title { font: 700 12.5px "Manrope", system-ui, sans-serif; fill: #1f2d27; }
    .item-meta { font: 500 11px "Manrope", system-ui, sans-serif; fill: #55625b; }
    .badge { font: 700 10.5px "Manrope", system-ui, sans-serif; }
    .banner { fill: #f2efe8; stroke: #d4cbbe; stroke-width: 1.2; rx: 8; }
  </style>

  <rect class="bg" x="8" y="8" width="944" height="474" />
  <text class="h1" x="28" y="38">LLM Evaluation Landscape: Pretraining Checkpoints vs. Post-Training &amp; Fine-Tuned Models</text>
  <text class="sub" x="28" y="58">How benchmark tasks, scoring mechanics, and failure modes shift across the language model training lifecycle</text>

  <!-- Stage Headers: Pretraining vs Post-Training -->
  <rect x="24" y="72" width="446" height="28" rx="6" fill="#dfece6" stroke="#285e4a" stroke-width="1.2" />
  <text class="badge" x="247" y="90" text-anchor="middle" fill="#1d4b3a">STAGE 1: PRETRAINING &amp; BASE MODEL EVALUATION (Log-Likelihood &amp; Few-Shot)</text>

  <rect x="490" y="72" width="446" height="28" rx="6" fill="#f9ead8" stroke="#b45309" stroke-width="1.2" />
  <text class="badge" x="713" y="90" text-anchor="middle" fill="#8c3d05">STAGE 2: SFT, RLHF / DPO &amp; REASONING EVALUATION (Generative, Execution &amp; Judges)</text>

  <!-- Column 1: Intrinsic LM & Perplexity -->
  <rect class="panel" x="24" y="108" width="218" height="314" />
  <rect class="hdr-pre1" x="34" y="118" width="198" height="44" />
  <text class="col-title" x="133" y="137" text-anchor="middle" fill="#1d4b3a">1. Intrinsic Perplexity</text>
  <text class="col-sub" x="133" y="153" text-anchor="middle">NLL, Bits-Per-Byte (BPB)</text>

  <rect class="card" x="34" y="172" width="198" height="54" />
  <text class="item-title" x="44" y="191">WikiText-103 &amp; C4 Val</text>
  <text class="item-meta" x="44" y="207">Sliding-window token PPL &amp;</text>
  <text class="item-meta" x="44" y="220">held-out web pretraining loss</text>

  <rect class="card" x="34" y="234" width="198" height="54" />
  <text class="item-title" x="44" y="253">The Pile &amp; Paloma</text>
  <text class="item-meta" x="44" y="269">Stratified multi-domain BPB</text>
  <text class="item-meta" x="44" y="282">(code, arxiv, legal, dialogue)</text>

  <rect class="card" x="34" y="296" width="198" height="54" />
  <text class="item-title" x="44" y="315">LAMBADA &amp; FineWeb-Edu</text>
  <text class="item-meta" x="44" y="331">Long-range discourse final-word</text>
  <text class="item-meta" x="44" y="344">accuracy &amp; educational quality</text>

  <rect x="34" y="360" width="198" height="50" rx="6" fill="#eef6f3" />
  <text class="item-meta" x="44" y="378" font-weight="700" fill="#1d4b3a">Metric: Bits-Per-Byte (BPB)</text>
  <text class="item-meta" x="44" y="393">Tokenizer-agnostic comparison</text>
  <text class="item-meta" x="44" y="405">across vocab sizes V</text>

  <!-- Column 2: Knowledge & Commonsense -->
  <rect class="panel" x="252" y="108" width="218" height="314" />
  <rect class="hdr-pre2" x="262" y="118" width="198" height="44" />
  <text class="col-title" x="361" y="137" text-anchor="middle" fill="#1e496b">2. Knowledge &amp; Sense</text>
  <text class="col-sub" x="361" y="153" text-anchor="middle">Log-Prob Choice &amp; Few-Shot</text>

  <rect class="card" x="262" y="172" width="198" height="54" />
  <text class="item-title" x="272" y="191">MMLU &amp; MMLU-Pro</text>
  <text class="item-meta" x="272" y="207">57 subjects (4-choice) vs</text>
  <text class="item-meta" x="272" y="220">10-choice reasoning upgrade</text>

  <rect class="card" x="262" y="234" width="198" height="54" />
  <text class="item-title" x="272" y="253">ARC-Challenge &amp; TriviaQA</text>
  <text class="item-meta" x="272" y="269">Grade-school science QA &amp;</text>
  <text class="item-meta" x="272" y="282">closed-book factual recall</text>

  <rect class="card" x="262" y="296" width="198" height="54" />
  <text class="item-title" x="272" y="315">HellaSwag, WinoGrande, PIQA</text>
  <text class="item-meta" x="272" y="331">Adversarially filtered physical</text>
  <text class="item-meta" x="272" y="344">&amp; coreference commonsense</text>

  <rect x="262" y="360" width="198" height="50" rx="6" fill="#edf4f9" />
  <text class="item-meta" x="272" y="378" font-weight="700" fill="#1e496b">Metric: Norm Log-Likelihood</text>
  <text class="item-meta" x="272" y="393">Char/token length norm &amp;</text>
  <text class="item-meta" x="272" y="405">PMI calibration</text>

  <!-- Column 3: Math, Science & Code Execution -->
  <rect class="panel" x="490" y="108" width="218" height="314" />
  <rect class="hdr-post1" x="500" y="118" width="198" height="44" />
  <text class="col-title" x="599" y="137" text-anchor="middle" fill="#8c3d05">3. Reasoning &amp; Code</text>
  <text class="col-sub" x="599" y="153" text-anchor="middle">CoT Extraction &amp; Unit Tests</text>

  <rect class="card" x="500" y="172" width="198" height="54" />
  <text class="item-title" x="510" y="191">GSM8K, MATH-500 &amp; AIME</text>
  <text class="item-meta" x="510" y="207">Multi-step symbolic math with</text>
  <text class="item-meta" x="510" y="220">SymPy equivalence verification</text>

  <rect class="card" x="500" y="234" width="198" height="54" />
  <text class="item-title" x="510" y="253">GPQA Diamond</text>
  <text class="item-meta" x="510" y="269">PhD-level "Google-proof" bio,</text>
  <text class="item-meta" x="510" y="282">physics &amp; chemistry problems</text>

  <rect class="card" x="500" y="296" width="198" height="54" />
  <text class="item-title" x="510" y="315">HumanEval+, LiveCode, SWE</text>
  <text class="item-meta" x="510" y="331">Function synthesis, contest code</text>
  <text class="item-meta" x="510" y="344">&amp; repo-level GitHub patches</text>

  <rect x="500" y="360" width="198" height="50" rx="6" fill="#fdf3e6" />
  <text class="item-meta" x="510" y="378" font-weight="700" fill="#8c3d05">Metric: Unbiased pass@k, maj@k</text>
  <text class="item-meta" x="510" y="393">Exact symbolic / sandboxed</text>
  <text class="item-meta" x="510" y="405">unit-test execution</text>

  <!-- Column 4: Alignment, Chat & Diagnostics -->
  <rect class="panel" x="718" y="108" width="218" height="314" />
  <rect class="hdr-post2" x="728" y="118" width="198" height="44" />
  <text class="col-title" x="827" y="137" text-anchor="middle" fill="#562c65">4. Alignment &amp; Audits</text>
  <text class="col-sub" x="827" y="153" text-anchor="middle">Rule Verifiers, Judges &amp; Long-Ctx</text>

  <rect class="card" x="728" y="172" width="198" height="54" />
  <text class="item-title" x="738" y="191">IFEval (Instruction Following)</text>
  <text class="item-meta" x="738" y="207">25 deterministic formatting,</text>
  <text class="item-meta" x="738" y="220">length &amp; keyword constraints</text>

  <rect class="card" x="728" y="234" width="198" height="54" />
  <text class="item-title" x="738" y="253">MT-Bench, AlpacaEval, Arena</text>
  <text class="item-meta" x="738" y="269">Length-controlled LLM judges &amp;</text>
  <text class="item-meta" x="738" y="282">human Bradley-Terry Elo</text>

  <rect class="card" x="728" y="296" width="198" height="54" />
  <text class="item-title" x="738" y="315">TruthfulQA, RULER &amp; Decontam</text>
  <text class="item-meta" x="738" y="331">Hallucination traps, 128K+ ctx</text>
  <text class="item-meta" x="738" y="344">&amp; n-gram contamination audits</text>

  <rect x="728" y="360" width="198" height="50" rx="6" fill="#f7edf8" />
  <text class="item-meta" x="738" y="378" font-weight="700" fill="#562c65">Metric: LC Win-Rate &amp; BT Elo</text>
  <text class="item-meta" x="738" y="393">De-biased preference models</text>
  <text class="item-meta" x="738" y="405">&amp; programmatic constraints</text>

  <!-- Bottom Cross-Cutting Audit Banner -->
  <rect class="banner" x="24" y="432" width="912" height="38" />
  <text class="item-title" x="480" y="455" text-anchor="middle">Cross-Cutting Requirement: Benchmark Decontamination (13-gram / MinHash), Prompt-Template Standardization &amp; Statistical Confidence Intervals</text>
</svg>

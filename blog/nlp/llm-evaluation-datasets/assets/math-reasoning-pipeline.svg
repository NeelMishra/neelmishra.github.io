<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="920" height="430" rx="14" fill="#0f172a"/>
  <text x="460" y="34" text-anchor="middle" fill="#f8fafc" font-size="17" font-weight="700">Mathematical &amp; Scientific Reasoning Evaluation: Decoding, Symbolic Grading &amp; SE Scaling</text>
  <text x="460" y="54" text-anchor="middle" fill="#94a3b8" font-size="12">From Chain-of-Thought sampling (Pass@1 vs. Maj@k) to nested \boxed{} AST equivalence and small-N binomial variance</text>

  <!-- Panel 1: Decoding & Aggregation -->
  <rect x="24" y="74" width="428" height="175" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="40" y="98" fill="#60a5fa" font-size="13" font-weight="700">1. CoT Sampling &amp; Aggregation Modes</text>

  <rect x="40" y="110" width="120" height="122" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="100" y="130" text-anchor="middle" fill="#93c5fd" font-size="11.5" font-weight="700">Prompt x</text>
  <text x="100" y="150" text-anchor="middle" fill="#cbd5e1" font-size="10">GSM8K / MATH /</text>
  <text x="100" y="165" text-anchor="middle" fill="#cbd5e1" font-size="10">AIME / GPQA</text>
  <text x="100" y="192" text-anchor="middle" fill="#64748b" font-size="9.5">Sample k traces</text>
  <text x="100" y="207" text-anchor="middle" fill="#64748b" font-size="9.5">z_i ~ p_θ(z | x)</text>

  <rect x="176" y="110" width="260" height="36" rx="6" fill="#0f172a" stroke="#475569"/>
  <text x="188" y="126" fill="#e2e8f0" font-size="10.5" font-weight="700">Greedy Pass@1 (T = 0, k = 1)</text>
  <text x="188" y="140" fill="#94a3b8" font-size="9.5">Single deterministic trajectory z₁ → â₁</text>

  <rect x="176" y="153" width="260" height="36" rx="6" fill="#0f172a" stroke="#10b981"/>
  <text x="188" y="169" fill="#34d399" font-size="10.5" font-weight="700">Self-Consistency Maj@k (T = 0.7)</text>
  <text x="188" y="183" fill="#94a3b8" font-size="9.5">â_maj = argmax_a Σᵢ 𝕀[Extract(zᵢ) ≡_sym a]</text>

  <rect x="176" y="196" width="260" height="36" rx="6" fill="#0f172a" stroke="#f59e0b"/>
  <text x="188" y="212" fill="#fbbf24" font-size="10.5" font-weight="700">PRM Reranking / Pass@k Oracle</text>
  <text x="188" y="226" fill="#94a3b8" font-size="9.5">â_PRM = argmax_a Σᵢ r_φ(x, zᵢ) · 𝕀[âᵢ ≡_sym a]</text>

  <!-- Panel 2: Symbolic Grading Pipeline -->
  <rect x="468" y="74" width="428" height="175" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="484" y="98" fill="#34d399" font-size="13" font-weight="700">2. Symbolic Answer Extraction &amp; Equivalence</text>

  <rect x="484" y="112" width="396" height="36" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="496" y="128" fill="#f8fafc" font-size="10.5" font-weight="700">Step A: Balanced-Brace \boxed{...} Extraction</text>
  <text x="496" y="142" fill="#94a3b8" font-size="9.5">Stack parser extracts last \boxed{\frac{1+\sqrt{5}}{2}} without regex truncation</text>

  <rect x="484" y="154" width="396" height="36" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="496" y="170" fill="#f8fafc" font-size="10.5" font-weight="700">Step B: LaTeX Canonicalization (Hendrycks / math_verify)</text>
  <text x="496" y="184" fill="#94a3b8" font-size="9.5">\dfrac → \frac, strip \left/\right/units/$, 0.5 ↔ 1/2 ↔ \frac{2}{4}</text>

  <rect x="484" y="196" width="396" height="36" rx="6" fill="#0f172a" stroke="#10b981"/>
  <text x="496" y="212" fill="#34d399" font-size="10.5" font-weight="700">Step C: SymPy Computer Algebra Verification</text>
  <text x="496" y="226" fill="#cbd5e1" font-size="9.5">simplify(parse_latex(â) - parse_latex(a*)) == 0  (handles radicals &amp; polys)</text>

  <!-- Panel 3: Benchmark Progression & Binomial SE -->
  <rect x="24" y="265" width="872" height="145" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
  <text x="40" y="290" fill="#c084fc" font-size="13" font-weight="700">3. Reasoning Benchmark Progression &amp; Binomial Standard Error SE = √(p(1−p)/N) at p = 0.70</text>

  <rect x="40" y="305" width="198" height="90" rx="8" fill="#0f172a" stroke="#475569"/>
  <text x="139" y="325" text-anchor="middle" fill="#60a5fa" font-size="12" font-weight="700">GSM8K (Test)</text>
  <text x="139" y="344" text-anchor="middle" fill="#e2e8f0" font-size="10.5">N = 1,319 grade-school</text>
  <text x="139" y="361" text-anchor="middle" fill="#94a3b8" font-size="10">Format: #### integer</text>
  <text x="139" y="380" text-anchor="middle" fill="#34d399" font-size="10.5" font-weight="700">95% CI: ±2.5% (SE 1.26%)</text>

  <rect x="254" y="305" width="198" height="90" rx="8" fill="#0f172a" stroke="#475569"/>
  <text x="353" y="325" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="700">MATH-500 / Full MATH</text>
  <text x="353" y="344" text-anchor="middle" fill="#e2e8f0" font-size="10.5">N = 500 (or 5,000 full)</text>
  <text x="353" y="361" text-anchor="middle" fill="#94a3b8" font-size="10">Format: \boxed{LaTeX}</text>
  <text x="353" y="380" text-anchor="middle" fill="#34d399" font-size="10.5" font-weight="700">95% CI: ±4.0% (N=500)</text>

  <rect x="468" y="305" width="198" height="90" rx="8" fill="#0f172a" stroke="#475569"/>
  <text x="567" y="325" text-anchor="middle" fill="#c084fc" font-size="12" font-weight="700">GPQA Diamond</text>
  <text x="567" y="344" text-anchor="middle" fill="#e2e8f0" font-size="10.5">N = 198 PhD-level</text>
  <text x="567" y="361" text-anchor="middle" fill="#94a3b8" font-size="10">4-choice Google-proof</text>
  <text x="567" y="380" text-anchor="middle" fill="#fbbf24" font-size="10.5" font-weight="700">95% CI: ±6.4% (SE 3.26%)</text>

  <rect x="682" y="305" width="198" height="90" rx="8" fill="#0f172a" stroke="#ef4444"/>
  <text x="781" y="325" text-anchor="middle" fill="#f87171" font-size="12" font-weight="700">AIME 2024 / 2025</text>
  <text x="781" y="344" text-anchor="middle" fill="#e2e8f0" font-size="10.5">N = 30 Olympiad problems</text>
  <text x="781" y="361" text-anchor="middle" fill="#94a3b8" font-size="10">Exact integer ∈ [000, 999]</text>
  <text x="781" y="380" text-anchor="middle" fill="#f87171" font-size="10.5" font-weight="700">95% CI: ±16.4% (Avg@64 req.)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
  <title id="title">Tokenizer-Agnostic Bits-Per-Byte (BPB) and Strided Sliding-Window Perplexity</title>
  <desc id="desc">Left panel shows how a 32K tokenizer (6 tokens) and a 128K tokenizer (4 tokens) on a 20-byte string yield different token perplexities (4.48 vs 7.39) while Bits-Per-Byte (BPB = 0.5771) remains invariant to vocabulary segmentation. Right panel compares non-overlapping chunk evaluation (boundary tokens starved of context) against strided sliding-window evaluation (stride S=2, window C=4) where prefix tokens are masked and only fully conditioned target tokens are scored.</desc>
  <style>
    .bg { fill: #fbfaf6; stroke: #d7d0c4; stroke-width: 1.5; rx: 14; }
    .panel { fill: #ffffff; stroke: #dcd4c6; stroke-width: 1.25; rx: 10; }
    .h1 { font: 700 17px "Manrope", system-ui, sans-serif; fill: #1d2a24; }
    .h2 { font: 700 14px "Manrope", system-ui, sans-serif; fill: #1f2d27; }
    .sub { font: 500 12px "Manrope", system-ui, sans-serif; fill: #526058; }
    .lbl { font: 600 11.5px "Manrope", system-ui, sans-serif; fill: #2b3932; }
    .code { font: 600 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #1e2d26; }
    .tok-a { fill: #e8f3ee; stroke: #285e4a; stroke-width: 1.2; rx: 5; }
    .tok-b { fill: #edf4f9; stroke: #2b5b84; stroke-width: 1.2; rx: 5; }
    .tok-ctx { fill: #f1efe9; stroke: #9ca39e; stroke-width: 1.1; stroke-dasharray: 3 2; rx: 5; }
    .tok-score { fill: #fdf3e6; stroke: #b45309; stroke-width: 1.3; rx: 5; }
    .tok-bad { fill: #fdeded; stroke: #b91c1c; stroke-width: 1.3; rx: 5; }
    .box-ok { fill: #eef6f3; stroke: #285e4a; stroke-width: 1.2; rx: 8; }
    .box-warn { fill: #fdf4e7; stroke: #b45309; stroke-width: 1.2; rx: 8; }
  </style>

  <rect class="bg" x="8" y="8" width="944" height="444" />
  <text class="h1" x="28" y="36">Intrinsic Pretraining Evaluation: Bits-Per-Byte Invariance &amp; Strided Sliding Windows</text>
  <text class="sub" x="28" y="55">Why token-level perplexity misleads across vocabularies and why non-overlapping chunks inflate boundary loss</text>

  <!-- Left Panel: BPB vs Token PPL -->
  <rect class="panel" x="24" y="70" width="448" height="366" />
  <text class="h2" x="42" y="96">A. Why Token PPL Fails Across Tokenizers (Fixed String)</text>
  <text class="sub" x="42" y="114">Raw text: "quantization_kernels" (N_bytes = 20 UTF-8 bytes)</text>

  <text class="lbl" x="42" y="142" fill="#285e4a">Model A (32K Vocab): 5 tokens, total NLL = 8.00 nats</text>
  <rect class="tok-a" x="42" y="150" width="68" height="34" />
  <text class="code" x="76" y="171" text-anchor="middle">quant</text>
  <rect class="tok-a" x="116" y="150" width="68" height="34" />
  <text class="code" x="150" y="171" text-anchor="middle">ization</text>
  <rect class="tok-a" x="190" y="150" width="42" height="34" />
  <text class="code" x="211" y="171" text-anchor="middle">_</text>
  <rect class="tok-a" x="238" y="150" width="68" height="34" />
  <text class="code" x="272" y="171" text-anchor="middle">kernel</text>
  <rect class="tok-a" x="312" y="150" width="42" height="34" />
  <text class="code" x="333" y="171" text-anchor="middle">s</text>
  <text class="sub" x="366" y="171">N_tok = 5</text>

  <text class="lbl" x="42" y="214" fill="#2b5b84">Model B (128K Vocab): 3 tokens, total NLL = 7.50 nats (Better!)</text>
  <rect class="tok-b" x="42" y="222" width="136" height="34" />
  <text class="code" x="110" y="243" text-anchor="middle">quantization</text>
  <rect class="tok-b" x="184" y="222" width="48" height="34" />
  <text class="code" x="208" y="243" text-anchor="middle">_</text>
  <rect class="tok-b" x="238" y="222" width="116" height="34" />
  <text class="code" x="296" y="243" text-anchor="middle">kernels</text>
  <text class="sub" x="366" y="243">N_tok = 3</text>

  <rect class="box-warn" x="42" y="274" width="412" height="68" />
  <text class="lbl" x="54" y="294" fill="#8c3d05">Paradox of Token Perplexity exp(NLL / N_tok):</text>
  <text class="code" x="54" y="313">Model A: exp(8.00 / 5) = exp(1.60) = 4.95  (Looks lower/better)</text>
  <text class="code" x="54" y="331">Model B: exp(7.50 / 3) = exp(2.50) = 12.18 (Looks 2.5x worse!)</text>

  <rect class="box-ok" x="42" y="352" width="412" height="68" />
  <text class="lbl" x="54" y="372" fill="#1d4b3a">Resolution via Bits-Per-Byte: BPB = NLL / (N_bytes * ln 2):</text>
  <text class="code" x="54" y="391">Model A BPB: 8.00 / (20 * 0.6931) = 0.5771 bits/byte</text>
  <text class="code" x="54" y="409">Model B BPB: 7.50 / (20 * 0.6931) = 0.5410 bits/byte (True winner)</text>

  <!-- Right Panel: Sliding Window Perplexity -->
  <rect class="panel" x="488" y="70" width="448" height="366" />
  <text class="h2" x="506" y="96">B. Strided Sliding Window vs. Disjoint Chunks</text>
  <text class="sub" x="506" y="114">Context window C = 4 tokens, document length T = 8 tokens</text>

  <text class="lbl" x="506" y="142" fill="#b91c1c">1. Disjoint Chunks (Stride S = C = 4): Boundary Context Starvation</text>
  <rect class="tok-score" x="506" y="150" width="44" height="30" /><text class="code" x="528" y="169" text-anchor="middle">t1</text>
  <rect class="tok-score" x="554" y="150" width="44" height="30" /><text class="code" x="576" y="169" text-anchor="middle">t2</text>
  <rect class="tok-score" x="602" y="150" width="44" height="30" /><text class="code" x="624" y="169" text-anchor="middle">t3</text>
  <rect class="tok-score" x="650" y="150" width="44" height="30" /><text class="code" x="672" y="169" text-anchor="middle">t4</text>

  <rect class="tok-bad" x="716" y="150" width="44" height="30" /><text class="code" x="738" y="169" text-anchor="middle">t5!</text>
  <rect class="tok-score" x="764" y="150" width="44" height="30" /><text class="code" x="786" y="169" text-anchor="middle">t6</text>
  <rect class="tok-score" x="812" y="150" width="44" height="30" /><text class="code" x="834" y="169" text-anchor="middle">t7</text>
  <rect class="tok-score" x="860" y="150" width="44" height="30" /><text class="code" x="882" y="169" text-anchor="middle">t8</text>
  <text class="sub" x="506" y="196">Token t5 is scored with 0 prior tokens P(t5) instead of P(t5 | t2,t3,t4)!</text>

  <text class="lbl" x="506" y="224" fill="#1d4b3a">2. Strided Sliding Window (Window C = 4, Stride S = 2)</text>
  <!-- Window 1 -->
  <text class="sub" x="506" y="244">Window 1 [t1..t4]: score all 4</text>
  <rect class="tok-score" x="690" y="228" width="42" height="24" /><text class="code" x="711" y="244" text-anchor="middle">t1</text>
  <rect class="tok-score" x="736" y="228" width="42" height="24" /><text class="code" x="757" y="244" text-anchor="middle">t2</text>
  <rect class="tok-score" x="782" y="228" width="42" height="24" /><text class="code" x="803" y="244" text-anchor="middle">t3</text>
  <rect class="tok-score" x="828" y="228" width="42" height="24" /><text class="code" x="849" y="244" text-anchor="middle">t4</text>

  <!-- Window 2 -->
  <text class="sub" x="506" y="276">Window 2 [t3..t6]: mask t3,t4</text>
  <rect class="tok-ctx" x="690" y="260" width="42" height="24" /><text class="code" x="711" y="276" text-anchor="middle">t3</text>
  <rect class="tok-ctx" x="736" y="260" width="42" height="24" /><text class="code" x="757" y="276" text-anchor="middle">t4</text>
  <rect class="tok-score" x="782" y="260" width="42" height="24" /><text class="code" x="803" y="276" text-anchor="middle">t5</text>
  <rect class="tok-score" x="828" y="260" width="42" height="24" /><text class="code" x="849" y="276" text-anchor="middle">t6</text>

  <!-- Window 3 -->
  <text class="sub" x="506" y="308">Window 3 [t5..t8]: mask t5,t6</text>
  <rect class="tok-ctx" x="690" y="292" width="42" height="24" /><text class="code" x="711" y="308" text-anchor="middle">t5</text>
  <rect class="tok-ctx" x="736" y="292" width="42" height="24" /><text class="code" x="757" y="308" text-anchor="middle">t6</text>
  <rect class="tok-score" x="782" y="292" width="42" height="24" /><text class="code" x="803" y="308" text-anchor="middle">t7</text>
  <rect class="tok-score" x="828" y="292" width="42" height="24" /><text class="code" x="849" y="308" text-anchor="middle">t8</text>

  <!-- Legend / Summary -->
  <rect class="box-ok" x="506" y="330" width="412" height="90" />
  <text class="lbl" x="518" y="350" fill="#1d4b3a">Strided Evaluation Guarantee:</text>
  <text class="sub" x="518" y="368">• Dashed gray cells (labels = -100) supply KV-cache context only.</text>
  <text class="sub" x="518" y="386">• Amber cells are scored once, each with at least (C - S) prior tokens.</text>
  <text class="sub" x="518" y="404">• At S = 512, C = 4096, every token sees &gt;= 3,584 tokens of history.</text>
</svg>

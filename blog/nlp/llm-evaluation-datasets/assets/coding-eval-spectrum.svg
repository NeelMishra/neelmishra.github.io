<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="920" height="430" rx="14" fill="#0f172a"/>
  <text x="460" y="34" text-anchor="middle" fill="#f8fafc" font-size="17" font-weight="700">Code Generation &amp; Software Engineering Evaluation Spectrum</text>
  <text x="460" y="54" text-anchor="middle" fill="#94a3b8" font-size="12">From single-function pass@k (HumanEval+ / MBPP+) to contamination-free LiveCodeBench and Dockerized SWE-bench F2P/P2P</text>

  <!-- Panel 1: Function-Level & EvalPlus -->
  <rect x="24" y="74" width="280" height="175" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="40" y="98" fill="#60a5fa" font-size="13" font-weight="700">1. Function Synthesis &amp; EvalPlus</text>

  <rect x="40" y="112" width="248" height="54" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="52" y="130" fill="#f8fafc" font-size="11" font-weight="700">HumanEval (164) &amp; MBPP (378)</text>
  <text x="52" y="146" fill="#94a3b8" font-size="9.5">Signature + Docstring → Python body</text>
  <text x="52" y="159" fill="#f87171" font-size="9.5">Weak base tests: ~7.7 (HE) / 3 (MBPP)</text>

  <rect x="40" y="176" width="248" height="58" rx="6" fill="#0f172a" stroke="#10b981"/>
  <text x="52" y="194" fill="#34d399" font-size="11" font-weight="700">EvalPlus: HumanEval+ / MBPP+</text>
  <text x="52" y="210" fill="#cbd5e1" font-size="9.5">LLM seed + type-aware mutation inputs</text>
  <text x="52" y="224" fill="#fbbf24" font-size="9.5">80× test expansion → −10% to −18% pass@1</text>

  <!-- Panel 2: Unbiased pass@k Estimator -->
  <rect x="320" y="74" width="280" height="175" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="336" y="98" fill="#34d399" font-size="13" font-weight="700">2. Unbiased pass@k Estimator</text>

  <rect x="336" y="112" width="248" height="54" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="348" y="130" fill="#f8fafc" font-size="10.5" font-weight="700">Sample n ≥ k completions, c pass</text>
  <text x="348" y="147" fill="#60a5fa" font-size="10.5" font-weight="700">pass@k = 1 − C(n − c, k) / C(n, k)</text>
  <text x="348" y="160" fill="#94a3b8" font-size="9.5">Exact hypergeometric unbiased estimator</text>

  <rect x="336" y="176" width="248" height="58" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="348" y="194" fill="#e2e8f0" font-size="10.5" font-weight="700">LiveCodeBench Temporal Firewall</text>
  <text x="348" y="210" fill="#94a3b8" font-size="9.5">LeetCode / AtCoder / CodeForces</text>
  <text x="348" y="224" fill="#38bdf8" font-size="9.5">Filter by problem_date &gt; model_cutoff</text>

  <!-- Panel 3: SWE-bench Docker Verification -->
  <rect x="616" y="74" width="280" height="175" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="632" y="98" fill="#fbbf24" font-size="13" font-weight="700">3. SWE-bench Verified (N=500)</text>

  <rect x="632" y="112" width="248" height="54" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="644" y="130" fill="#f8fafc" font-size="10.5" font-weight="700">Repo @ base_commit + Issue Text</text>
  <text x="644" y="146" fill="#94a3b8" font-size="9.5">Agent edits multi-file codebase →</text>
  <text x="644" y="159" fill="#94a3b8" font-size="9.5">emits unified git diff (model_patch)</text>

  <rect x="632" y="176" width="248" height="58" rx="6" fill="#0f172a" stroke="#f59e0b"/>
  <text x="644" y="194" fill="#fbbf24" font-size="10.5" font-weight="700">Hidden Held-Out test_patch.diff</text>
  <text x="644" y="210" fill="#34d399" font-size="9.5">✓ FAIL_TO_PASS (F2P): Bug fixed</text>
  <text x="644" y="224" fill="#60a5fa" font-size="9.5">✓ PASS_TO_PASS (P2P): Zero regressions</text>

  <!-- Bottom Flow: SWE-bench Execution Matrix -->
  <rect x="24" y="265" width="872" height="145" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <text x="40" y="290" fill="#f8fafc" font-size="13" font-weight="700">4. SWE-bench Two-State Test Verification Matrix Inside Isolated Docker Container</text>

  <rect x="40" y="305" width="200" height="88" rx="8" fill="#0f172a" stroke="#475569"/>
  <text x="140" y="326" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="700">Step 1: Checkout Base</text>
  <text x="140" y="345" text-anchor="middle" fill="#cbd5e1" font-size="9.5">git checkout base_commit</text>
  <text x="140" y="362" text-anchor="middle" fill="#f87171" font-size="9.5">F2P tests: FAIL (reproduces bug)</text>
  <text x="140" y="378" text-anchor="middle" fill="#34d399" font-size="9.5">P2P tests: PASS (baseline suite)</text>

  <rect x="256" y="305" width="200" height="88" rx="8" fill="#0f172a" stroke="#475569"/>
  <text x="356" y="326" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="700">Step 2: Apply Patches</text>
  <text x="356" y="345" text-anchor="middle" fill="#cbd5e1" font-size="9.5">git apply model_patch.diff</text>
  <text x="356" y="362" text-anchor="middle" fill="#cbd5e1" font-size="9.5">git apply test_patch.diff</text>
  <text x="356" y="378" text-anchor="middle" fill="#94a3b8" font-size="9.5">(Clean test state, no leakage)</text>

  <rect x="472" y="305" width="200" height="88" rx="8" fill="#0f172a" stroke="#475569"/>
  <text x="572" y="326" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="700">Step 3: pytest / Django Run</text>
  <text x="572" y="345" text-anchor="middle" fill="#cbd5e1" font-size="9.5">Run in conda/docker env</text>
  <text x="572" y="362" text-anchor="middle" fill="#cbd5e1" font-size="9.5">Parse test status logs per test ID</text>
  <text x="572" y="378" text-anchor="middle" fill="#94a3b8" font-size="9.5">Enforce per-test timeout</text>

  <rect x="688" y="305" width="192" height="88" rx="8" fill="#0f172a" stroke="#10b981"/>
  <text x="784" y="326" text-anchor="middle" fill="#34d399" font-size="11" font-weight="700">Step 4: Resolution Criterion</text>
  <text x="784" y="345" text-anchor="middle" fill="#e2e8f0" font-size="10">Resolved = 1 iff</text>
  <text x="784" y="362" text-anchor="middle" fill="#34d399" font-size="9.5">∀ t ∈ F2P: status(t) == PASS</text>
  <text x="784" y="378" text-anchor="middle" fill="#60a5fa" font-size="9.5">∀ t ∈ P2P: status(t) == PASS</text>
</svg>

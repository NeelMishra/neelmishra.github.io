<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="920" height="430" rx="14" fill="#0f172a"/>
  <text x="460" y="34" text-anchor="middle" fill="#f8fafc" font-size="17" font-weight="700">Instruction Following, LLM-as-a-Judge &amp; Alignment Evaluation Pipelines</text>
  <text x="460" y="54" text-anchor="middle" fill="#94a3b8" font-size="12">Programmatic constraint verification (IFEval), Length-Controlled GLM de-biasing (AlpacaEval 2.0), and Bradley-Terry MLE (Arena)</text>

  <!-- Panel 1: IFEval -->
  <rect x="24" y="74" width="280" height="334" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="40" y="98" fill="#60a5fa" font-size="13" font-weight="700">1. IFEval Programmatic Verifiers</text>
  <text x="40" y="116" fill="#94a3b8" font-size="10">541 prompts × 25 rule-verifiable constraints</text>

  <rect x="40" y="130" width="248" height="72" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="52" y="148" fill="#f8fafc" font-size="10.5" font-weight="700">Deterministic Rule Checkers f_c(y)</text>
  <text x="52" y="165" fill="#cbd5e1" font-size="9.5">• punctuation:no_comma ("," not in y)</text>
  <text x="52" y="180" fill="#cbd5e1" font-size="9.5">• length:number_words (≥ 300 words)</text>
  <text x="52" y="195" fill="#cbd5e1" font-size="9.5">• detectable_format:json_format</text>

  <rect x="40" y="214" width="248" height="84" rx="6" fill="#0f172a" stroke="#475569"/>
  <text x="52" y="232" fill="#38bdf8" font-size="10.5" font-weight="700">8-Variant Loose Transform Lattice</text>
  <text x="52" y="249" fill="#94a3b8" font-size="9.5">2³ combinations of 3 cleanups:</text>
  <text x="52" y="264" fill="#cbd5e1" font-size="9.5">1. Strip markdown * and **</text>
  <text x="52" y="279" fill="#cbd5e1" font-size="9.5">2. Remove 1st intro line ("Sure!...")</text>
  <text x="52" y="292" fill="#cbd5e1" font-size="9.5">3. Remove last sign-off line</text>

  <rect x="40" y="310" width="248" height="82" rx="6" fill="#0f172a" stroke="#3b82f6"/>
  <text x="52" y="328" fill="#93c5fd" font-size="10.5" font-weight="700">4 Reported Accuracy Metrics</text>
  <text x="52" y="345" fill="#e2e8f0" font-size="9.5">• Prompt-Strict: Π_{c ∈ C_i} f_c(y_i) = 1</text>
  <text x="52" y="360" fill="#e2e8f0" font-size="9.5">• Inst-Strict: mean over all c ∈ C_i</text>
  <text x="52" y="375" fill="#34d399" font-size="9.5">• Prompt-Loose &amp; Inst-Loose (max_t)</text>

  <!-- Panel 2: AlpacaEval 2.0 & MT-Bench -->
  <rect x="320" y="74" width="280" height="334" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="336" y="98" fill="#34d399" font-size="13" font-weight="700">2. LLM-as-a-Judge &amp; LC-WinRate</text>
  <text x="336" y="116" fill="#94a3b8" font-size="10">MT-Bench (80×2 turns) &amp; AlpacaEval 2.0 (805)</text>

  <rect x="336" y="130" width="248" height="72" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="348" y="148" fill="#f8fafc" font-size="10.5" font-weight="700">Judge Bias Mitigation</text>
  <text x="348" y="165" fill="#cbd5e1" font-size="9.5">• Position swap: ½[J(y_m,y_b)+1−J(y_b,y_m)]</text>
  <text x="348" y="180" fill="#cbd5e1" font-size="9.5">• Reference-guided math/code grading</text>
  <text x="348" y="195" fill="#f87171" font-size="9.5">• Remaining flaw: Verbosity bias!</text>

  <rect x="336" y="214" width="248" height="84" rx="6" fill="#0f172a" stroke="#10b981"/>
  <text x="348" y="232" fill="#34d399" font-size="10.5" font-weight="700">AlpacaEval 2.0 Logistic GLM</text>
  <text x="348" y="250" fill="#e2e8f0" font-size="9.5">P(y_m &gt; y_b | x_i) = σ(θ_m − θ_b</text>
  <text x="348" y="266" fill="#fbbf24" font-size="9.5">  + φ · tanh((L_m − L_b) / σ_L) + ψ_i)</text>
  <text x="348" y="284" fill="#94a3b8" font-size="9.5">Decouples quality θ_m from length ΔL</text>

  <rect x="336" y="310" width="248" height="82" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="348" y="328" fill="#34d399" font-size="10.5" font-weight="700">Counterfactual ΔL = 0 Projection</text>
  <text x="348" y="346" fill="#e2e8f0" font-size="9.5">LC-WinRate = (100/N) Σᵢ σ(θ̂_m − θ̂_b + ψ̂ᵢ)</text>
  <text x="348" y="363" fill="#94a3b8" font-size="9.5">Predicts win rate if y_m had exact</text>
  <text x="348" y="378" fill="#94a3b8" font-size="9.5">same length as baseline y_b (ρ = 0.98)</text>

  <!-- Panel 3: LMSYS Chatbot Arena -->
  <rect x="616" y="74" width="280" height="334" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="632" y="98" fill="#fbbf24" font-size="13" font-weight="700">3. Chatbot Arena Bradley-Terry</text>
  <text x="632" y="116" fill="#94a3b8" font-size="10">Blind human A/B battles &amp; Style Control</text>

  <rect x="632" y="130" width="248" height="72" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="644" y="148" fill="#f8fafc" font-size="10.5" font-weight="700">Why Not Sequential Online Elo?</text>
  <text x="644" y="165" fill="#f87171" font-size="9.5">• Sensitive to battle arrival order</text>
  <text x="644" y="180" fill="#34d399" font-size="9.5">• BT-MLE solves global convex</text>
  <text x="644" y="195" fill="#34d399" font-size="9.5">  cross-entropy over all battles</text>

  <rect x="632" y="214" width="248" height="84" rx="6" fill="#0f172a" stroke="#f59e0b"/>
  <text x="644" y="232" fill="#fbbf24" font-size="10.5" font-weight="700">Bradley-Terry + Style Control</text>
  <text x="644" y="250" fill="#e2e8f0" font-size="9.5">logit P(i &gt; j) = βᵢ − βⱼ + γᵀ(sᵢ − sⱼ)</text>
  <text x="644" y="268" fill="#94a3b8" font-size="9.5">s = [Δlen, Δheaders, Δbold, Δlists]</text>
  <text x="644" y="284" fill="#cbd5e1" font-size="9.5">Rᵢ = 1000 + (400 / ln 10) · β̂ᵢ</text>

  <rect x="632" y="310" width="248" height="82" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="644" y="328" fill="#60a5fa" font-size="10.5" font-weight="700">Bootstrap Confidence Intervals</text>
  <text x="644" y="345" fill="#cbd5e1" font-size="9.5">Resample B = 1,000 battle tables</text>
  <text x="644" y="361" fill="#cbd5e1" font-size="9.5">Re-fit BT-MLE per bootstrap sample</text>
  <text x="644" y="376" fill="#94a3b8" font-size="9.5">Report [2.5%, 97.5%] rating quantiles</text>
</svg>

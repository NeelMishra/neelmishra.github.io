<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300">
  <rect width="760" height="300" fill="#ffffff" />
  <style>
    .title { font-family: 'Manrope', 'Inter', -apple-system, sans-serif; font-size: 14.5px; font-weight: 800; fill: #0f172a; }
    .card-title { font-family: 'Manrope', 'Inter', sans-serif; font-size: 11.5px; font-weight: 800; }
    .sub { font-family: 'Manrope', 'Inter', sans-serif; font-size: 10.5px; font-weight: 500; fill: #475569; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10.5px; fill: #1e293b; }
    .mono-bold { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10.5px; font-weight: 700; }
    .card { rx: 10; ry: 10; stroke-width: 1.5; }
  </style>

  <text x="380" y="24" text-anchor="middle" class="title">Evolution of EAGLE: Token-Conditioned Features (v1), Dynamic Trees (v2) &amp; Multi-Layer TTT (v3)</text>

  <!-- Card 1: EAGLE-1 Token-Conditioned Feature Autoregression -->
  <g transform="translate(18, 42)">
    <rect width="232" height="242" class="card" fill="#f8fafc" stroke="#cbd5e1" />
    <rect width="232" height="32" rx="10" ry="10" fill="#e2e8f0" />
    <text x="116" y="20" text-anchor="middle" class="card-title" fill="#0f172a">1. EAGLE-1 (ICML 2024)</text>

    <text x="14" y="50" class="sub">Resolves sampling bifurcation by</text>
    <text x="14" y="65" class="sub">fusing f_t with shifted token e_{t+1}:</text>

    <rect x="14" y="78" width="204" height="50" rx="6" fill="#ffffff" stroke="#94a3b8" />
    <text x="22" y="95" class="mono-bold" fill="#0f172a">Shifted Feature-Token Input</text>
    <text x="22" y="111" class="mono">z_t = FC([f_t ; Emb(x_{t+1})])</text>
    <text x="22" y="123" class="mono">f_hat_{t+1} = DraftTRM(z_{\le t})</text>

    <rect x="14" y="136" width="204" height="54" rx="6" fill="#ffffff" stroke="#94a3b8" />
    <text x="22" y="153" class="mono-bold" fill="#0f172a">Dual Regression + KL Loss</text>
    <text x="22" y="169" class="mono">L = SmoothL1(f_{t+1}, f_hat_{t+1})</text>
    <text x="22" y="182" class="mono">    + w_cls * CE(p_{t+2}, q_{t+2})</text>

    <rect x="14" y="200" width="204" height="30" rx="6" fill="#e2e8f0" stroke="#94a3b8" />
    <text x="116" y="219" text-anchor="middle" class="mono-bold" fill="#0f172a">Reuses Frozen Target LM Head</text>
  </g>

  <!-- Card 2: EAGLE-2 Context-Aware Dynamic Draft Tree -->
  <g transform="translate(264, 42)">
    <rect width="232" height="242" class="card" fill="#f0fdf4" stroke="#86efac" />
    <rect width="232" height="32" rx="10" ry="10" fill="#dcfce7" />
    <text x="116" y="20" text-anchor="middle" class="card-title" fill="#14532d">2. EAGLE-2 (EMNLP 2024)</text>

    <text x="14" y="50" class="sub">Draft confidence q_hat(x) is well-</text>
    <text x="14" y="65" class="sub">calibrated to target acceptance α:</text>

    <rect x="14" y="78" width="204" height="50" rx="6" fill="#ffffff" stroke="#4ade80" />
    <text x="22" y="95" class="mono-bold" fill="#166534">Global Path Confidence Score</text>
    <text x="22" y="111" class="mono">V(u_m) = Π_{v in Path(u_m)} q_hat(v)</text>
    <text x="22" y="123" class="sub">Ranks nodes by joint path prob</text>

    <rect x="14" y="136" width="204" height="54" rx="6" fill="#ffffff" stroke="#16a34a" />
    <text x="22" y="153" class="mono-bold" fill="#166534">Expand + Rerank Top-M Pruning</text>
    <text x="22" y="169" class="sub">Deep narrow tree on easy tokens;</text>
    <text x="22" y="182" class="sub">wide shallow tree on hard tokens.</text>

    <rect x="14" y="200" width="204" height="30" rx="6" fill="#dcfce7" stroke="#22c55e" />
    <text x="116" y="219" text-anchor="middle" class="mono-bold" fill="#14532d">+20-40% Faster vs. Static Tree</text>
  </g>

  <!-- Card 3: EAGLE-3 Multi-Layer Feature Fusion & TTT -->
  <g transform="translate(510, 42)">
    <rect width="232" height="242" class="card" fill="#eff6ff" stroke="#93c5fd" />
    <rect width="232" height="32" rx="10" ry="10" fill="#dbeafe" />
    <text x="116" y="20" text-anchor="middle" class="card-title" fill="#1e3a8a">3. EAGLE-3 (2025)</text>

    <text x="14" y="50" class="sub">Drops SmoothL1 feature regression;</text>
    <text x="14" y="65" class="sub">fuses low/mid/high target layers:</text>

    <rect x="14" y="78" width="204" height="50" rx="6" fill="#ffffff" stroke="#60a5fa" />
    <text x="22" y="95" class="mono-bold" fill="#1d4ed8">Multi-Layer Feature Fusion</text>
    <text x="22" y="111" class="mono">g_t = W_fuse [h_t^(low); h_t^(mid);</text>
    <text x="22" y="123" class="mono">              h_t^(high)]  (3d -&gt; d)</text>

    <rect x="14" y="136" width="204" height="54" rx="6" fill="#ffffff" stroke="#60a5fa" />
    <text x="22" y="153" class="mono-bold" fill="#1d4ed8">Training-Time Test (TTT)</text>
    <text x="22" y="169" class="sub">Unrolls multi-step self-generated</text>
    <text x="22" y="182" class="sub">features during training (scales data)</text>

    <rect x="14" y="200" width="204" height="30" rx="6" fill="#dbeafe" stroke="#3b82f6" />
    <text x="116" y="219" text-anchor="middle" class="mono-bold" fill="#1e3a8a">Up to 1.4x Over EAGLE-2</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300">
  <rect width="760" height="300" fill="#ffffff" />
  <style>
    .title { font-family: 'Manrope', 'Inter', -apple-system, sans-serif; font-size: 14.5px; font-weight: 800; fill: #0f172a; }
    .card-title { font-family: 'Manrope', 'Inter', sans-serif; font-size: 11.5px; font-weight: 800; }
    .sub { font-family: 'Manrope', 'Inter', sans-serif; font-size: 10.5px; font-weight: 500; fill: #475569; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10.5px; fill: #1e293b; }
    .mono-bold { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10.5px; font-weight: 700; }
    .card { rx: 10; ry: 10; stroke-width: 1.5; }
  </style>

  <text x="380" y="24" text-anchor="middle" class="title">Model-Free Speculation: Jacobi Fixed-Point Iteration, Lookahead 2D Window &amp; Prompt Lookup</text>

  <!-- Card 1: Jacobi Fixed-Point Iteration -->
  <g transform="translate(18, 42)">
    <rect width="232" height="242" class="card" fill="#f8fafc" stroke="#cbd5e1" />
    <rect width="232" height="32" rx="10" ry="10" fill="#e2e8f0" />
    <text x="116" y="20" text-anchor="middle" class="card-title" fill="#0f172a">1. Jacobi Fixed-Point System</text>

    <text x="14" y="50" class="sub">Greedy decoding of W tokens as a</text>
    <text x="14" y="65" class="sub">triangular nonlinear system:</text>

    <rect x="14" y="78" width="204" height="50" rx="6" fill="#ffffff" stroke="#94a3b8" />
    <text x="22" y="95" class="mono-bold" fill="#0f172a">Parallel Jacobi Update</text>
    <text x="22" y="111" class="mono">y_i^(k+1) = argmax P(y | x,</text>
    <text x="22" y="123" class="mono">            y_1^(k), ..., y_{i-1}^(k))</text>

    <rect x="14" y="136" width="204" height="54" rx="6" fill="#ffffff" stroke="#94a3b8" />
    <text x="22" y="153" class="mono-bold" fill="#0f172a">Convergence Property</text>
    <text x="22" y="169" class="sub">Converges in at most W steps;</text>
    <text x="22" y="182" class="sub">off-diagonal trajectories = N-grams!</text>

    <rect x="14" y="200" width="204" height="30" rx="6" fill="#e2e8f0" stroke="#94a3b8" />
    <text x="116" y="219" text-anchor="middle" class="mono-bold" fill="#0f172a">0 Extra Weights | Exact Greedy</text>
  </g>

  <!-- Card 2: Lookahead Decoding (2D Window + N-gram Pool) -->
  <g transform="translate(264, 42)">
    <rect width="232" height="242" class="card" fill="#f0fdf4" stroke="#86efac" />
    <rect width="232" height="32" rx="10" ry="10" fill="#dcfce7" />
    <text x="116" y="20" text-anchor="middle" class="card-title" fill="#14532d">2. Lookahead Decoding</text>

    <text x="14" y="50" class="sub">Fuses two branches in 1 pass</text>
    <text x="14" y="65" class="sub">via 2D staircase attention mask:</text>

    <rect x="14" y="78" width="204" height="50" rx="6" fill="#ffffff" stroke="#4ade80" />
    <text x="22" y="95" class="mono-bold" fill="#166534">Lookahead Branch: W × (N-1)</text>
    <text x="22" y="111" class="sub">Advances Jacobi grid to harvest</text>
    <text x="22" y="123" class="mono">W new N-grams into Pool[first_tok]</text>

    <rect x="14" y="136" width="204" height="54" rx="6" fill="#ffffff" stroke="#16a34a" />
    <text x="22" y="153" class="mono-bold" fill="#166534">Verification Branch: G × (N-1)</text>
    <text x="22" y="169" class="sub">Matches Pool[last_tok] and verifies</text>
    <text x="22" y="182" class="sub">up to G cached N-grams in parallel</text>

    <rect x="14" y="200" width="204" height="30" rx="6" fill="#dcfce7" stroke="#22c55e" />
    <text x="116" y="219" text-anchor="middle" class="mono-bold" fill="#14532d">1.5x - 2.3x Speedup (Zero Train)</text>
  </g>

  <!-- Card 3: Prompt Lookup Decoding (PLD) & REST -->
  <g transform="translate(510, 42)">
    <rect width="232" height="242" class="card" fill="#eff6ff" stroke="#93c5fd" />
    <rect width="232" height="32" rx="10" ry="10" fill="#dbeafe" />
    <text x="116" y="20" text-anchor="middle" class="card-title" fill="#1e3a8a">3. Prompt Lookup (PLD / REST)</text>

    <text x="14" y="50" class="sub">Extracts candidate continuations</text>
    <text x="14" y="65" class="sub">directly from prompt or datastore:</text>

    <rect x="14" y="78" width="204" height="50" rx="6" fill="#ffffff" stroke="#60a5fa" />
    <text x="22" y="95" class="mono-bold" fill="#1d4ed8">Prompt N-Gram Matching</text>
    <text x="22" y="111" class="mono">Match suffix x_{t-n+1:t} in prompt</text>
    <text x="22" y="123" class="mono">-&gt; propose following γ tokens</text>

    <rect x="14" y="136" width="204" height="54" rx="6" fill="#ffffff" stroke="#60a5fa" />
    <text x="22" y="153" class="mono-bold" fill="#1d4ed8">Ideal Workloads</text>
    <text x="22" y="169" class="sub">RAG grounded QA, summarization,</text>
    <text x="22" y="182" class="sub">and code file refactoring (2x-4x)</text>

    <rect x="14" y="200" width="204" height="30" rx="6" fill="#dbeafe" stroke="#3b82f6" />
    <text x="116" y="219" text-anchor="middle" class="mono-bold" fill="#1e3a8a">O(1) CPU Draft | 0 GPU Memory</text>
  </g>
</svg>

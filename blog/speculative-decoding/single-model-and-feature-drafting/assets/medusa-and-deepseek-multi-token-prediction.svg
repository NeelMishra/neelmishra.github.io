<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300">
  <rect width="760" height="300" fill="#ffffff" />
  <style>
    .title { font-family: 'Manrope', 'Inter', -apple-system, sans-serif; font-size: 14.5px; font-weight: 800; fill: #0f172a; }
    .card-title { font-family: 'Manrope', 'Inter', sans-serif; font-size: 11.5px; font-weight: 800; }
    .sub { font-family: 'Manrope', 'Inter', sans-serif; font-size: 10.5px; font-weight: 500; fill: #475569; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10.5px; fill: #1e293b; }
    .mono-bold { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10.5px; font-weight: 700; }
    .card { rx: 10; ry: 10; stroke-width: 1.5; }
  </style>

  <text x="380" y="24" text-anchor="middle" class="title">Medusa Parallel Heads vs. Medusa-2 Self-Distillation &amp; DeepSeek Chained MTP Modules</text>

  <!-- Card 1: Medusa Parallel MLP Heads -->
  <g transform="translate(18, 42)">
    <rect width="232" height="242" class="card" fill="#f8fafc" stroke="#cbd5e1" />
    <rect width="232" height="32" rx="10" ry="10" fill="#e2e8f0" />
    <text x="116" y="20" text-anchor="middle" class="card-title" fill="#0f172a">1. Medusa Parallel Heads</text>

    <text x="14" y="50" class="sub">K independent SiLU residual heads</text>
    <text x="14" y="65" class="sub">branch off top hidden state h_t:</text>

    <rect x="14" y="78" width="204" height="50" rx="6" fill="#ffffff" stroke="#94a3b8" />
    <text x="22" y="95" class="mono-bold" fill="#0f172a">Head k Architecture</text>
    <text x="22" y="111" class="mono">z_t^(k) = W_2^(k) * (h_t</text>
    <text x="22" y="123" class="mono">          + SiLU(W_1^(k) h_t))</text>

    <rect x="14" y="136" width="204" height="54" rx="6" fill="#fef2f2" stroke="#fca5a5" />
    <text x="22" y="153" class="mono-bold" fill="#991b1b">Independence Bottleneck</text>
    <text x="22" y="169" class="sub">Head 2 predicts x_{t+3} without</text>
    <text x="22" y="182" class="sub">knowing which x_{t+2} Head 1 picked!</text>

    <rect x="14" y="200" width="204" height="30" rx="6" fill="#e2e8f0" stroke="#94a3b8" />
    <text x="116" y="219" text-anchor="middle" class="mono-bold" fill="#0f172a">Needs Cartesian Candidate Tree</text>
  </g>

  <!-- Card 2: Medusa-2 Self-Distillation & Typical Acceptance -->
  <g transform="translate(264, 42)">
    <rect width="232" height="242" class="card" fill="#f0fdf4" stroke="#86efac" />
    <rect width="232" height="32" rx="10" ry="10" fill="#dcfce7" />
    <text x="116" y="20" text-anchor="middle" class="card-title" fill="#14532d">2. Medusa-2 Training &amp; Verify</text>

    <text x="14" y="50" class="sub">Joint backbone + head training</text>
    <text x="14" y="65" class="sub">with self-distillation KL target:</text>

    <rect x="14" y="78" width="204" height="50" rx="6" fill="#ffffff" stroke="#4ade80" />
    <text x="22" y="95" class="mono-bold" fill="#166534">Self-Distillation Loss</text>
    <text x="22" y="111" class="mono">L = L_LM + Σ_k λ^k * (α L_CE^(k)</text>
    <text x="22" y="123" class="mono">    + (1-α) KL(p_orig || p^(k)))</text>

    <rect x="14" y="136" width="204" height="54" rx="6" fill="#ffffff" stroke="#16a34a" />
    <text x="22" y="153" class="mono-bold" fill="#166534">Typical Acceptance Rule</text>
    <text x="22" y="169" class="mono">p(x) &gt;= min(ε, δ * exp(-H(p)))</text>
    <text x="22" y="182" class="sub">Adapts threshold to entropy H(p)</text>

    <rect x="14" y="200" width="204" height="30" rx="6" fill="#dcfce7" stroke="#22c55e" />
    <text x="116" y="219" text-anchor="middle" class="mono-bold" fill="#14532d">2.3x - 3.6x Speedup (Vicuna)</text>
  </g>

  <!-- Card 3: DeepSeek-V3 / R1 Chained MTP -->
  <g transform="translate(510, 42)">
    <rect width="232" height="242" class="card" fill="#eff6ff" stroke="#93c5fd" />
    <rect width="232" height="32" rx="10" ry="10" fill="#dbeafe" />
    <text x="116" y="20" text-anchor="middle" class="card-title" fill="#1e3a8a">3. DeepSeek Chained MTP</text>

    <text x="14" y="50" class="sub">Conditions depth k on both h_t^(k-1)</text>
    <text x="14" y="65" class="sub">and sampled token Emb(x_{t+k}):</text>

    <rect x="14" y="78" width="204" height="50" rx="6" fill="#ffffff" stroke="#60a5fa" />
    <text x="22" y="95" class="mono-bold" fill="#1d4ed8">Causal Fusion Projection M_k</text>
    <text x="22" y="111" class="mono">h'_t^(k) = M_k [RMSNorm(h_t^(k-1))</text>
    <text x="22" y="123" class="mono">              ; RMSNorm(Emb(x_{t+k}))]</text>

    <rect x="14" y="136" width="204" height="54" rx="6" fill="#ffffff" stroke="#60a5fa" />
    <text x="22" y="153" class="mono-bold" fill="#1d4ed8">Shared Emb &amp; Shared LM Head</text>
    <text x="22" y="169" class="sub">1 Transformer block per MTP depth;</text>
    <text x="22" y="182" class="sub">85-90% single-step acceptance!</text>

    <rect x="14" y="200" width="204" height="30" rx="6" fill="#dbeafe" stroke="#3b82f6" />
    <text x="116" y="219" text-anchor="middle" class="mono-bold" fill="#1e3a8a">Eliminates Cartesian Mismatch</text>
  </g>
</svg>

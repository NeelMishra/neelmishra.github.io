<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300">
  <rect width="760" height="300" fill="#ffffff" />
  <style>
    .title { font-family: 'Manrope', 'Inter', -apple-system, sans-serif; font-size: 14.5px; font-weight: 800; fill: #0f172a; }
    .card-title { font-family: 'Manrope', 'Inter', sans-serif; font-size: 11.5px; font-weight: 800; }
    .sub { font-family: 'Manrope', 'Inter', sans-serif; font-size: 10.5px; font-weight: 500; fill: #475569; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10.5px; fill: #1e293b; }
    .mono-bold { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10.5px; font-weight: 700; }
    .card { rx: 10; ry: 10; stroke-width: 1.5; }
  </style>

  <text x="380" y="24" text-anchor="middle" class="title">Speculative Tree Verification: Topological Flattening, Non-Causal Ancestor Mask &amp; Multi-Path Sampling</text>

  <!-- Card 1: Topological Tree Flattening & RoPE Depth -->
  <g transform="translate(18, 42)">
    <rect width="232" height="242" class="card" fill="#f8fafc" stroke="#cbd5e1" />
    <rect width="232" height="32" rx="10" ry="10" fill="#e2e8f0" />
    <text x="116" y="20" text-anchor="middle" class="card-title" fill="#0f172a">1. Tree Flattening &amp; RoPE</text>

    <text x="14" y="50" class="sub">Packs M tree nodes into a single</text>
    <text x="14" y="65" class="sub">1D sequence with shared RoPE pos:</text>

    <rect x="14" y="78" width="204" height="50" rx="6" fill="#ffffff" stroke="#94a3b8" />
    <text x="22" y="95" class="mono-bold" fill="#0f172a">Packed 1D Buffer (M = 5)</text>
    <text x="22" y="111" class="mono">Idx: [u0,  u1,  u2,  u3,  u4]</text>
    <text x="22" y="123" class="mono">Par: [-1,   0,   0,   1,   2]</text>

    <rect x="14" y="136" width="204" height="54" rx="6" fill="#ffffff" stroke="#94a3b8" />
    <text x="22" y="153" class="mono-bold" fill="#0f172a">Tree Depth RoPE Offset</text>
    <text x="22" y="169" class="mono">pos(u_i) = L_prefix + depth(u_i)</text>
    <text x="22" y="182" class="sub">Siblings u1, u2 share pos L+1!</text>

    <rect x="14" y="200" width="204" height="30" rx="6" fill="#e2e8f0" stroke="#94a3b8" />
    <text x="116" y="219" text-anchor="middle" class="mono-bold" fill="#0f172a">No Padding Between Branches</text>
  </g>

  <!-- Card 2: Non-Causal 2D Ancestor Mask -->
  <g transform="translate(264, 42)">
    <rect width="232" height="242" class="card" fill="#f0fdf4" stroke="#86efac" />
    <rect width="232" height="32" rx="10" ry="10" fill="#dcfce7" />
    <text x="116" y="20" text-anchor="middle" class="card-title" fill="#14532d">2. 2D Ancestor Mask M_ij</text>

    <text x="14" y="50" class="sub">Node u_i attends ONLY to prefix</text>
    <text x="14" y="65" class="sub">and its tree ancestors Anc(u_i):</text>

    <rect x="14" y="78" width="204" height="50" rx="6" fill="#ffffff" stroke="#4ade80" />
    <text x="22" y="95" class="mono-bold" fill="#166534">Mask Rule (j &lt;= i)</text>
    <text x="22" y="111" class="mono">M_ij = 0     if u_j in Anc(u_i)</text>
    <text x="22" y="123" class="mono">M_ij = -inf  if u_j is sibling/cousin</text>

    <rect x="14" y="136" width="204" height="54" rx="6" fill="#ffffff" stroke="#16a34a" />
    <text x="22" y="153" class="mono-bold" fill="#166534">Sparse Lower-Triangular Matrix</text>
    <text x="22" y="169" class="mono">u3 attends: [u0, u1, u3] (blocks u2)</text>
    <text x="22" y="182" class="mono">u4 attends: [u0, u2, u4] (blocks u1,u3)</text>

    <rect x="14" y="200" width="204" height="30" rx="6" fill="#dcfce7" stroke="#22c55e" />
    <text x="116" y="219" text-anchor="middle" class="mono-bold" fill="#14532d">1 Forward Pass Verifies All Paths</text>
  </g>

  <!-- Card 3: Multi-Path Recursive Rejection Sampling -->
  <g transform="translate(510, 42)">
    <rect width="232" height="242" class="card" fill="#eff6ff" stroke="#93c5fd" />
    <rect width="232" height="32" rx="10" ry="10" fill="#dbeafe" />
    <text x="116" y="20" text-anchor="middle" class="card-title" fill="#1e3a8a">3. Multi-Path Verification</text>

    <text x="14" y="50" class="sub">Tests sibling branches b = 1..B</text>
    <text x="14" y="65" class="sub">against recursive residual p^(b):</text>

    <rect x="14" y="78" width="204" height="50" rx="6" fill="#ffffff" stroke="#60a5fa" />
    <text x="22" y="95" class="mono-bold" fill="#1d4ed8">Step b: Test Sibling x^(b)</text>
    <text x="22" y="111" class="mono">Accept w/ min(1, p^(b-1)(x)/q^(b)(x))</text>
    <text x="22" y="123" class="sub">If accepted -&gt; descend into child!</text>

    <rect x="14" y="136" width="204" height="54" rx="6" fill="#ffffff" stroke="#60a5fa" />
    <text x="22" y="153" class="mono-bold" fill="#1d4ed8">On Reject: Update Residual Target</text>
    <text x="22" y="169" class="mono">p^(b)(v) = norm([p^(b-1) - q^(b)]_+)</text>
    <text x="22" y="182" class="sub">Then test next sibling x^(b+1)!</text>

    <rect x="14" y="200" width="204" height="30" rx="6" fill="#dbeafe" stroke="#3b82f6" />
    <text x="116" y="219" text-anchor="middle" class="mono-bold" fill="#1e3a8a">Exact Target Distribution p(v)</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Inter, system-ui, -apple-system, sans-serif">
  <rect width="760" height="300" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="380" y="26" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Production Speculative Serving: Roofline Crossover, Paged KV Compaction, and Ragged Batching</text>

  <!-- Panel 1: Roofline Batch Crossover -->
  <rect x="18" y="42" width="232" height="242" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="18" y="42" width="232" height="28" rx="8" fill="#eff6ff"/>
  <text x="134" y="60" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">1. Batch-Size Roofline Crossover</text>

  <!-- Axes -->
  <line x1="44" y1="194" x2="228" y2="194" stroke="#64748b" stroke-width="1.4"/>
  <line x1="44" y1="90" x2="44" y2="194" stroke="#64748b" stroke-width="1.4"/>
  <text x="136" y="210" text-anchor="middle" font-size="8.5" font-weight="600" fill="#475569">Arithmetic Intensity I = B(γ + 1)</text>
  <text x="34" y="142" text-anchor="middle" font-size="8.5" font-weight="600" fill="#475569" transform="rotate(-90 34 142)">TFLOP/s</text>

  <!-- Roofline curve -->
  <polyline points="44,186 126,112 224,112" fill="none" stroke="#2563eb" stroke-width="2.2"/>
  <!-- Ridge line -->
  <line x1="126" y1="92" x2="126" y2="194" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="126" y="86" text-anchor="middle" font-size="8" font-weight="700" fill="#dc2626">I_ridge ≈ 295</text>

  <!-- Memory-bound vs Compute-bound zones -->
  <rect x="48" y="152" width="72" height="34" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="84" y="166" text-anchor="middle" font-size="8" font-weight="700" fill="#166534">Small Batch</text>
  <text x="84" y="178" text-anchor="middle" font-size="7.5" fill="#15803d">B(γ+1) &lt; I_ridge</text>

  <rect x="134" y="122" width="88" height="34" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="178" y="136" text-anchor="middle" font-size="8" font-weight="700" fill="#991b1b">Large Batch</text>
  <text x="178" y="148" text-anchor="middle" font-size="7.5" fill="#b91c1c">Compute-Bound!</text>

  <rect x="28" y="220" width="212" height="52" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="134" y="236" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">Dynamic Speculation Throttling</text>
  <text x="134" y="250" text-anchor="middle" font-size="8" fill="#475569">Shrink γ as batch B grows; disable</text>
  <text x="134" y="262" text-anchor="middle" font-size="8" fill="#475569">speculation (γ = 0) when B ≥ B_max</text>

  <!-- Panel 2: PagedAttention KV-Cache Compaction -->
  <rect x="264" y="42" width="232" height="242" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="264" y="42" width="232" height="28" rx="8" fill="#f0fdf4"/>
  <text x="380" y="60" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">2. Paged KV Compaction &amp; Rollback</text>

  <text x="380" y="86" text-anchor="middle" font-size="8.5" font-weight="600" fill="#334155">Before Verification (Tree Slots in Page)</text>
  <!-- 6 KV slots before -->
  <rect x="278" y="94" width="32" height="26" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="294" y="110" text-anchor="middle" font-size="8.5" font-weight="700" fill="#166534">u0✓</text>

  <rect x="314" y="94" width="32" height="26" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="330" y="110" text-anchor="middle" font-size="8.5" font-weight="700" fill="#991b1b">u1✗</text>

  <rect x="350" y="94" width="32" height="26" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="366" y="110" text-anchor="middle" font-size="8.5" font-weight="700" fill="#166534">u2✓</text>

  <rect x="386" y="94" width="32" height="26" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="402" y="110" text-anchor="middle" font-size="8.5" font-weight="700" fill="#991b1b">u3✗</text>

  <rect x="422" y="94" width="32" height="26" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="438" y="110" text-anchor="middle" font-size="8.5" font-weight="700" fill="#166534">u4✓</text>

  <rect x="458" y="94" width="26" height="26" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="471" y="110" text-anchor="middle" font-size="7.5" fill="#64748b">free</text>

  <!-- Compaction arrows -->
  <text x="380" y="138" text-anchor="middle" font-size="8.5" font-weight="700" fill="#2563eb">↓ Gather Winning Path [u0, u2, u4] ↓</text>

  <text x="380" y="156" text-anchor="middle" font-size="8.5" font-weight="600" fill="#334155">After Compaction + Bonus Slot Alloc</text>
  <!-- KV slots after -->
  <rect x="278" y="164" width="36" height="26" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="296" y="180" text-anchor="middle" font-size="8.5" font-weight="700" fill="#166534">u0</text>

  <rect x="318" y="164" width="36" height="26" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="336" y="180" text-anchor="middle" font-size="8.5" font-weight="700" fill="#166534">u2</text>

  <rect x="358" y="164" width="36" height="26" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="376" y="180" text-anchor="middle" font-size="8.5" font-weight="700" fill="#166534">u4</text>

  <rect x="398" y="164" width="44" height="26" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="420" y="180" text-anchor="middle" font-size="8" font-weight="700" fill="#1e40af">bonus</text>

  <rect x="446" y="164" width="38" height="26" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="465" y="180" text-anchor="middle" font-size="7.5" fill="#64748b">reclaim</text>

  <rect x="274" y="204" width="212" height="68" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="380" y="220" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">Zero-Recompute KV Rollback</text>
  <text x="380" y="235" text-anchor="middle" font-size="8" fill="#475569">1. Compact accepted KV slots in-place</text>
  <text x="380" y="248" text-anchor="middle" font-size="8" fill="#475569">2. Rewind seq_len ← L_prefix + a + 1</text>
  <text x="380" y="261" text-anchor="middle" font-size="8" fill="#475569">3. Bonus token KV computed next step</text>

  <!-- Panel 3: Ragged Continuous Batching -->
  <rect x="510" y="42" width="232" height="242" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="510" y="42" width="232" height="28" rx="8" fill="#fef3c7"/>
  <text x="626" y="60" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">3. Ragged FlashAttention Batching</text>

  <text x="626" y="86" text-anchor="middle" font-size="8.5" font-weight="600" fill="#334155">Packed 1D Query Tensor (No Padding)</text>

  <!-- Ragged tensor blocks -->
  <rect x="524" y="96" width="68" height="28" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="558" y="109" text-anchor="middle" font-size="8" font-weight="700" fill="#1e40af">Req 1 (Spec)</text>
  <text x="558" y="119" text-anchor="middle" font-size="7.5" fill="#1d4ed8">q_len = 5</text>

  <rect x="594" y="96" width="56" height="28" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="622" y="109" text-anchor="middle" font-size="8" font-weight="700" fill="#166534">Req 2 (Tree)</text>
  <text x="622" y="119" text-anchor="middle" font-size="7.5" fill="#15803d">q_len = 7</text>

  <rect x="652" y="96" width="76" height="28" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="690" y="109" text-anchor="middle" font-size="8" font-weight="700" fill="#92400e">Req 3 (Prefill)</text>
  <text x="690" y="119" text-anchor="middle" font-size="7.5" fill="#b45309">q_len = 64</text>

  <rect x="524" y="134" width="204" height="32" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="626" y="148" text-anchor="middle" font-size="8" font-weight="700" fill="#0f172a">cu_seqlens_q = [0, 5, 12, 76]</text>
  <text x="626" y="160" text-anchor="middle" font-size="7.5" fill="#475569">varlen kernel dispatches per-request tiles</text>

  <!-- Engine comparison box -->
  <rect x="520" y="176" width="212" height="96" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="626" y="192" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">Production Engine Architecture</text>
  <text x="530" y="208" font-size="8" font-weight="700" fill="#1e40af">• vLLM:</text>
  <text x="566" y="208" font-size="8" fill="#475569">Bonus token carried to next step</text>
  <text x="530" y="223" font-size="8" font-weight="700" fill="#166534">• SGLang:</text>
  <text x="574" y="223" font-size="8" fill="#475569">RadixAttention + EAGLE-2/3 trees</text>
  <text x="530" y="238" font-size="8" font-weight="700" fill="#92400e">• TRT-LLM:</text>
  <text x="582" y="238" font-size="8" fill="#475569">Fused packed-mask CUDA kernels</text>
  <text x="530" y="255" font-size="8" font-weight="700" fill="#7c3aed">• SLA Guard:</text>
  <text x="586" y="255" font-size="8" fill="#475569">Bound worst-case ITL ≤ T_SLA</text>
</svg>

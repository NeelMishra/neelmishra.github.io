<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300">
  <rect width="760" height="300" fill="#ffffff" />
  <style>
    .title { font-family: 'Manrope', 'Inter', -apple-system, sans-serif; font-size: 14.5px; font-weight: 800; fill: #0f172a; }
    .card-title { font-family: 'Manrope', 'Inter', sans-serif; font-size: 11.5px; font-weight: 800; }
    .sub { font-family: 'Manrope', 'Inter', sans-serif; font-size: 10.5px; font-weight: 500; fill: #475569; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10.5px; fill: #1e293b; }
    .mono-bold { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10.5px; font-weight: 700; }
    .card { rx: 10; ry: 10; stroke-width: 1.5; }
  </style>

  <text x="380" y="24" text-anchor="middle" class="title">Assisted Generation: L=1 Memory Bottleneck vs. L=5 Parallel Causal Verification &amp; Dynamic K</text>

  <!-- Card 1: L=1 Single-Token Forward Pass -->
  <g transform="translate(18, 42)">
    <rect width="232" height="242" class="card" fill="#f8fafc" stroke="#cbd5e1" />
    <rect width="232" height="32" rx="10" ry="10" fill="#e2e8f0" />
    <text x="116" y="20" text-anchor="middle" class="card-title" fill="#0f172a">1. Cached Decode (L = 1)</text>

    <text x="14" y="50" class="sub">Streams full weight matrix W (d×d)</text>
    <text x="14" y="65" class="sub">just to project 1 token row:</text>

    <rect x="14" y="78" width="204" height="36" rx="6" fill="#ffffff" stroke="#94a3b8" />
    <text x="22" y="94" class="mono-bold" fill="#334155">Input X_5: (1 × d)  ["the"]</text>
    <text x="22" y="107" class="sub">Only latest token enters network</text>

    <rect x="14" y="122" width="204" height="36" rx="6" fill="#ffffff" stroke="#94a3b8" />
    <text x="22" y="138" class="mono-bold" fill="#334155">Attn A_5: (1 × 5) × V (5 × d)</text>
    <text x="22" y="151" class="sub">Reads cached keys/values k_1..4</text>

    <rect x="14" y="166" width="204" height="26" rx="5" fill="#f1f5f9" stroke="#cbd5e1" />
    <text x="116" y="183" text-anchor="middle" class="mono" fill="#475569">Logits Z_5: (1 × V) -&gt; 1 token</text>

    <rect x="14" y="200" width="204" height="30" rx="6" fill="#e2e8f0" stroke="#94a3b8" />
    <text x="116" y="219" text-anchor="middle" class="mono-bold" fill="#0f172a">1 HBM Reload = 1 Token</text>
  </g>

  <!-- Card 2: L=5 Parallel Verification -->
  <g transform="translate(264, 42)">
    <rect width="232" height="242" class="card" fill="#f0fdf4" stroke="#86efac" />
    <rect width="232" height="32" rx="10" ry="10" fill="#dcfce7" />
    <text x="116" y="20" text-anchor="middle" class="card-title" fill="#14532d">2. Parallel Verify (L = 5)</text>

    <text x="14" y="50" class="sub">Reuses loaded W across 5 rows;</text>
    <text x="14" y="65" class="sub">causal mask isolates each prefix:</text>

    <rect x="14" y="78" width="204" height="36" rx="6" fill="#ffffff" stroke="#4ade80" />
    <text x="22" y="94" class="mono-bold" fill="#15803d">Input X: (5 × d)  [5 tokens]</text>
    <text x="22" y="107" class="sub">Q = X W_Q projects all 5 at once</text>

    <rect x="14" y="122" width="204" height="36" rx="6" fill="#ffffff" stroke="#16a34a" />
    <text x="22" y="138" class="mono-bold" fill="#166534">Lower-Triangular A: (5 × 5)</text>
    <text x="22" y="151" class="sub">Row N attends only to cols 1..N</text>

    <rect x="14" y="166" width="204" height="26" rx="5" fill="#f0fdf4" stroke="#86efac" />
    <text x="116" y="183" text-anchor="middle" class="mono" fill="#15803d">Logits Z: (5 × V) -&gt; 5 checks!</text>

    <rect x="14" y="200" width="204" height="30" rx="6" fill="#dcfce7" stroke="#22c55e" />
    <text x="116" y="219" text-anchor="middle" class="mono-bold" fill="#14532d">1 HBM Reload = Up to K+1 Tokens</text>
  </g>

  <!-- Card 3: Adaptive Window Heuristic -->
  <g transform="translate(510, 42)">
    <rect width="232" height="242" class="card" fill="#eff6ff" stroke="#93c5fd" />
    <rect width="232" height="32" rx="10" ry="10" fill="#dbeafe" />
    <text x="116" y="20" text-anchor="middle" class="card-title" fill="#1e3a8a">3. Dynamic Window K</text>

    <text x="14" y="50" class="sub">Balances assistant draft cost</text>
    <text x="14" y="65" class="sub">against target verification gain:</text>

    <rect x="14" y="78" width="204" height="52" rx="6" fill="#ffffff" stroke="#60a5fa" />
    <text x="22" y="95" class="mono-bold" fill="#1d4ed8">All K Candidates Match (n = K)</text>
    <text x="22" y="110" class="sub">Emit K+1 tokens (with bonus token)</text>
    <text x="22" y="123" class="mono-bold" fill="#15803d">Next step: K &lt;- K + 2</text>

    <rect x="14" y="138" width="204" height="52" rx="6" fill="#ffffff" stroke="#60a5fa" />
    <text x="22" y="155" class="mono-bold" fill="#1d4ed8">Mismatch at Position k &lt; K</text>
    <text x="22" y="170" class="sub">Keep n matches + 1 target fix; crop KV</text>
    <text x="22" y="183" class="mono-bold" fill="#dc2626">Next step: K &lt;- max(1, K - 1)</text>

    <rect x="14" y="200" width="204" height="30" rx="6" fill="#dbeafe" stroke="#3b82f6" />
    <text x="116" y="219" text-anchor="middle" class="mono-bold" fill="#1e3a8a">Shared Tokenizer Required</text>
  </g>
</svg>

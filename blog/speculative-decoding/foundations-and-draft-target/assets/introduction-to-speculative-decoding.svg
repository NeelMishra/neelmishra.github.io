<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300">
  <rect width="760" height="300" fill="#ffffff" />
  <style>
    .title { font-family: 'Manrope', 'Inter', -apple-system, sans-serif; font-size: 14.5px; font-weight: 800; fill: #0f172a; }
    .card-title { font-family: 'Manrope', 'Inter', sans-serif; font-size: 11.5px; font-weight: 800; }
    .sub { font-family: 'Manrope', 'Inter', sans-serif; font-size: 10.5px; font-weight: 500; fill: #475569; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10.5px; fill: #1e293b; }
    .mono-bold { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10.5px; font-weight: 700; }
    .card { rx: 10; ry: 10; stroke-width: 1.5; }
  </style>

  <text x="380" y="24" text-anchor="middle" class="title">Speculative Decoding Taxonomy: Memory Wall, Draft–Target Verification &amp; Single-Model Heads</text>

  <!-- Card 1: Autoregressive Memory Bottleneck -->
  <g transform="translate(18, 42)">
    <rect width="232" height="242" class="card" fill="#fef2f2" stroke="#fca5a5" />
    <rect width="232" height="32" rx="10" ry="10" fill="#fee2e2" />
    <text x="116" y="20" text-anchor="middle" class="card-title" fill="#991b1b">1. Sequential Memory Wall</text>

    <text x="14" y="50" class="sub">1 HBM weight reload per token:</text>
    <text x="14" y="65" class="sub">GPU compute units sit idle.</text>

    <rect x="14" y="78" width="204" height="32" rx="6" fill="#ffffff" stroke="#f87171" />
    <text x="22" y="98" class="mono">Pass 1 (200ms) -&gt; "Brown"</text>

    <rect x="14" y="118" width="204" height="32" rx="6" fill="#ffffff" stroke="#f87171" />
    <text x="22" y="138" class="mono">Pass 2 (200ms) -&gt; "Fox"</text>

    <rect x="14" y="158" width="204" height="32" rx="6" fill="#ffffff" stroke="#f87171" />
    <text x="22" y="178" class="mono">Pass 3 (200ms) -&gt; "Jumped"</text>

    <rect x="14" y="200" width="204" height="30" rx="6" fill="#fee2e2" stroke="#ef4444" />
    <text x="116" y="219" text-anchor="middle" class="mono-bold" fill="#991b1b">3 Tokens = 600 ms (1.0x)</text>
  </g>

  <!-- Card 2: Draft-Target Verification -->
  <g transform="translate(264, 42)">
    <rect width="232" height="242" class="card" fill="#f0fdf4" stroke="#86efac" />
    <rect width="232" height="32" rx="10" ry="10" fill="#dcfce7" />
    <text x="116" y="20" text-anchor="middle" class="card-title" fill="#14532d">2. Classic Draft–Target</text>

    <text x="14" y="50" class="sub">Small M_q drafts γ=4 tokens;</text>
    <text x="14" y="65" class="sub">Target M_p verifies in 1 pass.</text>

    <rect x="14" y="78" width="204" height="34" rx="6" fill="#ffffff" stroke="#4ade80" />
    <text x="22" y="94" class="mono-bold" fill="#15803d">Draft M_q: "Brown Fox Hopped Over"</text>
    <text x="22" y="107" class="sub">Fast sequential draft (~15-30ms)</text>

    <rect x="14" y="120" width="204" height="36" rx="6" fill="#ffffff" stroke="#16a34a" />
    <text x="22" y="136" class="mono-bold" fill="#166534">Verify: [OK] Brown [OK] Fox [X] Hopped</text>
    <text x="22" y="149" class="sub">Bonus resample from M_p -&gt; "Jumped"</text>

    <rect x="14" y="164" width="204" height="26" rx="5" fill="#f8fafc" stroke="#cbd5e1" />
    <text x="116" y="181" text-anchor="middle" class="mono" fill="#334155">min(1, P_target(x) / P_draft(x))</text>

    <rect x="14" y="200" width="204" height="30" rx="6" fill="#dcfce7" stroke="#22c55e" />
    <text x="116" y="219" text-anchor="middle" class="mono-bold" fill="#14532d">3 Tokens = 250 ms (2.4x)</text>
  </g>

  <!-- Card 3: Single-Model Feature & MTP Heads -->
  <g transform="translate(510, 42)">
    <rect width="232" height="242" class="card" fill="#eff6ff" stroke="#93c5fd" />
    <rect width="232" height="32" rx="10" ry="10" fill="#dbeafe" />
    <text x="116" y="20" text-anchor="middle" class="card-title" fill="#1e3a8a">3. EAGLE-3 &amp; DeepSeek MTP</text>

    <text x="14" y="50" class="sub">No separate standalone draft LLM;</text>
    <text x="14" y="65" class="sub">drafts directly from hidden states.</text>

    <rect x="14" y="78" width="204" height="52" rx="6" fill="#ffffff" stroke="#60a5fa" />
    <text x="22" y="95" class="mono-bold" fill="#1d4ed8">EAGLE-3 Feature Extrapolation</text>
    <text x="22" y="110" class="sub">Fuses low/mid/high target features</text>
    <text x="22" y="123" class="sub">+ dynamic tree attention verify</text>

    <rect x="14" y="138" width="204" height="52" rx="6" fill="#ffffff" stroke="#60a5fa" />
    <text x="22" y="155" class="mono-bold" fill="#1d4ed8">DeepSeek-R1 / V3 Native MTP</text>
    <text x="22" y="170" class="sub">Chained heads predict t+2, t+3...</text>
    <text x="22" y="183" class="sub">co-trained with main backbone</text>

    <rect x="14" y="200" width="204" height="30" rx="6" fill="#dbeafe" stroke="#3b82f6" />
    <text x="116" y="219" text-anchor="middle" class="mono-bold" fill="#1e3a8a">~0.5-1% Params | 2.5x-3.8x</text>
  </g>
</svg>

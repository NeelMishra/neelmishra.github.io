<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300">
  <rect width="760" height="300" fill="#ffffff" />
  <style>
    .title { font-family: 'Manrope', 'Inter', -apple-system, sans-serif; font-size: 14.5px; font-weight: 800; fill: #0f172a; }
    .card-title { font-family: 'Manrope', 'Inter', sans-serif; font-size: 11.5px; font-weight: 800; }
    .sub { font-family: 'Manrope', 'Inter', sans-serif; font-size: 10.5px; font-weight: 500; fill: #475569; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10.5px; fill: #1e293b; }
    .mono-bold { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10.5px; font-weight: 700; }
    .card { rx: 10; ry: 10; stroke-width: 1.5; }
  </style>

  <text x="380" y="24" text-anchor="middle" class="title">Lossless Speculative Sampling: Probability Decomposition, TV Distance &amp; Speedup Formula</text>

  <!-- Card 1: Acceptance + Residual Decomposition -->
  <g transform="translate(18, 42)">
    <rect width="232" height="242" class="card" fill="#f0fdf4" stroke="#86efac" />
    <rect width="232" height="32" rx="10" ry="10" fill="#dcfce7" />
    <text x="116" y="20" text-anchor="middle" class="card-title" fill="#14532d">1. Lossless Decomposition</text>

    <text x="14" y="50" class="sub">Draft x ~ q(x), accept w/ prob</text>
    <text x="14" y="65" class="mono-bold" fill="#15803d">a(x) = min(1, p(x) / q(x))</text>

    <rect x="14" y="78" width="204" height="50" rx="6" fill="#ffffff" stroke="#4ade80" />
    <text x="22" y="95" class="mono-bold" fill="#166534">Path A: Accepted Mass</text>
    <text x="22" y="111" class="mono">q(x) * min(1, p(x)/q(x))</text>
    <text x="22" y="123" class="mono-bold" fill="#15803d">= min(p(x), q(x))</text>

    <rect x="14" y="136" width="204" height="54" rx="6" fill="#ffffff" stroke="#f59e0b" />
    <text x="22" y="153" class="mono-bold" fill="#b45309">Path B: Rejected -&gt; Residual</text>
    <text x="22" y="169" class="mono">p_res(x) = [p(x) - q(x)]_+ / (1 - α)</text>
    <text x="22" y="182" class="mono-bold" fill="#b45309">Adds mass [p(x) - q(x)]_+</text>

    <rect x="14" y="200" width="204" height="30" rx="6" fill="#dcfce7" stroke="#22c55e" />
    <text x="116" y="219" text-anchor="middle" class="mono-bold" fill="#14532d">min(p, q) + [p - q]_+ = p(x)</text>
  </g>

  <!-- Card 2: Total Variation Distance & Acceptance Rate -->
  <g transform="translate(264, 42)">
    <rect width="232" height="242" class="card" fill="#f8fafc" stroke="#cbd5e1" />
    <rect width="232" height="32" rx="10" ry="10" fill="#e2e8f0" />
    <text x="116" y="20" text-anchor="middle" class="card-title" fill="#0f172a">2. Overlap &amp; TV Distance</text>

    <text x="14" y="50" class="sub">Acceptance rate α equals overlap</text>
    <text x="14" y="65" class="sub">volume between p(x) and q(x):</text>

    <rect x="14" y="78" width="204" height="50" rx="6" fill="#ffffff" stroke="#94a3b8" />
    <text x="22" y="95" class="mono-bold" fill="#0f172a">Exact Overlap Identity</text>
    <text x="22" y="111" class="mono">α = Σ_x min(p(x), q(x))</text>
    <text x="22" y="123" class="mono-bold" fill="#2563eb">= 1 - D_TV(p, q)</text>

    <rect x="14" y="136" width="204" height="54" rx="6" fill="#ffffff" stroke="#94a3b8" />
    <text x="22" y="153" class="mono-bold" fill="#0f172a">Expected Tokens per Pass</text>
    <text x="22" y="169" class="sub">Truncated geometric + 1 bonus:</text>
    <text x="22" y="183" class="mono-bold" fill="#15803d">E[τ] = (1 - α^(γ+1)) / (1 - α)</text>

    <rect x="14" y="200" width="204" height="30" rx="6" fill="#e2e8f0" stroke="#94a3b8" />
    <text x="116" y="219" text-anchor="middle" class="mono-bold" fill="#0f172a">Reject Prob = D_TV(p, q)</text>
  </g>

  <!-- Card 3: Wall-Clock Speedup & Optimal Gamma -->
  <g transform="translate(510, 42)">
    <rect width="232" height="242" class="card" fill="#eff6ff" stroke="#93c5fd" />
    <rect width="232" height="32" rx="10" ry="10" fill="#dbeafe" />
    <text x="116" y="20" text-anchor="middle" class="card-title" fill="#1e3a8a">3. Wall-Clock Speedup S(γ)</text>

    <text x="14" y="50" class="sub">Let c = T_draft / T_target be</text>
    <text x="14" y="65" class="sub">draft-to-target latency ratio:</text>

    <rect x="14" y="78" width="204" height="50" rx="6" fill="#ffffff" stroke="#60a5fa" />
    <text x="22" y="95" class="mono-bold" fill="#1d4ed8">Speedup Equation</text>
    <text x="22" y="111" class="mono">S(γ) = (1 - α^(γ+1))</text>
    <text x="22" y="123" class="mono">       / ((1 - α) * (γ*c + 1))</text>

    <rect x="14" y="136" width="204" height="54" rx="6" fill="#ffffff" stroke="#60a5fa" />
    <text x="22" y="153" class="mono-bold" fill="#1d4ed8">Worked Example (α=0.8, γ=5)</text>
    <text x="22" y="169" class="mono">c = 0.02 -&gt; E[τ] = 3.689 tokens</text>
    <text x="22" y="182" class="mono-bold" fill="#15803d">Cost = 1.10x -&gt; S = 3.35x</text>

    <rect x="14" y="200" width="204" height="30" rx="6" fill="#dbeafe" stroke="#3b82f6" />
    <text x="116" y="219" text-anchor="middle" class="mono-bold" fill="#1e3a8a">Optimal γ* Balances α vs. c</text>
  </g>
</svg>

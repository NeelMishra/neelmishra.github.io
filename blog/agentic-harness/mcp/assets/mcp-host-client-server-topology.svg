<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 390" width="920" height="390" font-family="Manrope, DejaVu Sans, -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <linearGradient id="bgMcp1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arC5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arG5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <rect width="920" height="390" rx="12" fill="url(#bgMcp1)" stroke="#334155" stroke-width="1.5"/>

  <!-- Left Panel: MCP Host-Client-Server Architecture -->
  <rect x="18" y="18" width="434" height="354" rx="8" fill="#0b1120" stroke="#334155" stroke-width="1"/>
  <text x="32" y="42" fill="#f8fafc" font-size="13" font-weight="700">A. Model Context Protocol (MCP) Topology</text>
  <text x="32" y="58" fill="#94a3b8" font-size="9.6">Collapsing M x N custom tool glue into M + N JSON-RPC 2.0 endpoints</text>

  <!-- Host Box -->
  <rect x="32" y="72" width="406" height="66" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.4"/>
  <text x="235" y="92" fill="#a5b4fc" font-size="10.2" font-weight="700" text-anchor="middle">MCP Host Process (Agent Harness / IDE / Shopping Orchestrator)</text>
  <text x="235" y="110" fill="#e0e7ff" font-size="8.3" text-anchor="middle">Enforces user permissions, context budget, and 1:1 isolated Client sessions</text>
  <text x="235" y="126" fill="#c7d2fe" font-size="8.1" text-anchor="middle">[Client 1: Catalog]        [Client 2: Order DB]        [Client 3: Policy Docs]</text>

  <line x1="96" y1="138" x2="96" y2="164" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arC5)"/>
  <line x1="235" y1="138" x2="235" y2="164" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arC5)"/>
  <line x1="374" y1="138" x2="374" y2="164" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arC5)"/>

  <rect x="88" y="142" width="294" height="16" rx="4" fill="#0b1120" stroke="#334155" stroke-width="0.8"/>
  <text x="235" y="153" fill="#7dd3fc" font-size="7.8" font-weight="600" text-anchor="middle">JSON-RPC 2.0 (stdio local pipes / Streamable HTTP + SSE)</text>

  <!-- Three MCP Primitives -->
  <rect x="32" y="166" width="128" height="92" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.3"/>
  <text x="96" y="186" fill="#6ee7b7" font-size="9.5" font-weight="700" text-anchor="middle">1. Tools</text>
  <text x="96" y="202" fill="#a7f3d0" font-size="8" font-weight="600" text-anchor="middle">Model-Controlled</text>
  <text x="96" y="219" fill="#d1fae5" font-size="7.8" text-anchor="middle">tools/list, tools/call</text>
  <text x="96" y="234" fill="#d1fae5" font-size="7.8" text-anchor="middle">Typed JSON Schema</text>
  <text x="96" y="249" fill="#6ee7b7" font-size="7.8" text-anchor="middle">Search / Mutate API</text>

  <rect x="171" y="166" width="128" height="92" rx="6" fill="#082f49" stroke="#38bdf8" stroke-width="1.3"/>
  <text x="235" y="186" fill="#7dd3fc" font-size="9.5" font-weight="700" text-anchor="middle">2. Resources</text>
  <text x="235" y="202" fill="#bae6fd" font-size="8" font-weight="600" text-anchor="middle">App-Controlled</text>
  <text x="235" y="219" fill="#e0f2fe" font-size="7.8" text-anchor="middle">resources/read</text>
  <text x="235" y="234" fill="#e0f2fe" font-size="7.8" text-anchor="middle">URI-addressed data</text>
  <text x="235" y="249" fill="#7dd3fc" font-size="7.8" text-anchor="middle">Read-only context</text>

  <rect x="310" y="166" width="128" height="92" rx="6" fill="#451a03" stroke="#f59e0b" stroke-width="1.3"/>
  <text x="374" y="186" fill="#fde68a" font-size="9.5" font-weight="700" text-anchor="middle">3. Prompts</text>
  <text x="374" y="202" fill="#fef3c7" font-size="8" font-weight="600" text-anchor="middle">User-Controlled</text>
  <text x="374" y="219" fill="#fed7aa" font-size="7.8" text-anchor="middle">prompts/get</text>
  <text x="374" y="234" fill="#fed7aa" font-size="7.8" text-anchor="middle">Parameterized</text>
  <text x="374" y="249" fill="#fde68a" font-size="7.8" text-anchor="middle">workflow templates</text>

  <!-- Lifecycle Box -->
  <rect x="32" y="272" width="406" height="84" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
  <text x="235" y="292" fill="#f8fafc" font-size="9.8" font-weight="700" text-anchor="middle">Stateful Capability Handshake &amp; Fault Isolation</text>
  <text x="46" y="310" fill="#cbd5e1" font-size="8.2">• Handshake: initialize -&gt; capability negotiation -&gt; notifications/initialized</text>
  <text x="46" y="326" fill="#cbd5e1" font-size="8.2">• Error Handling: Tool errors return isError=true inside result (not protocol crash)</text>
  <text x="46" y="342" fill="#a7f3d0" font-size="8.2" font-weight="600">• Isolation: Server A cannot read Server B's credentials or conversation state</text>

  <!-- Right Panel: Dynamic Tool Discovery & Context Economics -->
  <rect x="468" y="18" width="434" height="354" rx="8" fill="#0b1120" stroke="#334155" stroke-width="1"/>
  <text x="482" y="42" fill="#f8fafc" font-size="13" font-weight="700">B. Scaling to 200+ Tools: Lazy Tool Retrieval</text>
  <text x="482" y="58" fill="#94a3b8" font-size="9.6">Why stuffing all tool schemas into the system prompt destroys accuracy</text>

  <!-- Naive All-Tools Stuffing -->
  <rect x="484" y="72" width="402" height="76" rx="6" fill="#3f1d2e" stroke="#f43f5e" stroke-width="1.3"/>
  <text x="498" y="92" fill="#fda4af" font-size="9.5" font-weight="700">Naive Eager Registration (200 Tools in System Prompt)</text>
  <text x="872" y="92" fill="#fecdd3" font-size="8.2" font-weight="700" text-anchor="end">36,000 tokens!</text>
  <text x="498" y="110" fill="#ffe4e6" font-size="8.2">• 200 JSON schemas x 180 tokens/tool = 36K tokens billed on every turn</text>
  <text x="498" y="126" fill="#fda4af" font-size="8.2" font-weight="600">• Tool-Selection F1 drops from 96.2% (10 tools) to 64.1% (200 tools)</text>
  <text x="498" y="140" fill="#fecdd3" font-size="8">• Overlapping parameter names ("id", "query") confuse attention heads</text>

  <!-- Two-Stage Dense Tool Router -->
  <rect x="484" y="162" width="402" height="106" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.4"/>
  <text x="498" y="182" fill="#6ee7b7" font-size="9.5" font-weight="700">Two-Stage Dense Tool Router + Lazy Schema Hydration</text>
  <text x="872" y="182" fill="#a7f3d0" font-size="8.2" font-weight="700" text-anchor="end">2,100 tokens (-94%)</text>
  <text x="498" y="201" fill="#d1fae5" font-size="8.2">1. Index each tool card d_j = (name, description, example_queries) in HNSW</text>
  <text x="498" y="218" fill="#d1fae5" font-size="8.2">2. Score user turn + plan step: s_j = cos( E_q(x_t), E_d(d_j) ) + BM25(x_t, d_j)</text>
  <text x="498" y="235" fill="#d1fae5" font-size="8.2">3. Hydrate full JSON Schema ONLY for Top-K = 8 tools + core meta-tools</text>
  <text x="498" y="253" fill="#a7f3d0" font-size="8.2" font-weight="700">-&gt; Restores 95.8% Tool-Selection F1 and cuts prefill latency by 4.2x</text>

  <!-- Schema Design Rules Box -->
  <rect x="484" y="280" width="402" height="76" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.3"/>
  <text x="685" y="299" fill="#7dd3fc" font-size="9.8" font-weight="700" text-anchor="middle">High-Signal Tool Schema Engineering Principles</text>
  <text x="498" y="317" fill="#e2e8f0" font-size="8.2">• Flatten deep nesting (max depth &lt;= 2) and use explicit Literal[...] enums</text>
  <text x="498" y="333" fill="#e2e8f0" font-size="8.2">• Name parameters self-descriptively: max_price_usd instead of val2</text>
  <text x="498" y="348" fill="#7dd3fc" font-size="8.2" font-weight="600">• Return actionable error hints ("Valid colors: olive, navy, sand") on failure</text>
</svg>

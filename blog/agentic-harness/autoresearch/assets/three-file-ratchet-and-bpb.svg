<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" width="900" height="370" font-family="Manrope, -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <linearGradient id="bgGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect width="900" height="370" rx="12" fill="url(#bgGrad1)" stroke="#334155" stroke-width="1.5"/>

  <!-- Left Panel: The 3-File Contract & Git Ratchet -->
  <rect x="18" y="18" width="424" height="334" rx="8" fill="#0b1120" stroke="#334155" stroke-width="1"/>
  <text x="32" y="42" fill="#f8fafc" font-size="13" font-weight="700">A. The 3-File Autoresearch Contract &amp; 300s Git Ratchet</text>
  <text x="32" y="58" fill="#94a3b8" font-size="10.5">Strict write-scope isolation turns open-ended coding into bounded optimization</text>

  <!-- Box 1: program.md -->
  <rect x="32" y="72" width="122" height="74" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5"/>
  <text x="42" y="90" fill="#a5b4fc" font-size="11" font-weight="700">program.md</text>
  <rect x="98" y="78" width="48" height="15" rx="3" fill="#312e81"/>
  <text x="122" y="89" fill="#c7d2fe" font-size="8.5" font-weight="700" text-anchor="middle">HUMAN</text>
  <text x="42" y="107" fill="#e2e8f0" font-size="9.5">Research Org Prompt</text>
  <text x="42" y="121" fill="#94a3b8" font-size="8.5">• Priors &amp; hypotheses</text>
  <text x="42" y="134" fill="#94a3b8" font-size="8.5">• Loop protocol rules</text>

  <!-- Box 2: train.py -->
  <rect x="169" y="72" width="122" height="74" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="179" y="90" fill="#6ee7b7" font-size="11" font-weight="700">train.py</text>
  <rect x="231" y="78" width="52" height="15" rx="3" fill="#065f46"/>
  <text x="257" y="89" fill="#a7f3d0" font-size="8.5" font-weight="700" text-anchor="middle">MUTABLE</text>
  <text x="179" y="107" fill="#e2e8f0" font-size="9.5">Agent Sandbox (~630L)</text>
  <text x="179" y="121" fill="#94a3b8" font-size="8.5">• GPT model &amp; attn</text>
  <text x="179" y="134" fill="#94a3b8" font-size="8.5">• Muon + AdamW loop</text>

  <!-- Box 3: prepare.py -->
  <rect x="306" y="72" width="122" height="74" rx="6" fill="#3f1d2e" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="316" y="90" fill="#fda4af" font-size="11" font-weight="700">prepare.py</text>
  <rect x="368" y="78" width="54" height="15" rx="3" fill="#881337"/>
  <text x="395" y="89" fill="#fecdd3" font-size="8.5" font-weight="700" text-anchor="middle">FROZEN</text>
  <text x="316" y="107" fill="#e2e8f0" font-size="9.5">Immutable Verifier</text>
  <text x="316" y="121" fill="#94a3b8" font-size="8.5">• BPE &amp; data shards</text>
  <text x="316" y="134" fill="#94a3b8" font-size="8.5">• evaluate_bpb() oracle</text>

  <!-- Arrows between files -->
  <line x1="154" y1="109" x2="167" y2="109" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <line x1="291" y1="109" x2="304" y2="109" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrowAmber)"/>

  <!-- Execution & Ratchet Flow -->
  <rect x="44" y="168" width="372" height="50" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="230" y="187" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">Fixed-Horizon Execution: uv run train.py &gt; run.log 2&gt;&amp;1</text>
  <text x="230" y="205" fill="#cbd5e1" font-size="9.5" text-anchor="middle">Wall-Clock Budget T_budget = 300s  |  Tokens Trained N_tok = τ(θ) · 300</text>

  <line x1="230" y1="146" x2="230" y2="166" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <line x1="230" y1="218" x2="230" y2="238" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <!-- Decision Diamond / Box -->
  <rect x="115" y="240" width="230" height="36" rx="18" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="230" y="262" fill="#fde68a" font-size="10.5" font-weight="700" text-anchor="middle">val_bpb(p_cand) &lt; val_bpb(p_best) ?</text>

  <!-- Keep Branch (Left) -->
  <path d="M 145 276 L 105 300" stroke="#10b981" stroke-width="1.6" fill="none" marker-end="url(#arrowGreen)"/>
  <rect x="34" y="302" width="170" height="38" rx="5" fill="#064e3b" stroke="#10b981" stroke-width="1.2"/>
  <text x="119" y="318" fill="#6ee7b7" font-size="10" font-weight="700" text-anchor="middle">YES → RATCHET ADVANCE</text>
  <text x="119" y="332" fill="#d1fae5" font-size="8.5" text-anchor="middle">git commit &amp; append results.tsv</text>

  <!-- Discard Branch (Right) -->
  <path d="M 315 276 L 355 300" stroke="#f43f5e" stroke-width="1.6" fill="none" marker-end="url(#arrowRed)"/>
  <rect x="256" y="302" width="170" height="38" rx="5" fill="#4c0519" stroke="#f43f5e" stroke-width="1.2"/>
  <text x="341" y="318" fill="#fda4af" font-size="10" font-weight="700" text-anchor="middle">NO / CRASH → REVERT</text>
  <text x="341" y="332" fill="#ffe4e6" font-size="8.5" text-anchor="middle">git reset --hard HEAD (log discard)</text>

  <!-- Right Panel: Monotonic Ratchet Trajectory & BPB Invariance -->
  <rect x="458" y="18" width="424" height="334" rx="8" fill="#0b1120" stroke="#334155" stroke-width="1"/>
  <text x="472" y="42" fill="#f8fafc" font-size="13" font-weight="700">B. Overnight Ratchet Trajectory (val_bpb vs. Experiment)</text>
  <text x="472" y="58" fill="#94a3b8" font-size="10.5">Monotonic envelope of kept Git commits vs. reverted trial branches</text>

  <!-- Plot Axes -->
  <line x1="505" y1="78" x2="505" y2="255" stroke="#475569" stroke-width="1.2"/>
  <line x1="505" y1="255" x2="858" y2="255" stroke="#475569" stroke-width="1.2"/>

  <!-- Y-axis grid & labels (val_bpb) -->
  <line x1="505" y1="95" x2="858" y2="95" stroke="#1e293b" stroke-dasharray="3,3"/>
  <text x="499" y="99" fill="#94a3b8" font-size="9" text-anchor="end">1.050</text>
  <line x1="505" y1="140" x2="858" y2="140" stroke="#1e293b" stroke-dasharray="3,3"/>
  <text x="499" y="144" fill="#94a3b8" font-size="9" text-anchor="end">1.030</text>
  <line x1="505" y1="185" x2="858" y2="185" stroke="#1e293b" stroke-dasharray="3,3"/>
  <text x="499" y="189" fill="#94a3b8" font-size="9" text-anchor="end">1.010</text>
  <line x1="505" y1="230" x2="858" y2="230" stroke="#1e293b" stroke-dasharray="3,3"/>
  <text x="499" y="234" fill="#94a3b8" font-size="9" text-anchor="end">0.990</text>

  <!-- X-axis labels -->
  <text x="525" y="270" fill="#94a3b8" font-size="9" text-anchor="middle">#0</text>
  <text x="580" y="270" fill="#94a3b8" font-size="9" text-anchor="middle">#1</text>
  <text x="635" y="270" fill="#94a3b8" font-size="9" text-anchor="middle">#2</text>
  <text x="690" y="270" fill="#94a3b8" font-size="9" text-anchor="middle">#3</text>
  <text x="745" y="270" fill="#94a3b8" font-size="9" text-anchor="middle">#4</text>
  <text x="800" y="270" fill="#94a3b8" font-size="9" text-anchor="middle">#5</text>
  <text x="845" y="270" fill="#94a3b8" font-size="9" text-anchor="middle">#6</text>

  <!-- Discarded spikes (dashed red) -->
  <line x1="580" y1="136" x2="635" y2="98" stroke="#f43f5e" stroke-width="1.3" stroke-dasharray="4,3"/>
  <circle cx="635" cy="98" r="4.5" fill="#f43f5e"/>
  <text x="635" y="89" fill="#fda4af" font-size="8.5" text-anchor="middle">1.048 (revert)</text>

  <line x1="690" y1="163" x2="745" y2="108" stroke="#f43f5e" stroke-width="1.3" stroke-dasharray="4,3"/>
  <circle cx="745" cy="108" r="4.5" fill="#f43f5e"/>
  <text x="745" y="99" fill="#fda4af" font-size="8.5" text-anchor="middle">OOM (revert)</text>

  <!-- Kept Ratchet Envelope (solid green) -->
  <!-- #0: 1.042 (y=113), #1: 1.0315 (y=136), #3: 1.0198 (y=163), #5: 1.0084 (y=189), #6: 0.9979 (y=212) -->
  <polyline points="525,113 580,136 635,136 690,163 745,163 800,189 845,212" fill="none" stroke="#10b981" stroke-width="2.5"/>

  <circle cx="525" cy="113" r="5" fill="#10b981"/>
  <text x="533" y="109" fill="#a7f3d0" font-size="8.5">1.0420 (base)</text>

  <circle cx="580" cy="136" r="5" fill="#10b981"/>
  <text x="580" y="152" fill="#a7f3d0" font-size="8.5" text-anchor="middle">1.0315 (Muon lr)</text>

  <circle cx="690" cy="163" r="5" fill="#10b981"/>
  <text x="690" y="179" fill="#a7f3d0" font-size="8.5" text-anchor="middle">1.0198 (QK-Norm)</text>

  <circle cx="800" cy="189" r="5" fill="#10b981"/>
  <text x="790" y="204" fill="#a7f3d0" font-size="8.5" text-anchor="middle">1.0084 (SSSL win)</text>

  <circle cx="845" cy="212" r="5.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.2"/>
  <text x="832" y="227" fill="#38bdf8" font-size="9" font-weight="700" text-anchor="end">0.9979 (Value-Res)</text>

  <!-- Formula Callout Box -->
  <rect x="476" y="282" width="388" height="56" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="670" y="300" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">Tokenizer-Invariant Evaluation Metric: Validation Bits-Per-Byte (val_bpb)</text>
  <text x="670" y="317" fill="#38bdf8" font-size="10" font-weight="600" text-anchor="middle">val_bpb = (Total Nats: Σ_t -ln p_θ(x_t | x_&lt;t)) / (ln(2) · Total UTF-8 Bytes: Σ_t b(x_t))</text>
  <text x="670" y="331" fill="#94a3b8" font-size="8.5" text-anchor="middle">Invariant to vocabulary size |V| — prevents the agent from gaming perplexity by splitting tokens</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" width="900" height="370" font-family="Manrope, -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <linearGradient id="bgGrad4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect width="900" height="370" rx="12" fill="url(#bgGrad4)" stroke="#334155" stroke-width="1.5"/>

  <!-- Left Panel: FunSearch Multi-Island + Two-Stage Boltzmann Selection -->
  <rect x="18" y="18" width="424" height="334" rx="8" fill="#0b1120" stroke="#334155" stroke-width="1"/>
  <text x="32" y="42" fill="#f8fafc" font-size="13" font-weight="700">A. FunSearch Island Database &amp; Boltzmann Sampling</text>
  <text x="32" y="58" fill="#94a3b8" font-size="10.5">Isolated islands prevent premature convergence; periodic culling re-seeds weak islands</text>

  <!-- Island 1 (Elite) -->
  <rect x="32" y="74" width="120" height="92" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="92" y="92" fill="#6ee7b7" font-size="10" font-weight="700" text-anchor="middle">Island 1 (Top Elite)</text>
  <text x="42" y="110" fill="#d1fae5" font-size="8.5">• Best bpb: 0.996</text>
  <text x="42" y="124" fill="#d1fae5" font-size="8.5">• Motif: QK-Norm+GQA</text>
  <text x="42" y="138" fill="#a7f3d0" font-size="8.5">• Clusters: 6 active</text>
  <text x="42" y="154" fill="#6ee7b7" font-size="8" font-weight="700">Status: Surviving</text>

  <!-- Island 2 (Elite) -->
  <rect x="170" y="74" width="120" height="92" rx="6" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="230" y="92" fill="#7dd3fc" font-size="10" font-weight="700" text-anchor="middle">Island 2 (Top Elite)</text>
  <text x="180" y="110" fill="#e0f2fe" font-size="8.5">• Best bpb: 0.998</text>
  <text x="180" y="124" fill="#e0f2fe" font-size="8.5">• Motif: Muon NS-5</text>
  <text x="180" y="138" fill="#bae6fd" font-size="8.5">• Clusters: 5 active</text>
  <text x="180" y="154" fill="#7dd3fc" font-size="8" font-weight="700">Status: Surviving</text>

  <!-- Island 3 (Stagnant -> Reset!) -->
  <rect x="308" y="74" width="120" height="92" rx="6" fill="#3f1d2e" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="368" y="92" fill="#fda4af" font-size="10" font-weight="700" text-anchor="middle">Island 3 (Culled)</text>
  <text x="318" y="110" fill="#ffe4e6" font-size="8.5">• Stuck bpb: 1.029</text>
  <text x="318" y="124" fill="#ffe4e6" font-size="8.5">• Local Basin Trap</text>
  <text x="318" y="138" fill="#fda4af" font-size="8.5">• Wiped at ΔT_reset</text>
  <text x="318" y="154" fill="#fde68a" font-size="8" font-weight="700">← Seeded from Isl. 1</text>

  <!-- Migration arrow from Island 1 to Island 3 -->
  <path d="M 120 74 Q 240 50, 345 72" fill="none" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arA)"/>

  <!-- Two-Stage Boltzmann Equation Box -->
  <rect x="32" y="180" width="396" height="82" rx="6" fill="#1e293b" stroke="#818cf8" stroke-width="1.2"/>
  <text x="230" y="198" fill="#a5b4fc" font-size="10.5" font-weight="700" text-anchor="middle">Two-Stage Boltzmann Parent Selection (Score + Shortness)</text>
  <text x="230" y="216" fill="#f8fafc" font-size="9.5" text-anchor="middle">Stage 1 (Cluster c):  P(c) = exp(-J_c / T_score) / Σ_{c'} exp(-J_{c'} / T_score)</text>
  <text x="230" y="234" fill="#38bdf8" font-size="9.5" text-anchor="middle">Stage 2 (Program p ∈ c):  P(p | c) = exp(ℓ̃_p / T_len) / Σ_{p' ∈ c} exp(ℓ̃_{p'} / T_len)</text>
  <text x="230" y="251" fill="#94a3b8" font-size="8.5" text-anchor="middle">Among equally scoring programs in cluster c, shorter code ℓ_p is sampled exponentially more often</text>

  <!-- In-Context Crossover Prompt -->
  <rect x="32" y="274" width="396" height="64" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
  <text x="230" y="292" fill="#6ee7b7" font-size="10" font-weight="700" text-anchor="middle">In-Context Evolutionary Crossover Prompt</text>
  <text x="230" y="309" fill="#e2e8f0" font-size="9" text-anchor="middle">Prompt = [Parent 1 (v_a, bpb=1.008) + Parent 2 (v_b, bpb=1.002)] → Generate Child v_c</text>
  <text x="230" y="325" fill="#94a3b8" font-size="8.5" text-anchor="middle">Combines orthogonal discoveries (e.g. Isl.1 QK-Norm + Isl.2 Muon schedule) in one turn</text>

  <!-- Right Panel: AlphaEvolve MAP-Elites Archive & Diff Mutation -->
  <rect x="458" y="18" width="424" height="334" rx="8" fill="#0b1120" stroke="#334155" stroke-width="1"/>
  <text x="472" y="42" fill="#f8fafc" font-size="13" font-weight="700">B. AlphaEvolve MAP-Elites Quality-Diversity Grid</text>
  <text x="472" y="58" fill="#94a3b8" font-size="10.5">Preserving the best program in every (Throughput τ, VRAM Footprint) niche</text>

  <!-- Axis Labels for MAP-Elites Grid -->
  <text x="685" y="76" fill="#cbd5e1" font-size="9.5" font-weight="700" text-anchor="middle">Behavioral Axis 1: Step Throughput τ (tokens / sec) →</text>
  <text x="476" y="165" fill="#cbd5e1" font-size="9.5" font-weight="700" transform="rotate(-90 476 165)" text-anchor="middle">Axis 2: Peak VRAM →</text>

  <!-- Column Headers -->
  <text x="558" y="92" fill="#94a3b8" font-size="8.5" text-anchor="middle">Low τ (&lt;120K/s)</text>
  <text x="678" y="92" fill="#94a3b8" font-size="8.5" text-anchor="middle">Med τ (120–170K/s)</text>
  <text x="798" y="92" fill="#94a3b8" font-size="8.5" text-anchor="middle">High τ (&gt;170K/s)</text>

  <!-- Row 1: Low VRAM (<36 GB) -->
  <rect x="502" y="100" width="112" height="46" rx="4" fill="#1e293b" stroke="#475569"/>
  <text x="558" y="118" fill="#94a3b8" font-size="8.5" text-anchor="middle">L=6, Full Attn</text>
  <text x="558" y="134" fill="#cbd5e1" font-size="9" font-weight="700" text-anchor="middle">bpb = 1.031</text>

  <rect x="622" y="100" width="112" height="46" rx="4" fill="#064e3b" stroke="#10b981"/>
  <text x="678" y="118" fill="#a7f3d0" font-size="8.5" text-anchor="middle">L=8, GQA-4</text>
  <text x="678" y="134" fill="#6ee7b7" font-size="9" font-weight="700" text-anchor="middle">bpb = 1.009</text>

  <rect x="742" y="100" width="112" height="46" rx="4" fill="#0c4a6e" stroke="#38bdf8"/>
  <text x="798" y="118" fill="#bae6fd" font-size="8.5" text-anchor="middle">L=6, SSSL Win</text>
  <text x="798" y="134" fill="#38bdf8" font-size="9" font-weight="700" text-anchor="middle">bpb = 1.004</text>

  <!-- Row 2: Med VRAM (36-56 GB) -->
  <rect x="502" y="152" width="112" height="46" rx="4" fill="#064e3b" stroke="#10b981"/>
  <text x="558" y="170" fill="#a7f3d0" font-size="8.5" text-anchor="middle">L=12, Dense</text>
  <text x="558" y="186" fill="#6ee7b7" font-size="9" font-weight="700" text-anchor="middle">bpb = 1.012</text>

  <rect x="622" y="152" width="112" height="46" rx="4" fill="#065f46" stroke="#38bdf8" stroke-width="2"/>
  <text x="678" y="170" fill="#ffffff" font-size="8.5" font-weight="700" text-anchor="middle">L=10, SSSL+ValRes</text>
  <text x="678" y="186" fill="#6ee7b7" font-size="9.5" font-weight="700" text-anchor="middle">bpb = 0.992 ★</text>

  <rect x="742" y="152" width="112" height="46" rx="4" fill="#064e3b" stroke="#10b981"/>
  <text x="798" y="170" fill="#a7f3d0" font-size="8.5" text-anchor="middle">L=8, Flash3+Muon</text>
  <text x="798" y="186" fill="#6ee7b7" font-size="9" font-weight="700" text-anchor="middle">bpb = 0.997</text>

  <!-- Row 3: High VRAM (56-76 GB) -->
  <rect x="502" y="204" width="112" height="46" rx="4" fill="#1e293b" stroke="#475569"/>
  <text x="558" y="222" fill="#94a3b8" font-size="8.5" text-anchor="middle">L=16, Slow Step</text>
  <text x="558" y="238" fill="#cbd5e1" font-size="9" text-anchor="middle">bpb = 1.028</text>

  <rect x="622" y="204" width="112" height="46" rx="4" fill="#064e3b" stroke="#10b981"/>
  <text x="678" y="222" fill="#a7f3d0" font-size="8.5" text-anchor="middle">L=12, SwiGLU+QKN</text>
  <text x="678" y="238" fill="#6ee7b7" font-size="9" font-weight="700" text-anchor="middle">bpb = 0.995</text>

  <rect x="742" y="204" width="112" height="46" rx="4" fill="#1e293b" stroke="#475569" stroke-dasharray="3,3"/>
  <text x="798" y="222" fill="#64748b" font-size="8.5" text-anchor="middle">(Unexplored Cell)</text>
  <text x="798" y="238" fill="#64748b" font-size="8.5" text-anchor="middle">Target for mutation</text>

  <!-- AlphaEvolve Diff Format Box -->
  <rect x="476" y="262" width="388" height="76" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="670" y="280" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">AlphaEvolve Surgical Diff Mutation (`# EVOLVE-BLOCK`)</text>
  <text x="492" y="297" fill="#fda4af" font-size="8.5" font-family="monospace">&lt;&lt;&lt;&lt;&lt;&lt;&lt; SEARCH:   q, k = apply_rope(q, cos, sin), apply_rope(k, cos, sin)</text>
  <text x="492" y="311" fill="#6ee7b7" font-size="8.5" font-family="monospace">&gt;&gt;&gt;&gt;&gt;&gt;&gt; REPLACE:  q, k = rms_norm(apply_rope(q, cos, sin)), rms_norm(apply_rope(k, cos, sin))</text>
  <text x="670" y="329" fill="#94a3b8" font-size="8.5" text-anchor="middle">Avoids full-file regeneration errors while recombining elites from multiple MAP-Elites cells</text>
</svg>

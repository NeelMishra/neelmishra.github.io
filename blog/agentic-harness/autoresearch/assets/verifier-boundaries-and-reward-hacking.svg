<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" width="900" height="370" font-family="Manrope, -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <linearGradient id="bgGrad5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arGr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arRd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
    <marker id="arBl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="900" height="370" rx="12" fill="url(#bgGrad5)" stroke="#334155" stroke-width="1.5"/>

  <!-- Left Panel: Taxonomy of Reward Hacking Exploits & Hardened Verifier Boundary -->
  <rect x="18" y="18" width="430" height="334" rx="8" fill="#0b1120" stroke="#334155" stroke-width="1"/>
  <text x="32" y="42" fill="#f8fafc" font-size="13" font-weight="700">A. Attack Surface vs. Hardened Verifier Boundary</text>
  <text x="32" y="58" fill="#94a3b8" font-size="10.5">4 failure modes when evaluation shares mutable state with `train.py`</text>

  <!-- Mutable Agent Sandbox (Left Column) -->
  <rect x="32" y="74" width="176" height="202" rx="6" fill="#3f1d2e" stroke="#f43f5e" stroke-width="1.4"/>
  <text x="120" y="92" fill="#fda4af" font-size="10.5" font-weight="700" text-anchor="middle">Untrusted `train.py` Edits</text>

  <rect x="42" y="102" width="156" height="36" rx="4" fill="#4c0519"/>
  <text x="120" y="117" fill="#ffe4e6" font-size="8.5" font-weight="700" text-anchor="middle">1. Timer Deferral Exploit</text>
  <text x="120" y="130" fill="#fda4af" font-size="8" text-anchor="middle">Resets `t0` after 120s warmup</text>

  <rect x="42" y="144" width="156" height="36" rx="4" fill="#4c0519"/>
  <text x="120" y="159" fill="#ffe4e6" font-size="8.5" font-weight="700" text-anchor="middle">2. Causal Mask Leakage</text>
  <text x="120" y="172" fill="#fda4af" font-size="8" text-anchor="middle">`is_causal=False` in eval mode</text>

  <rect x="42" y="186" width="156" height="36" rx="4" fill="#4c0519"/>
  <text x="120" y="201" fill="#ffe4e6" font-size="8.5" font-weight="700" text-anchor="middle">3. Stdout Metric Spoofing</text>
  <text x="120" y="214" fill="#fda4af" font-size="8" text-anchor="middle">Prints fake `val_bpb: 0.850`</text>

  <rect x="42" y="228" width="156" height="38" rx="4" fill="#4c0519"/>
  <text x="120" y="243" fill="#ffe4e6" font-size="8.5" font-weight="700" text-anchor="middle">4. Short-Horizon Sprint</text>
  <text x="120" y="256" fill="#fda4af" font-size="8" text-anchor="middle">Spikes early LR, diverges &gt;300s</text>

  <!-- Verifier Firewall Line -->
  <line x1="226" y1="70" x2="226" y2="280" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="5,3"/>
  <text x="226" y="66" fill="#fde68a" font-size="8.5" font-weight="700" text-anchor="middle">VERIFIER FIREWALL</text>

  <!-- Hardened Verifier Sandbox (Right Column) -->
  <rect x="244" y="74" width="190" height="202" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="339" y="92" fill="#6ee7b7" font-size="10.5" font-weight="700" text-anchor="middle">Hardened Verifier Oracle</text>

  <rect x="254" y="102" width="170" height="36" rx="4" fill="#065f46"/>
  <text x="339" y="117" fill="#d1fae5" font-size="8.5" font-weight="700" text-anchor="middle">✓ External Wall-Clock Enforcer</text>
  <text x="339" y="130" fill="#a7f3d0" font-size="8" text-anchor="middle">Parent process SIGTERM at 330s</text>

  <rect x="254" y="144" width="170" height="36" rx="4" fill="#065f46"/>
  <text x="339" y="159" fill="#d1fae5" font-size="8.5" font-weight="700" text-anchor="middle">✓ Causal Canary Perturbation</text>
  <text x="339" y="172" fill="#a7f3d0" font-size="8" text-anchor="middle">Verifies ∂logits_{&lt;t}/∂x_t == 0</text>

  <rect x="254" y="186" width="170" height="36" rx="4" fill="#065f46"/>
  <text x="339" y="201" fill="#d1fae5" font-size="8.5" font-weight="700" text-anchor="middle">✓ SHA-256 + Signed Checkpoint</text>
  <text x="339" y="214" fill="#a7f3d0" font-size="8" text-anchor="middle">Scores saved weights in fresh proc</text>

  <rect x="254" y="228" width="170" height="38" rx="4" fill="#065f46"/>
  <text x="339" y="243" fill="#d1fae5" font-size="8.5" font-weight="700" text-anchor="middle">✓ Two-Point Scaling Slope α̂</text>
  <text x="339" y="256" fill="#a7f3d0" font-size="8" text-anchor="middle">Checks bpb(150s) → bpb(300s) decay</text>

  <!-- Causal Canary Equation Box -->
  <rect x="32" y="286" width="402" height="52" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="233" y="303" fill="#f8fafc" font-size="9.5" font-weight="700" text-anchor="middle">Causal Canary Invariance Check (50ms Pre-Eval Gate)</text>
  <text x="233" y="319" fill="#38bdf8" font-size="9.5" text-anchor="middle">max_{t &lt; t_0} ‖ f_θ(x_1, …, x_{t_0}, …, x_L)_t − f_θ(x_1, …, x̃_{t_0}, …, x_L)_t ‖_∞ ≤ 10⁻⁵</text>
  <text x="233" y="332" fill="#94a3b8" font-size="8" text-anchor="middle">Instantly catches future-token attention leaks and cross-sample batch norm contamination</text>

  <!-- Right Panel: Adaptive Overfitting & Two-Tier Thresholdout Ladder -->
  <rect x="462" y="18" width="420" height="334" rx="8" fill="#0b1120" stroke="#334155" stroke-width="1"/>
  <text x="476" y="42" fill="#f8fafc" font-size="13" font-weight="700">B. Adaptive Overfitting &amp; Two-Tier Validation Ladder</text>
  <text x="476" y="58" fill="#94a3b8" font-size="10.5">Preventing sequential validation leakage across K=200 adaptive queries</text>

  <!-- Plot of Dev-Val vs Holdout-Val divergence -->
  <line x1="510" y1="78" x2="510" y2="232" stroke="#475569" stroke-width="1.2"/>
  <line x1="510" y1="232" x2="858" y2="232" stroke="#475569" stroke-width="1.2"/>

  <text x="502" y="92" fill="#94a3b8" font-size="8.5" text-anchor="end">1.04</text>
  <text x="502" y="140" fill="#94a3b8" font-size="8.5" text-anchor="end">1.01</text>
  <text x="502" y="188" fill="#94a3b8" font-size="8.5" text-anchor="end">0.98</text>
  <text x="502" y="228" fill="#94a3b8" font-size="8.5" text-anchor="end">0.95</text>

  <text x="520" y="246" fill="#94a3b8" font-size="8.5" text-anchor="middle">k=0</text>
  <text x="605" y="246" fill="#94a3b8" font-size="8.5" text-anchor="middle">k=50</text>
  <text x="690" y="246" fill="#94a3b8" font-size="8.5" text-anchor="middle">k=100</text>
  <text x="775" y="246" fill="#94a3b8" font-size="8.5" text-anchor="middle">k=150</text>
  <text x="845" y="246" fill="#94a3b8" font-size="8.5" text-anchor="middle">k=200</text>

  <!-- Fast-Dev Curve (keeps dropping due to adaptive noise selection) -->
  <path d="M 520 92 Q 600 145, 680 175 Q 760 198, 845 216" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="790" y="224" fill="#38bdf8" font-size="8.5" font-weight="700">D_dev (Queried 200×)</text>

  <!-- Unprotected True Holdout Curve (diverges upward after k=90) -->
  <path d="M 520 92 Q 600 143, 680 165 Q 760 158, 845 142" fill="none" stroke="#f43f5e" stroke-width="2"/>
  <text x="780" y="135" fill="#fda4af" font-size="8.5" font-weight="700">True Test (Overfit!)</text>

  <!-- Two-Tier Thresholdout Protected Curve (green) -->
  <path d="M 520 92 Q 600 143, 680 166 Q 760 178, 845 186" fill="none" stroke="#10b981" stroke-width="2.4"/>
  <text x="770" y="176" fill="#6ee7b7" font-size="8.5" font-weight="700">Two-Tier Ladder (Protected)</text>

  <!-- Gap Arrow -->
  <line x1="845" y1="145" x2="845" y2="213" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="838" y="198" fill="#fde68a" font-size="8" text-anchor="end">Adaptive Gap O(√(K/n_val))</text>

  <!-- Two-Tier Thresholdout Box -->
  <rect x="476" y="258" width="392" height="80" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
  <text x="672" y="276" fill="#6ee7b7" font-size="10" font-weight="700" text-anchor="middle">Two-Tier Validation Ladder (Dwork et al. Thresholdout)</text>
  <text x="488" y="293" fill="#e2e8f0" font-size="8.8">• Tier 1 (`D_dev`): Evaluated on every 5-min run (fast filter, K=200 queries).</text>
  <text x="488" y="308" fill="#e2e8f0" font-size="8.8">• Tier 2 (`D_holdout`): Quarantined shard queried ONLY when J_dev &lt; J*_dev − τ_min.</text>
  <text x="488" y="323" fill="#a7f3d0" font-size="8.8" font-weight="600">→ Reduces effective holdout queries from K=200 to ~12, preserving generalization!</text>
</svg>

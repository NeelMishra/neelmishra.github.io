<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" width="900" height="370" font-family="Manrope, -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <linearGradient id="bgGrad3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="aGrn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="aBlu" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="aRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
  </defs>

  <rect width="900" height="370" rx="12" fill="url(#bgGrad3)" stroke="#334155" stroke-width="1.5"/>

  <!-- Left Panel: SWE-agent / Autoresearch ACI Information Bottleneck -->
  <rect x="18" y="18" width="430" height="334" rx="8" fill="#0b1120" stroke="#334155" stroke-width="1"/>
  <text x="32" y="42" fill="#f8fafc" font-size="13" font-weight="700">A. Agent-Computer Interface (ACI) Observation Bottleneck</text>
  <text x="32" y="58" fill="#94a3b8" font-size="10.5">Preventing context-window log flooding across 100 overnight runs</text>

  <!-- Naive Bash Streaming (Top Red Track) -->
  <rect x="32" y="74" width="402" height="72" rx="6" fill="#3f1d2e" stroke="#f43f5e" stroke-width="1.2"/>
  <text x="44" y="93" fill="#fda4af" font-size="10.5" font-weight="700">Naive Shell Execution: `uv run train.py` (Unfiltered Stdout)</text>
  <text x="44" y="110" fill="#ffe4e6" font-size="9">• Streams 1,500 step logs + compiler warnings (~18,000 tokens / run)</text>
  <text x="44" y="124" fill="#ffe4e6" font-size="9">• After 10 runs: 180,000 tokens of progress-bar noise in context!</text>
  <text x="44" y="138" fill="#fda4af" font-size="9" font-weight="700">→ Attention SNR collapses; agent forgets earlier hypotheses &amp; hallucinates</text>

  <!-- ACI Filtered Pipeline (Bottom Green/Blue Track) -->
  <rect x="32" y="160" width="402" height="114" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.4"/>
  <text x="44" y="179" fill="#38bdf8" font-size="10.5" font-weight="700">Autoresearch ACI Protocol (`program.md` + SWE-agent Rules)</text>

  <!-- Step 1: AST & Linter Guard -->
  <rect x="44" y="190" width="112" height="68" rx="5" fill="#1e293b" stroke="#818cf8" stroke-width="1.2"/>
  <text x="100" y="207" fill="#a5b4fc" font-size="9.5" font-weight="700" text-anchor="middle">1. Edit &amp; AST Guard</text>
  <text x="100" y="222" fill="#cbd5e1" font-size="8.5" text-anchor="middle">Syntax check +</text>
  <text x="100" y="235" fill="#cbd5e1" font-size="8.5" text-anchor="middle">ΔLOC complexity</text>
  <text x="100" y="248" fill="#a5b4fc" font-size="8" text-anchor="middle">before GPU launch</text>

  <line x1="156" y1="224" x2="170" y2="224" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#aBlu)"/>

  <!-- Step 2: Redirected Execution -->
  <rect x="172" y="190" width="118" height="68" rx="5" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="231" y="207" fill="#7dd3fc" font-size="9.5" font-weight="700" text-anchor="middle">2. Disk Sink</text>
  <text x="231" y="222" fill="#cbd5e1" font-size="8.5" text-anchor="middle">`&gt; run.log 2&gt;&amp;1`</text>
  <text x="231" y="235" fill="#cbd5e1" font-size="8.5" text-anchor="middle">0 streaming tokens</text>
  <text x="231" y="248" fill="#7dd3fc" font-size="8" text-anchor="middle">sent to LLM context</text>

  <line x1="290" y1="224" x2="304" y2="224" stroke="#10b981" stroke-width="1.5" marker-end="url(#aGrn)"/>

  <!-- Step 3: Structured Sensor Read -->
  <rect x="306" y="190" width="116" height="68" rx="5" fill="#064e3b" stroke="#10b981" stroke-width="1.2"/>
  <text x="364" y="207" fill="#6ee7b7" font-size="9.5" font-weight="700" text-anchor="middle">3. ACI Sensor</text>
  <text x="364" y="222" fill="#d1fae5" font-size="8.5" text-anchor="middle">OK: `grep val_bpb`</text>
  <text x="364" y="235" fill="#d1fae5" font-size="8.5" text-anchor="middle">Err: `tail -n 50`</text>
  <text x="364" y="248" fill="#6ee7b7" font-size="8" font-weight="700" text-anchor="middle">~65 tokens / run!</text>

  <!-- Context Economics Summary Box -->
  <rect x="32" y="286" width="402" height="52" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="233" y="304" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">275× Context Compression Ratio Across 100 Runs</text>
  <text x="233" y="320" fill="#38bdf8" font-size="9.5" text-anchor="middle">Unfiltered: 1.8M tokens (overflow)  vs.  ACI + results.tsv: 6.5K tokens</text>
  <text x="233" y="332" fill="#94a3b8" font-size="8.5" text-anchor="middle">Preserves attention capacity for full `train.py` (~4.5K tokens) + ledger history</text>

  <!-- Right Panel: Occam's Razor Simplicity Frontier in program.md -->
  <rect x="462" y="18" width="420" height="334" rx="8" fill="#0b1120" stroke="#334155" stroke-width="1"/>
  <text x="476" y="42" fill="#f8fafc" font-size="13" font-weight="700">B. `program.md` Occam’s Razor Acceptance Decision</text>
  <text x="476" y="58" fill="#94a3b8" font-size="10.5">Jointly optimizing Validation Bits-Per-Byte (Δbpb) and Code Complexity (ΔLOC)</text>

  <!-- Quadrant Axes -->
  <!-- Center at (672, 180) -->
  <!-- Green acceptance region: Δbpb < λ_LOC * ΔLOC -->
  <polygon points="495,78 720,78 624,270 495,270" fill="#064e3b" fill-opacity="0.45"/>
  <polygon points="720,78 855,78 855,270 624,270" fill="#4c0519" fill-opacity="0.45"/>

  <line x1="495" y1="180" x2="855" y2="180" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="672" y1="78" x2="672" y2="270" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3,3"/>

  <!-- Pareto Acceptance Boundary Line -->
  <line x1="720" y1="78" x2="624" y2="270" stroke="#f59e0b" stroke-width="2"/>
  <text x="735" y="96" fill="#fde68a" font-size="9" font-weight="700">Boundary: Δbpb + λ·ΔLOC = 0</text>

  <!-- Axis Labels -->
  <text x="672" y="72" fill="#6ee7b7" font-size="9.5" font-weight="700" text-anchor="middle">↑ Better Loss (Δval_bpb &lt; 0)</text>
  <text x="672" y="283" fill="#fda4af" font-size="9.5" font-weight="700" text-anchor="middle">↓ Worse Loss (Δval_bpb &gt; 0)</text>
  <text x="502" y="174" fill="#6ee7b7" font-size="9" font-weight="700">← Code Deleted (ΔLOC &lt; 0)</text>
  <text x="850" y="174" fill="#fda4af" font-size="9" font-weight="700" text-anchor="end">Code Added (ΔLOC &gt; 0) →</text>

  <!-- Plotted Candidate Points -->
  <!-- Point 1: Simpler + Better -->
  <circle cx="575" cy="118" r="5.5" fill="#10b981" stroke="#fff" stroke-width="1"/>
  <text x="575" y="106" fill="#a7f3d0" font-size="8.5" font-weight="700" text-anchor="middle">Delete dead gate</text>
  <text x="575" y="133" fill="#d1fae5" font-size="8" text-anchor="middle">(Δbpb=-0.004, -18 LOC) KEEP</text>

  <!-- Point 2: Neutral loss, simpler code -->
  <circle cx="565" cy="180" r="5.5" fill="#38bdf8" stroke="#fff" stroke-width="1"/>
  <text x="565" y="196" fill="#7dd3fc" font-size="8.5" font-weight="700" text-anchor="middle">Fuse QKV norm</text>
  <text x="565" y="208" fill="#e0f2fe" font-size="8" text-anchor="middle">(Δbpb=0.000, -14 LOC) KEEP</text>

  <!-- Point 3: Big gain, moderate LOC -->
  <circle cx="715" cy="112" r="5.5" fill="#10b981" stroke="#fff" stroke-width="1"/>
  <text x="775" y="116" fill="#a7f3d0" font-size="8.5" font-weight="700" text-anchor="middle">Value-Residual</text>
  <text x="775" y="128" fill="#d1fae5" font-size="8" text-anchor="middle">(-0.015, +12 LOC) KEEP</text>

  <!-- Point 4: Tiny gain, huge bloat (Rejected!) -->
  <circle cx="795" cy="162" r="5.5" fill="#f43f5e" stroke="#fff" stroke-width="1"/>
  <text x="790" y="148" fill="#fda4af" font-size="8.5" font-weight="700" text-anchor="middle">Hacky 40-LOC Scheduler</text>
  <text x="790" y="222" fill="#ffe4e6" font-size="8" text-anchor="middle">(-0.0006, +42 LOC) DISCARD!</text>
  <line x1="795" y1="168" x2="790" y2="210" stroke="#f43f5e" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Bottom Formula Callout -->
  <rect x="476" y="292" width="392" height="46" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="672" y="309" fill="#f8fafc" font-size="9.5" font-weight="700" text-anchor="middle">Complexity-Penalized Acceptance Criterion in `program.md`</text>
  <text x="672" y="326" fill="#fde68a" font-size="9.5" text-anchor="middle">Accept p_cand  iff  Δval_bpb + λ_LOC · max(0, ΔLOC) &lt; -ε_noise</text>
</svg>

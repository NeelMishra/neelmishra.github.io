<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 410" role="img" aria-labelledby="title desc">
  <title id="title">Multi-GPU Git-Worktree Swarm Coordinator and Benchmark Horizon Scaling</title>
  <desc id="desc">Left panel shows a 4-GPU git worktree swarm where specialist agents propose diffs in isolated worktrees and a sequential cherry-pick verifier tests epistatic compatibility before advancing main. Right panel compares agent success rates across short-horizon single-file loops, MLE-bench Kaggle competitions, and 48-hour zero-repo PaperBench replication.</desc>
  <defs>
    <style>
      .bg { fill: #fbfaf6; stroke: #d8d1c2; stroke-width: 1.5; }
      .panel { fill: #ffffff; stroke: #cfc7b6; stroke-width: 1.4; }
      .worktree { fill: #f3f7f4; stroke: #2c6e49; stroke-width: 1.5; }
      .verifier { fill: #eef3fb; stroke: #2b4c7e; stroke-width: 1.8; }
      .warn { fill: #fdf4f1; stroke: #b23a22; stroke-width: 1.5; }
      .title { font: 700 15px "Inter", system-ui, sans-serif; fill: #1e1e1c; }
      .sub { font: 600 12px "Inter", system-ui, sans-serif; fill: #4a4842; }
      .mono { font: 600 11.5px "JetBrains Mono", monospace; fill: #222; }
      .small { font: 500 11.5px "Inter", system-ui, sans-serif; fill: #4a4842; }
      .arrow { stroke: #3a3833; stroke-width: 1.6; fill: none; marker-end: url(#arr); }
      .arrow-ok { stroke: #2c6e49; stroke-width: 1.8; fill: none; marker-end: url(#arr-ok); }
      .arrow-bad { stroke: #b23a22; stroke-width: 1.6; stroke-dasharray: 5 4; fill: none; marker-end: url(#arr-bad); }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#3a3833"/>
    </marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2c6e49"/>
    </marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b23a22"/>
    </marker>
  </defs>

  <rect x="8" y="8" width="964" height="394" rx="12" class="bg"/>

  <!-- Left Panel: Multi-GPU Git Worktree Swarm -->
  <rect x="24" y="24" width="530" height="362" rx="10" class="panel"/>
  <text x="42" y="50" class="title">A. Parallel Git-Worktree Swarm &amp; Sequential Cherry-Pick Gate</text>
  <text x="42" y="69" class="small">Isolated GPU sandboxes prevent file races; sequential re-verification catches epistatic interference.</text>

  <!-- Main branch head -->
  <rect x="42" y="86" width="142" height="58" rx="8" class="verifier"/>
  <text x="54" y="108" class="mono">main @ p_0</text>
  <text x="54" y="126" class="small">val_bpb = 0.9648</text>

  <!-- Worktree 0 -->
  <rect x="218" y="84" width="154" height="54" rx="7" class="worktree"/>
  <text x="228" y="104" class="mono">wt-gpu0 (Optim)</text>
  <text x="228" y="122" class="small">Δ_A: Muon mom=0.96</text>
  <text x="228" y="134" class="mono">J(p_0⊕Δ_A)=0.9631</text>

  <!-- Worktree 1 -->
  <rect x="218" y="150" width="154" height="54" rx="7" class="worktree"/>
  <text x="228" y="170" class="mono">wt-gpu1 (Arch)</text>
  <text x="228" y="188" class="small">Δ_B: U-Net skip</text>
  <text x="228" y="200" class="mono">J(p_0⊕Δ_B)=0.9635</text>

  <!-- Worktree 2 -->
  <rect x="218" y="216" width="154" height="54" rx="7" class="worktree"/>
  <text x="228" y="236" class="mono">wt-gpu2 (Sched)</text>
  <text x="228" y="254" class="small">Δ_C: warmdown=0.45</text>
  <text x="228" y="266" class="mono">J(p_0⊕Δ_C)=0.9628</text>

  <!--Arrows from main to worktrees-->
  <path d="M 184 108 L 216 108" class="arrow"/>
  <path d="M 184 115 L 216 175" class="arrow"/>
  <path d="M 184 125 L 216 240" class="arrow"/>

  <!-- Sequential Cherry-Pick Verifier on GPU 3 -->
  <rect x="394" y="92" width="144" height="176" rx="8" class="verifier"/>
  <text x="405" y="114" class="mono">wt-gpu3 (Gate)</text>
  <text x="405" y="134" class="small">1. Promote best Δ_C:</text>
  <text x="405" y="150" class="mono">p_1 = p_0 ⊕ Δ_C</text>
  <text x="405" y="172" class="small">2. Re-test Δ_A on p_1:</text>
  <text x="405" y="188" class="mono">J(p_1⊕Δ_A)=0.9642</text>
  <text x="405" y="206" class="small" fill="#b23a22">✗ Epistatic clash!</text>
  <text x="405" y="226" class="small">3. Re-test Δ_B on p_1:</text>
  <text x="405" y="242" class="mono">J(p_1⊕Δ_B)=0.9619</text>
  <text x="405" y="258" class="small" fill="#2c6e49">✓ Advance p_2!</text>

  <path d="M 372 110 L 392 160" class="arrow-bad"/>
  <path d="M 372 178 L 392 226" class="arrow-ok"/>
  <path d="M 372 242 L 392 138" class="arrow-ok"/>

  <!-- Bottom note on Epistasis -->
  <rect x="42" y="286" width="496" height="84" rx="8" class="warn"/>
  <text x="56" y="308" class="sub">Why Naive Git Merge Fails in Code Swarms (Non-Additive Epistasis)</text>
  <text x="56" y="328" class="mono">Interaction I(Δ_A, Δ_C) = J(p_0 ⊕ Δ_A ⊕ Δ_C) - J(p_0) - δ_A - δ_C = +0.0031 bpb &gt; 0</text>
  <text x="56" y="348" class="small">Both higher Muon momentum (Δ_A) and longer warmdown (Δ_C) improve p_0 alone, but combined</text>
  <text x="56" y="364" class="small">they overshoot early step stability. Only re-running train.py on the merged tree catches this.</text>

  <!-- Right Panel: Benchmark Horizon Scaling -->
  <rect x="572" y="24" width="384" height="362" rx="10" class="panel"/>
  <text x="590" y="50" class="title">B. Horizon vs. Verification Granularity</text>
  <text x="590" y="69" class="small">Why 5-minute loops excel while 48-hour zero-repo replication lags.</text>

  <!-- Tier 1 -->
  <rect x="590" y="88" width="348" height="82" rx="8" class="worktree"/>
  <text x="604" y="109" class="sub">1. Micro-Horizon (5 min/step · 1 file · Scalar Metric)</text>
  <text x="604" y="128" class="mono">Karpathy autoresearch / KernelBench / pi-autoresearch</text>
  <text x="604" y="146" class="small">• Dense feedback (~12–20 trials/hr/GPU), zero spec ambiguity</text>
  <text x="604" y="162" class="small">• Transfers directly to 1.5B scale (−0.0155 val_bpb, +11% speed)</text>

  <!-- Tier 2 -->
  <rect x="590" y="182" width="348" height="86" rx="8" class="verifier"/>
  <text x="604" y="203" class="sub">2. Meso-Horizon (6–24 hr · Multi-file Pipeline)</text>
  <text x="604" y="222" class="mono">OpenAI MLE-bench (75 Kaggle comps) / RE-Bench</text>
  <text x="604" y="240" class="small">• AIDE tree search reaches ~16.9%–34%+ Kaggle medal rate</text>
  <text x="604" y="256" class="small">• Bottleneck shifts to validation leakage &amp; feature pipeline bugs</text>

  <!-- Tier 3 -->
  <rect x="590" y="280" width="348" height="90" rx="8" class="warn"/>
  <text x="604" y="301" class="sub">3. Macro-Horizon (48 hr · Zero-Repo Paper Replication)</text>
  <text x="604" y="320" class="mono">OpenAI PaperBench (20 ICML papers · 8,316 rubric nodes)</text>
  <text x="604" y="338" class="small">• Frontier agents score ~21.0% vs. 41.4% for ML PhDs (48h)</text>
  <text x="604" y="354" class="small">• Silent bug compounding across 20+ files without intermediate</text>
  <text x="604" y="366" class="small">  unit-level verifiers causes exponential trajectory divergence.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" width="900" height="370" font-family="Manrope, -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <linearGradient id="bgGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect width="900" height="370" rx="12" fill="url(#bgGrad2)" stroke="#334155" stroke-width="1.5"/>

  <!-- Left Panel: Greedy (1+1) Ratchet Trapped in Local Idea Basin -->
  <rect x="18" y="18" width="424" height="334" rx="8" fill="#0b1120" stroke="#334155" stroke-width="1"/>
  <text x="32" y="42" fill="#f8fafc" font-size="13" font-weight="700">A. Greedy (1+1) Ratchet: Local Idea Basin Trap</text>
  <text x="32" y="58" fill="#94a3b8" font-size="10.5">Monotonic accept rule rejects intermediate architectural bridges</text>

  <!-- Landscape curve showing Local Basin vs Global Basin -->
  <path d="M 45 140 Q 95 235, 155 215 Q 205 200, 240 125 Q 280 65, 315 160 Q 355 280, 410 250" fill="none" stroke="#475569" stroke-width="2"/>

  <!-- Local Basin points -->
  <circle cx="65" cy="172" r="5" fill="#10b981"/>
  <text x="65" y="160" fill="#a7f3d0" font-size="9" text-anchor="middle">p_0 (1.042)</text>

  <circle cx="115" cy="212" r="5" fill="#10b981"/>
  <text x="108" y="229" fill="#a7f3d0" font-size="9" text-anchor="middle">p_1 (1.028)</text>

  <circle cx="155" cy="215" r="6" fill="#f59e0b" stroke="#fff" stroke-width="1.2"/>
  <text x="155" y="234" fill="#fde68a" font-size="9.5" font-weight="700" text-anchor="middle">p_2 (1.022) STUCK</text>

  <!-- Rejected bridge node on the barrier -->
  <path d="M 155 209 Q 195 150, 232 135" fill="none" stroke="#f43f5e" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arrR)"/>
  <circle cx="238" cy="130" r="5.5" fill="#f43f5e"/>
  <text x="238" y="114" fill="#fda4af" font-size="9" font-weight="700" text-anchor="middle">p_2 + SwiGLU (1.034)</text>
  <text x="238" y="102" fill="#fda4af" font-size="8.5" text-anchor="middle">git reset --hard! (worse than 1.022)</text>

  <!-- Unreached Global Optimum -->
  <path d="M 244 132 Q 310 190, 362 258" fill="none" stroke="#38bdf8" stroke-width="1.4" stroke-dasharray="2,3"/>
  <circle cx="368" cy="262" r="6" fill="#38bdf8"/>
  <text x="368" y="280" fill="#38bdf8" font-size="9.5" font-weight="700" text-anchor="middle">p* SwiGLU + LR=0.015</text>
  <text x="368" y="293" fill="#bae6fd" font-size="9" text-anchor="middle">val_bpb = 0.994 (Unreachable!)</text>

  <!-- Explanation Box -->
  <rect x="34" y="304" width="392" height="36" rx="5" fill="#1e293b" stroke="#475569"/>
  <text x="230" y="319" fill="#e2e8f0" font-size="9.5" font-weight="600" text-anchor="middle">Epistasis Problem: Architecture edit A needs Optimizer edit B.</text>
  <text x="230" y="333" fill="#94a3b8" font-size="8.5" text-anchor="middle">Greedy ratchet requires J(p + A) &lt; J(p), killing A before B can be tested.</text>

  <!-- Right Panel: AIDE / AI Scientist v2 Code-Space Tree Search -->
  <rect x="458" y="18" width="424" height="334" rx="8" fill="#0b1120" stroke="#334155" stroke-width="1"/>
  <text x="472" y="42" fill="#f8fafc" font-size="13" font-weight="700">B. AIDE &amp; AI Scientist-v2: UCT Tree Search in Code Space</text>
  <text x="472" y="58" fill="#94a3b8" font-size="10.5">Operators: Draft (root), Debug (repair crash), Improve (UCT branch)</text>

  <!-- Root Node v0 -->
  <rect x="615" y="72" width="110" height="38" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="670" y="88" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">v_0: Baseline</text>
  <text x="670" y="102" fill="#cbd5e1" font-size="8.5" text-anchor="middle">bpb=1.042 | N=12</text>

  <!-- Level 1 Branches -->
  <line x1="635" y1="110" x2="535" y2="146" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrG)"/>
  <line x1="670" y1="110" x2="670" y2="146" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrB)"/>
  <line x1="705" y1="110" x2="800" y2="146" stroke="#f43f5e" stroke-width="1.5" marker-end="url(#arrR)"/>

  <!-- Node v1: Hyperparam basin -->
  <rect x="474" y="148" width="120" height="42" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.4"/>
  <text x="534" y="164" fill="#6ee7b7" font-size="9.5" font-weight="700" text-anchor="middle">v_1: Muon LR Sweep</text>
  <text x="534" y="177" fill="#d1fae5" font-size="8.5" text-anchor="middle">bpb=1.022 | n=9</text>
  <text x="534" y="187" fill="#94a3b8" font-size="8" text-anchor="middle">UCT = 1.00 + 0.46 = 1.46</text>

  <!-- Node v2: Architectural branch (lower n -> higher UCT!) -->
  <rect x="610" y="148" width="120" height="42" rx="6" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.8"/>
  <text x="670" y="164" fill="#7dd3fc" font-size="9.5" font-weight="700" text-anchor="middle">v_2: SwiGLU + GQA</text>
  <text x="670" y="177" fill="#e0f2fe" font-size="8.5" text-anchor="middle">bpb=1.026 | n=1</text>
  <text x="670" y="187" fill="#fde68a" font-size="8" font-weight="700" text-anchor="middle">UCT = 0.80 + 1.02 = 1.82 ★</text>

  <!-- Node v3: Buggy OOM Node -->
  <rect x="746" y="148" width="120" height="42" rx="6" fill="#4c0519" stroke="#f43f5e" stroke-width="1.4"/>
  <text x="806" y="164" fill="#fda4af" font-size="9.5" font-weight="700" text-anchor="middle">v_3: Value-Embed</text>
  <text x="806" y="177" fill="#ffe4e6" font-size="8.5" text-anchor="middle">STATUS: Shape Error</text>
  <text x="806" y="187" fill="#fda4af" font-size="8" text-anchor="middle">d_debug = 1 &lt; 3</text>

  <!-- Level 2 Branches from v2 and v3 -->
  <line x1="670" y1="190" x2="640" y2="230" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arrB)"/>
  <text x="622" y="214" fill="#7dd3fc" font-size="8.5" font-weight="700">Improve(v_2)</text>

  <line x1="806" y1="190" x2="806" y2="230" stroke="#f59e0b" stroke-width="1.6" marker-end="url(#arrA)"/>
  <text x="840" y="214" fill="#fde68a" font-size="8.5" font-weight="700">Debug(v_3)</text>

  <!-- Node v4: Joint winner under v2 -->
  <rect x="572" y="232" width="136" height="40" rx="6" fill="#065f46" stroke="#38bdf8" stroke-width="2"/>
  <text x="640" y="249" fill="#ffffff" font-size="9.5" font-weight="700" text-anchor="middle">v_4: SwiGLU + Retuned LR</text>
  <text x="640" y="264" fill="#6ee7b7" font-size="9" font-weight="700" text-anchor="middle">val_bpb = 0.994 (NEW BEST)</text>

  <!-- Node v5: Debugged v3 -->
  <rect x="742" y="232" width="124" height="40" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.4"/>
  <text x="804" y="249" fill="#a7f3d0" font-size="9.5" font-weight="700" text-anchor="middle">v_5: Fixed Tensor Broadcast</text>
  <text x="804" y="264" fill="#d1fae5" font-size="8.5" text-anchor="middle">val_bpb = 1.004 (Recovered!)</text>

  <!-- UCT Formula Box -->
  <rect x="474" y="284" width="392" height="54" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="670" y="301" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">AIDE UCT Selection Policy Over Git Commit Tree</text>
  <text x="670" y="318" fill="#38bdf8" font-size="9.5" font-weight="600" text-anchor="middle">v_next = argmax_{v ∈ T_valid} [ (J_0 - J(v)) / σ_J  +  c_puct · √(ln(1 + N(parent(v))) / (1 + n(v))) ]</text>
  <text x="670" y="331" fill="#94a3b8" font-size="8.5" text-anchor="middle">Balances exploitation of low-bpb commits with exploration of under-visited architectural branches</text>
</svg>

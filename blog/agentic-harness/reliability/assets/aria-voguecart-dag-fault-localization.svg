<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 390" width="920" height="390" font-family="Manrope, DejaVu Sans, -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <linearGradient id="bgRel1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arC3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arR3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
    <marker id="arG3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <rect width="920" height="390" rx="12" fill="url(#bgRel1)" stroke="#334155" stroke-width="1.5"/>

  <!-- Left Panel: Aria at VogueCart Multi-Step Execution DAG -->
  <rect x="18" y="18" width="434" height="354" rx="8" fill="#0b1120" stroke="#334155" stroke-width="1"/>
  <text x="32" y="42" fill="#f8fafc" font-size="13" font-weight="700">A. "Aria" at VogueCart: Execution DAG &amp; Spans</text>
  <text x="32" y="58" fill="#94a3b8" font-size="9.6">Tracing a cascading failure from Step-2 tool args to Step-4 output</text>

  <!-- Step 1: Intent & Attribute Planner -->
  <rect x="32" y="72" width="406" height="48" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.3"/>
  <text x="46" y="91" fill="#6ee7b7" font-size="9.8" font-weight="700">Step 1 · Intent &amp; Style Planner [span_01: PASS]</text>
  <text x="424" y="91" fill="#a7f3d0" font-size="8.2" font-weight="600" text-anchor="end">42 ms · conf=0.96</text>
  <text x="46" y="108" fill="#d1fae5" font-size="8.2">Query: "Breathable olive linen midi dress under $90 for humid weather"</text>

  <line x1="235" y1="120" x2="235" y2="134" stroke="#f43f5e" stroke-width="1.5" marker-end="url(#arR3)"/>

  <!-- Step 2: Parallel Tool Calls (Root Cause in Tool 2a) -->
  <rect x="32" y="138" width="406" height="68" rx="6" fill="#3f1d2e" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="46" y="157" fill="#fda4af" font-size="9.5" font-weight="700">Step 2 · Tool Dispatch [ROOT CAUSE t* = 2]</text>
  <text x="424" y="157" fill="#fecdd3" font-size="8.2" font-weight="700" text-anchor="end">0 hits returned!</text>
  <text x="46" y="175" fill="#ffe4e6" font-size="8.2">Tool: catalog_search(fabric="100%_linen", color="olive_drab", max_price=90)</text>
  <text x="46" y="192" fill="#fda4af" font-size="8.1" font-weight="600">Fault: Strict lexical filter "olive_drab" misses "sage/olive" CLIP vectors</text>

  <line x1="235" y1="206" x2="235" y2="220" stroke="#f43f5e" stroke-width="1.5" marker-end="url(#arR3)"/>

  <!-- Step 3: Fallback / Context Contamination -->
  <rect x="32" y="224" width="406" height="52" rx="6" fill="#451a03" stroke="#f59e0b" stroke-width="1.3"/>
  <text x="46" y="243" fill="#fde68a" font-size="9.8" font-weight="700">Step 3 · Unbounded Broad Fallback [span_03: CASCADE]</text>
  <text x="424" y="243" fill="#fef3c7" font-size="8.2" font-weight="600" text-anchor="end">Drops price &amp; fabric</text>
  <text x="46" y="261" fill="#fed7aa" font-size="8.2">Agent retries catalog_search(query="dress") -&gt; injects $240 polyester gowns</text>

  <line x1="235" y1="276" x2="235" y2="290" stroke="#f43f5e" stroke-width="1.5" marker-end="url(#arR3)"/>

  <!-- Step 4: Final Synthesis Failure -->
  <rect x="32" y="294" width="406" height="62" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1.3"/>
  <text x="46" y="313" fill="#e2e8f0" font-size="9.8" font-weight="700">Step 4 · Final Response Synthesis [span_04: SYMPTOM]</text>
  <text x="424" y="313" fill="#94a3b8" font-size="8.2" font-weight="600" text-anchor="end">Surface Failure</text>
  <text x="46" y="331" fill="#cbd5e1" font-size="8.2">Recommends $240 polyester gown; naive eval blames Step-4 synthesizer,</text>
  <text x="46" y="346" fill="#7dd3fc" font-size="8.2" font-weight="600">but DAG attribution pinpoints Step-2 strict enum filter as true root cause!</text>

  <!-- Right Panel: Counterfactual Step Replay & Attribution Math -->
  <rect x="468" y="18" width="434" height="354" rx="8" fill="#0b1120" stroke="#334155" stroke-width="1"/>
  <text x="482" y="42" fill="#f8fafc" font-size="13" font-weight="700">B. Counterfactual Step-Replay Localization</text>
  <text x="482" y="58" fill="#94a3b8" font-size="9.6">Finding the decisive fault step t* via interventional prefix replay</text>

  <!-- Mathematical Definition Box -->
  <rect x="484" y="72" width="402" height="84" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.3"/>
  <text x="685" y="92" fill="#a5b4fc" font-size="10" font-weight="700" text-anchor="middle">Interventional Success Probability Q(t) Along Failed Trace τ</text>
  <text x="685" y="112" fill="#f8fafc" font-size="9" font-weight="600" text-anchor="middle">Q(t) = P( Episode Pass | fix prefix τ_{1:t}, repair step a_t -&gt; a*_t )</text>
  <text x="498" y="131" fill="#e0e7ff" font-size="8.2">• Decisive Root-Cause Step t*: Step with maximum causal drop ΔQ(t) = Q(t-1) - Q(t)</text>
  <text x="498" y="146" fill="#c7d2fe" font-size="8.2">• Binary Search over Prefix Length T: Isolates t* in O(log2 T) sandbox replays</text>

  <!-- Step-by-Step Q(t) Cliff Visualization -->
  <rect x="484" y="168" width="402" height="106" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.3"/>
  <text x="685" y="187" fill="#7dd3fc" font-size="9.8" font-weight="700" text-anchor="middle">Causal Cliff Profile Across Steps t = 0..4 on Failed Trace</text>

  <text x="498" y="208" fill="#cbd5e1" font-size="8.2">t=1 (Planner):</text>
  <rect x="595" y="198" width="210" height="11" rx="3" fill="#10b981"/>
  <text x="813" y="208" fill="#6ee7b7" font-size="8.2" font-weight="700">Q(1) = 0.94</text>

  <text x="498" y="227" fill="#fda4af" font-size="8.2" font-weight="700">t=2 (Tool Call):</text>
  <rect x="595" y="217" width="28" height="11" rx="3" fill="#f43f5e"/>
  <text x="631" y="227" fill="#fda4af" font-size="8.2" font-weight="700">Q(2) = 0.08  [ΔQ(2) = -0.86 -&gt; ROOT CAUSE!]</text>

  <text x="498" y="246" fill="#cbd5e1" font-size="8.2">t=3 (Fallback):</text>
  <rect x="595" y="236" width="18" height="11" rx="3" fill="#64748b"/>
  <text x="621" y="246" fill="#94a3b8" font-size="8.2">Q(3) = 0.05  (already poisoned by t=2)</text>

  <text x="498" y="264" fill="#cbd5e1" font-size="8.2">t=4 (Synthesis):</text>
  <rect x="595" y="254" width="10" height="11" rx="3" fill="#64748b"/>
  <text x="613" y="264" fill="#94a3b8" font-size="8.2">Q(4) = 0.00  (cannot recover missing items)</text>

  <!-- OpenTelemetry Span Contract Box -->
  <rect x="484" y="286" width="402" height="72" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.3"/>
  <text x="685" y="305" fill="#6ee7b7" font-size="9.8" font-weight="700" text-anchor="middle">Mandatory Telemetry Fields Logged per Agent Span</text>
  <text x="498" y="323" fill="#d1fae5" font-size="8.2">• trace_id, parent_span_id, step_idx, prompt_hash, schema_version</text>
  <text x="498" y="338" fill="#d1fae5" font-size="8.2">• tool_name, canonical_args, result_count, status_code, latency_ms</text>
  <text x="498" y="352" fill="#a7f3d0" font-size="8.2" font-weight="600">• mean_arg_logprob, min_token_logprob (flags uncertain tool arguments)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 390" width="920" height="390" font-family="Manrope, DejaVu Sans, -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <linearGradient id="bgUnc2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arC4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arG4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <rect width="920" height="390" rx="12" fill="url(#bgUnc2)" stroke="#334155" stroke-width="1.5"/>

  <!-- Left Panel: Production Failure-to-Fix Flywheel -->
  <rect x="18" y="18" width="434" height="354" rx="8" fill="#0b1120" stroke="#334155" stroke-width="1"/>
  <text x="32" y="42" fill="#f8fafc" font-size="13" font-weight="700">A. Closed-Loop Failure-to-Fix Flywheel</text>
  <text x="32" y="58" fill="#94a3b8" font-size="9.6">Turning production anomalies into permanent guardrails &amp; CI tests</text>

  <!-- Stage 1 -->
  <rect x="32" y="72" width="406" height="46" rx="6" fill="#3f1d2e" stroke="#f43f5e" stroke-width="1.3"/>
  <text x="46" y="91" fill="#fda4af" font-size="9.5" font-weight="700">1. Online Failure Signal Capture</text>
  <text x="424" y="91" fill="#fecdd3" font-size="8.2" font-weight="600" text-anchor="end">Implicit + Explicit</text>
  <text x="46" y="108" fill="#ffe4e6" font-size="8.2">User re-queries in &lt;20s, zero-click bounce, or low confidence C_hat &lt; 0.45</text>

  <line x1="235" y1="118" x2="235" y2="130" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arC4)"/>

  <!-- Stage 2 -->
  <rect x="32" y="134" width="406" height="46" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.3"/>
  <text x="46" y="153" fill="#a5b4fc" font-size="9.5" font-weight="700">2. Automated Fault Localization &amp; Clustering</text>
  <text x="424" y="153" fill="#c7d2fe" font-size="8.2" font-weight="600" text-anchor="end">Isolates Step t*</text>
  <text x="46" y="170" fill="#e0e7ff" font-size="8.2">Groups failed traces by (failed_tool, fault_category, error_signature)</text>

  <line x1="235" y1="180" x2="235" y2="192" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arC4)"/>

  <!-- Stage 3 -->
  <rect x="32" y="196" width="406" height="52" rx="6" fill="#082f49" stroke="#38bdf8" stroke-width="1.3"/>
  <text x="46" y="215" fill="#7dd3fc" font-size="9.5" font-weight="700">3. Deterministic Guardrail Synthesis (Code &gt; Prompt)</text>
  <text x="424" y="215" fill="#bae6fd" font-size="8.2" font-weight="600" text-anchor="end">Hard Remediation</text>
  <text x="46" y="232" fill="#e0f2fe" font-size="8.2">Adds Pydantic validator, enum alias map, or FSM precondition check at t*</text>

  <line x1="235" y1="248" x2="235" y2="260" stroke="#10b981" stroke-width="1.5" marker-end="url(#arG4)"/>

  <!-- Stage 4 -->
  <rect x="32" y="264" width="406" height="88" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.4"/>
  <text x="46" y="284" fill="#6ee7b7" font-size="9.5" font-weight="700">4. Golden Regression Ratchet &amp; Fine-Tuning Pair Export</text>
  <text x="424" y="284" fill="#a7f3d0" font-size="8.2" font-weight="600" text-anchor="end">Permanent Lock</text>
  <text x="46" y="302" fill="#d1fae5" font-size="8.2">• Sanitizes PII and freezes (x, S_0, expected_ΔS_db) into CI Tier-A suite</text>
  <text x="46" y="319" fill="#d1fae5" font-size="8.2">• Exports (x, y_repaired, y_failed) as an on-policy DPO preference pair</text>
  <text x="46" y="336" fill="#a7f3d0" font-size="8.2" font-weight="600">-&gt; Ensures the same failure mode can never regress in future releases</text>

  <!-- Right Panel: Verbalized vs Logprob Calibration & Fix Hierarchy -->
  <rect x="468" y="18" width="434" height="354" rx="8" fill="#0b1120" stroke="#334155" stroke-width="1"/>
  <text x="482" y="42" fill="#f8fafc" font-size="13" font-weight="700">B. Calibration Quality &amp; Remediation Matrix</text>
  <text x="482" y="58" fill="#94a3b8" font-size="9.6">Why verbalized confidence fails and how to map faults to fixes</text>

  <!-- Comparison of Confidence Signals -->
  <rect x="484" y="72" width="402" height="114" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
  <text x="685" y="92" fill="#f8fafc" font-size="9.8" font-weight="700" text-anchor="middle">Failure Prediction Power Across 4 Uncertainty Signals</text>

  <text x="498" y="114" fill="#fda4af" font-size="8.2">Verbalized ("95% sure"):</text>
  <rect x="632" y="104" width="90" height="11" rx="3" fill="#f43f5e"/>
  <text x="730" y="114" fill="#fda4af" font-size="8.1" font-weight="600">AUROC = 0.56 (Biased)</text>

  <text x="498" y="134" fill="#fde68a" font-size="8.2">Raw Mean Token Logprob:</text>
  <rect x="632" y="124" width="118" height="11" rx="3" fill="#f59e0b"/>
  <text x="758" y="134" fill="#fde68a" font-size="8.1" font-weight="600">AUROC = 0.72 (Noisy)</text>

  <text x="498" y="154" fill="#7dd3fc" font-size="8.2">Value-Token Min Logprob:</text>
  <rect x="632" y="144" width="142" height="11" rx="3" fill="#38bdf8"/>
  <text x="782" y="154" fill="#7dd3fc" font-size="8.1" font-weight="600">AUROC = 0.84</text>

  <text x="498" y="174" fill="#6ee7b7" font-size="8.2" font-weight="700">Platt Logprob + Retrieval:</text>
  <rect x="632" y="164" width="154" height="11" rx="3" fill="#10b981"/>
  <text x="794" y="174" fill="#6ee7b7" font-size="8.1" font-weight="700">AUROC = 0.89 (Best)</text>

  <!-- Mapping Failures to Engineering Fixes -->
  <rect x="484" y="198" width="402" height="154" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.3"/>
  <text x="685" y="218" fill="#7dd3fc" font-size="10" font-weight="700" text-anchor="middle">Deterministic Fix Hierarchy (Never Fix Schema Bugs with Prompts)</text>
  <text x="498" y="239" fill="#e2e8f0" font-size="8.2">• Fault: Malformed JSON / Hallucinated Enum Value</text>
  <text x="510" y="254" fill="#6ee7b7" font-size="8.1" font-weight="600">-&gt; Fix: Constrained grammar decoding (FSM) + Pydantic alias normalizer</text>
  <text x="498" y="274" fill="#e2e8f0" font-size="8.2">• Fault: Skipped Precondition Tool (e.g., refund before eligibility check)</text>
  <text x="510" y="289" fill="#6ee7b7" font-size="8.1" font-weight="600">-&gt; Fix: Harness state-machine guard blocking tool B until tool A succeeds</text>
  <text x="498" y="309" fill="#e2e8f0" font-size="8.2">• Fault: Ambiguous User Query Leading to Wrong Tool Branch</text>
  <text x="510" y="324" fill="#6ee7b7" font-size="8.1" font-weight="600">-&gt; Fix: Confidence-gated clarification prompt when C_hat(t) in [0.45, 0.82)</text>
  <text x="498" y="342" fill="#94a3b8" font-size="8">Rule: Prompts shape priors; deterministic code enforces invariants.</text>
</svg>

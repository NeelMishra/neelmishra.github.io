<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 390" width="920" height="390" font-family="Manrope, DejaVu Sans, -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <linearGradient id="bgRel2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="920" height="390" rx="12" fill="url(#bgRel2)" stroke="#334155" stroke-width="1.5"/>

  <!-- Left Panel: Fault Taxonomy & Engineering Fixes in Aria at VogueCart -->
  <rect x="18" y="18" width="434" height="354" rx="8" fill="#0b1120" stroke="#334155" stroke-width="1"/>
  <text x="32" y="42" fill="#f8fafc" font-size="13" font-weight="700">A. Root-Cause Taxonomy in "Aria" (1,200 Traces)</text>
  <text x="32" y="58" fill="#94a3b8" font-size="9.6">Distribution of first decisive failure step t* before harness hardening</text>

  <!-- Mode 1: 34% -->
  <rect x="32" y="72" width="406" height="64" rx="6" fill="#3f1d2e" stroke="#f43f5e" stroke-width="1.3"/>
  <text x="46" y="91" fill="#fda4af" font-size="9.5" font-weight="700">1. Tool Schema &amp; Enum Drift (34% of faults)</text>
  <text x="424" y="91" fill="#fecdd3" font-size="8.4" font-weight="700" text-anchor="end">Step t* = 2</text>
  <text x="46" y="108" fill="#ffe4e6" font-size="8.2">Cause: LLM invents non-existent filter values ("olive_drab", "midi_length")</text>
  <text x="46" y="124" fill="#6ee7b7" font-size="8.2" font-weight="600">Fix: Constrained enum decoding + embedding soft-match fallback on filters</text>

  <!-- Mode 2: 29% -->
  <rect x="32" y="144" width="406" height="64" rx="6" fill="#451a03" stroke="#f59e0b" stroke-width="1.3"/>
  <text x="46" y="163" fill="#fde68a" font-size="9.5" font-weight="700">2. Over-Constrained Zero-Recall (29% of faults)</text>
  <text x="424" y="163" fill="#fef3c7" font-size="8.4" font-weight="700" text-anchor="end">Step t* = 2..3</text>
  <text x="46" y="180" fill="#fed7aa" font-size="8.2">Cause: Combining 6+ strict AND filters yields 0 hits; naive retry drops all</text>
  <text x="46" y="196" fill="#6ee7b7" font-size="8.2" font-weight="600">Fix: Deterministic progressive filter relaxation (keep price + category)</text>

  <!-- Mode 3: 21% -->
  <rect x="32" y="216" width="406" height="64" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.3"/>
  <text x="46" y="235" fill="#a5b4fc" font-size="9.5" font-weight="700">3. Multi-Turn Slot Amnesia (21% of faults)</text>
  <text x="424" y="235" fill="#c7d2fe" font-size="8.4" font-weight="700" text-anchor="end">Step t* = 1</text>
  <text x="46" y="252" fill="#e0e7ff" font-size="8.2">Cause: Turn-4 refinement ("show it in navy") forgets Turn-1 size/budget</text>
  <text x="46" y="268" fill="#6ee7b7" font-size="8.2" font-weight="600">Fix: Explicit structured SessionState slot ledger merged before tool call</text>

  <!-- Mode 4: 16% -->
  <rect x="32" y="288" width="406" height="68" rx="6" fill="#082f49" stroke="#38bdf8" stroke-width="1.3"/>
  <text x="46" y="307" fill="#7dd3fc" font-size="9.5" font-weight="700">4. Late Attribute Hallucination (16% of faults)</text>
  <text x="424" y="307" fill="#bae6fd" font-size="8.4" font-weight="700" text-anchor="end">Step t* = 4</text>
  <text x="46" y="324" fill="#e0f2fe" font-size="8.2">Cause: Synthesizer claims item is "machine-washable" when spec is silent</text>
  <text x="46" y="340" fill="#6ee7b7" font-size="8.2" font-weight="600">Fix: Post-generation SKU attribute cross-check against retrieved JSON</text>

  <!-- Right Panel: VogueCart Production Impact & Metrics -->
  <rect x="468" y="18" width="434" height="354" rx="8" fill="#0b1120" stroke="#334155" stroke-width="1"/>
  <text x="482" y="42" fill="#f8fafc" font-size="13" font-weight="700">B. Production Impact on "Aria" at VogueCart</text>
  <text x="482" y="58" fill="#94a3b8" font-size="9.6">Online A/B &amp; reliability improvements after step-level fault hardening</text>

  <!-- Top KPI Cards -->
  <rect x="484" y="72" width="194" height="78" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.4"/>
  <text x="581" y="96" fill="#a7f3d0" font-size="9.2" font-weight="700" text-anchor="middle">Engaged Monthly Active Users</text>
  <text x="581" y="122" fill="#ecfdf5" font-size="20" font-weight="800" text-anchor="middle">+58.86%</text>
  <text x="581" y="140" fill="#6ee7b7" font-size="8" text-anchor="middle">Multi-turn styling &amp; discovery sessions</text>

  <rect x="692" y="72" width="194" height="78" rx="6" fill="#082f49" stroke="#38bdf8" stroke-width="1.4"/>
  <text x="789" y="96" fill="#bae6fd" font-size="9.2" font-weight="700" text-anchor="middle">7-Day Repeat User Retention</text>
  <text x="789" y="122" fill="#e0f2fe" font-size="20" font-weight="800" text-anchor="middle">+31.74%</text>
  <text x="789" y="140" fill="#7dd3fc" font-size="8" text-anchor="middle">Driven by zero-dead-end tool recovery</text>

  <!-- Reliability Before/After Table Box -->
  <rect x="484" y="164" width="402" height="110" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
  <text x="685" y="184" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">Step-Level Reliability Metrics: Before vs. After Hardening</text>
  <text x="498" y="204" fill="#e2e8f0" font-size="8.3">• Tool Argument Schema Failure Rate:   11.8% (v0)  -&gt;  1.4% (v1)  (-88.1%)</text>
  <text x="498" y="222" fill="#e2e8f0" font-size="8.3">• Zero-Hit Search Dead-End Rate:       18.2% (v0)  -&gt;  2.7% (v1)  (-85.2%)</text>
  <text x="498" y="240" fill="#e2e8f0" font-size="8.3">• Multi-Turn Constraint Retention:     64.0% (v0)  -&gt;  94.8% (v1) (+30.8 pts)</text>
  <text x="498" y="258" fill="#6ee7b7" font-size="8.3" font-weight="700">• Episode Pass^5 Consistency:          41.2% (v0)  -&gt;  83.5% (v1) (+42.3 pts)</text>

  <!-- Debugging Protocol Summary -->
  <rect x="484" y="286" width="402" height="72" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.3"/>
  <text x="685" y="305" fill="#fde68a" font-size="9.8" font-weight="700" text-anchor="middle">3-Step Production Triage Protocol When an Agent Run Fails</text>
  <text x="498" y="323" fill="#e2e8f0" font-size="8.2">1. Check Span Invariants: Did any tool return 0 hits, HTTP 5xx, or AST error?</text>
  <text x="498" y="338" fill="#e2e8f0" font-size="8.2">2. Run Counterfactual Bisection: Replay prefix τ_{1:t} to isolate cliff ΔQ(t*).</text>
  <text x="498" y="352" fill="#fde68a" font-size="8.2" font-weight="600">3. Convert t* into a Guardrail + Locked Regression Test in CI Suite.</text>
</svg>

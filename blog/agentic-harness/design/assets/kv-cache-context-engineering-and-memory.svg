<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img" aria-label="KV-Cache-Friendly Context Layout and Multi-Tier Agent Memory Architecture">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; stroke-width: 1.5; rx: 12; }
      .box-red { fill: #281419; stroke: #f85149; stroke-width: 1.5; rx: 8; }
      .box-blue { fill: #122136; stroke: #58a6ff; stroke-width: 1.5; rx: 8; }
      .box-green { fill: #11261e; stroke: #3fb950; stroke-width: 1.5; rx: 8; }
      .box-amber { fill: #271e12; stroke: #d29922; stroke-width: 1.5; rx: 8; }
      .box-purple { fill: #211832; stroke: #a371f7; stroke-width: 1.5; rx: 8; }
      .box-neutral { fill: #1c2128; stroke: #484f58; stroke-width: 1.2; rx: 6; }
      .title { font-family: 'Manrope', 'DejaVu Sans', sans-serif; font-size: 18px; font-weight: 800; fill: #f0f6fc; }
      .subtitle { font-family: 'Manrope', 'DejaVu Sans', sans-serif; font-size: 12.5px; font-weight: 500; fill: #8b949e; }
      .sec-hdr { font-family: 'Manrope', 'DejaVu Sans', sans-serif; font-size: 14px; font-weight: 700; fill: #e6edf3; }
      .lbl-bold { font-family: 'Manrope', 'DejaVu Sans', sans-serif; font-size: 12px; font-weight: 700; fill: #f0f6fc; }
      .lbl { font-family: 'Manrope', 'DejaVu Sans', sans-serif; font-size: 11px; font-weight: 500; fill: #c9d1d9; }
      .mono { font-family: 'JetBrains Mono', 'DejaVu Sans Mono', monospace; font-size: 10.5px; fill: #79c0ff; }
      .mono-sm { font-family: 'JetBrains Mono', 'DejaVu Sans Mono', monospace; font-size: 9.8px; fill: #a5d6ff; }
      .mono-green { font-family: 'JetBrains Mono', 'DejaVu Sans Mono', monospace; font-size: 10.5px; font-weight: 700; fill: #56d364; }
      .mono-red { font-family: 'JetBrains Mono', 'DejaVu Sans Mono', monospace; font-size: 10.5px; font-weight: 700; fill: #ff7b72; }
      .mono-amber { font-family: 'JetBrains Mono', 'DejaVu Sans Mono', monospace; font-size: 10px; font-weight: 700; fill: #e3b341; }
      .edge-blue { stroke: #58a6ff; stroke-width: 1.8; fill: none; }
      .edge-green { stroke: #3fb950; stroke-width: 1.8; fill: none; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#58a6ff"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#3fb950"/>
    </marker>
  </defs>

  <rect width="1120" height="620" class="bg"/>

  <!-- Main Header -->
  <text x="28" y="34" class="title">Context Engineering &amp; Memory: KV-Cache Prefix Stability &amp; Multi-Tier Agent Memory</text>
  <text x="28" y="54" class="subtitle">Preserving 92.4% vLLM PagedAttention block cache hit rates while orchestrating Working, Episodic, and Semantic Memory</text>

  <!-- TOP PANEL: KV-Cache Context Layout -->
  <rect x="24" y="72" width="1072" height="248" class="panel"/>
  <text x="44" y="98" class="sec-hdr">A. PagedAttention KV-Cache Prefix Hashing: H(b_k) = SHA256(H(b_{k-1}) || tokens(b_k))</text>

  <!-- Row 1: Anti-Pattern -->
  <rect x="44" y="112" width="1032" height="82" class="box-red"/>
  <text x="60" y="132" class="lbl-bold">Anti-Pattern: Dynamic Header Mutation Invalidates Entire KV Cache (Hit Rate: 14.2% | TTFT: 690 ms)</text>

  <rect x="60" y="142" width="210" height="40" class="box-neutral"/>
  <text x="165" y="159" text-anchor="middle" class="mono-red">b_0: timestamp=14:03:19.412Z</text>
  <text x="165" y="174" text-anchor="middle" class="lbl">Mutates every step -> HASH MISS</text>

  <rect x="282" y="142" width="234" height="40" class="box-neutral"/>
  <text x="399" y="159" text-anchor="middle" class="mono-red">b_1..b_90: Re-ordered Tools</text>
  <text x="399" y="174" text-anchor="middle" class="lbl">Cascading KV block invalidation</text>

  <rect x="528" y="142" width="256" height="40" class="box-neutral"/>
  <text x="656" y="159" text-anchor="middle" class="mono-red">b_91..b_180: Rewritten Summary</text>
  <text x="656" y="174" text-anchor="middle" class="lbl">Shifts all historical token offsets</text>

  <rect x="796" y="142" width="264" height="40" class="box-neutral"/>
  <text x="928" y="159" text-anchor="middle" class="mono-red">Full O(N^2) Prefill Every Turn</text>
  <text x="928" y="174" text-anchor="middle" class="lbl">8,400 tokens recomputed on GPU</text>

  <!-- Row 2: Production Append-Only Layout -->
  <rect x="44" y="206" width="1032" height="98" class="box-green"/>
  <text x="60" y="226" class="lbl-bold">Production Append-Only Context Layout (Hit Rate: 92.4% | TTFT: 180 ms | 3.8x Faster Prefill)</text>

  <rect x="60" y="236" width="268" height="54" class="box-blue"/>
  <text x="194" y="254" text-anchor="middle" class="lbl-bold">Zone 1: Frozen Prefix (b_0..b_180)</text>
  <text x="194" y="270" text-anchor="middle" class="mono-sm">System Prompt + Sorted Tool Schemas</text>
  <text x="194" y="283" text-anchor="middle" class="mono-green">100% Global KV Cache Hit (~2,880 tok)</text>

  <rect x="340" y="236" width="232" height="54" class="box-purple"/>
  <text x="456" y="254" text-anchor="middle" class="lbl-bold">Zone 2: Session Header (b_181..210)</text>
  <text x="456" y="270" text-anchor="middle" class="mono-sm">Semantic Profile + Day-Level Date</text>
  <text x="456" y="283" text-anchor="middle" class="mono-green">100% Session Cache Hit (~480 tok)</text>

  <rect x="584" y="236" width="256" height="54" class="box-neutral"/>
  <text x="712" y="254" text-anchor="middle" class="lbl-bold">Zone 3: Append-Only Turns (1..t-1)</text>
  <text x="712" y="270" text-anchor="middle" class="mono-sm">Compacted Digest at M=6 Checkpoint</text>
  <text x="712" y="283" text-anchor="middle" class="mono-green">Cached Prefix Across Steps</text>

  <rect x="852" y="236" width="208" height="54" class="box-amber"/>
  <text x="956" y="254" text-anchor="middle" class="lbl-bold">Zone 4: New Delta (Step t)</text>
  <text x="956" y="270" text-anchor="middle" class="mono-sm">Slot Ledger + Latest Obs o_t</text>
  <text x="956" y="283" text-anchor="middle" class="mono-amber">Only ~320 New Tokens Prefilled</text>

  <!-- BOTTOM PANEL: Multi-Tier Memory Architecture -->
  <rect x="24" y="336" width="1072" height="262" class="panel"/>
  <text x="44" y="362" class="sec-hdr">B. Multi-Tier Agent Memory Hierarchy: Working, Episodic, and Semantic Stores</text>

  <!-- Tier 1: Working Memory -->
  <rect x="44" y="378" width="328" height="202" class="box-blue"/>
  <text x="62" y="402" class="lbl-bold">1. Working Memory (In-Context Ledger)</text>
  <text x="62" y="420" class="mono-sm">Scope: Active Session | Latency: 0 ms (RAM)</text>
  <rect x="60" y="432" width="296" height="96" class="box-neutral"/>
  <text x="72" y="450" class="mono-sm">{ "intent": "compare_shirts",</text>
  <text x="72" y="466" class="mono-sm">  "hard_constraints": {</text>
  <text x="72" y="482" class="mono-sm">    "max_price_usd": 90.0, "size": "M",</text>
  <text x="72" y="498" class="mono-sm">    "exclude_fabric": ["polyester"] },</text>
  <text x="72" y="514" class="mono-sm">  "active_skus": ["VC-8821", "VC-8904"] }</text>
  <text x="62" y="550" class="lbl">Prevents mid-trajectory constraint drift;</text>
  <text x="62" y="566" class="lbl">verified deterministically before synthesis.</text>

  <!-- Tier 2: Episodic Memory -->
  <rect x="396" y="378" width="336" height="202" class="box-purple"/>
  <text x="414" y="402" class="lbl-bold">2. Episodic Memory (Past Experience Index)</text>
  <text x="414" y="420" class="mono-sm">Scope: Cross-Session | Hybrid Vector + Decay</text>
  <rect x="412" y="432" width="304" height="96" class="box-neutral"/>
  <text x="424" y="452" class="mono">Retrieval Scoring Function:</text>
  <text x="424" y="470" class="mono-sm">S(m_i, q) = alpha * cos(e_q, e_i)</text>
  <text x="424" y="486" class="mono-sm">          + beta * exp(-lambda * dt)</text>
  <text x="424" y="502" class="mono-sm">          + gamma * Importance(m_i)</text>
  <text x="424" y="518" class="mono-amber">Ex: "Returned Size S Silk Blouse (tight fit)"</text>
  <text x="414" y="550" class="lbl">Recalls concrete past resolution trajectories</text>
  <text x="414" y="566" class="lbl">with exponential half-life decay tau_{1/2}.</text>

  <!-- Tier 3: Semantic & Procedural Memory -->
  <rect x="756" y="378" width="320" height="202" class="box-green"/>
  <text x="774" y="402" class="lbl-bold">3. Semantic Memory (Typed Fact Store)</text>
  <text x="774" y="420" class="mono-sm">Scope: Persistent Profile | KV / Relational</text>
  <rect x="772" y="432" width="288" height="96" class="box-neutral"/>
  <text x="784" y="452" class="mono-green">Schema-Governed Fact Triples:</text>
  <text x="784" y="470" class="mono-sm">(user_882, shirt_size, "M", conf=0.96)</text>
  <text x="784" y="486" class="mono-sm">(user_882, loyalty_tier, "GOLD", 1.00)</text>
  <text x="784" y="502" class="mono-sm">(user_882, climate_zone, "tropical", 0.91)</text>
  <text x="784" y="518" class="mono-sm">Upsert policy: Temporal versioned TTL</text>
  <text x="774" y="550" class="lbl">Resolves conflicting preferences cleanly via</text>
  <text x="774" y="566" class="lbl">deterministic key-value upserts + provenance.</text>
</svg>

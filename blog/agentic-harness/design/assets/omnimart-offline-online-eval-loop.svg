<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img" aria-label="OmniMart 4-Layer Offline and Online Agent Evaluation System">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; stroke-width: 1.5; rx: 12; }
      .box-blue { fill: #122136; stroke: #58a6ff; stroke-width: 1.5; rx: 8; }
      .box-green { fill: #11261e; stroke: #3fb950; stroke-width: 1.5; rx: 8; }
      .box-amber { fill: #271e12; stroke: #d29922; stroke-width: 1.5; rx: 8; }
      .box-purple { fill: #211832; stroke: #a371f7; stroke-width: 1.5; rx: 8; }
      .box-neutral { fill: #1c2128; stroke: #484f58; stroke-width: 1.2; rx: 6; }
      .title { font-family: 'Manrope', 'DejaVu Sans', sans-serif; font-size: 18px; font-weight: 800; fill: #f0f6fc; }
      .subtitle { font-family: 'Manrope', 'DejaVu Sans', sans-serif; font-size: 12.5px; font-weight: 500; fill: #8b949e; }
      .sec-hdr { font-family: 'Manrope', 'DejaVu Sans', sans-serif; font-size: 14px; font-weight: 700; fill: #e6edf3; }
      .lbl-bold { font-family: 'Manrope', 'DejaVu Sans', sans-serif; font-size: 12px; font-weight: 700; fill: #f0f6fc; }
      .lbl { font-family: 'Manrope', 'DejaVu Sans', sans-serif; font-size: 11px; font-weight: 500; fill: #c9d1d9; }
      .mono { font-family: 'JetBrains Mono', 'DejaVu Sans Mono', monospace; font-size: 10.5px; fill: #79c0ff; }
      .mono-sm { font-family: 'JetBrains Mono', 'DejaVu Sans Mono', monospace; font-size: 9.8px; fill: #a5d6ff; }
      .mono-green { font-family: 'JetBrains Mono', 'DejaVu Sans Mono', monospace; font-size: 10.5px; font-weight: 700; fill: #56d364; }
      .mono-amber { font-family: 'JetBrains Mono', 'DejaVu Sans Mono', monospace; font-size: 10px; font-weight: 700; fill: #e3b341; }
      .edge-blue { stroke: #58a6ff; stroke-width: 1.8; fill: none; }
      .edge-green { stroke: #3fb950; stroke-width: 1.8; fill: none; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#58a6ff"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#3fb950"/>
    </marker>
  </defs>

  <rect width="1120" height="620" class="bg"/>

  <!-- Main Header -->
  <text x="28" y="34" class="title">Evaluating OmniMart's Shopping Agent: 4-Layer Offline-to-Online Verification Loop</text>
  <text x="28" y="54" class="subtitle">Connecting deterministic trajectory sandboxes, IR ranking metrics, calibrated LLM judges, and return-adjusted online A/B tests</text>

  <!-- 2x2 Grid of Evaluation Layers -->

  <!-- LAYER 1: Top-Left -->
  <rect x="24" y="74" width="524" height="248" class="panel"/>
  <rect x="40" y="90" width="492" height="216" class="box-blue"/>
  <text x="58" y="114" class="sec-hdr">Layer 1: Stateful Trajectory Sandbox Suite (N = 1,500 CI Gate)</text>
  <text x="58" y="134" class="lbl">Deterministic snapshot of catalog, inventory, and voucher DBs across 6 slices:</text>

  <rect x="58" y="146" width="220" height="74" class="box-neutral"/>
  <text x="70" y="166" class="lbl-bold">Trajectory &amp; Tool Metrics</text>
  <text x="70" y="184" class="mono-sm">- Tool DAG AST F1 &gt;= 0.96</text>
  <text x="70" y="200" class="mono-sm">- Pass^5 Reliability &gt;= 0.88</text>
  <text x="70" y="214" class="mono-sm">- Slot Retention SRR_8 &gt;= 0.98</text>

  <rect x="294" y="146" width="220" height="74" class="box-neutral"/>
  <text x="306" y="166" class="lbl-bold">Hard-Constraint Satisfaction</text>
  <text x="306" y="184" class="mono-green">HCSR@5 &gt;= 99.2%</text>
  <text x="306" y="200" class="mono-sm">100% of top-5 SKUs obey</text>
  <text x="306" y="214" class="mono-sm">price, size &amp; SLA constraints</text>

  <text x="58" y="244" class="mono">Slices: Multi-constraint | 0-hit relaxation | Visual search | Constraint</text>
  <text x="58" y="262" class="mono">reversal | Seller prompt injection | Ambiguous query clarification</text>
  <text x="58" y="286" class="mono-green">Gate: Blocks any PR with HCSR@5 regression &gt; 0.2% or injection leak</text>

  <!-- LAYER 2: Top-Right -->
  <rect x="572" y="74" width="524" height="248" class="panel"/>
  <rect x="588" y="90" width="492" height="216" class="box-purple"/>
  <text x="606" y="114" class="sec-hdr">Layer 2: Retrieval &amp; Ranking Evaluation (25,000 Sessions)</text>
  <text x="606" y="134" class="lbl">Graded relevance labels: y in {0: skip, 1: click, 2: cart, 3: kept purchase}</text>

  <rect x="606" y="146" width="220" height="74" class="box-neutral"/>
  <text x="618" y="166" class="lbl-bold">Stage 1: Hybrid Candidate Pool</text>
  <text x="618" y="184" class="mono-sm">- BM25 + CLIP HNSW (RRF k=60)</text>
  <text x="618" y="200" class="mono-green">- Recall@200 &gt;= 0.94</text>
  <text x="618" y="214" class="mono-sm">- Attribute Filter Latency &lt; 25ms</text>

  <rect x="842" y="146" width="220" height="74" class="box-neutral"/>
  <text x="854" y="166" class="lbl-bold">Stage 2: Cross-Encoder + MMR</text>
  <text x="854" y="184" class="mono-green">- nDCG@10 &gt;= 0.81 | MRR &gt;= 0.68</text>
  <text x="854" y="200" class="mono-sm">- Intra-List Diversity ILD@5</text>
  <text x="854" y="214" class="mono-sm">- Zero duplicate colorway spam</text>

  <text x="606" y="244" class="mono">Hard Negative Evaluation: Same brand + category but wrong material,</text>
  <text x="606" y="262" class="mono">wrong heel drop, or out-of-stock user size (tests fine-grained CLIP)</text>
  <text x="606" y="286" class="mono-green">Gate: Requires statistically significant nDCG@10 lift or parity</text>

  <!-- LAYER 3: Bottom-Left -->
  <rect x="24" y="346" width="524" height="250" class="panel"/>
  <rect x="40" y="362" width="492" height="218" class="box-amber"/>
  <text x="58" y="386" class="sec-hdr">Layer 3: Calibrated LLM-as-Judge &amp; Paired Significance</text>
  <text x="58" y="406" class="lbl">3 Decomposed Rubrics aligned with human merchandisers (Kappa &gt;= 0.82):</text>

  <rect x="58" y="418" width="456" height="78" class="box-neutral"/>
  <text x="72" y="438" class="mono-sm">1. Factual &amp; Review Entailment: Every claim backed by tool JSON</text>
  <text x="72" y="456" class="mono-sm">2. Comparison Utility: Highlights concrete trade-offs (weight, drop, $)</text>
  <text x="72" y="474" class="mono-sm">3. Clarification Precision: Asks if &amp; only if critical slot is missing</text>
  <text x="72" y="489" class="mono-amber">Debiasing: Rogan-Gladen p_hat = (q_hat + q_0 - 1) / (q_1 + q_0 - 1)</text>

  <text x="58" y="520" class="lbl">Statistical Release Protocol (N = 1,500 paired queries):</text>
  <text x="58" y="540" class="mono-sm">Paired t-test + Wilcoxon signed-rank + 10,000-iter BCa Bootstrap</text>
  <text x="58" y="558" class="mono-green">Holm-Bonferroni FWER alpha = 0.05 across all rubric dimensions</text>

  <!-- LAYER 4: Bottom-Right -->
  <rect x="572" y="346" width="524" height="250" class="panel"/>
  <rect x="588" y="362" width="492" height="218" class="box-green"/>
  <text x="606" y="386" class="sec-hdr">Layer 4: Online Interleaving &amp; Return-Adjusted A/B Tests</text>
  <text x="606" y="406" class="lbl">Two-stage online rollout protecting marketplace unit economics:</text>

  <rect x="606" y="418" width="220" height="82" class="box-neutral"/>
  <text x="618" y="438" class="lbl-bold">North-Star Business Metrics</text>
  <text x="618" y="456" class="mono-green">- Session Purchase CVR (+%)</text>
  <text x="618" y="472" class="mono-green">- Net GMV / Session (post-return)</text>
  <text x="618" y="488" class="mono-green">- 14-Day Repeat Assistant MAU</text>

  <rect x="842" y="418" width="220" height="82" class="box-neutral"/>
  <text x="854" y="438" class="lbl-bold">Hard Online Guardrails</text>
  <text x="854" y="456" class="mono-amber">- 30-Day Size/Fit Return Rate</text>
  <text x="854" y="472" class="mono-amber">- Price Discrepancy Report Rate</text>
  <text x="854" y="488" class="mono-amber">- p95 TTFT &lt;= 1,150 ms SLA</text>

  <text x="606" y="522" class="lbl">Phase 1 (3d): Team-Draft Interleaving of Top-5 SKU cards (10x power)</text>
  <text x="606" y="540" class="lbl">Phase 2 (14d): Stratified User-Clustered A/B + CUPED variance reduction</text>
  <text x="606" y="558" class="mono-green">Feedback Flywheel: Low-margin / thumbs-down traces -&gt; Layer 1 CI</text>
</svg>

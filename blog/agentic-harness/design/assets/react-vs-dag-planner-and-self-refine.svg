<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img" aria-label="Sequential ReAct vs Parallel DAG Planner and Verifier-Guided Self-Refine Loop">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; stroke-width: 1.5; rx: 12; }
      .box-red { fill: #281419; stroke: #f85149; stroke-width: 1.5; rx: 8; }
      .box-blue { fill: #122136; stroke: #58a6ff; stroke-width: 1.5; rx: 8; }
      .box-green { fill: #11261e; stroke: #3fb950; stroke-width: 1.5; rx: 8; }
      .box-amber { fill: #271e12; stroke: #d29922; stroke-width: 1.5; rx: 8; }
      .box-purple { fill: #211832; stroke: #a371f7; stroke-width: 1.5; rx: 8; }
      .box-neutral { fill: #1c2128; stroke: #484f58; stroke-width: 1.2; rx: 6; }
      .title { font-family: 'Manrope', 'DejaVu Sans', sans-serif; font-size: 18px; font-weight: 800; fill: #f0f6fc; }
      .subtitle { font-family: 'Manrope', 'DejaVu Sans', sans-serif; font-size: 12.5px; font-weight: 500; fill: #8b949e; }
      .sec-hdr { font-family: 'Manrope', 'DejaVu Sans', sans-serif; font-size: 14px; font-weight: 700; fill: #e6edf3; }
      .lbl-bold { font-family: 'Manrope', 'DejaVu Sans', sans-serif; font-size: 12px; font-weight: 700; fill: #f0f6fc; }
      .lbl { font-family: 'Manrope', 'DejaVu Sans', sans-serif; font-size: 11px; font-weight: 500; fill: #c9d1d9; }
      .mono { font-family: 'JetBrains Mono', 'DejaVu Sans Mono', monospace; font-size: 10.5px; fill: #79c0ff; }
      .mono-sm { font-family: 'JetBrains Mono', 'DejaVu Sans Mono', monospace; font-size: 9.8px; fill: #a5d6ff; }
      .mono-green { font-family: 'JetBrains Mono', 'DejaVu Sans Mono', monospace; font-size: 10.5px; font-weight: 700; fill: #56d364; }
      .mono-red { font-family: 'JetBrains Mono', 'DejaVu Sans Mono', monospace; font-size: 10.5px; font-weight: 700; fill: #ff7b72; }
      .mono-amber { font-family: 'JetBrains Mono', 'DejaVu Sans Mono', monospace; font-size: 10px; font-weight: 700; fill: #e3b341; }
      .edge { stroke: #8b949e; stroke-width: 1.6; fill: none; }
      .edge-blue { stroke: #58a6ff; stroke-width: 1.8; fill: none; }
      .edge-green { stroke: #3fb950; stroke-width: 1.8; fill: none; }
      .edge-amber { stroke: #d29922; stroke-width: 1.8; stroke-dasharray: 5 4; fill: none; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#8b949e"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#58a6ff"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#3fb950"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d29922"/>
    </marker>
  </defs>

  <rect width="1120" height="620" class="bg"/>

  <!-- Main Header -->
  <text x="28" y="34" class="title">Agent Planning &amp; Verification: Parallel DAG Compilation vs. Sequential ReAct + Verifier Self-Refine</text>
  <text x="28" y="54" class="subtitle">Collapsing multi-tool execution to the critical path while grounding iterative refinement in deterministic symbolic verifiers</text>

  <!-- LEFT PANEL: ReAct vs Parallel DAG -->
  <rect x="24" y="72" width="548" height="526" class="panel"/>
  <text x="44" y="100" class="sec-hdr">A. Sequential ReAct (4,620 ms) vs. Parallel DAG Planner (1,140 ms)</text>

  <!-- Top Sub-box: Sequential ReAct -->
  <rect x="40" y="114" width="516" height="174" class="box-red"/>
  <text x="56" y="136" class="lbl-bold">1. Sequential ReAct Loop (5 LLM + 4 Serial Waits)</text>
  <text x="434" y="136" class="mono-red">Total: 4,620 ms</text>

  <!-- Timeline blocks for ReAct -->
  <rect x="56" y="150" width="98" height="46" class="box-neutral"/>
  <text x="105" y="169" text-anchor="middle" class="lbl-bold">Step 1</text>
  <text x="105" y="185" text-anchor="middle" class="mono-sm">LLM + Tool 1</text>

  <line x1="154" y1="173" x2="174" y2="173" class="edge" marker-end="url(#arr)"/>

  <rect x="176" y="150" width="98" height="46" class="box-neutral"/>
  <text x="225" y="169" text-anchor="middle" class="lbl-bold">Step 2</text>
  <text x="225" y="185" text-anchor="middle" class="mono-sm">LLM + Tool 2</text>

  <line x1="274" y1="173" x2="294" y2="173" class="edge" marker-end="url(#arr)"/>

  <rect x="296" y="150" width="98" height="46" class="box-neutral"/>
  <text x="345" y="169" text-anchor="middle" class="lbl-bold">Step 3</text>
  <text x="345" y="185" text-anchor="middle" class="mono-sm">LLM + Tool 3</text>

  <line x1="394" y1="173" x2="414" y2="173" class="edge" marker-end="url(#arr)"/>

  <rect x="416" y="150" width="124" height="46" class="box-neutral"/>
  <text x="478" y="169" text-anchor="middle" class="lbl-bold">Step 4 + Synth</text>
  <text x="478" y="185" text-anchor="middle" class="mono-sm">Tool 4 + Final LLM</text>

  <text x="56" y="220" class="lbl">Latency breakdown: 5 x LLM decode (2,850 ms) + 4 x serial I/O (1,770 ms)</text>
  <text x="56" y="240" class="lbl">Token overhead: Quadratic prefill O(T^2 * |o_t|) as raw tool JSON accumulates</text>
  <text x="56" y="260" class="mono-red">Bottleneck: Independent catalog &amp; policy calls wait in single-file queue</text>

  <!-- Bottom Sub-box: Parallel DAG Planner (LLMCompiler) -->
  <rect x="40" y="304" width="516" height="278" class="box-blue"/>
  <text x="56" y="326" class="lbl-bold">2. Parallel DAG Compilation (Critical Path Execution)</text>
  <text x="408" y="326" class="mono-green">1,140 ms (4.05x)</text>

  <!-- DAG Planner Node -->
  <rect x="56" y="394" width="106" height="66" class="box-purple"/>
  <text x="109" y="418" text-anchor="middle" class="lbl-bold">DAG Planner</text>
  <text x="109" y="435" text-anchor="middle" class="mono-sm">Emits G=(V,E)</text>
  <text x="109" y="450" text-anchor="middle" class="mono-sm">(380 ms)</text>

  <!-- Parallel Frontier 1 (3 nodes) -->
  <rect x="196" y="344" width="136" height="46" class="box-neutral"/>
  <text x="264" y="363" text-anchor="middle" class="lbl-bold">$1: get_sku("A")</text>
  <text x="264" y="379" text-anchor="middle" class="mono-sm">deg-(v)=0 | 210 ms</text>

  <rect x="196" y="404" width="136" height="46" class="box-neutral"/>
  <text x="264" y="423" text-anchor="middle" class="lbl-bold">$2: get_sku("B")</text>
  <text x="264" y="439" text-anchor="middle" class="mono-sm">deg-(v)=0 | 240 ms</text>

  <rect x="196" y="464" width="136" height="46" class="box-neutral"/>
  <text x="264" y="483" text-anchor="middle" class="lbl-bold">$3: get_loyalty()</text>
  <text x="264" y="499" text-anchor="middle" class="mono-sm">deg-(v)=0 | 160 ms</text>

  <!-- Edges from Planner to Frontier 1 -->
  <path d="M 162 414 L 178 414 L 178 367 L 194 367" class="edge-blue" marker-end="url(#arr-blue)"/>
  <line x1="162" y1="427" x2="194" y2="427" class="edge-blue" marker-end="url(#arr-blue)"/>
  <path d="M 162 440 L 178 440 L 178 487 L 194 487" class="edge-blue" marker-end="url(#arr-blue)"/>

  <!-- Frontier 2 (Dependent Node $4) -->
  <rect x="364" y="374" width="174" height="54" class="box-neutral"/>
  <text x="451" y="394" text-anchor="middle" class="lbl-bold">$4: calc_tier_price</text>
  <text x="451" y="410" text-anchor="middle" class="mono-sm">args: ($1.id, $2.id, $3.tier)</text>
  <text x="451" y="423" text-anchor="middle" class="mono-sm">180 ms after max($1,$2,$3)</text>

  <!-- Synthesizer Node -->
  <rect x="364" y="448" width="174" height="54" class="box-green"/>
  <text x="451" y="470" text-anchor="middle" class="lbl-bold">Final Synthesizer</text>
  <text x="451" y="488" text-anchor="middle" class="mono-green">Grounded Stream (340 ms)</text>

  <!-- Edges from Frontier 1 to Frontier 2 -->
  <path d="M 332 367 L 348 367 L 348 392 L 362 392" class="edge-blue" marker-end="url(#arr-blue)"/>
  <path d="M 332 427 L 348 427 L 348 402 L 362 402" class="edge-blue" marker-end="url(#arr-blue)"/>
  <path d="M 332 487 L 348 487 L 348 412 L 362 412" class="edge-blue" marker-end="url(#arr-blue)"/>

  <!-- Edge from $4 to Synthesizer -->
  <line x1="451" y1="428" x2="451" y2="446" class="edge-green" marker-end="url(#arr-green)"/>

  <text x="56" y="536" class="lbl">Critical path: L_plan (380) + max(210, 240, 160) + L_$4 (180) + L_synth (340)</text>
  <text x="56" y="558" class="mono-green">Result: 1,140 ms wall-clock | Only 2 LLM calls | Dynamic replan on 0-hit</text>

  <!-- RIGHT PANEL: Verifier-Guided Self-Refine -->
  <rect x="592" y="72" width="504" height="526" class="panel"/>
  <text x="612" y="100" class="sec-hdr">B. Verifier-Guided Self-Refine Loop (Bounded k &lt;= 2)</text>

  <!-- Draft Generator -->
  <rect x="616" y="118" width="456" height="68" class="box-blue"/>
  <text x="634" y="142" class="lbl-bold">1. Candidate Draft y^(k) ~ pi_theta(y | x, O_tools, e^(k-1))</text>
  <text x="634" y="160" class="lbl">Synthesizes draft response conditioned on tool outputs O_tools</text>
  <text x="634" y="176" class="mono-sm">Draft k=0: "Linen Shirt (VC-8821) is $79 in Size M..."</text>

  <line x1="844" y1="186" x2="844" y2="212" class="edge-blue" marker-end="url(#arr-blue)"/>

  <!-- External Deterministic Verifier Suite -->
  <rect x="616" y="214" width="456" height="196" class="box-purple"/>
  <text x="634" y="238" class="lbl-bold">2. External Deterministic Verifier Suite V(x, y^(k), O_tools)</text>
  <text x="634" y="256" class="lbl">Asymmetric check: Cost(Verify) &lt;&lt; Cost(Generate) [CPU &lt; 8 ms]</text>

  <!-- 3 Verifier Pillars -->
  <rect x="632" y="270" width="134" height="122" class="box-neutral"/>
  <text x="699" y="290" text-anchor="middle" class="lbl-bold">v_ground</text>
  <text x="699" y="308" text-anchor="middle" class="lbl">Entity &amp; Price</text>
  <text x="699" y="324" text-anchor="middle" class="lbl">Exact Match vs.</text>
  <text x="699" y="340" text-anchor="middle" class="mono-sm">O_tools JSON</text>
  <text x="699" y="366" text-anchor="middle" class="mono-red">FAIL: $79 != $84</text>

  <rect x="777" y="270" width="134" height="122" class="box-neutral"/>
  <text x="844" y="290" text-anchor="middle" class="lbl-bold">v_constraint</text>
  <text x="844" y="308" text-anchor="middle" class="lbl">Slot Ledger</text>
  <text x="844" y="324" text-anchor="middle" class="lbl">Budget, Fabric,</text>
  <text x="844" y="340" text-anchor="middle" class="mono-sm">Size Invariants</text>
  <text x="844" y="366" text-anchor="middle" class="mono-green">PASS: &lt;= $90</text>

  <rect x="922" y="270" width="134" height="122" class="box-neutral"/>
  <text x="989" y="290" text-anchor="middle" class="lbl-bold">v_schema / AST</text>
  <text x="989" y="308" text-anchor="middle" class="lbl">Pydantic Types,</text>
  <text x="989" y="324" text-anchor="middle" class="lbl">SQL AST Tenant</text>
  <text x="989" y="340" text-anchor="middle" class="mono-sm">Guardrails</text>
  <text x="989" y="366" text-anchor="middle" class="mono-green">PASS: Valid</text>

  <!-- Branch Left: Violation Feedback -->
  <path d="M 730 410 L 730 436" class="edge-amber" marker-end="url(#arr-amber)"/>
  <rect x="616" y="438" width="224" height="138" class="box-amber"/>
  <text x="630" y="460" class="lbl-bold">If e^(k) != empty &amp; k &lt; 2:</text>
  <text x="630" y="478" class="mono-amber">Structured Error Payload e^(k)</text>
  <text x="630" y="498" class="mono-sm">rule: "UNGROUNDED_PRICE"</text>
  <text x="630" y="514" class="mono-sm">sku: "VC-8821", claimed: "$79"</text>
  <text x="630" y="530" class="mono-sm">actual_in_tool: "$84.00"</text>
  <text x="630" y="552" class="lbl">Feeds back to Refine Policy (k+1)</text>

  <!-- Branch Right: Verified Output -->
  <path d="M 958 410 L 958 436" class="edge-green" marker-end="url(#arr-green)"/>
  <rect x="854" y="438" width="218" height="138" class="box-green"/>
  <text x="868" y="460" class="lbl-bold">If e^(k) == empty (Verified):</text>
  <text x="868" y="478" class="mono-green">Emit Grounded Response</text>
  <text x="868" y="498" class="lbl">89.4% fixed on iteration k=1</text>
  <text x="868" y="516" class="lbl">+6.8% fixed on iteration k=2</text>
  <text x="868" y="534" class="lbl">&lt;0.5% gain for k &gt;= 3</text>
  <text x="868" y="556" class="mono-sm">Zero ungrounded SKU claims</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" role="img" aria-label="OmniMart Shopping-Assistant Agent End-to-End Architecture">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; stroke-width: 1.5; rx: 12; }
      .box-blue { fill: #122136; stroke: #58a6ff; stroke-width: 1.5; rx: 8; }
      .box-green { fill: #11261e; stroke: #3fb950; stroke-width: 1.5; rx: 8; }
      .box-amber { fill: #271e12; stroke: #d29922; stroke-width: 1.5; rx: 8; }
      .box-purple { fill: #211832; stroke: #a371f7; stroke-width: 1.5; rx: 8; }
      .box-red { fill: #281419; stroke: #f85149; stroke-width: 1.5; rx: 8; }
      .box-neutral { fill: #1c2128; stroke: #484f58; stroke-width: 1.2; rx: 6; }
      .title { font-family: 'Manrope', 'DejaVu Sans', sans-serif; font-size: 18px; font-weight: 800; fill: #f0f6fc; }
      .subtitle { font-family: 'Manrope', 'DejaVu Sans', sans-serif; font-size: 12.5px; font-weight: 500; fill: #8b949e; }
      .sec-hdr { font-family: 'Manrope', 'DejaVu Sans', sans-serif; font-size: 13.5px; font-weight: 700; fill: #e6edf3; }
      .lbl-bold { font-family: 'Manrope', 'DejaVu Sans', sans-serif; font-size: 12px; font-weight: 700; fill: #f0f6fc; }
      .lbl { font-family: 'Manrope', 'DejaVu Sans', sans-serif; font-size: 11px; font-weight: 500; fill: #c9d1d9; }
      .mono { font-family: 'JetBrains Mono', 'DejaVu Sans Mono', monospace; font-size: 10.5px; fill: #79c0ff; }
      .mono-sm { font-family: 'JetBrains Mono', 'DejaVu Sans Mono', monospace; font-size: 9.8px; fill: #a5d6ff; }
      .mono-green { font-family: 'JetBrains Mono', 'DejaVu Sans Mono', monospace; font-size: 10.5px; font-weight: 700; fill: #56d364; }
      .mono-amber { font-family: 'JetBrains Mono', 'DejaVu Sans Mono', monospace; font-size: 10px; font-weight: 700; fill: #e3b341; }
      .edge-blue { stroke: #58a6ff; stroke-width: 1.8; fill: none; }
      .edge-green { stroke: #3fb950; stroke-width: 1.8; fill: none; }
      .edge-amber { stroke: #d29922; stroke-width: 1.8; stroke-dasharray: 5 4; fill: none; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#58a6ff"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#3fb950"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d29922"/>
    </marker>
  </defs>

  <rect width="1120" height="640" class="bg"/>

  <!-- Main Header -->
  <text x="28" y="34" class="title">OmniMart Shopping-Assistant Agent: End-to-End Production Architecture</text>
  <text x="28" y="54" class="subtitle">50M SKUs | 12,000 Peak QPS | p95 TTFT 1,012 ms | Parallel MCP Tool Mesh + Deterministic Groundedness Gate</text>

  <!-- TIER 1: Ingress, Router & Memory (Top Row) -->
  <rect x="24" y="72" width="1072" height="114" class="panel"/>
  <text x="42" y="96" class="sec-hdr">Tier 1: Multimodal Ingress, Complexity Router &amp; Session Slot Ledger (p95: 45 ms)</text>

  <!-- User Input -->
  <rect x="42" y="108" width="232" height="64" class="box-neutral"/>
  <text x="56" y="128" class="lbl-bold">Multimodal User Turn</text>
  <text x="56" y="145" class="mono-sm">"Waterproof trail shoes &lt;= $110</text>
  <text x="56" y="160" class="mono-sm">in US 10.5 by Friday" + Photo</text>

  <line x1="274" y1="140" x2="298" y2="140" class="edge-blue" marker-end="url(#arr-blue)"/>

  <!-- ONNX Router -->
  <rect x="300" y="108" width="246" height="64" class="box-blue"/>
  <text x="314" y="128" class="lbl-bold">DeBERTa-v3 Intent Router</text>
  <text x="314" y="145" class="lbl">Lane A: Fast-Path (42% | 190ms)</text>
  <text x="314" y="160" class="mono-sm">Lane B: Clarify | Lane C: DAG</text>

  <line x1="546" y1="140" x2="570" y2="140" class="edge-blue" marker-end="url(#arr-blue)"/>

  <!-- Session Slot Ledger -->
  <rect x="572" y="108" width="256" height="64" class="box-purple"/>
  <text x="586" y="128" class="lbl-bold">Session Slot Ledger L_t</text>
  <text x="586" y="145" class="mono-green">C_hard: {price&lt;=110, size:10.5}</text>
  <text x="586" y="160" class="mono-amber">C_soft: {color!="neon", w=0.3}</text>

  <line x1="828" y1="140" x2="852" y2="140" class="edge-blue" marker-end="url(#arr-blue)"/>

  <!-- Semantic + Episodic Profile -->
  <rect x="854" y="108" width="224" height="64" class="box-green"/>
  <text x="868" y="128" class="lbl-bold">User Memory Hydration</text>
  <text x="868" y="145" class="mono-sm">Fit: Wide toe box preferred</text>
  <text x="868" y="160" class="mono-sm">Tier: OmniPlus Free Express</text>

  <!-- TIER 2: Parallel DAG Planner & MCP Tool Mesh (Middle Row) -->
  <rect x="24" y="202" width="1072" height="266" class="panel"/>
  <text x="42" y="226" class="sec-hdr">Tier 2: Prefix-Cached 8B DAG Planner (295 ms) &amp; Parallel MCP Tool Execution Frontier (280 ms Critical Path)</text>

  <!-- DAG Planner Box -->
  <rect x="42" y="276" width="218" height="134" class="box-blue"/>
  <text x="151" y="302" text-anchor="middle" class="lbl-bold">vLLM 8B DAG Planner</text>
  <text x="151" y="322" text-anchor="middle" class="mono-sm">92.4% Prefix Cache Hit</text>
  <text x="151" y="340" text-anchor="middle" class="mono-sm">Constrained JSON FSM</text>
  <text x="151" y="360" text-anchor="middle" class="lbl">Compiles G=(V,E) with</text>
  <text x="151" y="376" text-anchor="middle" class="lbl">symbolic refs ($1, $2, $3)</text>
  <text x="151" y="396" text-anchor="middle" class="mono-green">p95 Decode: 295 ms</text>

  <!-- Edges to Parallel MCP Servers -->
  <path d="M 260 315 L 284 315 L 284 278 L 306 278" class="edge-blue" marker-end="url(#arr-blue)"/>
  <line x1="260" y1="343" x2="306" y2="343" class="edge-blue" marker-end="url(#arr-blue)"/>
  <path d="M 260 371 L 284 371 L 284 416 L 306 416" class="edge-blue" marker-end="url(#arr-blue)"/>

  <!-- MCP Tool 1: Hybrid Search Cascade -->
  <rect x="308" y="242" width="446" height="72" class="box-purple"/>
  <text x="324" y="263" class="lbl-bold">MCP Tool $1: search_catalog_hybrid (185 ms)</text>
  <text x="324" y="281" class="mono-sm">1. Bitmask C_hard Filter -&gt; BM25 (150) + Fine-Tuned CLIP HNSW (150)</text>
  <text x="324" y="298" class="mono-sm">2. RRF Fusion (k=60) -&gt; Cross-Encoder Rerank (Top 15) -&gt; MMR (Top 5)</text>

  <!-- MCP Tool 2: Live Inventory & Voucher Engine -->
  <rect x="308" y="324" width="446" height="62" class="box-green"/>
  <text x="324" y="345" class="lbl-bold">MCP Tool $2: get_live_inventory_vouchers (75 ms)</text>
  <text x="324" y="363" class="mono-sm">Redis/Aerospike L1 Cache: Warehouse stock + Stackable Seller/Platform</text>
  <text x="324" y="378" class="mono-sm">Voucher Solver -&gt; exact final_checkout_price per candidate SKU</text>

  <!-- MCP Tool 3: Sizing & Review Aspects -->
  <rect x="308" y="396" width="446" height="58" class="box-neutral"/>
  <text x="324" y="417" class="lbl-bold">MCP Tool $3: check_fit_and_review_aspects (110 ms)</text>
  <text x="324" y="435" class="mono-sm">Buyer return reasons (runs_small_rate=0.34) &amp; aspect pros/cons</text>

  <!-- Progressive Relaxation Box (Right of MCP tools) -->
  <rect x="782" y="242" width="296" height="212" class="box-amber"/>
  <text x="798" y="266" class="lbl-bold">Deterministic Relaxation &amp; Join</text>
  <text x="798" y="286" class="lbl">If |Candidates($1)| &lt; 3 SKUs:</text>
  <text x="798" y="306" class="mono-amber">1. Lock C_hard (price, size, SLA)</text>
  <text x="798" y="324" class="mono-amber">2. Pop lowest-weight c in C_soft</text>
  <text x="798" y="342" class="mono-sm">   (e.g., relax sub-shade filter)</text>
  <text x="798" y="362" class="lbl">3. Log provenance badge:</text>
  <text x="798" y="380" class="mono-sm">   relaxed=["color_shade"]</text>
  <text x="798" y="404" class="lbl">4. Hydrate Top-5 SKUs with</text>
  <text x="798" y="422" class="mono-green">   $2 Live Price + $3 Fit Risk</text>

  <line x1="754" y1="278" x2="780" y2="278" class="edge-amber" marker-end="url(#arr-amber)"/>
  <line x1="754" y1="355" x2="780" y2="355" class="edge-green" marker-end="url(#arr-green)"/>
  <line x1="754" y1="425" x2="780" y2="425" class="edge-blue" marker-end="url(#arr-blue)"/>

  <!-- TIER 3: Deterministic Verifier & Streaming Synthesizer (Bottom Row) -->
  <rect x="24" y="484" width="1072" height="134" class="panel"/>
  <text x="42" y="508" class="sec-hdr">Tier 3: Pre-Stream Deterministic Grounding Verifier (12 ms) &amp; Tiered Streaming Synthesizer (380 ms)</text>

  <!-- Verifier Gate -->
  <rect x="42" y="522" width="496" height="80" class="box-red"/>
  <text x="58" y="544" class="lbl-bold">Deterministic CPU Grounding Gate (v_ground + v_constraint)</text>
  <text x="58" y="563" class="mono-sm">- Asserts every SKU ID in draft exists in Hydrated Top-5 Set</text>
  <text x="58" y="580" class="mono-sm">- Asserts claimed $ price == final_checkout_price &amp;&amp; price &lt;= $110.00</text>
  <text x="58" y="595" class="mono-green">- 0.0% Unverified Price/Stock Claims Escaping to User UI</text>

  <line x1="538" y1="562" x2="572" y2="562" class="edge-green" marker-end="url(#arr-green)"/>

  <!-- Streaming Synthesizer -->
  <rect x="574" y="522" width="504" height="80" class="box-green"/>
  <text x="590" y="544" class="lbl-bold">Streaming Synthesizer + Interactive Product Comparison Cards</text>
  <text x="590" y="563" class="lbl">Streams trade-off table (arch support, Gore-Tex weight, net coupon price)</text>
  <text x="590" y="580" class="mono-amber">+ Verified Fit Callout: "Runs 0.5 size small (34% buyer reports) -&gt; Try US 11"</text>
  <text x="590" y="595" class="mono-green">End-to-End p95 TTFT: 1,012 ms (Well within 1,150 ms SLA)</text>
</svg>

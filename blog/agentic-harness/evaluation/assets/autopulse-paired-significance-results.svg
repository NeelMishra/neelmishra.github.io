<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 390" width="920" height="390" font-family="Manrope, DejaVu Sans, -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <linearGradient id="bgCal2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="920" height="390" rx="12" fill="url(#bgCal2)" stroke="#334155" stroke-width="1.5"/>

  <!-- Left Panel: AutoPulse CRM Production Results (+21% Similarity, +35% Relevance) -->
  <rect x="18" y="18" width="434" height="354" rx="8" fill="#0b1120" stroke="#334155" stroke-width="1"/>
  <text x="32" y="42" fill="#f8fafc" font-size="13" font-weight="700">A. AutoPulse CRM Evaluation Results (N = 450)</text>
  <text x="32" y="58" fill="#94a3b8" font-size="10">Baseline v0 vs. Candidate v1 (Dealer RAG + Context Pruning)</text>

  <!-- Metric 1: Semantic Similarity (+21%) -->
  <rect x="32" y="74" width="406" height="84" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.3"/>
  <text x="46" y="94" fill="#f8fafc" font-size="9.8" font-weight="700">1. Semantic Similarity to Gold Email</text>
  <text x="424" y="94" fill="#38bdf8" font-size="9" font-weight="700" text-anchor="end">+21.0% Lift (p = 1.4e-6)</text>

  <text x="46" y="116" fill="#94a3b8" font-size="8.5">Baseline v0</text>
  <rect x="115" y="106" width="184" height="12" rx="3" fill="#475569"/>
  <text x="307" y="116" fill="#cbd5e1" font-size="8.5" font-weight="600">0.680 ± 0.019</text>

  <text x="46" y="138" fill="#7dd3fc" font-size="8.5" font-weight="700">Candidate v1</text>
  <rect x="115" y="128" width="223" height="12" rx="3" fill="#0ea5e9"/>
  <text x="346" y="138" fill="#e0f2fe" font-size="8.5" font-weight="700">0.823 ± 0.015</text>
  <text x="46" y="152" fill="#94a3b8" font-size="7.8">Paired t = 11.42, Wilcoxon p = 2.9e-6 ( passes α_Holm = 0.0167 )</text>

  <!-- Metric 2: Context Relevance (+35%) -->
  <rect x="32" y="168" width="406" height="84" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.4"/>
  <text x="46" y="188" fill="#f8fafc" font-size="9.8" font-weight="700">2. Context Relevance &amp; RO Grounding</text>
  <text x="424" y="188" fill="#10b981" font-size="9" font-weight="700" text-anchor="end">+35.1% Lift (p = 3.8e-9)</text>

  <text x="46" y="210" fill="#94a3b8" font-size="8.5">Baseline v0</text>
  <rect x="115" y="200" width="165" height="12" rx="3" fill="#475569"/>
  <text x="288" y="210" fill="#cbd5e1" font-size="8.5" font-weight="600">0.610 ± 0.022</text>

  <text x="46" y="232" fill="#6ee7b7" font-size="8.5" font-weight="700">Candidate v1</text>
  <rect x="115" y="222" width="223" height="12" rx="3" fill="#10b981"/>
  <text x="346" y="232" fill="#d1fae5" font-size="8.5" font-weight="700">0.824 ± 0.016</text>
  <text x="46" y="246" fill="#94a3b8" font-size="7.8">Paired t = 14.85, Wilcoxon p = 3.8e-9 ( passes α_Holm = 0.0125 )</text>

  <!-- Metric 3: Hallucination Guardrail -->
  <rect x="32" y="262" width="406" height="96" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.2"/>
  <text x="46" y="282" fill="#ecfdf5" font-size="9.8" font-weight="700">3. Factual &amp; Tenant Isolation Guardrails (800 Models)</text>
  <text x="46" y="301" fill="#d1fae5" font-size="8.2">• Unverified VIN / Rebate Rate: 6.4% (v0) -&gt; 0.9% (v1) (p = 2.1e-5)</text>
  <text x="46" y="319" fill="#d1fae5" font-size="8.2">• Cross-Tenant Dealership Leakage: 0 / 450 episodes (100% pass)</text>
  <text x="46" y="337" fill="#a7f3d0" font-size="8.2" font-weight="600">• P95 Latency (vLLM): 24.0s -&gt; 0.8s (-96.7% latency + higher quality)</text>

  <!-- Right Panel: Paired Hypothesis Testing & Variance Reduction -->
  <rect x="468" y="18" width="434" height="354" rx="8" fill="#0b1120" stroke="#334155" stroke-width="1"/>
  <text x="482" y="42" fill="#f8fafc" font-size="13" font-weight="700">B. Paired Significance Testing Between Versions</text>
  <text x="482" y="58" fill="#94a3b8" font-size="9.6">Prompt-level pairing cuts variance by 1 - ρ and controls false positives</text>

  <!-- Variance Math Box -->
  <rect x="484" y="74" width="402" height="90" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.3"/>
  <text x="685" y="94" fill="#7dd3fc" font-size="10" font-weight="700" text-anchor="middle">Why Paired Differences d_i = s_1(x_i) - s_0(x_i) Amplify Power</text>
  <text x="685" y="114" fill="#f8fafc" font-size="8.8" font-weight="600" text-anchor="middle">Var(d_i) = σ_1^2 + σ_0^2 - 2 · ρ · σ_1 · σ_0  (with ρ = 0.74 across prompts)</text>
  <text x="498" y="133" fill="#cbd5e1" font-size="8.2">• Unpaired Two-Sample Test: Prompt difficulty variance dominates σ^2</text>
  <text x="498" y="150" fill="#a7f3d0" font-size="8.2" font-weight="600">• Paired Test on Same x_i: Cuts variance by 3.8x (2(1-ρ) = 0.52)</text>

  <!-- Test Selection Guide Box -->
  <rect x="484" y="176" width="402" height="94" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.3"/>
  <text x="685" y="196" fill="#a5b4fc" font-size="10" font-weight="700" text-anchor="middle">Choosing the Right Hypothesis Test for Each Agent Metric</text>
  <text x="498" y="215" fill="#e0e7ff" font-size="8.1">1. Continuous Logprob Score: Paired t-test  t = d_bar / (s_d / sqrt(N))</text>
  <text x="498" y="233" fill="#e0e7ff" font-size="8.1">2. Skewed / Ordinal Rubric: Wilcoxon Signed-Rank Test on |d_i| ranks</text>
  <text x="498" y="251" fill="#e0e7ff" font-size="8.1">3. Binary Pass/Fail (State Match): McNemar Test on discordant (n01, n10)</text>

  <!-- Holm-Bonferroni Multiple Testing Control -->
  <rect x="484" y="282" width="402" height="76" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.3"/>
  <text x="685" y="302" fill="#fde68a" font-size="10" font-weight="700" text-anchor="middle">Holm-Bonferroni Step-Down Control Across M = 4 Metrics</text>
  <text x="498" y="320" fill="#e2e8f0" font-size="8.1">Sort p-values p_(1) &lt;= ... &lt;= p_(M); test p_(k) &lt; α / (M - k + 1):</text>
  <text x="498" y="336" fill="#fde68a" font-size="8.1">• k=1 (Relevance): p = 3.8e-9 &lt; 0.0125 | k=2 (Similarity): p = 1.4e-6 &lt; 0.0167</text>
  <text x="498" y="350" fill="#a7f3d0" font-size="8.1" font-weight="600">-&gt; Bounds family-wise false positive rate FWER &lt;= 0.05 across suite</text>
</svg>

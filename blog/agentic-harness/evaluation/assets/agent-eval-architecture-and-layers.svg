<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 390" width="920" height="390" font-family="Manrope, DejaVu Sans, -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <linearGradient id="bgEval1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arGrn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <rect width="920" height="390" rx="12" fill="url(#bgEval1)" stroke="#334155" stroke-width="1.5"/>

  <!-- Left Panel: Four-Layer Agent Evaluation Architecture -->
  <rect x="18" y="18" width="432" height="354" rx="8" fill="#0b1120" stroke="#334155" stroke-width="1"/>
  <text x="32" y="42" fill="#f8fafc" font-size="13" font-weight="700">A. Four-Layer Agent Evaluation Stack</text>
  <text x="32" y="58" fill="#94a3b8" font-size="10">Defense-in-depth from sub-millisecond AST checks to calibrated judges</text>

  <!-- Layer 4 -->
  <rect x="32" y="72" width="404" height="54" rx="6" fill="#31102f" stroke="#ec4899" stroke-width="1.3"/>
  <text x="46" y="92" fill="#f9a8d4" font-size="10" font-weight="700">L4 · Online Canary &amp; Shadow Telemetry</text>
  <text x="422" y="92" fill="#fbcfe8" font-size="8.5" font-weight="600" text-anchor="end">Real Traffic · Continuous</text>
  <text x="46" y="111" fill="#ffe4e6" font-size="8.6">Shadow interleaving, user re-query rate, tool timeout SLA &amp; drift alerts</text>

  <!-- Layer 3 -->
  <rect x="32" y="138" width="404" height="54" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.3"/>
  <text x="46" y="158" fill="#a5b4fc" font-size="10" font-weight="700">L3 · Human-Calibrated LLM-as-Judge</text>
  <text x="422" y="158" fill="#c7d2fe" font-size="8.5" font-weight="600" text-anchor="end">~600 ms / trace · Offline CI</text>
  <text x="46" y="177" fill="#e0e7ff" font-size="8.6">Decomposed rubrics, Rogan-Gladen prevalence calibration, paired p-values</text>

  <!-- Layer 2 -->
  <rect x="32" y="204" width="404" height="54" rx="6" fill="#082f49" stroke="#38bdf8" stroke-width="1.3"/>
  <text x="46" y="224" fill="#7dd3fc" font-size="10" font-weight="700">L2 · Trajectory DAG &amp; Sandbox State Diff</text>
  <text x="422" y="224" fill="#bae6fd" font-size="8.5" font-weight="600" text-anchor="end">~15 ms / trace · Every PR</text>
  <text x="46" y="243" fill="#e0f2fe" font-size="8.6">Tool-selection F1, prefix recall, and final mock DB state diff ΔS_db</text>

  <!-- Layer 1 -->
  <rect x="32" y="270" width="404" height="54" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.3"/>
  <text x="46" y="290" fill="#6ee7b7" font-size="10" font-weight="700">L1 · Deterministic Schema Assertions</text>
  <text x="422" y="290" fill="#a7f3d0" font-size="8.5" font-weight="600" text-anchor="end">&lt; 2 ms / step · Hard Gate</text>
  <text x="46" y="309" fill="#d1fae5" font-size="8.6">JSON AST validity, Pydantic argument bounds &amp; forbidden-tool policies</text>

  <!-- Left Footer -->
  <rect x="32" y="334" width="404" height="28" rx="5" fill="#1e293b" stroke="#475569"/>
  <text x="234" y="352" fill="#cbd5e1" font-size="8.8" font-weight="600" text-anchor="middle">Rule: Fail fast at L1/L2 before spending LLM-as-Judge tokens at L3</text>

  <!-- Right Panel: CI/CD Regression Suite Pipeline -->
  <rect x="468" y="18" width="434" height="354" rx="8" fill="#0b1120" stroke="#334155" stroke-width="1"/>
  <text x="482" y="42" fill="#f8fafc" font-size="13" font-weight="700">B. CI/CD Prompt &amp; Model Regression Pipeline</text>
  <text x="482" y="58" fill="#94a3b8" font-size="10">Automated differential verification triggered on every prompt or model diff</text>

  <!-- Top Row Boxes -->
  <rect x="484" y="74" width="186" height="54" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.3"/>
  <text x="577" y="94" fill="#7dd3fc" font-size="10" font-weight="700" text-anchor="middle">1. Versioned Change Trigger</text>
  <text x="577" y="111" fill="#cbd5e1" font-size="8.4" text-anchor="middle">Prompt diff / Tool JSON / Weights</text>

  <line x1="670" y1="101" x2="696" y2="101" stroke="#38bdf8" stroke-width="1.6" marker-end="url(#arCyan)"/>

  <rect x="702" y="74" width="184" height="54" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.3"/>
  <text x="794" y="94" fill="#7dd3fc" font-size="10" font-weight="700" text-anchor="middle">2. Stratified Golden Suite</text>
  <text x="794" y="111" fill="#cbd5e1" font-size="8.4" text-anchor="middle">N=500 tasks + prod bug ratchets</text>

  <line x1="685" y1="128" x2="685" y2="146" stroke="#38bdf8" stroke-width="1.6" marker-end="url(#arCyan)"/>

  <!-- Middle Box: Deterministic Mock Sandbox -->
  <rect x="484" y="150" width="402" height="60" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.4"/>
  <text x="685" y="170" fill="#fde68a" font-size="10.2" font-weight="700" text-anchor="middle">3. Deterministic Sandbox &amp; Tool Fixture Replay</text>
  <text x="685" y="187" fill="#e2e8f0" font-size="8.6" text-anchor="middle">Executes Baseline (v0) and Candidate (v1) side-by-side at T = 0</text>
  <text x="685" y="201" fill="#94a3b8" font-size="8.2" text-anchor="middle">Content-addressed SQLite tool fixtures eliminate external API flake</text>

  <line x1="579" y1="210" x2="579" y2="228" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arCyan)"/>
  <line x1="790" y1="210" x2="790" y2="228" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arCyan)"/>

  <!-- Two Gate Boxes -->
  <rect x="484" y="232" width="190" height="58" rx="6" fill="#3f1d2e" stroke="#f43f5e" stroke-width="1.3"/>
  <text x="579" y="251" fill="#fda4af" font-size="9.5" font-weight="700" text-anchor="middle">4a. Hard Safety &amp; Schema Gate</text>
  <text x="579" y="267" fill="#ffe4e6" font-size="8.4" text-anchor="middle">Pass^k (k=5) == 100% required</text>
  <text x="579" y="281" fill="#fda4af" font-size="8" text-anchor="middle">Zero policy or AST regressions</text>

  <rect x="694" y="232" width="192" height="58" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.3"/>
  <text x="790" y="251" fill="#6ee7b7" font-size="9.5" font-weight="700" text-anchor="middle">4b. Paired Significance Gate</text>
  <text x="790" y="267" fill="#d1fae5" font-size="8.4" text-anchor="middle">Δμ = μ(v1) - μ(v0) &gt; 0</text>
  <text x="790" y="281" fill="#a7f3d0" font-size="8" text-anchor="middle">Wilcoxon / paired t-test p &lt; α_Holm</text>

  <line x1="579" y1="290" x2="640" y2="308" stroke="#10b981" stroke-width="1.5" marker-end="url(#arGrn)"/>
  <line x1="790" y1="290" x2="730" y2="308" stroke="#10b981" stroke-width="1.5" marker-end="url(#arGrn)"/>

  <!-- Bottom Verdict Box -->
  <rect x="484" y="310" width="402" height="52" rx="6" fill="#065f46" stroke="#10b981" stroke-width="1.5"/>
  <text x="685" y="330" fill="#ecfdf5" font-size="10.2" font-weight="700" text-anchor="middle">5. Automated CI Merge Decision &amp; Signed Eval Scorecard</text>
  <text x="685" y="347" fill="#a7f3d0" font-size="8.5" text-anchor="middle">Promotes candidate only if all hard gates pass and Δμ is significant</text>
</svg>

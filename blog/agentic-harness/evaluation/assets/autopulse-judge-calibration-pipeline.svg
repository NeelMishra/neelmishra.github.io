<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 390" width="920" height="390" font-family="Manrope, DejaVu Sans, -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <linearGradient id="bgCal1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arC1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arG1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <rect width="920" height="390" rx="12" fill="url(#bgCal1)" stroke="#334155" stroke-width="1.5"/>

  <!-- Left Panel: Human-to-Judge Calibration Pipeline -->
  <rect x="18" y="18" width="434" height="354" rx="8" fill="#0b1120" stroke="#334155" stroke-width="1"/>
  <text x="32" y="42" fill="#f8fafc" font-size="13" font-weight="700">A. Human-Calibrated LLM-as-Judge Pipeline</text>
  <text x="32" y="58" fill="#94a3b8" font-size="10">Aligning automated judge scores with dealership domain experts</text>

  <!-- Step 1 -->
  <rect x="32" y="74" width="406" height="54" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.3"/>
  <text x="46" y="94" fill="#7dd3fc" font-size="10" font-weight="700">1. Stratified Human Calibration Set (N_cal = 300)</text>
  <text x="424" y="94" fill="#bae6fd" font-size="8.4" font-weight="600" text-anchor="end">κ_human = 0.84</text>
  <text x="46" y="113" fill="#cbd5e1" font-size="8.4">2 automotive SMEs label service/sales emails across 800 models</text>

  <line x1="235" y1="128" x2="235" y2="142" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arC1)"/>

  <!-- Step 2 -->
  <rect x="32" y="146" width="406" height="54" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.3"/>
  <text x="46" y="166" fill="#a5b4fc" font-size="10" font-weight="700">2. Decomposed Rubric + Position-Swapped Judging</text>
  <text x="424" y="166" fill="#c7d2fe" font-size="8.4" font-weight="600" text-anchor="end">κ_judge = 0.81</text>
  <text x="46" y="185" fill="#e0e7ff" font-size="8.4">Runs (A, B) and (B, A) at T=0; extracts token logprobs for E[s]</text>

  <line x1="235" y1="200" x2="235" y2="214" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arC1)"/>

  <!-- Step 3 -->
  <rect x="32" y="218" width="406" height="56" rx="6" fill="#082f49" stroke="#38bdf8" stroke-width="1.3"/>
  <text x="46" y="238" fill="#7dd3fc" font-size="10" font-weight="700">3. Measure Judge Confusion Matrix (q1, q0)</text>
  <text x="424" y="238" fill="#bae6fd" font-size="8.4" font-weight="600" text-anchor="end">J = q1+q0-1 = 0.78</text>
  <text x="46" y="257" fill="#e0f2fe" font-size="8.4">Sensitivity q1 = P(Judge=1 | Human=1) = 0.91; Specificity q0 = 0.87</text>

  <line x1="235" y1="274" x2="235" y2="288" stroke="#10b981" stroke-width="1.5" marker-end="url(#arG1)"/>

  <!-- Step 4 -->
  <rect x="32" y="292" width="406" height="66" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.4"/>
  <text x="235" y="312" fill="#6ee7b7" font-size="10" font-weight="700" text-anchor="middle">4. Rogan-Gladen Bias-Corrected Prevalence Estimator</text>
  <text x="235" y="330" fill="#ecfdf5" font-size="9" font-weight="600" text-anchor="middle">θ_hat = clip( (p_raw + q0 - 1) / (q1 + q0 - 1), 0, 1 )</text>
  <text x="235" y="347" fill="#a7f3d0" font-size="8.2" text-anchor="middle">Removes judge false-positive inflation &amp; propagates calibration variance</text>

  <!-- Right Panel: Decomposed Rubric & Token Logprob Scoring -->
  <rect x="468" y="18" width="434" height="354" rx="8" fill="#0b1120" stroke="#334155" stroke-width="1"/>
  <text x="482" y="42" fill="#f8fafc" font-size="13" font-weight="700">B. Why Decomposed Logprob Rubrics Beat Raw 1-10</text>
  <text x="482" y="58" fill="#94a3b8" font-size="9.6">Eliminating 7-8/10 score bunching via atomic checks &amp; probability weighting</text>

  <!-- Bad Box: Naive 1-10 Prompting -->
  <rect x="484" y="74" width="402" height="72" rx="6" fill="#3f1d2e" stroke="#f43f5e" stroke-width="1.3"/>
  <text x="498" y="94" fill="#fda4af" font-size="9.8" font-weight="700">Anti-Pattern: Uncalibrated Monolithic 1-10 Prompt</text>
  <text x="872" y="94" fill="#fecdd3" font-size="8.4" font-weight="600" text-anchor="end">Pearson r = 0.52</text>
  <text x="498" y="112" fill="#ffe4e6" font-size="8.3">• 84% of outputs receive "7" or "8" (central-tendency compression)</text>
  <text x="498" y="128" fill="#fda4af" font-size="8.3">• Verbose hallucinations outscore concise, factually exact CRM emails</text>

  <!-- Good Box: AutoPulse Decomposed Rubric -->
  <rect x="484" y="160" width="402" height="118" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.4"/>
  <text x="498" y="180" fill="#6ee7b7" font-size="9.8" font-weight="700">AutoPulse Calibrated Decomposed Rubric</text>
  <text x="872" y="180" fill="#a7f3d0" font-size="8.4" font-weight="600" text-anchor="end">Pearson r = 0.86</text>
  <text x="498" y="199" fill="#d1fae5" font-size="8.2">1. Context Relevance (0-3): Retrieves exact RO history, VIN &amp; warranty</text>
  <text x="498" y="216" fill="#d1fae5" font-size="8.2">2. Semantic Similarity (0-3): Matches gold advisor resolution &amp; action</text>
  <text x="498" y="233" fill="#d1fae5" font-size="8.2">3. Factual Gate (Binary): Zero fabricated APRs, rebates, or service dates</text>
  <text x="498" y="250" fill="#a7f3d0" font-size="8.2" font-weight="600">4. Logprob Score: s_cont = sum_{k=0..3} k * softmax(z_k) in [0.0, 3.0]</text>
  <text x="498" y="266" fill="#6ee7b7" font-size="8.1">-&gt; Continuous variance enables high-power paired t &amp; Wilcoxon tests</text>

  <!-- Bias Mitigation Summary Box -->
  <rect x="484" y="286" width="402" height="72" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
  <text x="685" y="305" fill="#f8fafc" font-size="9.8" font-weight="700" text-anchor="middle">Three Mandatory Judge Bias Controls in Production</text>
  <text x="498" y="322" fill="#cbd5e1" font-size="8.2">• Position Bias: Require agreement across both orders (v0, v1) and (v1, v0)</text>
  <text x="498" y="337" fill="#cbd5e1" font-size="8.2">• Length Confounding: Residualize judge score against token count ΔL</text>
  <text x="498" y="351" fill="#94a3b8" font-size="8.1">• Self-Preference: Use an independent cross-family judge + human audit</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 390" width="920" height="390" font-family="Manrope, DejaVu Sans, -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <linearGradient id="bgEval2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arBl2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="920" height="390" rx="12" fill="url(#bgEval2)" stroke="#334155" stroke-width="1.5"/>

  <!-- Left Panel: Outcome vs Trajectory 2x2 Diagnostic Matrix -->
  <rect x="18" y="18" width="432" height="354" rx="8" fill="#0b1120" stroke="#334155" stroke-width="1"/>
  <text x="32" y="42" fill="#f8fafc" font-size="13" font-weight="700">A. Outcome vs. Trajectory Diagnostic Matrix</text>
  <text x="32" y="58" fill="#94a3b8" font-size="10">Why final-answer grading alone misses brittle shortcuts and late tool faults</text>

  <!-- Column Headers -->
  <text x="152" y="82" fill="#6ee7b7" font-size="9.5" font-weight="700" text-anchor="middle">Trajectory Valid (F1_tool &gt;= τ)</text>
  <text x="342" y="82" fill="#fda4af" font-size="9.5" font-weight="700" text-anchor="middle">Trajectory Flawed (F1_tool &lt; τ)</text>

  <!-- Quadrant 1: Top-Left (True Gold) -->
  <rect x="64" y="92" width="178" height="106" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.4"/>
  <text x="153" y="114" fill="#ecfdf5" font-size="10.5" font-weight="700" text-anchor="middle">Q1 · Robust Success</text>
  <text x="153" y="132" fill="#a7f3d0" font-size="8.5" text-anchor="middle">Final State ΔS_db == ΔS*_db</text>
  <text x="153" y="148" fill="#d1fae5" font-size="8.5" text-anchor="middle">Right tools + valid args</text>
  <text x="153" y="166" fill="#6ee7b7" font-size="8.5" font-weight="700" text-anchor="middle">Action: Promote &amp; Cache</text>

  <!-- Quadrant 2: Top-Right (Right Answer, Wrong Process) -->
  <rect x="254" y="92" width="178" height="106" rx="6" fill="#451a03" stroke="#f59e0b" stroke-width="1.4"/>
  <text x="343" y="114" fill="#fef3c7" font-size="10.5" font-weight="700" text-anchor="middle">Q2 · Lucky Shortcut</text>
  <text x="343" y="132" fill="#fde68a" font-size="8.5" text-anchor="middle">Final text matches reference</text>
  <text x="343" y="148" fill="#fed7aa" font-size="8.5" text-anchor="middle">Skipped auth / guessed ID</text>
  <text x="343" y="166" fill="#fbbf24" font-size="8.5" font-weight="700" text-anchor="middle">Action: Flag Policy Bypass</text>

  <!-- Quadrant 3: Bottom-Left (Wrong Outcome, Valid Prefix) -->
  <rect x="64" y="210" width="178" height="106" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.4"/>
  <text x="153" y="232" fill="#e0e7ff" font-size="10.5" font-weight="700" text-anchor="middle">Q3 · Late Synthesis Fault</text>
  <text x="153" y="250" fill="#c7d2fe" font-size="8.5" text-anchor="middle">Correct tool sequence called</text>
  <text x="153" y="266" fill="#a5b4fc" font-size="8.5" text-anchor="middle">Final response misreads JSON</text>
  <text x="153" y="284" fill="#818cf8" font-size="8.5" font-weight="700" text-anchor="middle">Action: Fix Answer Synthesizer</text>

  <!-- Quadrant 4: Bottom-Right (Total Derailment) -->
  <rect x="254" y="210" width="178" height="106" rx="6" fill="#3f1d2e" stroke="#f43f5e" stroke-width="1.4"/>
  <text x="343" y="232" fill="#ffe4e6" font-size="10.5" font-weight="700" text-anchor="middle">Q4 · Early Derailment</text>
  <text x="343" y="250" fill="#fda4af" font-size="8.5" text-anchor="middle">Wrong tool / schema crash</text>
  <text x="343" y="266" fill="#fecdd3" font-size="8.5" text-anchor="middle">Cascading error across turns</text>
  <text x="343" y="284" fill="#fb7185" font-size="8.5" font-weight="700" text-anchor="middle">Action: Fix Router &amp; Tool Docs</text>

  <!-- Row Labels on Left -->
  <text x="42" y="142" fill="#6ee7b7" font-size="9" font-weight="700" text-anchor="middle">Pass</text>
  <text x="42" y="155" fill="#94a3b8" font-size="8" text-anchor="middle">State</text>
  <text x="42" y="260" fill="#fda4af" font-size="9" font-weight="700" text-anchor="middle">Fail</text>
  <text x="42" y="273" fill="#94a3b8" font-size="8" text-anchor="middle">State</text>

  <!-- Left Footer: Pass@k vs Pass^k -->
  <rect x="32" y="330" width="404" height="32" rx="5" fill="#1e293b" stroke="#475569"/>
  <text x="234" y="350" fill="#e2e8f0" font-size="8.8" font-weight="600" text-anchor="middle">Reliability Metric: Pass^k = (p_success)^k penalizes stochastic flakiness</text>

  <!-- Right Panel: Stateful Mock Sandbox & State-Diff Verification -->
  <rect x="468" y="18" width="434" height="354" rx="8" fill="#0b1120" stroke="#334155" stroke-width="1"/>
  <text x="482" y="42" fill="#f8fafc" font-size="13" font-weight="700">B. Stateful Tool-Mock Sandbox &amp; ΔS_db Verification</text>
  <text x="482" y="58" fill="#94a3b8" font-size="10">Evaluating valid non-unique tool paths via exact database state mutation</text>

  <!-- Initial State S0 -->
  <rect x="484" y="76" width="114" height="68" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1.3"/>
  <text x="541" y="96" fill="#f8fafc" font-size="9.5" font-weight="700" text-anchor="middle">Seed State S_0</text>
  <text x="541" y="112" fill="#94a3b8" font-size="8.2" text-anchor="middle">order_92: "shipped"</text>
  <text x="541" y="126" fill="#94a3b8" font-size="8.2" text-anchor="middle">refund_bal: $0.00</text>

  <!-- Two Valid Trajectory Paths -->
  <rect x="622" y="70" width="128" height="34" rx="5" fill="#082f49" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="686" y="85" fill="#7dd3fc" font-size="8.5" font-weight="700" text-anchor="middle">Path A (3 tool calls)</text>
  <text x="686" y="97" fill="#bae6fd" font-size="7.8" text-anchor="middle">lookup -&gt; check -&gt; refund</text>

  <rect x="622" y="114" width="128" height="34" rx="5" fill="#082f49" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="686" y="129" fill="#7dd3fc" font-size="8.5" font-weight="700" text-anchor="middle">Path B (2 tool calls)</text>
  <text x="686" y="141" fill="#bae6fd" font-size="7.8" text-anchor="middle">batch_query -&gt; refund</text>

  <line x1="598" y1="96" x2="620" y2="87" stroke="#38bdf8" stroke-width="1.4" marker-end="url(#arBl2)"/>
  <line x1="598" y1="120" x2="620" y2="131" stroke="#38bdf8" stroke-width="1.4" marker-end="url(#arBl2)"/>

  <!-- Final State S_T -->
  <rect x="772" y="76" width="114" height="68" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.4"/>
  <text x="829" y="96" fill="#6ee7b7" font-size="9.5" font-weight="700" text-anchor="middle">Final State S_T</text>
  <text x="829" y="112" fill="#d1fae5" font-size="8.2" text-anchor="middle">order_92: "returned"</text>
  <text x="829" y="126" fill="#d1fae5" font-size="8.2" text-anchor="middle">refund_bal: $49.90</text>

  <line x1="750" y1="87" x2="770" y2="98" stroke="#38bdf8" stroke-width="1.4" marker-end="url(#arBl2)"/>
  <line x1="750" y1="131" x2="770" y2="120" stroke="#38bdf8" stroke-width="1.4" marker-end="url(#arBl2)"/>

  <!-- Composite Trajectory Score Box -->
  <rect x="484" y="162" width="402" height="92" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
  <text x="685" y="182" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">Composite Agent Episode Score J_episode(τ)</text>
  <text x="685" y="201" fill="#38bdf8" font-size="8.6" font-weight="600" text-anchor="middle">J(τ) = I[S_T == S*_T] · ( w1·F1_tool(τ) + w2·Sim_arg(τ) - λ·Cost(τ) )</text>
  <text x="496" y="222" fill="#cbd5e1" font-size="8.2">• Hard State Gate I[S_T == S*_T]: Verifies mock DB diff &amp; zero side-effects</text>
  <text x="496" y="238" fill="#cbd5e1" font-size="8.2">• Soft Efficiency Term: Rewards Path B over Path A when both reach S*_T</text>

  <!-- Pass^k Decay Comparison Box -->
  <rect x="484" y="268" width="402" height="92" rx="6" fill="#0f172a" stroke="#818cf8" stroke-width="1.2"/>
  <text x="685" y="288" fill="#a5b4fc" font-size="10" font-weight="700" text-anchor="middle">Why Production Agents Track Pass^k Instead of Pass@k (τ-bench)</text>
  <text x="496" y="307" fill="#e2e8f0" font-size="8.2">• Pass@k = 1 - (1 - p)^k: Prob at least 1 of k trials succeeds (coding)</text>
  <text x="496" y="324" fill="#e2e8f0" font-size="8.2">• Pass^k = p^k: Prob ALL k trials succeed (customer-facing agent SLA)</text>
  <text x="496" y="343" fill="#fde68a" font-size="8.2" font-weight="600">Example: Single-run p = 0.80 -&gt; Pass@5 = 99.97%, but Pass^5 = 32.77%!</text>
</svg>

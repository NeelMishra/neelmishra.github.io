<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" role="img" aria-label="PPO vs DPO vs GRPO Architecture and 7B Model VRAM Footprint Comparison">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; stroke-width: 1.5; rx: 12; }
      .box-red { fill: #281419; stroke: #f85149; stroke-width: 1.5; rx: 8; }
      .box-blue { fill: #122136; stroke: #58a6ff; stroke-width: 1.5; rx: 8; }
      .box-green { fill: #11261e; stroke: #3fb950; stroke-width: 1.5; rx: 8; }
      .box-amber { fill: #271e12; stroke: #d29922; stroke-width: 1.5; rx: 8; }
      .box-purple { fill: #211832; stroke: #a371f7; stroke-width: 1.5; rx: 8; }
      .box-neutral { fill: #1c2128; stroke: #484f58; stroke-width: 1.2; rx: 6; }
      .title { font-family: 'Manrope', 'DejaVu Sans', sans-serif; font-size: 18px; font-weight: 800; fill: #f0f6fc; }
      .subtitle { font-family: 'Manrope', 'DejaVu Sans', sans-serif; font-size: 12.5px; font-weight: 500; fill: #8b949e; }
      .sec-hdr { font-family: 'Manrope', 'DejaVu Sans', sans-serif; font-size: 14px; font-weight: 700; fill: #e6edf3; }
      .lbl-bold { font-family: 'Manrope', 'DejaVu Sans', sans-serif; font-size: 12px; font-weight: 700; fill: #f0f6fc; }
      .lbl { font-family: 'Manrope', 'DejaVu Sans', sans-serif; font-size: 11px; font-weight: 500; fill: #c9d1d9; }
      .mono { font-family: 'JetBrains Mono', 'DejaVu Sans Mono', monospace; font-size: 10.5px; fill: #79c0ff; }
      .mono-sm { font-family: 'JetBrains Mono', 'DejaVu Sans Mono', monospace; font-size: 9.6px; fill: #a5d6ff; }
      .mono-green { font-family: 'JetBrains Mono', 'DejaVu Sans Mono', monospace; font-size: 10.5px; font-weight: 700; fill: #56d364; }
      .mono-red { font-family: 'JetBrains Mono', 'DejaVu Sans Mono', monospace; font-size: 10.5px; font-weight: 700; fill: #ff7b72; }
      .mono-amber { font-family: 'JetBrains Mono', 'DejaVu Sans Mono', monospace; font-size: 10px; font-weight: 700; fill: #e3b341; }
      .edge-blue { stroke: #58a6ff; stroke-width: 1.8; fill: none; }
      .edge-green { stroke: #3fb950; stroke-width: 1.8; fill: none; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#58a6ff"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#3fb950"/>
    </marker>
  </defs>

  <rect width="1120" height="640" class="bg"/>

  <!-- Main Header -->
  <text x="28" y="34" class="title">PPO vs. DPO vs. GRPO: Architecture Dataflow &amp; 7B Parameter VRAM Accounting</text>
  <text x="28" y="54" class="subtitle">Comparing resident GPU models, optimizer states (AdamW FP32 = 16 bytes/param), advantage baselines, and rollout overhead</text>

  <!-- COLUMN A: PPO (Left) -->
  <rect x="24" y="74" width="344" height="544" class="panel"/>
  <text x="42" y="100" class="sec-hdr">A. PPO (4 Resident Models in GPU VRAM)</text>
  <text x="42" y="118" class="mono-red">7B Full-Param State: ~252 GB + KV Cache</text>

  <rect x="42" y="132" width="308" height="72" class="box-red"/>
  <text x="56" y="152" class="lbl-bold">1. Policy Actor pi_theta (Trainable 7B)</text>
  <text x="56" y="170" class="mono-sm">Weights (14GB) + Grads (14GB) + AdamW (84GB)</text>
  <text x="56" y="188" class="mono-red">Subtotal: 112 GB | Online Rollout y ~ pi_theta</text>

  <rect x="42" y="216" width="308" height="72" class="box-red"/>
  <text x="56" y="236" class="lbl-bold">2. Value Critic V_psi (Trainable 7B)</text>
  <text x="56" y="254" class="mono-sm">Weights (14GB) + Grads (14GB) + AdamW (84GB)</text>
  <text x="56" y="272" class="mono-red">Subtotal: 112 GB | Predicts V(s_t) per token</text>

  <rect x="42" y="300" width="148" height="64" class="box-neutral"/>
  <text x="54" y="320" class="lbl-bold">3. Ref Policy pi_ref</text>
  <text x="54" y="338" class="mono-sm">Frozen BF16: 14 GB</text>
  <text x="54" y="353" class="lbl">Token KL penalty</text>

  <rect x="202" y="300" width="148" height="64" class="box-neutral"/>
  <text x="214" y="320" class="lbl-bold">4. Reward r_phi</text>
  <text x="214" y="338" class="mono-sm">Frozen BF16: 14 GB</text>
  <text x="214" y="353" class="lbl">Scalar score r(x,y)</text>

  <rect x="42" y="378" width="308" height="114" class="box-amber"/>
  <text x="56" y="400" class="lbl-bold">PPO Advantage &amp; Update Loop</text>
  <text x="56" y="420" class="mono-sm">delta_t = r_t + gamma*V(s_{t+1}) - V(s_t)</text>
  <text x="56" y="438" class="mono-sm">A_t^GAE = sum (gamma*lambda)^l * delta_{t+l}</text>
  <text x="56" y="456" class="mono-sm">L_PPO = -E[min(rho_t*A_t, clip(rho_t)*A_t)]</text>
  <text x="56" y="476" class="mono-amber">Bottleneck: Critic lag &amp; 4-model sync</text>

  <text x="42" y="518" class="lbl-bold">When PPO is Used:</text>
  <text x="42" y="536" class="lbl">- Large-scale frontier labs with custom distributed</text>
  <text x="42" y="552" class="lbl">  Ray/Megatron actor-learner clusters.</text>
  <text x="42" y="572" class="lbl">- Fine-grained token-level credit assignment.</text>
  <text x="42" y="596" class="mono-red">Rarely cost-effective for enterprise teams.</text>

  <!-- COLUMN B: DPO (Center) -->
  <rect x="388" y="74" width="344" height="544" class="panel"/>
  <text x="406" y="100" class="sec-hdr">B. DPO (Zero Critic, Zero Online Rollout)</text>
  <text x="406" y="118" class="mono-green">7B Full: 112 GB | QLoRA DPO: ~18 GB (1 GPU)</text>

  <rect x="406" y="132" width="308" height="82" class="box-blue"/>
  <text x="420" y="152" class="lbl-bold">1. Policy Model pi_theta (Trainable)</text>
  <text x="420" y="170" class="mono-sm">Scores offline pairs (x, y_w, y_l) in 1 pass</text>
  <text x="420" y="188" class="mono-sm">Full: 112 GB | LoRA (r=32): +1.2 GB over base</text>
  <text x="420" y="204" class="mono-green">No autoregressive rollout during training!</text>

  <rect x="406" y="226" width="308" height="80" class="box-purple"/>
  <text x="420" y="246" class="lbl-bold">2. Reference Log-Probs log pi_ref(y | x)</text>
  <text x="420" y="264" class="mono-sm">Opt A: Precompute log pi_ref to disk (0 GB)</text>
  <text x="420" y="282" class="mono-sm">Opt B: Toggle LoRA disable_adapter() (0 GB)</text>
  <text x="420" y="298" class="mono-sm">Opt C: Frozen BF16 Reference in RAM (14 GB)</text>

  <rect x="406" y="320" width="308" height="172" class="box-green"/>
  <text x="420" y="342" class="lbl-bold">Closed-Form Implicit Reward &amp; Loss</text>
  <text x="420" y="362" class="mono-sm">r_hat(x,y) = beta * log(pi_theta / pi_ref)</text>
  <text x="420" y="380" class="mono-green">Partition Z(x) cancels in y_w vs y_l margin!</text>
  <text x="420" y="400" class="mono-sm">u = beta * (Delta_w - Delta_l)</text>
  <text x="420" y="418" class="mono-sm">L_DPO = -E[ log sigma(u) ]</text>
  <text x="420" y="438" class="mono-amber">Stabilized Objective (+NLL Anchor):</text>
  <text x="420" y="456" class="mono-sm">L_tot = L_DPO - alpha * log pi(y_w|x) / |y_w|</text>
  <text x="420" y="476" class="lbl">Prevents displacement on shared prefixes</text>

  <text x="406" y="518" class="lbl-bold">When DPO (+NLL / IPO) is Used:</text>
  <text x="406" y="536" class="lbl">- Curated preference pairs from production user edits</text>
  <text x="406" y="552" class="lbl">  (AutoPulse CRM) or search click/cart logs (VogueCart).</text>
  <text x="406" y="572" class="lbl">- Eliminating stubborn near-miss SFT hallucinations.</text>
  <text x="406" y="596" class="mono-green">Best ROI per GPU-hour for alignment.</text>

  <!-- COLUMN C: GRPO (Right) -->
  <rect x="752" y="74" width="344" height="544" class="panel"/>
  <text x="770" y="100" class="sec-hdr">C. GRPO (Online Group Rollout, Zero Critic)</text>
  <text x="770" y="118" class="mono-green">Saves 50% Critic VRAM vs. PPO | Ideal for RLVR</text>

  <rect x="770" y="132" width="308" height="82" class="box-blue"/>
  <text x="784" y="152" class="lbl-bold">1. Policy Actor pi_theta + vLLM Sampler</text>
  <text x="784" y="170" class="mono-sm">Samples group {y_1, ..., y_G} ~ pi_old(. | x)</text>
  <text x="784" y="188" class="mono-sm">(Typically G = 8 or 16 completions per prompt x)</text>
  <text x="784" y="204" class="mono-green">Shares weights with fast vLLM rollout worker</text>

  <rect x="770" y="226" width="308" height="80" class="box-purple"/>
  <text x="784" y="246" class="lbl-bold">2. Verifier / Rule Oracle R(x, y_i) + pi_ref</text>
  <text x="784" y="264" class="mono-sm">Deterministic Verifier: SQL AST, Schema, Math,</text>
  <text x="784" y="282" class="mono-sm">Unit Tests, or Constraint Solver -&gt; r_i in [0,1]</text>
  <text x="784" y="298" class="mono-green">Zero neural Critic V_psi (-112 GB saved!)</text>

  <rect x="770" y="320" width="308" height="172" class="box-green"/>
  <text x="784" y="342" class="lbl-bold">Group-Relative Advantage &amp; k3 KL Loss</text>
  <text x="784" y="362" class="mono-green">A_hat_{i,t} = (r_i - mean(r)) / (std(r) + eps)</text>
  <text x="784" y="382" class="lbl">Group mean acts as low-variance Monte Carlo</text>
  <text x="784" y="398" class="lbl">baseline without training a value network!</text>
  <text x="784" y="420" class="mono-sm">Explicit Schulman k3 KL Penalty (&gt;= 0):</text>
  <text x="784" y="438" class="mono-sm">D_KL = (pi_ref / pi) - log(pi_ref / pi) - 1</text>
  <text x="784" y="458" class="mono-sm">L_GRPO = -E[min(rho*A, clip*A) - beta*D_KL]</text>
  <text x="784" y="476" class="mono-amber">Filter groups where std(r) == 0 (all pass/fail)</text>

  <text x="770" y="518" class="lbl-bold">When GRPO (RLVR) is Used:</text>
  <text x="770" y="536" class="lbl">- Multi-step tool planning, SQL generation, code,</text>
  <text x="770" y="552" class="lbl">  and reasoning where an exact verifier exists.</text>
  <text x="770" y="572" class="lbl">- Directly optimizes online pass@1 and pass^k.</text>
  <text x="770" y="596" class="mono-green">State-of-the-art for verifiable agent tasks.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" role="img" aria-label="Production Preference Data Curation and Hygiene Pipeline">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; stroke-width: 1.5; rx: 12; }
      .box-blue { fill: #122136; stroke: #58a6ff; stroke-width: 1.5; rx: 8; }
      .box-green { fill: #11261e; stroke: #3fb950; stroke-width: 1.5; rx: 8; }
      .box-amber { fill: #271e12; stroke: #d29922; stroke-width: 1.5; rx: 8; }
      .box-purple { fill: #211832; stroke: #a371f7; stroke-width: 1.5; rx: 8; }
      .box-red { fill: #281419; stroke: #f85149; stroke-width: 1.5; rx: 8; }
      .box-neutral { fill: #1c2128; stroke: #484f58; stroke-width: 1.2; rx: 6; }
      .title { font-family: 'Manrope', 'DejaVu Sans', sans-serif; font-size: 18px; font-weight: 800; fill: #f0f6fc; }
      .subtitle { font-family: 'Manrope', 'DejaVu Sans', sans-serif; font-size: 12.5px; font-weight: 500; fill: #8b949e; }
      .sec-hdr { font-family: 'Manrope', 'DejaVu Sans', sans-serif; font-size: 14px; font-weight: 700; fill: #e6edf3; }
      .lbl-bold { font-family: 'Manrope', 'DejaVu Sans', sans-serif; font-size: 12px; font-weight: 700; fill: #f0f6fc; }
      .lbl { font-family: 'Manrope', 'DejaVu Sans', sans-serif; font-size: 11px; font-weight: 500; fill: #c9d1d9; }
      .mono { font-family: 'JetBrains Mono', 'DejaVu Sans Mono', monospace; font-size: 10.5px; fill: #79c0ff; }
      .mono-sm { font-family: 'JetBrains Mono', 'DejaVu Sans Mono', monospace; font-size: 9.6px; fill: #a5d6ff; }
      .mono-green { font-family: 'JetBrains Mono', 'DejaVu Sans Mono', monospace; font-size: 10.5px; font-weight: 700; fill: #56d364; }
      .mono-amber { font-family: 'JetBrains Mono', 'DejaVu Sans Mono', monospace; font-size: 10px; font-weight: 700; fill: #e3b341; }
      .edge-blue { stroke: #58a6ff; stroke-width: 1.8; fill: none; }
      .edge-green { stroke: #3fb950; stroke-width: 1.8; fill: none; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#58a6ff"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#3fb950"/>
    </marker>
  </defs>

  <rect width="1120" height="600" class="bg"/>

  <!-- Main Header -->
  <text x="28" y="34" class="title">Preference Data Curation Pipeline: Harvesting On-Policy (x, y_w, y_l) Triples</text>
  <text x="28" y="54" class="subtitle">Combining user edit diffs (AutoPulse CRM), reformulation-to-cart logs (VogueCart), and Best-of-N hard negatives with length de-confounding</text>

  <!-- TOP PANEL: 3 Production Preference Sources -->
  <rect x="24" y="74" width="1072" height="222" class="panel"/>
  <text x="44" y="98" class="sec-hdr">A. Three Complementary On-Policy Preference Harvesting Streams</text>

  <!-- Source 1: AutoPulse CRM Edits -->
  <rect x="44" y="112" width="332" height="168" class="box-blue"/>
  <text x="60" y="134" class="lbl-bold">1. Enterprise User Edit Diffs (AutoPulse CRM)</text>
  <text x="60" y="154" class="mono-sm">y_l = AI Draft ~ pi_SFT(. | x)</text>
  <text x="60" y="172" class="mono-green">y_w = Advisor Edited &amp; Sent Version</text>
  <text x="60" y="194" class="lbl">- Natural domain-expert corrections of</text>
  <text x="60" y="210" class="lbl">  repair notes, part SKUs &amp; warranty claims.</text>
  <text x="60" y="228" class="lbl">- Strictly on-policy for y_l; zero extra</text>
  <text x="60" y="244" class="lbl">  annotation budget required.</text>
  <text x="60" y="264" class="mono-amber">Yield: ~18,000 raw edit pairs / week</text>

  <!-- Source 2: VogueCart Behavioral Logs -->
  <rect x="394" y="112" width="332" height="168" class="box-purple"/>
  <text x="410" y="134" class="lbl-bold">2. Reformulation-to-Cart Logs (VogueCart)</text>
  <text x="410" y="154" class="mono-sm">y_l = Turn t (0 clicks + &lt;30s reformulation)</text>
  <text x="410" y="172" class="mono-green">y_w = Turn t+1 (Dwell &gt;25s + AddToCart)</text>
  <text x="410" y="194" class="lbl">- Captures implicit user rejection when</text>
  <text x="410" y="210" class="lbl">  a tool call drops fabric/budget slots.</text>
  <text x="410" y="228" class="lbl">- Re-contextualizes turn-t prompt with</text>
  <text x="410" y="244" class="lbl">  clarified constraint ledger.</text>
  <text x="410" y="264" class="mono-amber">Yield: ~42,000 trajectory pairs / week</text>

  <!-- Source 3: On-Policy Best-of-N Hard Negatives -->
  <rect x="744" y="112" width="332" height="168" class="box-green"/>
  <text x="760" y="134" class="lbl-bold">3. Best-of-N Hard-Negative Mining (N = 8)</text>
  <text x="760" y="154" class="mono-green">y_w = argmax_{y_i: Pass} R(x, y_i)</text>
  <text x="760" y="172" class="mono-sm">y_l = argmax_{y_i: Fail} log pi_SFT(y_i | x)/|y_i|</text>
  <text x="760" y="194" class="lbl">- Pairs best verified output against the</text>
  <text x="760" y="210" class="lbl">  highest-likelihood failed near-miss!</text>
  <text x="760" y="228" class="lbl">- 2.4x higher DPO margin efficiency than</text>
  <text x="760" y="244" class="lbl">  pairing against random low-prob failures.</text>
  <text x="760" y="264" class="mono-amber">Covers tail prompts with sparse user logs</text>

  <!-- BOTTOM PANEL: 4-Stage Hygiene & De-Confounding Funnel -->
  <rect x="24" y="314" width="1072" height="264" class="panel"/>
  <text x="44" y="338" class="sec-hdr">B. Four-Stage Preference Hygiene, Position-Bias Removal &amp; Length De-Confounding Funnel</text>

  <!-- Stage 1 -->
  <rect x="44" y="356" width="236" height="198" class="box-neutral"/>
  <text x="58" y="378" class="lbl-bold">Stage 1: Edit Distance</text>
  <text x="58" y="396" class="mono-sm">0.08 &lt;= d_lev(y_w,y_l) &lt;= 0.65</text>
  <text x="58" y="420" class="lbl">- Drops trivial typo/comma</text>
  <text x="58" y="436" class="lbl">  edits (d_lev &lt; 0.08).</text>
  <text x="58" y="456" class="lbl">- Drops intent-switch</text>
  <text x="58" y="472" class="lbl">  rewrites (d_lev &gt; 0.65).</text>
  <text x="58" y="496" class="lbl">- Deduplicates near-identical</text>
  <text x="58" y="512" class="lbl">  prompts via MinHash LSH.</text>
  <text x="58" y="538" class="mono-amber">Retains: 64% of raw pairs</text>

  <line x1="280" y1="455" x2="302" y2="455" class="edge-blue" marker-end="url(#arr-blue)"/>

  <!-- Stage 2 -->
  <rect x="304" y="356" width="236" height="198" class="box-blue"/>
  <text x="318" y="378" class="lbl-bold">Stage 2: Verifier Delta</text>
  <text x="318" y="396" class="mono-green">V(y_w) == 1 &amp;&amp; V(y_l) &lt;= V(y_w)</text>
  <text x="318" y="420" class="lbl">- Asserts y_w passes 100%</text>
  <text x="318" y="436" class="lbl">  of schema, price, SKU, and</text>
  <text x="318" y="452" class="lbl">  slot-ledger invariants.</text>
  <text x="318" y="474" class="lbl">- Rejects human edits that</text>
  <text x="318" y="490" class="lbl">  accidentally introduce PII</text>
  <text x="318" y="506" class="lbl">  or policy violations.</text>
  <text x="318" y="538" class="mono-green">Zero ungrounded y_w targets</text>

  <line x1="540" y1="455" x2="562" y2="455" class="edge-blue" marker-end="url(#arr-blue)"/>

  <!-- Stage 3 -->
  <rect x="564" y="356" width="236" height="198" class="box-purple"/>
  <text x="578" y="378" class="lbl-bold">Stage 3: Swapped Judge</text>
  <text x="578" y="396" class="mono-sm">J(y_w, y_l) &amp;&amp; J(y_l, y_w)</text>
  <text x="578" y="420" class="lbl">- Evaluates pair in both</text>
  <text x="578" y="436" class="lbl">  (A,B) and (B,A) orders.</text>
  <text x="578" y="456" class="lbl">- Discards position-biased</text>
  <text x="578" y="472" class="lbl">  ties where judge flips</text>
  <text x="578" y="488" class="lbl">  winner upon swapping.</text>
  <text x="578" y="512" class="mono-sm">Assigns margin m in {0.5,1.5,3}</text>
  <text x="578" y="538" class="mono-amber">Kappa with experts = 0.83</text>

  <line x1="800" y1="455" x2="822" y2="455" class="edge-green" marker-end="url(#arr-green)"/>

  <!-- Stage 4 -->
  <rect x="824" y="356" width="252" height="198" class="box-green"/>
  <text x="838" y="378" class="lbl-bold">Stage 4: Length Balancing</text>
  <text x="838" y="396" class="mono-green">|E[sign(|y_w| - |y_l|)]| &lt;= 0.02</text>
  <text x="838" y="420" class="lbl">- Stratifies pairs so y_w is</text>
  <text x="838" y="436" class="lbl">  shorter than y_l 50% of</text>
  <text x="838" y="452" class="lbl">  the time!</text>
  <text x="838" y="474" class="lbl">- Prevents DPO &amp; RM from</text>
  <text x="838" y="490" class="lbl">  learning verbosity bias</text>
  <text x="838" y="506" class="lbl">  r(x,y) ~ token_length.</text>
  <text x="838" y="538" class="mono-green">Gold Dataset D_pref Ready</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 750" role="img" aria-labelledby="title desc">
<title id="title">Propagating a change</title><desc id="desc">Values and perturbations flow down parallel columns.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087b60"/></marker></defs>
<rect width="480" height="750" fill="#fffdf9"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="24" y="39" font-size="20" fill="#087b60" font-weight="700" text-anchor="start">THE CHAIN RULE IN SMALL STEPS</text><text x="24" y="81" font-size="22" fill="#173e35" font-weight="700" text-anchor="start">Values</text><text x="285" y="81" font-size="22" fill="#087b60" font-weight="700" text-anchor="start">Changes</text><rect x="24" y="100" width="207" height="100" rx="14" fill="#f7f3ea" stroke="#d8dfd7"/><text x="127" y="139" font-size="27" fill="#173e35" font-weight="700" text-anchor="middle">x = 2</text><text x="127" y="176" font-size="23" fill="#54675e" font-weight="400" text-anchor="middle">input</text><rect x="275" y="100" width="181" height="100" rx="14" fill="#f1f6ef" stroke="#d8dfd7"/><text x="365" y="159" font-size="30" fill="#087b60" font-weight="700" text-anchor="middle">h</text><line x1="125" y1="209" x2="125" y2="243" stroke="#087b60" stroke-width="3" marker-end="url(#arrow)"/><line x1="365" y1="209" x2="365" y2="243" stroke="#087b60" stroke-width="3" marker-end="url(#arrow)"/><text x="277" y="235" font-size="21" fill="#087b60" font-weight="700" text-anchor="middle">× 2x</text><rect x="24" y="255" width="207" height="100" rx="14" fill="#f7f3ea" stroke="#d8dfd7"/><text x="127" y="294" font-size="27" fill="#173e35" font-weight="700" text-anchor="middle">u = 4</text><text x="127" y="331" font-size="23" fill="#54675e" font-weight="400" text-anchor="middle">u = x²</text><rect x="275" y="255" width="181" height="100" rx="14" fill="#f1f6ef" stroke="#d8dfd7"/><text x="365" y="314" font-size="30" fill="#087b60" font-weight="700" text-anchor="middle">4h</text><line x1="125" y1="364" x2="125" y2="398" stroke="#087b60" stroke-width="3" marker-end="url(#arrow)"/><line x1="365" y1="364" x2="365" y2="398" stroke="#087b60" stroke-width="3" marker-end="url(#arrow)"/><text x="277" y="390" font-size="21" fill="#087b60" font-weight="700" text-anchor="middle">× 1</text><rect x="24" y="410" width="207" height="100" rx="14" fill="#f7f3ea" stroke="#d8dfd7"/><text x="127" y="449" font-size="27" fill="#173e35" font-weight="700" text-anchor="middle">v = 5</text><text x="127" y="486" font-size="23" fill="#54675e" font-weight="400" text-anchor="middle">v = u + 1</text><rect x="275" y="410" width="181" height="100" rx="14" fill="#f1f6ef" stroke="#d8dfd7"/><text x="365" y="469" font-size="30" fill="#087b60" font-weight="700" text-anchor="middle">4h</text><line x1="125" y1="519" x2="125" y2="553" stroke="#087b60" stroke-width="3" marker-end="url(#arrow)"/><line x1="365" y1="519" x2="365" y2="553" stroke="#087b60" stroke-width="3" marker-end="url(#arrow)"/><text x="277" y="545" font-size="21" fill="#087b60" font-weight="700" text-anchor="middle">× 2v</text><rect x="24" y="565" width="207" height="100" rx="14" fill="#f7f3ea" stroke="#d8dfd7"/><text x="127" y="604" font-size="27" fill="#173e35" font-weight="700" text-anchor="middle">q = 25</text><text x="127" y="641" font-size="23" fill="#54675e" font-weight="400" text-anchor="middle">q = v²</text><rect x="275" y="565" width="181" height="100" rx="14" fill="#f1f6ef" stroke="#d8dfd7"/><text x="365" y="624" font-size="30" fill="#087b60" font-weight="700" text-anchor="middle">40h</text><text x="24" y="718" font-size="24" fill="#173e35" font-weight="700" text-anchor="start">At x = 2, the derivative is 40.</text></g></svg>

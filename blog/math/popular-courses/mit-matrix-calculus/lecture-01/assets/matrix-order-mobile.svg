<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 675" role="img" aria-labelledby="title desc">
<title id="title">Two multiplication orders</title><desc id="desc">XE and EX add to the correct derivative action. Doubling XE gives a different matrix.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087b60"/></marker></defs>
<rect width="480" height="675" fill="#fffdf9"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="24" y="39" font-size="19" fill="#087b60" font-weight="700" text-anchor="start">KEEP BOTH MULTIPLICATION ORDERS</text><rect x="24" y="73" width="187" height="174" rx="14" fill="#f1f6ef" stroke="#d8dfd7"/><text x="117" y="112" font-size="26" fill="#087b60" font-weight="700" text-anchor="middle">XE</text><path d="M61 134 h-8 v84 h8 M169 134 h8 v84 h-8" fill="none" stroke="#173e35" stroke-width="2"/><text x="87" y="164" font-size="28" fill="#173e35" font-weight="500" text-anchor="middle">2</text><text x="142" y="164" font-size="28" fill="#173e35" font-weight="500" text-anchor="middle">1</text><text x="87" y="203" font-size="28" fill="#173e35" font-weight="500" text-anchor="middle">3</text><text x="142" y="203" font-size="28" fill="#173e35" font-weight="500" text-anchor="middle">0</text><rect x="257" y="73" width="187" height="174" rx="14" fill="#f1f6ef" stroke="#d8dfd7"/><text x="350" y="112" font-size="26" fill="#087b60" font-weight="700" text-anchor="middle">EX</text><path d="M294 134 h-8 v84 h8 M402 134 h8 v84 h-8" fill="none" stroke="#173e35" stroke-width="2"/><text x="320" y="164" font-size="28" fill="#173e35" font-weight="500" text-anchor="middle">0</text><text x="375" y="164" font-size="28" fill="#173e35" font-weight="500" text-anchor="middle">3</text><text x="320" y="203" font-size="28" fill="#173e35" font-weight="500" text-anchor="middle">1</text><text x="375" y="203" font-size="28" fill="#173e35" font-weight="500" text-anchor="middle">2</text><text x="234" y="184" font-size="28" fill="#087b60" font-weight="700" text-anchor="middle">+</text><rect x="24" y="278" width="432" height="169" rx="14" fill="#f1f6ef" stroke="#d8dfd7"/><text x="49" y="320" font-size="26" fill="#087b60" font-weight="700" text-anchor="start">XE + EX</text><path d="M290 318 h-8 v84 h8 M398 318 h8 v84 h-8" fill="none" stroke="#173e35" stroke-width="2"/><text x="316" y="348" font-size="28" fill="#173e35" font-weight="500" text-anchor="middle">2</text><text x="371" y="348" font-size="28" fill="#173e35" font-weight="500" text-anchor="middle">4</text><text x="316" y="387" font-size="28" fill="#173e35" font-weight="500" text-anchor="middle">4</text><text x="371" y="387" font-size="28" fill="#173e35" font-weight="500" text-anchor="middle">2</text><text x="49" y="373" font-size="22" fill="#54675e" font-weight="400" text-anchor="start">Correct</text><text x="49" y="405" font-size="22" fill="#54675e" font-weight="400" text-anchor="start">linear rule</text><rect x="24" y="477" width="432" height="169" rx="14" fill="#f7f3ea" stroke="#d8dfd7"/><text x="49" y="522" font-size="26" fill="#b64b24" font-weight="700" text-anchor="start">2XE</text><path d="M290 517 h-8 v84 h8 M398 517 h8 v84 h-8" fill="none" stroke="#173e35" stroke-width="2"/><text x="316" y="547" font-size="28" fill="#173e35" font-weight="500" text-anchor="middle">4</text><text x="371" y="547" font-size="28" fill="#173e35" font-weight="500" text-anchor="middle">2</text><text x="316" y="586" font-size="28" fill="#173e35" font-weight="500" text-anchor="middle">6</text><text x="371" y="586" font-size="28" fill="#173e35" font-weight="500" text-anchor="middle">0</text><text x="49" y="569" font-size="22" fill="#54675e" font-weight="400" text-anchor="start">Different</text><text x="49" y="601" font-size="22" fill="#54675e" font-weight="400" text-anchor="start">answer</text></g></svg>

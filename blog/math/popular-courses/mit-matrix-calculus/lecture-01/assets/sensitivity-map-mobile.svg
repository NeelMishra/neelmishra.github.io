<g font-family="Arial, Helvetica, sans-serif"><text x="24" y="39" font-size="20" fill="#087b60" font-weight="700" text-anchor="start">VALUES AND THEIR CHANGES</text><text x="24" y="78" font-size="23" fill="#173e35" font-weight="700" text-anchor="start">Original calculation</text><rect x="24" y="98" width="432" height="86" rx="14" fill="#f7f3ea" stroke="#d8dfd7"/><text x="240" y="133" font-size="25" fill="#173e35" font-weight="700" text-anchor="middle">Parameters X</text><text x="240" y="163" font-size="21" fill="#54675e" font-weight="400" text-anchor="middle">weights · geometry</text><line x1="240" y1="187" x2="240" y2="206" stroke="#087b60" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="210" width="432" height="86" rx="14" fill="#f7f3ea" stroke="#d8dfd7"/><text x="240" y="245" font-size="25" fill="#173e35" font-weight="700" text-anchor="middle">Computation F</text><text x="240" y="275" font-size="21" fill="#54675e" font-weight="400" text-anchor="middle">model · simulation</text><line x1="240" y1="299" x2="240" y2="318" stroke="#087b60" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="322" width="432" height="86" rx="14" fill="#f7f3ea" stroke="#d8dfd7"/><text x="240" y="357" font-size="25" fill="#173e35" font-weight="700" text-anchor="middle">Objective F(X)</text><text x="240" y="387" font-size="21" fill="#54675e" font-weight="400" text-anchor="middle">loss · drag</text><text x="24" y="463" font-size="23" fill="#173e35" font-weight="700" text-anchor="start">Fix X. Now follow a perturbation.</text><rect x="24" y="484" width="432" height="86" rx="14" fill="#f1f6ef" stroke="#d8dfd7"/><text x="240" y="519" font-size="24" fill="#173e35" font-weight="700" text-anchor="middle">Input change H</text><text x="240" y="549" font-size="21" fill="#54675e" font-weight="400" text-anchor="middle">a small perturbation</text><line x1="240" y1="573" x2="240" y2="592" stroke="#087b60" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="596" width="432" height="86" rx="14" fill="#f1f6ef" stroke="#d8dfd7"/><text x="240" y="631" font-size="24" fill="#173e35" font-weight="700" text-anchor="middle">Derivative DF(X)</text><text x="240" y="661" font-size="21" fill="#54675e" font-weight="400" text-anchor="middle">evaluated at the current X</text><line x1="240" y1="685" x2="240" y2="704" stroke="#087b60" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="708" width="432" height="86" rx="14" fill="#f1f6ef" stroke="#d8dfd7"/><text x="240" y="743" font-size="24" fill="#173e35" font-weight="700" text-anchor="middle">Prediction DF(X)[H]</text><text x="240" y="773" font-size="21" fill="#54675e" font-weight="400" text-anchor="middle">first-order output change</text></g></svg>

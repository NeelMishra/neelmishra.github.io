<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
<title id="title">A forward derivative calculation</title><desc id="desc">The chain rule transforms h to 4h to 4h to 40h at x equals 2.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087b60"/></marker></defs>
<rect width="960" height="470" fill="#fffdf9"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" font-size="18" fill="#087b60" font-weight="700" text-anchor="start">PROPAGATE A CHANGE THROUGH SIMPLE OPERATIONS</text><rect x="38" y="98" width="188" height="127" rx="14" fill="#f7f3ea" stroke="#d8dfd7"/><text x="132" y="141" font-size="27" fill="#173e35" font-weight="700" text-anchor="middle">x = 2</text><text x="132" y="187" font-size="22" fill="#54675e" font-weight="400" text-anchor="middle">input</text><rect x="38" y="290" width="188" height="78" rx="14" fill="#f1f6ef" stroke="#d8dfd7"/><text x="132" y="340" font-size="29" fill="#087b60" font-weight="700" text-anchor="middle">h</text><line x1="231" y1="158" x2="261" y2="158" stroke="#087b60" stroke-width="3" marker-end="url(#arrow)"/><line x1="231" y1="329" x2="261" y2="329" stroke="#087b60" stroke-width="3" marker-end="url(#arrow)"/><text x="248" y="275" font-size="18" fill="#087b60" font-weight="700" text-anchor="middle">× 2x</text><rect x="270" y="98" width="188" height="127" rx="14" fill="#f7f3ea" stroke="#d8dfd7"/><text x="364" y="141" font-size="27" fill="#173e35" font-weight="700" text-anchor="middle">u = 4</text><text x="364" y="187" font-size="22" fill="#54675e" font-weight="400" text-anchor="middle">u = x²</text><rect x="270" y="290" width="188" height="78" rx="14" fill="#f1f6ef" stroke="#d8dfd7"/><text x="364" y="340" font-size="29" fill="#087b60" font-weight="700" text-anchor="middle">4h</text><line x1="463" y1="158" x2="493" y2="158" stroke="#087b60" stroke-width="3" marker-end="url(#arrow)"/><line x1="463" y1="329" x2="493" y2="329" stroke="#087b60" stroke-width="3" marker-end="url(#arrow)"/><text x="480" y="275" font-size="18" fill="#087b60" font-weight="700" text-anchor="middle">× 1</text><rect x="502" y="98" width="188" height="127" rx="14" fill="#f7f3ea" stroke="#d8dfd7"/><text x="596" y="141" font-size="27" fill="#173e35" font-weight="700" text-anchor="middle">v = 5</text><text x="596" y="187" font-size="22" fill="#54675e" font-weight="400" text-anchor="middle">v = u + 1</text><rect x="502" y="290" width="188" height="78" rx="14" fill="#f1f6ef" stroke="#d8dfd7"/><text x="596" y="340" font-size="29" fill="#087b60" font-weight="700" text-anchor="middle">4h</text><line x1="695" y1="158" x2="725" y2="158" stroke="#087b60" stroke-width="3" marker-end="url(#arrow)"/><line x1="695" y1="329" x2="725" y2="329" stroke="#087b60" stroke-width="3" marker-end="url(#arrow)"/><text x="712" y="275" font-size="18" fill="#087b60" font-weight="700" text-anchor="middle">× 2v</text><rect x="734" y="98" width="188" height="127" rx="14" fill="#f7f3ea" stroke="#d8dfd7"/><text x="828" y="141" font-size="27" fill="#173e35" font-weight="700" text-anchor="middle">q = 25</text><text x="828" y="187" font-size="22" fill="#54675e" font-weight="400" text-anchor="middle">q = v²</text><rect x="734" y="290" width="188" height="78" rx="14" fill="#f1f6ef" stroke="#d8dfd7"/><text x="828" y="340" font-size="29" fill="#087b60" font-weight="700" text-anchor="middle">40h</text><text x="38" y="422" font-size="21" fill="#54675e" font-weight="400" text-anchor="start">Values travel across the top; first-order changes travel across the bottom.</text></g></svg>

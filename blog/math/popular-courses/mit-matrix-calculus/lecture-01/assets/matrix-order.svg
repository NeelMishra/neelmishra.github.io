<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
<title id="title">Order matters for a matrix square</title><desc id="desc">XE plus EX differs from twice XE for the matrix example.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087b60"/></marker></defs>
<rect width="960" height="500" fill="#fffdf9"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" font-size="18" fill="#087b60" font-weight="700" text-anchor="start">TWO MULTIPLICATION ORDERS, TWO DIFFERENT ANSWERS</text><rect x="40" y="80" width="230" height="174" rx="14" fill="#f1f6ef" stroke="#d8dfd7"/><text x="155" y="117" font-size="24" fill="#087b60" font-weight="700" text-anchor="middle">XE</text><path d="M101 139 h-8 v84 h8 M209 139 h8 v84 h-8" fill="none" stroke="#173e35" stroke-width="2"/><text x="127" y="169" font-size="28" fill="#173e35" font-weight="500" text-anchor="middle">2</text><text x="182" y="169" font-size="28" fill="#173e35" font-weight="500" text-anchor="middle">1</text><text x="127" y="208" font-size="28" fill="#173e35" font-weight="500" text-anchor="middle">3</text><text x="182" y="208" font-size="28" fill="#173e35" font-weight="500" text-anchor="middle">0</text><rect x="351" y="80" width="230" height="174" rx="14" fill="#f1f6ef" stroke="#d8dfd7"/><text x="466" y="117" font-size="24" fill="#087b60" font-weight="700" text-anchor="middle">EX</text><path d="M412 139 h-8 v84 h8 M520 139 h8 v84 h-8" fill="none" stroke="#173e35" stroke-width="2"/><text x="438" y="169" font-size="28" fill="#173e35" font-weight="500" text-anchor="middle">0</text><text x="493" y="169" font-size="28" fill="#173e35" font-weight="500" text-anchor="middle">3</text><text x="438" y="208" font-size="28" fill="#173e35" font-weight="500" text-anchor="middle">1</text><text x="493" y="208" font-size="28" fill="#173e35" font-weight="500" text-anchor="middle">2</text><rect x="683" y="80" width="230" height="174" rx="14" fill="#f1f6ef" stroke="#d8dfd7"/><text x="798" y="117" font-size="24" fill="#087b60" font-weight="700" text-anchor="middle">XE + EX</text><path d="M744 139 h-8 v84 h8 M852 139 h8 v84 h-8" fill="none" stroke="#173e35" stroke-width="2"/><text x="770" y="169" font-size="28" fill="#173e35" font-weight="500" text-anchor="middle">2</text><text x="825" y="169" font-size="28" fill="#173e35" font-weight="500" text-anchor="middle">4</text><text x="770" y="208" font-size="28" fill="#173e35" font-weight="500" text-anchor="middle">4</text><text x="825" y="208" font-size="28" fill="#173e35" font-weight="500" text-anchor="middle">2</text><text x="291" y="181" font-size="34" fill="#087b60" font-weight="700" text-anchor="start">+</text><text x="607" y="181" font-size="34" fill="#087b60" font-weight="700" text-anchor="start">=</text><rect x="40" y="296" width="880" height="159" rx="14" fill="#f7f3ea" stroke="#d8dfd7"/><text x="64" y="335" font-size="23" fill="#b64b24" font-weight="700" text-anchor="start">Doubling only XE gives</text><path d="M364 330 h-8 v84 h8 M472 330 h8 v84 h-8" fill="none" stroke="#173e35" stroke-width="2"/><text x="390" y="360" font-size="28" fill="#173e35" font-weight="500" text-anchor="middle">4</text><text x="445" y="360" font-size="28" fill="#173e35" font-weight="500" text-anchor="middle">2</text><text x="390" y="399" font-size="28" fill="#173e35" font-weight="500" text-anchor="middle">6</text><text x="445" y="399" font-size="28" fill="#173e35" font-weight="500" text-anchor="middle">0</text><text x="532" y="367" font-size="38" fill="#b64b24" font-weight="700" text-anchor="start">≠</text><path d="M637 330 h-8 v84 h8 M745 330 h8 v84 h-8" fill="none" stroke="#173e35" stroke-width="2"/><text x="663" y="360" font-size="28" fill="#173e35" font-weight="500" text-anchor="middle">2</text><text x="718" y="360" font-size="28" fill="#173e35" font-weight="500" text-anchor="middle">4</text><text x="663" y="399" font-size="28" fill="#173e35" font-weight="500" text-anchor="middle">4</text><text x="718" y="399" font-size="28" fill="#173e35" font-weight="500" text-anchor="middle">2</text><text x="64" y="422" font-size="20" fill="#54675e" font-weight="400" text-anchor="start">2XE misses the EX term.</text></g></svg>

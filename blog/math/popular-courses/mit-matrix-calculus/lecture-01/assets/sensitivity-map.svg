<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
<title id="title">Sensitivity: values and changes</title><desc id="desc">The derivative maps a parameter perturbation to a predicted objective change.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087b60"/></marker></defs>
<rect width="960" height="420" fill="#fffdf9"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="38" y="44" font-size="18" fill="#087b60" font-weight="700" text-anchor="start">ONE CALCULATION. TWO QUESTIONS.</text><rect x="38" y="90" width="258" height="110" rx="14" fill="#f7f3ea" stroke="#d8dfd7"/><text x="167" y="133" font-size="21" fill="#173e35" font-weight="700" text-anchor="middle">Parameters X</text><text x="167" y="168" font-size="18" fill="#54675e" font-weight="400" text-anchor="middle">weights · geometry</text><line x1="307" y1="145" x2="339" y2="145" stroke="#087b60" stroke-width="3" marker-end="url(#arrow)"/><rect x="351" y="90" width="258" height="110" rx="14" fill="#f7f3ea" stroke="#d8dfd7"/><text x="480" y="133" font-size="21" fill="#173e35" font-weight="700" text-anchor="middle">Computation F</text><text x="480" y="168" font-size="18" fill="#54675e" font-weight="400" text-anchor="middle">model · simulation</text><line x1="620" y1="145" x2="652" y2="145" stroke="#087b60" stroke-width="3" marker-end="url(#arrow)"/><rect x="664" y="90" width="258" height="110" rx="14" fill="#f7f3ea" stroke="#d8dfd7"/><text x="793" y="133" font-size="21" fill="#173e35" font-weight="700" text-anchor="middle">Objective F(X)</text><text x="793" y="168" font-size="18" fill="#54675e" font-weight="400" text-anchor="middle">loss · drag</text><rect x="38" y="255" width="258" height="110" rx="14" fill="#edf6f0" stroke="#d8dfd7"/><text x="167" y="298" font-size="21" fill="#173e35" font-weight="700" text-anchor="middle">Input change H</text><text x="167" y="333" font-size="18" fill="#54675e" font-weight="400" text-anchor="middle">a small perturbation</text><line x1="307" y1="310" x2="339" y2="310" stroke="#087b60" stroke-width="3" marker-end="url(#arrow)"/><rect x="351" y="255" width="258" height="110" rx="14" fill="#edf6f0" stroke="#d8dfd7"/><text x="480" y="298" font-size="21" fill="#173e35" font-weight="700" text-anchor="middle">Derivative DF(X)</text><text x="480" y="333" font-size="18" fill="#54675e" font-weight="400" text-anchor="middle">at the current input</text><line x1="620" y1="310" x2="652" y2="310" stroke="#087b60" stroke-width="3" marker-end="url(#arrow)"/><rect x="664" y="255" width="258" height="110" rx="14" fill="#edf6f0" stroke="#d8dfd7"/><text x="793" y="298" font-size="21" fill="#173e35" font-weight="700" text-anchor="middle">Prediction DF(X)[H]</text><text x="793" y="333" font-size="18" fill="#54675e" font-weight="400" text-anchor="middle">first-order change</text><text x="38" y="230" font-size="20" fill="#54675e" font-weight="400" text-anchor="start">Fix X. Now ask how a change travels through the calculation.</text></g></svg>

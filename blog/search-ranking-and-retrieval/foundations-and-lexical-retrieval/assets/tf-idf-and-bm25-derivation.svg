<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 308" width="860" height="308" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="860" height="308" rx="12" fill="#ffffff" />
  <style>
    .title { font-size: 15px; font-weight: 700; fill: #0f172a; }
    .sub { font-size: 10.6px; font-weight: 500; fill: #475569; }
    .mono { font-size: 9.2px; fill: #1e293b; }
    .mono-bold { font-size: 10.5px; font-weight: 700; }
    .card { rx: 10; ry: 10; stroke-width: 1.5; }
  </style>

  <text x="430" y="26" text-anchor="middle" class="title">From TF-IDF to Okapi BM25: Rare Terms, Saturation, and Length Normalization</text>

  <!-- Card 1: Inverse Document Frequency (IDF) -->
  <g transform="translate(16, 44)">
    <rect width="264" height="244" class="card" fill="#f8fafc" stroke="#cbd5e1" />
    <rect width="264" height="34" rx="10" ry="10" fill="#e2e8f0" />
    <text x="132" y="22" text-anchor="middle" class="mono-bold" fill="#0f172a">1. Rare Term Weight (IDF)</text>

    <text x="16" y="56" class="sub">Common words carry near-zero</text>
    <text x="16" y="72" class="sub">signal; rare words dominate.</text>

    <rect x="16" y="86" width="232" height="30" rx="5" fill="#fff" stroke="#94a3b8" />
    <text x="28" y="105" class="mono">"the"   df = 980 / 1000</text>
    <text x="200" y="105" class="mono-bold" fill="#dc2626">0.02</text>

    <rect x="16" y="124" width="232" height="30" rx="5" fill="#fff" stroke="#94a3b8" />
    <text x="28" y="143" class="mono">"model" df = 120 / 1000</text>
    <text x="200" y="143" class="mono-bold" fill="#d97706">2.00</text>

    <rect x="16" y="162" width="232" height="30" rx="5" fill="#eff6ff" stroke="#3b82f6" />
    <text x="28" y="181" class="mono">"bm25"  df = 8 / 1000</text>
    <text x="200" y="181" class="mono-bold" fill="#2563eb">4.77</text>

    <text x="132" y="218" text-anchor="middle" class="mono" fill="#334155">IDF(t) = ln(1 + (N − df + 0.5)/(df + 0.5))</text>
  </g>

  <!-- Card 2: Term Saturation (k1) -->
  <g transform="translate(298, 44)">
    <rect width="264" height="244" class="card" fill="#f0fdf4" stroke="#86efac" />
    <rect width="264" height="34" rx="10" ry="10" fill="#dcfce7" />
    <text x="132" y="22" text-anchor="middle" class="mono-bold" fill="#14532d">2. Term Saturation (k₁)</text>

    <text x="16" y="56" class="sub">Raw TF grows linearly forever;</text>
    <text x="16" y="72" class="sub">BM25 caps gains at k₁ + 1.</text>

    <!-- Mini Plot -->
    <line x1="34" y1="184" x2="230" y2="184" stroke="#64748b" stroke-width="1.5" />
    <line x1="34" y1="184" x2="34" y2="92" stroke="#64748b" stroke-width="1.5" />
    <!-- Linear TF-IDF line -->
    <line x1="34" y1="184" x2="220" y2="96" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="4,3" />
    <text x="162" y="106" class="mono" fill="#dc2626">Linear TF</text>
    <!-- BM25 Saturating curve -->
    <path d="M 34 184 Q 70 124, 222 118" fill="none" stroke="#16a34a" stroke-width="2.5" />
    <text x="138" y="142" class="mono-bold" fill="#15803d">BM25 (k₁ = 1.2)</text>

    <text x="132" y="204" text-anchor="middle" class="sub" fill="#166534">tf = 1 → 1.00  |  tf = 5 → 1.86</text>
    <text x="132" y="222" text-anchor="middle" class="mono" fill="#14532d">Asymptote: k₁ + 1 = 2.20</text>
  </g>

  <!-- Card 3: Length Normalization (b) -->
  <g transform="translate(580, 44)">
    <rect width="264" height="244" class="card" fill="#eff6ff" stroke="#93c5fd" />
    <rect width="264" height="34" rx="10" ry="10" fill="#dbeafe" />
    <text x="132" y="22" text-anchor="middle" class="mono-bold" fill="#1e3a8a">3. Length Penalty (b)</text>

    <text x="16" y="56" class="sub">Long docs match by chance;</text>
    <text x="16" y="72" class="sub">scale k₁ by length ratio L / L_avg.</text>

    <rect x="16" y="88" width="232" height="44" rx="6" fill="#fff" stroke="#3b82f6" />
    <text x="28" y="106" class="mono-bold" fill="#1d4ed8">Short Doc (L = 50, tf = 2)</text>
    <text x="28" y="124" class="mono">Norm B = 0.62 → TF_bm25 = 1.61</text>

    <rect x="16" y="140" width="232" height="44" rx="6" fill="#fff" stroke="#94a3b8" />
    <text x="28" y="158" class="mono-bold" fill="#475569">Long Doc (L = 300, tf = 2)</text>
    <text x="28" y="176" class="mono">Norm B = 2.50 → TF_bm25 = 0.88</text>

    <text x="132" y="218" text-anchor="middle" class="mono" fill="#1e3a8a">B = 1 − b + b · (L / L_avg)</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 308" width="860" height="308" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="860" height="308" rx="12" fill="#ffffff" />
  <style>
    .title { font-size: 15px; font-weight: 700; fill: #0f172a; }
    .sub { font-size: 10.6px; font-weight: 500; fill: #475569; }
    .mono { font-size: 9.2px; fill: #1e293b; }
    .mono-bold { font-size: 10.5px; font-weight: 700; }
    .card { rx: 10; ry: 10; stroke-width: 1.5; }
  </style>

  <text x="430" y="26" text-anchor="middle" class="title">Bridging Vocabulary Mismatch: Query Expansion, RM3, and SPLADE</text>

  <!-- Card 1: Vocabulary Mismatch -->
  <g transform="translate(16, 44)">
    <rect width="264" height="244" class="card" fill="#fef2f2" stroke="#fca5a5" />
    <rect width="264" height="34" rx="10" ry="10" fill="#fee2e2" />
    <text x="132" y="22" text-anchor="middle" class="mono-bold" fill="#991b1b">1. Vocabulary Mismatch</text>

    <text x="16" y="56" class="sub">Exact lexical match fails when</text>
    <text x="16" y="72" class="sub">query and doc use synonyms.</text>

    <rect x="16" y="88" width="232" height="38" rx="6" fill="#fff" stroke="#ef4444" />
    <text x="28" y="104" class="mono-bold" fill="#b91c1c">Query:</text>
    <text x="28" y="120" class="mono">"heart attack symptoms"</text>

    <rect x="16" y="136" width="232" height="38" rx="6" fill="#fff" stroke="#94a3b8" />
    <text x="28" y="152" class="mono-bold" fill="#334155">Medical Doc:</text>
    <text x="28" y="168" class="mono">"myocardial infarction signs"</text>

    <text x="132" y="200" text-anchor="middle" class="mono-bold" fill="#dc2626">Exact Overlap = 0 words</text>
    <text x="132" y="220" text-anchor="middle" class="mono" fill="#7f1d1d">BM25 Score = 0.00</text>
  </g>

  <!-- Card 2: Pseudo-Relevance Feedback (RM3) -->
  <g transform="translate(298, 44)">
    <rect width="264" height="244" class="card" fill="#f8fafc" stroke="#cbd5e1" />
    <rect width="264" height="34" rx="10" ry="10" fill="#e2e8f0" />
    <text x="132" y="22" text-anchor="middle" class="mono-bold" fill="#0f172a">2. Query Expansion (RM3)</text>

    <text x="16" y="56" class="sub">Mine top-k initial hits to expand</text>
    <text x="16" y="72" class="sub">the query with co-occurring words.</text>

    <rect x="16" y="88" width="232" height="42" rx="6" fill="#fff" stroke="#94a3b8" />
    <text x="28" y="106" class="mono-bold" fill="#334155">Original Query (weight 0.6)</text>
    <text x="28" y="122" class="mono">heart (0.30), attack (0.30)</text>

    <rect x="16" y="138" width="232" height="44" rx="6" fill="#eff6ff" stroke="#3b82f6" />
    <text x="28" y="156" class="mono-bold" fill="#1d4ed8">Feedback Terms (weight 0.4)</text>
    <text x="28" y="172" class="mono">+ myocardial (0.24), chest (0.16)</text>

    <text x="132" y="218" text-anchor="middle" class="mono" fill="#334155">P_RM3(t) = (1−λ)P_Q(t) + λ P_F(t)</text>
  </g>

  <!-- Card 3: SPLADE Learned Sparse -->
  <g transform="translate(580, 44)">
    <rect width="264" height="244" class="card" fill="#f0fdf4" stroke="#86efac" />
    <rect width="264" height="34" rx="10" ry="10" fill="#dcfce7" />
    <text x="132" y="22" text-anchor="middle" class="mono-bold" fill="#14532d">3. SPLADE Learned Sparse</text>

    <text x="16" y="56" class="sub">BERT MLM head predicts sparse</text>
    <text x="16" y="72" class="sub">30k-dim vocabulary weights.</text>

    <rect x="16" y="88" width="232" height="58" rx="6" fill="#fff" stroke="#16a34a" />
    <text x="28" y="106" class="mono-bold" fill="#15803d">Non-Zero Vocab Weights w_j:</text>
    <text x="28" y="122" class="mono">"infarction": 2.45   "heart": 1.92</text>
    <text x="28" y="138" class="mono">"cardiac":    1.64   "chest": 1.10</text>

    <text x="132" y="174" text-anchor="middle" class="mono-bold" fill="#166534">w_j = max_i ln(1 + ReLU(z_ij))</text>
    <text x="132" y="196" text-anchor="middle" class="sub" fill="#14532d">FLOPS regularization keeps</text>
    <text x="132" y="214" text-anchor="middle" class="sub" fill="#14532d">99% of weights exactly 0!</text>
  </g>
</svg>

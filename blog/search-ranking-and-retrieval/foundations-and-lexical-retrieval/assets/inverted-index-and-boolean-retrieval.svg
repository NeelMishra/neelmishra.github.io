<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="'Manrope', -apple-system, sans-serif">
  <rect width="760" height="300" rx="12" fill="#fbfaf6" stroke="#d8d2c5" stroke-width="1.5"/>

  <!-- Card 1: Forward vs Inverted Index -->
  <g transform="translate(16, 16)">
    <rect width="232" height="268" rx="10" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.2"/>
    <text x="116" y="24" text-anchor="middle" font-size="12.5" font-weight="800" fill="#1e2422">1. The Inverted Index</text>
    <text x="116" y="41" text-anchor="middle" font-size="10" fill="#5a625e">Term dictionary → sorted doc IDs</text>

    <g transform="translate(16, 52)">
      <rect width="200" height="160" rx="8" fill="#fbfaf6" stroke="#d8d2c5"/>

      <!-- Term 1 -->
      <rect x="12" y="16" width="58" height="28" rx="4" fill="#fdf6e9" stroke="#8c5d16" stroke-width="1.3"/>
      <text x="41" y="34" text-anchor="middle" font-size="9" font-weight="800" fill="#8c5d16">"neural"</text>
      <text x="78" y="34" font-size="10" font-weight="800" fill="#5a625e">→</text>
      <rect x="92" y="16" width="96" height="28" rx="4" fill="#eef6f0" stroke="#165d4c"/>
      <text x="140" y="34" text-anchor="middle" font-size="9" font-weight="800" fill="#173d35">[1, 3, 7, 12]</text>

      <!-- Term 2 -->
      <rect x="12" y="56" width="58" height="28" rx="4" fill="#fdf6e9" stroke="#8c5d16" stroke-width="1.3"/>
      <text x="41" y="74" text-anchor="middle" font-size="9" font-weight="800" fill="#8c5d16">"search"</text>
      <text x="78" y="74" font-size="10" font-weight="800" fill="#5a625e">→</text>
      <rect x="92" y="56" width="96" height="28" rx="4" fill="#eef6f0" stroke="#165d4c"/>
      <text x="140" y="74" text-anchor="middle" font-size="9" font-weight="800" fill="#173d35">[2, 3, 8, 12]</text>

      <!-- Term 3 -->
      <rect x="12" y="96" width="58" height="28" rx="4" fill="#fdf6e9" stroke="#8c5d16" stroke-width="1.3"/>
      <text x="41" y="114" text-anchor="middle" font-size="9" font-weight="800" fill="#8c5d16">"index"</text>
      <text x="78" y="114" font-size="10" font-weight="800" fill="#5a625e">→</text>
      <rect x="92" y="96" width="96" height="28" rx="4" fill="#eef6f0" stroke="#165d4c"/>
      <text x="140" y="114" text-anchor="middle" font-size="9" font-weight="800" fill="#173d35">[3, 5, 12]</text>

      <text x="100" y="146" text-anchor="middle" font-size="8.5" font-weight="700" fill="#3a423e">Postings sorted by docID ↑</text>
    </g>

    <rect x="16" y="222" width="200" height="32" rx="6" fill="#eef6f0" stroke="#a8cbb7"/>
    <text x="116" y="242" text-anchor="middle" font-size="9.5" font-weight="800" fill="#173d35">Avoids Scanning All N Docs</text>
  </g>

  <!-- Card 2: Two-Pointer AND Intersection -->
  <g transform="translate(264, 16)">
    <rect width="232" height="268" rx="10" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.2"/>
    <text x="116" y="24" text-anchor="middle" font-size="12.5" font-weight="800" fill="#1e2422">2. Linear Merge Intersection</text>
    <text x="116" y="41" text-anchor="middle" font-size="10" fill="#5a625e">"neural" AND "search" in O(L₁ + L₂)</text>

    <g transform="translate(16, 52)">
      <rect width="200" height="160" rx="8" fill="#fbfaf6" stroke="#d8d2c5"/>

      <text x="100" y="24" text-anchor="middle" font-size="8.5" font-weight="800" fill="#3a423e">Advance Pointer with Smaller docID</text>

      <!-- List A -->
      <text x="14" y="54" font-size="8.5" font-weight="800" fill="#8c5d16">L₁:</text>
      <rect x="34" y="40" width="32" height="22" rx="3" fill="#ffffff" stroke="#d8d2c5"/>
      <text x="50" y="55" text-anchor="middle" font-size="9" fill="#5a625e">1</text>
      <rect x="72" y="40" width="32" height="22" rx="3" fill="#eef6f0" stroke="#165d4c" stroke-width="1.5"/>
      <text x="88" y="55" text-anchor="middle" font-size="9" font-weight="800" fill="#173d35">3</text>
      <rect x="110" y="40" width="32" height="22" rx="3" fill="#ffffff" stroke="#d8d2c5"/>
      <text x="126" y="55" text-anchor="middle" font-size="9" fill="#5a625e">7</text>
      <rect x="148" y="40" width="36" height="22" rx="3" fill="#eef6f0" stroke="#165d4c" stroke-width="1.5"/>
      <text x="166" y="55" text-anchor="middle" font-size="9" font-weight="800" fill="#173d35">12</text>

      <!-- List B -->
      <text x="14" y="92" font-size="8.5" font-weight="800" fill="#8c5d16">L₂:</text>
      <rect x="34" y="78" width="32" height="22" rx="3" fill="#ffffff" stroke="#d8d2c5"/>
      <text x="50" y="93" text-anchor="middle" font-size="9" fill="#5a625e">2</text>
      <rect x="72" y="78" width="32" height="22" rx="3" fill="#eef6f0" stroke="#165d4c" stroke-width="1.5"/>
      <text x="88" y="93" text-anchor="middle" font-size="9" font-weight="800" fill="#173d35">3</text>
      <rect x="110" y="78" width="32" height="22" rx="3" fill="#ffffff" stroke="#d8d2c5"/>
      <text x="126" y="93" text-anchor="middle" font-size="9" fill="#5a625e">8</text>
      <rect x="148" y="78" width="36" height="22" rx="3" fill="#eef6f0" stroke="#165d4c" stroke-width="1.5"/>
      <text x="166" y="93" text-anchor="middle" font-size="9" font-weight="800" fill="#173d35">12</text>

      <!-- Result -->
      <rect x="24" y="116" width="152" height="28" rx="5" fill="#eef6f0" stroke="#165d4c"/>
      <text x="100" y="134" text-anchor="middle" font-size="9.5" font-weight="800" fill="#173d35">Matches: [3, 12]</text>
    </g>

    <rect x="16" y="222" width="200" height="32" rx="6" fill="#fdf6e9" stroke="#d9c091"/>
    <text x="116" y="242" text-anchor="middle" font-size="9.5" font-weight="800" fill="#8c5d16">Intersect Shortest Lists First</text>
  </g>

  <!-- Card 3: Skip Pointers & WAND -->
  <g transform="translate(512, 16)">
    <rect width="232" height="268" rx="10" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.2"/>
    <text x="116" y="24" text-anchor="middle" font-size="12.5" font-weight="800" fill="#1e2422">3. Skip Pointers &amp; Delta Gaps</text>
    <text x="116" y="41" text-anchor="middle" font-size="10" fill="#5a625e">Jumping over non-matching blocks</text>

    <g transform="translate(16, 52)">
      <rect width="200" height="160" rx="8" fill="#fbfaf6" stroke="#d8d2c5"/>

      <!-- Skip arc -->
      <path d="M 32,48 Q 100,14 168,48" fill="none" stroke="#9e2f24" stroke-width="1.8" stroke-dasharray="4,2"/>
      <text x="100" y="26" text-anchor="middle" font-size="8.5" font-weight="800" fill="#9e2f24">Skip Pointer (√L stride)</text>

      <!-- Posting nodes -->
      <rect x="16" y="50" width="32" height="24" rx="4" fill="#eef6f0" stroke="#165d4c"/>
      <text x="32" y="66" text-anchor="middle" font-size="8.5" font-weight="800" fill="#173d35">3</text>
      <rect x="58" y="50" width="32" height="24" rx="4" fill="#ffffff" stroke="#d8d2c5"/>
      <text x="74" y="66" text-anchor="middle" font-size="8.5" fill="#5a625e">9</text>
      <rect x="100" y="50" width="32" height="24" rx="4" fill="#ffffff" stroke="#d8d2c5"/>
      <text x="116" y="66" text-anchor="middle" font-size="8.5" fill="#5a625e">14</text>
      <rect x="142" y="50" width="42" height="24" rx="4" fill="#eef6f0" stroke="#165d4c"/>
      <text x="163" y="66" text-anchor="middle" font-size="8.5" font-weight="800" fill="#173d35">25</text>

      <!-- Delta encoding box -->
      <rect x="14" y="92" width="172" height="54" rx="5" fill="#ffffff" stroke="#d8d2c5"/>
      <text x="100" y="110" text-anchor="middle" font-size="8.5" font-weight="800" fill="#1e2422">Delta-Gap Compression:</text>
      <text x="100" y="125" text-anchor="middle" font-size="8.5" fill="#5a625e">DocIDs: [3, 9, 14, 25]</text>
      <text x="100" y="139" text-anchor="middle" font-size="8.5" font-weight="800" fill="#173d35">Gaps Δ: [3, +6, +5, +11]</text>
    </g>

    <rect x="16" y="222" width="200" height="32" rx="6" fill="#eef6f0" stroke="#a8cbb7"/>
    <text x="116" y="242" text-anchor="middle" font-size="9.5" font-weight="800" fill="#173d35">Small Gaps Compress to 1–2 Bytes</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" role="img" aria-labelledby="hnsw-curve-title hnsw-curve-desc">
  <title id="hnsw-curve-title">HNSW Recall@10 vs. Query Latency (ms) Across efSearch Sweep</title>
  <desc id="hnsw-curve-desc">Example Pareto trade-off curve for 1M 768-d vectors (M=16, efConstruction=200) showing Recall@10 vs. p95 query latency as efSearch increases from 10 to 1024, highlighting the steep gain region, the knee of the curve at efSearch 64-128, and the flat saturation region.</desc>
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbfcfa"/>
      <stop offset="100%" stop-color="#f3f6f2"/>
    </linearGradient>
    <linearGradient id="sweet-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16a34a" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#16a34a" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="diminish-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.14"/>
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect x="0" y="0" width="980" height="500" rx="14" fill="url(#bg-grad)" stroke="#d5ddd7" stroke-width="1.5"/>

  <!-- Header -->
  <text x="34" y="36" font-family="Manrope, sans-serif" font-size="18" font-weight="800" fill="#172b22">Example HNSW Operating Curve: Recall@10 vs. Query Latency Across efSearch</text>
  <text x="34" y="57" font-family="Manrope, sans-serif" font-size="12.5" font-weight="500" fill="#4f645a">Benchmark setup: N = 1,000,000 vectors (768-d float32, cosine) · Build: M = 16, efConstruction = 200 · Query: top_k = 10</text>

  <!-- Left Plot Area: x=85..650, y=85..415 (width=565, height=330) -->
  <!-- Y-axis: Recall@10 from 75% (y=415) to 100% (y=85) -> 13.2 px per 1% -->
  <!-- X-axis (log-like/piecewise spacing for clarity across 0.3ms to 20ms):
       ef=10 (0.42ms, 78.4%) -> x=115, y=370.1
       ef=16 (0.58ms, 84.6%) -> x=155, y=288.3
       ef=32 (0.88ms, 91.8%) -> x=210, y=193.2
       ef=64 (1.45ms, 96.5%) -> x=280, y=131.2
       ef=100 (2.05ms, 97.8%) -> x=330, y=114.0
       ef=128 (2.55ms, 98.4%) -> x=370, y=106.1
       ef=256 (4.85ms, 99.2%) -> x=460, y=95.6
       ef=512 (9.40ms, 99.5%) -> x=555, y=91.6
       ef=1024 (18.2ms, 99.6%) -> x=635, y=90.3
  -->

  <!-- Plot background -->
  <rect x="85" y="85" width="565" height="330" rx="6" fill="#ffffff" stroke="#cbd5cf" stroke-width="1.2"/>

  <!-- Shaded Regime 2: Sweet Spot / Knee of the Curve (x=255..395) -->
  <rect x="255" y="86" width="140" height="328" fill="url(#sweet-grad)"/>
  <line x1="255" y1="85" x2="255" y2="415" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="395" y1="85" x2="395" y2="415" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="4 4"/>

  <!-- Shaded Regime 3: Diminishing Returns / Latency Blowup (x=395..649) -->
  <rect x="395" y="86" width="254" height="328" fill="url(#diminish-grad)"/>

  <!-- Horizontal Grid Lines (Recall) -->
  <!-- 100%: y=85, 95%: y=151, 90%: y=217, 85%: y=283, 80%: y=349, 75%: y=415 -->
  <g stroke="#e5ece8" stroke-width="1">
    <line x1="85" y1="151" x2="650" y2="151"/>
    <line x1="85" y1="217" x2="650" y2="217"/>
    <line x1="85" y1="283" x2="650" y2="283"/>
    <line x1="85" y1="349" x2="650" y2="349"/>
  </g>

  <!-- Build-time Graph Ceiling Asymptote (~99.6%, y=90.3) -->
  <line x1="85" y1="90.3" x2="650" y2="90.3" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="408" y="96" width="234" height="22" rx="4" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="525" y="111" text-anchor="middle" font-family="Manrope, sans-serif" font-size="10.5" font-weight="700" fill="#b91c1c">Build-Time Graph Ceiling (~99.6% max recall)</text>

  <!-- Y-Axis Labels -->
  <g font-family="Manrope, sans-serif" font-size="11.5" font-weight="600" fill="#465b50" text-anchor="end">
    <text x="77" y="89">100%</text>
    <text x="77" y="155">95%</text>
    <text x="77" y="221">90%</text>
    <text x="77" y="287">85%</text>
    <text x="77" y="353">80%</text>
    <text x="77" y="419">75%</text>
  </g>
  <text x="26" y="250" transform="rotate(-90 26 250)" text-anchor="middle" font-family="Manrope, sans-serif" font-size="13" font-weight="800" fill="#1e352b">Recall@10 (Accuracy vs. Exact Search)</text>

  <!-- X-Axis Ticks & Labels -->
  <g font-family="Manrope, sans-serif" font-size="11" font-weight="600" fill="#465b50" text-anchor="middle">
    <line x1="115" y1="415" x2="115" y2="421" stroke="#465b50" stroke-width="1.2"/>
    <text x="115" y="435">0.4 ms</text>
    <line x1="210" y1="415" x2="210" y2="421" stroke="#465b50" stroke-width="1.2"/>
    <text x="210" y="435">0.9 ms</text>
    <line x1="280" y1="415" x2="280" y2="421" stroke="#465b50" stroke-width="1.2"/>
    <text x="280" y="435">1.5 ms</text>
    <line x1="370" y1="415" x2="370" y2="421" stroke="#465b50" stroke-width="1.2"/>
    <text x="370" y="435">2.6 ms</text>
    <line x1="460" y1="415" x2="460" y2="421" stroke="#465b50" stroke-width="1.2"/>
    <text x="460" y="435">4.9 ms</text>
    <line x1="555" y1="415" x2="555" y2="421" stroke="#465b50" stroke-width="1.2"/>
    <text x="555" y="435">9.4 ms</text>
    <line x1="635" y1="415" x2="635" y2="421" stroke="#465b50" stroke-width="1.2"/>
    <text x="635" y="435">18.2 ms</text>
  </g>
  <text x="367" y="462" text-anchor="middle" font-family="Manrope, sans-serif" font-size="13" font-weight="800" fill="#1e352b">p95 Query Latency in Milliseconds (log-scaled spacing · lower is faster)</text>
  <text x="367" y="480" text-anchor="middle" font-family="Manrope, sans-serif" font-size="11" font-weight="500" fill="#5a7065">Corresponding throughput drops from ~2,380 QPS (efSearch=10) → ~690 QPS (efSearch=64) → ~55 QPS (efSearch=1024)</text>

  <!-- Regime Labels inside Plot -->
  <text x="170" y="398" text-anchor="middle" font-family="Manrope, sans-serif" font-size="11.5" font-weight="800" fill="#3b5246">1. Steep Gain Regime</text>
  <text x="170" y="411" text-anchor="middle" font-family="Manrope, sans-serif" font-size="10" fill="#52695d">(Escaping local minima)</text>

  <rect x="263" y="252" width="124" height="44" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.3"/>
  <text x="325" y="270" text-anchor="middle" font-family="Manrope, sans-serif" font-size="11.5" font-weight="800" fill="#14532d">2. Knee / Sweet Spot</text>
  <text x="325" y="286" text-anchor="middle" font-family="Manrope, sans-serif" font-size="10.5" font-weight="700" fill="#166534">efSearch = 64–128</text>
  <path d="M 325 252 L 325 142" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="3 3"/>

  <text x="522" y="388" text-anchor="middle" font-family="Manrope, sans-serif" font-size="11.5" font-weight="800" fill="#9a3412">3. Diminishing Returns Regime</text>
  <text x="522" y="403" text-anchor="middle" font-family="Manrope, sans-serif" font-size="10" fill="#b45309">(3.7× slower for +1.1% recall from ef=128→512)</text>

  <!-- The Recall vs. Latency Curve -->
  <path d="M 115 370.1 L 155 288.3 L 210 193.2 L 280 131.2 L 330 114.0 L 370 106.1 L 460 95.6 L 555 91.6 L 635 90.3"
        fill="none" stroke="#0f766e" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Data Points and efSearch Callouts -->
  <!-- ef=10 -->
  <circle cx="115" cy="370.1" r="5.5" fill="#ffffff" stroke="#0f766e" stroke-width="2.5"/>
  <text x="125" y="366" font-family="Manrope, sans-serif" font-size="10.5" font-weight="700" fill="#172b22">ef=10 (78.4%)</text>
  <text x="125" y="379" font-family="Manrope, sans-serif" font-size="9.5" fill="#b91c1c">min: ef = k</text>

  <!-- ef=16 -->
  <circle cx="155" cy="288.3" r="5.5" fill="#ffffff" stroke="#0f766e" stroke-width="2.5"/>
  <text x="165" y="292" font-family="Manrope, sans-serif" font-size="10.5" font-weight="700" fill="#172b22">ef=16 (84.6%)</text>

  <!-- ef=32 -->
  <circle cx="210" cy="193.2" r="5.5" fill="#ffffff" stroke="#0f766e" stroke-width="2.5"/>
  <text x="148" y="185" font-family="Manrope, sans-serif" font-size="10.5" font-weight="700" fill="#172b22">ef=32 (91.8%)</text>

  <!-- ef=64 (Sweet spot start) -->
  <circle cx="280" cy="131.2" r="7" fill="#16a34a" stroke="#ffffff" stroke-width="2"/>
  <text x="262" y="152" font-family="Manrope, sans-serif" font-size="11" font-weight="800" fill="#14532d">ef=64 (96.5%)</text>

  <!-- ef=100 -->
  <circle cx="330" cy="114.0" r="6" fill="#16a34a" stroke="#ffffff" stroke-width="2"/>
  <text x="308" y="103" font-family="Manrope, sans-serif" font-size="10.5" font-weight="800" fill="#14532d">ef=100 (97.8%)</text>

  <!-- ef=128 (Sweet spot end) -->
  <circle cx="370" cy="106.1" r="7" fill="#16a34a" stroke="#ffffff" stroke-width="2"/>
  <text x="355" y="131" font-family="Manrope, sans-serif" font-size="11" font-weight="800" fill="#14532d">ef=128 (98.4%)</text>

  <!-- ef=256 -->
  <circle cx="460" cy="95.6" r="5.5" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
  <text x="435" y="81" font-family="Manrope, sans-serif" font-size="10.5" font-weight="700" fill="#92400e">ef=256 (99.2%)</text>

  <!-- ef=512 -->
  <circle cx="555" cy="91.6" r="5.5" fill="#ea580c" stroke="#ffffff" stroke-width="2"/>
  <text x="525" y="134" font-family="Manrope, sans-serif" font-size="10.5" font-weight="700" fill="#9a3412">ef=512 (99.5%)</text>

  <!-- ef=1024 -->
  <circle cx="635" cy="90.3" r="5.5" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>
  <text x="588" y="152" font-family="Manrope, sans-serif" font-size="10.5" font-weight="700" fill="#991b1b">ef=1024 (99.6%)</text>

  <!-- Right Panel: Diagnostic Breakdown (x=672..956, y=85..415) -->
  <rect x="672" y="85" width="284" height="330" rx="8" fill="#ffffff" stroke="#cbd5cf" stroke-width="1.2"/>
  <text x="690" y="112" font-family="Manrope, sans-serif" font-size="13.5" font-weight="800" fill="#172b22">Why the Curve Flattens</text>
  <text x="690" y="130" font-family="Manrope, sans-serif" font-size="11" fill="#4f645a">Doubling efSearch nearly doubles distance</text>
  <text x="690" y="145" font-family="Manrope, sans-serif" font-size="11" fill="#4f645a">checks, while marginal recall gain vanishes:</text>

  <!-- Mini table inside right panel -->
  <g font-family="Manrope, sans-serif" font-size="10.8">
    <rect x="686" y="158" width="256" height="22" rx="4" fill="#eef3f0"/>
    <text x="694" y="173" font-weight="800" fill="#1e352b">Step</text>
    <text x="778" y="173" font-weight="800" fill="#1e352b">Δ Recall</text>
    <text x="848" y="173" font-weight="800" fill="#1e352b">Δ Latency</text>

    <text x="694" y="198" font-weight="700" fill="#0f766e">ef 10 → 32</text>
    <text x="778" y="198" font-weight="700" fill="#15803d">+13.4%</text>
    <text x="848" y="198" fill="#334155">+0.46 ms (2.1×)</text>

    <line x1="686" y1="206" x2="942" y2="206" stroke="#e5ece8"/>
    <text x="694" y="224" font-weight="700" fill="#16a34a">ef 32 → 64</text>
    <text x="778" y="224" font-weight="700" fill="#15803d">+4.7%</text>
    <text x="848" y="224" fill="#334155">+0.57 ms (1.6×)</text>

    <line x1="686" y1="232" x2="942" y2="232" stroke="#e5ece8"/>
    <text x="694" y="250" font-weight="700" fill="#16a34a">ef 64 → 128</text>
    <text x="778" y="250" font-weight="700" fill="#15803d">+1.9%</text>
    <text x="848" y="250" fill="#334155">+1.10 ms (1.8×)</text>

    <line x1="686" y1="258" x2="942" y2="258" stroke="#e5ece8"/>
    <text x="694" y="276" font-weight="700" fill="#d97706">ef 128 → 512</text>
    <text x="778" y="276" font-weight="700" fill="#b45309">+1.1%</text>
    <text x="848" y="276" fill="#b45309">+6.85 ms (3.7×)</text>

    <line x1="686" y1="284" x2="942" y2="284" stroke="#e5ece8"/>
    <text x="694" y="302" font-weight="700" fill="#dc2626">ef 512 → 1024</text>
    <text x="778" y="302" font-weight="700" fill="#dc2626">+0.1%</text>
    <text x="848" y="302" fill="#dc2626">+8.80 ms (1.9×)</text>
  </g>

  <!-- Boundary Callout Box inside Right Panel -->
  <rect x="686" y="318" width="256" height="84" rx="6" fill="#f8faf9" stroke="#cbd5cf" stroke-width="1"/>
  <text x="696" y="336" font-family="Manrope, sans-serif" font-size="11" font-weight="800" fill="#172b22">Extreme Boundary Behavior:</text>
  <text x="696" y="354" font-family="Manrope, sans-serif" font-size="10.3" fill="#334155">• <tspan font-weight="700" fill="#b91c1c">efSearch &lt; k (or → 0):</tspan> Invalid; heap W</text>
  <text x="706" y="368" font-family="Manrope, sans-serif" font-size="10.3" fill="#334155">cannot hold k items (min is efSearch = k).</text>
  <text x="696" y="385" font-family="Manrope, sans-serif" font-size="10.3" fill="#334155">• <tspan font-weight="700" fill="#b91c1c">efSearch → ∞ (≥ N):</tspan> Visits all N nodes;</text>
  <text x="706" y="399" font-family="Manrope, sans-serif" font-size="10.3" fill="#334155">5–20× slower than flat scan due to pointer hops.</text>
</svg>

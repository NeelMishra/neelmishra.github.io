<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
  <title id="title">HNSW Layer Search: Detour Barrier Graph and Two-Heap Beam Evolution</title>
  <desc id="desc">Query is zero, zero. Entry A has squared distance 64 and links to B (distance 49) and C (distance 81). C links to the true nearest neighbor D (distance 0.25). Left panel shows the graph topology; right panel compares ef=1/2 (stops at B) vs ef=3 (retains C and discovers D).</desc>
  <defs>
    <marker id="sb-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#1e6b52" />
    </marker>
    <marker id="sb-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#c25928" />
    </marker>
  </defs>

  <rect width="960" height="470" rx="16" fill="#fffaf2" stroke="#dcd3c2" stroke-width="1.5" />

  <!-- Header -->
  <text x="32" y="38" font-family="sans-serif" font-size="20" font-weight="700" fill="#1e2d26">HNSW Layer Search (Algorithm 2): Why a Detour Requires Beam Width ef &gt;= 3</text>
  <text x="32" y="62" font-family="sans-serif" font-size="13.5" fill="#52635a">Query q = (0, 0), K = 1. Greedy search traps at B (d² = 49) because bridge node C (d² = 81) is farther than entry A (d² = 64).</text>

  <!-- ==================== LEFT PANEL: BARRIER GRAPH ==================== -->
  <rect x="28" y="80" width="440" height="366" rx="12" fill="#ffffff" stroke="#c8d6cc" stroke-width="1.5" />
  <text x="48" y="108" font-family="sans-serif" font-size="15" font-weight="700" fill="#184e3b">1. Routing Topology vs. Distance to Query q = (0, 0)</text>

  <!-- Edges -->
  <line x1="118" y1="242" x2="256" y2="162" stroke="#1e6b52" stroke-width="3" marker-end="url(#sb-green)" />
  <line x1="118" y1="242" x2="256" y2="322" stroke="#c25928" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#sb-amber)" />
  <line x1="286" y1="322" x2="394" y2="322" stroke="#1e6b52" stroke-width="3.2" marker-end="url(#sb-green)" />

  <!-- Node A (Entry) -->
  <circle cx="96" cy="242" r="28" fill="#dceee3" stroke="#1e6b52" stroke-width="2.5" />
  <text x="96" y="248" font-family="sans-serif" font-size="20" font-weight="700" fill="#184e3b" text-anchor="middle">A</text>
  <text x="96" y="288" font-family="sans-serif" font-size="12" font-weight="700" fill="#233a31" text-anchor="middle">Entry (8, 0)</text>
  <text x="96" y="305" font-family="sans-serif" font-size="12" font-weight="700" fill="#184e3b" text-anchor="middle">d² = 64</text>

  <!-- Node B (Local trap) -->
  <circle cx="282" cy="152" r="28" fill="#e6f2ec" stroke="#1e6b52" stroke-width="2.5" />
  <text x="282" y="158" font-family="sans-serif" font-size="20" font-weight="700" fill="#184e3b" text-anchor="middle">B</text>
  <text x="380" y="146" font-family="sans-serif" font-size="12" font-weight="700" fill="#184e3b" text-anchor="middle">Local Min (7, 0)</text>
  <text x="380" y="164" font-family="sans-serif" font-size="12" fill="#52635a" text-anchor="middle">d² = 49 (Dead End)</text>

  <!-- Node C (Detour Bridge) -->
  <circle cx="282" cy="322" r="28" fill="#fde4cf" stroke="#c25928" stroke-width="2.5" />
  <text x="282" y="328" font-family="sans-serif" font-size="20" font-weight="700" fill="#8c3d19" text-anchor="middle">C</text>
  <text x="282" y="366" font-family="sans-serif" font-size="12" font-weight="700" fill="#8c3d19" text-anchor="middle">Detour Bridge (9, 0)</text>
  <text x="282" y="383" font-family="sans-serif" font-size="12" font-weight="700" fill="#c25928" text-anchor="middle">d² = 81 (Worse!)</text>

  <!-- Node D (True NN) -->
  <circle cx="422" cy="322" r="28" fill="#1e6b52" stroke="#184e3b" stroke-width="2.5" />
  <text x="422" y="328" font-family="sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">D</text>
  <text x="415" y="266" font-family="sans-serif" font-size="12" font-weight="700" fill="#184e3b" text-anchor="middle">True NN (0.5, 0)</text>
  <text x="415" y="283" font-family="sans-serif" font-size="12" font-weight="700" fill="#1e6b52" text-anchor="middle">d² = 0.25</text>

  <rect x="48" y="396" width="400" height="36" rx="8" fill="#f3f8f5" stroke="#b7d1c3" />
  <text x="248" y="419" font-family="sans-serif" font-size="12" font-weight="700" fill="#184e3b" text-anchor="middle">Admit e if |W| &lt; ef or d(q, e) &lt; max_{w in W} d(q, w)</text>

  <!-- ==================== RIGHT PANEL: TWO-HEAP COMPARISON ==================== -->
  <rect x="492" y="80" width="440" height="366" rx="12" fill="#ffffff" stroke="#c8d6cc" stroke-width="1.5" />
  <text x="512" y="108" font-family="sans-serif" font-size="15" font-weight="700" fill="#184e3b">2. Candidate Min-Heap C vs. Retained Max-Heap W</text>

  <!-- Case 1: ef = 1 or 2 -->
  <rect x="512" y="124" width="400" height="128" rx="10" fill="#fff6ee" stroke="#c25928" stroke-width="1.8" />
  <text x="528" y="146" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#8c3d19">Narrow Beam (ef = 1 or ef = 2) -&gt; Misses D, Returns B</text>
  <text x="528" y="168" font-family="sans-serif" font-size="11" fill="#374840">1. Start at A: C = [A:64], W = [A:64]</text>
  <text x="528" y="188" font-family="sans-serif" font-size="11" fill="#374840">2. Expand A -&gt; B:49 admitted; W = [B:49] (ef=1) or [B:49, A:64] (ef=2)</text>
  <text x="528" y="208" font-family="sans-serif" font-size="11" font-weight="700" fill="#b83b2a">3. Score C:81 -&gt; Rejected! 81 &gt; max(W) (49 or 64), never enters C</text>
  <text x="528" y="228" font-family="sans-serif" font-size="11" fill="#374840">4. Expand B -&gt; only neighbor A is already in V. Frontier empties.</text>

  <!-- Case 2: ef = 3 -->
  <rect x="512" y="268" width="400" height="162" rx="10" fill="#eef8f3" stroke="#1e6b52" stroke-width="2" />
  <text x="528" y="290" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#184e3b">Wide Beam (ef = 3) -&gt; Keeps Detour C, Discovers D</text>
  <text x="528" y="312" font-family="sans-serif" font-size="11" fill="#374840">1. Expand A: |W| &lt; 3, so both B:49 and C:81 enter C and W</text>
  <text x="528" y="332" font-family="sans-serif" font-size="11" fill="#374840">   State: C = [B:49, C:81],  W = [B:49, A:64, C:81]</text>
  <text x="528" y="352" font-family="sans-serif" font-size="11" fill="#374840">2. Expand B:49 -&gt; A already visited. Next in C is C:81</text>
  <text x="528" y="372" font-family="sans-serif" font-size="11" font-weight="700" fill="#184e3b">3. Pop C:81 -&gt; 81 &lt;= max(W)=81 (not &gt;), so expand C -&gt; finds D:0.25!</text>
  <text x="528" y="392" font-family="sans-serif" font-size="11" fill="#374840">4. Admit D:0.25, evict C:81 from W -&gt; W = [D:0.25, B:49, A:64]</text>
  <text x="528" y="412" font-family="sans-serif" font-size="11" font-weight="700" fill="#184e3b">5. Return top K = 1 from W -&gt; D (d² = 0.25)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300">
  <rect width="760" height="300" fill="#ffffff" />
  <style>
    .title { font-family: 'Inter', -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; }
    .sub { font-family: 'Inter', -apple-system, sans-serif; font-size: 10.6px; font-weight: 500; fill: #475569; }
    .mono { font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 9.4px; fill: #1e293b; }
    .mono-bold { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; font-weight: 700; }
    .card { rx: 10; ry: 10; stroke-width: 1.5; }
  </style>

  <text x="380" y="26" text-anchor="middle" class="title">Hybrid Retrieval (RRF) and Multi-Vector Late Interaction (ColBERT MaxSim)</text>

  <!-- Card 1: Why Hybrid Retrieval -->
  <g transform="translate(20, 44)">
    <rect width="230" height="236" class="card" fill="#f8fafc" stroke="#cbd5e1" />
    <rect width="230" height="34" rx="10" ry="10" fill="#e2e8f0" />
    <text x="115" y="22" text-anchor="middle" class="mono-bold" fill="#0f172a">1. Sparse + Dense Synergy</text>

    <text x="16" y="56" class="sub">BM25 nails exact IDs/part numbers;</text>
    <text x="16" y="72" class="sub">Dense captures semantic paraphrases.</text>

    <rect x="16" y="88" width="198" height="44" rx="6" fill="#fff" stroke="#94a3b8" />
    <text x="24" y="106" class="mono-bold" fill="#334155">BM25 Rankings:</text>
    <text x="24" y="122" class="mono">#1: Doc A (41.2)  #2: Doc B (18.4)</text>

    <rect x="16" y="140" width="198" height="44" rx="6" fill="#eff6ff" stroke="#3b82f6" />
    <text x="24" y="158" class="mono-bold" fill="#1d4ed8">Dense Rankings:</text>
    <text x="24" y="174" class="mono">#1: Doc C (0.89)  #2: Doc A (0.81)</text>

    <text x="115" y="212" text-anchor="middle" class="sub" fill="#b91c1c">Raw scores have incompatible scales!</text>
  </g>

  <!-- Card 2: Reciprocal Rank Fusion (RRF) -->
  <g transform="translate(265, 44)">
    <rect width="230" height="236" class="card" fill="#eff6ff" stroke="#93c5fd" />
    <rect width="230" height="34" rx="10" ry="10" fill="#dbeafe" />
    <text x="115" y="22" text-anchor="middle" class="mono-bold" fill="#1e3a8a">2. Reciprocal Rank Fusion</text>

    <text x="16" y="56" class="sub">Fuse using rank positions r_m(d)</text>
    <text x="16" y="72" class="sub">without score calibration (k=60).</text>

    <rect x="16" y="88" width="198" height="46" rx="6" fill="#dcfce7" stroke="#16a34a" />
    <text x="24" y="106" class="mono-bold" fill="#14532d">Doc A (BM25 #1, Dense #2):</text>
    <text x="24" y="124" class="mono">1/61 + 1/62 = 0.03252 (Winner!)</text>

    <rect x="16" y="142" width="198" height="42" rx="6" fill="#fff" stroke="#94a3b8" />
    <text x="24" y="160" class="mono-bold" fill="#334155">Doc C (BM25 #8, Dense #1):</text>
    <text x="24" y="176" class="mono">1/68 + 1/61 = 0.03110</text>

    <text x="115" y="214" text-anchor="middle" class="mono-bold" fill="#1e3a8a">RRF(d) = Σ_m 1 / (k + r_m(d))</text>
  </g>

  <!-- Card 3: ColBERT Late Interaction -->
  <g transform="translate(510, 44)">
    <rect width="230" height="236" class="card" fill="#f0fdf4" stroke="#86efac" />
    <rect width="230" height="34" rx="10" ry="10" fill="#dcfce7" />
    <text x="115" y="22" text-anchor="middle" class="mono-bold" fill="#14532d">3. ColBERT MaxSim</text>

    <text x="16" y="56" class="sub">Keep 1 vector per token; sum best</text>
    <text x="16" y="72" class="sub">doc-token match for each q-token.</text>

    <rect x="16" y="88" width="198" height="60" rx="6" fill="#fff" stroke="#16a34a" />
    <text x="24" y="106" class="mono-bold" fill="#15803d">MaxSim per Query Token q_i:</text>
    <text x="24" y="122" class="mono">q_1("error") -&gt; max_j(q_1·d_j)=0.94</text>
    <text x="24" y="138" class="mono">q_2("504")   -&gt; max_j(q_2·d_j)=0.98</text>

    <text x="115" y="176" text-anchor="middle" class="mono-bold" fill="#166534">S(q,d) = Σ_i max_j (q_i · d_j)</text>
    <text x="115" y="198" text-anchor="middle" class="sub" fill="#14532d">Avoids single-vector bottleneck</text>
    <text x="115" y="214" text-anchor="middle" class="sub" fill="#14532d">while remaining indexable!</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 310" width="820" height="310">
  <rect width="820" height="310" fill="#ffffff" rx="12" />
  <style>
    .title { font-family: 'Manrope', 'Inter', -apple-system, sans-serif; font-size: 15.5px; font-weight: 800; fill: #13201a; }
    .sub { font-family: 'Manrope', 'Inter', -apple-system, sans-serif; font-size: 11.5px; font-weight: 500; fill: #4a5a53; }
    .mono { font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 10.5px; fill: #1e293b; }
    .mono-bold { font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 11.5px; font-weight: 700; }
    .card { rx: 10; ry: 10; stroke-width: 1.5; }
  </style>

  <text x="410" y="28" text-anchor="middle" class="title">Two-Tower Dense Retrieval: Bi-Encoders, InfoNCE, and Hard Negatives</text>

  <!-- Card 1: Two-Tower Architecture -->
  <g transform="translate(18, 46)">
    <rect width="250" height="244" class="card" fill="#f8fafc" stroke="#cbd5e1" />
    <rect width="250" height="34" rx="10" ry="10" fill="#e2e8f0" />
    <text x="125" y="22" text-anchor="middle" class="mono-bold" fill="#0f172a">1. Two-Tower Bi-Encoder</text>

    <text x="16" y="56" class="sub">Decouple query and doc towers</text>
    <text x="16" y="72" class="sub">so docs are indexed offline.</text>

    <rect x="16" y="88" width="102" height="54" rx="6" fill="#eff6ff" stroke="#3b82f6" />
    <text x="67" y="108" text-anchor="middle" class="mono-bold" fill="#1d4ed8">Query Tower</text>
    <text x="67" y="128" text-anchor="middle" class="mono">u = E_Q(q)</text>

    <rect x="132" y="88" width="102" height="54" rx="6" fill="#f0fdf4" stroke="#22c55e" />
    <text x="183" y="108" text-anchor="middle" class="mono-bold" fill="#15803d">Doc Tower</text>
    <text x="183" y="128" text-anchor="middle" class="mono">v = E_D(d)</text>

    <rect x="28" y="158" width="194" height="36" rx="6" fill="#ffffff" stroke="#64748b" />
    <text x="125" y="180" text-anchor="middle" class="mono-bold" fill="#0f172a">Score s(q, d) = ⟨u, v⟩ / τ</text>

    <text x="125" y="222" text-anchor="middle" class="sub" fill="#334155">1 query forward pass + ANN MIPS!</text>
  </g>

  <!-- Card 2: In-Batch Contrastive Matrix -->
  <g transform="translate(285, 46)">
    <rect width="250" height="244" class="card" fill="#eff6ff" stroke="#93c5fd" />
    <rect width="250" height="34" rx="10" ry="10" fill="#dbeafe" />
    <text x="125" y="22" text-anchor="middle" class="mono-bold" fill="#1e3a8a">2. In-Batch InfoNCE Matrix</text>

    <text x="16" y="56" class="sub">Diagonal = positive pairs (u_i·v_i);</text>
    <text x="16" y="72" class="sub">Off-diagonal = in-batch negatives.</text>

    <!-- 3x3 similarity grid -->
    <g transform="translate(58, 86)">
      <rect x="0" y="0" width="42" height="30" fill="#bbf7d0" stroke="#16a34a" />
      <text x="21" y="19" text-anchor="middle" class="mono-bold" fill="#14532d">+4.2</text>
      <rect x="44" y="0" width="42" height="30" fill="#ffffff" stroke="#94a3b8" />
      <text x="65" y="19" text-anchor="middle" class="mono">0.4</text>
      <rect x="88" y="0" width="42" height="30" fill="#ffffff" stroke="#94a3b8" />
      <text x="109" y="19" text-anchor="middle" class="mono">-0.5</text>

      <rect x="0" y="32" width="42" height="30" fill="#ffffff" stroke="#94a3b8" />
      <text x="21" y="51" text-anchor="middle" class="mono">0.1</text>
      <rect x="44" y="32" width="42" height="30" fill="#bbf7d0" stroke="#16a34a" />
      <text x="65" y="51" text-anchor="middle" class="mono-bold" fill="#14532d">+3.9</text>
      <rect x="88" y="32" width="42" height="30" fill="#ffffff" stroke="#94a3b8" />
      <text x="109" y="51" text-anchor="middle" class="mono">0.6</text>

      <rect x="0" y="64" width="42" height="30" fill="#ffffff" stroke="#94a3b8" />
      <text x="21" y="83" text-anchor="middle" class="mono">-0.3</text>
      <rect x="44" y="64" width="42" height="30" fill="#ffffff" stroke="#94a3b8" />
      <text x="65" y="83" text-anchor="middle" class="mono">0.2</text>
      <rect x="88" y="64" width="42" height="30" fill="#bbf7d0" stroke="#16a34a" />
      <text x="109" y="83" text-anchor="middle" class="mono-bold" fill="#14532d">+4.5</text>
    </g>

    <text x="125" y="204" text-anchor="middle" class="mono" fill="#1e3a8a">L = -ln( exp(s_ii) / Σ_j exp(s_ij) )</text>
    <text x="125" y="224" text-anchor="middle" class="sub" fill="#1e40af">Log-Q debiasing: s_ij - ln(p_j)</text>
  </g>

  <!-- Card 3: Hard Negative Mining -->
  <g transform="translate(552, 46)">
    <rect width="250" height="244" class="card" fill="#f0fdf4" stroke="#86efac" />
    <rect width="250" height="34" rx="10" ry="10" fill="#dcfce7" />
    <text x="125" y="22" text-anchor="middle" class="mono-bold" fill="#14532d">3. Hard Negative Mining</text>

    <text x="14" y="56" class="sub">Random negatives are too easy;</text>
    <text x="14" y="72" class="sub">mine near-miss top ANN hits.</text>

    <rect x="12" y="86" width="226" height="38" rx="5" fill="#ffffff" stroke="#94a3b8" />
    <text x="20" y="102" class="mono-bold" fill="#475569">Easy Neg (Random):</text>
    <text x="20" y="117" class="mono">"chocolate cake" (s = -1.2)</text>

    <rect x="12" y="130" width="226" height="38" rx="5" fill="#fef3c7" stroke="#f59e0b" />
    <text x="20" y="146" class="mono-bold" fill="#b45309">Hard Neg (BM25 / ANCE):</text>
    <text x="20" y="161" class="mono">"python snake" (s = +3.1)</text>

    <rect x="12" y="174" width="226" height="38" rx="5" fill="#fee2e2" stroke="#ef4444" />
    <text x="20" y="190" class="mono-bold" fill="#b91c1c">False Neg (RocketQA filter):</text>
    <text x="20" y="205" class="mono">Drop if Cross-Encoder &gt; 0.8</text>

    <text x="125" y="230" text-anchor="middle" class="sub" fill="#14532d">Sharpens decision boundary!</text>
  </g>
</svg>

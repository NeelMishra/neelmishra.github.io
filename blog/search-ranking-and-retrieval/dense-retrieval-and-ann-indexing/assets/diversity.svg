<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
  <title id="title">HNSW Relative Neighborhood Diversity Heuristic (Algorithm 4)</title>
  <desc id="desc">Inserted vector q is at (0, 0) with budget M=2. Candidate a=(1, 0) is accepted first. Candidate b=(1.1, 0.1) has squared distance 1.22 to q but only 0.02 to a, so it is rejected by the diversity heuristic. Candidate c=(0, 1.2) has squared distance 1.44 to q and 2.44 to a, so it is accepted.</desc>
  <defs>
    <marker id="div-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#1e6b52" />
    </marker>
    <marker id="div-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#c25928" />
    </marker>
  </defs>

  <rect width="960" height="470" rx="16" fill="#fffaf2" stroke="#dcd3c2" stroke-width="1.5" />

  <!-- Header -->
  <text x="32" y="38" font-family="sans-serif" font-size="20" font-weight="700" fill="#1e2d26">HNSW Neighbor Selection Heuristic (Algorithm 4): Diverse Routes vs. Redundant Cliques</text>
  <text x="32" y="62" font-family="sans-serif" font-size="13.5" fill="#52635a">A candidate e is accepted only if it is closer to the inserted node q than to every already-selected neighbor r in R: d(q, e) &lt; d(r, e).</text>

  <!-- ==================== LEFT PANEL: 2D GEOMETRY ==================== -->
  <rect x="28" y="80" width="440" height="366" rx="12" fill="#ffffff" stroke="#c8d6cc" stroke-width="1.5" />
  <text x="48" y="108" font-family="sans-serif" font-size="15" font-weight="700" fill="#184e3b">1. Geometric Occlusion in 2D (Budget M = 2)</text>

  <!-- Axes -->
  <line x1="96" y1="382" x2="436" y2="382" stroke="#b5c4bb" stroke-width="1.8" />
  <line x1="96" y1="382" x2="96" y2="128" stroke="#b5c4bb" stroke-width="1.8" />

  <!-- Shaded occlusion zone around a -->
  <circle cx="326" cy="382" r="54" fill="#faece0" stroke="#c25928" stroke-width="1.5" stroke-dasharray="4 3" />
  <text x="332" y="314" font-family="sans-serif" font-size="11" font-weight="700" fill="#8c3d19" text-anchor="middle">Occluded by a: d(a, e) &lt;= d(q, e)</text>

  <!-- Accepted Edge q -> a -->
  <line x1="96" y1="382" x2="310" y2="382" stroke="#1e6b52" stroke-width="3.2" marker-end="url(#div-green)" />
  <!-- Rejected Edge q -> b -->
  <line x1="96" y1="382" x2="342" y2="360" stroke="#c25928" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#div-amber)" />
  <!-- Short distance a <-> b -->
  <line x1="326" y1="382" x2="352" y2="358" stroke="#b83b2a" stroke-width="2.2" />
  <!-- Accepted Edge q -> c -->
  <line x1="96" y1="382" x2="96" y2="162" stroke="#1e6b52" stroke-width="3.2" marker-end="url(#div-green)" />

  <!-- Nodes -->
  <!-- q = (0, 0) -->
  <circle cx="96" cy="382" r="14" fill="#d13b27" stroke="#ffffff" stroke-width="2" />
  <text x="96" y="414" font-family="sans-serif" font-size="13" font-weight="700" fill="#d13b27" text-anchor="middle">q = (0, 0)</text>

  <!-- a = (1, 0) -->
  <circle cx="326" cy="382" r="14" fill="#1e6b52" stroke="#ffffff" stroke-width="2" />
  <text x="326" y="414" font-family="sans-serif" font-size="13" font-weight="700" fill="#184e3b" text-anchor="middle">a = (1, 0) [Kept #1]</text>

  <!-- b = (1.1, 0.1) -->
  <circle cx="352" cy="358" r="13" fill="#fde4cf" stroke="#c25928" stroke-width="2.2" />
  <text x="372" y="362" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#8c3d19">b = (1.1, 0.1)</text>
  <text x="372" y="378" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#b83b2a">[Pruned!]</text>

  <!-- c = (0, 1.2) -->
  <circle cx="96" cy="144" r="14" fill="#1e6b52" stroke="#ffffff" stroke-width="2" />
  <text x="118" y="142" font-family="sans-serif" font-size="13" font-weight="700" fill="#184e3b">c = (0, 1.2) [Kept #2]</text>
  <text x="118" y="160" font-family="sans-serif" font-size="11.5" fill="#52635a">New orthogonal direction (+y)</text>

  <!-- ==================== RIGHT PANEL: HEURISTIC TRACE ==================== -->
  <rect x="492" y="80" width="440" height="366" rx="12" fill="#ffffff" stroke="#c8d6cc" stroke-width="1.5" />
  <text x="512" y="108" font-family="sans-serif" font-size="15" font-weight="700" fill="#184e3b">2. Step-by-Step Heuristic Comparison (M = 2)</text>

  <!-- Candidate 1: a -->
  <rect x="512" y="124" width="400" height="72" rx="10" fill="#eef8f3" stroke="#1e6b52" stroke-width="1.8" />
  <text x="528" y="146" font-family="sans-serif" font-size="13" font-weight="700" fill="#184e3b">Step 1 — Candidate a = (1, 0):  d²(q, a) = 1.00</text>
  <text x="528" y="166" font-family="sans-serif" font-size="12" fill="#374840">Selected set R is empty -&gt; Condition vacuously holds.</text>
  <text x="528" y="184" font-family="sans-serif" font-size="12" font-weight="700" fill="#184e3b">Decision: Accept a.  R = {a}</text>

  <!-- Candidate 2: b -->
  <rect x="512" y="208" width="400" height="84" rx="10" fill="#fff6ee" stroke="#c25928" stroke-width="1.8" />
  <text x="528" y="230" font-family="sans-serif" font-size="13" font-weight="700" fill="#8c3d19">Step 2 — Candidate b = (1.1, 0.1):  d²(q, b) = 1.22</text>
  <text x="528" y="250" font-family="sans-serif" font-size="12" fill="#374840">Compare against r = a in R:  d²(a, b) = 0.1² + 0.1² = 0.02</text>
  <text x="528" y="268" font-family="sans-serif" font-size="12" font-weight="700" fill="#b83b2a">Check: Is d²(q, b) &lt; d²(a, b)?  1.22 &lt; 0.02 is FALSE!</text>
  <text x="528" y="284" font-family="sans-serif" font-size="12" fill="#374840">Decision: Reject b (redundant with a).  R = {a}</text>

  <!-- Candidate 3: c -->
  <rect x="512" y="304" width="400" height="78" rx="10" fill="#eef8f3" stroke="#1e6b52" stroke-width="1.8" />
  <text x="528" y="326" font-family="sans-serif" font-size="13" font-weight="700" fill="#184e3b">Step 3 — Candidate c = (0, 1.2):  d²(q, c) = 1.44</text>
  <text x="528" y="346" font-family="sans-serif" font-size="12" fill="#374840">Compare against r = a in R:  d²(a, c) = (-1)² + 1.2² = 2.44</text>
  <text x="528" y="366" font-family="sans-serif" font-size="12" font-weight="700" fill="#184e3b">Check: 1.44 &lt; 2.44 is TRUE!  Accept c -&gt; Final R = {a, c}</text>

  <!-- Summary -->
  <rect x="512" y="394" width="400" height="38" rx="8" fill="#f3f8f5" stroke="#b7d1c3" />
  <text x="712" y="418" font-family="sans-serif" font-size="12" font-weight="700" fill="#184e3b" text-anchor="middle">Naive closest-2 picks {a, b}; Diversity heuristic picks {a, c}</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300">
  <rect width="760" height="300" fill="#ffffff" />
  <style>
    .title { font-family: 'Inter', -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; }
    .sub { font-family: 'Inter', -apple-system, sans-serif; font-size: 10.6px; font-weight: 500; fill: #475569; }
    .mono { font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 9.4px; fill: #1e293b; }
    .mono-bold { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; font-weight: 700; }
    .card { rx: 10; ry: 10; stroke-width: 1.5; }
  </style>

  <text x="380" y="26" text-anchor="middle" class="title">Sub-Linear Vector Search: IVF Voronoi Cells, Product Quantization, and HNSW</text>

  <!-- Card 1: Inverted File Index (IVF) -->
  <g transform="translate(20, 44)">
    <rect width="230" height="236" class="card" fill="#f8fafc" stroke="#cbd5e1" />
    <rect width="230" height="34" rx="10" ry="10" fill="#e2e8f0" />
    <text x="115" y="22" text-anchor="middle" class="mono-bold" fill="#0f172a">1. IVF Voronoi Partitioning</text>

    <text x="16" y="56" class="sub">Cluster N vectors into C cells;</text>
    <text x="16" y="72" class="sub">only scan top nprobe cells.</text>

    <rect x="16" y="88" width="94" height="52" rx="6" fill="#eff6ff" stroke="#3b82f6" />
    <text x="63" y="108" text-anchor="middle" class="mono-bold" fill="#1d4ed8">Cell c_1 (Hit)</text>
    <text x="63" y="126" text-anchor="middle" class="mono">||q - μ_1|| = 0.3</text>

    <rect x="120" y="88" width="94" height="52" rx="6" fill="#eff6ff" stroke="#3b82f6" />
    <text x="167" y="108" text-anchor="middle" class="mono-bold" fill="#1d4ed8">Cell c_2 (Hit)</text>
    <text x="167" y="126" text-anchor="middle" class="mono">||q - μ_2|| = 0.5</text>

    <rect x="16" y="148" width="198" height="34" rx="6" fill="#f1f5f9" stroke="#94a3b8" />
    <text x="115" y="170" text-anchor="middle" class="mono" fill="#64748b">Cells c_3 .. c_1024 Skipped!</text>

    <text x="115" y="214" text-anchor="middle" class="mono-bold" fill="#334155">Scanned: (nprobe / C) * N</text>
  </g>

  <!-- Card 2: Product Quantization (PQ) -->
  <g transform="translate(265, 44)">
    <rect width="230" height="236" class="card" fill="#f0fdf4" stroke="#86efac" />
    <rect width="230" height="34" rx="10" ry="10" fill="#dcfce7" />
    <text x="115" y="22" text-anchor="middle" class="mono-bold" fill="#14532d">2. Product Quantization (PQ)</text>

    <text x="16" y="56" class="sub">Split d-dim vector into M chunks;</text>
    <text x="16" y="72" class="sub">store 1-byte centroid ID per chunk.</text>

    <rect x="16" y="88" width="198" height="36" rx="5" fill="#fff" stroke="#94a3b8" />
    <text x="115" y="104" text-anchor="middle" class="mono-bold" fill="#334155">128-d Float32 = 512 Bytes</text>
    <text x="115" y="118" text-anchor="middle" class="mono">[v_1..16 | v_17..32 | ... | v_113..128]</text>

    <rect x="16" y="134" width="198" height="42" rx="5" fill="#dcfce7" stroke="#16a34a" />
    <text x="115" y="152" text-anchor="middle" class="mono-bold" fill="#15803d">M=8 Byte Code = 8 Bytes (64x!)</text>
    <text x="115" y="168" text-anchor="middle" class="mono">[ 42 | 19 | 204 | 7 | 88 | 3 | 150 | 61 ]</text>

    <text x="115" y="202" text-anchor="middle" class="mono" fill="#14532d">ADC: Σ_m LUT[m, code_m]</text>
    <text x="115" y="220" text-anchor="middle" class="sub" fill="#166534">8 table lookups instead of 128 FLOPs</text>
  </g>

  <!-- Card 3: HNSW Multi-Layer Graph -->
  <g transform="translate(510, 44)">
    <rect width="230" height="236" class="card" fill="#eff6ff" stroke="#93c5fd" />
    <rect width="230" height="34" rx="10" ry="10" fill="#dbeafe" />
    <text x="115" y="22" text-anchor="middle" class="mono-bold" fill="#1e3a8a">3. HNSW Navigable Graph</text>

    <text x="16" y="56" class="sub">Express highway layers at top;</text>
    <text x="16" y="72" class="sub">fine-grained search at Layer 0.</text>

    <rect x="16" y="86" width="198" height="30" rx="5" fill="#fff" stroke="#3b82f6" />
    <text x="24" y="105" class="mono-bold" fill="#1d4ed8">Layer 2:</text>
    <text x="90" y="105" class="mono">Entry -&gt; long jump</text>

    <rect x="16" y="122" width="198" height="30" rx="5" fill="#fff" stroke="#3b82f6" />
    <text x="24" y="141" class="mono-bold" fill="#1d4ed8">Layer 1:</text>
    <text x="90" y="141" class="mono">Medium hops (M edges)</text>

    <rect x="16" y="158" width="198" height="34" rx="5" fill="#dbeafe" stroke="#2563eb" />
    <text x="24" y="179" class="mono-bold" fill="#1e3a8a">Layer 0:</text>
    <text x="90" y="179" class="mono">Beam width efSearch</text>

    <text x="115" y="218" text-anchor="middle" class="mono-bold" fill="#1e3a8a">O(log N) hops | ~98% Recall@10</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 308" width="860" height="308" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="860" height="308" rx="12" fill="#ffffff" />
  <style>
    .title { font-size: 15px; font-weight: 700; fill: #0f172a; }
    .sub { font-size: 10.6px; font-weight: 500; fill: #475569; }
    .mono { font-size: 9.2px; fill: #1e293b; }
    .mono-bold { font-size: 10.5px; font-weight: 700; }
    .card { rx: 10; ry: 10; stroke-width: 1.5; }
  </style>

  <text x="430" y="26" text-anchor="middle" class="title">Sub-Linear Vector Search: IVF Voronoi Cells, Product Quantization, and HNSW</text>

  <!-- Card 1: Inverted File Index (IVF) -->
  <g transform="translate(16, 44)">
    <rect width="264" height="244" class="card" fill="#f8fafc" stroke="#cbd5e1" />
    <rect width="264" height="34" rx="10" ry="10" fill="#e2e8f0" />
    <text x="132" y="22" text-anchor="middle" class="mono-bold" fill="#0f172a">1. IVF Voronoi Partitioning</text>

    <text x="16" y="56" class="sub">Cluster N vectors into C cells;</text>
    <text x="16" y="72" class="sub">only scan top nprobe cells.</text>

    <rect x="16" y="88" width="110" height="52" rx="6" fill="#eff6ff" stroke="#3b82f6" />
    <text x="71" y="108" text-anchor="middle" class="mono-bold" fill="#1d4ed8">Cell c₁ (Hit)</text>
    <text x="71" y="126" text-anchor="middle" class="mono">‖q − μ₁‖ = 0.3</text>

    <rect x="138" y="88" width="110" height="52" rx="6" fill="#eff6ff" stroke="#3b82f6" />
    <text x="193" y="108" text-anchor="middle" class="mono-bold" fill="#1d4ed8">Cell c₂ (Hit)</text>
    <text x="193" y="126" text-anchor="middle" class="mono">‖q − μ₂‖ = 0.5</text>

    <rect x="16" y="148" width="232" height="34" rx="6" fill="#f1f5f9" stroke="#94a3b8" />
    <text x="132" y="170" text-anchor="middle" class="mono" fill="#64748b">Cells c₃ .. c₁₀₂₄ Skipped!</text>

    <text x="132" y="218" text-anchor="middle" class="mono-bold" fill="#334155">Scanned: (nprobe / C) · N</text>
  </g>

  <!-- Card 2: Product Quantization (PQ) -->
  <g transform="translate(298, 44)">
    <rect width="264" height="244" class="card" fill="#f0fdf4" stroke="#86efac" />
    <rect width="264" height="34" rx="10" ry="10" fill="#dcfce7" />
    <text x="132" y="22" text-anchor="middle" class="mono-bold" fill="#14532d">2. Product Quantization (PQ)</text>

    <text x="16" y="56" class="sub">Split d-dim vector into M chunks;</text>
    <text x="16" y="72" class="sub">store 1-byte centroid ID per chunk.</text>

    <rect x="16" y="88" width="232" height="38" rx="5" fill="#fff" stroke="#94a3b8" />
    <text x="132" y="104" text-anchor="middle" class="mono-bold" fill="#334155">128-d Float32 = 512 Bytes</text>
    <text x="132" y="119" text-anchor="middle" class="mono">[v₁..₁₆ | v₁₇..₃₂ | ... | v₁₁₃..₁₂₈]</text>

    <rect x="16" y="134" width="232" height="42" rx="5" fill="#dcfce7" stroke="#16a34a" />
    <text x="132" y="152" text-anchor="middle" class="mono-bold" fill="#15803d">M = 8 Byte Code = 8 Bytes (64×)</text>
    <text x="132" y="168" text-anchor="middle" class="mono">[ 42 | 19 | 204 | 7 | 88 | 3 | 150 | 61 ]</text>

    <text x="132" y="202" text-anchor="middle" class="mono" fill="#14532d">ADC: Σ_m LUT[m, code_m]</text>
    <text x="132" y="220" text-anchor="middle" class="sub" fill="#166534">8 table lookups instead of 128 FLOPs</text>
  </g>

  <!-- Card 3: HNSW Multi-Layer Graph -->
  <g transform="translate(580, 44)">
    <rect width="264" height="244" class="card" fill="#eff6ff" stroke="#93c5fd" />
    <rect width="264" height="34" rx="10" ry="10" fill="#dbeafe" />
    <text x="132" y="22" text-anchor="middle" class="mono-bold" fill="#1e3a8a">3. HNSW Navigable Graph</text>

    <text x="16" y="56" class="sub">Express highway layers at top;</text>
    <text x="16" y="72" class="sub">fine-grained search at Layer 0.</text>

    <rect x="16" y="86" width="232" height="30" rx="5" fill="#fff" stroke="#3b82f6" />
    <text x="28" y="105" class="mono-bold" fill="#1d4ed8">Layer 2:</text>
    <text x="96" y="105" class="mono">Entry → long jump</text>

    <rect x="16" y="122" width="232" height="30" rx="5" fill="#fff" stroke="#3b82f6" />
    <text x="28" y="141" class="mono-bold" fill="#1d4ed8">Layer 1:</text>
    <text x="96" y="141" class="mono">Medium hops (M edges)</text>

    <rect x="16" y="158" width="232" height="34" rx="5" fill="#dbeafe" stroke="#2563eb" />
    <text x="28" y="179" class="mono-bold" fill="#1e3a8a">Layer 0:</text>
    <text x="96" y="179" class="mono">Beam width efSearch</text>

    <text x="132" y="218" text-anchor="middle" class="mono-bold" fill="#1e3a8a">O(log N) hops | ~98% Recall@10</text>
  </g>
</svg>

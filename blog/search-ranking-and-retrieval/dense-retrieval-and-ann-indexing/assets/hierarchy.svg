<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
  <title id="title">HNSW Multi-Layer Hierarchy and Exponential Promotion Distribution</title>
  <desc id="desc">Left panel shows nested HNSW layers 2, 1, and 0 where node A appears on layers 0-2, B on layers 0-1, and C, D on layer 0, with greedy zoom-in from A to B and beam search to D. Right panel shows the exponential level distribution P(l &gt;= j) = M^-j for N=1,000,000 and M=16.</desc>
  <defs>
    <marker id="h-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#1e6b52" />
    </marker>
    <marker id="h-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#c25928" />
    </marker>
  </defs>

  <rect width="960" height="480" rx="16" fill="#fffaf2" stroke="#dcd3c2" stroke-width="1.5" />

  <!-- Header -->
  <text x="32" y="38" font-family="sans-serif" font-size="20" font-weight="700" fill="#1e2d26">HNSW Graph Hierarchy: Nested Skip-List Layers &amp; Promotion Law</text>
  <text x="32" y="62" font-family="sans-serif" font-size="13.5" fill="#52635a">Left: Greedy zoom-in (ef = 1) on sparse upper layers enters Layer 0 near the target. Right: Geometric thinning P(l &gt;= j) = M^(-j).</text>

  <!-- ==================== LEFT PANEL: NESTED LAYERS ==================== -->
  <rect x="28" y="80" width="460" height="376" rx="12" fill="#ffffff" stroke="#c8d6cc" stroke-width="1.5" />
  <text x="48" y="108" font-family="sans-serif" font-size="15" font-weight="700" fill="#184e3b">1. Same Vectors Across Nested Graph Layers</text>

  <!-- Layer 2 Plane -->
  <rect x="48" y="122" width="420" height="78" rx="10" fill="#f2f7f4" stroke="#9ab5a6" stroke-width="1.5" />
  <text x="64" y="144" font-family="sans-serif" font-size="13" font-weight="700" fill="#184e3b">Layer 2 (Top Entry, ef = 1)</text>
  <text x="64" y="164" font-family="sans-serif" font-size="11.5" fill="#52635a">Sparse highway: only highest-promoted nodes</text>
  <circle cx="200" cy="168" r="20" fill="#dceee3" stroke="#1e6b52" stroke-width="2.2" />
  <text x="200" y="173" font-family="sans-serif" font-size="15" font-weight="700" fill="#184e3b" text-anchor="middle">A</text>
  <text x="230" y="172" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#184e3b">ep: d² = 64</text>

  <!-- Layer 1 Plane -->
  <rect x="48" y="218" width="420" height="84" rx="10" fill="#eef6f1" stroke="#9ab5a6" stroke-width="1.5" />
  <text x="64" y="240" font-family="sans-serif" font-size="13" font-weight="700" fill="#184e3b">Layer 1 (Greedy Zoom, ef = 1)</text>
  <line x1="200" y1="268" x2="326" y2="268" stroke="#1e6b52" stroke-width="2.6" marker-end="url(#h-green)" />
  <text x="268" y="258" font-family="sans-serif" font-size="11" font-weight="700" fill="#1e6b52" text-anchor="middle">64 -&gt; 49</text>
  <circle cx="200" cy="268" r="20" fill="#dceee3" stroke="#1e6b52" stroke-width="2" />
  <text x="200" y="273" font-family="sans-serif" font-size="15" font-weight="700" fill="#184e3b" text-anchor="middle">A</text>
  <circle cx="350" cy="268" r="20" fill="#1e6b52" stroke="#184e3b" stroke-width="2" />
  <text x="350" y="273" font-family="sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>
  <text x="380" y="272" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#184e3b">d² = 49</text>

  <!-- Layer 0 Plane -->
  <rect x="48" y="320" width="420" height="120" rx="10" fill="#fff6ee" stroke="#cba989" stroke-width="1.6" />
  <text x="64" y="342" font-family="sans-serif" font-size="13" font-weight="700" fill="#8c3d19">Layer 0 (Full Corpus, Beam Search ef = efSearch)</text>

  <!-- Layer 0 Edges -->
  <line x1="200" y1="382" x2="350" y2="365" stroke="#8f9e95" stroke-width="2.2" />
  <line x1="200" y1="382" x2="295" y2="412" stroke="#c25928" stroke-width="2.4" />
  <line x1="295" y1="412" x2="418" y2="412" stroke="#1e6b52" stroke-width="2.6" marker-end="url(#h-green)" />

  <circle cx="200" cy="382" r="18" fill="#dceee3" stroke="#1e6b52" stroke-width="2" />
  <text x="200" y="387" font-family="sans-serif" font-size="14" font-weight="700" fill="#184e3b" text-anchor="middle">A</text>
  <text x="164" y="386" font-family="sans-serif" font-size="11" fill="#52635a" text-anchor="end">d²=64</text>

  <circle cx="350" cy="365" r="18" fill="#dceee3" stroke="#1e6b52" stroke-width="2" />
  <text x="350" y="370" font-family="sans-serif" font-size="14" font-weight="700" fill="#184e3b" text-anchor="middle">B</text>
  <text x="388" y="369" font-family="sans-serif" font-size="11" fill="#52635a">d²=49</text>

  <circle cx="295" cy="412" r="18" fill="#fde4cf" stroke="#c25928" stroke-width="2" />
  <text x="295" y="417" font-family="sans-serif" font-size="14" font-weight="700" fill="#8c3d19" text-anchor="middle">C</text>
  <text x="255" y="424" font-family="sans-serif" font-size="11" font-weight="700" fill="#c25928" text-anchor="end">detour: 81</text>

  <circle cx="438" cy="412" r="18" fill="#1e6b52" stroke="#ffffff" stroke-width="2" />
  <text x="438" y="417" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">D</text>
  <text x="438" y="388" font-family="sans-serif" font-size="11" font-weight="700" fill="#184e3b" text-anchor="middle">NN: 0.25</text>

  <!-- Vertical Same-ID Descent Connectors -->
  <line x1="200" y1="188" x2="200" y2="244" stroke="#c25928" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#h-amber)" />
  <line x1="350" y1="288" x2="350" y2="343" stroke="#c25928" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#h-amber)" />

  <!-- ==================== RIGHT PANEL: PROMOTION DISTRIBUTION ==================== -->
  <rect x="504" y="80" width="428" height="376" rx="12" fill="#ffffff" stroke="#c8d6cc" stroke-width="1.5" />
  <text x="524" y="108" font-family="sans-serif" font-size="15" font-weight="700" fill="#184e3b">2. Exponential Layer Thinning (N = 10⁶, M = 16)</text>

  <rect x="524" y="122" width="388" height="44" rx="8" fill="#f3f8f5" stroke="#b7d1c3" />
  <text x="718" y="142" font-family="sans-serif" font-size="13" font-weight="700" fill="#184e3b" text-anchor="middle">l = floor(-ln(U) * m_L),   m_L = 1 / ln(M)</text>
  <text x="718" y="159" font-family="sans-serif" font-size="11.5" fill="#52635a" text-anchor="middle">Presence: P(l &gt;= j) = M^(-j)   |   Exact top: P(l = j) = (1 - 1/M) M^(-j)</text>

  <!-- Level Bars -->
  <!-- Level 5 -->
  <text x="524" y="194" font-family="sans-serif" font-size="12" font-weight="700" fill="#233a31">Layer 5</text>
  <rect x="588" y="180" width="8" height="20" rx="3" fill="#1e6b52" />
  <text x="606" y="194" font-family="sans-serif" font-size="11.5" fill="#374840">16⁻⁵ = 1 / 1,048,576  (~0.95 nodes)</text>

  <!-- Level 4 -->
  <text x="524" y="228" font-family="sans-serif" font-size="12" font-weight="700" fill="#233a31">Layer 4</text>
  <rect x="588" y="214" width="22" height="20" rx="3" fill="#1e6b52" />
  <text x="620" y="228" font-family="sans-serif" font-size="11.5" fill="#374840">16⁻⁴ = 1 / 65,536  (~15.3 nodes)</text>

  <!-- Level 3 -->
  <text x="524" y="262" font-family="sans-serif" font-size="12" font-weight="700" fill="#233a31">Layer 3</text>
  <rect x="588" y="248" width="52" height="20" rx="3" fill="#2c7a5f" />
  <text x="650" y="262" font-family="sans-serif" font-size="11.5" fill="#374840">16⁻³ = 1 / 4,096  (~244 nodes)</text>

  <!-- Level 2 -->
  <text x="524" y="296" font-family="sans-serif" font-size="12" font-weight="700" fill="#233a31">Layer 2</text>
  <rect x="588" y="282" width="100" height="20" rx="3" fill="#3d8c70" />
  <text x="698" y="296" font-family="sans-serif" font-size="11.5" fill="#374840">16⁻² = 1 / 256  (~3,906 nodes)</text>

  <!-- Level 1 -->
  <text x="524" y="330" font-family="sans-serif" font-size="12" font-weight="700" fill="#233a31">Layer 1</text>
  <rect x="588" y="316" width="166" height="20" rx="3" fill="#5aa388" />
  <text x="764" y="330" font-family="sans-serif" font-size="11.5" fill="#374840">16⁻¹ = 1 / 16  (62,500 nodes)</text>

  <!-- Level 0 -->
  <text x="524" y="364" font-family="sans-serif" font-size="12" font-weight="700" fill="#8c3d19">Layer 0</text>
  <rect x="588" y="350" width="320" height="22" rx="3" fill="#c25928" />
  <text x="748" y="365" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">16⁰ = 1.00  (All 1,000,000 vectors)</text>

  <!-- Summary Box -->
  <rect x="524" y="388" width="388" height="52" rx="8" fill="#fff6ee" stroke="#cba989" />
  <text x="538" y="408" font-family="sans-serif" font-size="12" font-weight="700" fill="#8c3d19">Expected memberships per node: Σ M^(-j) = M / (M - 1) = 16/15</text>
  <text x="538" y="426" font-family="sans-serif" font-size="11.5" fill="#374840">Vectors are stored once; upper layers only store adjacency lists (~6.7% extra).</text>
</svg>

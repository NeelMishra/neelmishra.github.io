<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300">
  <rect width="760" height="300" fill="#ffffff" />
  <style>
    .title { font-family: 'Inter', -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; }
    .sub { font-family: 'Inter', -apple-system, sans-serif; font-size: 11.5px; font-weight: 500; fill: #475569; }
    .mono { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #1e293b; }
    .mono-bold { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; font-weight: 700; }
    .card { rx: 10; ry: 10; stroke-width: 1.5; }
  </style>

  <text x="380" y="26" text-anchor="middle" class="title">The Multi-Stage Ranking Funnel: Retrieval, L1/L2 Ranking, and Re-Ranking</text>

  <!-- Card 1: L0 Retrieval & L1 Light Ranker -->
  <g transform="translate(20, 44)">
    <rect width="230" height="236" class="card" fill="#f8fafc" stroke="#cbd5e1" />
    <rect width="230" height="34" rx="10" ry="10" fill="#e2e8f0" />
    <text x="115" y="22" text-anchor="middle" class="mono-bold" fill="#0f172a">1. L0 Retrieval -&gt; L1 Rank</text>

    <text x="16" y="56" class="sub">Prune 100M items to 1,000, then</text>
    <text x="16" y="72" class="sub">score with a fast light model.</text>

    <rect x="16" y="88" width="198" height="44" rx="6" fill="#fff" stroke="#94a3b8" />
    <text x="24" y="106" class="mono-bold" fill="#334155">L0 Candidate Gen (~15 ms)</text>
    <text x="24" y="122" class="mono">10^8 -&gt; 10^3 (BM25 + ANN)</text>

    <rect x="16" y="140" width="198" height="44" rx="6" fill="#eff6ff" stroke="#3b82f6" />
    <text x="24" y="158" class="mono-bold" fill="#1d4ed8">L1 Light Ranker (~10 ms)</text>
    <text x="24" y="174" class="mono">10^3 -&gt; 10^2 (Small GBDT/MLP)</text>

    <text x="115" y="214" text-anchor="middle" class="mono-bold" fill="#334155">Goal: Maximize Recall@100</text>
  </g>

  <!-- Card 2: L2 Heavy Ranker -->
  <g transform="translate(265, 44)">
    <rect width="230" height="236" class="card" fill="#eff6ff" stroke="#93c5fd" />
    <rect width="230" height="34" rx="10" ry="10" fill="#dbeafe" />
    <text x="115" y="22" text-anchor="middle" class="mono-bold" fill="#1e3a8a">2. L2 Heavy Ranking</text>

    <text x="16" y="56" class="sub">Rich cross-features, Cross-Encoder</text>
    <text x="16" y="72" class="sub">or Multi-Task Deep CTR on top 100.</text>

    <rect x="16" y="88" width="198" height="46" rx="6" fill="#fff" stroke="#3b82f6" />
    <text x="24" y="106" class="mono-bold" fill="#1d4ed8">L2 Heavy Model (~30 ms)</text>
    <text x="24" y="124" class="mono">100 -&gt; 20 (LambdaMART / DCNv2)</text>

    <rect x="16" y="142" width="198" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" />
    <text x="24" y="160" class="mono-bold" fill="#1e3a8a">Multi-Objective Value Score:</text>
    <text x="24" y="176" class="mono">S_i = w_1 P(click) + w_2 P(buy)</text>

    <text x="115" y="214" text-anchor="middle" class="mono-bold" fill="#1e3a8a">Goal: Maximize nDCG@10</text>
  </g>

  <!-- Card 3: L3 Re-Ranking & MMR Diversity -->
  <g transform="translate(510, 44)">
    <rect width="230" height="236" class="card" fill="#f0fdf4" stroke="#86efac" />
    <rect width="230" height="34" rx="10" ry="10" fill="#dcfce7" />
    <text x="115" y="22" text-anchor="middle" class="mono-bold" fill="#14532d">3. L3 Re-Ranking (MMR)</text>

    <text x="16" y="56" class="sub">Penalize near-duplicate items</text>
    <text x="16" y="72" class="sub">&amp; enforce business/freshness rules.</text>

    <rect x="16" y="88" width="198" height="58" rx="6" fill="#fff" stroke="#16a34a" />
    <text x="24" y="106" class="mono-bold" fill="#15803d">Greedy MMR Selection:</text>
    <text x="24" y="122" class="mono">λ·Rel(d) - (1-λ)·max_{s∈S} Sim(d,s)</text>
    <text x="24" y="138" class="mono">Avoids 10 identical red shoes!</text>

    <text x="115" y="176" text-anchor="middle" class="mono-bold" fill="#166534">Total SLA: ~60 ms end-to-end</text>
    <text x="115" y="198" text-anchor="middle" class="sub" fill="#14532d">Balances Relevance, Diversity,</text>
    <text x="115" y="214" text-anchor="middle" class="sub" fill="#14532d">Fairness &amp; Business Rules.</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300">
  <rect width="760" height="300" fill="#ffffff" />
  <style>
    .title { font-family: 'Inter', -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; }
    .sub { font-family: 'Inter', -apple-system, sans-serif; font-size: 10.6px; font-weight: 500; fill: #475569; }
    .mono { font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 9.4px; fill: #1e293b; }
    .mono-bold { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; font-weight: 700; }
    .card { rx: 10; ry: 10; stroke-width: 1.5; }
  </style>

  <text x="380" y="26" text-anchor="middle" class="title">Learning to Rank: Pointwise MSE, Pairwise RankNet, and Listwise LambdaMART</text>

  <!-- Card 1: Pointwise -->
  <g transform="translate(20, 44)">
    <rect width="230" height="236" class="card" fill="#f8fafc" stroke="#cbd5e1" />
    <rect width="230" height="34" rx="10" ry="10" fill="#e2e8f0" />
    <text x="115" y="22" text-anchor="middle" class="mono-bold" fill="#0f172a">1. Pointwise LTR</text>

    <text x="16" y="56" class="sub">Predict each item's grade y_i</text>
    <text x="16" y="72" class="sub">independently; ignores relative order.</text>

    <rect x="16" y="88" width="198" height="44" rx="6" fill="#fff" stroke="#94a3b8" />
    <text x="24" y="106" class="mono-bold" fill="#334155">Loss: (s_i - y_i)^2 or BCE</text>
    <text x="24" y="122" class="mono">Treats Rank 1 == Rank 50!</text>

    <rect x="16" y="140" width="198" height="44" rx="6" fill="#fef2f2" stroke="#fca5a5" />
    <text x="24" y="158" class="mono-bold" fill="#b91c1c">Failure Mode:</text>
    <text x="24" y="174" class="mono">Dominated by bottom-of-list errors</text>

    <text x="115" y="214" text-anchor="middle" class="mono" fill="#475569">No inter-document comparison</text>
  </g>

  <!-- Card 2: Pairwise RankNet -->
  <g transform="translate(265, 44)">
    <rect width="230" height="236" class="card" fill="#eff6ff" stroke="#93c5fd" />
    <rect width="230" height="34" rx="10" ry="10" fill="#dbeafe" />
    <text x="115" y="22" text-anchor="middle" class="mono-bold" fill="#1e3a8a">2. Pairwise (RankNet)</text>

    <text x="16" y="56" class="sub">If y_i &gt; y_j, push score s_i &gt; s_j</text>
    <text x="16" y="72" class="sub">via Bradley-Terry sigmoid.</text>

    <rect x="16" y="88" width="198" height="46" rx="6" fill="#fff" stroke="#3b82f6" />
    <text x="24" y="106" class="mono-bold" fill="#1d4ed8">P(i &gt; j) = σ(s_i - s_j)</text>
    <text x="24" y="124" class="mono">L_ij = ln(1 + exp(-(s_i - s_j)))</text>

    <rect x="16" y="142" width="198" height="42" rx="6" fill="#dbeafe" stroke="#2563eb" />
    <text x="24" y="160" class="mono-bold" fill="#1e3a8a">Pairwise Force λ_ij:</text>
    <text x="24" y="176" class="mono">λ_ij = -1 / (1 + exp(s_i - s_j))</text>

    <text x="115" y="214" text-anchor="middle" class="sub" fill="#1e40af">Still treats all inversions equally!</text>
  </g>

  <!-- Card 3: Listwise LambdaRank / LambdaMART -->
  <g transform="translate(510, 44)">
    <rect width="230" height="236" class="card" fill="#f0fdf4" stroke="#86efac" />
    <rect width="230" height="34" rx="10" ry="10" fill="#dcfce7" />
    <text x="115" y="22" text-anchor="middle" class="mono-bold" fill="#14532d">3. Listwise (LambdaMART)</text>

    <text x="16" y="56" class="sub">Scale RankNet force by |ΔnDCG_ij|</text>
    <text x="16" y="72" class="sub">if items i and j swapped ranks!</text>

    <rect x="16" y="88" width="198" height="44" rx="6" fill="#dcfce7" stroke="#16a34a" />
    <text x="24" y="106" class="mono-bold" fill="#14532d">Swap Rank 1 &lt;-&gt; Rank 2:</text>
    <text x="24" y="122" class="mono">|ΔnDCG| = 0.37 -&gt; Huge push!</text>

    <rect x="16" y="140" width="198" height="44" rx="6" fill="#fff" stroke="#94a3b8" />
    <text x="24" y="158" class="mono-bold" fill="#475569">Swap Rank 50 &lt;-&gt; Rank 51:</text>
    <text x="24" y="174" class="mono">|ΔnDCG| = 0.002 -&gt; Tiny push!</text>

    <text x="115" y="214" text-anchor="middle" class="mono-bold" fill="#166534">λ_ij = -|ΔnDCG_ij| / (1 + e^{s_i-s_j})</text>
  </g>
</svg>

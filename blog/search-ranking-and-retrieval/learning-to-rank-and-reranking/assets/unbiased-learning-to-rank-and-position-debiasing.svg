<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 308" width="860" height="308" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="860" height="308" rx="12" fill="#ffffff" />
  <style>
    .title { font-size: 15px; font-weight: 700; fill: #0f172a; }
    .sub { font-size: 10.6px; font-weight: 500; fill: #475569; }
    .mono { font-size: 9.2px; fill: #1e293b; }
    .mono-bold { font-size: 10.5px; font-weight: 700; }
    .card { rx: 10; ry: 10; stroke-width: 1.5; }
  </style>

  <text x="430" y="26" text-anchor="middle" class="title">Position Bias &amp; Unbiased LTR: Examination Hypothesis, IPS, and PAL</text>

  <!-- Card 1: Examination Hypothesis -->
  <g transform="translate(16, 44)">
    <rect width="264" height="244" class="card" fill="#fef2f2" stroke="#fca5a5" />
    <rect width="264" height="34" rx="10" ry="10" fill="#fee2e2" />
    <text x="132" y="22" text-anchor="middle" class="mono-bold" fill="#991b1b">1. Examination Hypothesis</text>

    <text x="16" y="56" class="sub">A click requires BOTH examining</text>
    <text x="16" y="72" class="sub">position k AND item relevance.</text>

    <rect x="16" y="88" width="232" height="44" rx="6" fill="#fff" stroke="#ef4444" />
    <text x="28" y="106" class="mono-bold" fill="#b91c1c">Position Propensity p_k:</text>
    <text x="28" y="122" class="mono">k=1: 1.00 | k=3: 0.50 | k=10: 0.12</text>

    <rect x="16" y="140" width="232" height="44" rx="6" fill="#fff" stroke="#94a3b8" />
    <text x="28" y="158" class="mono-bold" fill="#334155">Rich-Get-Richer Feedback:</text>
    <text x="28" y="174" class="mono">Rank 1 gets clicked → stays #1</text>

    <text x="132" y="218" text-anchor="middle" class="mono-bold" fill="#991b1b">P(C=1 | d, k) = p_k · P(R=1 | d)</text>
  </g>

  <!-- Card 2: Inverse Propensity Scoring (IPS) -->
  <g transform="translate(298, 44)">
    <rect width="264" height="244" class="card" fill="#eff6ff" stroke="#93c5fd" />
    <rect width="264" height="34" rx="10" ry="10" fill="#dbeafe" />
    <text x="132" y="22" text-anchor="middle" class="mono-bold" fill="#1e3a8a">2. IPS Click Re-Weighting</text>

    <text x="16" y="56" class="sub">Weight each clicked item by</text>
    <text x="16" y="72" class="sub">1 / p_k to recover true relevance.</text>

    <rect x="16" y="88" width="232" height="42" rx="6" fill="#fff" stroke="#94a3b8" />
    <text x="28" y="106" class="mono-bold" fill="#334155">Click at Rank 1 (p_1 = 1.0):</text>
    <text x="28" y="122" class="mono">Weight = 1 / 1.0 = 1.0x click</text>

    <rect x="16" y="138" width="232" height="46" rx="6" fill="#dbeafe" stroke="#2563eb" />
    <text x="28" y="156" class="mono-bold" fill="#1e3a8a">Click at Rank 8 (p_8 = 0.16):</text>
    <text x="28" y="174" class="mono">Weight = 1 / 0.16 = 6.25x clicks!</text>

    <text x="132" y="218" text-anchor="middle" class="mono-bold" fill="#1e3a8a">E[ c_i / p_k ] = r_i (Unbiased!)</text>
  </g>

  <!-- Card 3: PAL Two-Tower Position Debiasing -->
  <g transform="translate(580, 44)">
    <rect width="264" height="244" class="card" fill="#f0fdf4" stroke="#86efac" />
    <rect width="264" height="34" rx="10" ry="10" fill="#dcfce7" />
    <text x="132" y="22" text-anchor="middle" class="mono-bold" fill="#14532d">3. PAL Architecture</text>

    <text x="16" y="56" class="sub">Train with Position Tower;</text>
    <text x="16" y="72" class="sub">drop Position Tower at serving!</text>

    <rect x="16" y="88" width="110" height="52" rx="6" fill="#dcfce7" stroke="#16a34a" />
    <text x="71" y="108" text-anchor="middle" class="mono-bold" fill="#14532d">Rel Tower</text>
    <text x="71" y="126" text-anchor="middle" class="mono">f(q, d)</text>

    <rect x="138" y="88" width="110" height="52" rx="6" fill="#fef3c7" stroke="#f59e0b" />
    <text x="193" y="108" text-anchor="middle" class="mono-bold" fill="#b45309">Pos Tower</text>
    <text x="193" y="126" text-anchor="middle" class="mono">g(pos_k)</text>

    <rect x="16" y="148" width="232" height="42" rx="6" fill="#fff" stroke="#16a34a" />
    <text x="132" y="165" text-anchor="middle" class="mono-bold" fill="#15803d">Train: P(C) = σ(f(q,d)) · σ(g(k))</text>
    <text x="132" y="181" text-anchor="middle" class="mono" fill="#14532d">Serve: Score = σ(f(q,d)) only!</text>

    <text x="132" y="218" text-anchor="middle" class="sub" fill="#14532d">Zero variance explosion at low p_k</text>
  </g>
</svg>

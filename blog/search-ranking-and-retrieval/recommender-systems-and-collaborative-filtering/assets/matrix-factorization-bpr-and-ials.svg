<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="'Inter', -apple-system, sans-serif">
  <rect width="760" height="300" rx="12" fill="#fbfaf6" stroke="#d8d2c5" stroke-width="1.5"/>

  <!-- Card 1: Low-Rank Matrix Factorization -->
  <g transform="translate(16, 16)">
    <rect width="232" height="268" rx="10" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.2"/>
    <text x="116" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#1e2422">1. Matrix Factorization (SVD / ALS)</text>
    <text x="116" y="40" text-anchor="middle" font-size="9.5" fill="#5a625e">Sparse R (M×N) ≈ P (M×d) · Q^T (d×N)</text>

    <g transform="translate(14, 52)">
      <rect width="204" height="162" rx="8" fill="#fbfaf6" stroke="#d8d2c5"/>
      <!-- R matrix -->
      <rect x="12" y="22" width="54" height="64" rx="4" fill="#fdf6e9" stroke="#8c5d16" stroke-width="1.2"/>
      <text x="39" y="46" text-anchor="middle" font-size="9.5" font-weight="700" fill="#8c5d16">R (M×N)</text>
      <text x="39" y="60" text-anchor="middle" font-size="8" fill="#5a625e">99% empty</text>
      <text x="39" y="74" text-anchor="middle" font-size="8" fill="#8c5d16">[5, ?, ?, 1]</text>

      <text x="77" y="56" text-anchor="middle" font-size="12" font-weight="700" fill="#1e2422">≈</text>

      <!-- P matrix -->
      <rect x="88" y="22" width="32" height="64" rx="4" fill="#eef6f0" stroke="#165d4c" stroke-width="1.2"/>
      <text x="104" y="52" text-anchor="middle" font-size="9" font-weight="700" fill="#173d35">P</text>
      <text x="104" y="66" text-anchor="middle" font-size="7.5" fill="#5a625e">M×d</text>

      <text x="127" y="56" text-anchor="middle" font-size="11" font-weight="700" fill="#1e2422">×</text>

      <!-- Q^T matrix -->
      <rect x="135" y="28" width="58" height="30" rx="4" fill="#eef6f0" stroke="#165d4c" stroke-width="1.2"/>
      <text x="164" y="46" text-anchor="middle" font-size="9" font-weight="700" fill="#173d35">Q^T (d×N)</text>

      <rect x="12" y="102" width="180" height="46" rx="5" fill="#ffffff" stroke="#d8d2c5"/>
      <text x="102" y="120" text-anchor="middle" font-size="9" font-weight="700" fill="#1e2422">Score: r̂_ui = p_u^T q_i</text>
      <text x="102" y="136" text-anchor="middle" font-size="8" fill="#5a625e">Alternating Least Squares fixes P, solves Q</text>
    </g>

    <rect x="14" y="224" width="204" height="32" rx="6" fill="#eef6f0"/>
    <text x="116" y="244" text-anchor="middle" font-size="9.5" font-weight="700" fill="#173d35">O(d) dot product per user-item pair</text>
  </g>

  <!-- Card 2: Implicit ALS (Hu, Koren, Volinsky) -->
  <g transform="translate(264, 16)">
    <rect width="232" height="268" rx="10" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.2"/>
    <text x="116" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#1e2422">2. Implicit ALS (iALS)</text>
    <text x="116" y="40" text-anchor="middle" font-size="9.5" fill="#5a625e">Confidence c_ui = 1 + α·r_ui over all pairs</text>

    <g transform="translate(14, 52)">
      <rect width="204" height="162" rx="8" fill="#fbfaf6" stroke="#d8d2c5"/>

      <rect x="12" y="14" width="180" height="42" rx="5" fill="#eef6f0" stroke="#165d4c"/>
      <text x="102" y="31" text-anchor="middle" font-size="9" font-weight="700" fill="#173d35">Preference p_ui = 1 if r_ui &gt; 0 else 0</text>
      <text x="102" y="46" text-anchor="middle" font-size="8.5" fill="#5a625e">Unobserved items are weak negatives (p=0)</text>

      <rect x="12" y="66" width="180" height="42" rx="5" fill="#fdf6e9" stroke="#8c5d16"/>
      <text x="102" y="83" text-anchor="middle" font-size="9" font-weight="700" fill="#8c5d16">Confidence c_ui = 1 + α · r_ui</text>
      <text x="102" y="98" text-anchor="middle" font-size="8.5" fill="#5a625e">3 watches → c = 1 + 40(3) = 121 vs c = 1</text>

      <rect x="12" y="118" width="180" height="34" rx="5" fill="#ffffff" stroke="#d8d2c5"/>
      <text x="102" y="139" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1e2422">Gram Trick: Q^T C^u Q = Q^T Q + Q^T(C^u−I)Q</text>
    </g>

    <rect x="14" y="224" width="204" height="32" rx="6" fill="#fdf6e9"/>
    <text x="116" y="244" text-anchor="middle" font-size="9.5" font-weight="700" fill="#8c5d16">Avoids O(M·N) scan via precomputed Q^T Q!</text>
  </g>

  <!-- Card 3: Bayesian Personalized Ranking (BPR) -->
  <g transform="translate(512, 16)">
    <rect width="232" height="268" rx="10" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.2"/>
    <text x="116" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#1e2422">3. Bayesian Personalized Ranking</text>
    <text x="116" y="40" text-anchor="middle" font-size="9.5" fill="#5a625e">Pairwise triplet (u, i+, j−) margin loss</text>

    <g transform="translate(14, 52)">
      <rect width="204" height="162" rx="8" fill="#fbfaf6" stroke="#d8d2c5"/>

      <rect x="12" y="14" width="84" height="44" rx="5" fill="#eef6f0" stroke="#165d4c"/>
      <text x="54" y="32" text-anchor="middle" font-size="9" font-weight="700" fill="#173d35">Clicked i+</text>
      <text x="54" y="47" text-anchor="middle" font-size="8.5" fill="#173d35">r̂_ui = +2.1</text>

      <rect x="108" y="14" width="84" height="44" rx="5" fill="#fbeee9" stroke="#9e2a2b"/>
      <text x="150" y="32" text-anchor="middle" font-size="9" font-weight="700" fill="#9e2a2b">Unseen j−</text>
      <text x="150" y="47" text-anchor="middle" font-size="8.5" fill="#9e2a2b">r̂_uj = +0.5</text>

      <rect x="12" y="68" width="180" height="42" rx="5" fill="#ffffff" stroke="#165d4c" stroke-width="1.2"/>
      <text x="102" y="85" text-anchor="middle" font-size="9" font-weight="700" fill="#173d35">P(i+ &gt;_u j−) = σ(r̂_ui − r̂_uj)</text>
      <text x="102" y="100" text-anchor="middle" font-size="8.5" fill="#5a625e">L_BPR = −log σ(r̂_ui − r̂_uj) + λ‖Θ‖²</text>

      <rect x="12" y="118" width="180" height="34" rx="5" fill="#eef6f0"/>
      <text x="102" y="139" text-anchor="middle" font-size="8.5" font-weight="700" fill="#173d35">Optimizes personalized AUC directly</text>
    </g>

    <rect x="14" y="224" width="204" height="32" rx="6" fill="#eef6f0"/>
    <text x="116" y="244" text-anchor="middle" font-size="9.5" font-weight="700" fill="#173d35">Pushes clicked i+ above sampled j−</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 308" width="860" height="308" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="860" height="308" rx="12" fill="#fbfaf6" stroke="#d8d2c5" stroke-width="1.5"/>

  <!-- Card 1: Low-Rank Matrix Factorization -->
  <g transform="translate(16, 16)">
    <rect width="264" height="276" rx="10" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.2"/>
    <text x="132" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#1e2422">1. Matrix Factorization (SVD / ALS)</text>
    <text x="132" y="40" text-anchor="middle" font-size="9.5" fill="#5a625e">Sparse R (M×N) ≈ P (M×d) · Q^T (d×N)</text>

    <g transform="translate(14, 52)">
      <rect width="236" height="166" rx="8" fill="#fbfaf6" stroke="#d8d2c5"/>
      <!-- R matrix -->
      <rect x="16" y="22" width="66" height="64" rx="4" fill="#fdf6e9" stroke="#8c5d16" stroke-width="1.2"/>
      <text x="49" y="44" text-anchor="middle" font-size="9" font-weight="700" fill="#8c5d16">R (M×N)</text>
      <text x="49" y="59" text-anchor="middle" font-size="7.8" fill="#5a625e">99% empty</text>
      <text x="49" y="74" text-anchor="middle" font-size="7.8" fill="#8c5d16">[5, ?, ?, 1]</text>

      <text x="94" y="56" text-anchor="middle" font-size="12" font-weight="700" fill="#1e2422">≈</text>

      <!-- P matrix -->
      <rect x="106" y="22" width="38" height="64" rx="4" fill="#eef6f0" stroke="#165d4c" stroke-width="1.2"/>
      <text x="125" y="50" text-anchor="middle" font-size="9" font-weight="700" fill="#173d35">P</text>
      <text x="125" y="65" text-anchor="middle" font-size="7.8" fill="#5a625e">M×d</text>

      <text x="153" y="56" text-anchor="middle" font-size="11" font-weight="700" fill="#1e2422">×</text>

      <!-- Q^T matrix -->
      <rect x="162" y="28" width="58" height="30" rx="4" fill="#eef6f0" stroke="#165d4c" stroke-width="1.2"/>
      <text x="191" y="46" text-anchor="middle" font-size="8.5" font-weight="700" fill="#173d35">Q^T (d×N)</text>

      <rect x="12" y="102" width="212" height="48" rx="5" fill="#ffffff" stroke="#d8d2c5"/>
      <text x="118" y="121" text-anchor="middle" font-size="9" font-weight="700" fill="#1e2422">Score: r̂_ui = p_u^T q_i</text>
      <text x="118" y="138" text-anchor="middle" font-size="8.2" fill="#5a625e">Alternating Least Squares fixes P, solves Q</text>
    </g>

    <rect x="14" y="228" width="236" height="32" rx="6" fill="#eef6f0"/>
    <text x="132" y="248" text-anchor="middle" font-size="9.5" font-weight="700" fill="#173d35">O(d) dot product per user-item pair</text>
  </g>

  <!-- Card 2: Implicit ALS (Hu, Koren, Volinsky) -->
  <g transform="translate(298, 16)">
    <rect width="264" height="276" rx="10" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.2"/>
    <text x="132" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#1e2422">2. Implicit ALS (iALS)</text>
    <text x="132" y="40" text-anchor="middle" font-size="9.5" fill="#5a625e">Confidence c_ui = 1 + α·r_ui over all pairs</text>

    <g transform="translate(14, 52)">
      <rect width="236" height="166" rx="8" fill="#fbfaf6" stroke="#d8d2c5"/>

      <rect x="12" y="14" width="212" height="44" rx="5" fill="#eef6f0" stroke="#165d4c"/>
      <text x="118" y="31" text-anchor="middle" font-size="8.8" font-weight="700" fill="#173d35">Preference p_ui = 1 if r_ui &gt; 0 else 0</text>
      <text x="118" y="47" text-anchor="middle" font-size="8.2" fill="#5a625e">Unobserved items are weak negatives (p = 0)</text>

      <rect x="12" y="68" width="212" height="44" rx="5" fill="#fdf6e9" stroke="#8c5d16"/>
      <text x="118" y="85" text-anchor="middle" font-size="8.8" font-weight="700" fill="#8c5d16">Confidence c_ui = 1 + α · r_ui</text>
      <text x="118" y="101" text-anchor="middle" font-size="8.2" fill="#5a625e">3 watches → c = 1 + 40(3) = 121 vs. c = 1</text>

      <rect x="12" y="122" width="212" height="32" rx="5" fill="#ffffff" stroke="#d8d2c5"/>
      <text x="118" y="142" text-anchor="middle" font-size="8.4" font-weight="700" fill="#1e2422">Gram Trick: Q^T C^u Q = Q^T Q + Q^T(C^u−I)Q</text>
    </g>

    <rect x="14" y="228" width="236" height="32" rx="6" fill="#fdf6e9"/>
    <text x="132" y="248" text-anchor="middle" font-size="9.5" font-weight="700" fill="#8c5d16">Avoids O(M·N) scan via precomputed Q^T Q</text>
  </g>

  <!-- Card 3: Bayesian Personalized Ranking (BPR) -->
  <g transform="translate(580, 16)">
    <rect width="264" height="276" rx="10" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.2"/>
    <text x="132" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#1e2422">3. Bayesian Personalized Ranking</text>
    <text x="132" y="40" text-anchor="middle" font-size="9.5" fill="#5a625e">Pairwise triplet (u, i+, j−) margin loss</text>

    <g transform="translate(14, 52)">
      <rect width="236" height="166" rx="8" fill="#fbfaf6" stroke="#d8d2c5"/>

      <rect x="12" y="14" width="101" height="44" rx="5" fill="#eef6f0" stroke="#165d4c"/>
      <text x="62.5" y="32" text-anchor="middle" font-size="8.8" font-weight="700" fill="#173d35">Clicked i+</text>
      <text x="62.5" y="47" text-anchor="middle" font-size="8.2" fill="#173d35">r̂_ui = +2.1</text>

      <rect x="123" y="14" width="101" height="44" rx="5" fill="#fbeee9" stroke="#9e2a2b"/>
      <text x="173.5" y="32" text-anchor="middle" font-size="8.8" font-weight="700" fill="#9e2a2b">Unseen j−</text>
      <text x="173.5" y="47" text-anchor="middle" font-size="8.2" fill="#9e2a2b">r̂_uj = +0.5</text>

      <rect x="12" y="68" width="212" height="44" rx="5" fill="#ffffff" stroke="#165d4c" stroke-width="1.2"/>
      <text x="118" y="85" text-anchor="middle" font-size="8.8" font-weight="700" fill="#173d35">P(i+ &gt;_u j−) = σ(r̂_ui − r̂_uj)</text>
      <text x="118" y="101" text-anchor="middle" font-size="8.2" fill="#5a625e">L_BPR = −log σ(r̂_ui − r̂_uj) + λ‖Θ‖²</text>

      <rect x="12" y="122" width="212" height="32" rx="5" fill="#eef6f0"/>
      <text x="118" y="142" text-anchor="middle" font-size="8.5" font-weight="700" fill="#173d35">Optimizes personalized AUC directly</text>
    </g>

    <rect x="14" y="228" width="236" height="32" rx="6" fill="#eef6f0"/>
    <text x="132" y="248" text-anchor="middle" font-size="9.5" font-weight="700" fill="#173d35">Pushes clicked i+ above sampled j−</text>
  </g>
</svg>

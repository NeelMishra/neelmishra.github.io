<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="'Inter', -apple-system, sans-serif">
  <rect width="760" height="300" rx="12" fill="#fbfaf6" stroke="#d8d2c5" stroke-width="1.5"/>

  <!-- Card 1: Feature Crossing (DeepFM / DCN-v2) -->
  <g transform="translate(16, 16)">
    <rect width="232" height="268" rx="10" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.2"/>
    <text x="116" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#1e2422">1. Feature Crossing (DeepFM)</text>
    <text x="116" y="40" text-anchor="middle" font-size="9.5" fill="#5a625e">O(F·d) 2nd-order FM + Deep MLP</text>

    <g transform="translate(14, 52)">
      <rect width="204" height="162" rx="8" fill="#fbfaf6" stroke="#d8d2c5"/>

      <rect x="12" y="14" width="84" height="44" rx="5" fill="#eef6f0" stroke="#165d4c"/>
      <text x="54" y="32" text-anchor="middle" font-size="9" font-weight="700" fill="#173d35">FM Layer</text>
      <text x="54" y="46" text-anchor="middle" font-size="8" fill="#5a625e">⟨v_i, v_j⟩x_i x_j</text>

      <rect x="108" y="14" width="84" height="44" rx="5" fill="#fdf6e9" stroke="#8c5d16"/>
      <text x="150" y="32" text-anchor="middle" font-size="9" font-weight="700" fill="#8c5d16">Deep MLP</text>
      <text x="150" y="46" text-anchor="middle" font-size="8" fill="#5a625e">High-order ReLU</text>

      <rect x="12" y="68" width="180" height="44" rx="5" fill="#ffffff" stroke="#165d4c"/>
      <text x="102" y="85" text-anchor="middle" font-size="8.5" font-weight="700" fill="#173d35">O(F·d) Linear-Time FM Identity</text>
      <text x="102" y="100" text-anchor="middle" font-size="8" fill="#5a625e">½ (‖Σ v_f x_f‖² − Σ ‖v_f x_f‖²)</text>

      <rect x="12" y="120" width="180" height="32" rx="5" fill="#eef6f0"/>
      <text x="102" y="140" text-anchor="middle" font-size="8.5" font-weight="700" fill="#173d35">Shared field embeddings v_f across both!</text>
    </g>

    <rect x="14" y="224" width="204" height="32" rx="6" fill="#eef6f0"/>
    <text x="116" y="244" text-anchor="middle" font-size="9.5" font-weight="700" fill="#173d35">Memorization + Generalization</text>
  </g>

  <!-- Card 2: Deep Interest Network (DIN) -->
  <g transform="translate(264, 16)">
    <rect width="232" height="268" rx="10" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.2"/>
    <text x="116" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#1e2422">2. Deep Interest Network (DIN)</text>
    <text x="116" y="40" text-anchor="middle" font-size="9.5" fill="#5a625e">Target-aware attention over user history</text>

    <g transform="translate(14, 52)">
      <rect width="204" height="162" rx="8" fill="#fbfaf6" stroke="#d8d2c5"/>

      <rect x="12" y="14" width="180" height="36" rx="5" fill="#fdf6e9" stroke="#8c5d16"/>
      <text x="102" y="30" text-anchor="middle" font-size="8.5" font-weight="700" fill="#8c5d16">Candidate Ad: "Mechanical Keyboard"</text>
      <text x="102" y="43" text-anchor="middle" font-size="7.5" fill="#5a625e">Acts as Attention Query q_ad</text>

      <!-- History items -->
      <rect x="12" y="58" width="56" height="44" rx="4" fill="#eef6f0" stroke="#165d4c" stroke-width="1.3"/>
      <text x="40" y="75" text-anchor="middle" font-size="8" font-weight="700" fill="#173d35">Keycaps</text>
      <text x="40" y="92" text-anchor="middle" font-size="8" font-weight="700" fill="#165d4c">w = 0.85</text>

      <rect x="74" y="58" width="56" height="44" rx="4" fill="#ffffff" stroke="#d8d2c5"/>
      <text x="102" y="75" text-anchor="middle" font-size="8" fill="#5a625e">Sneakers</text>
      <text x="102" y="92" text-anchor="middle" font-size="8" fill="#5a625e">w = 0.04</text>

      <rect x="136" y="58" width="56" height="44" rx="4" fill="#ffffff" stroke="#d8d2c5"/>
      <text x="164" y="75" text-anchor="middle" font-size="8" fill="#5a625e">Coffee</text>
      <text x="164" y="92" text-anchor="middle" font-size="8" fill="#5a625e">w = 0.02</text>

      <rect x="12" y="112" width="180" height="38" rx="5" fill="#eef6f0"/>
      <text x="102" y="128" text-anchor="middle" font-size="8.5" font-weight="700" fill="#173d35">u(q_ad) = Σ_t a(h_t, q_ad) · h_t</text>
      <text x="102" y="142" text-anchor="middle" font-size="7.5" fill="#5a625e">User vector adapts per candidate item!</text>
    </g>

    <rect x="14" y="224" width="204" height="32" rx="6" fill="#fdf6e9"/>
    <text x="116" y="244" text-anchor="middle" font-size="9.5" font-weight="700" fill="#8c5d16">Avoids static average-pooling bottleneck</text>
  </g>

  <!-- Card 3: Sequential Self-Attention (SASRec) -->
  <g transform="translate(512, 16)">
    <rect width="232" height="268" rx="10" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.2"/>
    <text x="116" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#1e2422">3. Sequential Rec (SASRec)</text>
    <text x="116" y="40" text-anchor="middle" font-size="9.5" fill="#5a625e">Causal Transformer next-item prediction</text>

    <g transform="translate(14, 52)">
      <rect width="204" height="162" rx="8" fill="#fbfaf6" stroke="#d8d2c5"/>

      <rect x="12" y="14" width="180" height="42" rx="5" fill="#eef6f0" stroke="#165d4c"/>
      <text x="102" y="31" text-anchor="middle" font-size="8.5" font-weight="700" fill="#173d35">[i₁: Phone] → [i₂: Case] → [i₃: Charger]</text>
      <text x="102" y="46" text-anchor="middle" font-size="8" fill="#5a625e">Order matters! Phone→Case ≠ Case→Phone</text>

      <rect x="12" y="66" width="180" height="42" rx="5" fill="#ffffff" stroke="#165d4c"/>
      <text x="102" y="83" text-anchor="middle" font-size="8.5" font-weight="700" fill="#173d35">Causal Mask (t cannot peek at &gt;t)</text>
      <text x="102" y="98" text-anchor="middle" font-size="8" fill="#5a625e">X_t = E(i_t) + P_t → Causal MHSA → FFN</text>

      <rect x="12" y="118" width="180" height="34" rx="5" fill="#fbeee9" stroke="#9e2a2b"/>
      <text x="102" y="139" text-anchor="middle" font-size="8.5" font-weight="700" fill="#9e2a2b">Predicts next item i_{t+1} at every step</text>
    </g>

    <rect x="14" y="224" width="204" height="32" rx="6" fill="#eef6f0"/>
    <text x="116" y="244" text-anchor="middle" font-size="9.5" font-weight="700" fill="#173d35">Captures temporal drift &amp; session intent</text>
  </g>
</svg>

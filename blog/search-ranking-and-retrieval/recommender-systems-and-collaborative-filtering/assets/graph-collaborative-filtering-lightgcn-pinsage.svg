<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="'Inter', -apple-system, sans-serif">
  <rect width="760" height="300" rx="12" fill="#fbfaf6" stroke="#d8d2c5" stroke-width="1.5"/>

  <!-- Card 1: Multi-Hop Bipartite Connectivity -->
  <g transform="translate(16, 16)">
    <rect width="232" height="268" rx="10" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.2"/>
    <text x="116" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#1e2422">1. Multi-Hop Collaborative Signal</text>
    <text x="116" y="40" text-anchor="middle" font-size="9.5" fill="#5a625e">MF only sees 1-hop; GNNs aggregate k-hops</text>

    <g transform="translate(14, 52)">
      <rect width="204" height="162" rx="8" fill="#fbfaf6" stroke="#d8d2c5"/>

      <!-- Hop 0: u1 -->
      <circle cx="32" cy="80" r="16" fill="#eef6f0" stroke="#165d4c" stroke-width="1.5"/>
      <text x="32" y="83" text-anchor="middle" font-size="9" font-weight="700" fill="#173d35">u₁</text>

      <!-- Hop 1: i1, i2 -->
      <line x1="48" y1="74" x2="80" y2="48" stroke="#165d4c" stroke-width="1.5"/>
      <line x1="48" y1="86" x2="80" y2="112" stroke="#165d4c" stroke-width="1.5"/>
      <rect x="80" y="34" width="28" height="24" rx="4" fill="#fdf6e9" stroke="#8c5d16" stroke-width="1.2"/>
      <text x="94" y="49" text-anchor="middle" font-size="8.5" font-weight="700" fill="#8c5d16">i₁</text>
      <rect x="80" y="102" width="28" height="24" rx="4" fill="#fdf6e9" stroke="#8c5d16" stroke-width="1.2"/>
      <text x="94" y="117" text-anchor="middle" font-size="8.5" font-weight="700" fill="#8c5d16">i₂</text>

      <!-- Hop 2: u2 -->
      <line x1="108" y1="48" x2="136" y2="74" stroke="#8c5d16" stroke-width="1.4" stroke-dasharray="3,2"/>
      <line x1="108" y1="112" x2="136" y2="86" stroke="#8c5d16" stroke-width="1.4" stroke-dasharray="3,2"/>
      <circle cx="148" cy="80" r="14" fill="#eef6f0" stroke="#165d4c" stroke-width="1.3"/>
      <text x="148" y="83" text-anchor="middle" font-size="8.5" font-weight="700" fill="#173d35">u₂</text>

      <!-- Hop 3: i3 -->
      <line x1="162" y1="80" x2="176" y2="80" stroke="#9e2a2b" stroke-width="1.5"/>
      <rect x="174" y="68" width="24" height="24" rx="4" fill="#fbeee9" stroke="#9e2a2b" stroke-width="1.3"/>
      <text x="186" y="83" text-anchor="middle" font-size="8.5" font-weight="700" fill="#9e2a2b">i₃</text>

      <text x="102" y="148" text-anchor="middle" font-size="8.5" fill="#5a625e">2-hop: co-interacted users u₂ → 3-hop: i₃</text>
    </g>

    <rect x="14" y="224" width="204" height="32" rx="6" fill="#eef6f0"/>
    <text x="116" y="244" text-anchor="middle" font-size="9.5" font-weight="700" fill="#173d35">Captures transitive user-item similarity</text>
  </g>

  <!-- Card 2: LightGCN Linear Propagation -->
  <g transform="translate(264, 16)">
    <rect width="232" height="268" rx="10" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.2"/>
    <text x="116" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#1e2422">2. LightGCN (He et al., 2020)</text>
    <text x="116" y="40" text-anchor="middle" font-size="9.5" fill="#5a625e">Drop W^(k) &amp; σ(·); keep symmetric norm</text>

    <g transform="translate(14, 52)">
      <rect width="204" height="162" rx="8" fill="#fbfaf6" stroke="#d8d2c5"/>

      <rect x="12" y="14" width="180" height="44" rx="5" fill="#eef6f0" stroke="#165d4c"/>
      <text x="102" y="31" text-anchor="middle" font-size="9" font-weight="700" fill="#173d35">e_u^(k+1) = Σ_{i∈N_u} e_i^(k) / √(|N_u||N_i|)</text>
      <text x="102" y="47" text-anchor="middle" font-size="8" fill="#5a625e">D^{-1/2} A D^{-1/2} dampens popular hubs!</text>

      <rect x="12" y="68" width="180" height="44" rx="5" fill="#fdf6e9" stroke="#8c5d16"/>
      <text x="102" y="85" text-anchor="middle" font-size="9" font-weight="700" fill="#8c5d16">Multi-Scale Layer Combination</text>
      <text x="102" y="101" text-anchor="middle" font-size="8.5" fill="#5a625e">e_u = α₀e_u^(0) + α₁e_u^(1) + ... + α_Ke_u^(K)</text>

      <rect x="12" y="120" width="180" height="32" rx="5" fill="#ffffff" stroke="#d8d2c5"/>
      <text x="102" y="140" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1e2422">Prevents over-smoothing at K=3 layers</text>
    </g>

    <rect x="14" y="224" width="204" height="32" rx="6" fill="#fdf6e9"/>
    <text x="116" y="244" text-anchor="middle" font-size="9.5" font-weight="700" fill="#8c5d16">Only 0-th layer ID embeddings are trained!</text>
  </g>

  <!-- Card 3: PinSage at Web Scale -->
  <g transform="translate(512, 16)">
    <rect width="232" height="268" rx="10" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.2"/>
    <text x="116" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#1e2422">3. PinSage (Web-Scale Inductive)</text>
    <text x="116" y="40" text-anchor="middle" font-size="9.5" fill="#5a625e">3B nodes, 18B edges at Pinterest</text>

    <g transform="translate(14, 52)">
      <rect width="204" height="162" rx="8" fill="#fbfaf6" stroke="#d8d2c5"/>

      <rect x="12" y="14" width="180" height="42" rx="5" fill="#eef6f0" stroke="#165d4c"/>
      <text x="102" y="31" text-anchor="middle" font-size="9" font-weight="700" fill="#173d35">Random-Walk Importance Neighborhoods</text>
      <text x="102" y="46" text-anchor="middle" font-size="8" fill="#5a625e">Top-T personalized PageRank visit counts</text>

      <rect x="12" y="66" width="180" height="42" rx="5" fill="#ffffff" stroke="#165d4c"/>
      <text x="102" y="83" text-anchor="middle" font-size="9" font-weight="700" fill="#173d35">Inductive Node Features (Visual + Text)</text>
      <text x="102" y="98" text-anchor="middle" font-size="8" fill="#5a625e">Embeds brand-new Pins without retraining</text>

      <rect x="12" y="118" width="180" height="34" rx="5" fill="#fbeee9" stroke="#9e2a2b"/>
      <text x="102" y="139" text-anchor="middle" font-size="8.5" font-weight="700" fill="#9e2a2b">Curriculum Hard Negatives (PageRank rank 2000–5000)</text>
    </g>

    <rect x="14" y="224" width="204" height="32" rx="6" fill="#eef6f0"/>
    <text x="116" y="244" text-anchor="middle" font-size="9.5" font-weight="700" fill="#173d35">MapReduce inference avoids hub explosion</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 310" width="820" height="310">
  <rect width="820" height="310" fill="#ffffff" rx="12" />
  <style>
    .title { font-family: 'Manrope', 'Inter', -apple-system, sans-serif; font-size: 15px; font-weight: 800; fill: #13201a; }
    .sub { font-family: 'Manrope', 'Inter', -apple-system, sans-serif; font-size: 10.8px; font-weight: 500; fill: #4a5a53; }
    .mono { font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 9.5px; fill: #1e293b; }
    .mono-bold { font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 11px; font-weight: 700; }
    .card { rx: 10; ry: 10; stroke-width: 1.5; }
  </style>

  <text x="410" y="28" text-anchor="middle" class="title">Item Cold-Start: Content Representation, Fresh Traffic Pools &amp; Virality Cascades</text>

  <!-- Card 1: Content-to-Behavior Alignment -->
  <g transform="translate(18, 46)">
    <rect width="250" height="244" class="card" fill="#f8fafc" stroke="#cbd5e1" />
    <rect width="250" height="34" rx="10" ry="10" fill="#e2e8f0" />
    <text x="125" y="22" text-anchor="middle" class="mono-bold" fill="#0f172a">1. Cold Item Representation</text>

    <text x="14" y="54" class="sub">Extract item attributes &amp; map into</text>
    <text x="14" y="69" class="sub">shared retrieval space at n_i = 0:</text>

    <rect x="14" y="82" width="222" height="42" rx="6" fill="#eff6ff" stroke="#3b82f6" />
    <text x="125" y="100" text-anchor="middle" class="mono-bold" fill="#1d4ed8">Content &amp; Metadata Signals</text>
    <text x="125" y="116" text-anchor="middle" class="mono">Title + Category + Visual/Audio</text>

    <rect x="14" y="134" width="222" height="48" rx="6" fill="#ffffff" stroke="#64748b" />
    <text x="125" y="153" text-anchor="middle" class="mono-bold" fill="#0f172a">Behavioral Space Alignment</text>
    <text x="125" y="171" text-anchor="middle" class="mono">Bridges semantic vs co-click gap</text>

    <text x="125" y="206" text-anchor="middle" class="sub" fill="#334155">Gives new uploads a meaningful</text>
    <text x="125" y="222" text-anchor="middle" class="sub" fill="#334155">starting vector before first click!</text>
  </g>

  <!-- Card 2: Guaranteed Fresh Traffic & Seed Matching -->
  <g transform="translate(285, 46)">
    <rect width="250" height="244" class="card" fill="#eff6ff" stroke="#93c5fd" />
    <rect width="250" height="34" rx="10" ry="10" fill="#dbeafe" />
    <text x="125" y="22" text-anchor="middle" class="mono-bold" fill="#1e3a8a">2. Fresh Pool &amp; Seed Matching</text>

    <text x="14" y="54" class="sub">Break Matthew effect via reserved</text>
    <text x="14" y="69" class="sub">exploration slots + reverse search:</text>

    <rect x="14" y="82" width="222" height="42" rx="6" fill="#ffffff" stroke="#3b82f6" />
    <text x="125" y="100" text-anchor="middle" class="mono-bold" fill="#1e3a8a">Reserved Traffic Quota (10%)</text>
    <text x="125" y="116" text-anchor="middle" class="mono">90% Main Index | 10% Fresh Pool</text>

    <rect x="14" y="134" width="222" height="48" rx="6" fill="#fef3c7" stroke="#f59e0b" />
    <text x="125" y="153" text-anchor="middle" class="mono-bold" fill="#b45309">Item-to-User Reverse Query</text>
    <text x="125" y="171" text-anchor="middle" class="mono">Top-M seed users: argmax_u ⟨u, z_i^0⟩</text>

    <text x="125" y="206" text-anchor="middle" class="sub" fill="#1e40af">Tests new item on receptive niche</text>
    <text x="125" y="222" text-anchor="middle" class="sub" fill="#1e40af">before broad feed exposure!</text>
  </g>

  <!-- Card 3: Virality Graduation Cascade -->
  <g transform="translate(552, 46)">
    <rect width="250" height="244" class="card" fill="#f0fdf4" stroke="#86efac" />
    <rect width="250" height="34" rx="10" ry="10" fill="#dcfce7" />
    <text x="125" y="22" text-anchor="middle" class="mono-bold" fill="#14532d">3. Virality Graduation Cascade</text>

    <text x="14" y="54" class="sub">Promote items across exposure tiers</text>
    <text x="14" y="69" class="sub">if Beta LCB exceeds tier threshold:</text>

    <rect x="14" y="82" width="222" height="34" rx="5" fill="#ffffff" stroke="#94a3b8" />
    <text x="125" y="103" text-anchor="middle" class="mono">Tier 1: 200 views (Seed Test)</text>

    <rect x="14" y="122" width="222" height="34" rx="5" fill="#dcfce7" stroke="#22c55e" />
    <text x="125" y="143" text-anchor="middle" class="mono">Tier 2: 2,000 views (LCB ≥ θ_1)</text>

    <rect x="14" y="162" width="222" height="34" rx="5" fill="#bbf7d0" stroke="#16a34a" />
    <text x="125" y="183" text-anchor="middle" class="mono-bold" fill="#14532d">Tier 3: 50,000+ Viral Pool</text>

    <text x="125" y="220" text-anchor="middle" class="sub" fill="#14532d">Fast graduation + age decay e^{-λΔt}</text>
  </g>
</svg>

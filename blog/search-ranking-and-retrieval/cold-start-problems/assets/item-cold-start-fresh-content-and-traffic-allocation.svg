<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 316" width="860" height="316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="860" height="316" rx="12" fill="#fbfaf6" stroke="#d8d2c5" stroke-width="1.5"/>

  <!-- Card 1: Content-to-Behavior Alignment -->
  <g transform="translate(16, 16)">
    <rect width="264" height="284" rx="10" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.2"/>
    <text x="132" y="24" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e2422">1. Cold Item Representation</text>
    <text x="132" y="41" text-anchor="middle" font-size="9.5" fill="#5a625e">Map attributes into behavioral space at n_i = 0</text>

    <g transform="translate(14, 54)">
      <rect width="236" height="174" rx="8" fill="#fbfaf6" stroke="#d8d2c5"/>

      <rect x="12" y="14" width="212" height="44" rx="5" fill="#eef6f0" stroke="#165d4c"/>
      <text x="118" y="31" text-anchor="middle" font-size="9" font-weight="700" fill="#173d35">Content &amp; Metadata Signals</text>
      <text x="118" y="47" text-anchor="middle" font-size="8.2" fill="#5a625e">Title, Category, Creator &amp; Visual/Audio</text>

      <rect x="12" y="68" width="212" height="46" rx="5" fill="#fdf6e9" stroke="#8c5d16"/>
      <text x="118" y="86" text-anchor="middle" font-size="9" font-weight="700" fill="#8c5d16">Behavioral Space Alignment</text>
      <text x="118" y="102" text-anchor="middle" font-size="8.2" fill="#5a625e">Bridges semantic vs. co-click gap</text>

      <rect x="12" y="124" width="212" height="36" rx="5" fill="#ffffff" stroke="#d8d2c5"/>
      <text x="118" y="146" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1e2422">Ready for retrieval before first click</text>
    </g>

    <rect x="14" y="238" width="236" height="32" rx="6" fill="#eef6f0"/>
    <text x="132" y="258" text-anchor="middle" font-size="9.5" font-weight="700" fill="#173d35">Gives new uploads a starting vector z_i⁰</text>
  </g>

  <!-- Card 2: Guaranteed Fresh Traffic & Seed Matching -->
  <g transform="translate(298, 16)">
    <rect width="264" height="284" rx="10" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.2"/>
    <text x="132" y="24" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e2422">2. Fresh Pool &amp; Seed Matching</text>
    <text x="132" y="41" text-anchor="middle" font-size="9.5" fill="#5a625e">Break Matthew effect via reserved quota</text>

    <g transform="translate(14, 54)">
      <rect width="236" height="174" rx="8" fill="#fbfaf6" stroke="#d8d2c5"/>

      <rect x="12" y="14" width="212" height="44" rx="5" fill="#eef6f0" stroke="#165d4c"/>
      <text x="118" y="31" text-anchor="middle" font-size="9" font-weight="700" fill="#173d35">Reserved Traffic Quota (10%)</text>
      <text x="118" y="47" text-anchor="middle" font-size="8.2" fill="#5a625e">90% Main Index  |  10% Fresh Pool</text>

      <rect x="12" y="68" width="212" height="46" rx="5" fill="#fdf6e9" stroke="#8c5d16"/>
      <text x="118" y="86" text-anchor="middle" font-size="9" font-weight="700" fill="#8c5d16">Item-to-User Reverse Query</text>
      <text x="118" y="102" text-anchor="middle" font-size="8.2" fill="#5a625e">Top-M seed users: argmax_u ⟨u, z_i⁰⟩</text>

      <rect x="12" y="124" width="212" height="36" rx="5" fill="#ffffff" stroke="#d8d2c5"/>
      <text x="118" y="146" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1e2422">Matches item to receptive initial niche</text>
    </g>

    <rect x="14" y="238" width="236" height="32" rx="6" fill="#fdf6e9"/>
    <text x="132" y="258" text-anchor="middle" font-size="9.5" font-weight="700" fill="#8c5d16">Avoids wasting cold views on random users</text>
  </g>

  <!-- Card 3: Virality Graduation Cascade -->
  <g transform="translate(580, 16)">
    <rect width="264" height="284" rx="10" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.2"/>
    <text x="132" y="24" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e2422">3. Virality Graduation Cascade</text>
    <text x="132" y="41" text-anchor="middle" font-size="9.5" fill="#5a625e">Promote items when Beta LCB exceeds threshold</text>

    <g transform="translate(14, 54)">
      <rect width="236" height="174" rx="8" fill="#fbfaf6" stroke="#d8d2c5"/>

      <rect x="12" y="14" width="212" height="44" rx="5" fill="#ffffff" stroke="#d8d2c5"/>
      <text x="118" y="31" text-anchor="middle" font-size="9" font-weight="700" fill="#1e2422">Tier 1: 200 Views (Seed Test)</text>
      <text x="118" y="47" text-anchor="middle" font-size="8.2" fill="#5a625e">Initial niche validation cohort</text>

      <rect x="12" y="66" width="212" height="44" rx="5" fill="#fdf6e9" stroke="#8c5d16"/>
      <text x="118" y="83" text-anchor="middle" font-size="9" font-weight="700" fill="#8c5d16">Tier 2: 2,000 Views (LCB ≥ θ₁)</text>
      <text x="118" y="99" text-anchor="middle" font-size="8.2" fill="#5a625e">Broader cluster expansion</text>

      <rect x="12" y="118" width="212" height="44" rx="5" fill="#eef6f0" stroke="#165d4c"/>
      <text x="118" y="135" text-anchor="middle" font-size="9" font-weight="700" fill="#173d35">Tier 3: 50,000+ Viral Pool</text>
      <text x="118" y="151" text-anchor="middle" font-size="8.2" fill="#5a625e">Main feed graduation + age decay e^(−λΔt)</text>
    </g>

    <rect x="14" y="238" width="236" height="32" rx="6" fill="#eef6f0"/>
    <text x="132" y="258" text-anchor="middle" font-size="9.5" font-weight="700" fill="#173d35">Confidence-bounded multi-tier promotion</text>
  </g>
</svg>

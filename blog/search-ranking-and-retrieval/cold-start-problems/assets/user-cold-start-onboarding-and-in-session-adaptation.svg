<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 316" width="860" height="316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="860" height="316" rx="12" fill="#fbfaf6" stroke="#d8d2c5" stroke-width="1.5"/>

  <!-- Card 1: Pre-Click Context Priors (t = 0) -->
  <g transform="translate(16, 16)">
    <rect width="264" height="284" rx="10" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.2"/>
    <text x="132" y="24" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e2422">1. Pre-Click Context Prior (t = 0)</text>
    <text x="132" y="41" text-anchor="middle" font-size="9.5" fill="#5a625e">Hierarchical Empirical Bayes shrinkage</text>

    <g transform="translate(14, 54)">
      <rect width="236" height="174" rx="8" fill="#fbfaf6" stroke="#d8d2c5"/>

      <rect x="12" y="14" width="212" height="44" rx="5" fill="#eef6f0" stroke="#165d4c"/>
      <text x="118" y="31" text-anchor="middle" font-size="9" font-weight="700" fill="#173d35">Coarse-to-Fine Segment Hierarchy</text>
      <text x="118" y="47" text-anchor="middle" font-size="8.2" fill="#5a625e">Global → Country → Device/OS → Referral</text>

      <rect x="12" y="68" width="212" height="46" rx="5" fill="#fdf6e9" stroke="#8c5d16"/>
      <text x="118" y="86" text-anchor="middle" font-size="9" font-weight="700" fill="#8c5d16">Smoothed Cohort Embedding</text>
      <text x="118" y="102" text-anchor="middle" font-size="8.2" fill="#5a625e">û_prior(c) = (n_c·ū_c + m·û_pa) / (n_c + m)</text>

      <rect x="12" y="124" width="212" height="36" rx="5" fill="#ffffff" stroke="#d8d2c5"/>
      <text x="118" y="146" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1e2422">Optional Onboarding: ≤ 3 Topic Picks</text>
    </g>

    <rect x="14" y="238" width="236" height="32" rx="6" fill="#eef6f0"/>
    <text x="132" y="258" text-anchor="middle" font-size="9.5" font-weight="700" fill="#173d35">Shrinks noisy leaf segments toward parent</text>
  </g>

  <!-- Card 2: Real-Time In-Session Adaptation -->
  <g transform="translate(298, 16)">
    <rect width="264" height="284" rx="10" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.2"/>
    <text x="132" y="24" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e2422">2. In-Session Adaptation (t = 1..k)</text>
    <text x="132" y="41" text-anchor="middle" font-size="9.5" fill="#5a625e">Sub-second streaming update per interaction</text>

    <g transform="translate(14, 54)">
      <rect width="236" height="174" rx="8" fill="#fbfaf6" stroke="#d8d2c5"/>

      <rect x="12" y="14" width="101" height="44" rx="5" fill="#eef6f0" stroke="#165d4c"/>
      <text x="62.5" y="31" text-anchor="middle" font-size="8.8" font-weight="700" fill="#173d35">Positive Dwell</text>
      <text x="62.5" y="47" text-anchor="middle" font-size="8.2" fill="#5a625e">+w_j⁺ · v_pos</text>

      <rect x="123" y="14" width="101" height="44" rx="5" fill="#fbeee9" stroke="#9e2a2b"/>
      <text x="173.5" y="31" text-anchor="middle" font-size="8.8" font-weight="700" fill="#9e2a2b">Fast Skip (&lt;1.5s)</text>
      <text x="173.5" y="47" text-anchor="middle" font-size="8.2" fill="#5a625e">−γ · w_k⁻ · v_neg</text>

      <rect x="12" y="68" width="212" height="46" rx="5" fill="#fdf6e9" stroke="#8c5d16"/>
      <text x="118" y="86" text-anchor="middle" font-size="9" font-weight="700" fill="#8c5d16">Streaming Session Vector</text>
      <text x="118" y="102" text-anchor="middle" font-size="8.2" fill="#5a625e">u_t = Norm(û_prior + Σ w⁺v⁺ − γ Σ w⁻v⁻)</text>

      <rect x="12" y="124" width="212" height="36" rx="5" fill="#ffffff" stroke="#d8d2c5"/>
      <text x="118" y="146" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1e2422">Converges to niche in 3–5 interactions</text>
    </g>

    <rect x="14" y="238" width="236" height="32" rx="6" fill="#fdf6e9"/>
    <text x="132" y="258" text-anchor="middle" font-size="9.5" font-weight="700" fill="#8c5d16">No offline batch retraining wait required</text>
  </g>

  <!-- Card 3: Identity Stitching & Long-Term Hand-Off -->
  <g transform="translate(580, 16)">
    <rect width="264" height="284" rx="10" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.2"/>
    <text x="132" y="24" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e2422">3. Identity Stitching &amp; Hand-Off</text>
    <text x="132" y="41" text-anchor="middle" font-size="9.5" fill="#5a625e">Merge guest session with long-term profile</text>

    <g transform="translate(14, 54)">
      <rect width="236" height="174" rx="8" fill="#fbfaf6" stroke="#d8d2c5"/>

      <rect x="12" y="14" width="212" height="44" rx="5" fill="#eef6f0" stroke="#165d4c"/>
      <text x="118" y="31" text-anchor="middle" font-size="9" font-weight="700" fill="#173d35">Precision-Weighted Guest Fusion</text>
      <text x="118" y="47" text-anchor="middle" font-size="8.2" fill="#5a625e">u_stitch = (n_a·u_acct + κ·n_s·u_sess) / (n_a + κ·n_s)</text>

      <rect x="12" y="68" width="212" height="46" rx="5" fill="#fdf6e9" stroke="#8c5d16"/>
      <text x="118" y="86" text-anchor="middle" font-size="9" font-weight="700" fill="#8c5d16">Frequency Gate α(n_u) = n_u / (n_u + τ_u)</text>
      <text x="118" y="102" text-anchor="middle" font-size="8.2" fill="#5a625e">u_final = α(n_u)·e_u^long + (1 − α(n_u))·u_t</text>

      <rect x="12" y="124" width="212" height="36" rx="5" fill="#ffffff" stroke="#d8d2c5"/>
      <text x="118" y="146" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1e2422">Preserves live intent + historical taste</text>
    </g>

    <rect x="14" y="238" width="236" height="32" rx="6" fill="#eef6f0"/>
    <text x="132" y="258" text-anchor="middle" font-size="9.5" font-weight="700" fill="#173d35">Smooth graduation from cold to warm user</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 310" width="820" height="310">
  <rect width="820" height="310" fill="#ffffff" rx="12" />
  <style>
    .title { font-family: 'Manrope', 'Inter', -apple-system, sans-serif; font-size: 15px; font-weight: 800; fill: #13201a; }
    .sub { font-family: 'Manrope', 'Inter', -apple-system, sans-serif; font-size: 10.8px; font-weight: 500; fill: #4a5a53; }
    .mono { font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 9.5px; fill: #1e293b; }
    .mono-bold { font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 11px; font-weight: 700; }
    .card { rx: 10; ry: 10; stroke-width: 1.5; }
  </style>

  <text x="410" y="28" text-anchor="middle" class="title">User Cold-Start Pipeline: Context Priors, Active Onboarding &amp; Real-Time Session Adaptation</text>

  <!-- Card 1: Pre-Click Context Priors -->
  <g transform="translate(18, 46)">
    <rect width="250" height="244" class="card" fill="#f8fafc" stroke="#cbd5e1" />
    <rect width="250" height="34" rx="10" ry="10" fill="#e2e8f0" />
    <text x="125" y="22" text-anchor="middle" class="mono-bold" fill="#0f172a">1. Pre-Click Context Prior (t=0)</text>

    <text x="14" y="54" class="sub">Hierarchical Empirical Bayes shrinkage</text>
    <text x="14" y="69" class="sub">over Geo, Device, OS &amp; Referral:</text>

    <rect x="14" y="82" width="222" height="42" rx="6" fill="#eff6ff" stroke="#3b82f6" />
    <text x="125" y="100" text-anchor="middle" class="mono-bold" fill="#1d4ed8">Segment Tree Hierarchy</text>
    <text x="125" y="116" text-anchor="middle" class="mono">Global → IN → iOS → GitHub Ref</text>

    <rect x="14" y="134" width="222" height="48" rx="6" fill="#ffffff" stroke="#64748b" />
    <text x="125" y="153" text-anchor="middle" class="mono-bold" fill="#0f172a">Smoothed Context Embedding</text>
    <text x="125" y="171" text-anchor="middle" class="mono">u_0 = (n_c·μ_c + m·μ_parent)/(n_c+m)</text>

    <text x="125" y="206" text-anchor="middle" class="sub" fill="#334155">Optional Active Onboarding Tree:</text>
    <text x="125" y="224" text-anchor="middle" class="mono" fill="#0a8f6a">max I(u; y_anchor) in ≤ 3 picks</text>
  </g>

  <!-- Card 2: Real-Time In-Session Encoder -->
  <g transform="translate(285, 46)">
    <rect width="250" height="244" class="card" fill="#eff6ff" stroke="#93c5fd" />
    <rect width="250" height="34" rx="10" ry="10" fill="#dbeafe" />
    <text x="125" y="22" text-anchor="middle" class="mono-bold" fill="#1e3a8a">2. In-Session Adaptation (t=1..k)</text>

    <text x="14" y="54" class="sub">Sub-second streaming update after</text>
    <text x="14" y="69" class="sub">every click, dwell, or skip event:</text>

    <rect x="14" y="82" width="106" height="44" rx="6" fill="#dcfce7" stroke="#16a34a" />
    <text x="67" y="101" text-anchor="middle" class="mono-bold" fill="#14532d">Positive Dwell</text>
    <text x="67" y="117" text-anchor="middle" class="mono">+w_j^+ · v_pos</text>

    <rect x="130" y="82" width="106" height="44" rx="6" fill="#fee2e2" stroke="#ef4444" />
    <text x="183" y="101" text-anchor="middle" class="mono-bold" fill="#b91c1c">Fast Skip (&lt;2s)</text>
    <text x="183" y="117" text-anchor="middle" class="mono">-γ·w_k^- · v_neg</text>

    <rect x="14" y="138" width="222" height="50" rx="6" fill="#ffffff" stroke="#3b82f6" />
    <text x="125" y="157" text-anchor="middle" class="mono-bold" fill="#1e3a8a">Dual-Speed Session Vector</text>
    <text x="125" y="175" text-anchor="middle" class="mono">u_t = LN(u_0 + Σ w^+ v^+ - γ Σ w^- v^-)</text>

    <text x="125" y="214" text-anchor="middle" class="sub" fill="#1e40af">No nightly batch wait required!</text>
  </g>

  <!-- Card 3: Identity Stitching & Warm Graduation -->
  <g transform="translate(552, 46)">
    <rect width="250" height="244" class="card" fill="#f0fdf4" stroke="#86efac" />
    <rect width="250" height="34" rx="10" ry="10" fill="#dcfce7" />
    <text x="125" y="22" text-anchor="middle" class="mono-bold" fill="#14532d">3. Identity Stitching &amp; Hand-Off</text>

    <text x="14" y="54" class="sub">Merge anonymous session state with</text>
    <text x="14" y="69" class="sub">account ID via precision weighting:</text>

    <rect x="14" y="82" width="222" height="42" rx="6" fill="#ffffff" stroke="#86efac" />
    <text x="125" y="100" text-anchor="middle" class="mono-bold" fill="#14532d">Precision-Weighted Fusion</text>
    <text x="125" y="116" text-anchor="middle" class="mono">u* = (Λ_0 u_acct + Λ_s u_sess)/(Λ_0+Λ_s)</text>

    <rect x="14" y="134" width="222" height="48" rx="6" fill="#fef3c7" stroke="#f59e0b" />
    <text x="125" y="153" text-anchor="middle" class="mono-bold" fill="#b45309">Frequency Gate α(n_u)</text>
    <text x="125" y="171" text-anchor="middle" class="mono">α(n_u) = n_u / (n_u + τ_user)</text>

    <text x="125" y="206" text-anchor="middle" class="sub" fill="#14532d">Smoothly hands off from session</text>
    <text x="125" y="222" text-anchor="middle" class="sub" fill="#14532d">sequence to learned user ID!</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 316" width="860" height="316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="860" height="316" rx="12" fill="#fbfaf6" stroke="#d8d2c5" stroke-width="1.5"/>

  <!-- Card 1: Day-0 Zero-Interaction Stack -->
  <g transform="translate(16, 16)">
    <rect width="264" height="284" rx="10" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.2"/>
    <text x="132" y="24" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e2422">1. Day-0 Zero-Interaction Stack</text>
    <text x="132" y="41" text-anchor="middle" font-size="9.5" fill="#5a625e">Rank items with R = ∅ via calibrated priors</text>

    <g transform="translate(14, 54)">
      <rect width="236" height="174" rx="8" fill="#fbfaf6" stroke="#d8d2c5"/>

      <rect x="12" y="14" width="212" height="44" rx="5" fill="#eef6f0" stroke="#165d4c"/>
      <text x="118" y="31" text-anchor="middle" font-size="9" font-weight="700" fill="#173d35">Hybrid Zero-Shot Prior S₀(q, d)</text>
      <text x="118" y="47" text-anchor="middle" font-size="8.2" fill="#5a625e">Lexical BM25 + Semantic Sim + Quality Q(d)</text>

      <rect x="12" y="68" width="212" height="46" rx="5" fill="#fdf6e9" stroke="#8c5d16"/>
      <text x="118" y="86" text-anchor="middle" font-size="9" font-weight="700" fill="#8c5d16">Wilson Lower Bound (WLB)</text>
      <text x="118" y="102" text-anchor="middle" font-size="8.2" fill="#5a625e">Penalizes small-n luck (2/2 vs. 95/100)</text>

      <rect x="12" y="124" width="212" height="36" rx="5" fill="#ffffff" stroke="#d8d2c5"/>
      <text x="118" y="146" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1e2422">Synthetic (q, d⁺, d⁻) relevance labels</text>
    </g>

    <rect x="14" y="238" width="236" height="32" rx="6" fill="#eef6f0"/>
    <text x="132" y="258" text-anchor="middle" font-size="9.5" font-weight="700" fill="#173d35">Strong Day-0 quality before first click</text>
  </g>

  <!-- Card 2: Cross-Domain & External Signals -->
  <g transform="translate(298, 16)">
    <rect width="264" height="284" rx="10" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.2"/>
    <text x="132" y="24" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e2422">2. Cross-Domain Signal Transfer</text>
    <text x="132" y="41" text-anchor="middle" font-size="9.5" fill="#5a625e">Transfer structure from mature domain D_S</text>

    <g transform="translate(14, 54)">
      <rect width="236" height="174" rx="8" fill="#fbfaf6" stroke="#d8d2c5"/>

      <rect x="12" y="14" width="212" height="44" rx="5" fill="#eef6f0" stroke="#165d4c"/>
      <text x="118" y="31" text-anchor="middle" font-size="9" font-weight="700" fill="#173d35">Overlapping User / Item Bridges</text>
      <text x="118" y="47" text-anchor="middle" font-size="8.2" fill="#5a625e">Map known source preferences into D_T</text>

      <rect x="12" y="68" width="212" height="46" rx="5" fill="#fdf6e9" stroke="#8c5d16"/>
      <text x="118" y="86" text-anchor="middle" font-size="9" font-weight="700" fill="#8c5d16">Shared Taxonomy &amp; Market Priors</text>
      <text x="118" y="102" text-anchor="middle" font-size="8.2" fill="#5a625e">Category-level CTR &amp; brand affinity priors</text>

      <rect x="12" y="124" width="212" height="36" rx="5" fill="#ffffff" stroke="#d8d2c5"/>
      <text x="118" y="146" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1e2422">Warm-starts new region or vertical</text>
    </g>

    <rect x="14" y="238" width="236" height="32" rx="6" fill="#fdf6e9"/>
    <text x="132" y="258" text-anchor="middle" font-size="9.5" font-weight="700" fill="#8c5d16">Avoids starting from zero in new markets</text>
  </g>

  <!-- Card 3: Propensity-Logged Safe Policy Iteration -->
  <g transform="translate(580, 16)">
    <rect width="264" height="284" rx="10" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.2"/>
    <text x="132" y="24" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e2422">3. Propensity-Logged Bootstrap</text>
    <text x="132" y="41" text-anchor="middle" font-size="9.5" fill="#5a625e">Stochastic logging for unbiased LTR</text>

    <g transform="translate(14, 54)">
      <rect width="236" height="174" rx="8" fill="#fbfaf6" stroke="#d8d2c5"/>

      <rect x="12" y="14" width="212" height="44" rx="5" fill="#eef6f0" stroke="#165d4c"/>
      <text x="118" y="31" text-anchor="middle" font-size="9" font-weight="700" fill="#173d35">Plackett–Luce Top-K Sampling</text>
      <text x="118" y="47" text-anchor="middle" font-size="8.2" fill="#5a625e">π₀(d | q) = exp(S₀ / τ) / Σ exp(S₀ / τ)</text>

      <rect x="12" y="68" width="212" height="46" rx="5" fill="#fbeee9" stroke="#9e2a2b"/>
      <text x="118" y="86" text-anchor="middle" font-size="9" font-weight="700" fill="#9e2a2b">Day-7 Counterfactual LTR (IPS)</text>
      <text x="118" y="102" text-anchor="middle" font-size="8.2" fill="#5a625e">Weights clicks by 1 / π₀(d | q)</text>

      <rect x="12" y="124" width="212" height="36" rx="5" fill="#ffffff" stroke="#d8d2c5"/>
      <text x="118" y="146" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1e2422">Prevents deterministic Day-0 blind spots</text>
    </g>

    <rect x="14" y="238" width="236" height="32" rx="6" fill="#eef6f0"/>
    <text x="132" y="258" text-anchor="middle" font-size="9.5" font-weight="700" fill="#173d35">Unbiased training logs for first learned model</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 310" width="820" height="310">
  <rect width="820" height="310" fill="#ffffff" rx="12" />
  <style>
    .title { font-family: 'Manrope', 'Inter', -apple-system, sans-serif; font-size: 15px; font-weight: 800; fill: #13201a; }
    .sub { font-family: 'Manrope', 'Inter', -apple-system, sans-serif; font-size: 10.8px; font-weight: 500; fill: #4a5a53; }
    .mono { font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 9.5px; fill: #1e293b; }
    .mono-bold { font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 11px; font-weight: 700; }
    .card { rx: 10; ry: 10; stroke-width: 1.5; }
  </style>

  <text x="410" y="28" text-anchor="middle" class="title">System Cold-Start: Day-0 Priors, Cross-Domain Transfer &amp; Propensity-Logged Bootstrapping</text>

  <!-- Card 1: Day-0 Zero-Interaction Stack -->
  <g transform="translate(18, 46)">
    <rect width="250" height="244" class="card" fill="#f8fafc" stroke="#cbd5e1" />
    <rect width="250" height="34" rx="10" ry="10" fill="#e2e8f0" />
    <text x="125" y="22" text-anchor="middle" class="mono-bold" fill="#0f172a">1. Day-0 Zero-Interaction Stack</text>

    <text x="14" y="54" class="sub">Rank items with R = ∅ using lexical,</text>
    <text x="14" y="69" class="sub">dense zero-shot &amp; Wilson bounds:</text>

    <rect x="14" y="82" width="222" height="42" rx="6" fill="#eff6ff" stroke="#3b82f6" />
    <text x="125" y="100" text-anchor="middle" class="mono-bold" fill="#1d4ed8">Hybrid Zero-Shot Prior</text>
    <text x="125" y="116" text-anchor="middle" class="mono">S_0 = α·BM25 + β·Cos(E_Q, E_D) + γ·Q_i</text>

    <rect x="14" y="134" width="222" height="48" rx="6" fill="#ffffff" stroke="#64748b" />
    <text x="125" y="153" text-anchor="middle" class="mono-bold" fill="#0f172a">Wilson Lower Bound (WLB)</text>
    <text x="125" y="171" text-anchor="middle" class="mono">Penalizes small-n luck (2/2 vs 95/100)</text>

    <text x="125" y="206" text-anchor="middle" class="sub" fill="#334155">LLM Judge Synthetic Distillation</text>
    <text x="125" y="222" text-anchor="middle" class="mono" fill="#0a8f6a">Generates 50k (q, d+, d-) triples</text>
  </g>

  <!-- Card 2: Cross-Domain & Cross-Market Transfer -->
  <g transform="translate(285, 46)">
    <rect width="250" height="244" class="card" fill="#eff6ff" stroke="#93c5fd" />
    <rect width="250" height="34" rx="10" ry="10" fill="#dbeafe" />
    <text x="125" y="22" text-anchor="middle" class="mono-bold" fill="#1e3a8a">2. Cross-Domain Transfer (CDRec)</text>

    <text x="14" y="54" class="sub">Transfer structure from mature</text>
    <text x="14" y="69" class="sub">source market D_S to cold target D_T:</text>

    <rect x="14" y="82" width="222" height="42" rx="6" fill="#ffffff" stroke="#3b82f6" />
    <text x="125" y="100" text-anchor="middle" class="mono-bold" fill="#1e3a8a">EMCDR / PTUPCDR Bridge</text>
    <text x="125" y="116" text-anchor="middle" class="mono">u_T = f_bridge(u_S; W_meta)</text>

    <rect x="14" y="134" width="222" height="48" rx="6" fill="#fef3c7" stroke="#f59e0b" />
    <text x="125" y="153" text-anchor="middle" class="mono-bold" fill="#b45309">Domain-Invariant Alignment</text>
    <text x="125" y="171" text-anchor="middle" class="mono">min L_rec + λ_MMD · MMD(Z_S, Z_T)</text>

    <text x="125" y="206" text-anchor="middle" class="sub" fill="#1e40af">Bootstraps new country/vertical</text>
    <text x="125" y="222" text-anchor="middle" class="sub" fill="#1e40af">using shared global representations!</text>
  </g>

  <!-- Card 3: Propensity-Logged Safe Policy Iteration -->
  <g transform="translate(552, 46)">
    <rect width="250" height="244" class="card" fill="#f0fdf4" stroke="#86efac" />
    <rect width="250" height="34" rx="10" ry="10" fill="#dcfce7" />
    <text x="125" y="22" text-anchor="middle" class="mono-bold" fill="#14532d">3. Propensity-Logged Bootstrap</text>

    <text x="14" y="54" class="sub">Avoid deterministic blind spots via</text>
    <text x="14" y="69" class="sub">Plackett-Luce stochastic logging:</text>

    <rect x="14" y="82" width="222" height="42" rx="6" fill="#ffffff" stroke="#86efac" />
    <text x="125" y="100" text-anchor="middle" class="mono-bold" fill="#14532d">Plackett-Luce Top-K Sampling</text>
    <text x="125" y="116" text-anchor="middle" class="mono">π_0(d|q) = exp(S_0/T) / Σ exp(S_0/T)</text>

    <rect x="14" y="134" width="222" height="48" rx="6" fill="#dcfce7" stroke="#16a34a" />
    <text x="125" y="153" text-anchor="middle" class="mono-bold" fill="#14532d">Day-7 Counterfactual LTR</text>
    <text x="125" y="171" text-anchor="middle" class="mono">L_SNIPS = Σ (c_i / π_0(i)) · l(f(x_i))</text>

    <text x="125" y="206" text-anchor="middle" class="sub" fill="#14532d">Guarantees full action support for</text>
    <text x="125" y="222" text-anchor="middle" class="sub" fill="#14532d">unbiased first-generation LTR!</text>
  </g>
</svg>

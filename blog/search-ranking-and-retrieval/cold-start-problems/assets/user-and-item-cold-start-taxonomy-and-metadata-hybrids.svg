<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="'Inter', -apple-system, sans-serif">
  <rect width="760" height="300" rx="12" fill="#fbfaf6" stroke="#d8d2c5" stroke-width="1.5"/>

  <!-- Card 1: The 3 Cold-Start Regimes -->
  <g transform="translate(16, 16)">
    <rect width="232" height="268" rx="10" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.2"/>
    <text x="116" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#1e2422">1. The Cold-Start Taxonomy</text>
    <text x="116" y="40" text-anchor="middle" font-size="9.5" fill="#5a625e">Why pure ID embeddings collapse to 0</text>

    <g transform="translate(14, 52)">
      <rect width="204" height="162" rx="8" fill="#fbfaf6" stroke="#d8d2c5"/>

      <rect x="12" y="14" width="180" height="40" rx="5" fill="#eef6f0" stroke="#165d4c"/>
      <text x="102" y="30" text-anchor="middle" font-size="9" font-weight="700" fill="#173d35">New User Cold-Start (|R_u| = 0)</text>
      <text x="102" y="44" text-anchor="middle" font-size="8" fill="#5a625e">Signals: Device, Geo, Onboarding, Session</text>

      <rect x="12" y="62" width="180" height="40" rx="5" fill="#fdf6e9" stroke="#8c5d16"/>
      <text x="102" y="78" text-anchor="middle" font-size="9" font-weight="700" fill="#8c5d16">New Item Cold-Start (|R_i| = 0)</text>
      <text x="102" y="92" text-anchor="middle" font-size="8" fill="#5a625e">Signals: Title, Brand, Price, Image/Audio</text>

      <rect x="12" y="110" width="180" height="40" rx="5" fill="#fbeee9" stroke="#9e2a2b"/>
      <text x="102" y="126" text-anchor="middle" font-size="9" font-weight="700" fill="#9e2a2b">System / New-Market Cold-Start</text>
      <text x="102" y="140" text-anchor="middle" font-size="8" fill="#5a625e">Cross-domain transfer + popularity priors</text>
    </g>

    <rect x="14" y="224" width="204" height="32" rx="6" fill="#fbeee9"/>
    <text x="116" y="244" text-anchor="middle" font-size="9.5" font-weight="700" fill="#9e2a2b">Unseen ID vector e_id ≈ N(0, σ²I)</text>
  </g>

  <!-- Card 2: Hybrid Content + ID Two-Tower -->
  <g transform="translate(264, 16)">
    <rect width="232" height="268" rx="10" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.2"/>
    <text x="116" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#1e2422">2. Metadata + ID Hybrid Tower</text>
    <text x="116" y="40" text-anchor="middle" font-size="9.5" fill="#5a625e">Fuse side-information with ID embeddings</text>

    <g transform="translate(14, 52)">
      <rect width="204" height="162" rx="8" fill="#fbfaf6" stroke="#d8d2c5"/>

      <rect x="12" y="14" width="82" height="42" rx="5" fill="#fbeee9" stroke="#9e2a2b"/>
      <text x="53" y="31" text-anchor="middle" font-size="8.5" font-weight="700" fill="#9e2a2b">Item ID e_i^id</text>
      <text x="53" y="45" text-anchor="middle" font-size="7.5" fill="#5a625e">Memorizes head</text>

      <rect x="110" y="14" width="82" height="42" rx="5" fill="#eef6f0" stroke="#165d4c"/>
      <text x="151" y="31" text-anchor="middle" font-size="8.5" font-weight="700" fill="#173d35">Metadata x_i</text>
      <text x="151" y="45" text-anchor="middle" font-size="7.5" fill="#5a625e">Category/Price/Text</text>

      <rect x="12" y="68" width="180" height="42" rx="5" fill="#ffffff" stroke="#165d4c" stroke-width="1.2"/>
      <text x="102" y="85" text-anchor="middle" font-size="8.5" font-weight="700" fill="#173d35">Gated Fusion / Residual Addition</text>
      <text x="102" y="100" text-anchor="middle" font-size="8" fill="#5a625e">z_i = g(n_i)·e_i^id + (1 − g(n_i))·f_meta(x_i)</text>

      <rect x="12" y="120" width="180" height="32" rx="5" fill="#eef6f0"/>
      <text x="102" y="140" text-anchor="middle" font-size="8.5" font-weight="700" fill="#173d35">Smooth transition: Cold (n=0) → Warm</text>
    </g>

    <rect x="14" y="224" width="204" height="32" rx="6" fill="#eef6f0"/>
    <text x="116" y="244" text-anchor="middle" font-size="9.5" font-weight="700" fill="#173d35">New item gets immediate vector f_meta(x_i)</text>
  </g>

  <!-- Card 3: ID Dropout (DropoutNet, Volkovs et al.) -->
  <g transform="translate(512, 16)">
    <rect width="232" height="268" rx="10" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.2"/>
    <text x="116" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#1e2422">3. ID Dropout Training</text>
    <text x="116" y="40" text-anchor="middle" font-size="9.5" fill="#5a625e">Prevent ID dominance via DropoutNet</text>

    <g transform="translate(14, 52)">
      <rect width="204" height="162" rx="8" fill="#fbfaf6" stroke="#d8d2c5"/>

      <rect x="12" y="14" width="180" height="44" rx="5" fill="#fdf6e9" stroke="#8c5d16"/>
      <text x="102" y="31" text-anchor="middle" font-size="8.5" font-weight="700" fill="#8c5d16">Problem: ID Shortcut Learning</text>
      <text x="102" y="46" text-anchor="middle" font-size="8" fill="#5a625e">Warm items dominate training → MLP ignores x_i</text>

      <rect x="12" y="68" width="180" height="44" rx="5" fill="#eef6f0" stroke="#165d4c"/>
      <text x="102" y="85" text-anchor="middle" font-size="8.5" font-weight="700" fill="#173d35">Solution: Mask ID with prob p_drop = 0.5</text>
      <text x="102" y="100" text-anchor="middle" font-size="8" fill="#5a625e">ẽ_i^id = 0 during 50% of training steps</text>

      <rect x="12" y="120" width="180" height="32" rx="5" fill="#ffffff" stroke="#d8d2c5"/>
      <text x="102" y="140" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1e2422">Forces metadata tower to match CF space!</text>
    </g>

    <rect x="14" y="224" width="204" height="32" rx="6" fill="#fdf6e9"/>
    <text x="116" y="244" text-anchor="middle" font-size="9.5" font-weight="700" fill="#8c5d16">Simulates cold-start on every batch</text>
  </g>
</svg>

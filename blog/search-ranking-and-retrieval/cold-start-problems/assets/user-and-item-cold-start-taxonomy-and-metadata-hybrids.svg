<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 316" width="860" height="316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="860" height="316" rx="12" fill="#fbfaf6" stroke="#d8d2c5" stroke-width="1.5"/>

  <!-- Card 1: The 3 Cold-Start Regimes -->
  <g transform="translate(16, 16)">
    <rect width="264" height="284" rx="10" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.2"/>
    <text x="132" y="24" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e2422">1. The Cold-Start Taxonomy</text>
    <text x="132" y="41" text-anchor="middle" font-size="9.5" fill="#5a625e">Why pure ID embeddings collapse to zero</text>

    <g transform="translate(14, 54)">
      <rect width="236" height="174" rx="8" fill="#fbfaf6" stroke="#d8d2c5"/>

      <rect x="12" y="14" width="212" height="44" rx="5" fill="#eef6f0" stroke="#165d4c"/>
      <text x="118" y="31" text-anchor="middle" font-size="9" font-weight="700" fill="#173d35">New User Cold-Start (|R_u| = 0)</text>
      <text x="118" y="47" text-anchor="middle" font-size="8.2" fill="#5a625e">Signals: Device, Geo, Onboarding, Session</text>

      <rect x="12" y="66" width="212" height="44" rx="5" fill="#fdf6e9" stroke="#8c5d16"/>
      <text x="118" y="83" text-anchor="middle" font-size="9" font-weight="700" fill="#8c5d16">New Item Cold-Start (|R_i| = 0)</text>
      <text x="118" y="99" text-anchor="middle" font-size="8.2" fill="#5a625e">Signals: Title, Brand, Price, Visual/Audio</text>

      <rect x="12" y="118" width="212" height="44" rx="5" fill="#fbeee9" stroke="#9e2a2b"/>
      <text x="118" y="135" text-anchor="middle" font-size="9" font-weight="700" fill="#9e2a2b">System / New-Market Cold-Start</text>
      <text x="118" y="151" text-anchor="middle" font-size="8.2" fill="#5a625e">Cross-domain transfer + popularity priors</text>
    </g>

    <rect x="14" y="238" width="236" height="32" rx="6" fill="#fbeee9"/>
    <text x="132" y="258" text-anchor="middle" font-size="9.5" font-weight="700" fill="#9e2a2b">Unseen ID vector e_id ≈ N(0, σ²I)</text>
  </g>

  <!-- Card 2: Hybrid Content + ID Two-Tower -->
  <g transform="translate(298, 16)">
    <rect width="264" height="284" rx="10" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.2"/>
    <text x="132" y="24" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e2422">2. Metadata + ID Hybrid Tower</text>
    <text x="132" y="41" text-anchor="middle" font-size="9.5" fill="#5a625e">Fuse side-information with ID embeddings</text>

    <g transform="translate(14, 54)">
      <rect width="236" height="174" rx="8" fill="#fbfaf6" stroke="#d8d2c5"/>

      <rect x="12" y="14" width="101" height="44" rx="5" fill="#fbeee9" stroke="#9e2a2b"/>
      <text x="62.5" y="31" text-anchor="middle" font-size="8.8" font-weight="700" fill="#9e2a2b">Item ID e_i^id</text>
      <text x="62.5" y="47" text-anchor="middle" font-size="8" fill="#5a625e">Memorizes head</text>

      <rect x="123" y="14" width="101" height="44" rx="5" fill="#eef6f0" stroke="#165d4c"/>
      <text x="173.5" y="31" text-anchor="middle" font-size="8.8" font-weight="700" fill="#173d35">Metadata x_i</text>
      <text x="173.5" y="47" text-anchor="middle" font-size="8" fill="#5a625e">Category &amp; Text</text>

      <rect x="12" y="68" width="212" height="46" rx="5" fill="#ffffff" stroke="#165d4c" stroke-width="1.2"/>
      <text x="118" y="86" text-anchor="middle" font-size="9" font-weight="700" fill="#173d35">Frequency-Gated Residual Fusion</text>
      <text x="118" y="102" text-anchor="middle" font-size="8.2" fill="#5a625e">z_i = g(n_i)·e_i^id + (1 − g(n_i))·f_meta(x_i)</text>

      <rect x="12" y="124" width="212" height="36" rx="5" fill="#eef6f0"/>
      <text x="118" y="146" text-anchor="middle" font-size="8.5" font-weight="700" fill="#173d35">Smooth transition: Cold (n = 0) → Warm</text>
    </g>

    <rect x="14" y="238" width="236" height="32" rx="6" fill="#eef6f0"/>
    <text x="132" y="258" text-anchor="middle" font-size="9.5" font-weight="700" fill="#173d35">New item gets immediate vector f_meta(x_i)</text>
  </g>

  <!-- Card 3: ID Dropout Training -->
  <g transform="translate(580, 16)">
    <rect width="264" height="284" rx="10" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.2"/>
    <text x="132" y="24" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e2422">3. Feature / ID Masking</text>
    <text x="132" y="41" text-anchor="middle" font-size="9.5" fill="#5a625e">Prevent ID dominance during training</text>

    <g transform="translate(14, 54)">
      <rect width="236" height="174" rx="8" fill="#fbfaf6" stroke="#d8d2c5"/>

      <rect x="12" y="14" width="212" height="44" rx="5" fill="#fdf6e9" stroke="#8c5d16"/>
      <text x="118" y="31" text-anchor="middle" font-size="9" font-weight="700" fill="#8c5d16">Problem: ID Shortcut Learning</text>
      <text x="118" y="47" text-anchor="middle" font-size="8.2" fill="#5a625e">Warm items dominate → MLP ignores x_i</text>

      <rect x="12" y="68" width="212" height="46" rx="5" fill="#eef6f0" stroke="#165d4c"/>
      <text x="118" y="86" text-anchor="middle" font-size="9" font-weight="700" fill="#173d35">Solution: Mask ID (p_drop = 0.5)</text>
      <text x="118" y="102" text-anchor="middle" font-size="8.2" fill="#5a625e">ẽ_i^id = 0 during 50% of training steps</text>

      <rect x="12" y="124" width="212" height="36" rx="5" fill="#ffffff" stroke="#d8d2c5"/>
      <text x="118" y="146" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1e2422">Forces metadata tower into CF space</text>
    </g>

    <rect x="14" y="238" width="236" height="32" rx="6" fill="#fdf6e9"/>
    <text x="132" y="258" text-anchor="middle" font-size="9.5" font-weight="700" fill="#8c5d16">Simulates cold-start on every batch</text>
  </g>
</svg>

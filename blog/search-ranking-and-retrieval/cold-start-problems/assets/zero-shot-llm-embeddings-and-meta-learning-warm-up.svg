<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 316" width="860" height="316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="860" height="316" rx="12" fill="#fbfaf6" stroke="#d8d2c5" stroke-width="1.5"/>

  <!-- Card 1: Zero-Shot Content Priors -->
  <g transform="translate(16, 16)">
    <rect width="264" height="284" rx="10" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.2"/>
    <text x="132" y="24" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e2422">1. Zero-Shot Content Priors</text>
    <text x="132" y="41" text-anchor="middle" font-size="9.5" fill="#5a625e">Represent items at 0 clicks via semantics</text>

    <g transform="translate(14, 54)">
      <rect width="236" height="174" rx="8" fill="#fbfaf6" stroke="#d8d2c5"/>

      <rect x="12" y="14" width="212" height="44" rx="5" fill="#eef6f0" stroke="#165d4c"/>
      <text x="118" y="31" text-anchor="middle" font-size="9" font-weight="700" fill="#173d35">Pretrained Text / Multimodal Features</text>
      <text x="118" y="47" text-anchor="middle" font-size="8.2" fill="#5a625e">h_i^sem ∈ R^D (Zero-shot features)</text>

      <rect x="12" y="68" width="212" height="46" rx="5" fill="#fdf6e9" stroke="#8c5d16"/>
      <text x="118" y="86" text-anchor="middle" font-size="9" font-weight="700" fill="#8c5d16">Lightweight Projection to CF Space</text>
      <text x="118" y="102" text-anchor="middle" font-size="8.2" fill="#5a625e">Aligns content features with warm items</text>

      <rect x="12" y="124" width="212" height="36" rx="5" fill="#ffffff" stroke="#d8d2c5"/>
      <text x="118" y="146" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1e2422">Instant retrieval at t = 0ms upload</text>
    </g>

    <rect x="14" y="238" width="236" height="32" rx="6" fill="#eef6f0"/>
    <text x="132" y="258" text-anchor="middle" font-size="9.5" font-weight="700" fill="#173d35">Bridges semantic–collaborative gap</text>
  </g>

  <!-- Card 2: Few-Shot Warm-Up (1-10 Clicks) -->
  <g transform="translate(298, 16)">
    <rect width="264" height="284" rx="10" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.2"/>
    <text x="132" y="24" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e2422">2. Few-Shot Warm-Up (1–10 Clicks)</text>
    <text x="132" y="41" text-anchor="middle" font-size="9.5" fill="#5a625e">Accelerate transition from cold to warm</text>

    <g transform="translate(14, 54)">
      <rect width="236" height="174" rx="8" fill="#fbfaf6" stroke="#d8d2c5"/>

      <rect x="12" y="14" width="212" height="44" rx="5" fill="#eef6f0" stroke="#165d4c"/>
      <text x="118" y="31" text-anchor="middle" font-size="9" font-weight="700" fill="#173d35">Feature-Conditioned Scaling</text>
      <text x="118" y="47" text-anchor="middle" font-size="8.2" fill="#5a625e">Stabilizes noisy early ID gradients</text>

      <rect x="12" y="68" width="212" height="46" rx="5" fill="#fdf6e9" stroke="#8c5d16"/>
      <text x="118" y="86" text-anchor="middle" font-size="9" font-weight="700" fill="#8c5d16">Early-Clicker Centroid Shift</text>
      <text x="118" y="102" text-anchor="middle" font-size="8.2" fill="#5a625e">Anchors item near first k engaged users</text>

      <rect x="12" y="124" width="212" height="36" rx="5" fill="#ffffff" stroke="#165d4c" stroke-width="1.2"/>
      <text x="118" y="146" text-anchor="middle" font-size="8.5" font-weight="700" fill="#173d35">Combines content prior + early signal</text>
    </g>

    <rect x="14" y="238" width="236" height="32" rx="6" fill="#fdf6e9"/>
    <text x="132" y="258" text-anchor="middle" font-size="9.5" font-weight="700" fill="#8c5d16">Adapts in a few clicks instead of hundreds</text>
  </g>

  <!-- Card 3: Hierarchical / Shared Discrete IDs -->
  <g transform="translate(580, 16)">
    <rect width="264" height="284" rx="10" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.2"/>
    <text x="132" y="24" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e2422">3. Hierarchical Shared IDs</text>
    <text x="132" y="41" text-anchor="middle" font-size="9.5" fill="#5a625e">Replace atomic IDs with hierarchical codes</text>

    <g transform="translate(14, 54)">
      <rect width="236" height="174" rx="8" fill="#fbfaf6" stroke="#d8d2c5"/>

      <rect x="12" y="14" width="212" height="44" rx="5" fill="#eef6f0" stroke="#165d4c"/>
      <text x="118" y="31" text-anchor="middle" font-size="9" font-weight="700" fill="#173d35">Coarse-to-Fine Codebook Tuples</text>
      <text x="118" y="47" text-anchor="middle" font-size="8.2" fill="#5a625e">Maps item into discrete path (c₁, c₂, c₃)</text>

      <rect x="12" y="68" width="212" height="46" rx="5" fill="#fbeee9" stroke="#9e2a2b"/>
      <text x="118" y="86" text-anchor="middle" font-size="9" font-weight="700" fill="#9e2a2b">Shared Prefix = Instant Warmth</text>
      <text x="118" y="102" text-anchor="middle" font-size="8.2" fill="#5a625e">New item (12, 4, 9) shares prefix (12, 4, *)</text>

      <rect x="12" y="124" width="212" height="36" rx="5" fill="#ffffff" stroke="#d8d2c5"/>
      <text x="118" y="146" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1e2422">Shares parameters across cold &amp; warm</text>
    </g>

    <rect x="14" y="238" width="236" height="32" rx="6" fill="#eef6f0"/>
    <text x="132" y="258" text-anchor="middle" font-size="9.5" font-weight="700" fill="#173d35">Hierarchical coarse-to-fine generalization</text>
  </g>
</svg>

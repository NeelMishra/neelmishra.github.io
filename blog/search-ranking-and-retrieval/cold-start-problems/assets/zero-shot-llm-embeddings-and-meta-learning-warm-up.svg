<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="'Inter', -apple-system, sans-serif">
  <rect width="760" height="300" rx="12" fill="#fbfaf6" stroke="#d8d2c5" stroke-width="1.5"/>

  <!-- Card 1: Zero-Shot Content Priors -->
  <g transform="translate(16, 16)">
    <rect width="232" height="268" rx="10" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.2"/>
    <text x="116" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#1e2422">1. Zero-Shot Content Priors</text>
    <text x="116" y="40" text-anchor="middle" font-size="9.5" fill="#5a625e">Represent items at 0 clicks via semantics</text>

    <g transform="translate(14, 52)">
      <rect width="204" height="162" rx="8" fill="#fbfaf6" stroke="#d8d2c5"/>

      <rect x="12" y="14" width="180" height="40" rx="5" fill="#eef6f0" stroke="#165d4c"/>
      <text x="102" y="30" text-anchor="middle" font-size="8.5" font-weight="700" fill="#173d35">Pretrained Text / Multimodal Features</text>
      <text x="102" y="44" text-anchor="middle" font-size="8" fill="#5a625e">h_i^sem ∈ R^D (Zero-shot features)</text>

      <rect x="12" y="62" width="180" height="44" rx="5" fill="#fdf6e9" stroke="#8c5d16"/>
      <text x="102" y="79" text-anchor="middle" font-size="8.5" font-weight="700" fill="#8c5d16">Lightweight Projection to CF Space</text>
      <text x="102" y="94" text-anchor="middle" font-size="8" fill="#5a625e">Aligns content features with warm items</text>

      <rect x="12" y="114" width="180" height="36" rx="5" fill="#ffffff" stroke="#d8d2c5"/>
      <text x="102" y="136" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1e2422">Instant retrieval at t = 0ms upload!</text>
    </g>

    <rect x="14" y="224" width="204" height="32" rx="6" fill="#eef6f0"/>
    <text x="116" y="244" text-anchor="middle" font-size="9.5" font-weight="700" fill="#173d35">Bridges semantic-collaborative gap</text>
  </g>

  <!-- Card 2: Few-Shot Warm-Up (1-10 Clicks) -->
  <g transform="translate(264, 16)">
    <rect width="232" height="268" rx="10" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.2"/>
    <text x="116" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#1e2422">2. Few-Shot Warm-Up (1–10 Clicks)</text>
    <text x="116" y="40" text-anchor="middle" font-size="9.5" fill="#5a625e">Accelerate transition from cold to warm</text>

    <g transform="translate(14, 52)">
      <rect width="204" height="162" rx="8" fill="#fbfaf6" stroke="#d8d2c5"/>

      <rect x="12" y="14" width="180" height="44" rx="5" fill="#eef6f0" stroke="#165d4c"/>
      <text x="102" y="31" text-anchor="middle" font-size="8.5" font-weight="700" fill="#173d35">Feature-Conditioned Scaling</text>
      <text x="102" y="46" text-anchor="middle" font-size="8" fill="#5a625e">Stabilizes noisy early ID gradients</text>

      <rect x="12" y="66" width="180" height="44" rx="5" fill="#fdf6e9" stroke="#8c5d16"/>
      <text x="102" y="83" text-anchor="middle" font-size="8.5" font-weight="700" fill="#8c5d16">Early-Clicker Centroid Shift</text>
      <text x="102" y="98" text-anchor="middle" font-size="8" fill="#5a625e">Anchors item near its first k engaged users</text>

      <rect x="12" y="118" width="180" height="34" rx="5" fill="#ffffff" stroke="#165d4c" stroke-width="1.2"/>
      <text x="102" y="139" text-anchor="middle" font-size="8.5" font-weight="700" fill="#173d35">Combines content prior + early user signal</text>
    </g>

    <rect x="14" y="224" width="204" height="32" rx="6" fill="#fdf6e9"/>
    <text x="116" y="244" text-anchor="middle" font-size="9.5" font-weight="700" fill="#8c5d16">Adapts in a few clicks instead of hundreds!</text>
  </g>

  <!-- Card 3: Hierarchical / Shared Discrete IDs -->
  <g transform="translate(512, 16)">
    <rect width="232" height="268" rx="10" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.2"/>
    <text x="116" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#1e2422">3. Hierarchical Shared IDs</text>
    <text x="116" y="40" text-anchor="middle" font-size="9.5" fill="#5a625e">Replace atomic IDs with hierarchical codes</text>

    <g transform="translate(14, 52)">
      <rect width="204" height="162" rx="8" fill="#fbfaf6" stroke="#d8d2c5"/>

      <rect x="12" y="14" width="180" height="44" rx="5" fill="#eef6f0" stroke="#165d4c"/>
      <text x="102" y="31" text-anchor="middle" font-size="8.5" font-weight="700" fill="#173d35">Coarse-to-Fine Codebook Tuples</text>
      <text x="102" y="46" text-anchor="middle" font-size="8" fill="#5a625e">Maps item into discrete path (c₁, c₂, c₃)</text>

      <rect x="12" y="66" width="180" height="44" rx="5" fill="#fbeee9" stroke="#9e2a2b"/>
      <text x="102" y="83" text-anchor="middle" font-size="8.5" font-weight="700" fill="#9e2a2b">Shared Prefix = Instant Warmth!</text>
      <text x="102" y="98" text-anchor="middle" font-size="8" fill="#5a625e">New sneaker (12, 4, 9) shares prefix (12, 4, *)</text>

      <rect x="12" y="118" width="180" height="34" rx="5" fill="#ffffff" stroke="#d8d2c5"/>
      <text x="102" y="139" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1e2422">Parameter sharing across cold &amp; warm items</text>
    </g>

    <rect x="14" y="224" width="204" height="32" rx="6" fill="#eef6f0"/>
    <text x="116" y="244" text-anchor="middle" font-size="9.5" font-weight="700" fill="#173d35">Hierarchical coarse-to-fine generalization</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="'Inter', -apple-system, sans-serif">
  <rect width="760" height="300" rx="12" fill="#fbfaf6" stroke="#d8d2c5" stroke-width="1.5"/>

  <!-- Card 1: Zero-Shot Multimodal & LLM Alignment -->
  <g transform="translate(16, 16)">
    <rect width="232" height="268" rx="10" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.2"/>
    <text x="116" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#1e2422">1. Zero-Shot LLM / CLIP Adapter</text>
    <text x="116" y="40" text-anchor="middle" font-size="9.5" fill="#5a625e">Project frozen world knowledge into CF space</text>

    <g transform="translate(14, 52)">
      <rect width="204" height="162" rx="8" fill="#fbfaf6" stroke="#d8d2c5"/>

      <rect x="12" y="14" width="180" height="40" rx="5" fill="#eef6f0" stroke="#165d4c"/>
      <text x="102" y="30" text-anchor="middle" font-size="8.5" font-weight="700" fill="#173d35">Frozen Pretrained Encoder (CLIP / LLM)</text>
      <text x="102" y="44" text-anchor="middle" font-size="8" fill="#5a625e">h_i^sem ∈ R^768 (Zero-shot semantics)</text>

      <rect x="12" y="62" width="180" height="44" rx="5" fill="#fdf6e9" stroke="#8c5d16"/>
      <text x="102" y="79" text-anchor="middle" font-size="8.5" font-weight="700" fill="#8c5d16">Contrastive Alignment Adapter W_proj</text>
      <text x="102" y="94" text-anchor="middle" font-size="8" fill="#5a625e">Aligns W_proj h_i^sem ≈ e_i^CF on warm items</text>

      <rect x="12" y="114" width="180" height="36" rx="5" fill="#ffffff" stroke="#d8d2c5"/>
      <text x="102" y="136" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1e2422">Instant retrieval at t = 0ms upload!</text>
    </g>

    <rect x="14" y="224" width="204" height="32" rx="6" fill="#eef6f0"/>
    <text x="116" y="244" text-anchor="middle" font-size="9.5" font-weight="700" fill="#173d35">Bridges semantic-collaborative gap</text>
  </g>

  <!-- Card 2: Meta-Learning Warm-Up (MWUF, Zhu et al.) -->
  <g transform="translate(264, 16)">
    <rect width="232" height="268" rx="10" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.2"/>
    <text x="116" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#1e2422">2. Meta Scaling &amp; Shifting (MWUF)</text>
    <text x="116" y="40" text-anchor="middle" font-size="9.5" fill="#5a625e">Warm up noisy ID embeddings in 1–5 clicks</text>

    <g transform="translate(14, 52)">
      <rect width="204" height="162" rx="8" fill="#fbfaf6" stroke="#d8d2c5"/>

      <rect x="12" y="14" width="180" height="44" rx="5" fill="#eef6f0" stroke="#165d4c"/>
      <text x="102" y="31" text-anchor="middle" font-size="8.5" font-weight="700" fill="#173d35">Meta-Scaling Network τ_scale(x_i)</text>
      <text x="102" y="46" text-anchor="middle" font-size="8" fill="#5a625e">Transforms cold ID into warm feature scale</text>

      <rect x="12" y="66" width="180" height="44" rx="5" fill="#fdf6e9" stroke="#8c5d16"/>
      <text x="102" y="83" text-anchor="middle" font-size="8.5" font-weight="700" fill="#8c5d16">Meta-Shifting Network τ_shift(R_i)</text>
      <text x="102" y="98" text-anchor="middle" font-size="8" fill="#5a625e">Uses first k clicked users' mean vector ū_i</text>

      <rect x="12" y="118" width="180" height="34" rx="5" fill="#ffffff" stroke="#165d4c" stroke-width="1.2"/>
      <text x="102" y="139" text-anchor="middle" font-size="8.5" font-weight="700" fill="#173d35">e_i^warm = τ_scale(x_i) ⊙ e_i^cold + τ_shift(ū_i)</text>
    </g>

    <rect x="14" y="224" width="204" height="32" rx="6" fill="#fdf6e9"/>
    <text x="116" y="244" text-anchor="middle" font-size="9.5" font-weight="700" fill="#8c5d16">Adapts in 3 clicks instead of 300!</text>
  </g>

  <!-- Card 3: Semantic IDs (RQ-VAE / TIGER) -->
  <g transform="translate(512, 16)">
    <rect width="232" height="268" rx="10" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.2"/>
    <text x="116" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#1e2422">3. Semantic IDs (RQ-VAE / TIGER)</text>
    <text x="116" y="40" text-anchor="middle" font-size="9.5" fill="#5a625e">Replace atomic IDs with hierarchical codes</text>

    <g transform="translate(14, 52)">
      <rect width="204" height="162" rx="8" fill="#fbfaf6" stroke="#d8d2c5"/>

      <rect x="12" y="14" width="180" height="44" rx="5" fill="#eef6f0" stroke="#165d4c"/>
      <text x="102" y="31" text-anchor="middle" font-size="8.5" font-weight="700" fill="#173d35">Residual Quantized VAE (RQ-VAE)</text>
      <text x="102" y="46" text-anchor="middle" font-size="8" fill="#5a625e">Quantizes content embedding into tuple (c₁,c₂,c₃)</text>

      <rect x="12" y="66" width="180" height="44" rx="5" fill="#fbeee9" stroke="#9e2a2b"/>
      <text x="102" y="83" text-anchor="middle" font-size="8.5" font-weight="700" fill="#9e2a2b">Shared Prefix = Instant Cold-Start!</text>
      <text x="102" y="98" text-anchor="middle" font-size="8" fill="#5a625e">New sneaker (12, 4, 9) shares prefix (12, 4, *)</text>

      <rect x="12" y="118" width="180" height="34" rx="5" fill="#ffffff" stroke="#d8d2c5"/>
      <text x="102" y="139" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1e2422">Eliminates atomic O(N) ID table completely</text>
    </g>

    <rect x="14" y="224" width="204" height="32" rx="6" fill="#eef6f0"/>
    <text x="116" y="244" text-anchor="middle" font-size="9.5" font-weight="700" fill="#173d35">Hierarchical coarse-to-fine generalization</text>
  </g>
</svg>

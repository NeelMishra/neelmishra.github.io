<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" role="img" aria-label="Multi-Turn SFT Assistant-Only Loss Masking and FlashAttention Block-Diagonal Sequence Packing">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; stroke-width: 1.5; rx: 12; }
      .box-blue { fill: #122136; stroke: #58a6ff; stroke-width: 1.5; rx: 8; }
      .box-green { fill: #11261e; stroke: #3fb950; stroke-width: 1.5; rx: 8; }
      .box-amber { fill: #271e12; stroke: #d29922; stroke-width: 1.5; rx: 8; }
      .box-purple { fill: #211832; stroke: #a371f7; stroke-width: 1.5; rx: 8; }
      .box-red { fill: #281419; stroke: #f85149; stroke-width: 1.5; rx: 8; }
      .box-neutral { fill: #1c2128; stroke: #484f58; stroke-width: 1.2; rx: 6; }
      .title { font-family: 'Manrope', 'DejaVu Sans', sans-serif; font-size: 18px; font-weight: 800; fill: #f0f6fc; }
      .subtitle { font-family: 'Manrope', 'DejaVu Sans', sans-serif; font-size: 12.5px; font-weight: 500; fill: #8b949e; }
      .sec-hdr { font-family: 'Manrope', 'DejaVu Sans', sans-serif; font-size: 14px; font-weight: 700; fill: #e6edf3; }
      .lbl-bold { font-family: 'Manrope', 'DejaVu Sans', sans-serif; font-size: 12px; font-weight: 700; fill: #f0f6fc; }
      .lbl { font-family: 'Manrope', 'DejaVu Sans', sans-serif; font-size: 11px; font-weight: 500; fill: #c9d1d9; }
      .mono { font-family: 'JetBrains Mono', 'DejaVu Sans Mono', monospace; font-size: 10.5px; fill: #79c0ff; }
      .mono-sm { font-family: 'JetBrains Mono', 'DejaVu Sans Mono', monospace; font-size: 9.6px; fill: #a5d6ff; }
      .mono-green { font-family: 'JetBrains Mono', 'DejaVu Sans Mono', monospace; font-size: 10.5px; font-weight: 700; fill: #56d364; }
      .mono-red { font-family: 'JetBrains Mono', 'DejaVu Sans Mono', monospace; font-size: 10.5px; font-weight: 700; fill: #ff7b72; }
      .mono-amber { font-family: 'JetBrains Mono', 'DejaVu Sans Mono', monospace; font-size: 10px; font-weight: 700; fill: #e3b341; }
    </style>
  </defs>

  <rect width="1120" height="600" class="bg"/>

  <!-- Main Header -->
  <text x="28" y="34" class="title">SFT Training Mechanics: Multi-Turn Assistant Loss Masking &amp; FlashAttention Packing</text>
  <text x="28" y="54" class="subtitle">Supervising only assistant actions + &lt;eot_id&gt; tokens while packing variable-length trajectories with block-diagonal cu_seqlens</text>

  <!-- LEFT PANEL: Multi-Turn Loss Masking -->
  <rect x="24" y="74" width="528" height="504" class="panel"/>
  <text x="44" y="100" class="sec-hdr">A. Multi-Turn Agent Trajectory Loss Masking (labels = -100)</text>

  <!-- Turn 1: System + Tool Schemas -->
  <rect x="44" y="116" width="488" height="68" class="box-neutral"/>
  <text x="60" y="136" class="lbl-bold">1. System Prompt &amp; Tool Declarations (~1,800 tokens)</text>
  <text x="60" y="154" class="mono-sm">input_ids: [&lt;sys&gt;, "You", "are", "Aria...", &lt;eot_id&gt;]</text>
  <text x="60" y="172" class="mono-red">labels:    [-100,  -100,  -100,  -100,      -100   ]  -&gt; Mask m_t = 0</text>

  <!-- Turn 2: User Turn -->
  <rect x="44" y="194" width="488" height="68" class="box-neutral"/>
  <text x="60" y="214" class="lbl-bold">2. User Query Turn (~45 tokens)</text>
  <text x="60" y="232" class="mono-sm">input_ids: [&lt;user&gt;, "Find", "linen", "shirts", "&lt;$90", &lt;eot_id&gt;]</text>
  <text x="60" y="250" class="mono-red">labels:    [-100,   -100,   -100,    -100,     -100,   -100    ]  -&gt; Mask m_t = 0</text>

  <!-- Turn 3: Assistant Tool Call -->
  <rect x="44" y="272" width="488" height="74" class="box-green"/>
  <text x="60" y="292" class="lbl-bold">3. Assistant Thought + JSON Tool Call (~60 tokens) [SUPERVISED]</text>
  <text x="60" y="310" class="mono-sm">input_ids: [&lt;asst&gt;, "{", "\"tool\":", "\"search\"", "}", &lt;eot_id&gt;]</text>
  <text x="60" y="328" class="mono-green">labels:    [-100,   "{", "\"tool\":", "\"search\"", "}", &lt;eot_id&gt;]  -&gt; Mask m_t = 1</text>

  <!-- Turn 4: Raw Tool Observation -->
  <rect x="44" y="356" width="488" height="68" class="box-neutral"/>
  <text x="60" y="376" class="lbl-bold">4. Raw MCP Tool Observation Payload (~950 tokens)</text>
  <text x="60" y="394" class="mono-sm">input_ids: [&lt;tool&gt;, "{\"skus\":", "[{\"id\":", "\"VC-102\"...", &lt;eot_id&gt;]</text>
  <text x="60" y="412" class="mono-red">labels:    [-100,   -100,        -100,        -100,           -100   ]  -&gt; Mask m_t = 0</text>

  <!-- Turn 5: Assistant Final Synthesis -->
  <rect x="44" y="434" width="488" height="126" class="box-green"/>
  <text x="60" y="454" class="lbl-bold">5. Assistant Grounded Synthesis (~140 tokens) [SUPERVISED]</text>
  <text x="60" y="472" class="mono-sm">input_ids: [&lt;asst&gt;, "Here", "are", "two", "shirts...", &lt;eot_id&gt;]</text>
  <text x="60" y="490" class="mono-green">labels:    [-100,   "Here", "are", "two", "shirts...", &lt;eot_id&gt;]  -&gt; Mask m_t = 1</text>
  <text x="60" y="516" class="mono-amber">Critical Invariant: Always supervise trailing &lt;eot_id&gt; on assistant turns</text>
  <text x="60" y="534" class="lbl">and normalize loss by total valid tokens sum(m_t) across accumulation steps.</text>

  <!-- RIGHT PANEL: Sequence Packing with cu_seqlens -->
  <rect x="572" y="74" width="524" height="504" class="panel"/>
  <text x="592" y="100" class="sec-hdr">B. Multipack Sequence Packing (flash_attn_varlen_func)</text>

  <!-- Top: Naive Padding -->
  <rect x="592" y="116" width="484" height="132" class="box-red"/>
  <text x="608" y="138" class="lbl-bold">1. Naive Right-Padding to L_max = 8,192 (71% Wasted GPU FLOPs)</text>

  <rect x="608" y="150" width="136" height="24" class="box-blue"/>
  <text x="676" y="166" text-anchor="middle" class="mono-sm">Traj 1 (1,400 tok)</text>
  <rect x="748" y="150" width="312" height="24" class="box-neutral"/>
  <text x="904" y="166" text-anchor="middle" class="mono-red">&lt;pad&gt; x 6,792 tokens (Wasted GEMMs)</text>

  <rect x="608" y="180" width="96" height="24" class="box-purple"/>
  <text x="656" y="196" text-anchor="middle" class="mono-sm">Traj 2 (920)</text>
  <rect x="708" y="180" width="352" height="24" class="box-neutral"/>
  <text x="884" y="196" text-anchor="middle" class="mono-red">&lt;pad&gt; x 7,272 tokens (Wasted GEMMs)</text>

  <text x="608" y="226" class="lbl">Heavy-tailed agent lengths leave Tensor Cores computing zeros on 71% of batch.</text>

  <!-- Bottom: FlashAttention Varlen Packing -->
  <rect x="592" y="264" width="484" height="296" class="box-green"/>
  <text x="608" y="286" class="lbl-bold">2. Block-Diagonal Packing with cu_seqlens &amp; RoPE Reset (3.1x Speedup)</text>

  <!-- Packed 1D Stream -->
  <rect x="608" y="300" width="144" height="36" class="box-blue"/>
  <text x="680" y="322" text-anchor="middle" class="mono-sm">Traj 1 (1,400 tok)</text>

  <rect x="756" y="300" width="110" height="36" class="box-purple"/>
  <text x="811" y="322" text-anchor="middle" class="mono-sm">Traj 2 (920 tok)</text>

  <rect x="870" y="300" width="190" height="36" class="box-amber"/>
  <text x="965" y="322" text-anchor="middle" class="mono-sm">Traj 3 (1,776 tok)</text>

  <text x="608" y="356" class="mono-green">cu_seqlens = [0, 1400, 2320, 4096]   (0% Padding Waste!)</text>
  <text x="608" y="374" class="mono-sm">position_ids = [0..1399,  0..919,  0..1775]  (RoPE resets at each boundary)</text>

  <!-- Block-Diagonal Matrix Illustration -->
  <rect x="608" y="390" width="452" height="154" class="box-neutral"/>
  <text x="624" y="412" class="lbl-bold">SRAM Block-Diagonal Causal Attention Mask:</text>

  <rect x="624" y="424" width="66" height="34" class="box-blue"/>
  <text x="657" y="445" text-anchor="middle" class="mono-sm">T1 Lower</text>

  <rect x="694" y="460" width="66" height="34" class="box-purple"/>
  <text x="727" y="481" text-anchor="middle" class="mono-sm">T2 Lower</text>

  <rect x="764" y="496" width="66" height="34" class="box-amber"/>
  <text x="797" y="517" text-anchor="middle" class="mono-sm">T3 Lower</text>

  <text x="848" y="446" class="lbl">- Off-diagonal blocks are skipped</text>
  <text x="848" y="464" class="lbl">  entirely by FlashAttention-2</text>
  <text x="848" y="482" class="lbl">  varlen CUDA kernel.</text>
  <text x="848" y="504" class="mono-green">- Zero cross-document leakage</text>
  <text x="848" y="522" class="mono-green">- 3.1x higher tokens / sec / GPU</text>
</svg>

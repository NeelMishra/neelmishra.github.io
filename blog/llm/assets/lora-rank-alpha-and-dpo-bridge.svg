<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" role="img" aria-label="LoRA All-Linear Architecture, rsLoRA Scaling, and Bridging SFT Checkpoints to DPO">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; stroke-width: 1.5; rx: 12; }
      .box-blue { fill: #122136; stroke: #58a6ff; stroke-width: 1.5; rx: 8; }
      .box-green { fill: #11261e; stroke: #3fb950; stroke-width: 1.5; rx: 8; }
      .box-amber { fill: #271e12; stroke: #d29922; stroke-width: 1.5; rx: 8; }
      .box-purple { fill: #211832; stroke: #a371f7; stroke-width: 1.5; rx: 8; }
      .box-red { fill: #281419; stroke: #f85149; stroke-width: 1.5; rx: 8; }
      .box-neutral { fill: #1c2128; stroke: #484f58; stroke-width: 1.2; rx: 6; }
      .title { font-family: 'Manrope', 'DejaVu Sans', sans-serif; font-size: 18px; font-weight: 800; fill: #f0f6fc; }
      .subtitle { font-family: 'Manrope', 'DejaVu Sans', sans-serif; font-size: 12.5px; font-weight: 500; fill: #8b949e; }
      .sec-hdr { font-family: 'Manrope', 'DejaVu Sans', sans-serif; font-size: 14px; font-weight: 700; fill: #e6edf3; }
      .lbl-bold { font-family: 'Manrope', 'DejaVu Sans', sans-serif; font-size: 12px; font-weight: 700; fill: #f0f6fc; }
      .lbl { font-family: 'Manrope', 'DejaVu Sans', sans-serif; font-size: 11px; font-weight: 500; fill: #c9d1d9; }
      .mono { font-family: 'JetBrains Mono', 'DejaVu Sans Mono', monospace; font-size: 10.5px; fill: #79c0ff; }
      .mono-sm { font-family: 'JetBrains Mono', 'DejaVu Sans Mono', monospace; font-size: 9.6px; fill: #a5d6ff; }
      .mono-green { font-family: 'JetBrains Mono', 'DejaVu Sans Mono', monospace; font-size: 10.5px; font-weight: 700; fill: #56d364; }
      .mono-red { font-family: 'JetBrains Mono', 'DejaVu Sans Mono', monospace; font-size: 10.5px; font-weight: 700; fill: #ff7b72; }
      .mono-amber { font-family: 'JetBrains Mono', 'DejaVu Sans Mono', monospace; font-size: 10px; font-weight: 700; fill: #e3b341; }
      .edge-blue { stroke: #58a6ff; stroke-width: 1.8; fill: none; }
      .edge-green { stroke: #3fb950; stroke-width: 1.8; fill: none; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#58a6ff"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#3fb950"/>
    </marker>
  </defs>

  <rect width="1120" height="600" class="bg"/>

  <!-- Main Header -->
  <text x="28" y="34" class="title">LoRA / QLoRA Architecture Internals &amp; Bridging SFT Checkpoints to DPO</text>
  <text x="28" y="54" class="subtitle">All-linear module adaptation (Attention + SwiGLU MLP), rank/alpha &amp; rsLoRA scaling, and zero-copy DPO adapter toggling</text>

  <!-- LEFT PANEL: LoRA All-Linear Architecture -->
  <rect x="24" y="74" width="528" height="504" class="panel"/>
  <text x="44" y="100" class="sec-hdr">A. All-Linear LoRA / QLoRA Forward &amp; Scaling Mechanics</text>

  <!-- Formula & Init Box -->
  <rect x="44" y="116" width="488" height="122" class="box-blue"/>
  <text x="60" y="138" class="lbl-bold">1. Low-Rank Update Equation &amp; Exact Identity Initialization</text>
  <text x="60" y="160" class="mono-green">h = dequant(W_0) * x + gamma_r * B * (A * x)</text>
  <text x="60" y="180" class="mono-sm">A in R^{r x d_in} ~ N(0, sigma^2),   B in R^{d_out x r} = 0  (Exact 0 at step 0)</text>
  <text x="60" y="200" class="lbl">- Standard scaling: gamma_r = alpha / r  (Convention: alpha = 2*r, e.g. 64/32)</text>
  <text x="60" y="218" class="mono-amber">- rsLoRA scaling:   gamma_r = alpha / sqrt(r)  (Stable variance at r &gt;= 64)</text>

  <!-- All 7 Linear Layers Box -->
  <rect x="44" y="252" width="488" height="156" class="box-purple"/>
  <text x="60" y="274" class="lbl-bold">2. Why All 7 Linear Projections Beat Attention-Only (q, v)</text>

  <rect x="60" y="288" width="218" height="68" class="box-neutral"/>
  <text x="72" y="308" class="lbl-bold">Grouped-Query Attention (33%)</text>
  <text x="72" y="326" class="mono-sm">q_proj, k_proj, v_proj, o_proj</text>
  <text x="72" y="344" class="lbl">Adapts token routing &amp; focus</text>

  <rect x="296" y="288" width="220" height="68" class="box-neutral"/>
  <text x="308" y="308" class="lbl-bold">SwiGLU MLP Block (67% Params)</text>
  <text x="308" y="326" class="mono-sm">gate_proj, up_proj, down_proj</text>
  <text x="308" y="344" class="lbl">Stores domain schemas &amp; facts</text>

  <text x="60" y="376" class="lbl">Dettmers et al. (2023): Adapting all 7 layers at r = 16 outperforms</text>
  <text x="60" y="394" class="mono-green">adapting only (q_proj, v_proj) at r = 64 on downstream agent benchmarks!</text>

  <!-- QLoRA Memory Breakdown Box -->
  <rect x="44" y="422" width="488" height="138" class="box-green"/>
  <text x="60" y="444" class="lbl-bold">3. QLoRA 4-Bit NF4 Storage vs. 16-Bit BF16 Compute</text>
  <text x="60" y="464" class="mono-sm">- Base weights W_0 stored in 4-bit NormalFloat (NF4, blocksize=64)</text>
  <text x="60" y="482" class="mono-sm">- Double Quantization compresses FP32 scales to FP8 (+0.127 bits/param)</text>
  <text x="60" y="500" class="mono-green">- Forward/Backward dequantizes W_0 -&gt; BF16 on the fly in SRAM</text>
  <text x="60" y="518" class="mono-amber">- Gradients flow ONLY through BF16 adapters (B, A) + Paged AdamW</text>
  <text x="60" y="540" class="lbl">8B Model SFT Peak VRAM: 6.4 GB (QLoRA) vs. 19.2 GB (BF16 LoRA)</text>

  <!-- RIGHT PANEL: Bridging SFT to DPO -->
  <rect x="572" y="74" width="524" height="504" class="panel"/>
  <text x="592" y="100" class="sec-hdr">B. Bridging SFT Checkpoints to DPO (Zero Duplicate VRAM)</text>

  <!-- Step 1: Entropy-Preserving SFT Stop -->
  <rect x="592" y="116" width="484" height="112" class="box-amber"/>
  <text x="608" y="138" class="lbl-bold">Step 1: Stop SFT at Minimum Val Perplexity (~2.0 Epochs)</text>
  <text x="608" y="158" class="lbl">Over-training SFT (&gt;= 4 epochs) collapses output entropy H(pi_SFT) -&gt; 0,</text>
  <text x="608" y="176" class="lbl">causing log(pi_theta / pi_ref) to explode or saturate during DPO.</text>
  <text x="608" y="196" class="mono-amber">Rule: Pick early-stopped SFT checkpoint where token entropy H &gt;= 0.45 nats</text>
  <text x="608" y="214" class="mono-sm">and SFT LR (1.5e-4) is reduced 20x for DPO (5e-6 to 8e-6).</text>

  <line x1="834" y1="228" x2="834" y2="252" class="edge-blue" marker-end="url(#arr-blue)"/>

  <!-- Step 2: Merge SFT Adapter into Base -->
  <rect x="592" y="254" width="484" height="114" class="box-blue"/>
  <text x="608" y="276" class="lbl-bold">Step 2: Merge SFT LoRA into Base &amp; Attach Fresh DPO Adapter</text>
  <text x="608" y="296" class="mono-green">W_SFT &lt;- W_0 + (alpha_sft / r_sft) * B_SFT * A_SFT   [In BF16]</text>
  <text x="608" y="316" class="lbl">- Merge SFT adapter cleanly in 16-bit precision before DPO.</text>
  <text x="608" y="334" class="lbl">- Initialize fresh zero-B LoRA adapter (B_DPO = 0, A_DPO) on W_SFT.</text>
  <text x="608" y="352" class="mono-sm">At DPO step 0: pi_theta(y|x) == pi_ref(y|x) identically (Margin = 0.0)!</text>

  <line x1="834" y1="368" x2="834" y2="392" class="edge-green" marker-end="url(#arr-green)"/>

  <!-- Step 3: Single-Model Adapter Toggling -->
  <rect x="592" y="394" width="484" height="166" class="box-green"/>
  <text x="608" y="416" class="lbl-bold">Step 3: Single-Model DPO Training via disable_adapter() Toggle</text>

  <rect x="608" y="430" width="216" height="74" class="box-neutral"/>
  <text x="620" y="450" class="lbl-bold">Reference Forward Pass</text>
  <text x="620" y="468" class="mono-sm">with model.disable_adapter():</text>
  <text x="620" y="484" class="mono-sm">  ref_logp = model(x, y)</text>
  <text x="620" y="498" class="mono-green">Uses W_SFT (0 Extra GB!)</text>

  <rect x="840" y="430" width="220" height="74" class="box-neutral"/>
  <text x="852" y="450" class="lbl-bold">Policy Forward/Backward</text>
  <text x="852" y="468" class="mono-sm"># Adapter enabled (default)</text>
  <text x="852" y="484" class="mono-sm">pi_logp = model(x, y)</text>
  <text x="852" y="498" class="mono-green">Updates (B_DPO, A_DPO)</text>

  <text x="608" y="528" class="lbl">Alternative: Precompute ref_chosen_logps &amp; ref_rejected_logps to Parquet</text>
  <text x="608" y="546" class="mono-green">once before training -&gt; Cuts DPO step time by 42% &amp; saves 14 GB VRAM!</text>
</svg>

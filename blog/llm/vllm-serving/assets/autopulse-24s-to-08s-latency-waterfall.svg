<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" role="img" aria-label="AutoPulse CRM 24.0s to 0.8s Latency Optimization Waterfall">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; stroke-width: 1.5; rx: 12; }
      .box-blue { fill: #122136; stroke: #58a6ff; stroke-width: 1.5; rx: 8; }
      .box-green { fill: #11261e; stroke: #3fb950; stroke-width: 1.5; rx: 8; }
      .box-amber { fill: #271e12; stroke: #d29922; stroke-width: 1.5; rx: 8; }
      .box-purple { fill: #211832; stroke: #a371f7; stroke-width: 1.5; rx: 8; }
      .box-red { fill: #281419; stroke: #f85149; stroke-width: 1.5; rx: 8; }
      .box-neutral { fill: #1c2128; stroke: #484f58; stroke-width: 1.2; rx: 6; }
      .title { font-family: 'Manrope', 'DejaVu Sans', sans-serif; font-size: 18px; font-weight: 800; fill: #f0f6fc; }
      .subtitle { font-family: 'Manrope', 'DejaVu Sans', sans-serif; font-size: 12.5px; font-weight: 500; fill: #8b949e; }
      .sec-hdr { font-family: 'Manrope', 'DejaVu Sans', sans-serif; font-size: 14px; font-weight: 700; fill: #e6edf3; }
      .lbl-bold { font-family: 'Manrope', 'DejaVu Sans', sans-serif; font-size: 12px; font-weight: 700; fill: #f0f6fc; }
      .lbl { font-family: 'Manrope', 'DejaVu Sans', sans-serif; font-size: 11px; font-weight: 500; fill: #c9d1d9; }
      .mono { font-family: 'JetBrains Mono', 'DejaVu Sans Mono', monospace; font-size: 10.5px; fill: #79c0ff; }
      .mono-sm { font-family: 'JetBrains Mono', 'DejaVu Sans Mono', monospace; font-size: 9.6px; fill: #a5d6ff; }
      .mono-green { font-family: 'JetBrains Mono', 'DejaVu Sans Mono', monospace; font-size: 11px; font-weight: 700; fill: #56d364; }
      .mono-red { font-family: 'JetBrains Mono', 'DejaVu Sans Mono', monospace; font-size: 11px; font-weight: 700; fill: #ff7b72; }
      .mono-amber { font-family: 'JetBrains Mono', 'DejaVu Sans Mono', monospace; font-size: 10.5px; font-weight: 700; fill: #e3b341; }
    </style>
  </defs>

  <rect width="1120" height="600" class="bg"/>

  <!-- Main Header -->
  <text x="28" y="34" class="title">AutoPulse CRM Latency Waterfall: Cutting p95 Latency from 24.0s to 0.8s (30x Speedup)</text>
  <text x="28" y="54" class="subtitle">Multi-tenant automotive dealership copilot across 800+ vehicle models: PagedAttention, APC, AWQ Marlin, and Guided JSON FSM</text>

  <!-- Main Waterfall Panel -->
  <rect x="24" y="74" width="1072" height="504" class="panel"/>
  <text x="44" y="100" class="sec-hdr">Step-by-Step Production Latency Reduction Waterfall (p95 End-to-End Wall-Clock Time)</text>

  <!-- Stage 0: Baseline 24.0s -->
  <rect x="44" y="116" width="1032" height="76" class="box-neutral"/>
  <text x="60" y="138" class="lbl-bold">Stage 0: Baseline HF generate() FP16 + Static Batching (B=2) + 3 Serial LLM Calls</text>
  <text x="60" y="156" class="lbl">Queueing stalls + 3x uncached 4,200-token prefills + 420 verbose output tokens at 33 tok/s</text>
  <rect x="60" y="164" width="820" height="18" class="box-red"/>
  <text x="892" y="178" class="mono-red">24,000 ms (24.0s)</text>

  <!-- Stage 1: vLLM PagedAttention + Continuous Batching (6.4s) -->
  <rect x="44" y="204" width="1032" height="76" class="box-neutral"/>
  <text x="60" y="226" class="lbl-bold">Stage 1: vLLM PagedAttention (B_blk=16) + Continuous Batching + Single-Pass Prompt</text>
  <text x="60" y="244" class="lbl">Eliminates head-of-line queue stalls; 4.2x higher concurrent batch capacity; single LLM pass</text>
  <rect x="60" y="252" width="240" height="18" class="box-amber"/>
  <text x="312" y="266" class="mono-amber">6,400 ms (6.4s)  [-73.3% vs. Baseline | 3.75x Speedup]</text>

  <!-- Stage 2: Automatic Prefix Caching (2.9s) -->
  <rect x="44" y="292" width="1032" height="76" class="box-neutral"/>
  <text x="60" y="314" class="lbl-bold">Stage 2: Automatic Prefix Caching (APC) + Append-Only Context Layout</text>
  <text x="60" y="332" class="lbl">Freezes 3,400-token dealership system prompt + vehicle schemas at block b_0 (93.1% cache hit rate)</text>
  <rect x="60" y="340" width="124" height="18" class="box-blue"/>
  <text x="196" y="354" class="mono">2,900 ms (2.9s)  [Prefill cut 1,950ms -&gt; 160ms | 8.28x Cumulative Speedup]</text>

  <!-- Stage 3: W4A16 AWQ Marlin + FP8 KV Cache (1.45s) -->
  <rect x="44" y="380" width="1032" height="76" class="box-neutral"/>
  <text x="60" y="402" class="lbl-bold">Stage 3: W4A16 AWQ Quantization (Marlin CUDA Kernel) + FP8 E4M3 KV Cache</text>
  <text x="60" y="420" class="lbl">Cuts HBM weight bandwidth traffic by 3.8x during memory-bound decode (ITL: 15.8ms -&gt; 9.0ms/tok)</text>
  <rect x="60" y="428" width="72" height="18" class="box-purple"/>
  <text x="144" y="442" class="mono">1,450 ms (1.45s) [2.1x faster decode throughput | 16.5x Cumulative Speedup]</text>

  <!-- Stage 4: Async Parallel Pre-Fetch + Compact JSON FSM (0.80s) -->
  <rect x="44" y="468" width="1032" height="90" class="box-green"/>
  <text x="60" y="490" class="lbl-bold">Stage 4: Async Parallel DB/Vector Pre-Fetch (55ms) + xgrammar Compact JSON Schema</text>
  <text x="60" y="508" class="lbl">Replaces 420 tokens of verbose prose with 68 tokens of strict FSM-validated JSON fields</text>
  <rect x="60" y="518" width="44" height="20" class="box-green"/>
  <text x="116" y="533" class="mono-green">800 ms (0.80s p95!)  [55ms DB + 130ms Prefill + 615ms Decode | 96.7% Total Reduction (30x)]</text>
  <text x="60" y="550" class="mono-sm">Quality Guardrail Verified: Paired LLM-as-Judge showed +21% Semantic Similarity &amp; +35% Relevance (p &lt; 0.0001)</text>
</svg>

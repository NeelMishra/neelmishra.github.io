<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" role="img" aria-label="PagedAttention Block Tables, Copy-on-Write Prefix Sharing, and Continuous Batching vs Static Batching">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; stroke-width: 1.5; rx: 12; }
      .box-blue { fill: #122136; stroke: #58a6ff; stroke-width: 1.5; rx: 8; }
      .box-green { fill: #11261e; stroke: #3fb950; stroke-width: 1.5; rx: 8; }
      .box-amber { fill: #271e12; stroke: #d29922; stroke-width: 1.5; rx: 8; }
      .box-purple { fill: #211832; stroke: #a371f7; stroke-width: 1.5; rx: 8; }
      .box-red { fill: #281419; stroke: #f85149; stroke-width: 1.5; rx: 8; }
      .box-neutral { fill: #1c2128; stroke: #484f58; stroke-width: 1.2; rx: 6; }
      .title { font-family: 'Manrope', 'DejaVu Sans', sans-serif; font-size: 18px; font-weight: 800; fill: #f0f6fc; }
      .subtitle { font-family: 'Manrope', 'DejaVu Sans', sans-serif; font-size: 12.5px; font-weight: 500; fill: #8b949e; }
      .sec-hdr { font-family: 'Manrope', 'DejaVu Sans', sans-serif; font-size: 14px; font-weight: 700; fill: #e6edf3; }
      .lbl-bold { font-family: 'Manrope', 'DejaVu Sans', sans-serif; font-size: 12px; font-weight: 700; fill: #f0f6fc; }
      .lbl { font-family: 'Manrope', 'DejaVu Sans', sans-serif; font-size: 11px; font-weight: 500; fill: #c9d1d9; }
      .mono { font-family: 'JetBrains Mono', 'DejaVu Sans Mono', monospace; font-size: 10.5px; fill: #79c0ff; }
      .mono-sm { font-family: 'JetBrains Mono', 'DejaVu Sans Mono', monospace; font-size: 9.6px; fill: #a5d6ff; }
      .mono-green { font-family: 'JetBrains Mono', 'DejaVu Sans Mono', monospace; font-size: 10.5px; font-weight: 700; fill: #56d364; }
      .mono-red { font-family: 'JetBrains Mono', 'DejaVu Sans Mono', monospace; font-size: 10.5px; font-weight: 700; fill: #ff7b72; }
      .mono-amber { font-family: 'JetBrains Mono', 'DejaVu Sans Mono', monospace; font-size: 10px; font-weight: 700; fill: #e3b341; }
      .edge-blue { stroke: #58a6ff; stroke-width: 1.8; fill: none; }
      .edge-green { stroke: #3fb950; stroke-width: 1.8; fill: none; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#58a6ff"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#3fb950"/>
    </marker>
  </defs>

  <rect width="1120" height="600" class="bg"/>

  <!-- Main Header -->
  <text x="28" y="34" class="title">vLLM Internals: PagedAttention Virtual Block Tables &amp; Iteration-Level Continuous Batching</text>
  <text x="28" y="54" class="subtitle">Eliminating 60-80% KV-cache HBM fragmentation via 16-token non-contiguous paging, shared prefix blocks, and chunked prefill</text>

  <!-- LEFT PANEL: PagedAttention Block Table & Prefix Sharing -->
  <rect x="24" y="74" width="528" height="504" class="panel"/>
  <text x="44" y="100" class="sec-hdr">A. PagedAttention: Logical-to-Physical KV Block Mapping</text>

  <!-- Request A Logical View -->
  <rect x="44" y="116" width="218" height="122" class="box-blue"/>
  <text x="58" y="138" class="lbl-bold">Request A (Dealer #402)</text>
  <text x="58" y="156" class="mono-sm">Log Blk 0: [Sys Prompt 0..15]</text>
  <text x="58" y="174" class="mono-sm">Log Blk 1: [Schemas 16..31]</text>
  <text x="58" y="192" class="mono-sm">Log Blk 2: ["Check VIN 9A.."]</text>
  <text x="58" y="212" class="mono-green">Block Table A: [P_7, P_2, P_14]</text>
  <text x="58" y="228" class="lbl">Internal waste: only 3/16 slots!</text>

  <!-- Request B Logical View -->
  <rect x="44" y="252" width="218" height="122" class="box-purple"/>
  <text x="58" y="274" class="lbl-bold">Request B (Dealer #819)</text>
  <text x="58" y="292" class="mono-sm">Log Blk 0: [Sys Prompt 0..15]</text>
  <text x="58" y="310" class="mono-sm">Log Blk 1: [Schemas 16..31]</text>
  <text x="58" y="328" class="mono-sm">Log Blk 2: ["Brake pad SKU"]</text>
  <text x="58" y="348" class="mono-green">Block Table B: [P_7, P_2, P_9]</text>
  <text x="58" y="364" class="lbl">Shares P_7 &amp; P_2 (Zero Prefill!)</text>

  <!-- Physical HBM Pool (Right side of Left Panel) -->
  <rect x="292" y="116" width="240" height="258" class="box-green"/>
  <text x="308" y="138" class="lbl-bold">Physical HBM Block Pool</text>
  <text x="308" y="154" class="mono-sm">(16 tokens / block = 2 MiB)</text>

  <rect x="308" y="166" width="208" height="44" class="box-neutral"/>
  <text x="320" y="185" class="mono-green">Phys Blk P_2 (Shared Schema)</text>
  <text x="320" y="201" class="mono-amber">ref_count = 2 | Hash: 8f3a..</text>

  <rect x="308" y="218" width="208" height="44" class="box-neutral"/>
  <text x="320" y="237" class="mono-green">Phys Blk P_7 (Shared SysPrompt)</text>
  <text x="320" y="253" class="mono-amber">ref_count = 2 | Hash: 1c9d..</text>

  <rect x="308" y="270" width="208" height="42" class="box-neutral"/>
  <text x="320" y="288" class="mono-sm">Phys Blk P_9  (Req B Tail)</text>
  <text x="320" y="303" class="lbl">ref_count = 1 | 11/16 filled</text>

  <rect x="308" y="320" width="208" height="42" class="box-neutral"/>
  <text x="320" y="338" class="mono-sm">Phys Blk P_14 (Req A Tail)</text>
  <text x="320" y="353" class="lbl">ref_count = 1 | 13/16 filled</text>

  <line x1="262" y1="188" x2="290" y2="188" class="edge-green" marker-end="url(#arr-green)"/>
  <line x1="262" y1="312" x2="290" y2="312" class="edge-blue" marker-end="url(#arr-blue)"/>

  <!-- KV Memory Formula Box -->
  <rect x="44" y="390" width="488" height="168" class="box-neutral"/>
  <text x="60" y="412" class="lbl-bold">Exact GQA KV-Cache Sizing &amp; Fragmentation Savings</text>
  <text x="60" y="434" class="mono-green">Bytes_KV(S, B) = 2 * L * n_kv * d_head * bytes(dtype) * S * B</text>
  <text x="60" y="454" class="mono-sm">Llama-3-8B (L=32, n_kv=8, d=128, BF16): 128 KiB/tok (64 KiB/tok in FP8)</text>
  <text x="60" y="476" class="lbl">- Contiguous Pre-Allocation: Wastes 62-78% of HBM on unused L_max slots.</text>
  <text x="60" y="494" class="lbl">- PagedAttention (B=16): Bounds waste to &lt;= 15 tokens/seq (&lt; 3.8% waste).</text>
  <text x="60" y="514" class="mono-green">- Automatic Prefix Caching (APC): 93.1% cache hit on 3,400-tok CRM prompt</text>
  <text x="60" y="534" class="mono-amber">- Unlocks 4.2x larger concurrent batch size B on the same 80 GB GPU!</text>

  <!-- RIGHT PANEL: Static vs Continuous Batching + Chunked Prefill -->
  <rect x="572" y="74" width="524" height="504" class="panel"/>
  <text x="592" y="100" class="sec-hdr">B. Static Batching vs. Continuous Batching &amp; Chunked Prefill</text>

  <!-- 1. Static Batching -->
  <rect x="592" y="116" width="484" height="156" class="box-red"/>
  <text x="608" y="138" class="lbl-bold">1. Naive Static Batching (Head-of-Line Blocking &amp; Idle GPU Slots)</text>

  <rect x="608" y="150" width="136" height="24" class="box-blue"/>
  <text x="676" y="166" text-anchor="middle" class="mono-sm">Req 1 (Finishes T=40)</text>
  <rect x="748" y="150" width="312" height="24" class="box-neutral"/>
  <text x="904" y="166" text-anchor="middle" class="mono-red">Idle Slot Waiting for Req 2 (460 steps)</text>

  <rect x="608" y="180" width="452" height="24" class="box-purple"/>
  <text x="834" y="196" text-anchor="middle" class="mono-sm">Req 2 (Long Generation: Finishes at T = 500 tokens)</text>

  <rect x="608" y="210" width="190" height="24" class="box-amber"/>
  <text x="703" y="226" text-anchor="middle" class="mono-sm">Req 3 (Finishes T=110)</text>
  <rect x="802" y="210" width="258" height="24" class="box-neutral"/>
  <text x="931" y="226" text-anchor="middle" class="mono-red">Idle Slot Waiting for Req 2 (390 steps)</text>

  <text x="608" y="256" class="mono-red">Queue Stall: Req 4 arriving at t=50ms waits until T=500 completes!</text>

  <!-- 2. Continuous Batching + Chunked Prefill -->
  <rect x="592" y="288" width="484" height="270" class="box-green"/>
  <text x="608" y="310" class="lbl-bold">2. Iteration-Level Continuous Batching + Chunked Prefill</text>

  <rect x="608" y="324" width="136" height="26" class="box-blue"/>
  <text x="676" y="341" text-anchor="middle" class="mono-sm">Req 1 (&lt;eos&gt; at T=40)</text>
  <rect x="748" y="324" width="152" height="26" class="box-green"/>
  <text x="824" y="341" text-anchor="middle" class="mono-sm">Req 4 Admitted T=41!</text>
  <rect x="904" y="324" width="156" height="26" class="box-amber"/>
  <text x="982" y="341" text-anchor="middle" class="mono-sm">Req 6 Admitted T=120!</text>

  <rect x="608" y="356" width="452" height="26" class="box-purple"/>
  <text x="834" y="373" text-anchor="middle" class="mono-sm">Req 2 (Streams tokens continuously alongside newly admitted requests)</text>

  <rect x="608" y="388" width="190" height="26" class="box-amber"/>
  <text x="703" y="405" text-anchor="middle" class="mono-sm">Req 3 (&lt;eos&gt; at T=110)</text>
  <rect x="802" y="388" width="258" height="26" class="box-blue"/>
  <text x="931" y="405" text-anchor="middle" class="mono-sm">Req 5 Admitted Immediately at T=111!</text>

  <rect x="608" y="428" width="452" height="114" class="box-neutral"/>
  <text x="622" y="448" class="lbl-bold">Chunked Prefill (--enable-chunked-prefill):</text>
  <text x="622" y="468" class="lbl">- Splits incoming uncached prompt tokens into fixed chunks (e.g. 512 tok)</text>
  <text x="622" y="484" class="lbl">  and piggybacks them onto active decode steps in a single fused kernel.</text>
  <text x="622" y="504" class="mono-green">- Zero prefill stall spikes: Inter-Token Latency jitter stays &lt; 12 ms</text>
  <text x="622" y="522" class="mono-green">- Maximizes Tensor Core utilization during memory-bound decode steps</text>
</svg>

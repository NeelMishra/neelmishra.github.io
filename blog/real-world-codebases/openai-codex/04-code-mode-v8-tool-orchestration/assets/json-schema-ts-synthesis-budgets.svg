<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 495" role="img" aria-labelledby="title desc">
  <title id="title">JSON Schema to Ambient TypeScript Synthesis, Four-Budget Anti-Blowup Guards &amp; code_mode_only Exposure</title>
  <desc id="desc">Architecture diagram showing how Codex compiles Draft 2020-12 MCP JSON Schemas into compact ambient TypeScript tool declarations under four expansion budgets, hides nested tools from top-level LLM schemas in code_mode_only mode, and exposes deferred third-party tools via BM25 tool_search.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arr-sky" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <rect width="980" height="495" rx="16" fill="url(#bg)" stroke="#1e293b" stroke-width="1.5"/>

  <text x="32" y="38" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">JSON Schema → Ambient TypeScript Synthesis &amp; code_mode_only Discovery</text>
  <text x="32" y="58" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">code-mode-protocol/src/json_schema_types.rs:8-540 · description.rs:279-541 · core/src/tools/spec_plan.rs:192-292, 855-1095</text>

  <!-- Left: Raw MCP / Built-in JSON Schemas -->
  <rect x="30" y="80" width="275" height="235" rx="12" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <text x="46" y="106" fill="#cbd5e1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13.5" font-weight="700">1. Raw Tool &amp; MCP Schemas</text>

  <rect x="46" y="122" width="243" height="82" rx="8" fill="#1e293b" stroke="#64748b"/>
  <text x="58" y="142" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700">Hostile Draft 2020-12 Inputs</text>
  <text x="58" y="160" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">• Cyclic $ref (#/$defs/TreeNode)</text>
  <text x="58" y="176" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">• Diamond DAG $ref fan-out</text>
  <text x="58" y="192" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">• Nested $id scope + huge consts</text>

  <rect x="46" y="218" width="243" height="80" rx="8" fill="#1e293b" stroke="#38bdf8"/>
  <text x="58" y="238" fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700">MCP CallToolResult Wrapper</text>
  <text x="58" y="256" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">content: object[], isError: bool</text>
  <text x="58" y="272" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">_meta: object, structuredContent</text>
  <text x="58" y="288" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">Detected structurally (line 502)!</text>

  <line x1="305" y1="197" x2="338" y2="197" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr-sky)"/>

  <!-- Middle: JsonSchemaTypeRenderer 4-Budget Firewall -->
  <rect x="344" y="80" width="312" height="235" rx="12" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="362" y="106" fill="#fbbf24" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13.5" font-weight="700">2. Four-Budget Type Renderer</text>

  <rect x="362" y="122" width="276" height="40" rx="6" fill="#1e293b" stroke="#fbbf24"/>
  <text x="372" y="139" fill="#fde68a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="700">Per-Path Cycle Cap = 2</text>
  <text x="372" y="154" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">Unrolls 1 nested level, then → unknown</text>

  <rect x="362" y="169" width="276" height="40" rx="6" fill="#1e293b" stroke="#fbbf24"/>
  <text x="372" y="186" fill="#fde68a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="700">Global DAG $ref Cap = 32</text>
  <text x="372" y="201" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">Defeats exponential Billion-Laughs DAGs</text>

  <rect x="362" y="216" width="276" height="40" rx="6" fill="#1e293b" stroke="#fbbf24"/>
  <text x="372" y="233" fill="#fde68a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="700">Work Budget = 4 × 16 KB (64 KB)</text>
  <text x="372" y="248" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">Pre-checks 6×len+2 literal escape bound</text>

  <rect x="362" y="263" width="276" height="38" rx="6" fill="#172554" stroke="#60a5fa"/>
  <text x="372" y="280" fill="#bfdbfe" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="700">Nested $id Resource Guard</text>
  <text x="372" y="294" fill="#93c5fd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">Blocks inner #/... refs hitting outer root</text>

  <line x1="656" y1="197" x2="689" y2="197" stroke="#34d399" stroke-width="2" marker-end="url(#arr-emerald)"/>

  <!-- Right: Synthesized Ambient TypeScript Surface -->
  <rect x="695" y="80" width="255" height="235" rx="12" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="713" y="106" fill="#34d399" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13.5" font-weight="700">3. Model-Visible TS Surface</text>

  <rect x="713" y="122" width="219" height="80" rx="8" fill="#064e3b" stroke="#34d399"/>
  <text x="724" y="141" fill="#6ee7b7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="700">Top-Level tools[] Array</text>
  <text x="724" y="159" fill="#d1fae5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">• exec (raw JS + // @exec)</text>
  <text x="724" y="176" fill="#d1fae5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">• wait (cell_idyields)</text>
  <text x="724" y="192" fill="#a7f3d0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">80+ nested tools hidden!</text>

  <rect x="713" y="214" width="219" height="86" rx="8" fill="#1e293b" stroke="#34d399"/>
  <text x="724" y="233" fill="#6ee7b7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="700">declare const tools: { ... }</text>
  <text x="724" y="250" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">Shared CallToolResult&lt;T&gt;</text>
  <text x="724" y="266" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">Sorted props + // doc lines</text>
  <text x="724" y="282" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">Promise&lt;CallToolResult&lt;S&gt;&gt;</text>

  <!-- Bottom Panel: ToolExposure Lattice & Deferred BM25 Discovery -->
  <rect x="30" y="333" width="920" height="138" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="48" y="359" fill="#38bdf8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700">4. Six-State ToolExposure Lattice &amp; Strict Third-Party Deferral (spec_plan.rs:192-292, 1019-1095)</text>

  <rect x="48" y="375" width="280" height="78" rx="8" fill="#1e293b" stroke="#475569"/>
  <text x="60" y="395" fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700">Enabled Nested Tools</text>
  <text x="60" y="413" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">Rendered inline in exec prompt</text>
  <text x="60" y="430" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">Callable on global tools.* in V8</text>

  <rect x="348" y="375" width="295" height="78" rx="8" fill="#172554" stroke="#38bdf8"/>
  <text x="360" y="395" fill="#bae6fd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700">Deferred 3P / MCP Tools</text>
  <text x="360" y="413" fill="#dbeafe" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">Omitted from upfront exec prompt!</text>
  <text x="360" y="430" fill="#93c5fd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">code_mode_only_strict_3p_tools</text>
  <text x="360" y="445" fill="#93c5fd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">overrides MCP omit_tools_from</text>

  <line x1="643" y1="414" x2="676" y2="414" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr-sky)"/>

  <rect x="682" y="375" width="248" height="78" rx="8" fill="#064e3b" stroke="#34d399"/>
  <text x="694" y="395" fill="#6ee7b7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700">In-V8 BM25 Discovery</text>
  <text x="694" y="413" fill="#d1fae5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">await tools.tool_search({</text>
  <text x="694" y="429" fill="#d1fae5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">  query: "...", limit: 8</text>
  <text x="694" y="445" fill="#d1fae5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">}) → returns TS signatures!</text>
</svg>

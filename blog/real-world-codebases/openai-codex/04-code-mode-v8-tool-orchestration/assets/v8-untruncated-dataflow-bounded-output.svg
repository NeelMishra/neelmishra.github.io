<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 510" role="img" aria-labelledby="title desc">
  <title id="title">Untruncated V8 Heap Dataflow vs. Two-Stage BoundedOutput Retention</title>
  <desc id="desc">Architecture diagram contrasting untruncated nested tool payloads flowing into V8 heap memory via code_mode_result() against explicit emission helpers (text, image, audio) entering BoundedOutput (1 MiB text / 4 KiB PartialText blocks, 8 MiB images, 62 MiB audio, 32K items) and token-boundary rendering.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arr-sky" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
    <marker id="arr-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#fb7185"/>
    </marker>
  </defs>

  <rect width="980" height="510" rx="16" fill="url(#bg)" stroke="#1e293b" stroke-width="1.5"/>

  <text x="32" y="38" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">Bypassing the LLM Context Window: Untruncated V8 Heap vs. Two-Stage BoundedOutput</text>
  <text x="32" y="58" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">core/src/tools/context.rs:208-258 · code_mode/mod.rs:338-422 · code-mode-runtime/src/output/{output_collection,output_render}.rs</text>

  <!-- Left: Nested Tool Dispatch in Core -->
  <rect x="28" y="80" width="275" height="238" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="44" y="106" fill="#38bdf8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13.5" font-weight="700">1. Nested Tool Dispatch (Core)</text>

  <rect x="44" y="120" width="243" height="84" rx="8" fill="#1e293b" stroke="#fb7185" stroke-dasharray="4 3"/>
  <text x="56" y="140" fill="#fda4af" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="700">Direct LLM Path (Bypassed!)</text>
  <text x="56" y="157" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">to_response_item() → truncates to</text>
  <text x="56" y="173" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">TruncationPolicy &amp; dumps every</text>
  <text x="56" y="189" fill="#fda4af" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">intermediate call into LLM prompt</text>

  <rect x="44" y="216" width="243" height="88" rx="8" fill="#064e3b" stroke="#34d399"/>
  <text x="56" y="236" fill="#6ee7b7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="700">Code Mode Path (code_mode_result)</text>
  <text x="56" y="254" fill="#d1fae5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">submit_nested_tool (mod.rs:338)</text>
  <text x="56" y="270" fill="#d1fae5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">Returns RAW untruncated JsonValue</text>
  <text x="56" y="286" fill="#a7f3d0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">0 prompt tokens consumed!</text>

  <line x1="303" y1="260" x2="338" y2="260" stroke="#34d399" stroke-width="2.2" marker-end="url(#arr-emerald)"/>

  <!-- Middle: V8 Isolate Heap & Explicit Emission Gate -->
  <rect x="344" y="80" width="290" height="238" rx="12" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="360" y="106" fill="#34d399" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13.5" font-weight="700">2. V8 Isolate Heap &amp; Output Gate</text>

  <rect x="360" y="120" width="258" height="90" rx="8" fill="#1e293b" stroke="#38bdf8"/>
  <text x="372" y="140" fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="700">Local JS Compute Over MBs of JSON</text>
  <text x="372" y="158" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">const prs = await tools.github_prs();</text>
  <text x="372" y="174" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">const hits = prs.structuredContent</text>
  <text x="372" y="190" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">  .items.filter(p =&gt; p.draft === false);</text>
  <text x="372" y="204" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5">globalThis.console DELETED (globals.rs:20)</text>

  <rect x="360" y="222" width="258" height="82" rx="8" fill="#172554" stroke="#60a5fa"/>
  <text x="372" y="242" fill="#bfdbfe" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="700">Explicit Emission Helpers Only</text>
  <text x="372" y="259" fill="#dbeafe" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">• text(val) / notify(val)</text>
  <text x="372" y="275" fill="#dbeafe" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">• image(dataUri) [http/s blocked!]</text>
  <text x="372" y="291" fill="#dbeafe" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">• audio(dataUri) / generatedImage()</text>

  <line x1="634" y1="263" x2="669" y2="263" stroke="#fbbf24" stroke-width="2.2" marker-end="url(#arr-amber)"/>

  <!-- Right: BoundedOutput Session Collector -->
  <rect x="675" y="80" width="277" height="238" rx="12" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="691" y="106" fill="#fbbf24" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13.5" font-weight="700">3. BoundedOutput (Host Collector)</text>

  <rect x="691" y="120" width="245" height="90" rx="8" fill="#1e293b" stroke="#fbbf24"/>
  <text x="703" y="140" fill="#fde68a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="700">4 Orthogonal Per-Observation Caps</text>
  <text x="703" y="157" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">• Text: 1 MiB (512K head + 512K tail)</text>
  <text x="703" y="173" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">• Images: 8 MiB inline data: URIs</text>
  <text x="703" y="189" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">• Audio: 62 MiB encoded data: URIs</text>
  <text x="703" y="204" fill="#fde68a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">• Logical Items: 32,768 (16K + 16K)</text>

  <rect x="691" y="222" width="245" height="82" rx="8" fill="#1e293b" stroke="#475569"/>
  <text x="703" y="242" fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="700">O(1) Rolling Tail (PartialText)</text>
  <text x="703" y="259" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">4,096 B VecDeque&lt;String&gt; blocks +</text>
  <text x="703" y="275" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">front_offset (UTF-8 ceil boundary)</text>
  <text x="703" y="291" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">Batch gap sweep at ≥ 4,096 gaps</text>

  <!-- Bottom: Observation Boundary Rendering & Positioned Omission Notices -->
  <rect x="28" y="336" width="924" height="150" rx="12" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <text x="46" y="362" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700">4. Observation-Boundary Token Rendering &amp; Positioned Loss Notices (output_render.rs:33-166)</text>

  <rect x="46" y="378" width="275" height="92" rx="8" fill="#1e293b" stroke="#38bdf8"/>
  <text x="58" y="398" fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="700">CollectedOutput { items, gaps }</text>
  <text x="58" y="416" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">Drained on yield / result / error</text>
  <text x="58" y="432" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">Tracks OutputBoundary { item_index,</text>
  <text x="58" y="448" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">text_offset } alongside retained items</text>

  <line x1="321" y1="424" x2="354" y2="424" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr-sky)"/>

  <rect x="360" y="378" width="275" height="92" rx="8" fill="#1e293b" stroke="#fbbf24"/>
  <text x="372" y="398" fill="#fde68a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="700">Outer Token Budget + Gap Splicing</text>
  <text x="372" y="416" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">mixed_output_at_token_boundaries()</text>
  <text x="372" y="432" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">≤ 4 gaps: exact positioned notices</text>
  <text x="372" y="448" fill="#fde68a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">≥ 5 gaps: 1 observation-wide summary</text>

  <line x1="635" y1="424" x2="668" y2="424" stroke="#34d399" stroke-width="2" marker-end="url(#arr-emerald)"/>

  <rect x="674" y="378" width="260" height="92" rx="8" fill="#064e3b" stroke="#34d399"/>
  <text x="686" y="398" fill="#6ee7b7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="700">Core Model Sanitization</text>
  <text x="686" y="416" fill="#d1fae5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">sanitize_image_detail_items()</text>
  <text x="686" y="432" fill="#d1fae5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">Downgrades ImageDetail::Original</text>
  <text x="686" y="448" fill="#a7f3d0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">Compact distilled output → LLM</text>
</svg>

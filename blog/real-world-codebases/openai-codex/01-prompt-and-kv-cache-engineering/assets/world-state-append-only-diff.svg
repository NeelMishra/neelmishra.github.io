<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400" font-family="Manrope, DejaVu Sans, -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <linearGradient id="bgWs1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
    <marker id="arGrn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <rect width="920" height="400" rx="12" fill="url(#bgWs1)" stroke="#334155" stroke-width="1.5"/>

  <!-- Left Panel: Naive Prefix Mutation -->
  <rect x="18" y="18" width="434" height="364" rx="8" fill="#0b1120" stroke="#334155" stroke-width="1"/>
  <text x="32" y="42" fill="#fda4af" font-size="12.8" font-weight="700">A. Naive Harness: Prefix Re-Templating</text>
  <text x="32" y="58" fill="#94a3b8" font-size="9.2">Mutating system prompt on CWD / mode / permission change busts KV cache</text>

  <text x="32" y="80" fill="#cbd5e1" font-size="8.8" font-weight="700">Step 12 (80,000 tokens in GPU KV Cache)</text>
  <rect x="32" y="88" width="96" height="34" rx="5" fill="#064e3b" stroke="#10b981" stroke-width="1.2"/>
  <text x="80" y="109" fill="#d1fae5" font-size="8.1" font-weight="600" text-anchor="middle">System (cwd=/a)</text>
  <rect x="132" y="88" width="84" height="34" rx="5" fill="#064e3b" stroke="#10b981" stroke-width="1.2"/>
  <text x="174" y="109" fill="#d1fae5" font-size="8.1" font-weight="600" text-anchor="middle">Tools[1..40]</text>
  <rect x="220" y="88" width="216" height="34" rx="5" fill="#064e3b" stroke="#10b981" stroke-width="1.2"/>
  <text x="328" y="109" fill="#d1fae5" font-size="8.1" font-weight="600" text-anchor="middle">Turns 1..11 History (74k tok)</text>

  <line x1="80" y1="126" x2="80" y2="154" stroke="#f43f5e" stroke-width="1.5" marker-end="url(#arRed)"/>
  <text x="92" y="145" fill="#fda4af" font-size="8.3" font-weight="600">User toggles Plan Mode or cd /a/sub -&gt; byte 140 mutates!</text>

  <text x="32" y="174" fill="#fda4af" font-size="8.8" font-weight="700">Step 13 (0% Prefix Hit after token 35!)</text>
  <rect x="32" y="182" width="96" height="34" rx="5" fill="#4c0519" stroke="#f43f5e" stroke-width="1.4"/>
  <text x="80" y="203" fill="#fecdd3" font-size="8.1" font-weight="700" text-anchor="middle">System (cwd=/b)</text>
  <rect x="132" y="182" width="84" height="34" rx="5" fill="#3f1d2e" stroke="#f43f5e" stroke-width="1.2" stroke-dasharray="3 2"/>
  <text x="174" y="203" fill="#fda4af" font-size="8.1" text-anchor="middle">KV MISS!</text>
  <rect x="220" y="182" width="216" height="34" rx="5" fill="#3f1d2e" stroke="#f43f5e" stroke-width="1.2" stroke-dasharray="3 2"/>
  <text x="328" y="203" fill="#fda4af" font-size="8.1" text-anchor="middle">74k Tokens Re-Prefilled on GPU!</text>

  <rect x="32" y="234" width="404" height="130" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.1"/>
  <text x="46" y="254" fill="#fda4af" font-size="9.5" font-weight="700">Why Causal Attention Invalidates Everything Downstream</text>
  <text x="46" y="272" fill="#e2e8f0" font-size="8.2">• In causal self-attention, K_i and V_i at token i depend on every token j &lt;= i.</text>
  <text x="46" y="288" fill="#e2e8f0" font-size="8.2">• Changing 1 byte in base_instructions or Prompt.tools changes the radix</text>
  <text x="46" y="304" fill="#e2e8f0" font-size="8.2">  block hash from that block onward across the entire 80k-token window.</text>
  <text x="46" y="322" fill="#fda4af" font-size="8.3" font-weight="600">• Cost penalty: 5x-10x uncached token billing + +2.4s prefill latency spike</text>
  <text x="46" y="338" fill="#fda4af" font-size="8.3" font-weight="600">  every time an MCP server connects, CWD moves, or a prefix is approved.</text>

  <!-- Right Panel: Codex WorldState Tail Diffs -->
  <rect x="468" y="18" width="434" height="364" rx="8" fill="#0b1120" stroke="#334155" stroke-width="1"/>
  <text x="482" y="42" fill="#6ee7b7" font-size="12.8" font-weight="700">B. OpenAI Codex: WorldState Tail Diffs</text>
  <text x="482" y="58" fill="#94a3b8" font-size="9.2">IndexMap&lt;&amp;str, WorldStateSection&gt; + RFC 7386 JSON Merge Patch checkpoints</text>

  <text x="482" y="80" fill="#cbd5e1" font-size="8.8" font-weight="700">Step 13 (100% Prefix KV Cache Hit on All 80,000 Prior Tokens)</text>
  <rect x="482" y="88" width="292" height="34" rx="5" fill="#064e3b" stroke="#10b981" stroke-width="1.3"/>
  <text x="628" y="109" fill="#a7f3d0" font-size="8.2" font-weight="700" text-anchor="middle">Immutable Prefix [0..N]: 100% GPU KV Hit</text>
  <rect x="780" y="88" width="106" height="34" rx="5" fill="#082f49" stroke="#38bdf8" stroke-width="1.4"/>
  <text x="833" y="109" fill="#7dd3fc" font-size="8.1" font-weight="700" text-anchor="middle">+Tail Diff (+90t)</text>

  <!-- WorldState Engine Diagram -->
  <rect x="482" y="138" width="404" height="122" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="496" y="157" fill="#7dd3fc" font-size="9.5" font-weight="700">WorldState::render_history_diff(previous_snapshot, retained_items)</text>
  <text x="496" y="175" fill="#e2e8f0" font-size="8.1">1. Build ~18 ordered sections: top_level_tools, model, agents_md, permissions,</text>
  <text x="496" y="189" fill="#e2e8f0" font-size="8.1">   collaboration_mode, persistent_mode, environments, multi_agent_mode, ...</text>
  <text x="496" y="205" fill="#e2e8f0" font-size="8.1">2. Resolve PreviousSectionState&lt;T&gt;: Known(&amp;T) | Unknown (legacy) | Absent</text>
  <text x="496" y="221" fill="#e2e8f0" font-size="8.1">   (auto-detects if compaction evicted a required retained fragment!)</text>
  <text x="496" y="237" fill="#a7f3d0" font-size="8.1" font-weight="600">3. Unchanged sections return (None, vec![]) -&gt; zero tokens emitted!</text>
  <text x="496" y="251" fill="#7dd3fc" font-size="8.1" font-weight="600">4. Persist compact RFC 7386 merge_patch_from(prev) into rollout JSONL.</text>

  <!-- Rollout Checkpoint Box -->
  <rect x="482" y="272" width="404" height="92" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.2"/>
  <text x="496" y="291" fill="#6ee7b7" font-size="9.4" font-weight="700">Canonical Fingerprint &amp; Null-Deletion Invariant</text>
  <text x="496" y="308" fill="#d1fae5" font-size="8.1">• WorldStateHash: CRLF-&gt;LF + 64-bit BE length prefix + domain-tagged SHA-1</text>
  <text x="496" y="324" fill="#d1fae5" font-size="8.1">• Snapshot::serialize() MUST NOT emit JSON null (null = RFC 7386 delete)</text>
  <text x="496" y="340" fill="#a7f3d0" font-size="8.1" font-weight="600">• Resume/Fork reconstructs exact WorldStateSnapshot by replaying patches</text>
</svg>

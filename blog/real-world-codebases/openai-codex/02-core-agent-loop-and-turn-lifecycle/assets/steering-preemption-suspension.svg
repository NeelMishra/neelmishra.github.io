<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" role="img" aria-labelledby="title desc">
  <title id="title">Cooperative Steering, Instant WebSocket Preemption, and Serverless Turn Suspension</title>
  <desc id="desc">Architecture diagram contrasting cooperative step-boundary steering, in-band WebSocket response.interrupt with discard_partial_items, and split-brain-free serverless turn suspension in OpenAI Codex.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arr-sky" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arr-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#a78bfa"/>
    </marker>
  </defs>

  <rect width="980" height="500" rx="16" fill="url(#bg)" stroke="#1e293b" stroke-width="1.5"/>

  <text x="32" y="38" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">Mid-Turn Control &amp; Recovery: Steering, discard_partial_items Preemption &amp; Suspension</text>
  <text x="32" y="58" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">input_queue.rs · turn.rs:494-560, 2920-2945 · responses_websocket.rs:812-891 · turn_suspension.rs</text>

  <!-- Left Column: Cooperative Steer vs Instant Preempt -->
  <rect x="28" y="76" width="452" height="256" rx="12" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.3"/>
  <text x="46" y="101" fill="#38bdf8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13.5" font-weight="700">1. Cooperative Steer vs. Instant Preemption</text>

  <rect x="46" y="116" width="416" height="86" rx="8" fill="#111827" stroke="#334155"/>
  <text x="60" y="136" fill="#34d399" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700">Cooperative Steer (Step-Boundary Drain)</text>
  <text x="60" y="156" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="10.5">UserInput → TurnState.pending_input (Activity::Steer)</text>
  <text x="60" y="174" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10.5">Stream + tools finish → get_pending_input() at top of</text>
  <text x="60" y="191" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10.5">next step → expands @mcp servers → continues turn!</text>

  <rect x="46" y="214" width="416" height="104" rx="8" fill="#1c1917" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="60" y="234" fill="#fbbf24" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700">Instant Preemption (watch_user_input + WebSocket)</text>
  <text x="60" y="254" fill="#fef3c7" font-family="ui-monospace, monospace" font-size="10.5">preempt.cancel() wakes stream.next().or_cancel(&amp;preempt)</text>
  <text x="60" y="273" fill="#fde68a" font-family="ui-monospace, monospace" font-size="10.5">WS TX: {"type":"response.interrupt",</text>
  <text x="60" y="290" fill="#fde68a" font-family="ui-monospace, monospace" font-size="10.5">        "mode":"discard_partial_items"}</text>
  <text x="60" y="308" fill="#a7f3d0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5">Keeps OutputItemDone history + warm TLS socket; drops partial tail!</text>

  <!-- Right Column: Turn-Phase Mailbox Gate -->
  <rect x="500" y="76" width="452" height="256" rx="12" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.3"/>
  <text x="518" y="101" fill="#c4b5fd" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13.5" font-weight="700">2. Turn-Phase Mailbox Gate &amp; Metadata Firewall</text>

  <rect x="518" y="116" width="416" height="96" rx="8" fill="#111827" stroke="#334155"/>
  <text x="532" y="136" fill="#a78bfa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700">Phase-Sensitive Subagent Mail (MailboxDeliveryPhase)</text>
  <text x="532" y="156" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="10.5">• Commentary / PartialAnswer / ToolCall:</text>
  <text x="544" y="173" fill="#34d399" font-family="ui-monospace, monospace" font-size="10.5">accept_mailbox_delivery → folded into current turn</text>
  <text x="532" y="191" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="10.5">• MessagePhase::FinalAnswer (+ queue-only mail):</text>
  <text x="544" y="206" fill="#fbbf24" font-family="ui-monospace, monospace" font-size="10.5">MailboxDeliveryPhase::NextTurn (no wasted re-sample!)</text>

  <rect x="518" y="224" width="416" height="94" rx="8" fill="#111827" stroke="#ef4444" stroke-width="1.1"/>
  <text x="532" y="244" fill="#fca5a5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700">Serde Boundary Firewall (turn_input_response_item)</text>
  <text x="532" y="264" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="10.5">Serialize: Err if envelope.metadata.is_some()</text>
  <text x="532" y="283" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="10.5">Deserialize: strips forged "metadata" → None</text>
  <text x="532" y="303" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5">Blocks external callers from spoofing harness_authored flags.</text>

  <!-- Bottom Wide Panel: Zero-Split-Brain Turn Suspension -->
  <rect x="28" y="348" width="924" height="128" rx="12" fill="#0f172a" stroke="#34d399" stroke-width="1.4"/>
  <text x="46" y="373" fill="#34d399" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13.5" font-weight="700">3. Zero-Split-Brain Serverless Turn Suspension (turn_suspension.rs:13-111 &amp; daemon_recovery.rs)</text>

  <rect x="46" y="390" width="164" height="66" rx="8" fill="#064e3b" stroke="#34d399"/>
  <text x="128" y="413" text-anchor="middle" fill="#ecfdf5" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">1. Pre-Cancel Flush</text>
  <text x="128" y="431" text-anchor="middle" fill="#a7f3d0" font-family="ui-monospace, monospace" font-size="9.8">live_thread.flush()</text>
  <text x="128" y="446" text-anchor="middle" fill="#a7f3d0" font-family="ui-sans-serif, sans-serif" font-size="9.8">Fail? Keep turn live!</text>

  <path d="M 210 423 L 236 423" stroke="#34d399" stroke-width="1.6" marker-end="url(#arr-emerald)"/>

  <rect x="240" y="390" width="204" height="66" rx="8" fill="#1e293b" stroke="#38bdf8"/>
  <text x="342" y="413" text-anchor="middle" fill="#e0f2fe" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">2. Silent Cancel (No Event)</text>
  <text x="342" y="431" text-anchor="middle" fill="#bae6fd" font-family="ui-monospace, monospace" font-size="9.8">Recheck lock + cancel()</text>
  <text x="342" y="446" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, sans-serif" font-size="9.8">Omits terminal TurnAborted!</text>

  <path d="M 444 423 L 470 423" stroke="#38bdf8" stroke-width="1.6" marker-end="url(#arr-sky)"/>

  <rect x="474" y="390" width="214" height="66" rx="8" fill="#1e1b4b" stroke="#a78bfa"/>
  <text x="581" y="413" text-anchor="middle" fill="#ede9fe" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">3. Fence &amp; Close Writer</text>
  <text x="581" y="431" text-anchor="middle" fill="#ddd6fe" font-family="ui-monospace, monospace" font-size="9.8">shutdown_session_runtime()</text>
  <text x="581" y="446" text-anchor="middle" fill="#ddd6fe" font-family="ui-monospace, monospace" font-size="9.8">live_thread.flush() + shutdown()</text>

  <path d="M 688 423 L 714 423" stroke="#a78bfa" stroke-width="1.6" marker-end="url(#arr-violet)"/>

  <rect x="718" y="390" width="214" height="66" rx="8" fill="#1c1917" stroke="#fbbf24"/>
  <text x="825" y="413" text-anchor="middle" fill="#fef3c7" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">4. Handoff to New Worker</text>
  <text x="825" y="431" text-anchor="middle" fill="#fde68a" font-family="ui-monospace, monospace" font-size="9.8">Emit ShutdownComplete last</text>
  <text x="825" y="446" text-anchor="middle" fill="#fde68a" font-family="ui-sans-serif, sans-serif" font-size="9.8">Resumes same turn_id cleanly!</text>
</svg>

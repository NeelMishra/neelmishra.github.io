<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" role="img" aria-labelledby="title desc">
  <title id="title">Streaming Tool Overlap Timeline in OpenAI Codex</title>
  <desc id="desc">Comparison between naive post-stream batch execution and Codex's eager tokio::spawn on OutputItemDone combined with deterministic FuturesOrdered draining.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arr-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <rect width="980" height="470" rx="16" fill="url(#bg)" stroke="#1e293b" stroke-width="1.5"/>

  <text x="32" y="38" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">Streaming Tool Overlap: Eager tokio::spawn + Deterministic FuturesOrdered Drain</text>
  <text x="32" y="59" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">core/src/session/turn.rs:2870-3571 · stream_events_utils.rs:347-370 · tools/parallel.rs:272-429</text>

  <!-- Panel A: Naive Post-Stream Batch -->
  <rect x="28" y="76" width="924" height="106" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
  <text x="46" y="100" fill="#fca5a5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700">A. Naive Batch Harness — Waits for ResponseCompleted Before Spawning Tools</text>

  <text x="46" y="128" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="11">LLM Stream</text>
  <rect x="155" y="114" width="460" height="22" rx="5" fill="#1e293b" stroke="#64748b"/>
  <text x="385" y="129" text-anchor="middle" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="11">call_1 ··· call_2 ··· call_3 ··· ResponseCompleted (T_stream)</text>

  <text x="46" y="160" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="11">Tool Workers</text>
  <rect x="615" y="146" width="245" height="22" rx="5" fill="#3f1d2e" stroke="#f43f5e"/>
  <text x="737" y="161" text-anchor="middle" fill="#fecdd3" font-family="ui-monospace, monospace" font-size="11">join_all(call_1, call_2, call_3) [+max d_k]</text>
  <text x="872" y="161" fill="#f87171" font-family="ui-monospace, monospace" font-size="11" font-weight="700">Idle CPU!</text>

  <!-- Panel B: Codex Streaming Overlap -->
  <rect x="28" y="198" width="924" height="246" rx="12" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.4"/>
  <text x="46" y="223" fill="#38bdf8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700">B. OpenAI Codex — Eager Background Spawn at OutputItemDone + Emission-Order Drain</text>

  <!-- Stream track -->
  <text x="46" y="257" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="11">ResponseStream</text>
  <rect x="155" y="242" width="460" height="26" rx="6" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.2"/>
  <line x1="255" y1="242" x2="255" y2="268" stroke="#7dd3fc" stroke-width="1.5"/>
  <line x1="385" y1="242" x2="385" y2="268" stroke="#7dd3fc" stroke-width="1.5"/>
  <line x1="535" y1="242" x2="535" y2="268" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="205" y="259" text-anchor="middle" fill="#e0f2fe" font-family="ui-monospace, monospace" font-size="10.5">call_1 Done</text>
  <text x="320" y="259" text-anchor="middle" fill="#e0f2fe" font-family="ui-monospace, monospace" font-size="10.5">call_2 Done</text>
  <text x="460" y="259" text-anchor="middle" fill="#bae6fd" font-family="ui-monospace, monospace" font-size="10.5">ToolCallInputDelta (diff)</text>
  <text x="575" y="259" text-anchor="middle" fill="#e0f2fe" font-family="ui-monospace, monospace" font-size="10">Completed</text>

  <!-- Eager spawn arrows -->
  <path d="M 255 268 L 255 296" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arr-cyan)"/>
  <path d="M 385 268 L 385 330" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arr-cyan)"/>
  <path d="M 535 268 L 535 364" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arr-cyan)"/>

  <!-- Background worker tracks -->
  <text x="46" y="313" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="11">Worker #1 (Rw R)</text>
  <rect x="255" y="298" width="210" height="22" rx="5" fill="#064e3b" stroke="#34d399"/>
  <text x="360" y="313" text-anchor="middle" fill="#d1fae5" font-family="ui-monospace, monospace" font-size="10.5">read_file(a.rs) — finishes slow (t=465)</text>

  <text x="46" y="347" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="11">Worker #2 (Rw R)</text>
  <rect x="385" y="332" width="60" height="22" rx="5" fill="#064e3b" stroke="#34d399"/>
  <text x="415" y="347" text-anchor="middle" fill="#d1fae5" font-family="ui-monospace, monospace" font-size="10">grep (fast)</text>

  <text x="46" y="381" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="11">Worker #3 (Rw W)</text>
  <rect x="535" y="366" width="125" height="22" rx="5" fill="#451a03" stroke="#fbbf24"/>
  <text x="597" y="381" text-anchor="middle" fill="#fef3c7" font-family="ui-monospace, monospace" font-size="10">apply_patch (excl)</text>

  <!-- Drain phase -->
  <rect x="615" y="242" width="72" height="26" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.3"/>
  <text x="651" y="259" text-anchor="middle" fill="#e0e7ff" font-family="ui-monospace, monospace" font-size="10.5">Drain</text>

  <path d="M 465 309 L 625 270" stroke="#34d399" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr-emerald)"/>
  <path d="M 445 343 L 642 270" stroke="#34d399" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr-emerald)"/>
  <path d="M 660 377 L 660 270" stroke="#fbbf24" stroke-width="1.3" marker-end="url(#arr-amber)"/>

  <!-- Deterministic History Output Box -->
  <rect x="706" y="236" width="230" height="156" rx="10" fill="#111827" stroke="#34d399" stroke-width="1.3"/>
  <text x="720" y="258" fill="#34d399" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700">FuturesOrdered History Commit</text>
  <text x="720" y="279" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="10.5">1. Persist FunctionCall at Done</text>
  <text x="720" y="298" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="10.5">2. Spawn AbortOnDropHandle</text>
  <text x="720" y="317" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="10.5">3. Drain in emission order:</text>
  <text x="730" y="336" fill="#a7f3d0" font-family="ui-monospace, monospace" font-size="10.5">[out_1, out_2, out_3]</text>
  <text x="720" y="357" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5">Even though #2 finished before #1,</text>
  <text x="720" y="373" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5">rollout order stays 100% deterministic!</text>

  <!-- Saved Latency Callout -->
  <line x1="687" y1="416" x2="860" y2="416" stroke="#34d399" stroke-width="2" marker-start="url(#arr-emerald)" marker-end="url(#arr-emerald)"/>
  <text x="46" y="421" fill="#a7f3d0" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700">codex.tool_blocking shrinks to max(0, max(t_emit_k + d_k) - T_stream) →Saved Wall-Clock Latency</text>
</svg>

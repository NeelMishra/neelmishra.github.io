<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 415" width="920" height="415" font-family="Manrope, DejaVu Sans, -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <linearGradient id="bgSqEq" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arSqBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arSqGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arSqAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arSqRose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
  </defs>

  <rect width="920" height="415" rx="12" fill="url(#bgSqEq)" stroke="#334155" stroke-width="1.5"/>

  <!-- Left Panel: Asymmetric SQ/EQ Topology & Ownership Split -->
  <rect x="18" y="18" width="490" height="379" rx="8" fill="#0b1120" stroke="#334155" stroke-width="1"/>
  <text x="32" y="42" fill="#f8fafc" font-size="12.5" font-weight="700">A. Decoupled SessionIo vs. Arc&lt;Session&gt; Ownership Graph</text>
  <text x="32" y="58" fill="#94a3b8" font-size="9">core/src/session/mod.rs + codex_thread.rs — breaking the self-sender reference cycle</text>

  <!-- External Handle: CodexThread / SessionIo -->
  <rect x="32" y="76" width="186" height="196" rx="6" fill="#082f49" stroke="#38bdf8" stroke-width="1.3"/>
  <text x="44" y="95" fill="#7dd3fc" font-size="9.4" font-weight="700">CodexThread (Client Handle)</text>
  <text x="44" y="111" fill="#bae6fd" font-size="7.8">• residency_gate: Arc&lt;RwLock&lt;()&gt;&gt;</text>
  <text x="44" y="125" fill="#bae6fd" font-size="7.8">• _diagnostics_guard: GaugeGuard</text>

  <rect x="42" y="136" width="166" height="126" rx="5" fill="#0c4a6e" stroke="#7dd3fc" stroke-width="1"/>
  <text x="51" y="152" fill="#f8fafc" font-size="8.8" font-weight="700">SessionIo (Endpoint Bundle)</text>
  <text x="51" y="169" fill="#6ee7b7" font-size="7.8" font-weight="600">• tx_sub: Sender&lt;Submission&gt;</text>
  <text x="51" y="184" fill="#e0f2fe" font-size="7.8">• rx_event: Receiver&lt;Event&gt;</text>
  <text x="51" y="199" fill="#e0f2fe" font-size="7.8">• agent_status: watch::Receiver</text>
  <text x="51" y="214" fill="#fde68a" font-size="7.8">• session_loop_termination:</text>
  <text x="58" y="227" fill="#fef3c7" font-size="7.4">Shared&lt;BoxFuture&lt;'static, ()&gt;&gt;</text>
  <text x="51" y="248" fill="#fda4af" font-size="7.5" font-weight="600">Sole owner of tx_sub!</text>

  <!-- Channels in the Middle -->
  <line x1="218" y1="166" x2="298" y2="166" stroke="#10b981" stroke-width="1.8" marker-end="url(#arSqGreen)"/>
  <text x="223" y="158" fill="#6ee7b7" font-size="7.6" font-weight="700">SQ: bounded(512)</text>

  <line x1="298" y1="196" x2="218" y2="196" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arSqBlue)"/>
  <text x="221" y="210" fill="#7dd3fc" font-size="7.6" font-weight="700">EQ: unbounded()</text>

  <line x1="298" y1="232" x2="218" y2="232" stroke="#f59e0b" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arSqAmber)"/>
  <text x="223" y="246" fill="#fde68a" font-size="7.4">watch&lt;AgentStatus&gt;</text>

  <!-- Actor Core: submission_loop + Arc<Session> -->
  <rect x="302" y="76" width="192" height="196" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.3"/>
  <text x="314" y="95" fill="#6ee7b7" font-size="9.4" font-weight="700">submission_loop Task</text>
  <text x="314" y="111" fill="#d1fae5" font-size="7.8">• Owns sole rx_sub: Receiver</text>
  <text x="314" y="125" fill="#d1fae5" font-size="7.8">• Holds Arc&lt;Session&gt;</text>

  <rect x="312" y="136" width="172" height="126" rx="5" fill="#022c22" stroke="#34d399" stroke-width="1"/>
  <text x="321" y="152" fill="#f8fafc" font-size="8.8" font-weight="700">Session (Runtime State)</text>
  <text x="321" y="169" fill="#a7f3d0" font-size="7.8">• tx_event: Sender&lt;Event&gt;</text>
  <text x="321" y="184" fill="#a7f3d0" font-size="7.8">• state: Mutex&lt;SessionState&gt;</text>
  <text x="321" y="199" fill="#a7f3d0" font-size="7.8">• active_turn: Mutex&lt;Option&gt;</text>
  <text x="321" y="214" fill="#a7f3d0" font-size="7.8">• input_queue (watch wakeup)</text>
  <text x="321" y="232" fill="#fda4af" font-size="7.6" font-weight="700">ZERO tx_sub field on Session!</text>
  <text x="321" y="247" fill="#cbd5e1" font-size="7.4">No internal self-sender cycle.</text>

  <!-- Bottom Left Callout: Why Bounded SQ + Unbounded EQ -->
  <rect x="32" y="286" width="462" height="96" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.2"/>
  <text x="44" y="305" fill="#a5b4fc" font-size="9.2" font-weight="700">Why Bounded SQ (512) + Unbounded EQ Prevents Bidirectional Deadlock</text>
  <text x="44" y="322" fill="#e0e7ff" font-size="8">• Inbound SQ bounded(512) applies backpressure to runaway callers before heap blowup.</text>
  <text x="44" y="338" fill="#e0e7ff" font-size="8">• Outbound EQ unbounded() ensures sess.send_event() inside submission_loop or ActiveTurn</text>
  <text x="52" y="352" fill="#c7d2fe" font-size="7.8">NEVER awaits a slow UI consumer that is currently blocked sending an Op onto SQ!</text>
  <text x="44" y="368" fill="#fde68a" font-size="7.8" font-weight="600">• Drop all SessionIo clones -&gt; rx_sub.recv() == Err -&gt; automatic fallback teardown!</text>

  <!-- Right Panel: Submission Envelope Guards & Cancelled Startup RAII -->
  <rect x="522" y="18" width="380" height="379" rx="8" fill="#0b1120" stroke="#334155" stroke-width="1"/>
  <text x="536" y="42" fill="#f8fafc" font-size="12.5" font-weight="700">B. RAII Guards in Flight &amp; Startup</text>
  <text x="536" y="58" fill="#94a3b8" font-size="9">submission.rs + startup.rs — zero leaked resources on drop</text>

  <!-- Submission Struct -->
  <rect x="536" y="76" width="352" height="142" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="548" y="95" fill="#f8fafc" font-size="9.2" font-weight="700">Submission Envelope (session/submission.rs:9–22)</text>
  <text x="548" y="112" fill="#e2e8f0" font-size="8">• id: String + op: Op + turn_extension_init</text>
  <text x="548" y="128" fill="#7dd3fc" font-size="8">• trace: Option&lt;W3cTraceContext&gt; (span carrier across queue)</text>
  <text x="548" y="144" fill="#6ee7b7" font-size="8" font-weight="600">• residency_guard: Option&lt;OwnedRwLockReadGuard&lt;()&gt;&gt;</text>
  <text x="556" y="159" fill="#cbd5e1" font-size="7.6">Pins V2 subagent in RAM while mail sits in SQ; dropped only</text>
  <text x="556" y="172" fill="#cbd5e1" font-size="7.6">at handlers.rs:758 AFTER dispatch finishes (or on channel drop)!</text>
  <text x="548" y="190" fill="#fde68a" font-size="8">• message_delivery: Option&lt;MessageDelivery&gt;</text>
  <text x="556" y="204" fill="#cbd5e1" font-size="7.6">Abandoned automatically if receiver dies before dispatch.</text>

  <!-- SessionStartupGuard -->
  <rect x="536" y="232" width="352" height="150" rx="6" fill="#3f1d2e" stroke="#f43f5e" stroke-width="1.2"/>
  <text x="548" y="251" fill="#fda4af" font-size="9.2" font-weight="700">Cancelled Spawn Safety: SessionStartupGuard (startup.rs)</text>
  <text x="548" y="268" fill="#ffe4e6" font-size="7.9">What if caller cancels Session::spawn() mid-initialization?</text>
  <text x="548" y="286" fill="#6ee7b7" font-size="8" font-weight="700">Case 1: startup.io.get() is Some (loop already spawned)</text>
  <text x="556" y="301" fill="#ffe4e6" font-size="7.6">Commits LiveThreadInitGuard -&gt; sends Op::Interrupt -&gt; awaits</text>
  <text x="556" y="314" fill="#ffe4e6" font-size="7.6">io.shutdown_and_wait() via Shared SessionLoopTermination.</text>
  <text x="548" y="332" fill="#fde68a" font-size="8" font-weight="700">Case 2: startup.io.get() is None (loop never started)</text>
  <text x="556" y="347" fill="#ffe4e6" font-size="7.6">Calls shutdown_session_runtime() -&gt; marks trace Aborted -&gt;</text>
  <text x="556" y="360" fill="#ffe4e6" font-size="7.6">discards uncommitted persistence -&gt; completes tree teardown.</text>
</svg>

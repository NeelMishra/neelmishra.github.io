<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" role="img" aria-labelledby="title desc">
  <title id="title">Zero-TTFT generate:false WebSocket Prewarming in OpenAI Codex</title>
  <desc id="desc">Timeline showing how Codex overlaps local StepContext tool capture with WebSocket TLS dialing via tokio::try_join!, transmits a generate:false prefill warmup while the user types, and sends only the user message delta on Turn 1.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arr-sky" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <rect width="980" height="470" rx="16" fill="url(#bg)" stroke="#1e293b" stroke-width="1.5"/>

  <text x="32" y="38" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">Zero-TTFT Startup &amp; Resume: tokio::try_join! + generate:false GPU KV Prewarming</text>
  <text x="32" y="58" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">core/src/session/startup_prewarm.rs:209-460 · core/src/client.rs:2254-2298, 2438-2488</text>

  <!-- User Typing Window Banner -->
  <rect x="165" y="76" width="510" height="28" rx="6" fill="#1e293b" stroke="#64748b" stroke-dasharray="5 3"/>
  <text x="420" y="95" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">User Typing / Reading TUI (1.5s – 15s Human Think Time)</text>

  <rect x="685" y="76" width="265" height="28" rx="6" fill="#064e3b" stroke="#34d399"/>
  <text x="817" y="95" text-anchor="middle" fill="#ecfdf5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700">User Presses Enter (Turn 1)</text>

  <!-- Vertical Enter Line -->
  <line x1="680" y1="74" x2="680" y2="392" stroke="#34d399" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Swimlanes -->
  <text x="34" y="142" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="11">Local Host</text>
  <rect x="165" y="122" width="185" height="32" rx="6" fill="#1e1b4b" stroke="#818cf8"/>
  <text x="257" y="142" text-anchor="middle" fill="#e0e7ff" font-family="ui-monospace, monospace" font-size="10.5">capture_step_context (MCP)</text>

  <rect x="358" y="122" width="90" height="32" rx="6" fill="#111827" stroke="#64748b"/>
  <text x="403" y="142" text-anchor="middle" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="10">build_prompt</text>

  <text x="34" y="192" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="11">WebSocket</text>
  <rect x="165" y="172" width="185" height="32" rx="6" fill="#0c4a6e" stroke="#38bdf8"/>
  <text x="257" y="192" text-anchor="middle" fill="#e0f2fe" font-family="ui-monospace, monospace" font-size="10.5">preconnect_websocket (TLS)</text>

  <!-- try_join bracket -->
  <text x="257" y="218" text-anchor="middle" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="10">▲ tokio::try_join! (parallel) ▲</text>

  <!-- generate: false frame -->
  <rect x="456" y="172" width="206" height="32" rx="6" fill="#451a03" stroke="#fbbf24" stroke-width="1.3"/>
  <text x="559" y="192" text-anchor="middle" fill="#fef3c7" font-family="ui-monospace, monospace" font-size="10.5">response.create (generate:false)</text>

  <!-- GPU Replica lane -->
  <text x="34" y="258" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="11">GPU Replica</text>
  <path d="M 520 204 L 520 236" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <rect x="470" y="238" width="192" height="36" rx="6" fill="#064e3b" stroke="#34d399"/>
  <text x="566" y="254" text-anchor="middle" fill="#ecfdf5" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">Prefill Sys+Tools+History</text>
  <text x="566" y="268" text-anchor="middle" fill="#a7f3d0" font-family="ui-monospace, monospace" font-size="9.5">0 decode tokens → resp_warm</text>

  <!-- Turn 1 Delta Request -->
  <rect x="690" y="172" width="256" height="32" rx="6" fill="#065f46" stroke="#34d399" stroke-width="1.4"/>
  <text x="818" y="192" text-anchor="middle" fill="#ecfdf5" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">prev_id: resp_warm + [user_msg]</text>

  <path d="M 760 204 L 760 236" stroke="#34d399" stroke-width="1.5" marker-end="url(#arr-emerald)"/>
  <rect x="690" y="238" width="256" height="36" rx="6" fill="#0f766e" stroke="#5eead4"/>
  <text x="818" y="254" text-anchor="middle" fill="#f0fdfa" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">Prefill ONLY |u₁| → Decode Token 1!</text>
  <text x="818" y="268" text-anchor="middle" fill="#ccfbf1" font-family="ui-monospace, monospace" font-size="9.5">100% KV-cache hit on sticky GPU</text>

  <!-- Auxiliary Prewarms + Trace Invariant Cards -->
  <rect x="32" y="302" width="450" height="142" rx="10" fill="#0f172a" stroke="#334155"/>
  <text x="48" y="325" fill="#38bdf8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700">Deadline-Bounded Handoff (startup_prewarm.rs:84-180)</text>
  <text x="48" y="346" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="10.5">• PrewarmInput::Base (fresh) vs ::History (idle resume)</text>
  <text x="48" y="365" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="10.5">• Also prewarms V8 CodeMode host + Ed25519 auth tokens</text>
  <text x="48" y="384" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="10.5">• Fast Enter? Waits at most timeout - age_at_first_turn,</text>
  <text x="48" y="401" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="10.5">  then task.abort() &amp; falls back without stalling Turn 1</text>
  <text x="48" y="423" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5">Cancelled or shutdown session? AbortOnDropHandle cleans up.</text>

  <rect x="500" y="302" width="448" height="142" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="516" y="325" fill="#fbbf24" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700">The from_untraced_warmup Replay Invariant (client.rs:2264)</text>
  <text x="516" y="346" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="10.5">• Warmup sets InferenceTraceAttempt::disabled() so 0-token</text>
  <text x="516" y="363" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="10.5">  setup requests never pollute rollout trace logs.</text>
  <text x="516" y="384" fill="#fde68a" font-family="ui-monospace, monospace" font-size="10.5">• Wire frame on Turn 1: sends ONLY incremental [user_msg].</text>
  <text x="516" y="403" fill="#a7f3d0" font-family="ui-monospace, monospace" font-size="10.5">• Trace log on Turn 1: records FULL logical &amp;request so</text>
  <text x="516" y="420" fill="#a7f3d0" font-family="ui-monospace, monospace" font-size="10.5">  offline replay never loses base_instructions or tools!</text>
</svg>

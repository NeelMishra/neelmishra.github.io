<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 510" role="img" aria-labelledby="title desc">
  <title id="title">Five-Mode Context Compaction, Speculative Prefix Splicing &amp; Cross-Model comp_hash Handshakes</title>
  <desc id="desc">Diagram showing OpenAI Codex's three token watermarks (async threshold, post-turn threshold, hard auto-compact limit), the five compaction modes, atomic speculative prefix splicing of H[0..k] + live suffix H[k..], and previous-model comp_hash handshakes with current-model fallback.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arr-sky" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
    <marker id="arr-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#a78bfa"/>
    </marker>
  </defs>

  <rect width="980" height="510" rx="16" fill="url(#bg)" stroke="#1e293b" stroke-width="1.5"/>

  <text x="32" y="38" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">Five-Mode Context Compaction: Watermarks, Speculative Prefix Splicing &amp; comp_hash Handshakes</text>
  <text x="32" y="58" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">compact.rs · compact_remote_v2.rs · session/async_compaction.rs · session/mod.rs:4496-4631 · session/turn.rs:1491-1635</text>

  <!-- Section 1: 3-Watermark Ladder -->
  <rect x="30" y="78" width="920" height="106" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="48" y="102" fill="#38bdf8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13.5" font-weight="700">1. Three-Watermark Context Budget Ladder (context_window.rs:58-118 · i128 Overflow-Free Thresholds)</text>

  <rect x="48" y="116" width="275" height="54" rx="8" fill="#172554" stroke="#38bdf8"/>
  <text x="60" y="136" fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="700">Watermark 1: τ_async</text>
  <text x="60" y="154" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">Spawns speculative HTTP V2 compact</text>

  <line x1="323" y1="143" x2="352" y2="143" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr-sky)"/>

  <rect x="358" y="116" width="275" height="54" rx="8" fill="#1e1b4b" stroke="#a78bfa"/>
  <text x="370" y="136" fill="#c4b5fd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="700">Watermark 2: τ_post</text>
  <text x="370" y="154" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">PostTurn compact after final answer</text>

  <line x1="633" y1="143" x2="662" y2="143" stroke="#fbbf24" stroke-width="2" marker-end="url(#arr-amber)"/>

  <rect x="668" y="116" width="264" height="54" rx="8" fill="#451a03" stroke="#fbbf24"/>
  <text x="680" y="136" fill="#fde68a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="700">Watermark 3: τ_hard</text>
  <text x="680" y="154" fill="#fef3c7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">Adopts ready candidate or sync compact</text>

  <!-- Section 2: Speculative Async Prefix Splicing -->
  <rect x="30" y="200" width="555" height="285" rx="12" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="48" y="226" fill="#34d399" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700">2. Speculative Prefix Splicing (async_compaction.rs + mod.rs:4538)</text>

  <text x="48" y="252" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">At t_0 (τ_async crossed): Snapshot H[0..k] at generation g; foreground keeps running!</text>
  <rect x="48" y="262" width="310" height="34" rx="6" fill="#1e293b" stroke="#38bdf8"/>
  <text x="60" y="283" fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Captured Prefix H[0..k] (gen = g)</text>
  <rect x="364" y="262" width="202" height="34" rx="6" fill="#064e3b" stroke="#34d399" stroke-dasharray="4 3"/>
  <text x="374" y="283" fill="#6ee7b7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">+ Live Suffix H_now[k..]</text>

  <text x="48" y="320" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Side-channel ResponsesHttpExecutor (replays turn_state read-only):</text>
  <rect x="48" y="330" width="518" height="40" rx="6" fill="#172554" stroke="#60a5fa"/>
  <text x="60" y="354" fill="#dbeafe" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">compacted(H[0..k]) = RetainedMsgs(≤64k tok) || ResponseItem::Compaction</text>

  <text x="48" y="396" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">At checkpoint (CAS: history_version == g &amp;&amp; auth_owner matches):</text>
  <rect x="48" y="406" width="95" height="36" rx="6" fill="#1e293b" stroke="#94a3b8"/>
  <text x="56" y="428" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">prefix_ctx</text>
  <rect x="149" y="406" width="215" height="36" rx="6" fill="#172554" stroke="#38bdf8"/>
  <text x="159" y="428" fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="700">compacted(H[0..k]) + ctx</text>
  <rect x="370" y="406" width="196" height="36" rx="6" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
  <text x="380" y="428" fill="#6ee7b7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="700">Preserved H_now[k..]!</text>

  <text x="48" y="466" fill="#fcd34d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">Safety net: If spliced H_new still exceeds τ_hard, falls back once to Foreground V2!</text>

  <!-- Section 3: Cross-Model comp_hash Handshake -->
  <rect x="605" y="200" width="345" height="285" rx="12" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="623" y="226" fill="#c4b5fd" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700">3. Cross-Model comp_hash Handshake</text>

  <rect x="623" y="244" width="308" height="62" rx="8" fill="#1e293b" stroke="#a78bfa"/>
  <text x="635" y="264" fill="#ddd6fe" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700">Model Switch / Window Downshift</text>
  <text x="635" y="282" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">comp_hash(A) != comp_hash(B)</text>
  <text x="635" y="297" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">or W_A &gt; W_B &amp;&amp; T_active &gt;= W_B</text>

  <line x1="777" y1="306" x2="777" y2="330" stroke="#a78bfa" stroke-width="2" marker-end="url(#arr-violet)"/>

  <rect x="623" y="334" width="308" height="64" rx="8" fill="#172554" stroke="#38bdf8"/>
  <text x="635" y="354" fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700">Step 1: Compact via Previous Model A</text>
  <text x="635" y="372" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">Restores A's cyber_access_program</text>
  <text x="635" y="387" fill="#93c5fd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">Replacement baseline owned by Model B</text>

  <line x1="777" y1="398" x2="777" y2="418" stroke="#fbbf24" stroke-width="2" marker-end="url(#arr-amber)"/>

  <rect x="623" y="422" width="308" height="48" rx="8" fill="#451a03" stroke="#fbbf24"/>
  <text x="635" y="441" fill="#fde68a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700">Fallback: compact_model_fallback.rs</text>
  <text x="635" y="458" fill="#fef3c7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">If A fails (non-abort), retry once with B</text>
</svg>

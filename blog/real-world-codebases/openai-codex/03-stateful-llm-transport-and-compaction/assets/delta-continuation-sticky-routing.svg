<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 490" role="img" aria-labelledby="title desc">
  <title id="title">Delta-Only WebSocket Continuation, Exhaustive Property Diffing &amp; x-codex-turn-state Sticky Routing</title>
  <desc id="desc">Architecture diagram showing how Codex computes the server-known baseline I_{s-1} || O_{s-1}, validates exhaustive request properties, transmits only the delta items alongside previous_response_id and turn-scoped x-codex-turn-state, and drains in-band response.interrupt acknowledgements without closing the socket.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arr-sky" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
    <marker id="arr-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#fb7185"/>
    </marker>
  </defs>

  <rect width="980" height="490" rx="16" fill="url(#bg)" stroke="#1e293b" stroke-width="1.5"/>

  <text x="32" y="38" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">Delta-Only Continuation (previous_response_id), Sticky Routing &amp; In-Band Interrupts</text>
  <text x="32" y="58" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">core/src/client.rs:328-511, 1614-1687, 2602-2767 · codex-api/src/endpoint/responses_websocket.rs:812-975</text>

  <!-- Step s Logical Request & Baseline Diff Box -->
  <rect x="30" y="80" width="540" height="225" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="48" y="106" fill="#38bdf8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700">1. Client Baseline Verification: get_incremental_items (client.rs:1626-1657)</text>

  <!-- Server-Known Baseline Bar -->
  <text x="48" y="132" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">Server-Known Baseline B_{s-1} = last_request.input.chain(last_response.items_added):</text>
  <rect x="48" y="142" width="230" height="32" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="62" y="162" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">I_{s-1} (Prior Input Prefix)</text>
  <rect x="284" y="142" width="145" height="32" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-dasharray="4 3"/>
  <text x="296" y="162" fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">O_{s-1} (items_added)</text>

  <!-- Current Step s Input Bar -->
  <text x="48" y="198" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">Current Step s Logical Request I_s:</text>
  <rect x="48" y="208" width="230" height="34" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="62" y="229" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">Omitted (Matches I_{s-1})</text>
  <rect x="284" y="208" width="145" height="34" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="296" y="229" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">Omitted (= O_{s-1})</text>
  <rect x="435" y="208" width="118" height="34" rx="6" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
  <text x="447" y="229" fill="#6ee7b7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="700">Delta ΔI_s Only!</text>

  <!-- Exhaustive Property Gate -->
  <rect x="48" y="254" width="505" height="38" rx="6" fill="#172554" stroke="#3b82f6"/>
  <text x="60" y="271" fill="#bfdbfe" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Gate: responses_request_properties_mismatch (exhaustive struct destructuring)</text>
  <text x="60" y="285" fill="#93c5fd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">Mismatch / Compaction (InputShortened) =&gt; Safe fallback to full input[] on same warm socket</text>

  <!-- Right Column: Sticky Routing & Replica Pinning -->
  <rect x="595" y="80" width="355" height="225" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="613" y="106" fill="#fbbf24" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700">2. Turn-Scoped Sticky Replica Pinning</text>

  <rect x="613" y="122" width="318" height="72" rx="8" fill="#1e293b" stroke="#fbbf24"/>
  <text x="625" y="142" fill="#fde68a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="700">ModelClientSession (Scoped to 1 Turn)</text>
  <text x="625" y="160" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">turn_state: Arc&lt;OnceLock&lt;String&gt;&gt;</text>
  <text x="625" y="178" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">Guarded by auth_owner_generation == owner</text>

  <rect x="613" y="208" width="318" height="82" rx="8" fill="#064e3b" stroke="#34d399"/>
  <text x="625" y="228" fill="#6ee7b7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="700">Pinned Backend GPU Replica</text>
  <text x="625" y="246" fill="#d1fae5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">• Warm KV Cache for resp_{s-1}</text>
  <text x="625" y="264" fill="#d1fae5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">• Replayed on WS client_metadata &amp; HTTP retry</text>
  <text x="625" y="281" fill="#fcd34d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">• Dropped on TurnComplete (never leaks cross-turn!)</text>

  <line x1="553" y1="225" x2="608" y2="242" stroke="#34d399" stroke-width="2" marker-end="url(#arr-emerald)"/>

  <!-- Bottom Panel: In-Band response.interrupt & Two-Ack Drain Interlock -->
  <rect x="30" y="325" width="920" height="142" rx="12" fill="#0f172a" stroke="#fb7185" stroke-width="1.5"/>
  <text x="48" y="351" fill="#fb7185" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700">3. Socket-Preserving In-Band Preemption &amp; Two-Frame Drain Interlock (responses_websocket.rs:812-975)</text>

  <!-- Step boxes in bottom panel -->
  <rect x="48" y="368" width="255" height="80" rx="8" fill="#1e293b" stroke="#fb7185"/>
  <text x="60" y="388" fill="#fda4af" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="700">Client Sends In-Band Frame</text>
  <text x="60" y="407" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">type: "response.interrupt"</text>
  <text x="60" y="424" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">mode: "discard_partial_items"</text>
  <text x="60" y="440" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">awaiting_interrupt_ack = true</text>

  <line x1="303" y1="408" x2="348" y2="408" stroke="#fb7185" stroke-width="2" marker-end="url(#arr-rose)"/>

  <rect x="354" y="368" width="280" height="80" rx="8" fill="#1e293b" stroke="#fbbf24"/>
  <text x="366" y="388" fill="#fde68a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="700">Dual Terminal Barrier</text>
  <text x="366" y="407" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">1. Buffer response.completed</text>
  <text x="366" y="424" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">2. Wait response.interrupt.accepted</text>
  <text x="366" y="440" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">Prevents stray ack polluting Step s+1!</text>

  <line x1="634" y1="408" x2="679" y2="408" stroke="#34d399" stroke-width="2" marker-end="url(#arr-emerald)"/>

  <rect x="685" y="368" width="246" height="80" rx="8" fill="#064e3b" stroke="#34d399"/>
  <text x="697" y="388" fill="#6ee7b7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="700">Zero-Handshake Reuse</text>
  <text x="697" y="407" fill="#d1fae5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">TLS + WS socket stays OPEN</text>
  <text x="697" y="424" fill="#d1fae5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Mutex released cleanly for</text>
  <text x="697" y="440" fill="#d1fae5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">immediate steered continuation</text>
</svg>

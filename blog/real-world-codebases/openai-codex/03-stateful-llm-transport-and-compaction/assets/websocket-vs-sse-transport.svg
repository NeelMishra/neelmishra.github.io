<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 480" role="img" aria-labelledby="title desc">
  <title id="title">Persistent Responses WebSocket vs Unary HTTP SSE Transport in OpenAI Codex</title>
  <desc id="desc">Comparison of O(T^2) unary HTTP SSE history re-uploads against Codex's persistent Responses WebSocket with RFC 8305 Happy Eyeballs dialing, WsStream background ping/pong pump, cross-turn parking, and sticky Zstd HTTP fallback.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arr-sky" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <rect width="980" height="480" rx="16" fill="url(#bg)" stroke="#1e293b" stroke-width="1.5"/>

  <text x="32" y="38" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">Stateful Responses WebSocket vs. Unary HTTP SSE + Zstd Fallback</text>
  <text x="32" y="58" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">websocket-client/src/dialer.rs · codex-api/src/endpoint/responses_websocket.rs · core/src/client.rs</text>

  <!-- Top Left: Unary SSE O(T^2) Trap -->
  <rect x="28" y="76" width="444" height="156" rx="12" fill="#0f172a" stroke="#f43f5e" stroke-width="1.2"/>
  <text x="46" y="100" fill="#fda4af" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13.5" font-weight="700">Stateless Unary SSE — O(T²) Upload Bandwidth</text>
  <text x="46" y="124" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="10.5">Step 1: POST /responses  [Sys + U₁]                    (12 KB)</text>
  <text x="46" y="143" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="10.5">Step 2: POST /responses  [Sys + U₁ + Out₁]             (45 KB)</text>
  <text x="46" y="162" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="10.5">Step 3: POST /responses  [Sys + U₁ + Out₁ + Out₂]      (98 KB)</text>
  <text x="46" y="185" fill="#fca5a5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">• Re-serializes &amp; uploads entire prefix every tool step</text>
  <text x="46" y="203" fill="#fca5a5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">• Half-duplex body: no upstream channel for response.interrupt</text>
  <text x="46" y="221" fill="#fca5a5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">• Load-balancer drift risks cold GPU KV-cache replicas</text>

  <!-- Top Right: Happy Eyeballs v2 Dialer -->
  <rect x="496" y="76" width="456" height="156" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.3"/>
  <text x="514" y="100" fill="#38bdf8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13.5" font-weight="700">RFC 8305 Happy Eyeballs + Proxy Dialer (dialer.rs)</text>
  <text x="514" y="123" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="10.5">1. Split DNS into preferred (IPv6) &amp; alternate (IPv4) queues</text>
  <text x="514" y="142" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="10.5">2. Interleave [alt, pref, alt, pref] + race at 250ms stagger</text>
  <text x="514" y="161" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="10.5">3. TcpNodelay::Enabled + permessage-deflate (RFC 7692)</text>
  <text x="514" y="180" fill="#93c5fd" font-family="ui-monospace, monospace" font-size="10.5">4. Capture :443 BEFORE https→http proxy URL normalization</text>
  <text x="514" y="199" fill="#93c5fd" font-family="ui-monospace, monospace" font-size="10.5">5. Store ChatGPT Set-Cookie even on rejected HTTP upgrades!</text>
  <text x="514" y="218" fill="#a7f3d0" font-family="ui-monospace, monospace" font-size="10.5">6. Split read_revoked / write_revoked wakers (NetworkPermit)</text>

  <!-- Bottom Wide: Persistent WebSocket Lifecycle & Zstd Fallback -->
  <rect x="28" y="250" width="924" height="204" rx="12" fill="#0f172a" stroke="#34d399" stroke-width="1.4"/>
  <text x="46" y="276" fill="#34d399" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13.5" font-weight="700">Persistent WebSocket Session Lifecycle &amp; Session-Sticky Zstd HTTP Fallback</text>

  <!-- Box 1 -->
  <rect x="46" y="296" width="205" height="96" rx="8" fill="#111827" stroke="#38bdf8"/>
  <text x="148" y="318" text-anchor="middle" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="11" font-weight="700">WsStream Pump Task</text>
  <text x="58" y="338" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="10">• mpsc::channel(32) TX</text>
  <text x="58" y="355" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="10">• Auto-answers Ping→Pong</text>
  <text x="58" y="372" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="10">  during long tool runs</text>
  <text x="58" y="386" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9.5">• Drop aborts pump_task</text>

  <path d="M 251 344 L 279 344" stroke="#38bdf8" stroke-width="1.6" marker-end="url(#arr-sky)"/>

  <!-- Box 2 -->
  <rect x="283" y="296" width="218" height="96" rx="8" fill="#064e3b" stroke="#34d399"/>
  <text x="392" y="318" text-anchor="middle" fill="#ecfdf5" font-family="ui-monospace, monospace" font-size="11" font-weight="700">Cross-Turn Socket Parking</text>
  <text x="295" y="338" fill="#d1fae5" font-family="ui-monospace, monospace" font-size="10">ModelClientSession::drop()</text>
  <text x="295" y="355" fill="#d1fae5" font-family="ui-monospace, monospace" font-size="10">parks WebsocketSession into</text>
  <text x="295" y="372" fill="#a7f3d0" font-family="ui-monospace, monospace" font-size="10">ModelClientState StdMutex!</text>
  <text x="295" y="386" fill="#6ee7b7" font-family="ui-monospace, monospace" font-size="9.5">60m cap → Retryable reconnect</text>

  <path d="M 501 344 L 529 344" stroke="#34d399" stroke-width="1.6" marker-end="url(#arr-emerald)"/>

  <!-- Box 3 -->
  <rect x="533" y="296" width="188" height="96" rx="8" fill="#1e293b" stroke="#94a3b8"/>
  <text x="627" y="318" text-anchor="middle" fill="#f1f5f9" font-family="ui-monospace, monospace" font-size="11" font-weight="700">Reuse Guard Checks</text>
  <text x="545" y="338" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="10">• connection_key (auth rev)</text>
  <text x="545" y="355" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="10">• auth_owner_generation</text>
  <text x="545" y="372" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="10">• responses_headers</text>
  <text x="545" y="386" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="9.5">• !conn.is_closed().await</text>

  <path d="M 721 344 L 749 344" stroke="#fbbf24" stroke-width="1.6" marker-end="url(#arr-amber)"/>

  <!-- Box 4 -->
  <rect x="753" y="296" width="180" height="96" rx="8" fill="#1c1917" stroke="#fbbf24"/>
  <text x="843" y="318" text-anchor="middle" fill="#fbbf24" font-family="ui-monospace, monospace" font-size="11" font-weight="700">426 / Retry Exhausted</text>
  <text x="765" y="338" fill="#fef3c7" font-family="ui-monospace, monospace" font-size="10">disable_websockets = true</text>
  <text x="765" y="355" fill="#fde68a" font-family="ui-monospace, monospace" font-size="10">(Session-sticky latch!)</text>
  <text x="765" y="372" fill="#a7f3d0" font-family="ui-monospace, monospace" font-size="10">HTTP SSE + Zstd body</text>
  <text x="765" y="386" fill="#a7f3d0" font-family="ui-monospace, monospace" font-size="9.5">compression fallback</text>

  <text x="46" y="428" fill="#a7f3d0" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700">Result: O(T) incremental WebSocket frames on healthy networks; Zstd-compressed SSE behind strict proxies.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" width="920" height="430" font-family="Manrope, DejaVu Sans, -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <linearGradient id="bgCodex0" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arSky" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arEm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <rect width="920" height="430" rx="12" fill="url(#bgCodex0)" stroke="#334155" stroke-width="1.5"/>

  <!-- Left Panel: 5-Plane Architecture -->
  <rect x="16" y="16" width="504" height="398" rx="8" fill="#0b1120" stroke="#334155" stroke-width="1"/>
  <text x="30" y="39" fill="#f8fafc" font-size="12.8" font-weight="700">A. Five-Plane Architecture of OpenAI Codex (codex-rs · 120+ Crates)</text>
  <text x="30" y="54" fill="#94a3b8" font-size="9.2">Strict process, capability, and Dependency-CI boundaries from UI surfaces down to OS kernels</text>

  <!-- Plane 1: UI Surfaces -->
  <rect x="30" y="66" width="476" height="46" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.3"/>
  <text x="42" y="83" fill="#a5b4fc" font-size="9.5" font-weight="700">1. Client Surfaces (Zero Direct codex-core Dependency — Enforced by CI)</text>
  <text x="42" y="100" fill="#e0e7ff" font-size="8.2">codex-tui (DEC scroll regions + codex-mermaid)   ·   VS Code / macOS App   ·   TS &amp; Python SDKs</text>

  <line x1="268" y1="112" x2="268" y2="128" stroke="#38bdf8" stroke-width="1.5" marker-start="url(#arSky)" marker-end="url(#arSky)"/>

  <!-- Plane 2: App Server -->
  <rect x="30" y="130" width="476" height="44" rx="6" fill="#082f49" stroke="#38bdf8" stroke-width="1.3"/>
  <text x="42" y="147" fill="#7dd3fc" font-size="9.5" font-weight="700">2. Universal Protocol Boundary: codex-app-server &amp; app-server-protocol</text>
  <text x="42" y="163" fill="#e0f2fe" font-size="8.2">Typed bidirectional JSON-RPC over in-process channels, stdio, Unix sockets, or WebSockets</text>

  <line x1="268" y1="174" x2="268" y2="190" stroke="#38bdf8" stroke-width="1.5" marker-start="url(#arSky)" marker-end="url(#arSky)"/>

  <!-- Plane 3: Core Actor -->
  <rect x="30" y="192" width="476" height="68" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.4"/>
  <text x="42" y="210" fill="#6ee7b7" font-size="9.6" font-weight="700">3. Non-Blocking SQ/EQ Core Actor (codex-core)</text>
  <text x="42" y="226" fill="#d1fae5" font-size="8.1">• submission_loop (never awaits I/O) + decoupled SessionIo for leak-free channel drop teardown</text>
  <text x="42" y="240" fill="#d1fae5" font-size="8.1">• WorldState (~18 sections) append-only RFC 7386 tail diffs + UUIDv5 AdditionalTools in input</text>
  <text x="42" y="253" fill="#a7f3d0" font-size="8.1">• FuturesOrdered streaming tool overlap + RwLock&lt;()&gt; reader/writer gate + Guardian 2-tier review</text>

  <line x1="150" y1="260" x2="150" y2="278" stroke="#10b981" stroke-width="1.4" marker-end="url(#arEm)"/>
  <line x1="386" y1="260" x2="386" y2="278" stroke="#38bdf8" stroke-width="1.4" marker-end="url(#arSky)"/>

  <!-- Plane 4 Left: Isolated Execution -->
  <rect x="30" y="280" width="232" height="120" rx="6" fill="#3f1d2e" stroke="#f43f5e" stroke-width="1.3"/>
  <text x="42" y="298" fill="#fda4af" font-size="9.3" font-weight="700">4. Isolated Execution &amp; Sandboxes</text>
  <text x="42" y="314" fill="#ffe4e6" font-size="7.9">• code-mode-host: Out-of-process V8 gRPC</text>
  <text x="42" y="328" fill="#ffe4e6" font-size="7.9">• apply-patch: Lark CFG + 4-pass fuzzy seek</text>
  <text x="42" y="342" fill="#ffe4e6" font-size="7.9">• Unified Exec: PTY + 50/50 HeadTailBuffer</text>
  <text x="42" y="356" fill="#ffe4e6" font-size="7.9">• bwrap+seccomp / Seatbelt / Win Token+MXC</text>
  <text x="42" y="370" fill="#ffe4e6" font-size="7.9">• Starlark execpolicy + tree-sitter AST</text>
  <text x="42" y="384" fill="#fda4af" font-size="7.9" font-weight="600">• mlock API key proxy + SSRF socket guard</text>

  <!-- Plane 5 Right: Transport, State & Multi-Agent -->
  <rect x="274" y="280" width="232" height="120" rx="6" fill="#451a03" stroke="#f59e0b" stroke-width="1.3"/>
  <text x="286" y="298" fill="#fde68a" font-size="9.3" font-weight="700">5. Transport, Memory &amp; Multi-Agent</text>
  <text x="286" y="314" fill="#fef3c7" font-size="7.9">• Responses WS: generate:false KV prewarm</text>
  <text x="286" y="328" fill="#fef3c7" font-size="7.9">• previous_response_id delta wire uploads</text>
  <text x="286" y="342" fill="#fef3c7" font-size="7.9">• 5-trigger compaction + async prefix splice</text>
  <text x="286" y="356" fill="#fef3c7" font-size="7.9">• RolloutLineage JSONL + 7 NFS-safe SQLites</text>
  <text x="286" y="370" fill="#fef3c7" font-size="7.9">• 2-Phase Git-Diff Memory (&lt; 2.5k summary)</text>
  <text x="286" y="384" fill="#fde68a" font-size="7.9" font-weight="600">• MultiAgentV2 eviction + MessageBoard</text>

  <!-- Right Panel: Core Systems Invariants -->
  <rect x="534" y="16" width="370" height="398" rx="8" fill="#0b1120" stroke="#334155" stroke-width="1"/>
  <text x="548" y="39" fill="#f8fafc" font-size="12.8" font-weight="700">B. Four Foundational Design Invariants</text>
  <text x="548" y="54" fill="#94a3b8" font-size="9.2">Why Codex feels fast, safe, and self-maintaining at scale</text>

  <!-- Card 1 -->
  <rect x="548" y="66" width="342" height="76" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.2"/>
  <text x="560" y="84" fill="#6ee7b7" font-size="9.4" font-weight="700">I. Immutable Prefix / Append-Only Tail State</text>
  <text x="560" y="100" fill="#d1fae5" font-size="8">Earlier input items and base_instructions never mutate mid-window.</text>
  <text x="560" y="114" fill="#d1fae5" font-size="8">Mode toggles, CWD shifts, permission grants, and dynamic MCP tools</text>
  <text x="560" y="128" fill="#a7f3d0" font-size="8" font-weight="600">append strictly at the tail -&gt; near-100% GPU KV-cache reuse.</text>

  <!-- Card 2 -->
  <rect x="548" y="152" width="342" height="76" rx="6" fill="#082f49" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="560" y="170" fill="#7dd3fc" font-size="9.4" font-weight="700">II. Zero-Round-Trip &amp; Zero-TTFT Latency Hiding</text>
  <text x="560" y="186" fill="#e0f2fe" font-size="8">• Startup generate:false prewarms system+tool KV while user types.</text>
  <text x="560" y="200" fill="#e0f2fe" font-size="8">• FuturesOrdered runs tool #1 while tokens stream for tool #2.</text>
  <text x="560" y="214" fill="#7dd3fc" font-size="8" font-weight="600">• V8 Code Mode joins 5 MB MCP payloads outside LLM context.</text>

  <!-- Card 3 -->
  <rect x="548" y="238" width="342" height="78" rx="6" fill="#3f1d2e" stroke="#f43f5e" stroke-width="1.2"/>
  <text x="560" y="256" fill="#fda4af" font-size="9.4" font-weight="700">III. Six-Layer Zero-Trust Security Lattice</text>
  <text x="560" y="272" fill="#ffe4e6" font-size="8">#[ctor] dump/LD_* scrub -&gt; Starlark+AST policy -&gt; OS kernel</text>
  <text x="560" y="286" fill="#ffe4e6" font-size="8">carveouts (.git/.codex read-only tmpfs, io_uring/APFS blocks) -&gt;</text>
  <text x="560" y="300" fill="#fda4af" font-size="8" font-weight="600">socket-level SSRF guard -&gt; mlock key proxy -&gt; Guardian LLM.</text>

  <!-- Card 4 -->
  <rect x="548" y="326" width="342" height="74" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="560" y="344" fill="#f8fafc" font-size="9.4" font-weight="700">IV. Codebase Engineered for Coding Agents</text>
  <text x="560" y="360" fill="#cbd5e1" font-size="8">• rustc_private argument-comment-lint checks /*param*/ names in HIR.</text>
  <text x="560" y="374" fill="#cbd5e1" font-size="8">• Zero Cargo [features], centralized SQLite shim, 1,468 TUI .snaps.</text>
  <text x="560" y="388" fill="#93c5fd" font-size="8" font-weight="600">• Every architectural rule is a compiler or CI error, not prose.</text>
</svg>

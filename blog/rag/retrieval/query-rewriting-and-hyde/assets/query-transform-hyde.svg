<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
  <title id="title">Query Transformation, Multi-Hop Decomposition, and Hypothetical Document Embeddings (HyDE)</title>
  <desc id="desc">Left panel shows conversational query decontextualization resolving pronouns from chat history and multi-hop decomposition splitting a comparative question into parallel sub-queries fused via RRF. Right panel shows HyDE projecting an underspecified question from the interrogative query region into the declarative passage manifold via hypothetical answers so the normalized mean embedding aligns with the target postmortem passage.</desc>
  <defs>
    <marker id="qt-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#1e6b52" />
    </marker>
    <marker id="qt-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#c25928" />
    </marker>
    <marker id="qt-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#52635a" />
    </marker>
  </defs>

  <rect width="960" height="470" rx="16" fill="#fffaf2" stroke="#dcd3c2" stroke-width="1.5" />

  <!-- Header -->
  <text x="32" y="38" font-family="sans-serif" font-size="20" font-weight="700" fill="#1e2d26">Query Transformation &amp; HyDE: Bridging the Question-to-Document Gap</text>
  <text x="32" y="62" font-family="sans-serif" font-size="13.5" fill="#52635a">Rewrite context-dependent queries, decompose multi-hop sub-questions, and project into passage space via hypothetical documents.</text>

  <!-- ==================== LEFT PANEL: REWRITE & DECOMPOSITION ==================== -->
  <rect x="28" y="80" width="440" height="366" rx="12" fill="#ffffff" stroke="#c8d6cc" stroke-width="1.5" />
  <text x="48" y="108" font-family="sans-serif" font-size="15" font-weight="700" fill="#184e3b">1. Conversational Rewrite &amp; Multi-Hop Decomposition</text>

  <!-- Section A: Conversational Decontextualization -->
  <text x="48" y="131" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#374840">A. Conversational Decontextualization: q_t* = f_rewrite(h_1:t-1, q_t)</text>

  <!-- Chat History Box -->
  <rect x="48" y="140" width="184" height="48" rx="7" fill="#f3f5f4" stroke="#9ab5a6" stroke-width="1.4" />
  <text x="60" y="158" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#52635a">Chat History (h_1:t-1)</text>
  <text x="60" y="175" font-family="monospace" font-size="10" fill="#374840">&quot;West cache flag --west-v2&quot;</text>

  <!-- Ambiguous Follow-up Box -->
  <rect x="248" y="140" width="200" height="48" rx="7" fill="#fff6ee" stroke="#c25928" stroke-width="1.6" />
  <text x="260" y="158" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#8c3d19">Ambiguous Follow-up (q_t)</text>
  <text x="260" y="175" font-family="monospace" font-size="9.2" fill="#8c3d19">&quot;What if it fails at peak?&quot;</text>

  <!-- Arrows down to Standalone Query -->
  <line x1="140" y1="188" x2="210" y2="206" stroke="#1e6b52" stroke-width="1.6" marker-end="url(#qt-green)" />
  <line x1="348" y1="188" x2="278" y2="206" stroke="#1e6b52" stroke-width="1.6" marker-end="url(#qt-green)" />

  <!-- Rewritten Standalone Query -->
  <rect x="48" y="210" width="400" height="44" rx="7" fill="#e4f3eb" stroke="#1e6b52" stroke-width="1.8" />
  <text x="60" y="227" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#184e3b">Decontextualized Standalone Query (q_t*)</text>
  <text x="60" y="244" font-family="monospace" font-size="9.5" font-weight="700" fill="#184e3b">&quot;What is the fallback if --west-v2 fails at peak?&quot;</text>

  <!-- Divider -->
  <line x1="48" y1="268" x2="448" y2="268" stroke="#dce5df" stroke-width="1.2" stroke-dasharray="4 3" />

  <!-- Section B: Multi-Hop Decomposition & RRF -->
  <text x="48" y="288" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#374840">B. Multi-Hop Decomposition &amp; Parallel RRF Fusion</text>

  <!-- Complex Query Box -->
  <rect x="48" y="297" width="400" height="34" rx="6" fill="#f3f5f4" stroke="#9ab5a6" stroke-width="1.4" />
  <text x="60" y="318" font-family="monospace" font-size="10" font-weight="700" fill="#374840">Multi-Hop Query: &quot;Compare West vs East regional cache TTL&quot;</text>

  <!-- Split Arrows -->
  <line x1="160" y1="331" x2="135" y2="347" stroke="#52635a" stroke-width="1.5" marker-end="url(#qt-slate)" />
  <line x1="336" y1="331" x2="361" y2="347" stroke="#52635a" stroke-width="1.5" marker-end="url(#qt-slate)" />

  <!-- Sub-Query 1 & 2 -->
  <rect x="48" y="351" width="188" height="36" rx="6" fill="#eef6f2" stroke="#1e6b52" stroke-width="1.5" />
  <text x="142" y="366" font-family="sans-serif" font-size="10" font-weight="700" fill="#184e3b" text-anchor="middle">Sub-Query q^(1)</text>
  <text x="142" y="380" font-family="monospace" font-size="10" fill="#374840" text-anchor="middle">&quot;West cache TTL&quot;</text>

  <rect x="260" y="351" width="188" height="36" rx="6" fill="#eef6f2" stroke="#1e6b52" stroke-width="1.5" />
  <text x="354" y="366" font-family="sans-serif" font-size="10" font-weight="700" fill="#184e3b" text-anchor="middle">Sub-Query q^(2)</text>
  <text x="354" y="380" font-family="monospace" font-size="10" fill="#374840" text-anchor="middle">&quot;East cache TTL&quot;</text>

  <!-- Merge Arrows to RRF -->
  <line x1="142" y1="387" x2="210" y2="401" stroke="#1e6b52" stroke-width="1.5" marker-end="url(#qt-green)" />
  <line x1="354" y1="387" x2="286" y2="401" stroke="#1e6b52" stroke-width="1.5" marker-end="url(#qt-green)" />

  <!-- RRF Output Bar -->
  <rect x="48" y="404" width="400" height="30" rx="6" fill="#e4f3eb" stroke="#1e6b52" stroke-width="1.6" />
  <text x="248" y="423" font-family="sans-serif" font-size="11" font-weight="700" fill="#184e3b" text-anchor="middle">Fused Pool: RRF(d) = sum_m 1 / (k + r_m(d)) covers both regions</text>

  <!-- ==================== RIGHT PANEL: HyDE MANIFOLD PROJECTION ==================== -->
  <rect x="492" y="80" width="440" height="366" rx="12" fill="#ffffff" stroke="#c8d6cc" stroke-width="1.5" />
  <text x="512" y="108" font-family="sans-serif" font-size="15" font-weight="700" fill="#184e3b">2. HyDE: Projecting into the Document Manifold</text>
  <text x="512" y="128" font-family="sans-serif" font-size="11.5" fill="#52635a">LLM drafts K hypothetical passages d_hat_k; encoder E_P projects them near d*.</text>

  <!-- Interrogative Query Region (Left Cloud) -->
  <rect x="510" y="142" width="166" height="232" rx="14" fill="#fff6ee" stroke="#c25928" stroke-width="1.5" stroke-dasharray="5 3" />
  <text x="593" y="162" font-family="sans-serif" font-size="11" font-weight="700" fill="#8c3d19" text-anchor="middle">Interrogative Query Region</text>
  <text x="593" y="176" font-family="sans-serif" font-size="10" fill="#8c3d19" text-anchor="middle">(Questions &amp; FAQ Headers)</text>

  <!-- Raw Query Point q -->
  <circle cx="592" cy="236" r="7" fill="#c25928" />
  <text x="552" y="210" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#8c3d19" text-anchor="middle">q = E_Q(q)</text>
  <text x="552" y="224" font-family="monospace" font-size="8.8" fill="#374840" text-anchor="middle">[0.80,0.60,0]</text>

  <!-- Distractor FAQ Header Point D_faq -->
  <circle cx="592" cy="318" r="6.5" fill="#b83b2a" />
  <text x="592" y="338" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#b83b2a" text-anchor="middle">D_faq (Distractor)</text>
  <text x="592" y="352" font-family="monospace" font-size="9.5" fill="#52635a" text-anchor="middle">cos(q, D_faq) = 0.78</text>

  <!-- Line between q and D_faq -->
  <line x1="592" y1="244" x2="592" y2="310" stroke="#b83b2a" stroke-width="1.6" stroke-dasharray="3 2" />

  <!-- Declarative Passage Region (Right Cloud) -->
  <rect x="708" y="142" width="204" height="232" rx="14" fill="#eef6f2" stroke="#1e6b52" stroke-width="1.5" stroke-dasharray="5 3" />
  <text x="810" y="162" font-family="sans-serif" font-size="11" font-weight="700" fill="#184e3b" text-anchor="middle">Declarative Passage Region</text>
  <text x="810" y="176" font-family="sans-serif" font-size="10" fill="#184e3b" text-anchor="middle">(Root-Cause Postmortems)</text>

  <!-- Hypothetical Passages d_hat_1, d_hat_2, d_hat_3 -->
  <circle cx="748" cy="202" r="5.5" fill="#4f9d81" />
  <text x="760" y="206" font-family="monospace" font-size="8.8" font-weight="700" fill="#184e3b">d_hat_1 [0.32,0.68,0.66]</text>

  <circle cx="748" cy="306" r="5.5" fill="#4f9d81" />
  <text x="760" y="310" font-family="monospace" font-size="8.8" font-weight="700" fill="#184e3b">d_hat_2 [0.28,0.68,0.68]</text>

  <circle cx="776" cy="342" r="5" fill="#7ab8a0" />
  <text x="788" y="346" font-family="monospace" font-size="9" fill="#374840">d_hat_3 (sampled)</text>

  <!-- HyDE Centroid v_HyDE -->
  <circle cx="764" cy="256" r="8" fill="#1e6b52" stroke="#ffffff" stroke-width="2" />
  <text x="764" y="241" font-family="sans-serif" font-size="10" font-weight="700" fill="#184e3b" text-anchor="middle">v_HyDE</text>

  <!-- Target Passage D_target -->
  <circle cx="864" cy="256" r="8" fill="#0d3b2a" />
  <text x="864" y="241" font-family="sans-serif" font-size="10" font-weight="700" fill="#0d3b2a" text-anchor="middle">D_target (d*)</text>
  <text x="814" y="276" font-family="monospace" font-size="9.5" font-weight="700" fill="#184e3b" text-anchor="middle">cos = 0.94</text>

  <!-- High-similarity connector between v_HyDE and D_target -->
  <line x1="772" y1="256" x2="856" y2="256" stroke="#1e6b52" stroke-width="2.4" />

  <!-- Projection trajectories from q to d_hat_1, d_hat_2 -->
  <path d="M 599 232 Q 668 194 740 201" fill="none" stroke="#c25928" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#qt-amber)" />
  <path d="M 599 240 Q 668 284 740 303" fill="none" stroke="#c25928" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#qt-amber)" />
  <line x1="599" y1="236" x2="754" y2="255" stroke="#1e6b52" stroke-width="2.2" marker-end="url(#qt-green)" />
  <rect x="648" y="226" width="88" height="16" rx="3" fill="#ffffff" />
  <text x="692" y="238" font-family="sans-serif" font-size="9.2" font-weight="700" fill="#184e3b" text-anchor="middle">LLM + E_P shift</text>

  <!-- Bottom takeaway Right Panel -->
  <rect x="510" y="388" width="402" height="46" rx="8" fill="#eef6f2" stroke="#1e6b52" stroke-width="1.4" />
  <text x="524" y="406" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#184e3b">v_HyDE = normalize( (E_Q(q) + sum_k E_P(d_hat_k)) / (K + 1) )</text>
  <text x="524" y="424" font-family="sans-serif" font-size="11" fill="#374840">Shifts similarity from D_faq (0.78 -&gt; 0.64) to D_target (0.61 -&gt; 0.94).</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
  <title id="title">Asymmetric Dual-Tower Bi-Encoder, Hard-Negative InfoNCE, and Matryoshka Slicing</title>
  <desc id="desc">Left panel shows the asymmetric dual-tower bi-encoder where an online query tower encodes &quot;query: &quot; + q into unit vector q and an offline passage tower pre-encodes N passages with &quot;passage: &quot; + p_i into unit vectors p_i, joined by a fast MIPS dot product q^T p_i. Right panel shows InfoNCE hard-negative repulsion vs positive paraphrase attraction on the unit hypersphere (top) and Matryoshka nested prefix slices m in {64, 128, 256, 768} (bottom).</desc>
  <defs>
    <marker id="be-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#1e6b52" />
    </marker>
    <marker id="be-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b83b2a" />
    </marker>
    <marker id="be-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#52635a" />
    </marker>
  </defs>

  <rect width="960" height="470" rx="16" fill="#fffaf2" stroke="#dcd3c2" stroke-width="1.5" />

  <!-- Header -->
  <text x="32" y="38" font-family="sans-serif" font-size="20" font-weight="700" fill="#1e2d26">Dense Bi-Encoders: Asymmetric Dual Towers, Hard Negatives &amp; Matryoshka Slicing</text>
  <text x="32" y="62" font-family="sans-serif" font-size="13.5" fill="#52635a">Decoupled query/passage encoding into unit sphere S^(d-1) for sub-millisecond dot-product search and multi-scale prefix truncation.</text>

  <!-- ==================== LEFT PANEL: DUAL-TOWER ARCHITECTURE ==================== -->
  <rect x="28" y="80" width="440" height="366" rx="12" fill="#ffffff" stroke="#c8d6cc" stroke-width="1.5" />
  <text x="46" y="108" font-family="sans-serif" font-size="15" font-weight="700" fill="#184e3b">1. Asymmetric Dual-Tower Bi-Encoder Architecture</text>

  <!-- Left Tower: Online Query Path -->
  <rect x="46" y="126" width="184" height="54" rx="8" fill="#e4f3eb" stroke="#1e6b52" stroke-width="1.5" />
  <text x="58" y="145" font-family="sans-serif" font-size="11" font-weight="700" fill="#184e3b">Online Query (1x at runtime)</text>
  <text x="58" y="162" font-family="monospace" font-size="10" fill="#184e3b">&quot;query: stop stale reads</text>
  <text x="58" y="174" font-family="monospace" font-size="10" fill="#184e3b"> in western cluster?&quot;</text>

  <line x1="138" y1="180" x2="138" y2="202" stroke="#1e6b52" stroke-width="1.8" marker-end="url(#be-green)" />

  <rect x="46" y="206" width="184" height="58" rx="8" fill="#eef6f2" stroke="#1e6b52" stroke-width="1.8" />
  <text x="138" y="226" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#184e3b" text-anchor="middle">Query Encoder E_Q</text>
  <text x="138" y="243" font-family="sans-serif" font-size="10.5" fill="#374840" text-anchor="middle">Masked Mean Pool + L2 Norm</text>
  <text x="138" y="257" font-family="monospace" font-size="10.5" font-weight="700" fill="#184e3b" text-anchor="middle">q in S^(d-1), ||q||_2 = 1</text>

  <!-- Right Tower: Offline Passage Path -->
  <rect x="266" y="126" width="184" height="54" rx="8" fill="#fff6ee" stroke="#c25928" stroke-width="1.5" />
  <text x="278" y="145" font-family="sans-serif" font-size="11" font-weight="700" fill="#8c3d19">Offline Corpus (N passages)</text>
  <text x="278" y="162" font-family="monospace" font-size="10" fill="#374840">&quot;passage: Set --west-v2 to</text>
  <text x="278" y="174" font-family="monospace" font-size="10" fill="#374840"> invalidate cached entries&quot;</text>

  <line x1="358" y1="180" x2="358" y2="202" stroke="#c25928" stroke-width="1.8" marker-end="url(#be-slate)" />

  <rect x="266" y="206" width="184" height="58" rx="8" fill="#f9fbf9" stroke="#9ab5a6" stroke-width="1.8" />
  <text x="358" y="226" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#374840" text-anchor="middle">Passage Encoder E_P</text>
  <text x="358" y="243" font-family="sans-serif" font-size="10.5" fill="#374840" text-anchor="middle">Precomputed Offline Index</text>
  <text x="358" y="257" font-family="monospace" font-size="10" font-weight="700" fill="#184e3b" text-anchor="middle">p_i in S^(d-1), ||p_i||=1</text>

  <!-- Arrows into MIPS Node -->
  <line x1="138" y1="264" x2="210" y2="306" stroke="#1e6b52" stroke-width="1.8" marker-end="url(#be-green)" />
  <line x1="358" y1="264" x2="286" y2="306" stroke="#52635a" stroke-width="1.8" marker-end="url(#be-slate)" />

  <!-- MIPS / Cosine Dot Product Box -->
  <rect x="58" y="310" width="380" height="52" rx="26" fill="#e4f3eb" stroke="#1e6b52" stroke-width="2.2" />
  <text x="248" y="331" font-family="sans-serif" font-size="12" font-weight="700" fill="#184e3b" text-anchor="middle">Fast MIPS / Cosine Search: s(q, p_i) = q^T p_i</text>
  <text x="248" y="349" font-family="monospace" font-size="10" fill="#374840" text-anchor="middle">q^T p_1 = 0.86 (West hit) &gt; q^T p_2 = 0.41 (East trap)</text>

  <!-- Bottom takeaway Left Panel -->
  <rect x="46" y="376" width="404" height="56" rx="8" fill="#f3f5f4" stroke="#9ab5a6" stroke-width="1.3" />
  <text x="58" y="395" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#184e3b">Why Asymmetric Prefixes (&quot;query: &quot; vs. &quot;passage: &quot;) Matter:</text>
  <text x="58" y="412" font-family="sans-serif" font-size="10.5" fill="#374840">Short questions and long declarative passages live in distinct subspaces;</text>
  <text x="58" y="426" font-family="sans-serif" font-size="10.5" fill="#374840">role prefixes project both into a shared unit sphere without cross-attention.</text>

  <!-- ==================== RIGHT PANEL: INFONCE & MATRYOSHKA ==================== -->
  <rect x="492" y="80" width="440" height="366" rx="12" fill="#ffffff" stroke="#c8d6cc" stroke-width="1.5" />
  <text x="510" y="108" font-family="sans-serif" font-size="15" font-weight="700" fill="#184e3b">2. InfoNCE Hard Negatives &amp; Matryoshka Slicing</text>

  <!-- Top Sub-diagram: Unit Sphere Contrastive Forces -->
  <rect x="510" y="122" width="404" height="162" rx="8" fill="#f9fbf9" stroke="#d5e0d8" stroke-width="1.3" />
  <text x="524" y="141" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#374840">InfoNCE Contrastive Forces on S^(d-1) (temperature tau = 0.05):</text>

  <!-- Arc representing unit sphere (stays strictly below title y=141) -->
  <path d="M 540 264 A 118 118 0 0 1 658 158" fill="none" stroke="#9ab5a6" stroke-width="2" stroke-dasharray="4 3" />
  <circle cx="540" cy="264" r="4" fill="#52635a" />
  <text x="536" y="278" font-family="monospace" font-size="9.5" fill="#52635a">origin</text>

  <!-- Query vector q -->
  <line x1="540" y1="264" x2="626" y2="178" stroke="#1e2d26" stroke-width="2.4" marker-end="url(#be-slate)" />
  <text x="524" y="178" font-family="sans-serif" font-size="11" font-weight="700" fill="#1e2d26">Query q</text>

  <!-- Positive vector p+ (attracted) -->
  <line x1="540" y1="264" x2="658" y2="196" stroke="#1e6b52" stroke-width="2.4" marker-end="url(#be-green)" />
  <!-- Pull arrow -->
  <path d="M 654 192 L 634 181" stroke="#1e6b52" stroke-width="2" marker-end="url(#be-green)" />

  <!-- Hard Negative vector p_hard- (repelled) -->
  <line x1="540" y1="264" x2="678" y2="246" stroke="#b83b2a" stroke-width="2.4" marker-end="url(#be-red)" />
  <!-- Push arrow -->
  <path d="M 650 214 L 672 238" stroke="#b83b2a" stroke-width="2" marker-end="url(#be-red)" />

  <!-- Right-side Legend boxes inside Top Sub-diagram -->
  <rect x="692" y="152" width="210" height="54" rx="6" fill="#e4f3eb" stroke="#1e6b52" stroke-width="1.3" />
  <text x="702" y="169" font-family="sans-serif" font-size="11" font-weight="700" fill="#184e3b">Pull p+ (Paraphrase, 0 overlap)</text>
  <text x="702" y="185" font-family="monospace" font-size="9.5" fill="#184e3b">&quot;Set --west-v2 to invalidate&quot;</text>
  <text x="702" y="199" font-family="monospace" font-size="9.5" font-weight="700" fill="#184e3b">sim: 0.62 -&gt; 0.86 after HN</text>

  <rect x="692" y="216" width="210" height="56" rx="6" fill="#fdf2f0" stroke="#b83b2a" stroke-width="1.3" />
  <text x="702" y="233" font-family="sans-serif" font-size="11" font-weight="700" fill="#b83b2a">Push p_hard- (BM25 lexical trap)</text>
  <text x="702" y="249" font-family="monospace" font-size="9.5" fill="#8c3d19">&quot;Stale reads in eastern cluster&quot;</text>
  <text x="702" y="264" font-family="monospace" font-size="9.5" font-weight="700" fill="#b83b2a">sim: 0.78 -&gt; 0.41 after HN</text>

  <!-- Bottom Sub-diagram: Matryoshka Representation Learning (MRL) -->
  <rect x="510" y="296" width="404" height="136" rx="8" fill="#fff6ee" stroke="#c25928" stroke-width="1.4" />
  <text x="524" y="316" font-family="sans-serif" font-size="12" font-weight="700" fill="#8c3d19">Matryoshka Prefix Slicing: Nested Coarse-to-Fine Coordinates</text>

  <!-- Segmented Prefix Bar [1..768] so each slice label is centered in its visible band -->
  <rect x="524" y="328" width="92" height="36" rx="4" fill="#1e6b52" stroke="#184e3b" stroke-width="1.5" />
  <text x="570" y="350" font-family="monospace" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">1..64 (12x)</text>

  <rect x="616" y="328" width="92" height="36" rx="4" fill="#bfe3d0" stroke="#1e6b52" stroke-width="1.5" />
  <text x="662" y="350" font-family="monospace" font-size="9.5" font-weight="700" fill="#184e3b" text-anchor="middle">..128 (6x)</text>

  <rect x="708" y="328" width="92" height="36" rx="4" fill="#fde4cf" stroke="#c25928" stroke-width="1.5" />
  <text x="754" y="350" font-family="monospace" font-size="9.5" font-weight="700" fill="#8c3d19" text-anchor="middle">..256 (3x)</text>

  <rect x="800" y="328" width="100" height="36" rx="4" fill="#f3f5f4" stroke="#7d8f85" stroke-width="1.5" />
  <text x="850" y="350" font-family="monospace" font-size="9.5" font-weight="700" fill="#374840" text-anchor="middle">..768 (1.0x)</text>

  <text x="524" y="384" font-family="monospace" font-size="9" font-weight="700" fill="#184e3b">L_MRL = Sum_{m in M} L_InfoNCE(norm(q_1:m), norm(p_1:m))</text>
  <text x="524" y="402" font-family="sans-serif" font-size="10.5" fill="#374840">Truncating to 128-D + L2 renormalization cuts vector RAM 6x while retaining</text>
  <text x="524" y="418" font-family="sans-serif" font-size="10.5" fill="#374840">&gt;98% of full 768-D recall, or powers a fast 128-D -&gt; 768-D two-stage funnel.</text>
</svg>

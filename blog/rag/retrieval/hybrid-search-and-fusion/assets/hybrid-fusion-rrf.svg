<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
  <title id="title">Hybrid Retrieval and Score Fusion: Raw Score Distortion vs Reciprocal Rank Fusion and Normalized Convex Combination</title>
  <desc id="desc">Left panel shows why adding raw BM25 scores in [0, 18.4] and dense cosine scores in [0.71, 0.89] lets a keyword-stuffed distractor D2 (BM25=14.2, cos=0.71) beat the true answer D1 (BM25=11.8, cos=0.86). Right panel shows parallel Sparse Ranking (D2 #1, D1 #2, D3 #3, D4 #4) and Dense Ranking (D4 #1, D1 #2, D3 #3, D2 #4) combined via RRF and normalized convex fusion so D1 rises to Final Rank #1.</desc>
  <defs>
    <marker id="hf-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#1e6b52" />
    </marker>
    <marker id="hf-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b83b2a" />
    </marker>
  </defs>

  <rect width="960" height="470" rx="16" fill="#fffaf2" stroke="#dcd3c2" stroke-width="1.5" />

  <!-- Header -->
  <text x="32" y="38" font-family="sans-serif" font-size="20" font-weight="700" fill="#1e2d26">Hybrid Retrieval &amp; Score Fusion: Raw Score Addition vs. RRF &amp; Convex Fusion</text>
  <text x="32" y="60" font-family="sans-serif" font-size="13.5" fill="#52635a">Combining sparse BM25 and dense cosine rankings without letting uncalibrated score variance dominate.</text>

  <!-- ==================== LEFT PANEL: RAW SCORE FAILURE ==================== -->
  <rect x="28" y="76" width="440" height="370" rx="12" fill="#ffffff" stroke="#c8d6cc" stroke-width="1.5" />
  <text x="46" y="102" font-family="sans-serif" font-size="15" font-weight="700" fill="#b83b2a">1. Why Uncalibrated Raw Score Addition Fails</text>

  <!-- Scale Comparison Box -->
  <rect x="46" y="116" width="404" height="86" rx="8" fill="#f7f9f8" stroke="#c8d6cc" stroke-width="1.2" />
  <text x="58" y="135" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#374840">Incompatible Score Scales Across Retrievers:</text>

  <!-- BM25 Scale Bar -->
  <text x="58" y="156" font-family="sans-serif" font-size="11" font-weight="700" fill="#8c3d19">BM25 [0, 18.4]</text>
  <rect x="160" y="145" width="230" height="14" rx="4" fill="#fde4cf" stroke="#c25928" stroke-width="1.2" />
  <circle cx="308" cy="152" r="4" fill="#1e6b52" />
  <circle cx="338" cy="152" r="4" fill="#b83b2a" />
  <text x="396" y="156" font-family="monospace" font-size="10.5" font-weight="700" fill="#8c3d19">+2.40 gap</text>

  <!-- Dense Cosine Scale Bar -->
  <text x="58" y="182" font-family="sans-serif" font-size="11" font-weight="700" fill="#184e3b">Cosine [0.71, 0.86]</text>
  <rect x="160" y="171" width="230" height="14" rx="4" fill="#f1f4f2" stroke="#b8c7be" stroke-width="1" />
  <rect x="336" y="171" width="26" height="14" rx="3" fill="#dff2e8" stroke="#1e6b52" stroke-width="1.4" />
  <text x="396" y="182" font-family="monospace" font-size="10.5" font-weight="700" fill="#184e3b">+0.15 gap</text>
  <text x="160" y="196" font-family="sans-serif" font-size="10" fill="#52635a">Dense top-K scores cluster inside a narrow 0.15-wide band</text>

  <!-- Distractor Card D2 -->
  <rect x="46" y="214" width="404" height="74" rx="8" fill="#fff6ee" stroke="#c25928" stroke-width="1.8" />
  <text x="60" y="234" font-family="sans-serif" font-size="12" font-weight="700" fill="#8c3d19">Distractor D2 (Keyword-stuffed East log) — Wins Naive Sum</text>
  <text x="60" y="253" font-family="monospace" font-size="11" fill="#374840">BM25 = 14.20 (Rank #1)   |   Cosine = 0.71 (Rank #4)</text>
  <text x="60" y="273" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#b83b2a">Naive Sum: 14.20 + 0.71 = 14.91  -&gt;  Ranked #1 (Wrong region!)</text>

  <!-- True Answer Card D1 -->
  <rect x="46" y="300" width="404" height="74" rx="8" fill="#f4faf6" stroke="#1e6b52" stroke-width="1.6" />
  <text x="60" y="320" font-family="sans-serif" font-size="12" font-weight="700" fill="#184e3b">True Answer D1 (West failover runbook) — Loses Naive Sum</text>
  <text x="60" y="339" font-family="monospace" font-size="11" fill="#374840">BM25 = 11.80 (Rank #2)   |   Cosine = 0.86 (Rank #2)</text>
  <text x="60" y="359" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#184e3b">Naive Sum: 11.80 + 0.86 = 12.66  -&gt;  Drops to #2 behind D2</text>

  <!-- Left Takeaway Box -->
  <rect x="46" y="386" width="404" height="46" rx="8" fill="#fdf2f0" stroke="#e0b4ad" stroke-width="1.2" />
  <text x="60" y="405" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#b83b2a">Why it fails: s_BM25 + s_dense is &gt;95% dictated by BM25 spread.</text>
  <text x="60" y="422" font-family="sans-serif" font-size="11.5" fill="#374840">D2&apos;s +2.40 BM25 lead overwhelms D1&apos;s +0.15 semantic cosine lead.</text>

  <!-- ==================== RIGHT PANEL: RRF & CONVEX FUSION ==================== -->
  <rect x="492" y="76" width="440" height="370" rx="12" fill="#ffffff" stroke="#c8d6cc" stroke-width="1.5" />
  <text x="510" y="102" font-family="sans-serif" font-size="14.5" font-weight="700" fill="#184e3b">2. Reciprocal Rank Fusion (RRF) &amp; Convex Fusion</text>

  <!-- Sparse Ranking Box -->
  <rect x="510" y="116" width="194" height="122" rx="8" fill="#f7f9f8" stroke="#9ab5a6" stroke-width="1.4" />
  <text x="522" y="135" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#374840">Sparse Ranking (BM25)</text>
  <text x="522" y="155" font-family="monospace" font-size="10" fill="#52635a">#1 D2 (14.2) East log</text>
  <rect x="516" y="163" width="182" height="22" rx="4" fill="#dff2e8" stroke="#1e6b52" stroke-width="1.4" />
  <text x="522" y="178" font-family="monospace" font-size="10" font-weight="700" fill="#184e3b">#2 D1 (11.8) West runbook</text>
  <text x="522" y="201" font-family="monospace" font-size="10" fill="#52635a">#3 D3 (8.2)  CLI table</text>
  <text x="522" y="222" font-family="monospace" font-size="10" fill="#52635a">#4 D4 (2.2)  Paraphrase</text>

  <!-- Dense Ranking Box -->
  <rect x="718" y="116" width="194" height="122" rx="8" fill="#f7f9f8" stroke="#9ab5a6" stroke-width="1.4" />
  <text x="730" y="135" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#374840">Dense Ranking (Cosine)</text>
  <text x="730" y="155" font-family="monospace" font-size="10" fill="#52635a">#1 D4 (0.89) Paraphrase</text>
  <rect x="724" y="163" width="182" height="22" rx="4" fill="#dff2e8" stroke="#1e6b52" stroke-width="1.4" />
  <text x="730" y="178" font-family="monospace" font-size="10" font-weight="700" fill="#184e3b">#2 D1 (0.86) West runbook</text>
  <text x="730" y="201" font-family="monospace" font-size="10" fill="#52635a">#3 D3 (0.77) CLI table</text>
  <text x="730" y="222" font-family="monospace" font-size="10" fill="#52635a">#4 D2 (0.71) East log</text>

  <!-- Arrows into Fusion Combiner -->
  <line x1="607" y1="238" x2="645" y2="262" stroke="#1e6b52" stroke-width="1.8" marker-end="url(#hf-green)" />
  <line x1="815" y1="238" x2="777" y2="262" stroke="#1e6b52" stroke-width="1.8" marker-end="url(#hf-green)" />

  <!-- Combiner Formula Box -->
  <rect x="510" y="266" width="402" height="52" rx="8" fill="#eef6f2" stroke="#1e6b52" stroke-width="1.6" />
  <text x="711" y="286" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#184e3b" text-anchor="middle">Scale-Free RRF (k = 60) &amp; Normalized Convex Combination (alpha = 0.5)</text>
  <text x="711" y="305" font-family="monospace" font-size="9.2" fill="#374840" text-anchor="middle">RRF(d) = Sum 1/(k + r_m)  |  CC(d) = 0.5*s_lex + 0.5*s_dense</text>

  <!-- Fused Output Box -->
  <rect x="510" y="330" width="402" height="102" rx="8" fill="#ffffff" stroke="#1e6b52" stroke-width="1.8" />
  <rect x="518" y="338" width="386" height="36" rx="6" fill="#e4f3eb" stroke="#1e6b52" stroke-width="1.8" />
  <text x="528" y="354" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#184e3b">Final #1: D1 (Rank #2 in both lists!) — Consensus Winner</text>
  <text x="528" y="368" font-family="monospace" font-size="10" font-weight="700" fill="#184e3b">RRF = 1/62 + 1/62 = 0.03226  |  Min-Max CC = 0.817</text>

  <text x="526" y="394" font-family="monospace" font-size="9.2" fill="#374840">Final #2 (tie): D2 (#1,#4) &amp; D4 (#4,#1) -&gt; RRF=0.03202 | CC=0.500</text>
  <text x="526" y="416" font-family="monospace" font-size="9.2" fill="#52635a">Final #4:       D3 (#3,#3)              -&gt; RRF=0.03175 | CC=0.417</text>
</svg>

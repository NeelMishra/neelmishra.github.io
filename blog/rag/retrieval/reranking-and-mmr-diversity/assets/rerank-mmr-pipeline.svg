<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
  <title id="title">Two-Stage Cross-Encoder Reranking and Maximal Marginal Relevance (MMR) Context Selection</title>
  <desc id="desc">Left panel shows a two-stage funnel where a fast bi-encoder retrieves top-50 candidates in 4 ms but ranks a negated warning C1 above the exact procedural answer C3, and a cross-encoder with full token-to-token self-attention rescores the pool in 35 ms to promote C3 and demote C1. Right panel compares naive top-3 selection (which picks three near-duplicate flag-syntax chunks P1a, P1b, P1c) against MMR with lambda=0.6 (which selects P1a, penalizes P1b and P1c for 0.96 similarity, and promotes rollback chunk P2 and safety precondition P3).</desc>
  <defs>
    <marker id="rm-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#1e6b52" />
    </marker>
    <marker id="rm-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b83b2a" />
    </marker>
    <marker id="rm-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#52635a" />
    </marker>
  </defs>

  <rect width="960" height="470" rx="16" fill="#fffaf2" stroke="#dcd3c2" stroke-width="1.5" />

  <!-- Header -->
  <text x="32" y="38" font-family="sans-serif" font-size="20" font-weight="700" fill="#1e2d26">Cross-Encoder Reranking &amp; MMR: Precision Rescoring and Diversity</text>
  <text x="32" y="62" font-family="sans-serif" font-size="13.5" fill="#52635a">Rescore bi-encoder candidate pools with joint token-to-token self-attention, then diversify top-k context via MMR.</text>

  <!-- ==================== LEFT PANEL: TWO-STAGE RERANKING FUNNEL ==================== -->
  <rect x="28" y="80" width="440" height="366" rx="12" fill="#ffffff" stroke="#c8d6cc" stroke-width="1.5" />
  <text x="48" y="108" font-family="sans-serif" font-size="15" font-weight="700" fill="#184e3b">1. Two-Stage Funnel: Bi-Encoder -&gt; Cross-Encoder</text>

  <!-- Stage 1: Bi-Encoder Candidate Pool -->
  <text x="48" y="131" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#374840">Stage 1: Bi-Encoder Top-50 Recall (~4 ms, independent vectors)</text>

  <!-- C1: Negated Warning (Ranked #1 by Bi-Encoder) -->
  <rect x="48" y="140" width="400" height="34" rx="6" fill="#fff6ee" stroke="#c25928" stroke-width="1.5" />
  <text x="58" y="155" font-family="sans-serif" font-size="10" font-weight="700" fill="#8c3d19">C1 (Bi-Enc 0.86, #1): Negated Warning Trap</text>
  <text x="58" y="168" font-family="monospace" font-size="9.5" fill="#374840">&quot;Do NOT enable --west-v2 when TLS is off&quot;</text>

  <!-- C2: Near-duplicate note -->
  <rect x="48" y="180" width="400" height="32" rx="6" fill="#f3f5f4" stroke="#9ab5a6" stroke-width="1.3" />
  <text x="58" y="194" font-family="sans-serif" font-size="10" font-weight="700" fill="#52635a">C2 (Bi-Enc 0.84, #2): Keyword Overlap Note</text>
  <text x="58" y="206" font-family="monospace" font-size="9.5" fill="#374840">&quot;--west-v2 duplicate config note for regional TLS&quot;</text>

  <!-- C3: True Answer (Ranked #3 by Bi-Encoder) -->
  <rect x="48" y="218" width="400" height="34" rx="6" fill="#eef6f2" stroke="#1e6b52" stroke-width="1.5" />
  <text x="58" y="233" font-family="sans-serif" font-size="10" font-weight="700" fill="#184e3b">C3 (Bi-Enc 0.81, #3): Exact Procedural Match</text>
  <text x="58" y="246" font-family="monospace" font-size="9.5" fill="#184e3b">&quot;To enable TLS with --west-v2, pass --tls-strict&quot;</text>

  <!-- Arrow into Cross-Encoder Block -->
  <line x1="248" y1="254" x2="248" y2="272" stroke="#1e6b52" stroke-width="1.8" marker-end="url(#rm-green)" />

  <!-- Cross-Encoder Attention Box -->
  <rect x="48" y="276" width="400" height="46" rx="8" fill="#1e2d26" />
  <text x="248" y="295" font-family="monospace" font-size="11" font-weight="700" fill="#fffaf2" text-anchor="middle">Cross-Encoder: [CLS] q [SEP] d_i [SEP] (~35 ms)</text>
  <text x="248" y="312" font-family="sans-serif" font-size="10.5" fill="#b7d5c6" text-anchor="middle">Full (|q| + |d|)^2 token-to-token self-attention resolves negation</text>

  <!-- Arrow out of Cross-Encoder -->
  <line x1="248" y1="322" x2="248" y2="340" stroke="#1e6b52" stroke-width="1.8" marker-end="url(#rm-green)" />

  <!-- Stage 2 Rescored Output -->
  <rect x="48" y="344" width="194" height="42" rx="6" fill="#e4f3eb" stroke="#1e6b52" stroke-width="1.8" />
  <text x="58" y="361" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#184e3b">Promoted #1: C3</text>
  <text x="58" y="377" font-family="monospace" font-size="10" font-weight="700" fill="#184e3b">s_CE = 0.92 (+2 ranks)</text>

  <rect x="254" y="344" width="194" height="42" rx="6" fill="#fdf2f0" stroke="#b83b2a" stroke-width="1.5" />
  <text x="264" y="361" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#b83b2a">Demoted #18: C1</text>
  <text x="264" y="377" font-family="monospace" font-size="10" font-weight="700" fill="#b83b2a">s_CE = 0.14 (&quot;Do NOT&quot;)</text>

  <!-- Left Panel Takeaway -->
  <rect x="48" y="396" width="400" height="38" rx="7" fill="#f3f5f4" stroke="#9ab5a6" stroke-width="1.2" />
  <text x="60" y="413" font-family="sans-serif" font-size="11" font-weight="700" fill="#374840">Latency budget: T_total = T_ANN(N, 50) + 50 * T_CE = 4 + 35 = 39 ms</text>
  <text x="60" y="427" font-family="sans-serif" font-size="10.5" fill="#52635a">Achieves cross-encoder accuracy without O(N) full-corpus scoring.</text>

  <!-- ==================== RIGHT PANEL: MMR DIVERSITY SELECTION ==================== -->
  <rect x="492" y="80" width="440" height="366" rx="12" fill="#ffffff" stroke="#c8d6cc" stroke-width="1.5" />
  <text x="512" y="108" font-family="sans-serif" font-size="15" font-weight="700" fill="#184e3b">2. Maximal Marginal Relevance (MMR) Selection</text>

  <!-- Top Box: Naive Top-3 Redundancy Trap -->
  <text x="512" y="131" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#b83b2a">A. Naive Top-3 by Relevance Alone (Redundancy Trap):</text>
  <rect x="512" y="140" width="400" height="74" rx="8" fill="#fff6ee" stroke="#c25928" stroke-width="1.6" />
  <text x="524" y="158" font-family="monospace" font-size="9.2" font-weight="700" fill="#8c3d19">1. P1a (rel 0.92): &quot;Enable --west-v2 via --west-v2=true&quot;</text>
  <text x="524" y="174" font-family="monospace" font-size="9.2" fill="#8c3d19">2. P1b (rel 0.90): &quot;Activate West cache with --west-v2=true&quot;</text>
  <text x="524" y="190" font-family="monospace" font-size="9.2" fill="#8c3d19">3. P1c (rel 0.88): &quot;CLI ref: pass --west-v2=true on gateway&quot;</text>
  <text x="524" y="206" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#b83b2a">Result: 3x duplicate enable syntax; 0% coverage of rollback or safety!</text>

  <!-- Bottom Box: MMR Greedy Selection (lambda = 0.6) -->
  <text x="512" y="234" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#184e3b">B. MMR Top-3 (lambda = 0.6): Relevance - 0.4 * max_sim(d_i, S)</text>

  <!-- Step 1: P1a -->
  <rect x="512" y="242" width="400" height="36" rx="6" fill="#e4f3eb" stroke="#1e6b52" stroke-width="1.6" />
  <text x="524" y="257" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#184e3b">Step 1 -&gt; Select P1a (Enable flag syntax)</text>
  <text x="524" y="271" font-family="monospace" font-size="10" fill="#374840">MMR = 0.6*(0.92) - 0 = 0.552   |   S_1 = {P1a}</text>

  <!-- Penalty Callout on P1b, P1c -->
  <rect x="512" y="284" width="400" height="34" rx="6" fill="#fdf2f0" stroke="#e0b4ad" stroke-width="1.4" />
  <text x="524" y="299" font-family="sans-serif" font-size="10" font-weight="700" fill="#b83b2a">Penalize Near-Duplicates P1b (sim=0.96) &amp; P1c (sim=0.95):</text>
  <text x="524" y="312" font-family="monospace" font-size="9.5" fill="#8c3d19">MMR(P1b) = 0.6*(0.90) - 0.4*(0.96) = 0.156   (drops below P2 &amp; P3)</text>

  <!-- Step 2: P2 -->
  <rect x="512" y="324" width="400" height="36" rx="6" fill="#e4f3eb" stroke="#1e6b52" stroke-width="1.6" />
  <text x="524" y="339" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#184e3b">Step 2 -&gt; Select P2 (Rollback procedure, sim=0.25 to P1a)</text>
  <text x="524" y="353" font-family="monospace" font-size="10" fill="#374840">MMR = 0.6*(0.82) - 0.4*(0.25) = 0.392   |   S_2 = {P1a, P2}</text>

  <!-- Step 3: P3 -->
  <rect x="512" y="366" width="400" height="36" rx="6" fill="#e4f3eb" stroke="#1e6b52" stroke-width="1.6" />
  <text x="524" y="381" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#184e3b">Step 3 -&gt; Select P3 (Safety precondition, max_sim=0.22)</text>
  <text x="524" y="395" font-family="monospace" font-size="10" fill="#374840">MMR = 0.6*(0.79) - 0.4*(0.22) = 0.386   |   S_3 = {P1a, P2, P3}</text>

  <!-- Right Panel Summary -->
  <rect x="512" y="408" width="400" height="26" rx="6" fill="#eef6f2" stroke="#1e6b52" stroke-width="1.3" />
  <text x="712" y="425" font-family="sans-serif" font-size="11" font-weight="700" fill="#184e3b" text-anchor="middle">100% aspect coverage: Enable Syntax (P1a) + Rollback (P2) + Safety (P3)</text>
</svg>

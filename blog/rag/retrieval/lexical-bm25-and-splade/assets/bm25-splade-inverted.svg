<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
  <title id="title">Okapi BM25 Term Saturation and SPLADE Learned Sparse Expansion</title>
  <desc id="desc">Left panel plots Okapi BM25 term frequency saturation toward k1 + 1 = 2.2 and length normalization b = 0.75, showing how a concise 40-token runbook D1 with f = 1 outscores a 400-token log dump D2 with f = 2 on error code ERR_WEST_409. Right panel shows SPLADE passing passage tokens through an MLM head with log(1 + ReLU) max-pooling and FLOPS sparsity into an inverted index.</desc>
  <defs>
    <marker id="sp-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#1e6b52" />
    </marker>
    <marker id="sp-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#c25928" />
    </marker>
    <marker id="sp-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#52635a" />
    </marker>
  </defs>

  <rect width="960" height="470" rx="16" fill="#fffaf2" stroke="#dcd3c2" stroke-width="1.5" />

  <!-- Header -->
  <text x="32" y="38" font-family="sans-serif" font-size="20" font-weight="700" fill="#1e2d26">Lexical &amp; Learned Sparse Retrieval: Okapi BM25 vs. SPLADE Expansion</text>
  <text x="32" y="62" font-family="sans-serif" font-size="13.5" fill="#52635a">Exact token scoring via TF saturation and length normalization (left) vs. neural MLM vocabulary expansion into posting lists (right).</text>

  <!-- ==================== LEFT PANEL: OKAPI BM25 ==================== -->
  <rect x="28" y="80" width="440" height="366" rx="12" fill="#ffffff" stroke="#c8d6cc" stroke-width="1.5" />
  <text x="46" y="108" font-family="sans-serif" font-size="15" font-weight="700" fill="#184e3b">1. Okapi BM25: TF Saturation (k1) &amp; Length Norm (b)</text>

  <!-- Plot Coordinate Box -->
  <rect x="78" y="124" width="366" height="176" rx="6" fill="#f9fbf9" stroke="#d5e0d8" stroke-width="1.2" />

  <!-- Asymptote line at k1 + 1 = 2.2 (y = 140) -->
  <line x1="78" y1="140" x2="444" y2="140" stroke="#8c3d19" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="438" y="135" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#8c3d19" text-anchor="end">Asymptote k1 + 1 = 2.20</text>

  <!-- Axes: Origin at (78, 300), X goes to 444 (f = 0..6), Y goes up to 124 (TF weight 0..2.4) -->
  <line x1="78" y1="300" x2="444" y2="300" stroke="#374840" stroke-width="1.6" />
  <line x1="78" y1="300" x2="78" y2="124" stroke="#374840" stroke-width="1.6" />

  <!-- Y-axis labels (scale: 1.0 unit = 72.7 px; y(w) = 300 - 72.7 * w) -->
  <text x="72" y="303" font-family="monospace" font-size="10" fill="#52635a" text-anchor="end">0.0</text>
  <line x1="78" y1="227" x2="444" y2="227" stroke="#e4ece7" stroke-width="1" />
  <text x="72" y="231" font-family="monospace" font-size="10" fill="#52635a" text-anchor="end">1.0</text>
  <line x1="78" y1="155" x2="444" y2="155" stroke="#e4ece7" stroke-width="1" />
  <text x="72" y="158" font-family="monospace" font-size="10" fill="#52635a" text-anchor="end">2.0</text>
  <text x="42" y="216" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#374840" transform="rotate(-90 42 216)" text-anchor="middle">BM25 TF Factor</text>

  <!-- X-axis ticks: f = 1..6 (step = 58 px: f=1->136, f=2->194, f=3->252, f=4->310, f=5->368, f=6->426) -->
  <text x="136" y="315" font-family="monospace" font-size="10" fill="#374840" text-anchor="middle">f=1</text>
  <text x="194" y="315" font-family="monospace" font-size="10" fill="#374840" text-anchor="middle">f=2</text>
  <text x="252" y="315" font-family="monospace" font-size="10" fill="#374840" text-anchor="middle">f=3</text>
  <text x="310" y="315" font-family="monospace" font-size="10" fill="#374840" text-anchor="middle">f=4</text>
  <text x="368" y="315" font-family="monospace" font-size="10" fill="#374840" text-anchor="middle">f=5</text>
  <text x="426" y="315" font-family="monospace" font-size="10" fill="#374840" text-anchor="middle">f=6</text>

  <!-- Curve 1: Short doc D1 (|d| = 40, avgdl = 100, K = 0.66)
       f=0: (78,300), f=1: 1.325->(136,204), f=2: 1.654->(194,180), f=3: 1.803->(252,169), f=4: 1.888->(310,163), f=5: 1.943->(368,159), f=6: 1.982->(426,156) -->
  <path d="M 78 300 Q 106 226 136 204 T 194 180 T 252 169 T 310 163 T 368 159 T 426 156" fill="none" stroke="#1e6b52" stroke-width="2.5" />

  <!-- Curve 2: Long doc D2 (|d| = 400, avgdl = 100, K = 3.90)
       f=0: (78,300), f=1: 0.449->(136,267), f=2: 0.746->(194,246), f=3: 0.957->(252,230), f=4: 1.114->(310,219), f=5: 1.236->(368,210), f=6: 1.333->(426,203) -->
  <path d="M 78 300 Q 106 280 136 267 T 194 246 T 252 230 T 310 219 T 368 210 T 426 203" fill="none" stroke="#c25928" stroke-width="2.4" stroke-dasharray="6 3" />

  <!-- Highlighted Point D1 (f=1, |d|=40 -> TF = 1.325) -->
  <circle cx="136" cy="204" r="5.5" fill="#1e6b52" stroke="#ffffff" stroke-width="1.5" />
  <rect x="144" y="182" width="144" height="22" rx="4" fill="#e4f3eb" stroke="#1e6b52" stroke-width="1.2" />
  <text x="150" y="197" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#184e3b">D1 (f=1, |d|=40): 1.325</text>

  <!-- Highlighted Point D2 (f=2, |d|=400 -> TF = 0.746) -->
  <circle cx="194" cy="246" r="5.5" fill="#c25928" stroke="#ffffff" stroke-width="1.5" />
  <rect x="204" y="242" width="152" height="22" rx="4" fill="#fff3e8" stroke="#c25928" stroke-width="1.2" />
  <text x="210" y="257" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#8c3d19">D2 (f=2, |d|=400): 0.746</text>

  <!-- Comparison Cards at Bottom of Left Panel -->
  <rect x="46" y="328" width="404" height="50" rx="8" fill="#e4f3eb" stroke="#1e6b52" stroke-width="1.5" />
  <text x="58" y="346" font-family="sans-serif" font-size="11" font-weight="700" fill="#184e3b">Runbook D1 (40 tok, ERR_WEST_409 x1, rollback x1) -&gt; BM25 = 12.81</text>
  <text x="58" y="365" font-family="sans-serif" font-size="10.5" fill="#374840">Short length (|d| &lt; avgdl = 100) boosts TF to 1.325; rare error IDF = 5.99.</text>

  <rect x="46" y="386" width="404" height="48" rx="8" fill="#fff6ee" stroke="#c25928" stroke-width="1.5" />
  <text x="58" y="404" font-family="sans-serif" font-size="11" font-weight="700" fill="#8c3d19">Log Dump D2 (400 tok, ERR_WEST_409 x2) -&gt; BM25 = 4.47</text>
  <text x="58" y="422" font-family="sans-serif" font-size="10.5" fill="#374840">Length penalty (K = 3.90) suppresses f = 2 below D1&apos;s single focused hit.</text>

  <!-- ==================== RIGHT PANEL: SPLADE EXPANSION ==================== -->
  <rect x="492" y="80" width="440" height="366" rx="12" fill="#ffffff" stroke="#c8d6cc" stroke-width="1.5" />
  <text x="510" y="108" font-family="sans-serif" font-size="15" font-weight="700" fill="#184e3b">2. SPLADE: MLM Logit Expansion into an Inverted Index</text>

  <!-- Step 1: Input Passage Tokens -->
  <rect x="510" y="124" width="404" height="46" rx="8" fill="#f3f5f4" stroke="#9ab5a6" stroke-width="1.4" />
  <text x="524" y="148" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#374840">Input Passage D:</text>
  <rect x="634" y="131" width="64" height="26" rx="5" fill="#ffffff" stroke="#1e6b52" stroke-width="1.4" />
  <text x="666" y="148" font-family="monospace" font-size="11" font-weight="700" fill="#184e3b" text-anchor="middle">&quot;west&quot;</text>
  <rect x="708" y="131" width="72" height="26" rx="5" fill="#ffffff" stroke="#1e6b52" stroke-width="1.4" />
  <text x="744" y="148" font-family="monospace" font-size="11" font-weight="700" fill="#184e3b" text-anchor="middle">&quot;cache&quot;</text>
  <rect x="790" y="131" width="92" height="26" rx="5" fill="#ffffff" stroke="#1e6b52" stroke-width="1.4" />
  <text x="836" y="148" font-family="monospace" font-size="11" font-weight="700" fill="#184e3b" text-anchor="middle">&quot;timeout&quot;</text>

  <line x1="712" y1="170" x2="712" y2="190" stroke="#1e6b52" stroke-width="1.8" marker-end="url(#sp-green)" />

  <!-- Step 2: MLM Head + Log Saturation + Sparsity -->
  <rect x="510" y="194" width="404" height="58" rx="8" fill="#eef6f2" stroke="#1e6b52" stroke-width="1.8" />
  <text x="712" y="215" font-family="sans-serif" font-size="12" font-weight="700" fill="#184e3b" text-anchor="middle">Transformer MLM Head + Log-Saturation Max Pooling</text>
  <text x="712" y="236" font-family="monospace" font-size="10" fill="#374840" text-anchor="middle">w_j = max_i log(1 + ReLU(W_j^T h_i + b_j)) + FLOPS reg</text>

  <line x1="610" y1="252" x2="610" y2="274" stroke="#1e6b52" stroke-width="1.8" marker-end="url(#sp-green)" />
  <line x1="814" y1="252" x2="814" y2="274" stroke="#c25928" stroke-width="1.8" marker-end="url(#sp-orange)" />

  <!-- Step 3: Sparse Vocabulary Weights (Exact vs Learned Synonyms) -->
  <!-- Left box: Exact Lexical Tokens -->
  <rect x="510" y="278" width="194" height="84" rx="8" fill="#e4f3eb" stroke="#1e6b52" stroke-width="1.5" />
  <text x="522" y="297" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#184e3b">Exact Terms Retained</text>
  <text x="522" y="316" font-family="monospace" font-size="11" fill="#184e3b">&quot;west&quot;    : 2.40</text>
  <text x="522" y="334" font-family="monospace" font-size="11" fill="#184e3b">&quot;timeout&quot; : 2.10</text>
  <text x="522" y="352" font-family="monospace" font-size="11" fill="#184e3b">&quot;cache&quot;   : 1.85</text>

  <!-- Right box: Learned Expansion Terms -->
  <rect x="720" y="278" width="194" height="84" rx="8" fill="#fff6ee" stroke="#c25928" stroke-width="1.5" />
  <text x="732" y="297" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#8c3d19">Learned Synonyms Added</text>
  <text x="732" y="316" font-family="monospace" font-size="11" fill="#8c3d19">&quot;latency&quot;  : 1.30</text>
  <text x="732" y="334" font-family="monospace" font-size="11" fill="#8c3d19">&quot;ttl&quot;      : 0.90</text>
  <text x="732" y="352" font-family="monospace" font-size="11" fill="#8c3d19">&quot;eviction&quot; : 0.80</text>

  <!-- Step 4: Inverted Index Posting Lists -->
  <rect x="510" y="374" width="404" height="60" rx="8" fill="#f9fbf9" stroke="#9ab5a6" stroke-width="1.5" />
  <text x="524" y="393" font-family="sans-serif" font-size="11" font-weight="700" fill="#184e3b">Standard Inverted Index Posting Lists (&gt;99% of |V| = 30,522 are 0):</text>
  <text x="524" y="411" font-family="monospace" font-size="8.8" fill="#374840">&quot;timeout&quot; -&gt; [(D1,2.1), (D8,1.7)] | &quot;latency&quot; -&gt; [(D1,1.3), (D4,2.0)]</text>
  <text x="524" y="426" font-family="monospace" font-size="8.8" fill="#374840">&quot;ttl&quot;     -&gt; [(D1,0.9), (D9,1.5)] | Pruned via Block-Max WAND bounds</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
  <title id="title">ColBERT Multi-Vector Late Interaction: Token-Level MaxSim Alignment Matrix and PLAID Residual Compression</title>
  <desc id="desc">Left panel shows a 4x5 dot-product matrix between query tokens (west, cache, ttl, [MASK]) and passage D1 tokens (west, redis, expiry, 300s, flag), highlighting the row maxima (0.94, 0.82, 0.88, 0.71) that sum to S(Q, D1) = 3.35. Right panel compares single-vector pooling against ColBERT late interaction and illustrates PLAID compression storing each token as a 16-bit centroid ID plus a 2-bit residual vector.</desc>
  <defs>
    <marker id="cb-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#1e6b52" />
    </marker>
  </defs>

  <rect width="960" height="470" rx="16" fill="#fffaf2" stroke="#dcd3c2" stroke-width="1.5" />

  <!-- Header -->
  <text x="32" y="38" font-family="sans-serif" font-size="20" font-weight="700" fill="#1e2d26">ColBERT Late Interaction: Token-Level MaxSim &amp; PLAID Residual Compression</text>
  <text x="32" y="60" font-family="sans-serif" font-size="13.5" fill="#52635a">Retaining contextualized per-token embeddings to preserve modifier binding while compressing multi-vector indexes.</text>

  <!-- ==================== LEFT PANEL: MAXSIM ALIGNMENT MATRIX ==================== -->
  <rect x="28" y="76" width="440" height="370" rx="12" fill="#ffffff" stroke="#c8d6cc" stroke-width="1.5" />
  <text x="44" y="102" font-family="sans-serif" font-size="15" font-weight="700" fill="#184e3b">1. ColBERT Token-Level MaxSim Alignment Matrix</text>
  <text x="44" y="121" font-family="sans-serif" font-size="11.5" fill="#52635a">Dot products q_i^T d_j between Query Q (rows) and Passage D1 (columns):</text>

  <!-- Column Headers (D1 Tokens) -->
  <rect x="118" y="130" width="52" height="28" rx="5" fill="#f3f5f4" stroke="#9ab5a6" />
  <text x="144" y="148" font-family="monospace" font-size="10.5" font-weight="700" fill="#374840" text-anchor="middle">&quot;west&quot;</text>

  <rect x="174" y="130" width="52" height="28" rx="5" fill="#f3f5f4" stroke="#9ab5a6" />
  <text x="200" y="148" font-family="monospace" font-size="10.5" font-weight="700" fill="#374840" text-anchor="middle">&quot;redis&quot;</text>

  <rect x="230" y="130" width="52" height="28" rx="5" fill="#f3f5f4" stroke="#9ab5a6" />
  <text x="256" y="148" font-family="monospace" font-size="10" font-weight="700" fill="#374840" text-anchor="middle">&quot;expiry&quot;</text>

  <rect x="286" y="130" width="52" height="28" rx="5" fill="#f3f5f4" stroke="#9ab5a6" />
  <text x="312" y="148" font-family="monospace" font-size="10.5" font-weight="700" fill="#374840" text-anchor="middle">&quot;300s&quot;</text>

  <rect x="342" y="130" width="52" height="28" rx="5" fill="#f3f5f4" stroke="#9ab5a6" />
  <text x="368" y="148" font-family="monospace" font-size="10.5" font-weight="700" fill="#374840" text-anchor="middle">&quot;flag&quot;</text>

  <rect x="400" y="130" width="52" height="28" rx="5" fill="#eef6f2" stroke="#1e6b52" stroke-width="1.3" />
  <text x="426" y="148" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#184e3b" text-anchor="middle"> max_j</text>

  <!-- Row 1: q1 = "west" -->
  <rect x="44" y="164" width="68" height="38" rx="5" fill="#f3f5f4" stroke="#9ab5a6" />
  <text x="78" y="187" font-family="monospace" font-size="10.5" font-weight="700" fill="#374840" text-anchor="middle">q1 &quot;west&quot;</text>

  <rect x="118" y="164" width="52" height="38" rx="5" fill="#dff2e8" stroke="#1e6b52" stroke-width="2" />
  <text x="144" y="187" font-family="monospace" font-size="11.5" font-weight="700" fill="#184e3b" text-anchor="middle">0.94*</text>

  <rect x="174" y="164" width="52" height="38" rx="5" fill="#fafbfa" stroke="#d5dfd9" />
  <text x="200" y="187" font-family="monospace" font-size="10.5" fill="#687a70" text-anchor="middle">0.18</text>

  <rect x="230" y="164" width="52" height="38" rx="5" fill="#fafbfa" stroke="#d5dfd9" />
  <text x="256" y="187" font-family="monospace" font-size="10.5" fill="#687a70" text-anchor="middle">0.12</text>

  <rect x="286" y="164" width="52" height="38" rx="5" fill="#fafbfa" stroke="#d5dfd9" />
  <text x="312" y="187" font-family="monospace" font-size="10.5" fill="#687a70" text-anchor="middle">0.29</text>

  <rect x="342" y="164" width="52" height="38" rx="5" fill="#fafbfa" stroke="#d5dfd9" />
  <text x="368" y="187" font-family="monospace" font-size="10.5" fill="#687a70" text-anchor="middle">0.15</text>

  <rect x="400" y="164" width="52" height="38" rx="5" fill="#e4f3eb" stroke="#1e6b52" stroke-width="1.6" />
  <text x="426" y="187" font-family="monospace" font-size="11.5" font-weight="700" fill="#184e3b" text-anchor="middle">0.94</text>

  <!-- Row 2: q2 = "cache" -->
  <rect x="44" y="208" width="68" height="38" rx="5" fill="#f3f5f4" stroke="#9ab5a6" />
  <text x="78" y="231" font-family="monospace" font-size="10.5" font-weight="700" fill="#374840" text-anchor="middle">q2 &quot;cache&quot;</text>

  <rect x="118" y="208" width="52" height="38" rx="5" fill="#fafbfa" stroke="#d5dfd9" />
  <text x="144" y="231" font-family="monospace" font-size="10.5" fill="#687a70" text-anchor="middle">0.21</text>

  <rect x="174" y="208" width="52" height="38" rx="5" fill="#dff2e8" stroke="#1e6b52" stroke-width="2" />
  <text x="200" y="231" font-family="monospace" font-size="11.5" font-weight="700" fill="#184e3b" text-anchor="middle">0.82*</text>

  <rect x="230" y="208" width="52" height="38" rx="5" fill="#fafbfa" stroke="#d5dfd9" />
  <text x="256" y="231" font-family="monospace" font-size="10.5" fill="#687a70" text-anchor="middle">0.44</text>

  <rect x="286" y="208" width="52" height="38" rx="5" fill="#fafbfa" stroke="#d5dfd9" />
  <text x="312" y="231" font-family="monospace" font-size="10.5" fill="#687a70" text-anchor="middle">0.19</text>

  <rect x="342" y="208" width="52" height="38" rx="5" fill="#fafbfa" stroke="#d5dfd9" />
  <text x="368" y="231" font-family="monospace" font-size="10.5" fill="#687a70" text-anchor="middle">0.31</text>

  <rect x="400" y="208" width="52" height="38" rx="5" fill="#e4f3eb" stroke="#1e6b52" stroke-width="1.6" />
  <text x="426" y="231" font-family="monospace" font-size="11.5" font-weight="700" fill="#184e3b" text-anchor="middle">0.82</text>

  <!-- Row 3: q3 = "ttl" -->
  <rect x="44" y="252" width="68" height="38" rx="5" fill="#f3f5f4" stroke="#9ab5a6" />
  <text x="78" y="275" font-family="monospace" font-size="10.5" font-weight="700" fill="#374840" text-anchor="middle">q3 &quot;ttl&quot;</text>

  <rect x="118" y="252" width="52" height="38" rx="5" fill="#fafbfa" stroke="#d5dfd9" />
  <text x="144" y="275" font-family="monospace" font-size="10.5" fill="#687a70" text-anchor="middle">0.16</text>

  <rect x="174" y="252" width="52" height="38" rx="5" fill="#fafbfa" stroke="#d5dfd9" />
  <text x="200" y="275" font-family="monospace" font-size="10.5" fill="#687a70" text-anchor="middle">0.38</text>

  <rect x="230" y="252" width="52" height="38" rx="5" fill="#dff2e8" stroke="#1e6b52" stroke-width="2" />
  <text x="256" y="275" font-family="monospace" font-size="11.5" font-weight="700" fill="#184e3b" text-anchor="middle">0.88*</text>

  <rect x="286" y="252" width="52" height="38" rx="5" fill="#fafbfa" stroke="#d5dfd9" />
  <text x="312" y="275" font-family="monospace" font-size="10.5" fill="#687a70" text-anchor="middle">0.64</text>

  <rect x="342" y="252" width="52" height="38" rx="5" fill="#fafbfa" stroke="#d5dfd9" />
  <text x="368" y="275" font-family="monospace" font-size="10.5" fill="#687a70" text-anchor="middle">0.22</text>

  <rect x="400" y="252" width="52" height="38" rx="5" fill="#e4f3eb" stroke="#1e6b52" stroke-width="1.6" />
  <text x="426" y="275" font-family="monospace" font-size="11.5" font-weight="700" fill="#184e3b" text-anchor="middle">0.88</text>

  <!-- Row 4: q4 = "[MASK]" -->
  <rect x="44" y="296" width="68" height="38" rx="5" fill="#fde4cf" stroke="#c25928" />
  <text x="78" y="319" font-family="monospace" font-size="10" font-weight="700" fill="#8c3d19" text-anchor="middle">q4 [MASK]</text>

  <rect x="118" y="296" width="52" height="38" rx="5" fill="#fafbfa" stroke="#d5dfd9" />
  <text x="144" y="319" font-family="monospace" font-size="10.5" fill="#687a70" text-anchor="middle">0.34</text>

  <rect x="174" y="296" width="52" height="38" rx="5" fill="#fafbfa" stroke="#d5dfd9" />
  <text x="200" y="319" font-family="monospace" font-size="10.5" fill="#687a70" text-anchor="middle">0.29</text>

  <rect x="230" y="296" width="52" height="38" rx="5" fill="#fafbfa" stroke="#d5dfd9" />
  <text x="256" y="319" font-family="monospace" font-size="10.5" fill="#687a70" text-anchor="middle">0.52</text>

  <rect x="286" y="296" width="52" height="38" rx="5" fill="#dff2e8" stroke="#1e6b52" stroke-width="2" />
  <text x="312" y="319" font-family="monospace" font-size="11.5" font-weight="700" fill="#184e3b" text-anchor="middle">0.71*</text>

  <rect x="342" y="296" width="52" height="38" rx="5" fill="#fafbfa" stroke="#d5dfd9" />
  <text x="368" y="319" font-family="monospace" font-size="10.5" fill="#687a70" text-anchor="middle">0.27</text>

  <rect x="400" y="296" width="52" height="38" rx="5" fill="#e4f3eb" stroke="#1e6b52" stroke-width="1.6" />
  <text x="426" y="319" font-family="monospace" font-size="11.5" font-weight="700" fill="#184e3b" text-anchor="middle">0.71</text>

  <!-- Sum Summary Box Left Panel -->
  <rect x="44" y="346" width="408" height="86" rx="8" fill="#eef6f2" stroke="#1e6b52" stroke-width="1.6" />
  <text x="58" y="366" font-family="sans-serif" font-size="12" font-weight="700" fill="#184e3b">MaxSim Score S(Q, D1) = 0.94 + 0.82 + 0.88 + 0.71 = 3.35</text>
  <text x="58" y="386" font-family="sans-serif" font-size="11.5" fill="#374840">• &quot;cache&quot; aligns with &quot;redis&quot; (0.82); &quot;ttl&quot; aligns with &quot;expiry&quot; (0.88).</text>
  <text x="58" y="404" font-family="sans-serif" font-size="11.5" fill="#374840">• [MASK] expansion token softly attends to duration value &quot;300s&quot; (0.71).</text>
  <text x="58" y="422" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#8c3d19">• Swapped distractor D2 (&quot;West 60s, East 300s&quot;) scores only 2.45.</text>

  <!-- ==================== RIGHT PANEL: SPECTRUM & PLAID ==================== -->
  <rect x="492" y="76" width="440" height="370" rx="12" fill="#ffffff" stroke="#c8d6cc" stroke-width="1.5" />
  <text x="510" y="102" font-family="sans-serif" font-size="15" font-weight="700" fill="#184e3b">2. Architectural Spectrum &amp; PLAID Residual Compression</text>

  <!-- Top Half: Single-Vector vs Late Interaction -->
  <rect x="510" y="116" width="404" height="142" rx="8" fill="#f7f9f8" stroke="#c8d6cc" stroke-width="1.3" />
  <text x="524" y="136" font-family="sans-serif" font-size="12" font-weight="700" fill="#374840">Why Single-Vector Pooling Loses Attribute Binding:</text>

  <!-- Bi-Encoder Card -->
  <rect x="522" y="146" width="184" height="100" rx="6" fill="#fff6ee" stroke="#c25928" stroke-width="1.5" />
  <text x="534" y="165" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#8c3d19">Single-Vector Bi-Encoder</text>
  <text x="534" y="183" font-family="sans-serif" font-size="10.5" fill="#374840">Pools all N_d tokens into 1</text>
  <text x="534" y="198" font-family="sans-serif" font-size="10.5" fill="#374840">vector BEFORE interaction.</text>
  <text x="534" y="216" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#b83b2a">&quot;West 300s, East 60s&quot; ~=</text>
  <text x="534" y="232" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#b83b2a">&quot;West 60s, East 300s&quot;</text>

  <!-- ColBERT Card -->
  <rect x="718" y="146" width="184" height="100" rx="6" fill="#e4f3eb" stroke="#1e6b52" stroke-width="1.6" />
  <text x="730" y="165" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#184e3b">ColBERT Late Interaction</text>
  <text x="730" y="183" font-family="sans-serif" font-size="10.5" fill="#374840">Keeps N_d x 128-D normalized</text>
  <text x="730" y="198" font-family="sans-serif" font-size="10.5" fill="#374840">contextual token vectors.</text>
  <text x="730" y="216" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#184e3b">Self-attention binds &quot;300s&quot;</text>
  <text x="730" y="232" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#184e3b">to &quot;West&quot; inside d_j itself.</text>

  <!-- Bottom Half: PLAID Residual Compression -->
  <rect x="510" y="270" width="404" height="162" rx="8" fill="#ffffff" stroke="#1e6b52" stroke-width="1.6" />
  <text x="524" y="291" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#184e3b">ColBERTv2 / PLAID Centroid-Residual Compression (6-10x smaller):</text>
  <text x="524" y="309" font-family="sans-serif" font-size="10.5" fill="#52635a">Raw fp32: 180 tok x 128-D x 4B = 92.2 KB/doc  -&gt;  Compressed: ~6.1 KB/doc</text>

  <!-- Vector Decomposition Boxes -->
  <rect x="524" y="320" width="110" height="52" rx="6" fill="#f3f5f4" stroke="#9ab5a6" stroke-width="1.4" />
  <text x="579" y="341" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#374840" text-anchor="middle">Token Vector d_j</text>
  <text x="579" y="358" font-family="monospace" font-size="10" fill="#52635a" text-anchor="middle">128-D (512 B)</text>

  <line x1="636" y1="346" x2="656" y2="346" stroke="#1e6b52" stroke-width="1.8" marker-end="url(#cb-green)" />

  <rect x="660" y="320" width="112" height="52" rx="6" fill="#dff2e8" stroke="#1e6b52" stroke-width="1.6" />
  <text x="716" y="341" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#184e3b" text-anchor="middle">Centroid ID pi(j)</text>
  <text x="716" y="358" font-family="monospace" font-size="10" font-weight="700" fill="#184e3b" text-anchor="middle">16-bit (2 B)</text>

  <text x="780" y="351" font-family="sans-serif" font-size="14" font-weight="700" fill="#184e3b" text-anchor="middle">+</text>

  <rect x="790" y="320" width="112" height="52" rx="6" fill="#fde4cf" stroke="#c25928" stroke-width="1.6" />
  <text x="846" y="341" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#8c3d19" text-anchor="middle">2-Bit Residual r_j</text>
  <text x="846" y="358" font-family="monospace" font-size="10" font-weight="700" fill="#8c3d19" text-anchor="middle">128x2b (32 B)</text>

  <text x="524" y="394" font-family="monospace" font-size="9.5" font-weight="700" fill="#184e3b">d_hat_j = c_pi(j) + r_j  (34 B/token vs. 512 B/token raw)</text>
  <text x="524" y="414" font-family="sans-serif" font-size="10.5" fill="#374840">PLAID prunes 95%+ of candidates via centroid-only MaxSim before reading r_j.</text>
</svg>

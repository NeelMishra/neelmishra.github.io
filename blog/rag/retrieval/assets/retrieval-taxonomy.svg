<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
  <title id="title">RAG Retrieval Taxonomy: Sparse, Dense, Hybrid, Late Interaction, Query Transformation, and Reranking</title>
  <desc id="desc">Four-column visual overview of the six core RAG retrieval methods: (1) Lexical BM25 and Learned Sparse SPLADE, (2) Dense Bi-Encoders and Hybrid RRF/Convex Fusion, (3) Multi-Vector Late Interaction with ColBERT MaxSim, and (4) Query Transformation/HyDE plus Cross-Encoder Reranking and MMR Diversity.</desc>
  <defs>
    <marker id="rt-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#1e6b52" />
    </marker>
    <marker id="rt-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#c25928" />
    </marker>
    <marker id="rt-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2b5c8f" />
    </marker>
  </defs>

  <rect width="960" height="470" rx="16" fill="#fffaf2" stroke="#dcd3c2" stroke-width="1.5" />

  <!-- Header -->
  <text x="32" y="38" font-family="sans-serif" font-size="20" font-weight="700" fill="#1e2d26">How the Six RAG Retrieval Stages Discover, Fuse, and Refine Evidence</text>
  <text x="32" y="62" font-family="sans-serif" font-size="13.5" fill="#52635a">Each retrieval mechanism trades index footprint and query latency against lexical exactness, semantic recall, and fine-grained interaction.</text>

  <!-- ==================== CARD 1: LEXICAL & LEARNED SPARSE ==================== -->
  <rect x="24" y="82" width="216" height="364" rx="12" fill="#ffffff" stroke="#e2ccb5" stroke-width="1.5" />
  <rect x="24" y="82" width="216" height="42" rx="12" fill="#faece0" />
  <text x="132" y="102" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#8c3d19" text-anchor="middle">1. Sparse Inverted Index</text>
  <text x="132" y="117" font-family="sans-serif" font-size="11" fill="#8c3d19" text-anchor="middle">Okapi BM25 | SPLADE</text>

  <rect x="40" y="138" width="184" height="162" rx="8" fill="#faf8f5" stroke="#d5c8b8" />
  <text x="52" y="156" font-family="sans-serif" font-size="11" font-weight="700" fill="#8c3d19">A. Exact Term Posting List:</text>
  <rect x="52" y="164" width="160" height="24" rx="4" fill="#fde4cf" stroke="#c25928" stroke-width="1.4" />
  <text x="132" y="180" font-family="monospace" font-size="10" font-weight="700" fill="#8c3d19" text-anchor="middle">&quot;ERR_WEST_409&quot; -&gt; [D1, D2]</text>
  <text x="52" y="204" font-family="sans-serif" font-size="10" fill="#52635a">IDF * TF saturation (k1, b)</text>

  <text x="52" y="228" font-family="sans-serif" font-size="11" font-weight="700" fill="#184e3b">B. SPLADE Vocab Expansion:</text>
  <rect x="52" y="236" width="76" height="22" rx="4" fill="#d3ede0" stroke="#1e6b52" />
  <text x="90" y="251" font-family="monospace" font-size="9" font-weight="700" fill="#184e3b" text-anchor="middle">revert: 2.1</text>
  <rect x="136" y="236" width="76" height="22" rx="4" fill="#d3ede0" stroke="#1e6b52" />
  <text x="174" y="251" font-family="monospace" font-size="9" font-weight="700" fill="#184e3b" text-anchor="middle">rollback:1.4</text>
  <text x="132" y="278" font-family="sans-serif" font-size="10" fill="#374840" text-anchor="middle">log(1 + ReLU(W_j h_i)) + WAND</text>

  <text x="40" y="324" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#1e2d26">Scoring Signal:</text>
  <text x="40" y="340" font-family="sans-serif" font-size="11" fill="#42524a">Exact token overlap (BM25) or</text>
  <text x="40" y="355" font-family="sans-serif" font-size="11" fill="#42524a">MLM-expanded sparse weights.</text>
  <text x="40" y="382" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#8c3d19">Strength: Exact IDs &amp; codes</text>
  <text x="40" y="400" font-family="sans-serif" font-size="11" fill="#42524a">Zero hallucinated matches on</text>
  <text x="40" y="415" font-family="sans-serif" font-size="11" fill="#42524a">SKUs, flags, and error strings.</text>

  <!-- ==================== CARD 2: DENSE BI-ENCODERS & HYBRID FUSION ==================== -->
  <rect x="252" y="82" width="216" height="364" rx="12" fill="#ffffff" stroke="#c8d6cc" stroke-width="1.5" />
  <rect x="252" y="82" width="216" height="42" rx="12" fill="#e6f2ec" />
  <text x="360" y="102" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#184e3b" text-anchor="middle">2. Dense &amp; Hybrid Fusion</text>
  <text x="360" y="117" font-family="sans-serif" font-size="11" fill="#184e3b" text-anchor="middle">Bi-Encoders | RRF &amp; Convex</text>

  <rect x="268" y="138" width="184" height="162" rx="8" fill="#faf8f5" stroke="#c8d6cc" />
  <text x="280" y="156" font-family="sans-serif" font-size="11" font-weight="700" fill="#184e3b">A. Dual-Tower Bi-Encoder:</text>
  <rect x="280" y="164" width="66" height="24" rx="4" fill="#d3ede0" stroke="#1e6b52" />
  <text x="313" y="180" font-family="monospace" font-size="10" font-weight="700" fill="#184e3b" text-anchor="middle">E_Q(q)</text>
  <text x="360" y="180" font-family="sans-serif" font-size="11" font-weight="700" fill="#184e3b" text-anchor="middle">dot</text>
  <rect x="374" y="164" width="66" height="24" rx="4" fill="#d3ede0" stroke="#1e6b52" />
  <text x="407" y="180" font-family="monospace" font-size="10" font-weight="700" fill="#184e3b" text-anchor="middle">E_P(p)</text>

  <text x="280" y="212" font-family="sans-serif" font-size="11" font-weight="700" fill="#1e4976">B. Hybrid Score Fusion:</text>
  <rect x="280" y="220" width="160" height="30" rx="5" fill="#e6eef8" stroke="#2b5c8f" stroke-width="1.4" />
  <text x="360" y="239" font-family="monospace" font-size="9" font-weight="700" fill="#1e4976" text-anchor="middle">RRF = Sum 1 / (k + r_m)</text>
  <rect x="280" y="256" width="160" height="28" rx="5" fill="#e5f2ec" stroke="#1e6b52" />
  <text x="360" y="274" font-family="monospace" font-size="9" font-weight="700" fill="#184e3b" text-anchor="middle">a*s_dense + (1-a)*s_lex</text>

  <text x="268" y="324" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#1e2d26">Scoring Signal:</text>
  <text x="268" y="340" font-family="sans-serif" font-size="11" fill="#42524a">InfoNCE dense vectors fused</text>
  <text x="268" y="355" font-family="sans-serif" font-size="11" fill="#42524a">with sparse lexical rankings.</text>
  <text x="268" y="382" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#184e3b">Strength: Paraphrase + ID</text>
  <text x="268" y="400" font-family="sans-serif" font-size="11" fill="#42524a">Combines semantic recall with</text>
  <text x="268" y="415" font-family="sans-serif" font-size="11" fill="#42524a">scale-free rank calibration.</text>

  <!-- ==================== CARD 3: MULTI-VECTOR LATE INTERACTION ==================== -->
  <rect x="480" y="82" width="216" height="364" rx="12" fill="#ffffff" stroke="#bfcbe0" stroke-width="1.5" />
  <rect x="480" y="82" width="216" height="42" rx="12" fill="#e6eef8" />
  <text x="588" y="102" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#1e4976" text-anchor="middle">3. Late Interaction</text>
  <text x="588" y="117" font-family="sans-serif" font-size="11" fill="#1e4976" text-anchor="middle">ColBERT MaxSim | PLAID</text>

  <rect x="496" y="138" width="184" height="162" rx="8" fill="#faf8f5" stroke="#bfcbe0" />
  <text x="508" y="156" font-family="sans-serif" font-size="11" font-weight="700" fill="#1e4976">Token-Level MaxSim Operator:</text>

  <!-- Mini token alignment grid -->
  <rect x="508" y="166" width="48" height="22" rx="3" fill="#e6eef8" stroke="#2b5c8f" />
  <text x="532" y="181" font-family="monospace" font-size="9" font-weight="700" fill="#1e4976" text-anchor="middle">q1:west</text>
  <line x1="556" y1="177" x2="594" y2="177" stroke="#1e6b52" stroke-width="2" marker-end="url(#rt-green)" />
  <rect x="598" y="166" width="68" height="22" rx="3" fill="#d3ede0" stroke="#1e6b52" stroke-width="1.5" />
  <text x="632" y="181" font-family="monospace" font-size="9" font-weight="700" fill="#184e3b" text-anchor="middle">d1:west .94</text>

  <rect x="508" y="196" width="48" height="22" rx="3" fill="#e6eef8" stroke="#2b5c8f" />
  <text x="532" y="211" font-family="monospace" font-size="9" font-weight="700" fill="#1e4976" text-anchor="middle">q2:ttl</text>
  <line x1="556" y1="207" x2="594" y2="207" stroke="#1e6b52" stroke-width="2" marker-end="url(#rt-green)" />
  <rect x="598" y="196" width="68" height="22" rx="3" fill="#d3ede0" stroke="#1e6b52" stroke-width="1.5" />
  <text x="632" y="211" font-family="monospace" font-size="9" font-weight="700" fill="#184e3b" text-anchor="middle">d4:300s .88</text>

  <rect x="508" y="232" width="158" height="52" rx="5" fill="#e6eef8" stroke="#2b5c8f" stroke-width="1.4" />
  <text x="587" y="252" font-family="monospace" font-size="9" font-weight="700" fill="#1e4976" text-anchor="middle">Sum_i max_j (q_i . d_j)</text>
  <text x="587" y="270" font-family="sans-serif" font-size="10" fill="#374840" text-anchor="middle">PLAID: Centroid ID + 2b residual</text>

  <text x="496" y="324" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#1e2d26">Scoring Signal:</text>
  <text x="496" y="340" font-family="sans-serif" font-size="11" fill="#42524a">Sum of maximum token dot</text>
  <text x="496" y="355" font-family="sans-serif" font-size="11" fill="#42524a">products across all q_i.</text>
  <text x="496" y="382" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#1e4976">Strength: Modifier binding</text>
  <text x="496" y="400" font-family="sans-serif" font-size="11" fill="#42524a">Prevents single-vector pooling</text>
  <text x="496" y="415" font-family="sans-serif" font-size="11" fill="#42524a">from swapping entity values.</text>

  <!-- ==================== CARD 4: QUERY TRANSFORM, RERANKING & MMR ==================== -->
  <rect x="708" y="82" width="228" height="364" rx="12" fill="#ffffff" stroke="#d9c2b2" stroke-width="1.5" />
  <rect x="708" y="82" width="228" height="42" rx="12" fill="#f7e6dc" />
  <text x="822" y="102" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#8c3d19" text-anchor="middle">4. Rewrite, Rerank &amp; MMR</text>
  <text x="822" y="117" font-family="sans-serif" font-size="11" fill="#8c3d19" text-anchor="middle">HyDE | Cross-Encoder &amp; MMR</text>

  <rect x="724" y="138" width="196" height="162" rx="8" fill="#faf8f5" stroke="#d9c2b2" />
  <text x="736" y="156" font-family="sans-serif" font-size="11" font-weight="700" fill="#8c3d19">A. Query Rewrite &amp; HyDE:</text>
  <rect x="736" y="164" width="172" height="36" rx="5" fill="#fde4cf" stroke="#c25928" stroke-width="1.4" />
  <text x="822" y="180" font-family="sans-serif" font-size="10" font-weight="700" fill="#8c3d19" text-anchor="middle">Multi-Query / HyDE Passage</text>
  <text x="822" y="194" font-family="monospace" font-size="9.5" fill="#374840" text-anchor="middle">v_HyDE = Mean(E_P(d_hat_k))</text>

  <text x="736" y="220" font-family="sans-serif" font-size="11" font-weight="700" fill="#184e3b">B. Cross-Encoder + MMR:</text>
  <rect x="736" y="228" width="172" height="26" rx="4" fill="#d3ede0" stroke="#1e6b52" stroke-width="1.4" />
  <text x="822" y="245" font-family="monospace" font-size="9.5" font-weight="700" fill="#184e3b" text-anchor="middle">CE([CLS] q [SEP] d) -&gt; Top-K</text>
  <rect x="736" y="260" width="172" height="26" rx="4" fill="#e6eef8" stroke="#2b5c8f" stroke-width="1.4" />
  <text x="822" y="277" font-family="monospace" font-size="9.5" font-weight="700" fill="#1e4976" text-anchor="middle">MMR: l*Rel - (1-l)*max Sim</text>

  <text x="724" y="324" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#1e2d26">Scoring Signal:</text>
  <text x="724" y="340" font-family="sans-serif" font-size="11" fill="#42524a">Pre-retrieval query alignment +</text>
  <text x="724" y="355" font-family="sans-serif" font-size="11" fill="#42524a">joint attention &amp; diversity penalty.</text>
  <text x="724" y="382" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#8c3d19">Strength: Precision &amp; coverage</text>
  <text x="724" y="400" font-family="sans-serif" font-size="11" fill="#42524a">Resolves negation and removes</text>
  <text x="724" y="415" font-family="sans-serif" font-size="11" fill="#42524a">near-duplicate prompt chunks.</text>
</svg>

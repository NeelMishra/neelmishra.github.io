<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
  <title id="title">Chunking Methods Taxonomy: Window, Semantic, Hierarchical, and Context-Enriched Splitters</title>
  <desc id="desc">Four-column visual overview of the six core RAG chunking methods: (1) Fixed-Size and Recursive Structure-Aware splitters, (2) Semantic Breakpoint chunking via adjacent sentence cosine distance spikes, (3) Parent-Child decoupled retrieval and generation spans, and (4) Contextual/Late chunking and Proposition/Agentic decomposition.</desc>
  <defs>
    <marker id="ct-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#1e6b52" />
    </marker>
    <marker id="ct-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#c25928" />
    </marker>
    <marker id="ct-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2b5c8f" />
    </marker>
  </defs>

  <rect width="960" height="470" rx="16" fill="#fffaf2" stroke="#dcd3c2" stroke-width="1.5" />

  <!-- Header -->
  <text x="32" y="38" font-family="sans-serif" font-size="20" font-weight="700" fill="#1e2d26">How the Six RAG Chunking Families Define Passage Boundaries</text>
  <text x="32" y="62" font-family="sans-serif" font-size="13.5" fill="#52635a">Each family trades ingestion cost against boundary fidelity, topic purity, and self-contained context.</text>

  <!-- ==================== CARD 1: TOKEN & STRUCTURE SPLITTERS ==================== -->
  <rect x="24" y="82" width="216" height="364" rx="12" fill="#ffffff" stroke="#e2ccb5" stroke-width="1.5" />
  <rect x="24" y="82" width="216" height="42" rx="12" fill="#faece0" />
  <text x="132" y="102" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#8c3d19" text-anchor="middle">1. Windows &amp; Hierarchy</text>
  <text x="132" y="117" font-family="sans-serif" font-size="11" fill="#8c3d19" text-anchor="middle">Fixed Window | Recursive</text>

  <!-- Visual: Sliding Window with Overlap + Heading Tree -->
  <rect x="40" y="138" width="184" height="162" rx="8" fill="#faf8f5" stroke="#d5c8b8" />
  <text x="52" y="156" font-family="sans-serif" font-size="11" font-weight="700" fill="#8c3d19">A. Sliding Window (W, O):</text>
  <rect x="52" y="164" width="104" height="22" rx="4" fill="#fde4cf" stroke="#c25928" stroke-width="1.5" />
  <text x="104" y="179" font-family="monospace" font-size="10.5" font-weight="700" fill="#8c3d19" text-anchor="middle">Win 1 [0..7]</text>
  <rect x="108" y="186" width="48" height="8" fill="#f5c9a6" fill-opacity="0.7" />
  <line x1="108" y1="186" x2="108" y2="194" stroke="#b83b2a" stroke-width="1.5" stroke-dasharray="2 2" />
  <line x1="156" y1="186" x2="156" y2="194" stroke="#b83b2a" stroke-width="1.5" stroke-dasharray="2 2" />
  <rect x="108" y="194" width="104" height="22" rx="4" fill="#d3ede0" stroke="#1e6b52" stroke-width="1.5" />
  <text x="160" y="209" font-family="monospace" font-size="10.5" font-weight="700" fill="#184e3b" text-anchor="middle">Win 2 [4..11]</text>

  <text x="52" y="236" font-family="sans-serif" font-size="11" font-weight="700" fill="#184e3b">B. Recursive Separators:</text>
  <rect x="52" y="244" width="160" height="20" rx="4" fill="#e6eef8" stroke="#2b5c8f" />
  <text x="132" y="258" font-family="monospace" font-size="10.5" font-weight="700" fill="#1e4976" text-anchor="middle">## Heading -&gt; \n\n -&gt; .</text>
  <rect x="52" y="270" width="76" height="20" rx="4" fill="#e5f2ec" stroke="#1e6b52" />
  <text x="90" y="284" font-family="sans-serif" font-size="10" font-weight="700" fill="#184e3b" text-anchor="middle">Sec A (&lt;=W)</text>
  <rect x="136" y="270" width="76" height="20" rx="4" fill="#e5f2ec" stroke="#1e6b52" />
  <text x="174" y="284" font-family="sans-serif" font-size="10" font-weight="700" fill="#184e3b" text-anchor="middle">Sec B (&lt;=W)</text>

  <!-- Summary bullets -->
  <text x="40" y="324" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#1e2d26">Boundary Signal:</text>
  <text x="40" y="340" font-family="sans-serif" font-size="11" fill="#42524a">Token count W, overlap O, or</text>
  <text x="40" y="355" font-family="sans-serif" font-size="11" fill="#42524a">separator tree (##, \n\n, .).</text>
  <text x="40" y="382" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#8c3d19">Ingest Cost: Zero model calls</text>
  <text x="40" y="400" font-family="sans-serif" font-size="11" fill="#42524a">Fastest baseline; add header</text>
  <text x="40" y="415" font-family="sans-serif" font-size="11" fill="#42524a">breadcrumbs to keep scope.</text>

  <!-- ==================== CARD 2: SEMANTIC CHUNKING ==================== -->
  <rect x="252" y="82" width="216" height="364" rx="12" fill="#ffffff" stroke="#c8d6cc" stroke-width="1.5" />
  <rect x="252" y="82" width="216" height="42" rx="12" fill="#e6f2ec" />
  <text x="360" y="102" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#184e3b" text-anchor="middle">2. Semantic Breakpoints</text>
  <text x="360" y="117" font-family="sans-serif" font-size="11" fill="#184e3b" text-anchor="middle">Semantic Chunking</text>

  <!-- Visual: Cosine Distance Spike Curve -->
  <rect x="268" y="138" width="184" height="162" rx="8" fill="#faf8f5" stroke="#c8d6cc" />
  <text x="280" y="156" font-family="sans-serif" font-size="11" font-weight="700" fill="#184e3b">Adjacent Cosine Distance d_i:</text>

  <!-- Threshold line -->
  <line x1="280" y1="196" x2="440" y2="196" stroke="#b83b2a" stroke-width="1.6" stroke-dasharray="4 3" />
  <text x="284" y="190" font-family="sans-serif" font-size="10" font-weight="700" fill="#b83b2a">Threshold tau</text>

  <!-- Polyline of distances: low, low, HIGH SPIKE, low -->
  <polyline points="292,236 332,232 372,166 416,234" fill="none" stroke="#1e6b52" stroke-width="2.4" />
  <circle cx="292" cy="236" r="4.5" fill="#1e6b52" />
  <circle cx="332" cy="232" r="4.5" fill="#1e6b52" />
  <circle cx="372" cy="166" r="6" fill="#d13b27" stroke="#ffffff" stroke-width="1.5" />
  <text x="390" y="170" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#d13b27">Cut!</text>
  <circle cx="416" cy="234" r="4.5" fill="#2b5c8f" />

  <!-- Resulting Topic Chunks -->
  <rect x="280" y="256" width="84" height="28" rx="5" fill="#d3ede0" stroke="#1e6b52" stroke-width="1.5" />
  <text x="322" y="274" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#184e3b" text-anchor="middle">Topic A (S1-3)</text>
  <rect x="372" y="256" width="68" height="28" rx="5" fill="#e6eef8" stroke="#2b5c8f" stroke-width="1.5" />
  <text x="406" y="274" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#1e4976" text-anchor="middle">Topic B</text>

  <!-- Summary bullets -->
  <text x="268" y="324" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#1e2d26">Boundary Signal:</text>
  <text x="268" y="340" font-family="sans-serif" font-size="11" fill="#42524a">Spike in 1 - cos(e_i, e_{i+1})</text>
  <text x="268" y="355" font-family="sans-serif" font-size="11" fill="#42524a">over buffered sentence windows.</text>
  <text x="268" y="382" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#184e3b">Ingest Cost: Sentence embeds</text>
  <text x="268" y="400" font-family="sans-serif" font-size="11" fill="#42524a">Finds topic shifts in prose</text>
  <text x="268" y="415" font-family="sans-serif" font-size="11" fill="#42524a">where headings are absent.</text>

  <!-- ==================== CARD 3: PARENT-CHILD & HIERARCHICAL ==================== -->
  <rect x="480" y="82" width="216" height="364" rx="12" fill="#ffffff" stroke="#bfcbe0" stroke-width="1.5" />
  <rect x="480" y="82" width="216" height="42" rx="12" fill="#e6eef8" />
  <text x="588" y="102" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#1e4976" text-anchor="middle">3. Decoupled Spans</text>
  <text x="588" y="117" font-family="sans-serif" font-size="11" fill="#1e4976" text-anchor="middle">Parent-Child | Sentence Window</text>

  <!-- Visual: Small Child Hit -> Full Parent Context -->
  <rect x="496" y="138" width="184" height="162" rx="8" fill="#faf8f5" stroke="#bfcbe0" />
  <text x="508" y="156" font-family="sans-serif" font-size="11" font-weight="700" fill="#1e4976">Index Small, Return Parent:</text>

  <!-- Child boxes -->
  <rect x="508" y="166" width="48" height="26" rx="4" fill="#f0eee9" stroke="#b8b0a4" />
  <text x="532" y="183" font-family="sans-serif" font-size="10" fill="#6e655c" text-anchor="middle">C1.1</text>

  <rect x="564" y="166" width="48" height="26" rx="4" fill="#d3ede0" stroke="#1e6b52" stroke-width="2" />
  <text x="588" y="183" font-family="sans-serif" font-size="10" font-weight="700" fill="#184e3b" text-anchor="middle">C1.2 Hit</text>

  <rect x="620" y="166" width="48" height="26" rx="4" fill="#f0eee9" stroke="#b8b0a4" />
  <text x="644" y="183" font-family="sans-serif" font-size="10" fill="#6e655c" text-anchor="middle">C1.3</text>

  <!-- Arrow from C1.2 up/down to Parent P1 -->
  <line x1="588" y1="192" x2="588" y2="224" stroke="#2b5c8f" stroke-width="2.2" marker-end="url(#ct-blue)" />
  <text x="630" y="213" font-family="monospace" font-size="10" font-weight="700" fill="#1e4976" text-anchor="middle">parent_id</text>

  <!-- Parent box -->
  <rect x="508" y="230" width="160" height="52" rx="6" fill="#e6eef8" stroke="#2b5c8f" stroke-width="1.8" />
  <text x="588" y="250" font-family="sans-serif" font-size="11" font-weight="700" fill="#1e4976" text-anchor="middle">Parent P1 (512 tok)</text>
  <text x="588" y="268" font-family="sans-serif" font-size="10" fill="#374840" text-anchor="middle">[C1.1 + C1.2 + C1.3] -&gt; LLM</text>

  <!-- Summary bullets -->
  <text x="496" y="324" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#1e2d26">Boundary Signal:</text>
  <text x="496" y="340" font-family="sans-serif" font-size="11" fill="#42524a">128-tok child for vector match;</text>
  <text x="496" y="355" font-family="sans-serif" font-size="11" fill="#42524a">512-tok parent for generation.</text>
  <text x="496" y="382" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#1e4976">Ingest Cost: Dual store</text>
  <text x="496" y="400" font-family="sans-serif" font-size="11" fill="#42524a">Avoids embedding dilution</text>
  <text x="496" y="415" font-family="sans-serif" font-size="11" fill="#42524a">without starving LLM context.</text>

  <!-- ==================== CARD 4: CONTEXTUAL, LATE & PROPOSITION ==================== -->
  <rect x="708" y="82" width="228" height="364" rx="12" fill="#ffffff" stroke="#d9c2b2" stroke-width="1.5" />
  <rect x="708" y="82" width="228" height="42" rx="12" fill="#f7e6dc" />
  <text x="822" y="102" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#8c3d19" text-anchor="middle">4. Context &amp; Atomic Facts</text>
  <text x="822" y="117" font-family="sans-serif" font-size="11" fill="#8c3d19" text-anchor="middle">Contextual/Late | Propositions</text>

  <!-- Visual: Prefix / Late Attention + Atomic Propositions -->
  <rect x="724" y="138" width="196" height="162" rx="8" fill="#faf8f5" stroke="#d9c2b2" />
  <text x="736" y="156" font-family="sans-serif" font-size="11" font-weight="700" fill="#8c3d19">A. Contextual / Late Chunk:</text>
  <rect x="736" y="164" width="172" height="40" rx="5" fill="#fde4cf" stroke="#c25928" stroke-width="1.5" />
  <text x="744" y="180" font-family="sans-serif" font-size="10" font-weight="700" fill="#b83b2a">[Ctx: Acme Q3]</text>
  <text x="744" y="196" font-family="sans-serif" font-size="10" fill="#374840">+ &quot;It grew 18% to $42M.&quot;</text>

  <text x="736" y="224" font-family="sans-serif" font-size="11" font-weight="700" fill="#184e3b">B. Atomic Propositions:</text>
  <rect x="736" y="232" width="172" height="24" rx="4" fill="#d3ede0" stroke="#1e6b52" stroke-width="1.4" />
  <text x="744" y="248" font-family="sans-serif" font-size="10" font-weight="700" fill="#184e3b">P1: Redis West TTL is 300s.</text>
  <rect x="736" y="262" width="172" height="24" rx="4" fill="#d3ede0" stroke="#1e6b52" stroke-width="1.4" />
  <text x="744" y="278" font-family="sans-serif" font-size="10" font-weight="700" fill="#184e3b">P2: Memcached TTL is 60s.</text>

  <!-- Summary bullets -->
  <text x="724" y="324" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#1e2d26">Boundary Signal:</text>
  <text x="724" y="340" font-family="sans-serif" font-size="11" fill="#42524a">Doc-wide attention/prefix or</text>
  <text x="724" y="355" font-family="sans-serif" font-size="11" fill="#42524a">atomic fact decomposition.</text>
  <text x="724" y="382" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#8c3d19">Ingest Cost: Long-ctx / LLM</text>
  <text x="724" y="400" font-family="sans-serif" font-size="11" fill="#42524a">Cures dangling pronouns and</text>
  <text x="724" y="415" font-family="sans-serif" font-size="11" fill="#42524a">multi-fact sentence tangles.</text>
</svg>

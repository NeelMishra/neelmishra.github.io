<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
  <title id="title">Semantic Chunking: Buffered Sentence Windows and Cosine Distance Breakpoint Curve</title>
  <desc id="desc">Left panel shows five consecutive sentences S1 to S5 smoothed with buffer b=1 into buffered windows W1 to W5 and embedded into unit vectors e1 to e5, where S1-S3 cover Redis cache TTLs and S4-S5 shift to IAM role rotation. Right panel plots adjacent cosine distances d1=0.04, d2=0.06, d3=0.72, and d4=0.05 against threshold tau=0.45, splitting after S3 into Chunk 1 and Chunk 2.</desc>
  <defs>
    <marker id="sem-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#1e6b52" />
    </marker>
    <marker id="sem-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#c25928" />
    </marker>
    <marker id="sem-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d13b27" />
    </marker>
  </defs>

  <rect width="960" height="470" rx="16" fill="#fffaf2" stroke="#dcd3c2" stroke-width="1.5" />

  <!-- Header -->
  <text x="32" y="38" font-family="sans-serif" font-size="20" font-weight="700" fill="#1e2d26">Semantic Chunking: Sliding Sentence Buffers &amp; Cosine Breakpoints</text>
  <text x="32" y="62" font-family="sans-serif" font-size="13.5" fill="#52635a">Left: Smooth each sentence with a local buffer (b = 1) before embedding. Right: Split wherever adjacent cosine distance spikes above tau.</text>

  <!-- ==================== LEFT PANEL: BUFFERED SENTENCE WINDOWS ==================== -->
  <rect x="28" y="80" width="440" height="366" rx="12" fill="#ffffff" stroke="#c8d6cc" stroke-width="1.5" />
  <text x="48" y="108" font-family="sans-serif" font-size="15" font-weight="700" fill="#184e3b">1. Buffered Sentence Windows (Buffer b = 1)</text>

  <!-- Column headers -->
  <text x="48" y="130" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#52635a">Sentence in Transcript</text>
  <text x="272" y="130" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#52635a">Window W_i</text>
  <text x="380" y="130" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#52635a">Unit Vector</text>

  <!-- Row 1: S1 (Cache TTL) -->
  <rect x="46" y="140" width="212" height="38" rx="6" fill="#eef8f3" stroke="#1e6b52" stroke-width="1.5" />
  <text x="56" y="156" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#184e3b">S1: Redis session TTL = 900s</text>
  <text x="56" y="171" font-family="sans-serif" font-size="10.5" fill="#374840">Topic A: Cache expiration policy</text>
  <rect x="268" y="144" width="88" height="30" rx="5" fill="#dff2e8" stroke="#1e6b52" stroke-width="1.2" />
  <text x="312" y="163" font-family="sans-serif" font-size="11" font-weight="700" fill="#184e3b" text-anchor="middle">[S1, S2]</text>
  <line x1="356" y1="159" x2="376" y2="159" stroke="#1e6b52" stroke-width="1.6" marker-end="url(#sem-green)" />
  <rect x="382" y="144" width="68" height="30" rx="5" fill="#1e6b52" />
  <text x="416" y="163" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">e1</text>

  <!-- Row 2: S2 (Cache TTL) -->
  <rect x="46" y="186" width="212" height="38" rx="6" fill="#eef8f3" stroke="#1e6b52" stroke-width="1.5" />
  <text x="56" y="202" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#184e3b">S2: Reads refresh key timer</text>
  <text x="56" y="217" font-family="sans-serif" font-size="10.5" fill="#374840">Topic A: Sliding TTL window</text>
  <rect x="268" y="190" width="88" height="30" rx="5" fill="#dff2e8" stroke="#1e6b52" stroke-width="1.2" />
  <text x="312" y="209" font-family="sans-serif" font-size="11" font-weight="700" fill="#184e3b" text-anchor="middle">[S1, S2, S3]</text>
  <line x1="356" y1="205" x2="376" y2="205" stroke="#1e6b52" stroke-width="1.6" marker-end="url(#sem-green)" />
  <rect x="382" y="190" width="68" height="30" rx="5" fill="#1e6b52" />
  <text x="416" y="209" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">e2</text>

  <!-- Row 3: S3 (Cache TTL) -->
  <rect x="46" y="232" width="212" height="38" rx="6" fill="#eef8f3" stroke="#1e6b52" stroke-width="1.5" />
  <text x="56" y="248" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#184e3b">S3: Expired keys evicted lazily</text>
  <text x="56" y="263" font-family="sans-serif" font-size="10.5" fill="#374840">Topic A: Background sweep</text>
  <rect x="268" y="236" width="88" height="30" rx="5" fill="#dff2e8" stroke="#1e6b52" stroke-width="1.2" />
  <text x="312" y="255" font-family="sans-serif" font-size="11" font-weight="700" fill="#184e3b" text-anchor="middle">[S2, S3, S4]</text>
  <line x1="356" y1="251" x2="376" y2="251" stroke="#1e6b52" stroke-width="1.6" marker-end="url(#sem-green)" />
  <rect x="382" y="236" width="68" height="30" rx="5" fill="#1e6b52" />
  <text x="416" y="255" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">e3</text>

  <!-- Topic shift divider line between S3 and S4 -->
  <line x1="46" y1="281" x2="450" y2="281" stroke="#d13b27" stroke-width="2.2" stroke-dasharray="6 4" />
  <rect x="128" y="272" width="240" height="18" rx="4" fill="#fff0ed" stroke="#d13b27" stroke-width="1.2" />
  <text x="248" y="285" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#d13b27" text-anchor="middle">Topic Breakpoint: d3 = 0.72 &gt; tau (0.45)</text>

  <!-- Row 4: S4 (IAM Rotation) -->
  <rect x="46" y="294" width="212" height="38" rx="6" fill="#fff6ee" stroke="#c25928" stroke-width="1.5" />
  <text x="56" y="310" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#8c3d19">S4: IAM roles rotate STS hourly</text>
  <text x="56" y="325" font-family="sans-serif" font-size="10.5" fill="#374840">Topic B: Credential rotation</text>
  <rect x="268" y="298" width="88" height="30" rx="5" fill="#fde4cf" stroke="#c25928" stroke-width="1.2" />
  <text x="312" y="317" font-family="sans-serif" font-size="11" font-weight="700" fill="#8c3d19" text-anchor="middle">[S3, S4, S5]</text>
  <line x1="356" y1="313" x2="376" y2="313" stroke="#c25928" stroke-width="1.6" marker-end="url(#sem-amber)" />
  <rect x="382" y="298" width="68" height="30" rx="5" fill="#c25928" />
  <text x="416" y="317" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">e4</text>

  <!-- Row 5: S5 (IAM Rotation) -->
  <rect x="46" y="340" width="212" height="38" rx="6" fill="#fff6ee" stroke="#c25928" stroke-width="1.5" />
  <text x="56" y="356" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#8c3d19">S5: Policy scopes single S3 prefix</text>
  <text x="56" y="371" font-family="sans-serif" font-size="10.5" fill="#374840">Topic B: Least-privilege access</text>
  <rect x="268" y="344" width="88" height="30" rx="5" fill="#fde4cf" stroke="#c25928" stroke-width="1.2" />
  <text x="312" y="363" font-family="sans-serif" font-size="11" font-weight="700" fill="#8c3d19" text-anchor="middle">[S4, S5]</text>
  <line x1="356" y1="359" x2="376" y2="359" stroke="#c25928" stroke-width="1.6" marker-end="url(#sem-amber)" />
  <rect x="382" y="344" width="68" height="30" rx="5" fill="#c25928" />
  <text x="416" y="363" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">e5</text>

  <!-- Left panel bottom summary -->
  <rect x="46" y="388" width="404" height="44" rx="8" fill="#f3f7f4" stroke="#c8d6cc" />
  <text x="60" y="406" font-family="sans-serif" font-size="12" font-weight="700" fill="#184e3b">Context smoothing prevents single-sentence noise:</text>
  <text x="60" y="423" font-family="sans-serif" font-size="12" fill="#374840">Short transitions ("However...") inherit neighbor terms via W_i.</text>

  <!-- ==================== RIGHT PANEL: COSINE DISTANCE SPIKE ==================== -->
  <rect x="492" y="80" width="440" height="366" rx="12" fill="#ffffff" stroke="#c8d6cc" stroke-width="1.5" />
  <text x="512" y="108" font-family="sans-serif" font-size="15" font-weight="700" fill="#184e3b">2. Cosine Distance Spike &amp; Breakpoint Threshold</text>

  <!-- Plot area: x in [556, 896], y in [136, 306] corresponding to d in [0.0, 0.85] -->
  <!-- y(d) = 306 - (d / 0.85) * 170 = 306 - 200 * d -->
  <rect x="556" y="136" width="340" height="170" fill="#fafcfb" stroke="#c8d6cc" stroke-width="1.2" />

  <!-- Horizontal grid lines -->
  <!-- d = 0.00 -> y = 306 -->
  <text x="548" y="310" font-family="sans-serif" font-size="10.5" fill="#52635a" text-anchor="end">0.00</text>
  <!-- d = 0.25 -> y = 256 -->
  <line x1="556" y1="256" x2="896" y2="256" stroke="#e3ebe6" stroke-width="1" />
  <text x="548" y="260" font-family="sans-serif" font-size="10.5" fill="#52635a" text-anchor="end">0.25</text>
  <!-- d = 0.50 -> y = 206 -->
  <line x1="556" y1="206" x2="896" y2="206" stroke="#e3ebe6" stroke-width="1" />
  <text x="548" y="210" font-family="sans-serif" font-size="10.5" fill="#52635a" text-anchor="end">0.50</text>
  <!-- d = 0.75 -> y = 156 -->
  <line x1="556" y1="156" x2="896" y2="156" stroke="#e3ebe6" stroke-width="1" />
  <text x="548" y="160" font-family="sans-serif" font-size="10.5" fill="#52635a" text-anchor="end">0.75</text>

  <!-- Threshold line tau = 0.45 -> y = 306 - 200 * 0.45 = 216 -->
  <line x1="556" y1="216" x2="896" y2="216" stroke="#d13b27" stroke-width="2" stroke-dasharray="6 4" />
  <rect x="564" y="194" width="158" height="18" rx="4" fill="#fff0ed" stroke="#d13b27" stroke-width="1" />
  <text x="643" y="207" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#d13b27" text-anchor="middle">Threshold tau = 0.45</text>

  <!-- X-axis positions:
       d1 (1->2): x = 602, d = 0.04 -> y = 298
       d2 (2->3): x = 684, d = 0.06 -> y = 294
       d3 (3->4): x = 766, d = 0.72 -> y = 162
       d4 (4->5): x = 848, d = 0.05 -> y = 296
  -->
  <!-- Polyline connecting the 4 adjacent cosine distances -->
  <polyline points="602,298 684,294 766,162 848,296" fill="none" stroke="#184e3b" stroke-width="2.5" />

  <!-- Data points & labels -->
  <!-- d1 = 0.04 -->
  <circle cx="602" cy="298" r="6" fill="#1e6b52" stroke="#ffffff" stroke-width="1.5" />
  <text x="592" y="283" font-family="sans-serif" font-size="11" font-weight="700" fill="#184e3b" text-anchor="middle">d1 = 0.04</text>
  <text x="602" y="324" font-family="sans-serif" font-size="11" font-weight="700" fill="#374840" text-anchor="middle">1 -&gt; 2</text>

  <!-- d2 = 0.06 -->
  <circle cx="684" cy="294" r="6" fill="#1e6b52" stroke="#ffffff" stroke-width="1.5" />
  <text x="676" y="280" font-family="sans-serif" font-size="11" font-weight="700" fill="#184e3b" text-anchor="end">d2 = 0.06</text>
  <text x="684" y="324" font-family="sans-serif" font-size="11" font-weight="700" fill="#374840" text-anchor="middle">2 -&gt; 3</text>

  <!-- d3 = 0.72 (Spike!) -->
  <circle cx="766" cy="162" r="7.5" fill="#d13b27" stroke="#ffffff" stroke-width="2" />
  <text x="766" y="149" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#d13b27" text-anchor="middle">d3 = 0.72 (Cut!)</text>
  <text x="766" y="324" font-family="sans-serif" font-size="11" font-weight="700" fill="#d13b27" text-anchor="middle">3 -&gt; 4</text>

  <!-- d4 = 0.05 -->
  <circle cx="848" cy="296" r="6" fill="#c25928" stroke="#ffffff" stroke-width="1.5" />
  <text x="862" y="280" font-family="sans-serif" font-size="11" font-weight="700" fill="#8c3d19" text-anchor="start">d4 = 0.05</text>
  <text x="848" y="324" font-family="sans-serif" font-size="11" font-weight="700" fill="#374840" text-anchor="middle">4 -&gt; 5</text>

  <!-- Resulting chunks box -->
  <rect x="512" y="338" width="194" height="44" rx="8" fill="#eef8f3" stroke="#1e6b52" stroke-width="1.8" />
  <text x="609" y="356" font-family="sans-serif" font-size="12" font-weight="700" fill="#184e3b" text-anchor="middle">Chunk 1: {S1, S2, S3}</text>
  <text x="609" y="373" font-family="sans-serif" font-size="11" fill="#374840" text-anchor="middle">Cohesive Redis TTL topic</text>

  <rect x="718" y="338" width="194" height="44" rx="8" fill="#fff6ee" stroke="#c25928" stroke-width="1.8" />
  <text x="815" y="356" font-family="sans-serif" font-size="12" font-weight="700" fill="#8c3d19" text-anchor="middle">Chunk 2: {S4, S5}</text>
  <text x="815" y="373" font-family="sans-serif" font-size="11" fill="#374840" text-anchor="middle">Cohesive IAM Role topic</text>

  <!-- Right panel bottom takeaway -->
  <rect x="512" y="392" width="400" height="40" rx="8" fill="#eef6f2" stroke="#1e6b52" stroke-width="1.4" />
  <text x="526" y="409" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#184e3b">Only transition 3 -&gt; 4 crosses tau = 0.45 (mu_d + 0.8 * sigma_d):</text>
  <text x="526" y="424" font-family="sans-serif" font-size="11.5" fill="#374840">Fixed 3-sentence splitting with overlap would contaminate S3 with S4.</text>
</svg>

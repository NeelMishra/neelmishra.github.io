<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
  <title id="title">Contextual Retrieval vs. Late Chunking: Explicit Prefix Injection vs. Full-Document Token Pooling</title>
  <desc id="desc">Left panel shows Contextual Retrieval prepending a situating prefix '[Context: Acme Cloud 2026 Q3 filing.]' to Chunk 2 ('It grew by 18% to $42M in Q3.') so both dense embeddings and BM25 lexical indexes recover the 'Acme Cloud' entity. Right panel shows Late Chunking passing the full document token sequence through a long-context transformer first so self-attention links 'It' to 'Acme Cloud' in token states h_1..h_L before mean-pooling each chunk span [a_k, b_k].</desc>
  <defs>
    <marker id="ctx-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#1e6b52" />
    </marker>
    <marker id="ctx-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#c25928" />
    </marker>
    <marker id="ctx-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b83b2a" />
    </marker>
  </defs>

  <rect width="960" height="470" rx="16" fill="#fffaf2" stroke="#dcd3c2" stroke-width="1.5" />

  <!-- Header -->
  <text x="32" y="38" font-family="sans-serif" font-size="20" font-weight="700" fill="#1e2d26">Contextual Retrieval vs. Late Chunking: Resolving Cross-Chunk Pronouns</text>
  <text x="32" y="62" font-family="sans-serif" font-size="13.5" fill="#52635a">Left: Prepend situating text before dense + BM25 indexing. Right: Run long-context attention over the full document before pooling chunk spans.</text>

  <!-- ==================== LEFT PANEL: CONTEXTUAL RETRIEVAL ==================== -->
  <rect x="28" y="80" width="440" height="366" rx="12" fill="#ffffff" stroke="#c8d6cc" stroke-width="1.5" />
  <text x="48" y="108" font-family="sans-serif" font-size="15" font-weight="700" fill="#184e3b">1. Contextual Retrieval (Prepend Situating Context)</text>

  <!-- Step 1: Naive Chunks -->
  <rect x="48" y="122" width="166" height="48" rx="8" fill="#f3f7f4" stroke="#9ab5a6" stroke-width="1.4" />
  <text x="58" y="140" font-family="sans-serif" font-size="11" font-weight="700" fill="#52635a">Chunk 1 (Has Entity)</text>
  <text x="58" y="158" font-family="sans-serif" font-size="11.5" fill="#1e2d26">"Acme Cloud Q3 filing..."</text>

  <rect x="226" y="122" width="222" height="48" rx="8" fill="#fff6ee" stroke="#c25928" stroke-width="1.8" />
  <text x="238" y="140" font-family="sans-serif" font-size="11" font-weight="700" fill="#c25928">Chunk 2 Raw Text (Missing Entity!)</text>
  <text x="238" y="158" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#8c3d19">"It grew by 18% to $42M in Q3."</text>

  <!-- Arrow to Context Generator -->
  <line x1="337" y1="170" x2="337" y2="194" stroke="#c25928" stroke-width="2" marker-end="url(#ctx-amber)" />
  <text x="326" y="187" font-family="sans-serif" font-size="11" font-weight="700" fill="#8c3d19" text-anchor="end">Prompt-cached LLM adds c_2</text>

  <!-- Step 2: Augmented Chunk x_2^ctx -->
  <rect x="48" y="198" width="400" height="66" rx="9" fill="#eef8f3" stroke="#1e6b52" stroke-width="2" />
  <text x="62" y="217" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#184e3b">Augmented Chunk x_2^ctx = c_2 || x_2</text>
  <rect x="60" y="225" width="376" height="30" rx="5" fill="#ffffff" stroke="#9ab5a6" stroke-width="1.2" />
  <text x="68" y="244" font-family="sans-serif" font-size="11" font-weight="700" fill="#1e6b52">[Context: Acme Cloud 2026 Q3 filing.]</text>
  <text x="275" y="244" font-family="sans-serif" font-size="11" fill="#1e2d26">It grew by 18% to $42M.</text>

  <!-- Split arrows to Dense and BM25 -->
  <line x1="148" y1="264" x2="148" y2="298" stroke="#1e6b52" stroke-width="2" marker-end="url(#ctx-green)" />
  <line x1="348" y1="264" x2="348" y2="298" stroke="#1e6b52" stroke-width="2" marker-end="url(#ctx-green)" />

  <!-- Dense Embedding Box -->
  <rect x="48" y="302" width="192" height="72" rx="8" fill="#e4f3eb" stroke="#1e6b52" stroke-width="1.6" />
  <text x="144" y="323" font-family="sans-serif" font-size="12" font-weight="700" fill="#184e3b" text-anchor="middle">Dense Embedding Model</text>
  <text x="144" y="342" font-family="sans-serif" font-size="11" fill="#1e2d26" text-anchor="middle">e_2^ctx = [0.71, 0.00, 0.71]</text>
  <text x="144" y="360" font-family="sans-serif" font-size="11" font-weight="700" fill="#1e6b52" text-anchor="middle">Restores Acme coordinate</text>

  <!-- BM25 Lexical Index Box -->
  <rect x="256" y="302" width="192" height="72" rx="8" fill="#e4f3eb" stroke="#1e6b52" stroke-width="1.6" />
  <text x="352" y="323" font-family="sans-serif" font-size="12" font-weight="700" fill="#184e3b" text-anchor="middle">BM25 Lexical Index</text>
  <text x="352" y="342" font-family="sans-serif" font-size="11" fill="#1e2d26" text-anchor="middle">Terms: "acme", "cloud", "q3"</text>
  <text x="352" y="360" font-family="sans-serif" font-size="11" font-weight="700" fill="#1e6b52" text-anchor="middle">Exact keyword match hits!</text>

  <!-- Left Panel Takeaway -->
  <rect x="48" y="388" width="400" height="44" rx="8" fill="#f3f7f4" stroke="#c8d6cc" />
  <text x="62" y="406" font-family="sans-serif" font-size="12" font-weight="700" fill="#184e3b">Repairs both hybrid search legs (Dense + BM25 lexical):</text>
  <text x="62" y="423" font-family="sans-serif" font-size="12" fill="#374840">Query "Acme Cloud Q3 growth" matches on exact tokens and vectors.</text>

  <!-- ==================== RIGHT PANEL: LATE CHUNKING ==================== -->
  <rect x="492" y="80" width="440" height="366" rx="12" fill="#ffffff" stroke="#c8d6cc" stroke-width="1.5" />
  <text x="512" y="108" font-family="sans-serif" font-size="15" font-weight="700" fill="#184e3b">2. Late Chunking (Embed Full Doc First, Pool Spans Later)</text>

  <!-- Step 1: Full-Document Token Sequence -->
  <rect x="512" y="122" width="400" height="66" rx="8" fill="#f8faf9" stroke="#9ab5a6" stroke-width="1.5" />
  <text x="524" y="139" font-family="sans-serif" font-size="11" font-weight="700" fill="#52635a">Full Document Token Sequence t_1 ... t_L (Unchunked Input)</text>
  <text x="712" y="152" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#b83b2a" text-anchor="middle">Self-attention links "It" -&gt; "Acme"</text>

  <!-- Span 1 token pill -->
  <rect x="524" y="157" width="164" height="24" rx="5" fill="#e4f3eb" stroke="#1e6b52" stroke-width="1.3" />
  <text x="606" y="173" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#184e3b" text-anchor="middle">[a1..b1] "Acme Cloud Q3..."</text>

  <!-- Horizontal attention arrow from Span 2 to Span 1 -->
  <line x1="720" y1="169" x2="692" y2="169" stroke="#b83b2a" stroke-width="2" stroke-dasharray="3 2" marker-end="url(#ctx-red)" />

  <!-- Span 2 token pill -->
  <rect x="722" y="157" width="178" height="24" rx="5" fill="#fff6ee" stroke="#c25928" stroke-width="1.5" />
  <text x="811" y="173" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#8c3d19" text-anchor="middle">[a2..b2] "It grew by 18%..."</text>

  <!-- Arrow down to Long-Context Transformer -->
  <line x1="712" y1="188" x2="712" y2="210" stroke="#1e6b52" stroke-width="2" marker-end="url(#ctx-green)" />

  <!-- Step 2: Long-Context Transformer -->
  <rect x="512" y="214" width="400" height="68" rx="9" fill="#eef8f3" stroke="#1e6b52" stroke-width="2" />
  <text x="712" y="234" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#184e3b" text-anchor="middle">Long-Context Transformer (8k-32k Window)</text>
  <text x="712" y="252" font-family="sans-serif" font-size="11.5" fill="#1e2d26" text-anchor="middle">Token states H = [h_1, ..., h_b1  ||  h_a2, ..., h_L]</text>
  <text x="712" y="270" font-family="sans-serif" font-size="11" font-weight="700" fill="#1e6b52" text-anchor="middle">Every token h_t in [a2..b2] already attends to "Acme Cloud"</text>

  <!-- Split arrows to Span Mean Pooling -->
  <line x1="608" y1="282" x2="608" y2="306" stroke="#1e6b52" stroke-width="2" marker-end="url(#ctx-green)" />
  <line x1="812" y1="282" x2="812" y2="306" stroke="#1e6b52" stroke-width="2" marker-end="url(#ctx-green)" />

  <!-- Step 3: Late Mean Pooling per Span -->
  <rect x="512" y="310" width="188" height="64" rx="8" fill="#f3f7f4" stroke="#9ab5a6" stroke-width="1.5" />
  <text x="606" y="330" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#184e3b" text-anchor="middle">Pool Span [a1, b1]</text>
  <text x="606" y="348" font-family="sans-serif" font-size="11" fill="#1e2d26" text-anchor="middle">e_1^late = Mean(h_a1 : h_b1)</text>
  <text x="606" y="364" font-family="sans-serif" font-size="10.5" fill="#52635a" text-anchor="middle">Chunk 1 vector</text>

  <rect x="716" y="310" width="196" height="64" rx="8" fill="#c7ead8" stroke="#1e6b52" stroke-width="2" />
  <text x="814" y="330" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#184e3b" text-anchor="middle">Pool Span [a2, b2]</text>
  <text x="814" y="348" font-family="sans-serif" font-size="11" font-weight="700" fill="#184e3b" text-anchor="middle">e_2^late = Mean(h_a2 : h_b2)</text>
  <text x="814" y="364" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#1e6b52" text-anchor="middle">Carries Acme + Q3 growth!</text>

  <!-- Right Panel Takeaway -->
  <rect x="512" y="388" width="400" height="44" rx="8" fill="#eef6f2" stroke="#1e6b52" stroke-width="1.4" />
  <text x="526" y="406" font-family="sans-serif" font-size="12" font-weight="700" fill="#184e3b">Single transformer pass over the document; zero LLM generation:</text>
  <text x="526" y="423" font-family="sans-serif" font-size="12" fill="#374840">Fixes dense vectors via attention; raw BM25 text stays unchanged.</text>
</svg>

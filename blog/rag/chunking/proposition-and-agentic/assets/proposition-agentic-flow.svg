<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
  <title id="title">Proposition and Agentic Chunking: Atomic Decomposition, Thematic Cards, and Provenance Verification</title>
  <desc id="desc">Left panel shows an entangled compound sentence ('While Redis v7 defaults to a 300s TTL on West, Memcached uses 60s and disables TLS by default.') decomposed into three atomic decontextualized propositions P1, P2, and P3. Right panel shows an Agentic Router grouping P1 into Card A (Redis West Config) and P2, P3 into Card B (Memcached Defaults), with verified source_span pointers and entity/number grounding checks.</desc>
  <defs>
    <marker id="prop-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#1e6b52" />
    </marker>
    <marker id="prop-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#c25928" />
    </marker>
  </defs>

  <rect width="960" height="470" rx="16" fill="#fffaf2" stroke="#dcd3c2" stroke-width="1.5" />

  <!-- Header -->
  <text x="32" y="38" font-family="sans-serif" font-size="20" font-weight="700" fill="#1e2d26">Proposition &amp; Agentic Chunking: Atomic Facts and Thematic Cards</text>
  <text x="32" y="62" font-family="sans-serif" font-size="13.5" fill="#52635a">Left: Split entangled multi-clause sentences into atomic propositions. Right: Route propositions into thematic cards with grounding verification.</text>

  <!-- ==================== LEFT PANEL: PROPOSITION DECOMPOSITION ==================== -->
  <rect x="28" y="80" width="440" height="366" rx="12" fill="#ffffff" stroke="#c8d6cc" stroke-width="1.5" />
  <text x="48" y="108" font-family="sans-serif" font-size="15" font-weight="700" fill="#184e3b">1. Compound Sentence -&gt; Atomic Propositions</text>

  <!-- Entangled Source Sentence -->
  <rect x="48" y="122" width="400" height="68" rx="9" fill="#fff6ee" stroke="#c25928" stroke-width="1.8" />
  <text x="60" y="141" font-family="sans-serif" font-size="11" font-weight="700" fill="#c25928">Entangled Source Sentence (doc_id=runbook_4, span=[0:94])</text>
  <text x="60" y="160" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#8c3d19">"While Redis v7 defaults to a 300s TTL on West,</text>
  <text x="60" y="177" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#8c3d19">Memcached uses 60s and disables TLS by default."</text>

  <!-- Arrow down to Propositionizer -->
  <line x1="248" y1="190" x2="248" y2="214" stroke="#1e6b52" stroke-width="2" marker-end="url(#prop-green)" />
  <text x="258" y="206" font-family="sans-serif" font-size="11" font-weight="700" fill="#184e3b">Decontextualize + split predicates</text>

  <!-- Proposition P1 -->
  <rect x="48" y="218" width="400" height="48" rx="8" fill="#eef8f3" stroke="#1e6b52" stroke-width="1.8" />
  <rect x="58" y="228" width="36" height="26" rx="5" fill="#1e6b52" />
  <text x="76" y="245" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">P1</text>
  <text x="104" y="239" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#184e3b">"Redis v7 defaults to a 300s TTL on tenant West."</text>
  <text x="104" y="256" font-family="sans-serif" font-size="10.5" fill="#52635a">Atomic fact #1 | Entity: Redis v7 | No TLS token contamination</text>

  <!-- Proposition P2 -->
  <rect x="48" y="274" width="400" height="48" rx="8" fill="#fff6ee" stroke="#c25928" stroke-width="1.6" />
  <rect x="58" y="284" width="36" height="26" rx="5" fill="#c25928" />
  <text x="76" y="301" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">P2</text>
  <text x="104" y="295" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#8c3d19">"Memcached defaults to a 60s TTL."</text>
  <text x="104" y="312" font-family="sans-serif" font-size="10.5" fill="#52635a">Atomic fact #2 | Ellipsis "uses 60s" resolved to "60s TTL"</text>

  <!-- Proposition P3 -->
  <rect x="48" y="330" width="400" height="48" rx="8" fill="#fff6ee" stroke="#c25928" stroke-width="1.6" />
  <rect x="58" y="340" width="36" height="26" rx="5" fill="#c25928" />
  <text x="76" y="357" font-family="sans-serif" font-weight="700" fill="#ffffff" text-anchor="middle">P3</text>
  <text x="104" y="351" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#8c3d19">"Memcached disables TLS by default."</text>
  <text x="104" y="368" font-family="sans-serif" font-size="10.5" fill="#52635a">Atomic fact #3 | "disables TLS" bound strictly to Memcached</text>

  <!-- Left Panel Takeaway -->
  <rect x="48" y="388" width="400" height="44" rx="8" fill="#f3f7f4" stroke="#c8d6cc" />
  <text x="62" y="406" font-family="sans-serif" font-size="12" font-weight="700" fill="#184e3b">Prevents cross-clause hallucination:</text>
  <text x="62" y="423" font-family="sans-serif" font-size="12" fill="#374840">Query "Does Redis v7 disable TLS?" skips Memcached's clause.</text>

  <!-- ==================== RIGHT PANEL: AGENTIC GROUPING & GROUNDING ==================== -->
  <rect x="492" y="80" width="440" height="366" rx="12" fill="#ffffff" stroke="#c8d6cc" stroke-width="1.5" />
  <text x="512" y="108" font-family="sans-serif" font-size="15" font-weight="700" fill="#184e3b">2. Agentic Thematic Grouping &amp; Provenance Link</text>

  <!-- Agentic Router + Grounding Verifier Bar -->
  <rect x="512" y="122" width="400" height="54" rx="8" fill="#eef8f3" stroke="#1e6b52" stroke-width="1.6" />
  <text x="712" y="142" font-family="sans-serif" font-size="12" font-weight="700" fill="#184e3b" text-anchor="middle">Agentic Router &amp; Deterministic Grounding Verifier</text>
  <text x="712" y="161" font-family="sans-serif" font-size="11" fill="#1e2d26" text-anchor="middle">Checks numbers {300s, 60s} &amp; entities {Redis v7, Memcached, TLS} in span</text>

  <!-- Routing arrows to Card A and Card B -->
  <line x1="610" y1="176" x2="610" y2="204" stroke="#1e6b52" stroke-width="2" marker-end="url(#prop-green)" />
  <text x="550" y="195" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#184e3b">Route P1</text>

  <line x1="814" y1="176" x2="814" y2="204" stroke="#c25928" stroke-width="2" marker-end="url(#prop-amber)" />
  <text x="740" y="195" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#c25928">Route P2, P3</text>

  <!-- Card A: Redis West Config -->
  <rect x="512" y="208" width="192" height="106" rx="9" fill="#e4f3eb" stroke="#1e6b52" stroke-width="2" />
  <text x="524" y="228" font-family="sans-serif" font-size="12" font-weight="700" fill="#184e3b">Card A: Redis West Config</text>
  <rect x="524" y="238" width="168" height="36" rx="5" fill="#ffffff" stroke="#9ab5a6" />
  <text x="532" y="253" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#184e3b">P1: Redis v7 300s TTL</text>
  <text x="532" y="267" font-family="sans-serif" font-size="10" fill="#52635a">sim(P1, Card A) = 0.91 &gt;= tau</text>
  <text x="524" y="294" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#1e6b52">source_span: runbook_4[0:46]</text>
  <text x="524" y="307" font-family="sans-serif" font-size="10" fill="#374840">Grounding check: PASS</text>

  <!-- Card B: Memcached Defaults -->
  <rect x="720" y="208" width="192" height="106" rx="9" fill="#fff6ee" stroke="#c25928" stroke-width="2" />
  <text x="732" y="228" font-family="sans-serif" font-size="12" font-weight="700" fill="#8c3d19">Card B: Memcached Defaults</text>
  <rect x="732" y="238" width="168" height="36" rx="5" fill="#ffffff" stroke="#d9b296" />
  <text x="740" y="253" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#8c3d19">P2: 60s TTL | P3: No TLS</text>
  <text x="740" y="267" font-family="sans-serif" font-size="10" fill="#52635a">sim(P3, Card B) = 0.88 &gt;= tau</text>
  <text x="732" y="294" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#8c3d19">source_span: runbook_4[48:94]</text>
  <text x="732" y="307" font-family="sans-serif" font-size="10" fill="#374840">Grounding check: PASS</text>

  <!-- Provenance Verification Bar -->
  <rect x="512" y="326" width="400" height="50" rx="8" fill="#f8faf9" stroke="#9ab5a6" stroke-width="1.4" />
  <text x="526" y="345" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#1e2d26">Provenance Link -&gt; Raw Paragraph (doc_id=runbook_4)</text>
  <text x="526" y="363" font-family="sans-serif" font-size="11" fill="#52635a">Index atomic propositions for precision; fetch verified source_span for citation.</text>

  <!-- Right Panel Takeaway -->
  <rect x="512" y="388" width="400" height="44" rx="8" fill="#eef6f2" stroke="#1e6b52" stroke-width="1.4" />
  <text x="526" y="406" font-family="sans-serif" font-size="12" font-weight="700" fill="#184e3b">High-precision retrieval + coherent synthesis context:</text>
  <text x="526" y="423" font-family="sans-serif" font-size="12" fill="#374840">Match atomic proposition p_i, return thematic card C_j + source span.</text>
</svg>

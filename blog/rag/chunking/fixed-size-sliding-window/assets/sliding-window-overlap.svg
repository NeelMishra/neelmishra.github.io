<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
  <title id="title">Fixed-Size vs Sliding-Window Chunking: Boundary Splits and Overlap Recovery</title>
  <desc id="desc">Left panel shows a 16-token stream where a 5-token answer span t7..t11 (cache flag is --west-v2 only) is severed at the boundary between t7 and t8 when W=8 and overlap O=0. Right panel shows sliding windows with W=8, O=4, and stride S=4 where Window 1 (t4..t11) captures the entire answer span intact.</desc>
  <defs>
    <marker id="sw-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#1e6b52" />
    </marker>
    <marker id="sw-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b83b2a" />
    </marker>
  </defs>

  <rect width="960" height="470" rx="16" fill="#fffaf2" stroke="#dcd3c2" stroke-width="1.5" />

  <!-- Header -->
  <text x="32" y="38" font-family="sans-serif" font-size="20" font-weight="700" fill="#1e2d26">Fixed-Size &amp; Sliding-Window Chunking: Boundary Splits vs. Stride Overlap</text>
  <text x="32" y="62" font-family="sans-serif" font-size="13.5" fill="#52635a">16-token stream (L = 16) with window W = 8. Answer span t7..t11 (&quot;cache flag is --west-v2 only&quot;, m = 5) straddles index 7|8.</text>

  <!-- ==================== LEFT PANEL: ZERO OVERLAP (O = 0) ==================== -->
  <rect x="28" y="80" width="440" height="366" rx="12" fill="#ffffff" stroke="#c8d6cc" stroke-width="1.5" />
  <text x="48" y="108" font-family="sans-serif" font-size="15" font-weight="700" fill="#b83b2a">1. Zero Overlap (O = 0) Splits a Cross-Boundary Fact</text>

  <!-- Token Stream Bar (t0..t15) -->
  <text x="48" y="132" font-family="sans-serif" font-size="12" font-weight="700" fill="#374840">Document Stream (16 tokens, cut at t7 | t8 with S = 8):</text>
  <!-- Left half t0..t6 -->
  <rect x="48" y="142" width="166" height="36" rx="6" fill="#f3f5f4" stroke="#9ab5a6" stroke-width="1.4" />
  <text x="131" y="158" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#52635a" text-anchor="middle">t0..t6 (prefix)</text>
  <text x="131" y="172" font-family="monospace" font-size="10.5" fill="#374840" text-anchor="middle">&quot;...The West&quot;</text>

  <!-- t7 (inside Chunk 1) -->
  <rect x="218" y="142" width="44" height="36" rx="6" fill="#fde4cf" stroke="#c25928" stroke-width="1.8" />
  <text x="240" y="158" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#8c3d19" text-anchor="middle">t7</text>
  <text x="240" y="172" font-family="monospace" font-size="10.5" font-weight="700" fill="#8c3d19" text-anchor="middle">cache</text>

  <!-- Hard cut line between t7 and t8 -->
  <line x1="266" y1="134" x2="266" y2="202" stroke="#b83b2a" stroke-width="2.5" stroke-dasharray="4 3" />
  <text x="266" y="214" font-family="sans-serif" font-size="11" font-weight="700" fill="#b83b2a" text-anchor="middle">Hard Cut (t7 | t8)</text>

  <!-- t8..t11 (inside Chunk 2) -->
  <rect x="270" y="142" width="114" height="36" rx="6" fill="#fde4cf" stroke="#c25928" stroke-width="1.8" />
  <text x="327" y="158" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#8c3d19" text-anchor="middle">t8..t11 (4 tok)</text>
  <text x="327" y="172" font-family="monospace" font-size="9.5" font-weight="700" fill="#8c3d19" text-anchor="middle">flag..--west-v2</text>

  <!-- Right suffix t12..t15 -->
  <rect x="388" y="142" width="60" height="36" rx="6" fill="#f3f5f4" stroke="#9ab5a6" stroke-width="1.4" />
  <text x="418" y="158" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#52635a" text-anchor="middle">t12..t15</text>
  <text x="418" y="172" font-family="monospace" font-size="9.5" fill="#374840" text-anchor="middle">during..</text>

  <!-- Resulting Disjoint Chunks -->
  <!-- Chunk 1 -->
  <rect x="48" y="230" width="400" height="66" rx="8" fill="#fff6ee" stroke="#c25928" stroke-width="1.8" />
  <text x="62" y="250" font-family="sans-serif" font-size="12" font-weight="700" fill="#8c3d19">Chunk 1 (t0..t7, W = 8): 1 of 5 answer tokens</text>
  <text x="62" y="268" font-family="monospace" font-size="11" fill="#374840">&quot;In region East use default The West cache&quot;</text>
  <text x="62" y="286" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#b83b2a">Missing predicate &amp; value: &quot;flag is --west-v2 only&quot;</text>

  <!-- Chunk 2 -->
  <rect x="48" y="308" width="400" height="66" rx="8" fill="#fff6ee" stroke="#c25928" stroke-width="1.8" />
  <text x="62" y="328" font-family="sans-serif" font-size="12" font-weight="700" fill="#8c3d19">Chunk 2 (t8..t15, W = 8): 4 of 5 answer tokens</text>
  <text x="62" y="346" font-family="monospace" font-size="11" fill="#374840">&quot;flag is --west-v2 only during peak traffic hours&quot;</text>
  <text x="62" y="364" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#b83b2a">Orphaned value: missing subject &quot;West cache&quot;</text>

  <!-- Bottom takeaway Left Panel -->
  <rect x="48" y="388" width="400" height="44" rx="8" fill="#fdf2f0" stroke="#e0b4ad" />
  <text x="62" y="406" font-family="sans-serif" font-size="12" font-weight="700" fill="#b83b2a">Query: &quot;What is the West cache flag?&quot;</text>
  <text x="62" y="423" font-family="sans-serif" font-size="12" fill="#374840">Neither chunk links &quot;West cache&quot; to &quot;--west-v2&quot; on its own.</text>

  <!-- ==================== RIGHT PANEL: SLIDING WINDOW (O = 4) ==================== -->
  <rect x="492" y="80" width="440" height="366" rx="12" fill="#ffffff" stroke="#c8d6cc" stroke-width="1.5" />
  <text x="512" y="108" font-family="sans-serif" font-size="15" font-weight="700" fill="#184e3b">2. Sliding Window (W = 8, O = 4) Preserves the Span</text>

  <!-- Timeline Axis Header -->
  <text x="512" y="132" font-family="sans-serif" font-size="12" font-weight="700" fill="#374840">Token Index Axis (t0..t15) &amp; Target Span t7..t11 (m = 5):</text>
  <!-- Target Span highlight band across windows -->
  <rect x="687" y="140" width="125" height="232" rx="4" fill="#dff2e8" fill-opacity="0.55" stroke="#1e6b52" stroke-width="1.4" stroke-dasharray="4 3" />
  <text x="749" y="154" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#184e3b" text-anchor="middle">Span t7..t11 (m = 5)</text>

  <!-- Window 0: t0..t7 (x: 512 to 712, width 200) -->
  <rect x="512" y="166" width="200" height="58" rx="8" fill="#f5f4f2" stroke="#9a948c" stroke-width="1.5" />
  <text x="524" y="185" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#52635a">Window 0 (t0..t7)</text>
  <text x="524" y="201" font-family="monospace" font-size="10.5" fill="#374840">&quot;In..The West cache&quot;</text>
  <text x="524" y="216" font-family="sans-serif" font-size="10.5" fill="#8c3d19">Partial (only t7 inside)</text>

  <!-- Window 1: t4..t11 (x: 612 to 812, width 200) - FULL HIT -->
  <rect x="612" y="236" width="200" height="64" rx="8" fill="#e4f3eb" stroke="#1e6b52" stroke-width="2.4" />
  <text x="624" y="255" font-family="sans-serif" font-size="12" font-weight="700" fill="#184e3b">Window 1 (t4..t11) — Full Span!</text>
  <text x="624" y="272" font-family="monospace" font-size="10.5" font-weight="700" fill="#184e3b">&quot;default The West cache</text>
  <text x="624" y="287" font-family="monospace" font-size="10.5" font-weight="700" fill="#184e3b"> flag is --west-v2 only&quot;</text>

  <!-- Stride callout on left of Window 1 -->
  <line x1="512" y1="268" x2="606" y2="268" stroke="#1e6b52" stroke-width="1.8" marker-end="url(#sw-green)" />
  <text x="559" y="261" font-family="sans-serif" font-size="11" font-weight="700" fill="#184e3b" text-anchor="middle">+S = 4 tok</text>

  <!-- Window 2: t8..t15 (x: 712 to 912, width 200) -->
  <rect x="712" y="312" width="200" height="58" rx="8" fill="#f5f4f2" stroke="#9a948c" stroke-width="1.5" />
  <text x="724" y="331" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#52635a">Window 2 (t8..t15)</text>
  <text x="724" y="347" font-family="monospace" font-size="10.5" fill="#374840">&quot;flag is --west-v2..hours&quot;</text>
  <text x="724" y="362" font-family="sans-serif" font-size="10.5" fill="#8c3d19">Partial (t8..t11 inside)</text>

  <!-- Stride callout on left of Window 2 -->
  <line x1="612" y1="341" x2="706" y2="341" stroke="#1e6b52" stroke-width="1.8" marker-end="url(#sw-green)" />
  <text x="659" y="334" font-family="sans-serif" font-size="11" font-weight="700" fill="#184e3b" text-anchor="middle">+S = 4 tok</text>

  <!-- Summary Box in Right Panel -->
  <rect x="512" y="388" width="400" height="44" rx="8" fill="#eef6f2" stroke="#1e6b52" stroke-width="1.4" />
  <text x="526" y="406" font-family="sans-serif" font-size="12" font-weight="700" fill="#184e3b">Exact recovery condition: O &gt;= m - 1  (here 4 &gt;= 5 - 1)</text>
  <text x="526" y="423" font-family="sans-serif" font-size="12" fill="#374840">Window 1 captures t7..t11 intact; index bloat W / (W - O) = 2.0x.</text>
</svg>

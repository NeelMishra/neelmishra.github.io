<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
  <title id="title">Recursive and Structure-Aware Chunking: Hierarchy Preservation vs Naive Fixed Cuts</title>
  <desc id="desc">Left panel shows a 110-token document with Section A (45 tokens) and Section B (65 tokens across Para B1 of 35 tokens and Para B2 of 30 tokens) under a 60-token budget, comparing a naive cut at token 60 against structure-aware cuts at headings and paragraphs. Right panel shows the recursive split-and-merge decision tree descending from \n## to \n\n and attaching header breadcrumbs.</desc>
  <defs>
    <marker id="rs-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#1e6b52" />
    </marker>
    <marker id="rs-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#c25928" />
    </marker>
    <marker id="rs-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b83b2a" />
    </marker>
  </defs>

  <rect width="960" height="470" rx="16" fill="#fffaf2" stroke="#dcd3c2" stroke-width="1.5" />

  <!-- Header -->
  <text x="32" y="38" font-family="sans-serif" font-size="20" font-weight="700" fill="#1e2d26">Recursive &amp; Structure-Aware Chunking: Split Along the Document Hierarchy</text>
  <text x="32" y="62" font-family="sans-serif" font-size="13.5" fill="#52635a">110-token runbook with budget W = 60. Ordered separators [\n## , \n\n, &quot;. &quot;, &quot; &quot;] split only when a node exceeds W.</text>

  <!-- ==================== LEFT PANEL: DOCUMENT HIERARCHY VS NAIVE CUT ==================== -->
  <rect x="28" y="80" width="440" height="366" rx="12" fill="#ffffff" stroke="#c8d6cc" stroke-width="1.5" />
  <text x="48" y="108" font-family="sans-serif" font-size="15" font-weight="700" fill="#184e3b">1. Document Hierarchy vs. Naive Fixed Cut (W = 60)</text>

  <!-- Section A Box (45 tok, fits in W=60) -->
  <rect x="48" y="126" width="286" height="68" rx="8" fill="#e4f3eb" stroke="#1e6b52" stroke-width="1.8" />
  <text x="62" y="146" font-family="monospace" font-size="12" font-weight="700" fill="#184e3b">## Section A: East Cache (45 tok)</text>
  <text x="62" y="164" font-family="sans-serif" font-size="11.5" fill="#374840">Single paragraph (t0..t44): fits under W = 60.</text>
  <text x="62" y="181" font-family="sans-serif" font-size="11" font-weight="700" fill="#1e6b52">Structure-aware Cut #1 at \n##  (after token 45)</text>

  <!-- Right badge for Chunk 1 -->
  <rect x="344" y="138" width="104" height="44" rx="6" fill="#1e6b52" />
  <text x="396" y="157" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">Chunk 1</text>
  <text x="396" y="173" font-family="sans-serif" font-size="10.5" fill="#dff2e8" text-anchor="middle">45 tok (&lt;= 60)</text>

  <!-- Section B Outer Container (65 tok > 60) -->
  <rect x="48" y="206" width="286" height="168" rx="8" fill="#fff6ee" stroke="#c25928" stroke-width="1.8" />
  <text x="62" y="226" font-family="monospace" font-size="11.5" font-weight="700" fill="#8c3d19">## Section B: West Rollback (65 tok)</text>

  <!-- Para B1 (35 tok, t45..t79) -->
  <rect x="60" y="236" width="262" height="62" rx="6" fill="#ffffff" stroke="#c25928" stroke-width="1.4" />
  <text x="72" y="253" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#8c3d19">Para B1 (35 tok, t45..t79)</text>
  <text x="72" y="290" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#1e6b52">Structure Cut #2 at \n\n (after token 80)</text>

  <!-- Naive 60-token cut line slicing right through Para B1 at t60 -->
  <line x1="54" y1="269" x2="338" y2="269" stroke="#b83b2a" stroke-width="2.4" stroke-dasharray="5 3" />
  <text x="72" y="265" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#b83b2a">Naive W=60 cut slices Para B1 at t60!</text>

  <!-- Right badge for Chunk 2 -->
  <rect x="344" y="245" width="104" height="44" rx="6" fill="#1e6b52" />
  <text x="396" y="264" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">Chunk 2</text>
  <text x="396" y="280" font-family="sans-serif" font-size="10.5" fill="#dff2e8" text-anchor="middle">35 tok (&lt;= 60)</text>

  <!-- Para B2 (30 tok, t80..t109) -->
  <rect x="60" y="306" width="262" height="58" rx="6" fill="#ffffff" stroke="#c25928" stroke-width="1.4" />
  <text x="72" y="325" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#8c3d19">Para B2 (30 tok, t80..t109)</text>
  <text x="72" y="343" font-family="sans-serif" font-size="11" fill="#374840">35 + 30 = 65 &gt; 60 (cannot merge B1 + B2)</text>
  <text x="72" y="357" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#184e3b">+ Prepend &quot;## Section B&quot; breadcrumb</text>

  <!-- Right badge for Chunk 3 -->
  <rect x="344" y="313" width="104" height="44" rx="6" fill="#1e6b52" />
  <text x="396" y="332" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">Chunk 3</text>
  <text x="396" y="348" font-family="sans-serif" font-size="10.5" fill="#dff2e8" text-anchor="middle">30 tok (&lt;= 60)</text>

  <!-- Bottom takeaway Left Panel -->
  <rect x="48" y="388" width="400" height="44" rx="8" fill="#fdf2f0" stroke="#e0b4ad" />
  <text x="62" y="406" font-family="sans-serif" font-size="12" font-weight="700" fill="#b83b2a">Naive W = 60 glues 45 tok of East to 15 tok of West.</text>
  <text x="62" y="423" font-family="sans-serif" font-size="12" fill="#374840">Structure-aware splitting respects section and paragraph breaks.</text>

  <!-- ==================== RIGHT PANEL: RECURSIVE SPLIT-AND-MERGE TREE ==================== -->
  <rect x="492" y="80" width="440" height="366" rx="12" fill="#ffffff" stroke="#c8d6cc" stroke-width="1.5" />
  <text x="512" y="108" font-family="sans-serif" font-size="15" font-weight="700" fill="#184e3b">2. Recursive Split-and-Merge Decision Tree</text>

  <!-- Root Node: Full Document (110 tok > 60) -->
  <rect x="592" y="124" width="240" height="46" rx="8" fill="#fff6ee" stroke="#c25928" stroke-width="2" />
  <text x="712" y="144" font-family="sans-serif" font-size="12" font-weight="700" fill="#8c3d19" text-anchor="middle">Root Document (110 tok &gt; 60)</text>
  <text x="712" y="161" font-family="monospace" font-size="11" fill="#52635a" text-anchor="middle">Split by sep[0] = &quot;\n## &quot;</text>

  <!-- Branches from Root to Node A and Node B -->
  <line x1="652" y1="170" x2="596" y2="206" stroke="#1e6b52" stroke-width="2" marker-end="url(#rs-green)" />
  <line x1="772" y1="170" x2="816" y2="206" stroke="#c25928" stroke-width="2" marker-end="url(#rs-amber)" />

  <!-- Level 1 Left: Node A (45 tok <= 60) -> Stop & Emit Chunk 1 -->
  <rect x="510" y="212" width="176" height="58" rx="8" fill="#e4f3eb" stroke="#1e6b52" stroke-width="2.2" />
  <text x="598" y="232" font-family="sans-serif" font-size="12" font-weight="700" fill="#184e3b" text-anchor="middle">Section A (45 tok &lt;= 60)</text>
  <text x="598" y="249" font-family="sans-serif" font-size="11" font-weight="700" fill="#1e6b52" text-anchor="middle">Base case: Emit Chunk 1</text>
  <text x="598" y="263" font-family="monospace" font-size="10" fill="#374840" text-anchor="middle">[East Cache] (45 tok)</text>

  <!-- Level 1 Right: Node B (65 tok > 60) -> Recurse to sep[1] = "\n\n" -->
  <rect x="720" y="212" width="194" height="58" rx="8" fill="#fff6ee" stroke="#c25928" stroke-width="2" />
  <text x="817" y="232" font-family="sans-serif" font-size="12" font-weight="700" fill="#8c3d19" text-anchor="middle">Section B (65 tok &gt; 60)</text>
  <text x="817" y="249" font-family="sans-serif" font-size="11" fill="#8c3d19" text-anchor="middle">Too large! Recurse deeper:</text>
  <text x="817" y="263" font-family="monospace" font-size="10.5" font-weight="700" fill="#52635a" text-anchor="middle">Split by sep[1] = &quot;\n\n&quot;</text>

  <!-- Branches from Node B to Para B1 and Para B2 -->
  <line x1="776" y1="270" x2="660" y2="306" stroke="#1e6b52" stroke-width="2" marker-end="url(#rs-green)" />
  <line x1="850" y1="270" x2="830" y2="306" stroke="#1e6b52" stroke-width="2" marker-end="url(#rs-green)" />

  <!-- Level 2 Left: Para B1 (35 tok <= 60) -->
  <rect x="536" y="312" width="182" height="58" rx="8" fill="#e4f3eb" stroke="#1e6b52" stroke-width="2.2" />
  <text x="627" y="331" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#184e3b" text-anchor="middle">Para B1 (35 tok &lt;= 60)</text>
  <text x="627" y="347" font-family="sans-serif" font-size="11" font-weight="700" fill="#1e6b52" text-anchor="middle">Emit Chunk 2 + Header</text>
  <text x="627" y="362" font-family="monospace" font-size="10" fill="#374840" text-anchor="middle">[West Rollback] Para B1</text>

  <!-- Level 2 Right: Para B2 (30 tok <= 60) -->
  <rect x="732" y="312" width="182" height="58" rx="8" fill="#e4f3eb" stroke="#1e6b52" stroke-width="2.2" />
  <text x="823" y="331" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#184e3b" text-anchor="middle">Para B2 (30 tok &lt;= 60)</text>
  <text x="823" y="347" font-family="sans-serif" font-size="11" font-weight="700" fill="#1e6b52" text-anchor="middle">Emit Chunk 3 + Header</text>
  <text x="823" y="362" font-family="monospace" font-size="10" fill="#374840" text-anchor="middle">[West Rollback] Para B2</text>

  <!-- Summary Box in Right Panel -->
  <rect x="512" y="388" width="400" height="44" rx="8" fill="#eef6f2" stroke="#1e6b52" stroke-width="1.4" />
  <text x="526" y="406" font-family="sans-serif" font-size="12" font-weight="700" fill="#184e3b">Greedy merge: 35 + 30 = 65 &gt; 60, so B1 and B2 stay separate.</text>
  <text x="526" y="423" font-family="sans-serif" font-size="12" fill="#374840">Injecting the section breadcrumb keeps Chunk 3 self-contained.</text>
</svg>

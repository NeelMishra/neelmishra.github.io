<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
  <title id="title">Parent-Child Chunking: Embedding Dilution vs Small-to-Big Lookup and Deduplication</title>
  <desc id="desc">Left panel compares indexing a 4-subtopic parent chunk P1 (whose pooled vector scores cos=0.50 against query q, losing to distractor D at cos=0.65) against indexing 4 child chunks C1.1 to C1.4 where C1.2 scores cos=1.00. Right panel shows the two-store small-to-big lookup where top-k child hits C1.2 and C1.3 resolve via parent_id to a single deduplicated parent P1 in the document store.</desc>
  <defs>
    <marker id="pc-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#1e6b52" />
    </marker>
    <marker id="pc-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#c25928" />
    </marker>
    <marker id="pc-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d13b27" />
    </marker>
  </defs>

  <rect width="960" height="470" rx="16" fill="#fffaf2" stroke="#dcd3c2" stroke-width="1.5" />

  <!-- Header -->
  <text x="32" y="38" font-family="sans-serif" font-size="20" font-weight="700" fill="#1e2d26">Parent-Child Chunking: Small-to-Big Retrieval &amp; Deduplication</text>
  <text x="32" y="62" font-family="sans-serif" font-size="13.5" fill="#52635a">Left: Pooling m = 4 subtopics dilutes cosine similarity by 1/sqrt(m). Right: Index small children, deduplicate parent_id, return full parent.</text>

  <!-- ==================== LEFT PANEL: EMBEDDING DILUTION ==================== -->
  <rect x="28" y="80" width="440" height="366" rx="12" fill="#ffffff" stroke="#c8d6cc" stroke-width="1.5" />
  <text x="48" y="108" font-family="sans-serif" font-size="15" font-weight="700" fill="#184e3b">1. Why Large Chunks Dilute Query Similarity</text>

  <!-- Query Pill -->
  <rect x="48" y="122" width="400" height="32" rx="6" fill="#eef8f3" stroke="#1e6b52" stroke-width="1.5" />
  <text x="248" y="142" font-family="sans-serif" font-size="12" font-weight="700" fill="#184e3b" text-anchor="middle">Query q = (0, 1, 0, 0): "What is the migration lock timeout?"</text>

  <!-- Case A: Direct Parent Indexing (Fails) -->
  <rect x="48" y="166" width="400" height="94" rx="8" fill="#fff5f2" stroke="#d13b27" stroke-width="1.5" />
  <text x="60" y="186" font-family="sans-serif" font-size="12" font-weight="700" fill="#d13b27">A. Flat Parent Indexing (800-token multi-topic section)</text>

  <rect x="60" y="196" width="182" height="52" rx="6" fill="#ffffff" stroke="#d13b27" stroke-width="1.4" />
  <text x="151" y="215" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#8c3d19" text-anchor="middle">Parent P1 = (0.5, 0.5, 0.5, 0.5)</text>
  <text x="151" y="231" font-family="sans-serif" font-size="10.5" fill="#52635a" text-anchor="middle">Pools 4 orthogonal subtopics</text>
  <text x="151" y="244" font-family="sans-serif" font-size="11" font-weight="700" fill="#d13b27" text-anchor="middle">cos(q, P1) = 0.50 (Diluted!)</text>

  <rect x="254" y="196" width="182" height="52" rx="6" fill="#fde4cf" stroke="#c25928" stroke-width="1.8" />
  <text x="345" y="215" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#8c3d19" text-anchor="middle">Distractor D = (0.76, 0.65, 0, 0)</text>
  <text x="345" y="231" font-family="sans-serif" font-size="10.5" fill="#52635a" text-anchor="middle">Generic lock overview doc</text>
  <text x="345" y="244" font-family="sans-serif" font-size="11" font-weight="700" fill="#8c3d19" text-anchor="middle">cos(q, D) = 0.65 (Wins Top-1!)</text>

  <!-- Case B: Child Indexing (Succeeds) -->
  <rect x="48" y="272" width="400" height="104" rx="8" fill="#eef8f3" stroke="#1e6b52" stroke-width="1.6" />
  <text x="60" y="292" font-family="sans-serif" font-size="12" font-weight="700" fill="#184e3b">B. Child Indexing (4 x 200-token sub-spans of P1)</text>

  <!-- 4 Child Boxes -->
  <rect x="60" y="302" width="88" height="62" rx="6" fill="#ffffff" stroke="#9ab5a6" stroke-width="1.2" />
  <text x="104" y="320" font-family="sans-serif" font-size="11" font-weight="700" fill="#374840" text-anchor="middle">C1.1: Drain</text>
  <text x="104" y="335" font-family="sans-serif" font-size="10" fill="#52635a" text-anchor="middle">(1, 0, 0, 0)</text>
  <text x="104" y="352" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#52635a" text-anchor="middle">cos = 0.00</text>

  <rect x="156" y="302" width="88" height="62" rx="6" fill="#c7ead8" stroke="#1e6b52" stroke-width="2.2" />
  <text x="200" y="320" font-family="sans-serif" font-size="11" font-weight="700" fill="#184e3b" text-anchor="middle">C1.2: Lock</text>
  <text x="200" y="335" font-family="sans-serif" font-size="10" fill="#184e3b" text-anchor="middle">(0, 1, 0, 0)</text>
  <text x="200" y="352" font-family="sans-serif" font-size="11" font-weight="700" fill="#184e3b" text-anchor="middle">cos = 1.00!</text>

  <rect x="252" y="302" width="88" height="62" rx="6" fill="#ffffff" stroke="#9ab5a6" stroke-width="1.2" />
  <text x="296" y="320" font-family="sans-serif" font-size="11" font-weight="700" fill="#374840" text-anchor="middle">C1.3: Lag</text>
  <text x="296" y="335" font-family="sans-serif" font-size="10" fill="#52635a" text-anchor="middle">(0, 0, 1, 0)</text>
  <text x="296" y="352" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#52635a" text-anchor="middle">cos = 0.00</text>

  <rect x="348" y="302" width="88" height="62" rx="6" fill="#ffffff" stroke="#9ab5a6" stroke-width="1.2" />
  <text x="392" y="320" font-family="sans-serif" font-size="11" font-weight="700" fill="#374840" text-anchor="middle">C1.4: Rollback</text>
  <text x="392" y="335" font-family="sans-serif" font-size="10" fill="#52635a" text-anchor="middle">(0, 0, 0, 1)</text>
  <text x="392" y="352" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#52635a" text-anchor="middle">cos = 0.00</text>

  <!-- Left panel bottom summary -->
  <rect x="48" y="388" width="400" height="44" rx="8" fill="#f3f7f4" stroke="#c8d6cc" />
  <text x="62" y="406" font-family="sans-serif" font-size="12" font-weight="700" fill="#184e3b">Dilution factor 1 / sqrt(m) = 1 / sqrt(4) = 0.50:</text>
  <text x="62" y="423" font-family="sans-serif" font-size="12" fill="#374840">Child C1.2 preserves full signal (1.00 &gt; 0.65) and beats distractor D.</text>

  <!-- ==================== RIGHT PANEL: TWO-STORE LOOKUP & DEDUP ==================== -->
  <rect x="492" y="80" width="440" height="366" rx="12" fill="#ffffff" stroke="#c8d6cc" stroke-width="1.5" />
  <text x="512" y="108" font-family="sans-serif" font-size="15" font-weight="700" fill="#184e3b">2. Small-to-Big Lookup &amp; Parent Deduplication</text>

  <!-- Stage 1: Vector Index over Child Chunks -->
  <rect x="512" y="124" width="400" height="82" rx="8" fill="#fafcfb" stroke="#9ab5a6" stroke-width="1.4" />
  <text x="526" y="143" font-family="sans-serif" font-size="12" font-weight="700" fill="#184e3b">Stage 1: Vector Store (Top-k Child Retrieval)</text>

  <rect x="526" y="152" width="178" height="42" rx="6" fill="#c7ead8" stroke="#1e6b52" stroke-width="1.8" />
  <text x="615" y="170" font-family="sans-serif" font-size="11" font-weight="700" fill="#184e3b" text-anchor="middle">Hit #1: Child C1.2 (score 0.80)</text>
  <text x="615" y="185" font-family="sans-serif" font-size="10.5" fill="#374840" text-anchor="middle">parent_id = "P1"</text>

  <rect x="720" y="152" width="178" height="42" rx="6" fill="#dff2e8" stroke="#1e6b52" stroke-width="1.5" />
  <text x="809" y="170" font-family="sans-serif" font-size="11" font-weight="700" fill="#184e3b" text-anchor="middle">Hit #2: Child C1.3 (score 0.60)</text>
  <text x="809" y="185" font-family="sans-serif" font-size="10.5" fill="#374840" text-anchor="middle">parent_id = "P1" (Duplicate!)</text>

  <!-- Arrows converging to Deduplication Gate -->
  <line x1="615" y1="206" x2="675" y2="232" stroke="#1e6b52" stroke-width="2" marker-end="url(#pc-green)" />
  <line x1="809" y1="206" x2="749" y2="232" stroke="#1e6b52" stroke-width="2" marker-end="url(#pc-green)" />

  <!-- Stage 2: Deduplication & Max-Score Aggregation -->
  <rect x="562" y="236" width="300" height="36" rx="18" fill="#fff6ee" stroke="#c25928" stroke-width="1.8" />
  <text x="712" y="258" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#8c3d19" text-anchor="middle">Deduplicate parent_id="P1" &#8226; score = max(0.80, 0.60)</text>

  <line x1="712" y1="272" x2="712" y2="296" stroke="#c25928" stroke-width="2" marker-end="url(#pc-amber)" />

  <!-- Stage 3: Key-Value Document Store (Parent Return) -->
  <rect x="512" y="300" width="400" height="76" rx="8" fill="#eef8f3" stroke="#1e6b52" stroke-width="2" />
  <text x="526" y="320" font-family="sans-serif" font-size="12" font-weight="700" fill="#184e3b">Stage 2: Document Store Lookup -&gt; Emit Full Parent P1 Once</text>

  <rect x="526" y="330" width="372" height="34" rx="6" fill="#ffffff" stroke="#1e6b52" stroke-width="1.4" />
  <text x="712" y="351" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#184e3b" text-anchor="middle">Parent P1: [C1.1 Drain | C1.2 Lock | C1.3 Verify | C1.4 Rollback]</text>

  <!-- Right panel bottom summary -->
  <rect x="512" y="388" width="400" height="44" rx="8" fill="#eef6f2" stroke="#1e6b52" stroke-width="1.4" />
  <text x="526" y="406" font-family="sans-serif" font-size="12" font-weight="700" fill="#184e3b">High-precision trigger + complete generation context:</text>
  <text x="526" y="423" font-family="sans-serif" font-size="12" fill="#374840">LLM receives preconditions (C1.1) and rollback (C1.4) once.</text>
</svg>

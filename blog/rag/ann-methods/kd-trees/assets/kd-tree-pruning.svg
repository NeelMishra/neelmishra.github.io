<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-labelledby="title desc">
<title id="title">KD-tree axis-aligned splits and query-ball pruning</title>
<desc id="desc">A 2D box is split vertically at x1 = 5.0 and horizontally at x2 = 3.0. Query q at (5.2, 5.0) visits B at (6.0, 6.5) first with radius 1.70. The circle of radius 1.70 crosses x1 = 5.0 to discover A at (4.5, 5.0), while missing x2 = 3.0 so C and D are pruned.</desc>
<rect width="720" height="460" rx="14" fill="#fffaf2"/>
<g font-family="sans-serif" fill="#233a31">
<text x="30" y="36" font-size="19" font-weight="700">Prune a branch when the query ball cannot reach its split plane</text>
<text x="30" y="60" font-size="13.5" fill="#4a5d54">Root split: x1 = 5.0. Child splits: x2 = 3.0. Query q = (5.2, 5.0), true nearest A = (4.5, 5.0).</text>

<!-- Left panel: 2D coordinate box (x1 in [0,10] -> x in [40,400], x2 in [0,8] -> y in [420,92]) -->
<!-- Scale: 36 px per unit: x_px = 40 + 36*x1, y_px = 420 - 36*x2 -->
<rect x="40" y="92" width="360" height="328" rx="6" fill="#edf3ed" stroke="#bfcec2" stroke-width="2"/>

<!-- Vertical root split x1 = 5.0 -> x = 220 -->
<line x1="220" y1="92" x2="220" y2="420" stroke="#215d48" stroke-width="2.5"/>
<!-- Horizontal child splits x2 = 3.0 -> y = 312 -->
<line x1="40" y1="312" x2="400" y2="312" stroke="#8fa396" stroke-width="2" stroke-dasharray="6 4"/>

<!-- Query ball around q=(5.2, 5.0) -> (227.2, 240):
     Initial radius to B=(6.0, 6.5): R = 1.70 -> 61.2 px
     Refined radius to A=(4.5, 5.0): R = 0.70 -> 25.2 px -->
<circle cx="227" cy="240" r="61" fill="none" stroke="#b87d36" stroke-width="2" stroke-dasharray="5 4"/>
<circle cx="227" cy="240" r="25" fill="#dceee3" fill-opacity="0.45" stroke="#215d48" stroke-width="2"/>

<!-- Points:
     A=(4.5, 5.0) -> (202, 240)
     B=(6.0, 6.5) -> (256, 186)
     C=(8.0, 2.0) -> (328, 348)
     D=(2.0, 1.0) -> (112, 384)
     q=(5.2, 5.0) -> (227, 240) -->
<circle cx="202" cy="240" r="8" fill="#dceee3" stroke="#215d48" stroke-width="2.5"/>
<circle cx="256" cy="186" r="8" fill="#f6e4ce" stroke="#b87d36" stroke-width="2"/>
<circle cx="328" cy="348" r="8" fill="#e2e7e3" stroke="#7a8b80" stroke-width="2"/>
<circle cx="112" cy="384" r="8" fill="#e2e7e3" stroke="#7a8b80" stroke-width="2"/>
<circle cx="227" cy="240" r="6" fill="#b23c27"/>

<!-- Labels in 2D plot with generous spacing -->
<g font-size="12.5" font-weight="700">
<text x="220" y="110" text-anchor="middle" fill="#215d48">x1 = 5.0</text>
<text x="52" y="304" fill="#4a5d54">x2 = 3.0</text>
<text x="184" y="244" text-anchor="end" fill="#215d48">A (4.5, 5.0)</text>
<text x="238" y="245" fill="#b23c27">q (5.2, 5.0)</text>
<text x="268" y="182" fill="#8c581c">B (6.0, 6.5)</text>
<text x="328" y="372" text-anchor="middle" fill="#5e6f64">C (8.0, 2.0) [pruned]</text>
<text x="112" y="408" text-anchor="middle" fill="#5e6f64">D (2.0, 1.0) [pruned]</text>
<text x="292" y="220" fill="#8c581c" font-weight="400">R_init = 1.70</text>
</g>

<!-- Right panel: Pruning trace -->
<rect x="425" y="92" width="265" height="162" rx="10" fill="#edf3ed" stroke="#bfcec2"/>
<text x="443" y="118" font-size="14.5" font-weight="700">Exact plane-distance test</text>
<text x="443" y="144" font-size="13">1. q_1 = 5.2 &gt; 5.0 visits B first:</text>
<text x="443" y="166" font-size="13">   R^2 = d^2(q, B) = 2.89</text>
<text x="443" y="192" font-size="13">2. Test plane x2 = 3.0:</text>
<text x="443" y="214" font-size="13" fill="#215d48">   (5.0 - 3.0)^2 = 4.00 &gt; 2.89</text>
<text x="443" y="236" font-size="13" font-weight="700">   Prune C (and later D)</text>

<rect x="425" y="270" width="265" height="150" rx="10" fill="#f3e8d9" stroke="#cbab77"/>
<text x="443" y="296" font-size="14.5" font-weight="700">Cross the root split</text>
<text x="443" y="322" font-size="13">3. Test root plane x1 = 5.0:</text>
<text x="443" y="344" font-size="13" fill="#b23c27">   (5.2 - 5.0)^2 = 0.04 &#8804; 2.89</text>
<text x="443" y="368" font-size="13">   Ball crosses x1 = 5.0!</text>
<text x="443" y="394" font-size="13" font-weight="700" fill="#215d48">4. Inspect left-upper, find A (0.49)</text>
</g>
</svg>

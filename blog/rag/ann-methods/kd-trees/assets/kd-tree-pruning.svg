<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
  <title id="title">KD-Tree: 2D Alternating Coordinate Splits and Binary Tree Pruning</title>
  <desc id="desc">Left panel shows 2D space divided by vertical split x1=5.0 and horizontal split x2=3.0 with query ball around q=(5.2, 5.0) crossing x1=5.0 to reach A=(4.5, 5.0) while missing x2=3.0. Right panel shows the corresponding binary KD-tree with visited leaves B and A and pruned leaves C and D.</desc>
  <defs>
    <marker id="kd-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#1e6b52" />
    </marker>
    <marker id="kd-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#c25928" />
    </marker>
  </defs>

  <rect width="960" height="470" rx="16" fill="#fffaf2" stroke="#dcd3c2" stroke-width="1.5" />

  <!-- Header -->
  <text x="32" y="38" font-family="sans-serif" font-size="20" font-weight="700" fill="#1e2d26">KD-Tree: Alternating Axis Splits &amp; Query-Ball Pruning</text>
  <text x="32" y="62" font-family="sans-serif" font-size="13.5" fill="#52635a">Left: Every tree level slices one coordinate axis. Right: Branches whose bounding boxes lie outside the query ball are pruned.</text>

  <!-- ==================== LEFT PANEL: 2D COORDINATE SPLITS ==================== -->
  <rect x="28" y="80" width="440" height="366" rx="12" fill="#ffffff" stroke="#c8d6cc" stroke-width="1.5" />
  <text x="48" y="108" font-family="sans-serif" font-size="15" font-weight="700" fill="#184e3b">1. 2D Space Partitioned by X and Y Cuts</text>

  <!-- 2D Plot Box: x in [0, 10] -> [52, 442] (39px/unit, x=5 at 247); y in [0, 8] -> [378, 126] (31.5px/unit, y=3 at 283.5, y=5 at 220.5) -->
  <!-- Quadrant fills -->
  <rect x="52" y="126" width="195" height="158" fill="#e6f4ec" />
  <rect x="247" y="126" width="195" height="158" fill="#fff3e6" />
  <rect x="52" y="284" width="195" height="94" fill="#f1f3f2" />
  <rect x="247" y="284" width="195" height="94" fill="#f1f3f2" />
  <rect x="52" y="126" width="390" height="252" fill="none" stroke="#9ab5a6" stroke-width="1.6" />

  <!-- Level 1 Horizontal Split: x2 = 3.0 (Blue dashed) -->
  <line x1="52" y1="284" x2="442" y2="284" stroke="#2b5c8f" stroke-width="2.4" stroke-dasharray="6 4" />
  <text x="64" y="276" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#2b5c8f">Level 1 Split: x2 = 3.0</text>

  <!-- Level 0 Vertical Split: x1 = 5.0 (Crimson solid) -->
  <line x1="247" y1="126" x2="247" y2="378" stroke="#b83b2a" stroke-width="2.8" />
  <text x="255" y="144" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#b83b2a">Level 0 Split: x1 = 5.0</text>

  <!-- Search Balls around q = (5.2, 5.0) -> (255, 220) -->
  <!-- Initial ball to B (R = 1.70 -> 62px) crosses x1=5.0 but stays above x2=3.0 (220 + 62 = 282 < 284) -->
  <circle cx="255" cy="220" r="58" fill="none" stroke="#c25928" stroke-width="2" stroke-dasharray="5 4" />
  <!-- Refined ball to A (R = 0.70 -> 27px) -->
  <circle cx="255" cy="220" r="27" fill="#bfe6d2" fill-opacity="0.55" stroke="#1e6b52" stroke-width="2" />

  <!-- Points in 2D space -->
  <!-- A = (4.5, 5.0) -> (228, 220) -->
  <circle cx="228" cy="220" r="7.5" fill="#1e6b52" stroke="#ffffff" stroke-width="2" />
  <text x="184" y="224" font-family="sans-serif" font-size="12" font-weight="700" fill="#184e3b" text-anchor="end">A (4.5, 5.0)</text>

  <!-- q = (5.2, 5.0) -> (255, 220) -->
  <circle cx="255" cy="220" r="6.5" fill="#d13b27" stroke="#ffffff" stroke-width="1.5" />
  <text x="322" y="225" font-family="sans-serif" font-size="12" font-weight="700" fill="#d13b27">q (5.2, 5.0)</text>

  <!-- B = (6.0, 6.5) -> (286, 173) -->
  <circle cx="286" cy="173" r="7.5" fill="#c25928" stroke="#ffffff" stroke-width="2" />
  <text x="304" y="170" font-family="sans-serif" font-size="12" font-weight="700" fill="#8c3d19">B (6.0, 6.5)</text>
  <text x="322" y="198" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#c25928">Initial R = 1.70</text>

  <!-- C = (8.0, 2.0) -> (364, 315) -->
  <circle cx="364" cy="315" r="7" fill="#8a9992" />
  <text x="346" y="340" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#5c6b64" text-anchor="middle">C (8.0, 2.0) [Pruned]</text>

  <!-- D = (2.0, 1.0) -> (130, 346) -->
  <circle cx="130" cy="346" r="7" fill="#8a9992" />
  <text x="130" y="368" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#5c6b64" text-anchor="middle">D (2.0, 1.0) [Pruned]</text>

  <!-- Bottom takeaway in Left Panel -->
  <rect x="52" y="388" width="390" height="44" rx="8" fill="#f3f7f4" stroke="#c8d6cc" />
  <text x="66" y="406" font-family="sans-serif" font-size="12" font-weight="700" fill="#184e3b">Circle crosses x1 = 5.0 (gap 0.2 &lt; R) -&gt; Must check left side!</text>
  <text x="66" y="423" font-family="sans-serif" font-size="12" fill="#374840">Circle misses x2 = 3.0 (gap 2.0 &gt; R) -&gt; Prune bottom cells C &amp; D.</text>

  <!-- ==================== RIGHT PANEL: BINARY KD-TREE ==================== -->
  <rect x="492" y="80" width="440" height="366" rx="12" fill="#ffffff" stroke="#c8d6cc" stroke-width="1.5" />
  <text x="512" y="108" font-family="sans-serif" font-size="15" font-weight="700" fill="#184e3b">2. Binary KD-Tree &amp; Branch-and-Bound Search</text>

  <!-- Tree Edges -->
  <!-- Root to L1 Left (backtracked 2nd) and L1 Right (visited 1st) -->
  <line x1="712" y1="160" x2="606" y2="222" stroke="#1e6b52" stroke-width="2.6" stroke-dasharray="6 4" marker-end="url(#kd-green)" />
  <line x1="712" y1="160" x2="818" y2="222" stroke="#c25928" stroke-width="2.8" marker-end="url(#kd-amber)" />

  <!-- L1 Left to Leaves A and D -->
  <line x1="606" y1="258" x2="554" y2="320" stroke="#1e6b52" stroke-width="2.6" marker-end="url(#kd-green)" />
  <line x1="606" y1="258" x2="658" y2="320" stroke="#b0beb6" stroke-width="2" stroke-dasharray="4 3" />

  <!-- L1 Right to Leaves B and C -->
  <line x1="818" y1="258" x2="766" y2="320" stroke="#c25928" stroke-width="2.6" marker-end="url(#kd-amber)" />
  <line x1="818" y1="258" x2="870" y2="320" stroke="#b0beb6" stroke-width="2" stroke-dasharray="4 3" />

  <!-- Edge Labels -->
  <text x="518" y="188" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#184e3b">x1 &lt;= 5 (3. Backtrack)</text>
  <text x="774" y="188" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#c25928">x1 &gt; 5 (1. Go Right)</text>

  <!-- Root Node (Level 0: Split x1 = 5.0) -->
  <rect x="644" y="126" width="136" height="34" rx="17" fill="#b83b2a" />
  <text x="712" y="148" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">L0: Split x1 = 5.0</text>

  <!-- Level 1 Left Node (Split x2 = 3.0) -->
  <rect x="542" y="224" width="128" height="34" rx="8" fill="#e6eef8" stroke="#2b5c8f" stroke-width="2" />
  <text x="606" y="246" font-family="sans-serif" font-size="12" font-weight="700" fill="#1e4976" text-anchor="middle">L1: Split x2 = 3.0</text>

  <!-- Level 1 Right Node (Split x2 = 3.0) -->
  <rect x="754" y="224" width="128" height="34" rx="8" fill="#e6eef8" stroke="#2b5c8f" stroke-width="2" />
  <text x="818" y="246" font-family="sans-serif" font-size="12" font-weight="700" fill="#1e4976" text-anchor="middle">L1: Split x2 = 3.0</text>

  <!-- Leaf A (Hit!) -->
  <rect x="508" y="322" width="92" height="50" rx="7" fill="#d3ede0" stroke="#1e6b52" stroke-width="2.2" />
  <text x="554" y="342" font-family="sans-serif" font-size="12" font-weight="700" fill="#184e3b" text-anchor="middle">4. Leaf A</text>
  <text x="554" y="360" font-family="sans-serif" font-size="11" font-weight="700" fill="#184e3b" text-anchor="middle">R = 0.70 (Best!)</text>

  <!-- Leaf D (Pruned) -->
  <rect x="612" y="322" width="92" height="50" rx="7" fill="#f4f1ed" stroke="#b8b0a4" stroke-width="1.5" />
  <text x="658" y="342" font-family="sans-serif" font-size="12" font-weight="700" fill="#6e665c" text-anchor="middle">Leaf D</text>
  <text x="658" y="360" font-family="sans-serif" font-size="11" font-weight="700" fill="#b83b2a" text-anchor="middle">PRUNED</text>

  <!-- Leaf B (Visited 1st) -->
  <rect x="720" y="322" width="92" height="50" rx="7" fill="#fde4cf" stroke="#c25928" stroke-width="2" />
  <text x="766" y="342" font-family="sans-serif" font-size="12" font-weight="700" fill="#8c3d19" text-anchor="middle">2. Leaf B</text>
  <text x="766" y="360" font-family="sans-serif" font-size="11" font-weight="700" fill="#8c3d19" text-anchor="middle">R = 1.70</text>

  <!-- Leaf C (Pruned) -->
  <rect x="824" y="322" width="92" height="50" rx="7" fill="#f4f1ed" stroke="#b8b0a4" stroke-width="1.5" />
  <text x="870" y="342" font-family="sans-serif" font-size="12" font-weight="700" fill="#6e665c" text-anchor="middle">Leaf C</text>
  <text x="870" y="360" font-family="sans-serif" font-size="11" font-weight="700" fill="#b83b2a" text-anchor="middle">PRUNED</text>

  <!-- Summary Box in Right Panel -->
  <rect x="512" y="388" width="400" height="44" rx="8" fill="#eef6f2" stroke="#1e6b52" stroke-width="1.4" />
  <text x="526" y="406" font-family="sans-serif" font-size="12" font-weight="700" fill="#184e3b">Result: Only 2 of 4 leaves checked (B then A) to find exact 1-NN</text>
  <text x="526" y="423" font-family="sans-serif" font-size="12" fill="#374840">In high d (d &gt; 20), the query ball intersects almost all split planes.</text>
</svg>

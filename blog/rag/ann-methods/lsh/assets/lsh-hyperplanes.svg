<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" role="img" aria-labelledby="title desc">
  <title id="title">Locality-Sensitive Hashing: Random Hyperplane Wedges and (K, L) S-Curve Amplification</title>
  <desc id="desc">Left panel shows the unit circle where two vectors separated by angle theta are split by a random hyperplane with probability theta/pi. Right panel shows the discovery probability S-curve for (K=1, L=1), (K=4, L=1), and (K=4, L=5) across angles 0 to 180 degrees.</desc>
  <defs>
    <style>
      .bg { fill: #fbfaf6; stroke: #d8d1c2; stroke-width: 1.5; }
      .card { fill: #ffffff; stroke: #d8d1c2; stroke-width: 1.5; rx: 12; }
      .title { font: 700 18px "EB Garamond", Georgia, serif; fill: #1d1b16; }
      .subtitle { font: 600 14px "EB Garamond", Georgia, serif; fill: #2f2a22; }
      .body { font: 400 12.5px "EB Garamond", Georgia, serif; fill: #4a4338; }
      .mono { font: 600 11.5px "JetBrains Mono", "SFMono-Regular", monospace; fill: #2a4b3c; }
      .mono-warm { font: 600 11.5px "JetBrains Mono", "SFMono-Regular", monospace; fill: #8c3d1e; }
      .mono-blue { font: 600 11.5px "JetBrains Mono", "SFMono-Regular", monospace; fill: #1f4e78; }
      .circle-guide { fill: #fcfbf8; stroke: #b8b0a0; stroke-width: 1.5; }
      .wedge { fill: #faeee8; fill-opacity: 0.85; stroke: none; }
      .hyperplane { stroke: #9a9181; stroke-width: 1.6; stroke-dasharray: 5 4; }
      .vec-q { stroke: #1f4e78; stroke-width: 2.6; }
      .vec-a { stroke: #2a6f57; stroke-width: 2.6; }
      .vec-c { stroke: #b8532a; stroke-width: 2.2; stroke-dasharray: 4 3; }
      .axis { stroke: #b8b0a0; stroke-width: 1.3; }
      .grid { stroke: #e6e0d4; stroke-width: 1; stroke-dasharray: 3 3; }
      .curve-11 { fill: none; stroke: #8c8273; stroke-width: 2; stroke-dasharray: 5 4; }
      .curve-41 { fill: none; stroke: #b8532a; stroke-width: 2.2; }
      .curve-45 { fill: none; stroke: #2a6f57; stroke-width: 2.8; }
      .note-box { fill: #f4f1ea; stroke: #d8d1c2; stroke-width: 1.2; rx: 8; }
    </style>
  </defs>

  <rect x="4" y="4" width="912" height="432" rx="14" class="bg" />
  <text x="28" y="34" class="title">LSH: Angular Collision Wedges and (K, L) S-Curve Amplification</text>
  <text x="28" y="54" class="body">Random hyperplanes convert cosine angle theta into bit collisions p(theta) = 1 - theta/pi, amplified by K bits and L tables.</text>

  <!-- Left Panel: Hyperplane Wedge Geometry -->
  <rect x="24" y="70" width="424" height="346" class="card" />
  <text x="44" y="96" class="subtitle">1. SimHash Hyperplane Collision Probability</text>
  <text x="44" y="114" class="body">A random hyperplane splits q and A only if its normal falls in the 2*theta wedge:</text>

  <!-- Unit circle centered at (236, 226), radius 86 -->
  <circle cx="236" cy="226" r="86" class="circle-guide" />
  <!-- Shaded angle wedge between q (0 deg) and A (-32 deg visual for clarity) -->
  <path d="M 236 226 L 322 226 A 86 86 0 0 0 309 180 Z" class="wedge" />

  <!-- Sample random hyperplane passing through center without splitting q and A -->
  <line x1="168" y1="172" x2="304" y2="280" class="hyperplane" />
  <text x="120" y="164" class="body">Hyperplane r^T z = 0</text>

  <!-- Vector q along 0 deg: (236,226) -> (322, 226) -->
  <line x1="236" y1="226" x2="322" y2="226" class="vec-q" />
  <circle cx="322" cy="226" r="4.5" fill="#1f4e78" />
  <text x="332" y="230" class="mono-blue">q (0 deg)</text>

  <!-- Vector A along -32 deg visual (labeled theta = 15 deg): (236,226) -> (309, 180) -->
  <line x1="236" y1="226" x2="309" y2="180" class="vec-a" />
  <circle cx="309" cy="180" r="4.5" fill="#2a6f57" />
  <text x="318" y="182" class="mono">A (theta = 15 deg)</text>

  <!-- Vector C at 120 deg: (236,226) -> (193, 152) -->
  <line x1="236" y1="226" x2="193" y2="152" class="vec-c" />
  <circle cx="193" cy="152" r="4.5" fill="#b8532a" />
  <text x="98" y="144" class="mono-warm">C (theta = 120 deg)</text>

  <!-- Origin dot -->
  <circle cx="236" cy="226" r="3.5" fill="#1d1b16" />
  <text x="276" y="212" class="mono-warm">theta</text>

  <!-- Formula box in Left Panel -->
  <rect x="44" y="330" width="384" height="68" class="note-box" />
  <text x="58" y="352" class="mono">P[h_r(q) = h_r(x)] = 1 - theta / pi</text>
  <text x="58" y="372" class="body">At theta = 15 deg:  p = 1 - 15/180 = 0.9167</text>
  <text x="58" y="390" class="body">At theta = 120 deg: p = 1 - 120/180 = 0.3333</text>

  <!-- Right Panel: S-Curve Amplification Plot -->
  <rect x="472" y="70" width="424" height="346" class="card" />
  <text x="492" y="96" class="subtitle">2. (K, L) Amplification Shapes the Discovery S-Curve</text>
  <text x="492" y="114" class="body">P_discover(theta) = 1 - (1 - (1 - theta/pi)^K)^L:</text>

  <!-- Plot axes: x in [0, 180 deg] -> [536, 860] (width 324, 1.8px/deg); y in [0, 1.0] -> [312, 142] (height 170) -->
  <line x1="536" y1="142" x2="860" y2="142" class="grid" />
  <line x1="536" y1="227" x2="860" y2="227" class="grid" />
  <line x1="536" y1="312" x2="860" y2="312" class="axis" />
  <line x1="536" y1="142" x2="536" y2="312" class="axis" />

  <!-- Y-axis labels -->
  <text x="498" y="146" class="mono">1.00</text>
  <text x="498" y="231" class="mono">0.50</text>
  <text x="498" y="316" class="mono">0.00</text>

  <!-- X-axis labels: 0 deg (536), 15 deg (563), 60 deg (644), 120 deg (752), 180 deg (860) -->
  <text x="530" y="330" class="body">0°</text>
  <text x="554" y="330" class="mono">15°</text>
  <text x="635" y="330" class="mono-blue">60°</text>
  <text x="738" y="330" class="mono-warm">120°</text>
  <text x="844" y="330" class="body">180°</text>

  <!-- Vertical reference lines at 15, 60, 120 deg -->
  <line x1="563" y1="142" x2="563" y2="312" class="grid" />
  <line x1="644" y1="142" x2="644" y2="312" class="grid" />
  <line x1="752" y1="142" x2="752" y2="312" class="grid" />

  <!-- Curve 1: K=1, L=1 (straight line from (536,142) to (860,312)) -->
  <line x1="536" y1="142" x2="860" y2="312" class="curve-11" />

  <!-- Curve 2: K=4, L=1 (p^4):
       0°: 1.00 -> (536, 142)
       15°: 0.706 -> (563, 192)
       30°: 0.482 -> (590, 230)
       60°: 0.198 -> (644, 278)
       90°: 0.062 -> (698, 301)
       120°: 0.012 -> (752, 310)
       180°: 0.00 -> (860, 312) -->
  <polyline points="536,142 563,192 590,230 617,258 644,278 698,301 752,310 860,312" class="curve-41" />

  <!-- Curve 3: K=4, L=5 (1 - (1 - p^4)^5):
       0°: 1.00 -> (536, 142)
       15°: 0.998 -> (563, 142.4)
       30°: 0.963 -> (590, 148)
       45°: 0.858 -> (617, 166)
       60°: 0.667 -> (644, 199)
       75°: 0.445 -> (671, 236)
       90°: 0.276 -> (698, 265)
       120°: 0.060 -> (752, 302)
       150°: 0.004 -> (806, 311)
       180°: 0.00 -> (860, 312) -->
  <polyline points="536,142 563,142 590,148 617,166 644,199 671,236 698,265 752,302 806,311 860,312" class="curve-45" />

  <!-- Highlight points on K=4, L=5 curve -->
  <circle cx="563" cy="142" r="4.5" fill="#2a6f57" />
  <text x="572" y="156" class="mono">0.9978 (K=4, L=5)</text>

  <circle cx="644" cy="199" r="4.5" fill="#2a6f57" />
  <text x="654" y="196" class="mono">0.6672</text>

  <circle cx="752" cy="302" r="4.5" fill="#b8532a" />
  <text x="758" y="294" class="mono-warm">0.0602</text>

  <!-- Legend / summary box in Right Panel -->
  <rect x="492" y="344" width="384" height="54" class="note-box" />
  <text x="506" y="364" class="mono">Green: K=4, L=5 (AND+OR)  |  Rust: K=4, L=1 (1 table)</text>
  <text x="506" y="384" class="body">Dashed gray: K=1, L=1 linear decay. Multi-probe flips smallest |r_j^T q| bits.</text>
</svg>

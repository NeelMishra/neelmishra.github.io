<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
  <title id="title">LSH: Random Hyperplanes, 3-Bit Sign Signatures, and Hash Bucket Lookups</title>
  <desc id="desc">Left panel shows 3 random hyperplanes h1, h2, h3 slicing 2D space into binary-coded wedges (111, 011, 000, etc.) with query q in 111 and near neighbor A just across h1 in 011. Right panel shows how sign projections form the 3-bit hash key and how probing bucket 111 plus 1-bit multi-probe bucket 011 retrieves A without scanning distant bucket 000.</desc>
  <defs>
    <marker id="lsh-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#1e6b52" />
    </marker>
    <marker id="lsh-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#c25928" />
    </marker>
  </defs>

  <rect width="960" height="470" rx="16" fill="#fffaf2" stroke="#dcd3c2" stroke-width="1.5" />

  <!-- Header -->
  <text x="32" y="38" font-family="sans-serif" font-size="20" font-weight="700" fill="#1e2d26">Locality-Sensitive Hashing (LSH): Hyperplane Cuts to Hash Buckets</text>
  <text x="32" y="62" font-family="sans-serif" font-size="13.5" fill="#52635a">Left: K random hyperplanes assign each region a K-bit sign code. Right: Nearby vectors collide in the same or adjacent hash buckets.</text>

  <!-- ==================== LEFT PANEL: HYPERPLANE WEDGES ==================== -->
  <rect x="28" y="80" width="440" height="366" rx="12" fill="#ffffff" stroke="#c8d6cc" stroke-width="1.5" />
  <text x="48" y="108" font-family="sans-serif" font-size="15" font-weight="700" fill="#184e3b">1. 3 Random Hyperplanes Slice Space into 3-Bit Regions</text>

  <!-- Circle / Space Canvas centered at (248, 250), radius 112 -->
  <rect x="48" y="124" width="400" height="252" rx="8" fill="#f8faf9" stroke="#b8c9be" stroke-width="1.4" />

  <!-- Highlighted Wedge [111] (top-right, y > 0, x > 0) -->
  <path d="M 248 250 L 360 250 A 112 112 0 0 0 248 138 Z" fill="#fde4cf" fill-opacity="0.7" />
  <!-- Highlighted Adjacent Wedge [011] (bottom-right above x+y=0, y < 0, x+y > 0) -->
  <path d="M 248 250 L 327 329 A 112 112 0 0 0 360 250 Z" fill="#d3ede0" fill-opacity="0.75" />

  <circle cx="248" cy="250" r="112" fill="none" stroke="#8fa398" stroke-width="1.8" />

  <!-- 3 Random Hyperplanes through origin (248, 250) -->
  <!-- h1: y = 0 (horizontal, normal r1 = (0, 1)) -->
  <line x1="118" y1="250" x2="378" y2="250" stroke="#b83b2a" stroke-width="2.5" />
  <text x="60" y="244" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#b83b2a">h1 (bit 1)</text>

  <!-- h2: x = 0 (vertical, normal r2 = (1, 0)) -->
  <line x1="248" y1="130" x2="248" y2="370" stroke="#2b5c8f" stroke-width="2.2" stroke-dasharray="6 4" />
  <text x="256" y="144" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#2b5c8f">h2 (bit 2)</text>

  <!-- h3: x + y = 0 (diagonal from top-left to bottom-right, normal r3 = (1, 1)) -->
  <line x1="160" y1="162" x2="336" y2="338" stroke="#1e6b52" stroke-width="2.2" stroke-dasharray="5 3" />
  <text x="114" y="156" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#1e6b52">h3 (bit 3)</text>

  <!-- Wedge Binary Code Labels -->
  <text x="292" y="194" font-family="monospace" font-size="12.5" font-weight="700" fill="#8c3d19">[111]</text>
  <text x="308" y="286" font-family="monospace" font-size="12" font-weight="700" fill="#184e3b">[011]</text>
  <text x="214" y="182" font-family="monospace" font-size="12" font-weight="700" fill="#5a6962" text-anchor="middle">[101]</text>
  <text x="176" y="232" font-family="monospace" font-size="12" font-weight="700" fill="#5a6962" text-anchor="middle">[100]</text>
  <text x="192" y="286" font-family="monospace" font-size="12" font-weight="700" fill="#5a6962" text-anchor="middle">[000]</text>
  <text x="282" y="328" font-family="monospace" font-size="12" font-weight="700" fill="#5a6962" text-anchor="middle">[010]</text>

  <!-- Vectors from origin (248, 250) -->
  <!-- Query q = (1.0, 0.05) just above h1 -> (340, 233) -->
  <line x1="248" y1="250" x2="340" y2="233" stroke="#d13b27" stroke-width="2.6" />
  <circle cx="340" cy="233" r="6.5" fill="#d13b27" stroke="#ffffff" stroke-width="1.5" />
  <text x="368" y="236" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#d13b27">q (1.0, 0.05)</text>

  <!-- True Neighbor A = (1.0, -0.05) just below h1 -> (340, 267) -->
  <line x1="248" y1="250" x2="340" y2="267" stroke="#1e6b52" stroke-width="2.6" />
  <circle cx="340" cy="267" r="6.5" fill="#1e6b52" stroke="#ffffff" stroke-width="1.5" />
  <text x="368" y="272" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#184e3b">A (1.0, -0.05)</text>

  <!-- Distant vector C in [0, 0, 0] -> (176, 314) -->
  <line x1="248" y1="250" x2="180" y2="318" stroke="#7c8b84" stroke-width="2" stroke-dasharray="3 3" />
  <circle cx="180" cy="318" r="6" fill="#7c8b84" />
  <text x="112" y="334" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#5a6962">C (distant)</text>

  <circle cx="248" cy="250" r="3.5" fill="#1e2d26" />

  <!-- Bottom takeaway in Left Panel -->
  <rect x="48" y="386" width="400" height="46" rx="8" fill="#f3f7f4" stroke="#c8d6cc" />
  <text x="62" y="404" font-family="sans-serif" font-size="12" font-weight="700" fill="#184e3b">Collision rule: P[bit(q) == bit(x)] = 1 - theta / pi</text>
  <text x="62" y="422" font-family="sans-serif" font-size="12" fill="#374840">Small angle theta -&gt; vectors stay on the same side of almost all cuts.</text>

  <!-- ==================== RIGHT PANEL: HASH BUCKET PIPELINE ==================== -->
  <rect x="492" y="80" width="440" height="366" rx="12" fill="#ffffff" stroke="#c8d6cc" stroke-width="1.5" />
  <text x="512" y="108" font-family="sans-serif" font-size="15" font-weight="700" fill="#184e3b">2. Sign-Bit Hash Key &amp; Multi-Probe Bucket Lookup</text>

  <!-- Step A: Bit Signature Boxes for Query q -->
  <rect x="512" y="124" width="400" height="72" rx="9" fill="#fdf6f0" stroke="#d9b296" stroke-width="1.5" />
  <text x="526" y="144" font-family="sans-serif" font-size="12" font-weight="700" fill="#8c3d19">Query q = (1.0, 0.05) Projections r_j^T q -&gt; 3-Bit Key [111]:</text>

  <rect x="526" y="154" width="116" height="32" rx="6" fill="#faece0" stroke="#b83b2a" stroke-width="1.8" />
  <text x="584" y="174" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#b83b2a" text-anchor="middle">Bit 1: +0.05 -&gt; 1</text>

  <rect x="654" y="154" width="116" height="32" rx="6" fill="#e6eef8" stroke="#2b5c8f" stroke-width="1.5" />
  <text x="712" y="174" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#1e4976" text-anchor="middle">Bit 2: +1.00 -&gt; 1</text>

  <rect x="782" y="154" width="116" height="32" rx="6" fill="#e5f2ec" stroke="#1e6b52" stroke-width="1.5" />
  <text x="840" y="174" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#184e3b" text-anchor="middle">Bit 3: +1.05 -&gt; 1</text>

  <!-- Hash Table Buckets -->
  <!-- Bucket [1, 1, 1] (Primary Bucket) -->
  <rect x="512" y="210" width="400" height="54" rx="9" fill="#fff6ee" stroke="#c25928" stroke-width="2" />
  <rect x="524" y="221" width="86" height="32" rx="6" fill="#c25928" />
  <text x="567" y="241" font-family="monospace" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Key [111]</text>
  <line x1="610" y1="237" x2="634" y2="237" stroke="#c25928" stroke-width="2" marker-end="url(#lsh-amber)" />
  <text x="642" y="234" font-family="sans-serif" font-size="12" font-weight="700" fill="#8c3d19">Primary Bucket of q (Probed 1st)</text>
  <text x="642" y="252" font-family="sans-serif" font-size="11.5" fill="#4a433b">Scans wedge [111]; misses A just across h1.</text>

  <!-- Bucket [0, 1, 1] (Multi-Probe Bucket) -->
  <rect x="512" y="274" width="400" height="54" rx="9" fill="#eef8f3" stroke="#1e6b52" stroke-width="2.2" />
  <rect x="524" y="285" width="86" height="32" rx="6" fill="#1e6b52" />
  <text x="567" y="305" font-family="monospace" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Key [011]</text>
  <line x1="610" y1="301" x2="634" y2="301" stroke="#1e6b52" stroke-width="2.2" marker-end="url(#lsh-green)" />
  <text x="642" y="298" font-family="sans-serif" font-size="12" font-weight="700" fill="#184e3b">Multi-Probe (Flip Weakest Bit #1) -&gt; Finds A!</text>
  <text x="642" y="316" font-family="sans-serif" font-size="11.5" fill="#374840">Bit 1 margin is 0.05; flipping 1-&gt;0 probes [011].</text>

  <!-- Bucket [0, 0, 0] (Skipped Distant Bucket) -->
  <rect x="512" y="338" width="400" height="38" rx="8" fill="#f4f2ef" stroke="#c8c2b8" stroke-width="1.4" />
  <rect x="524" y="344" width="96" height="26" rx="5" fill="#8c867e" />
  <text x="572" y="361" font-family="monospace" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Key [000]</text>
  <text x="636" y="361" font-family="sans-serif" font-size="11.5" fill="#6e685f">Contains C (120 deg away) — Never probed!</text>

  <!-- Bottom S-Curve Amplification Summary -->
  <rect x="512" y="386" width="400" height="46" rx="8" fill="#eef6f2" stroke="#1e6b52" stroke-width="1.4" />
  <text x="526" y="404" font-family="sans-serif" font-size="12" font-weight="700" fill="#184e3b">(K=4 bits, L=5 tables):  15 deg hits 99.8%  |  120 deg drops to 6.0%</text>
  <text x="526" y="422" font-family="sans-serif" font-size="12" fill="#374840">K bits per table cut false positives; L tables or multi-probe lift recall.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-labelledby="title desc">
<title id="title">Hierarchical k-means centroid shift and priority-queue recovery</title>
<desc id="desc">Outlier D at minus 1.4 pulls the left centroid mu_L to minus 0.8. Query q at 0.1 is closer to right centroid mu_R at 0.8, so single-branch descent visits B and C first. A priority queue with leaf budget 2 pops mu_L and recovers the true nearest neighbor A at minus 0.2.</desc>
<rect width="720" height="460" rx="14" fill="#fffaf2"/>
<g font-family="sans-serif" fill="#233a31">
<text x="30" y="36" font-size="19" font-weight="700">An outlier shifts the cluster centroid away from a boundary neighbor</text>
<text x="30" y="60" font-size="12.5" fill="#4a5d54">Query q = (0.1, 0): d^2(q, A) = 0.09, d^2(q, B) = 0.25, d^2(q, mu_R) = 0.49, d^2(q, mu_L) = 0.81</text>

<!-- Top panel: 1D axis geometry -->
<rect x="30" y="80" width="660" height="150" rx="10" fill="#edf3ed" stroke="#bfcec2"/>
<text x="48" y="106" font-size="13.5" font-weight="700">1D axis x1 (bisector at x1 = 0.0)</text>
<line x1="65" y1="165" x2="655" y2="165" stroke="#8fa396" stroke-width="2.5"/>
<line x1="380" y1="118" x2="380" y2="212" stroke="#b23c27" stroke-width="2" stroke-dasharray="5 4"/>
<text x="380" y="112" font-size="12" font-weight="700" fill="#b23c27" text-anchor="middle">split x1 = 0</text>

<!-- Points on axis: D(-1.4)->100, mu_L(-0.8)->220, A(-0.2)->340, q(0.1)->400, B(0.6)->500, mu_R(0.8)->540, C(1.0)->580 -->
<circle cx="100" cy="165" r="11" fill="#dceee3" stroke="#215d48" stroke-width="2"/>
<rect x="210" y="155" width="20" height="20" rx="4" fill="#f3e8d9" stroke="#b87d36" stroke-width="2"/>
<circle cx="340" cy="165" r="12" fill="#dceee3" stroke="#215d48" stroke-width="2.5"/>
<circle cx="405" cy="165" r="10" fill="#b23c27"/>
<circle cx="500" cy="165" r="11" fill="#dceee3" stroke="#215d48" stroke-width="2"/>
<rect x="550" y="155" width="20" height="20" rx="4" fill="#f3e8d9" stroke="#b87d36" stroke-width="2"/>
<circle cx="620" cy="165" r="11" fill="#dceee3" stroke="#215d48" stroke-width="2"/>

<g font-size="12.5" font-weight="700" text-anchor="middle">
<text x="100" y="142">D (-1.4)</text>
<text x="220" y="142" fill="#8c581c">mu_L (-0.8)</text>
<text x="332" y="142" fill="#215d48">A (-0.2)</text>
<text x="415" y="142" fill="#b23c27">q (0.1)</text>
<text x="500" y="142">B (0.6)</text>
<text x="560" y="198" fill="#8c581c">mu_R (0.8)</text>
<text x="625" y="142">C (1.0)</text>
</g>
<g font-size="12" fill="#4a5d54" text-anchor="middle">
<text x="220" y="202">d^2(q, mu_L) = 0.81</text>
<text x="332" y="218" fill="#215d48" font-weight="700">true 1-NN: 0.09</text>
<text x="500" y="218">d^2(q, B) = 0.25</text>
</g>

<!-- Bottom left: HKM tree -->
<rect x="30" y="248" width="380" height="186" rx="10" fill="#edf3ed" stroke="#bfcec2"/>
<text x="48" y="274" font-size="14" font-weight="700">Hierarchical k-means routing tree</text>
<g stroke="#215d48" stroke-width="2.5" fill="none">
<path d="M220 302L130 356" stroke="#b87d36" stroke-dasharray="5 4"/>
<path d="M220 302L310 356"/>
</g>
<circle cx="220" cy="302" r="16" fill="#dceee3" stroke="#215d48" stroke-width="2"/>
<rect x="82" y="346" width="96" height="36" rx="8" fill="#f6e4ce" stroke="#b87d36" stroke-width="2"/>
<rect x="262" y="346" width="96" height="36" rx="8" fill="#dceee3" stroke="#215d48" stroke-width="2"/>
<g font-size="12.5" font-weight="700" text-anchor="middle">
<text x="220" y="307">Root</text>
<text x="130" y="369">mu_L: {A, D}</text>
<text x="310" y="369">mu_R: {B, C}</text>
</g>
<text x="130" y="405" font-size="12" text-anchor="middle" fill="#8c581c">2nd pop (cost 0.81)</text>
<text x="310" y="405" font-size="12" text-anchor="middle" fill="#215d48">1st pop (cost 0.49)</text>

<!-- Bottom right: Priority queue readout -->
<rect x="430" y="248" width="260" height="186" rx="10" fill="#f3e8d9" stroke="#cbab77"/>
<text x="448" y="276" font-size="14" font-weight="700">Branch-and-bound budget</text>
<text x="448" y="306" font-size="13">1. Push mu_R (0.49), mu_L (0.81)</text>
<text x="448" y="334" font-size="13">2. L_max = 1 visits {B, C}</text>
<text x="448" y="358" font-size="13" fill="#b23c27">   Returns B (0.25) - misses A</text>
<text x="448" y="388" font-size="13">3. L_max = 2 pops mu_L {A, D}</text>
<text x="448" y="412" font-size="13" font-weight="700" fill="#215d48">   Recovers A (0.09)</text>
</g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
  <title id="title">Hierarchical K-Means: Nested 2D Clusters and Priority-Queue Tree Search</title>
  <desc id="desc">Left panel shows 2D clusters where distant outlier D pulls coarse centroid mu_L leftward so query q is closer to right centroid mu_R even though true neighbor A sits in the left cluster. Right panel shows the Hierarchical K-Means tree where branch-and-bound priority queue pops mu_L second to recover A.</desc>
  <defs>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#1e6b52" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#c25928" />
    </marker>
  </defs>

  <rect width="960" height="470" rx="16" fill="#fffaf2" stroke="#dcd3c2" stroke-width="1.5" />

  <!-- Header -->
  <text x="32" y="38" font-family="sans-serif" font-size="20" font-weight="700" fill="#1e2d26">Hierarchical K-Means: Nested Clusters &amp; Priority-Queue Backtracking</text>
  <text x="32" y="62" font-family="sans-serif" font-size="13.5" fill="#52635a">Left: Recursive k-means divides space into coarse clusters and sub-clusters. Right: A branch queue fixes boundary misses.</text>

  <!-- ==================== LEFT PANEL: 2D NESTED CLUSTERS ==================== -->
  <rect x="28" y="80" width="440" height="366" rx="12" fill="#ffffff" stroke="#c8d6cc" stroke-width="1.5" />
  <text x="48" y="108" font-family="sans-serif" font-size="15" font-weight="700" fill="#184e3b">1. 2D Vector Space: Why Greedy Routing Misses A</text>

  <!-- 2D Plot Canvas -->
  <rect x="48" y="122" width="400" height="252" rx="8" fill="#f8faf9" stroke="#b8c9be" stroke-width="1.4" />

  <!-- Left Coarse Cluster Oval (stretched by outlier D) -->
  <ellipse cx="168" cy="248" rx="108" ry="82" fill="#e5f2ec" fill-opacity="0.7" stroke="#2a7b5e" stroke-width="1.8" stroke-dasharray="6 4" />
  <text x="68" y="154" font-family="sans-serif" font-size="12" font-weight="700" fill="#184e3b">Coarse Cluster L</text>

  <!-- Right Coarse Cluster Oval -->
  <ellipse cx="358" cy="248" rx="74" ry="82" fill="#faece0" fill-opacity="0.7" stroke="#c25928" stroke-width="1.8" stroke-dasharray="6 4" />
  <text x="310" y="154" font-family="sans-serif" font-size="12" font-weight="700" fill="#8c3d19">Coarse Cluster R</text>

  <!-- Voronoi Bisector Line x1 = 0 between mu_L and mu_R -->
  <line x1="262" y1="122" x2="262" y2="374" stroke="#8a3b28" stroke-width="2.2" stroke-dasharray="5 4" />
  <text x="262" y="140" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#8a3b28" text-anchor="middle">Split Boundary</text>

  <!-- Sub-cluster circles inside Left and Right -->
  <circle cx="96" cy="264" r="22" fill="#d0e8dc" stroke="#2a7b5e" stroke-width="1.2" />
  <circle cx="236" cy="248" r="22" fill="#d0e8dc" stroke="#2a7b5e" stroke-width="1.2" />
  <circle cx="332" cy="222" r="22" fill="#f7dac2" stroke="#c25928" stroke-width="1.2" />
  <circle cx="388" cy="286" r="22" fill="#f7dac2" stroke="#c25928" stroke-width="1.2" />

  <!-- Outlier D pulling mu_L leftward -->
  <circle cx="96" cy="264" r="7" fill="#1e6b52" />
  <text x="96" y="232" font-family="sans-serif" font-size="12" font-weight="700" fill="#184e3b" text-anchor="middle">D (-1.4)</text>
  <text x="108" y="302" font-family="sans-serif" font-size="11" fill="#465950" text-anchor="middle">Outlier pulls mu_L</text>

  <!-- Left Coarse Centroid mu_L at (-0.8) -->
  <rect x="157" y="239" width="18" height="18" rx="3" fill="#1e6b52" stroke="#ffffff" stroke-width="2" />
  <text x="166" y="226" font-family="sans-serif" font-size="12" font-weight="700" fill="#184e3b" text-anchor="middle">mu_L (-0.8)</text>

  <!-- True Nearest Neighbor A at (-0.2) -->
  <circle cx="236" cy="248" r="8" fill="#1e6b52" stroke="#ffffff" stroke-width="2" />
  <text x="226" y="216" font-family="sans-serif" font-size="12" font-weight="700" fill="#184e3b" text-anchor="middle">A (-0.2)</text>

  <!-- Query q at (0.1) just to the right of boundary -->
  <circle cx="282" cy="248" r="8" fill="#d13b27" stroke="#ffffff" stroke-width="2" />
  <text x="288" y="282" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#d13b27">q (0.1)</text>

  <!-- Point B (0.6) and C (1.0) -->
  <circle cx="332" cy="222" r="7" fill="#c25928" />
  <text x="332" y="190" font-family="sans-serif" font-size="12" font-weight="700" fill="#8c3d19" text-anchor="middle">B (0.6)</text>

  <circle cx="388" cy="286" r="7" fill="#c25928" />
  <text x="388" y="324" font-family="sans-serif" font-size="12" font-weight="700" fill="#8c3d19" text-anchor="middle">C (1.0)</text>

  <!-- Right Coarse Centroid mu_R at (0.8) -->
  <rect x="351" y="239" width="18" height="18" rx="3" fill="#c25928" stroke="#ffffff" stroke-width="2" />
  <text x="358" y="272" font-family="sans-serif" font-size="12" font-weight="700" fill="#8c3d19" text-anchor="middle">mu_R (0.8)</text>

  <!-- Distance arrows from q -->
  <line x1="274" y1="248" x2="246" y2="248" stroke="#1e6b52" stroke-width="2.4" marker-end="url(#arr-teal)" />
  <path d="M 288 242 Q 320 226 349 242" fill="none" stroke="#c25928" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arr-amber)" />

  <!-- Bottom takeaway in Left Panel -->
  <rect x="48" y="384" width="400" height="48" rx="8" fill="#f3f7f4" stroke="#c8d6cc" />
  <text x="62" y="403" font-family="sans-serif" font-size="12" font-weight="700" fill="#8c3d19">Why 1-branch search fails: q is closer to mu_R (0.49) than mu_L (0.81)</text>
  <text x="62" y="421" font-family="sans-serif" font-size="12" fill="#374840">Outlier D drags mu_L leftward, hiding true nearest neighbor A (0.09).</text>

  <!-- ==================== RIGHT PANEL: MULTI-LEVEL TREE & QUEUE ==================== -->
  <rect x="492" y="80" width="440" height="366" rx="12" fill="#ffffff" stroke="#c8d6cc" stroke-width="1.5" />
  <text x="512" y="108" font-family="sans-serif" font-size="15" font-weight="700" fill="#184e3b">2. Hierarchical Tree Traversal (Priority Queue)</text>

  <!-- Tree Edges: Root to Level 1 -->
  <line x1="712" y1="158" x2="610" y2="222" stroke="#1e6b52" stroke-width="2.6" stroke-dasharray="6 4" marker-end="url(#arr-teal)" />
  <line x1="712" y1="158" x2="814" y2="222" stroke="#c25928" stroke-width="2.8" marker-end="url(#arr-amber)" />

  <!-- Tree Edges: Level 1 to Level 2 Leaves -->
  <line x1="610" y1="258" x2="556" y2="318" stroke="#9ab5a6" stroke-width="2" />
  <line x1="610" y1="258" x2="660" y2="318" stroke="#1e6b52" stroke-width="2.6" marker-end="url(#arr-teal)" />
  <line x1="814" y1="258" x2="764" y2="318" stroke="#c25928" stroke-width="2.6" marker-end="url(#arr-amber)" />
  <line x1="814" y1="258" x2="868" y2="318" stroke="#d9b296" stroke-width="2" />

  <!-- Root Node -->
  <rect x="652" y="126" width="120" height="32" rx="16" fill="#233a31" />
  <text x="712" y="147" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">Root (All Points)</text>

  <!-- Step labels on Root-to-L1 edges -->
  <text x="528" y="188" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#184e3b">2nd Pop (d^2 = 0.81)</text>
  <text x="780" y="188" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#c25928">1st Pop (d^2 = 0.49)</text>

  <!-- Level 1 Node: mu_L -->
  <rect x="546" y="224" width="128" height="36" rx="8" fill="#e5f2ec" stroke="#1e6b52" stroke-width="2" />
  <text x="610" y="247" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#184e3b" text-anchor="middle">Centroid mu_L</text>

  <!-- Level 1 Node: mu_R -->
  <rect x="750" y="224" width="128" height="36" rx="8" fill="#faece0" stroke="#c25928" stroke-width="2" />
  <text x="814" y="247" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#8c3d19" text-anchor="middle">Centroid mu_R</text>

  <!-- Level 2 Leaf Nodes -->
  <rect x="514" y="320" width="84" height="44" rx="7" fill="#f3f7f4" stroke="#9ab5a6" stroke-width="1.5" />
  <text x="556" y="339" font-family="sans-serif" font-size="12" font-weight="700" fill="#465950" text-anchor="middle">Leaf L1</text>
  <text x="556" y="356" font-family="sans-serif" font-size="11" fill="#52635a" text-anchor="middle">D (d^2=2.25)</text>

  <rect x="614" y="320" width="92" height="44" rx="7" fill="#d3ede0" stroke="#1e6b52" stroke-width="2.2" />
  <text x="660" y="339" font-family="sans-serif" font-size="12" font-weight="700" fill="#184e3b" text-anchor="middle">Leaf L2 (Hit!)</text>
  <text x="660" y="356" font-family="sans-serif" font-size="11" font-weight="700" fill="#184e3b" text-anchor="middle">A (d^2=0.09)</text>

  <rect x="722" y="320" width="84" height="44" rx="7" fill="#fde4cf" stroke="#c25928" stroke-width="2" />
  <text x="764" y="339" font-family="sans-serif" font-size="12" font-weight="700" fill="#8c3d19" text-anchor="middle">Leaf R1</text>
  <text x="764" y="356" font-family="sans-serif" font-size="11" fill="#8c3d19" text-anchor="middle">B (d^2=0.25)</text>

  <rect x="822" y="320" width="84" height="44" rx="7" fill="#fdf6f0" stroke="#d9b296" stroke-width="1.5" />
  <text x="864" y="339" font-family="sans-serif" font-size="12" font-weight="700" fill="#6e5a49" text-anchor="middle">Leaf R2</text>
  <text x="864" y="356" font-family="sans-serif" font-size="11" fill="#6e5a49" text-anchor="middle">C (d^2=0.81)</text>

  <!-- Priority Queue Visual Bar at bottom of Right Panel -->
  <rect x="512" y="384" width="400" height="48" rx="8" fill="#eef6f2" stroke="#1e6b52" stroke-width="1.4" />
  <text x="526" y="403" font-family="sans-serif" font-size="12" font-weight="700" fill="#184e3b">Min-Heap Queue Q = [ (0.49, mu_R), (0.81, mu_L) ]</text>
  <text x="526" y="421" font-family="sans-serif" font-size="12" fill="#374840">L_max = 1 returns B (0.25); L_max = 2 pops mu_L and recovers A!</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" role="img" aria-labelledby="title desc">
  <title id="title">Ball Tree Hypersphere Partitioning and Triangle-Inequality Pruning</title>
  <desc id="desc">Left panel shows two-pivot hypersphere partitioning around a curved manifold; right panel shows triangle-inequality pruning where d(q, c_B) minus r_B exceeds the current best distance R.</desc>
  <defs>
    <style>
      .bg { fill: #fbfaf6; stroke: #d8d1c2; stroke-width: 1.5; }
      .card { fill: #ffffff; stroke: #d8d1c2; stroke-width: 1.5; rx: 12; }
      .title { font: 700 18px "EB Garamond", Georgia, serif; fill: #1d1b16; }
      .subtitle { font: 600 14px "EB Garamond", Georgia, serif; fill: #2f2a22; }
      .body { font: 400 12.5px "EB Garamond", Georgia, serif; fill: #4a4338; }
      .mono { font: 600 11.5px "JetBrains Mono", "SFMono-Regular", monospace; fill: #2a4b3c; }
      .mono-warm { font: 600 11.5px "JetBrains Mono", "SFMono-Regular", monospace; fill: #8c3d1e; }
      .mono-blue { font: 600 11.5px "JetBrains Mono", "SFMono-Regular", monospace; fill: #1f4e78; }
      .ball-root { fill: none; stroke: #9a9181; stroke-width: 1.6; stroke-dasharray: 6 4; }
      .ball-a { fill: #e9f3ee; fill-opacity: 0.65; stroke: #2a6f57; stroke-width: 2; }
      .ball-b { fill: #faeee8; fill-opacity: 0.65; stroke: #b8532a; stroke-width: 2; }
      .search-ball { fill: #e8f0f8; fill-opacity: 0.55; stroke: #1f4e78; stroke-width: 2; stroke-dasharray: 5 3; }
      .pt-a { fill: #2a6f57; }
      .pt-b { fill: #b8532a; }
      .pt-q { fill: #1f4e78; }
      .guide { stroke: #4a4338; stroke-width: 1.4; stroke-dasharray: 4 3; }
      .gap-line { stroke: #b8532a; stroke-width: 2.4; }
      .badge-ok { fill: #e9f3ee; stroke: #2a6f57; stroke-width: 1.2; rx: 6; }
      .badge-prune { fill: #faeee8; stroke: #b8532a; stroke-width: 1.2; rx: 6; }
    </style>
  </defs>

  <rect x="4" y="4" width="912" height="432" rx="14" class="bg" />
  <text x="28" y="34" class="title">Ball Tree: Two-Pivot Metric Balls and Triangle-Inequality Pruning</text>
  <text x="28" y="54" class="body">Nodes wrap point subsets in closed balls B(c, r) that adapt to intrinsic curvature rather than all coordinate axes.</text>

  <!-- Left panel: Two-Pivot Split -->
  <rect x="24" y="70" width="424" height="346" class="card" />
  <text x="44" y="96" class="subtitle">1. Two-Pivot Child Ball Construction</text>
  <text x="44" y="114" class="body">Farthest-point pivots (p1, p2) partition S into two metric balls:</text>

  <!-- Root enclosing ball -->
  <circle cx="236" cy="235" r="108" class="ball-root" />
  <text x="156" y="138" class="body">Root ball B(c_0, r_0)</text>

  <!-- Left child ball B_L -->
  <circle cx="176" cy="216" r="58" class="ball-a" />
  <circle cx="176" cy="216" r="4" class="pt-a" />
  <text x="142" y="176" class="mono">B(c_L, r_L)</text>

  <!-- Points in B_L -->
  <circle cx="140" cy="218" r="4.5" class="pt-a" />
  <text x="130" y="234" class="mono">p1</text>
  <circle cx="158" cy="202" r="3.5" class="pt-a" />
  <circle cx="192" cy="232" r="3.5" class="pt-a" />
  <circle cx="204" cy="204" r="3.5" class="pt-a" />
  <circle cx="168" cy="242" r="3.5" class="pt-a" />

  <!-- Right child ball B_R -->
  <circle cx="292" cy="256" r="56" class="ball-b" />
  <circle cx="292" cy="256" r="4" class="pt-b" />
  <text x="256" y="218" class="mono-warm">B(c_R, r_R)</text>

  <!-- Points in B_R -->
  <circle cx="328" cy="264" r="4.5" class="pt-b" />
  <text x="318" y="282" class="mono-warm">p2</text>
  <circle cx="268" cy="248" r="3.5" class="pt-b" />
  <circle cx="282" cy="276" r="3.5" class="pt-b" />
  <circle cx="308" cy="238" r="3.5" class="pt-b" />
  <circle cx="298" cy="286" r="3.5" class="pt-b" />

  <!-- Bottom note in left panel -->
  <rect x="44" y="354" width="384" height="46" class="badge-ok" />
  <text x="58" y="373" class="mono">p1 = argmax d(x, x0),   p2 = argmax d(x, p1)</text>
  <text x="58" y="391" class="body">Each point joins the closer pivot; child radii fit only the assigned points.</text>

  <!-- Right panel: Triangle Inequality Pruning -->
  <rect x="472" y="70" width="424" height="346" class="card" />
  <text x="492" y="96" class="subtitle">2. Triangle-Inequality Lower Bound &amp; Pruning</text>
  <text x="492" y="114" class="body">Any point x in B(c, r) satisfies d(q, x) &gt;= max(0, d(q, c) - r):</text>

  <!-- Visited Ball A overlapping query ball -->
  <circle cx="566" cy="212" r="50" class="ball-a" />
  <circle cx="566" cy="212" r="4" class="pt-a" />
  <text x="536" y="178" class="mono">c_A (visited)</text>
  <circle cx="588" cy="226" r="4.5" class="pt-a" />
  <text x="556" y="244" class="mono">best x*</text>

  <!-- Query ball around q of radius R -->
  <circle cx="622" cy="238" r="44" class="search-ball" />
  <circle cx="622" cy="238" r="5" class="pt-q" />
  <text x="614" y="258" class="mono-blue">q</text>
  <text x="582" y="298" class="mono-blue">Query ball R = d(q, x*)</text>

  <!-- Pruned Ball B -->
  <circle cx="792" cy="210" r="54" class="ball-b" />
  <circle cx="792" cy="210" r="4.5" class="pt-b" />
  <text x="802" y="214" class="mono-warm">c_B</text>
  <text x="760" y="250" class="mono-warm">r_B = 0.54</text>

  <!-- Line from q to c_B -->
  <line x1="622" y1="238" x2="792" y2="210" class="guide" />
  <!-- Highlighted lower-bound gap from q to boundary of Ball B -->
  <line x1="665" y1="231" x2="739" y2="219" class="gap-line" />
  <text x="632" y="182" class="mono-warm">d(q, c_B) - r_B &gt; R</text>

  <!-- Bottom formula card in right panel -->
  <rect x="492" y="324" width="384" height="76" class="badge-prune" />
  <text x="506" y="346" class="mono-warm">Lower bound: d_min(q, B_B) = d(q, c_B) - r_B</text>
  <text x="506" y="366" class="body">Because d(q, c_B) - r_B &gt; R, no point inside B(c_B, r_B) can</text>
  <text x="506" y="384" class="body">beat the current top-k radius R. Entire subtree B_B is pruned.</text>
</svg>

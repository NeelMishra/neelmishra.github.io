<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
  <title id="title">Three Visual Paradigms of Approximate Nearest Neighbor Search</title>
  <desc id="desc">Visual comparison of the three core ANN families: Space-Partitioning Trees (Hierarchical K-Means, KD-Trees, Annoy), Flat Partitions and Hash Buckets (IVF, LSH), and Navigable Proximity Graphs (HNSW).</desc>
  <defs>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#1e6b52" />
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#c25928" />
    </marker>
  </defs>

  <!-- Outer background -->
  <rect width="960" height="470" rx="16" fill="#fffaf2" stroke="#dcd3c2" stroke-width="1.5" />

  <!-- Header -->
  <text x="32" y="38" font-family="sans-serif" font-size="20" font-weight="700" fill="#1e2d26">How ANN Indexes Avoid Scanning the Entire Corpus</text>
  <text x="32" y="62" font-family="sans-serif" font-size="13.5" fill="#52635a">Every ANN index narrows millions of vectors down to a small candidate shortlist using one of three geometric structures:</text>

  <!-- ==================== CARD 1: SPACE-PARTITIONING TREES ==================== -->
  <rect x="28" y="82" width="290" height="364" rx="12" fill="#ffffff" stroke="#c8d6cc" stroke-width="1.5" />
  <rect x="28" y="82" width="290" height="38" rx="12" fill="#e6f2ec" />
  <text x="173" y="106" font-family="sans-serif" font-size="15" font-weight="700" fill="#184e3b" text-anchor="middle">1. Space-Partitioning Trees</text>

  <!-- Visual mini-diagram: 2D Recursive Cuts + Tree -->
  <rect x="48" y="134" width="112" height="112" rx="6" fill="#f7faf8" stroke="#9ab5a6" stroke-width="1.5" />
  <!-- Highlighted target quadrant -->
  <rect x="104" y="134" width="56" height="56" fill="#d3ede0" />
  <!-- Split 1 (vertical) -->
  <line x1="104" y1="134" x2="104" y2="246" stroke="#1e6b52" stroke-width="2.2" />
  <!-- Split 2 (horizontal left & right) -->
  <line x1="48" y1="198" x2="104" y2="198" stroke="#5b8fd4" stroke-width="1.8" stroke-dasharray="4 3" />
  <line x1="104" y1="190" x2="160" y2="190" stroke="#5b8fd4" stroke-width="1.8" stroke-dasharray="4 3" />
  <!-- Data points & Query q -->
  <circle cx="72" cy="162" r="3.5" fill="#7c8f85" />
  <circle cx="80" cy="222" r="3.5" fill="#7c8f85" />
  <circle cx="132" cy="218" r="3.5" fill="#7c8f85" />
  <circle cx="122" cy="156" r="4.5" fill="#1e6b52" />
  <circle cx="140" cy="168" r="5" fill="#d13b27" />
  <text x="148" y="164" font-family="sans-serif" font-size="11" font-weight="700" fill="#d13b27">q</text>

  <!-- Mini binary tree on the right side of Card 1 -->
  <line x1="236" y1="148" x2="204" y2="188" stroke="#b0beb6" stroke-width="2" />
  <line x1="236" y1="148" x2="268" y2="188" stroke="#1e6b52" stroke-width="2.5" />
  <line x1="268" y1="188" x2="248" y2="232" stroke="#1e6b52" stroke-width="2.5" />
  <line x1="268" y1="188" x2="288" y2="232" stroke="#b0beb6" stroke-width="2" />

  <circle cx="236" cy="148" r="11" fill="#1e6b52" />
  <text x="236" y="152" font-family="sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">L0</text>
  <circle cx="204" cy="188" r="10" fill="#e3ebe6" stroke="#9ab5a6" stroke-width="1.5" />
  <circle cx="268" cy="188" r="10" fill="#5b8fd4" />
  <text x="268" y="192" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">L1</text>
  <rect x="233" y="224" width="30" height="18" rx="4" fill="#d3ede0" stroke="#1e6b52" stroke-width="1.8" />
  <text x="248" y="237" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#184e3b" text-anchor="middle">Leaf</text>
  <rect x="275" y="224" width="26" height="18" rx="4" fill="#f0f4f1" stroke="#b0beb6" stroke-width="1.2" />

  <text x="48" y="272" font-family="sans-serif" font-size="12.5" fill="#374840">Recursively split space into nested</text>
  <text x="48" y="290" font-family="sans-serif" font-size="12.5" fill="#374840">regions; route down in O(log N) steps.</text>

  <!-- Method pills -->
  <rect x="48" y="308" width="250" height="34" rx="7" fill="#f3f8f5" stroke="#b7d1c3" />
  <text x="60" y="329" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#184e3b">Hierarchical K-Means</text>
  <text x="206" y="329" font-family="sans-serif" font-size="11.5" fill="#52635a">(k-way centroids)</text>

  <rect x="48" y="350" width="250" height="34" rx="7" fill="#f3f8f5" stroke="#b7d1c3" />
  <text x="60" y="371" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#184e3b">KD-Trees</text>
  <text x="132" y="371" font-family="sans-serif" font-size="11.5" fill="#52635a">(axis-aligned cuts)</text>

  <rect x="48" y="392" width="250" height="34" rx="7" fill="#f3f8f5" stroke="#b7d1c3" />
  <text x="60" y="413" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#184e3b">Annoy</text>
  <text x="114" y="413" font-family="sans-serif" font-size="11.5" fill="#52635a">(forest of random splits)</text>

  <!-- ==================== CARD 2: BUCKETS & PARTITIONS ==================== -->
  <rect x="335" y="82" width="290" height="364" rx="12" fill="#ffffff" stroke="#e2ccb5" stroke-width="1.5" />
  <rect x="335" y="82" width="290" height="38" rx="12" fill="#faece0" />
  <text x="480" y="106" font-family="sans-serif" font-size="15" font-weight="700" fill="#8c3d19" text-anchor="middle">2. Flat Partitions &amp; Buckets</text>

  <!-- Visual mini-diagram: Voronoi cells -> Posting lists -->
  <rect x="355" y="134" width="112" height="112" rx="6" fill="#fdfaf6" stroke="#cba989" stroke-width="1.5" />
  <!-- Highlighted Voronoi cell -->
  <polygon points="355,134 422,134 405,194 355,204" fill="#fde4cf" />
  <!-- Voronoi cell borders -->
  <polyline points="422,134 405,194 355,204" fill="none" stroke="#c25928" stroke-width="2" />
  <line x1="405" y1="194" x2="467" y2="222" stroke="#c25928" stroke-width="2" />
  <!-- Centroid stars/dots -->
  <rect x="378" y="158" width="8" height="8" fill="#c25928" />
  <rect x="434" y="166" width="8" height="8" fill="#8f7a68" />
  <rect x="396" y="220" width="8" height="8" fill="#8f7a68" />
  <!-- Query q -->
  <circle cx="394" cy="176" r="5" fill="#d13b27" />
  <text x="364" y="186" font-family="sans-serif" font-size="11" font-weight="700" fill="#d13b27">q</text>

  <!-- Arrow from cell to posting list -->
  <line x1="472" y1="162" x2="496" y2="162" stroke="#c25928" stroke-width="2" marker-end="url(#arr-orange)" />

  <!-- Inverted lists stack on right of Card 2 -->
  <rect x="504" y="142" width="102" height="28" rx="5" fill="#fde4cf" stroke="#c25928" stroke-width="1.8" />
  <text x="512" y="160" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#8c3d19">Cell 1: [v2, v9]</text>

  <rect x="504" y="178" width="102" height="28" rx="5" fill="#fff5ec" stroke="#c25928" stroke-width="1.4" stroke-dasharray="4 2" />
  <text x="512" y="196" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#a8552a">Cell 2: [v1, v5]</text>

  <rect x="504" y="214" width="102" height="28" rx="5" fill="#f4f1ed" stroke="#ccc4b8" stroke-width="1.2" />
  <text x="512" y="232" font-family="sans-serif" font-size="10.5" fill="#857d73">Cell 3: skipped</text>

  <text x="355" y="272" font-family="sans-serif" font-size="12.5" fill="#374840">Map vectors directly into Voronoi cells</text>
  <text x="355" y="290" font-family="sans-serif" font-size="12.5" fill="#374840">or hash buckets; probe top buckets.</text>

  <!-- Method pills -->
  <rect x="355" y="316" width="250" height="46" rx="7" fill="#fdf6f0" stroke="#e2bfa0" />
  <text x="367" y="336" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#8c3d19">IVF (Inverted File Index)</text>
  <text x="367" y="353" font-family="sans-serif" font-size="11.5" fill="#52635a">Learned k-means Voronoi cells + nprobe</text>

  <rect x="355" y="374" width="250" height="46" rx="7" fill="#fdf6f0" stroke="#e2bfa0" />
  <text x="367" y="394" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#8c3d19">LSH (Locality-Sensitive Hashing)</text>
  <text x="367" y="411" font-family="sans-serif" font-size="11.5" fill="#52635a">Random hyperplane sign-bit hash buckets</text>

  <!-- ==================== CARD 3: PROXIMITY GRAPHS ==================== -->
  <rect x="642" y="82" width="290" height="364" rx="12" fill="#ffffff" stroke="#bfcbe0" stroke-width="1.5" />
  <rect x="642" y="82" width="290" height="38" rx="12" fill="#e6eef8" />
  <text x="787" y="106" font-family="sans-serif" font-size="15" font-weight="700" fill="#1e4976" text-anchor="middle">3. Navigable Proximity Graphs</text>

  <!-- Visual mini-diagram: 2-Layer HNSW Graph -->
  <!-- Top plane (Layer 1) -->
  <rect x="662" y="134" width="250" height="44" rx="6" fill="#f3f7fc" stroke="#a6bddb" stroke-width="1.4" />
  <text x="672" y="158" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#1e4976">Top Layer (long jumps)</text>
  <line x1="812" y1="156" x2="876" y2="156" stroke="#1e6b52" stroke-width="2.5" marker-end="url(#arr-green)" />
  <circle cx="812" cy="156" r="6.5" fill="#1e4976" />
  <circle cx="882" cy="156" r="6.5" fill="#1e6b52" />

  <!-- Vertical drop arrow between layers -->
  <line x1="882" y1="164" x2="882" y2="196" stroke="#c25928" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arr-orange)" />

  <!-- Bottom plane (Layer 0) -->
  <rect x="662" y="192" width="250" height="58" rx="6" fill="#f3f7fc" stroke="#a6bddb" stroke-width="1.4" />
  <text x="672" y="210" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#1e4976">Base Layer 0 (fine mesh)</text>
  <!-- Background mesh edges -->
  <line x1="744" y1="230" x2="796" y2="222" stroke="#b9c8dc" stroke-width="1.5" />
  <line x1="796" y1="222" x2="882" y2="216" stroke="#b9c8dc" stroke-width="1.5" />
  <line x1="882" y1="216" x2="836" y2="236" stroke="#1e6b52" stroke-width="2.4" marker-end="url(#arr-green)" />
  <line x1="836" y1="236" x2="796" y2="236" stroke="#1e6b52" stroke-width="2.4" marker-end="url(#arr-green)" />

  <circle cx="744" cy="230" r="5.5" fill="#90a4be" />
  <circle cx="796" cy="222" r="5.5" fill="#90a4be" />
  <circle cx="882" cy="216" r="6.5" fill="#1e6b52" />
  <circle cx="836" cy="236" r="6.5" fill="#1e6b52" />
  <circle cx="790" cy="236" r="6.5" fill="#d13b27" />
  <text x="772" y="241" font-family="sans-serif" font-size="11" font-weight="700" fill="#d13b27">q</text>

  <text x="662" y="272" font-family="sans-serif" font-size="12.5" fill="#374840">Connect vectors by proximity edges;</text>
  <text x="662" y="290" font-family="sans-serif" font-size="12.5" fill="#374840">zoom in from coarse to dense layers.</text>

  <!-- Method pill -->
  <rect x="662" y="316" width="250" height="104" rx="7" fill="#f2f6fc" stroke="#b0c5e3" />
  <text x="676" y="340" font-family="sans-serif" font-size="13" font-weight="700" fill="#1e4976">HNSW (Hierarchical NSW)</text>
  <text x="676" y="362" font-family="sans-serif" font-size="12" fill="#374840">1. Express skip-list layers at top</text>
  <text x="676" y="382" font-family="sans-serif" font-size="12" fill="#374840">2. Two-heap beam search (efSearch)</text>
  <text x="676" y="402" font-family="sans-serif" font-size="12" fill="#374840">3. Diversity-pruned bridges (M)</text>
</svg>

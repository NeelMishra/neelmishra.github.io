<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="title desc">
<title id="title">Four geometric families for approximate nearest-neighbor candidate discovery</title>
<desc id="desc">Four panels compare proximity graphs like HNSW, hierarchical k-means trees, space and metric partitioning trees like KD-trees, Ball trees, and Annoy, and flat partitions or hash buckets like IVF and LSH.</desc>
<rect width="720" height="440" rx="14" fill="#fffaf2"/>
<g font-family="sans-serif" fill="#233a31">
<text x="30" y="36" font-size="19" font-weight="700">How ANN families narrow the candidate set before exact scoring</text>
<text x="30" y="60" font-size="13.5" fill="#4a5d54">Every index trades build structure against how it avoids comparing all N vectors at query time.</text>

<!-- Panel 1: Proximity Graphs -->
<rect x="30" y="82" width="315" height="158" rx="10" fill="#edf3ed" stroke="#bfcec2"/>
<text x="48" y="108" font-size="15" font-weight="700">1. Proximity Graphs (HNSW)</text>
<text x="48" y="128" font-size="12.5" fill="#4a5d54">Follow multi-layer edges toward query q</text>
<g stroke="#a4b5a9" stroke-width="2.5" fill="none">
<path d="M75 195L145 162L225 198L285 168"/>
<path d="M75 195L155 214L225 198"/>
</g>
<path d="M75 195L145 162L285 168" stroke="#215d48" stroke-width="2.5" stroke-dasharray="5 4" fill="none"/>
<g fill="#dceee3" stroke="#215d48" stroke-width="2">
<circle cx="75" cy="195" r="13"/><circle cx="145" cy="162" r="13"/>
<circle cx="155" cy="214" r="13"/><circle cx="225" cy="198" r="13"/>
<circle cx="285" cy="168" r="13" fill="#f6e4ce" stroke="#b87d36"/>
</g>
<g font-size="11.5" font-weight="700" text-anchor="middle">
<text x="75" y="199">ep</text><text x="145" y="166">u</text>
<text x="155" y="218">v</text><text x="225" y="202">w</text>
<text x="285" y="172">q*</text>
</g>

<!-- Panel 2: Hierarchical K-Means -->
<rect x="375" y="82" width="315" height="158" rx="10" fill="#edf3ed" stroke="#bfcec2"/>
<text x="393" y="108" font-size="15" font-weight="700">2. Hierarchical K-Means (HKM)</text>
<text x="393" y="128" font-size="12.5" fill="#4a5d54">Branch-and-bound over nested centroids</text>
<g stroke="#a4b5a9" stroke-width="2.5" fill="none">
<path d="M532 150L455 184M532 150L610 184"/>
<path d="M455 184L420 218M455 184L490 218"/>
<path d="M610 184L575 218M610 184L645 218"/>
</g>
<g fill="#dceee3" stroke="#215d48" stroke-width="2">
<circle cx="532" cy="150" r="11"/>
<circle cx="455" cy="184" r="11"/><circle cx="610" cy="184" r="11" fill="#f6e4ce" stroke="#b87d36"/>
<circle cx="420" cy="218" r="9"/><circle cx="490" cy="218" r="9"/>
<circle cx="575" cy="218" r="9" fill="#f6e4ce" stroke="#b87d36"/><circle cx="645" cy="218" r="9"/>
</g>
<text x="415" y="168" font-size="11.5" fill="#215d48">queue backup</text>
<text x="626" y="176" font-size="11.5" fill="#8c581c">best branch</text>

<!-- Panel 3: Space & Metric Trees -->
<rect x="30" y="258" width="315" height="158" rx="10" fill="#f3e8d9" stroke="#cbab77"/>
<text x="48" y="284" font-size="15" font-weight="700">3. KD-Tree, Ball Tree &amp; Annoy</text>
<text x="48" y="304" font-size="12.5" fill="#4a5d54">Axis planes, metric balls, or oblique splits</text>
<rect x="52" y="318" width="118" height="80" rx="6" fill="#fffaf2" stroke="#b87d36" stroke-width="1.5"/>
<path d="M112 318V398M52 356H112M112 372H170" stroke="#215d48" stroke-width="2"/>
<text x="111" y="412" font-size="11" text-anchor="middle">KD / Annoy splits</text>
<circle cx="222" cy="358" r="32" fill="#fffaf2" stroke="#215d48" stroke-width="2"/>
<circle cx="286" cy="358" r="26" fill="#fffaf2" stroke="#b87d36" stroke-width="2" stroke-dasharray="4 3"/>
<circle cx="215" cy="352" r="4" fill="#215d48"/><circle cx="232" cy="368" r="4" fill="#215d48"/>
<circle cx="282" cy="355" r="4" fill="#b87d36"/><circle cx="295" cy="364" r="4" fill="#b87d36"/>
<text x="254" y="412" font-size="11" text-anchor="middle">Metric balls B(c, r)</text>

<!-- Panel 4: Flat Partitions & LSH -->
<rect x="375" y="258" width="315" height="158" rx="10" fill="#f3e8d9" stroke="#cbab77"/>
<text x="393" y="284" font-size="15" font-weight="700">4. IVF &amp; Locality-Sensitive Hashing</text>
<text x="393" y="304" font-size="12.5" fill="#4a5d54">Voronoi posting lists or K-bit hash buckets</text>
<rect x="395" y="318" width="275" height="80" rx="6" fill="#fffaf2" stroke="#b87d36" stroke-width="1.5"/>
<path d="M482 318L462 398M575 318L595 398" stroke="#215d48" stroke-width="2"/>
<circle cx="435" cy="358" r="6" fill="#215d48"/>
<circle cx="528" cy="352" r="6" fill="#b87d36"/>
<circle cx="628" cy="360" r="6" fill="#215d48"/>
<text x="435" y="384" font-size="11" text-anchor="middle">Cell / Bucket 0</text>
<text x="528" y="384" font-size="11" font-weight="700" text-anchor="middle">Probed Cell 1</text>
<text x="628" y="384" font-size="11" text-anchor="middle">Cell / Bucket 2</text>
</g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
<title id="title">Nested graph layers choose an entry for the wider base search</title>
<desc id="desc">A appears on layers zero, one, and two. B appears on zero and one. C and D appear only on zero. Search begins at A, improves to B on layer one, then enters the base graph containing all vectors.</desc>
<rect width="720" height="520" rx="14" fill="#fffaf2"/>
<g font-family="sans-serif" fill="#233a31">
<text x="30" y="35" font-size="20" font-weight="700">Same vectors, nested layers</text>
<text x="30" y="62" font-size="14">Hand-chosen levels illustrate the structure, not a native index build.</text>
<g fill="#edf3ed" stroke="#bfcec2">
<rect x="30" y="85" width="660" height="105" rx="10"/>
<rect x="30" y="217" width="660" height="105" rx="10"/>
<rect x="30" y="350" width="660" height="135" rx="10"/>
</g>
<g font-size="16" font-weight="700">
<text x="49" y="113">Layer 2</text><text x="49" y="245">Layer 1</text><text x="49" y="378">Layer 0</text>
</g>
<g stroke="#a4b5a9" stroke-width="3" fill="none">
<path d="M290 267H480M270 410L410 385M270 410L410 450M410 450H570"/>
<path d="M290 169V236M480 299V350" stroke="#a76826" stroke-dasharray="5 5"/>
</g>
<g fill="#dceee3" stroke="#215d48" stroke-width="2">
<circle cx="290" cy="137" r="28"/>
<circle cx="290" cy="267" r="28"/><circle cx="480" cy="267" r="28"/>
<circle cx="270" cy="410" r="24"/><circle cx="410" cy="385" r="24"/>
<circle cx="410" cy="450" r="24"/><circle cx="570" cy="450" r="24"/>
</g>
<g font-size="20" font-weight="700" text-anchor="middle">
<text x="290" y="144">A</text><text x="290" y="274">A</text><text x="480" y="274">B</text>
<text x="270" y="417">A</text><text x="410" y="392">B</text><text x="410" y="457">C</text><text x="570" y="457">D</text>
</g>
<g font-size="14">
<text x="347" y="143">start at the highest entry</text>
<text x="337" y="303">greedy improvement: 64 to 49</text>
<text x="48" y="442">All vectors remain here.</text>
<text x="48" y="465">Wider exploration follows.</text>
</g>
</g>
</svg>

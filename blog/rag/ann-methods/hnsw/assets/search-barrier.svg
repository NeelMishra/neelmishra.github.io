<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" role="img" aria-labelledby="title desc">
<title id="title">A connected graph can hide its nearest node behind a worse candidate</title>
<desc id="desc">Query is zero, zero. A is the entry with squared distance 64. Its neighbors are B, distance 49, and C, distance 81. C connects to D, distance 0.25. Keeping only the closest route misses D.</desc>
<rect width="720" height="390" rx="14" fill="#fffaf2"/>
<g font-family="sans-serif" fill="#233a31">
<text x="34" y="36" font-size="20" font-weight="700">A worse candidate can lead to a much better neighbor</text>
<text x="34" y="64" font-size="14">Schematic layout. Numbers are squared distances to q = (0, 0).</text>
<g stroke="#a4b5a9" stroke-width="4" fill="none">
<path d="M140 190L340 115M140 190L340 285M340 285H590"/>
</g>
<g stroke="#215d48" stroke-width="3" fill="#e5f1e8">
<circle cx="140" cy="190" r="34"/><circle cx="340" cy="115" r="34"/>
<circle cx="340" cy="285" r="34"/><circle cx="590" cy="285" r="34"/>
</g>
<g text-anchor="middle" font-size="24" font-weight="700">
<text x="140" y="199">A</text><text x="340" y="124">B</text>
<text x="340" y="294">C</text><text x="590" y="294">D</text>
</g>
<g font-size="15" text-anchor="middle">
<text x="140" y="242">entry: 64</text><text x="340" y="65">closer: 49</text>
<text x="340" y="339">bridge: 81</text><text x="590" y="339">nearest: 0.25</text>
</g>
<rect x="436" y="99" width="245" height="99" rx="10" fill="#f3e8d9" stroke="#cbab77"/>
<text x="452" y="127" font-size="15">ef = 1 or 2: reject C</text>
<text x="452" y="153" font-size="15">ef = 3: explore C, find D</text>
<text x="452" y="179" font-size="13">This is a fixed teaching graph.</text>
</g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 490" role="img" aria-labelledby="title desc">
<title id="title">A diversity rule chooses a and c instead of the nearest pair a and b</title>
<desc id="desc">The inserted vector q is zero, zero. Candidate a is one, zero. Candidate b is one point one, zero point one, close to a. Candidate c is zero, one point two. The heuristic keeps a and c, while a closest-two selection would keep a and b.</desc>
<rect width="720" height="490" rx="14" fill="#fffaf2"/>
<g font-family="sans-serif" fill="#233a31">
<text x="30" y="35" font-size="20" font-weight="700">Close to q does not mean a useful new direction</text>
<g fill="none" stroke-width="3">
<path d="M90 400H635M90 400V70" stroke="#c1c9c1" stroke-width="1.5"/>
<path d="M90 400H390M90 400V95" stroke="#23654d"/>
<path d="M90 400L420 375" stroke="#b87d36" stroke-dasharray="6 5"/>
</g>
<g fill="#dceee3" stroke="#23654d" stroke-width="2">
<circle cx="90" cy="400" r="14"/><circle cx="390" cy="400" r="14"/><circle cx="90" cy="95" r="14"/>
</g>
<circle cx="420" cy="375" r="14" fill="#f6e4ce" stroke="#b87d36" stroke-width="2"/>
<g font-size="16">
<text x="48" y="440">q = (0, 0)</text><text x="325" y="440">a = (1, 0)</text>
<text x="443" y="382">b = (1.1, 0.1)</text><text x="117" y="100">c = (0, 1.2)</text>
</g>
<rect x="270" y="112" width="395" height="166" rx="12" fill="#edf3ed" stroke="#bfcec2"/>
<g font-size="15">
<text x="290" y="143">Closest two: a, b</text>
<text x="290" y="171">Diversity choice: a, c</text>
<text x="290" y="202">b: d(q, b)^2 = 1.22; d(a, b)^2 = 0.02</text>
<text x="290" y="232">c: d(q, c)^2 = 1.44; d(a, c)^2 = 2.44</text>
<text x="290" y="257">Squared L2 preserves every comparison here.</text>
</g>
</g>
</svg>

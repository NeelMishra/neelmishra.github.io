<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
  <title id="title">IVF: Voronoi Cell Partitioning and Multi-Probe Inverted Posting Lists</title>
  <desc id="desc">Left panel shows 2D space partitioned into Voronoi cells around coarse centroids c0, c1, and c2 where query q=(0.9, 0) in cell c0 sits just across the border from its true nearest neighbor P2=(1.1, 0) in cell c1. Right panel shows the inverted file posting lists where nprobe=1 scans only c0's list while nprobe=2 scans both c0 and c1 to find P2.</desc>
  <defs>
    <marker id="ivf-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#1e6b52" />
    </marker>
    <marker id="ivf-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#c25928" />
    </marker>
    <marker id="ivf-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#9a948c" />
    </marker>
  </defs>

  <rect width="960" height="470" rx="16" fill="#fffaf2" stroke="#dcd3c2" stroke-width="1.5" />

  <!-- Header -->
  <text x="32" y="38" font-family="sans-serif" font-size="20" font-weight="700" fill="#1e2d26">IVF (Inverted File Index): Voronoi Cells &amp; Posting List Probes</text>
  <text x="32" y="62" font-family="sans-serif" font-size="13.5" fill="#52635a">Left: K-means partitions space into Voronoi cells. Right: Each centroid owns a posting list; nprobe controls how many cells are scanned.</text>

  <!-- ==================== LEFT PANEL: VORONOI CELLS ==================== -->
  <rect x="28" y="80" width="440" height="366" rx="12" fill="#ffffff" stroke="#c8d6cc" stroke-width="1.5" />
  <text x="48" y="108" font-family="sans-serif" font-size="15" font-weight="700" fill="#184e3b">1. Voronoi Cells in 2D Vector Space</text>

  <!-- Voronoi Plot Box: x in [-1.0, 3.0] -> [48, 448], y in [-0.5, 2.3] -> [378, 126] -->
  <!-- Cell V2 (Top, gray) -->
  <polygon points="48,126 448,126 316,222 248,222 48,222" fill="#eef0ef" />
  <!-- Cell V0 (Bottom-Left, warm amber) -->
  <polygon points="48,222 248,222 248,378 48,378" fill="#faece0" />
  <!-- Cell V1 (Bottom-Right, mint green) -->
  <polygon points="248,222 316,222 448,126 448,378 248,378" fill="#e4f3eb" />
  <rect x="48" y="126" width="400" height="252" fill="none" stroke="#9ab5a6" stroke-width="1.6" />

  <!-- Voronoi Cell Boundaries -->
  <line x1="248" y1="222" x2="248" y2="378" stroke="#b83b2a" stroke-width="2.6" stroke-dasharray="6 4" />
  <line x1="48" y1="222" x2="248" y2="222" stroke="#7c8b84" stroke-width="2" stroke-dasharray="5 4" />
  <line x1="248" y1="222" x2="368" y2="126" stroke="#7c8b84" stroke-width="2" stroke-dasharray="5 4" />

  <!-- Cell Titles -->
  <text x="62" y="150" font-family="sans-serif" font-size="12" font-weight="700" fill="#5a6660">Cell V2 (Skipped)</text>
  <text x="62" y="364" font-family="sans-serif" font-size="12" font-weight="700" fill="#8c3d19">Cell V0 (nprobe = 1)</text>
  <text x="292" y="364" font-family="sans-serif" font-size="12" font-weight="700" fill="#184e3b">Cell V1 (nprobe = 2)</text>

  <!-- Search radius around q spilling across x1 = 1.0 into V1 -->
  <circle cx="236" cy="306" r="34" fill="#d13b27" fill-opacity="0.12" stroke="#d13b27" stroke-width="1.8" stroke-dasharray="4 3" />

  <!-- Coarse Centroids (Squares) -->
  <!-- c0 = (0, 0) -> (148, 306) -->
  <rect x="140" y="298" width="16" height="16" rx="3" fill="#c25928" stroke="#ffffff" stroke-width="2" />
  <text x="148" y="332" font-family="sans-serif" font-size="12" font-weight="700" fill="#8c3d19" text-anchor="middle">c0 (0, 0)</text>

  <!-- c1 = (2, 0) -> (348, 306) -->
  <rect x="340" y="298" width="16" height="16" rx="3" fill="#1e6b52" stroke="#ffffff" stroke-width="2" />
  <text x="348" y="332" font-family="sans-serif" font-size="12" font-weight="700" fill="#184e3b" text-anchor="middle">c1 (2, 0)</text>

  <!-- c2 = (0, 2) -> (184, 154) -->
  <rect x="176" y="146" width="16" height="16" rx="3" fill="#6c7a73" stroke="#ffffff" stroke-width="2" />
  <text x="200" y="158" font-family="sans-serif" font-size="12" font-weight="700" fill="#526059">c2 (0, 2)</text>

  <!-- Data Vectors & Query q -->
  <!-- P0 = (-0.5, 0) -> (98, 306) -->
  <circle cx="98" cy="306" r="6.5" fill="#c25928" />
  <text x="90" y="290" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#8c3d19" text-anchor="middle">P0</text>

  <!-- P1 = (0.4, 0.8) -> (188, 246) -->
  <circle cx="188" cy="246" r="6.5" fill="#c25928" />
  <text x="188" y="232" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#8c3d19" text-anchor="middle">P1</text>

  <!-- Query q = (0.9, 0) -> (236, 306) -->
  <circle cx="236" cy="306" r="7" fill="#d13b27" stroke="#ffffff" stroke-width="1.8" />
  <text x="214" y="286" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#d13b27" text-anchor="middle">q</text>

  <!-- P2 = (1.1, 0) -> (260, 306) -->
  <circle cx="260" cy="306" r="7.5" fill="#1e6b52" stroke="#ffffff" stroke-width="2" />
  <text x="276" y="290" font-family="sans-serif" font-size="12" font-weight="700" fill="#184e3b">P2 (True NN!)</text>

  <!-- P3 = (2.4, 0) -> (392, 306) -->
  <circle cx="392" cy="306" r="6.5" fill="#1e6b52" />
  <text x="392" y="290" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#184e3b" text-anchor="middle">P3</text>

  <!-- P4 = (0, 1.8) -> (184, 184) -->
  <circle cx="184" cy="184" r="6.5" fill="#6c7a73" />
  <text x="154" y="188" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#526059" text-anchor="middle">P4</text>

  <!-- Bottom takeaway in Left Panel -->
  <rect x="48" y="388" width="400" height="44" rx="8" fill="#f3f7f4" stroke="#c8d6cc" />
  <text x="62" y="406" font-family="sans-serif" font-size="12" font-weight="700" fill="#b83b2a">Boundary issue: q lands in V0, while P2 sits just across in V1!</text>
  <text x="62" y="423" font-family="sans-serif" font-size="12" fill="#374840">Probing only 1 cell (nprobe=1) never looks inside Cell V1.</text>

  <!-- ==================== RIGHT PANEL: INVERTED POSTING LISTS ==================== -->
  <rect x="492" y="80" width="440" height="366" rx="12" fill="#ffffff" stroke="#c8d6cc" stroke-width="1.5" />
  <text x="512" y="108" font-family="sans-serif" font-size="15" font-weight="700" fill="#184e3b">2. Inverted File Structure (Centroid -&gt; Posting List)</text>

  <!-- Row 1: List L0 (Probed at nprobe >= 1) -->
  <rect x="512" y="130" width="400" height="74" rx="10" fill="#fff6ee" stroke="#c25928" stroke-width="2" />
  <text x="526" y="150" font-family="sans-serif" font-size="12" font-weight="700" fill="#c25928">Probe #1 (nprobe = 1): Closest Centroid c0 (d^2 = 0.81)</text>
  <!-- Centroid box c0 -->
  <rect x="526" y="160" width="68" height="32" rx="6" fill="#c25928" />
  <text x="560" y="181" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">List L0</text>
  <line x1="594" y1="176" x2="622" y2="176" stroke="#c25928" stroke-width="2.2" marker-end="url(#ivf-amber)" />
  <!-- Vector pills -->
  <rect x="628" y="160" width="124" height="32" rx="6" fill="#fde4cf" stroke="#c25928" stroke-width="1.5" />
  <text x="690" y="180" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#8c3d19" text-anchor="middle">P0 (d^2 = 1.96)</text>
  <rect x="764" y="160" width="132" height="32" rx="6" fill="#fde4cf" stroke="#c25928" stroke-width="1.8" />
  <text x="830" y="180" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#8c3d19" text-anchor="middle">P1 (d^2 = 0.89)</text>

  <!-- Row 2: List L1 (Probed at nprobe >= 2) -->
  <rect x="512" y="218" width="400" height="74" rx="10" fill="#eef8f3" stroke="#1e6b52" stroke-width="2.2" />
  <text x="526" y="238" font-family="sans-serif" font-size="12" font-weight="700" fill="#184e3b">Probe #2 (nprobe = 2): 2nd Closest Centroid c1 (d^2 = 1.21)</text>
  <!-- Centroid box c1 -->
  <rect x="526" y="248" width="68" height="32" rx="6" fill="#1e6b52" />
  <text x="560" y="269" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">List L1</text>
  <line x1="594" y1="264" x2="622" y2="264" stroke="#1e6b52" stroke-width="2.2" marker-end="url(#ivf-green)" />
  <!-- Vector pills -->
  <rect x="628" y="248" width="136" height="32" rx="6" fill="#c7ead8" stroke="#1e6b52" stroke-width="2.2" />
  <text x="696" y="268" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#184e3b" text-anchor="middle">P2 (d^2 = 0.04) Hit!</text>
  <rect x="776" y="248" width="120" height="32" rx="6" fill="#dff2e8" stroke="#1e6b52" stroke-width="1.4" />
  <text x="836" y="268" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#184e3b" text-anchor="middle">P3 (d^2 = 2.25)</text>

  <!-- Row 3: List L2 (Skipped) -->
  <rect x="512" y="306" width="400" height="68" rx="10" fill="#f5f4f2" stroke="#c8c2b8" stroke-width="1.5" />
  <text x="526" y="326" font-family="sans-serif" font-size="12" font-weight="700" fill="#6e685f">Unprobed (Rank 3): Centroid c2 (d^2 = 4.81) — Skipped</text>
  <!-- Centroid box c2 -->
  <rect x="526" y="334" width="68" height="30" rx="6" fill="#8c867e" />
  <text x="560" y="353" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">List L2</text>
  <line x1="594" y1="349" x2="622" y2="349" stroke="#9a948c" stroke-width="1.8" marker-end="url(#ivf-gray)" />
  <rect x="628" y="334" width="124" height="30" rx="6" fill="#e8e5e0" stroke="#b8b2a8" />
  <text x="690" y="353" font-family="sans-serif" font-size="11.5" fill="#6e685f" text-anchor="middle">P4 (never read)</text>

  <!-- Summary Box in Right Panel -->
  <rect x="512" y="388" width="400" height="44" rx="8" fill="#eef6f2" stroke="#1e6b52" stroke-width="1.4" />
  <text x="526" y="406" font-family="sans-serif" font-size="12" font-weight="700" fill="#184e3b">nprobe = 1 returns P1 (0.89);  nprobe = 2 crosses border &amp; finds P2 (0.04)</text>
  <text x="526" y="423" font-family="sans-serif" font-size="12" fill="#374840">Coarse k-means scans 2 of 3 lists instead of the entire corpus.</text>
</svg>

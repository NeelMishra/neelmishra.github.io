<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" role="img" aria-labelledby="title desc">
  <title id="title">IVF Voronoi Partitioning and Multi-Probe Posting List Lookup</title>
  <desc id="desc">Left panel shows three Voronoi cells around coarse centroids c0, c1, c2 where query q=(0.9, 0.0) in cell c0 sits just across the bisector x1=1.0 from its true nearest neighbor P2=(1.1, 0.0) in cell c1. Right panel shows the inverted posting lists L0, L1, L2 scanned under nprobe=1 vs nprobe=2.</desc>
  <defs>
    <style>
      .bg { fill: #fbfaf6; stroke: #d8d1c2; stroke-width: 1.5; }
      .card { fill: #ffffff; stroke: #d8d1c2; stroke-width: 1.5; rx: 12; }
      .title { font: 700 18px "EB Garamond", Georgia, serif; fill: #1d1b16; }
      .subtitle { font: 600 14px "EB Garamond", Georgia, serif; fill: #2f2a22; }
      .body { font: 400 12.5px "EB Garamond", Georgia, serif; fill: #4a4338; }
      .mono { font: 600 11.5px "JetBrains Mono", "SFMono-Regular", monospace; fill: #2a4b3c; }
      .mono-warm { font: 600 11.5px "JetBrains Mono", "SFMono-Regular", monospace; fill: #8c3d1e; }
      .mono-blue { font: 600 11.5px "JetBrains Mono", "SFMono-Regular", monospace; fill: #1f4e78; }
      .bisector { stroke: #b8532a; stroke-width: 2; stroke-dasharray: 6 4; }
      .cell-c0 { fill: #e8f0f8; fill-opacity: 0.55; }
      .cell-c1 { fill: #e9f3ee; fill-opacity: 0.55; }
      .cell-c2 { fill: #f5efe6; fill-opacity: 0.65; }
      .centroid { fill: #8c3d1e; stroke: #ffffff; stroke-width: 1.5; }
      .pt-q { fill: #1f4e78; }
      .pt-hit { fill: #2a6f57; }
      .pt-vec { fill: #5a5244; }
      .list-box { fill: #fcfbf8; stroke: #c8bfb0; stroke-width: 1.4; rx: 8; }
      .list-probe1 { fill: #e8f0f8; stroke: #1f4e78; stroke-width: 1.8; rx: 8; }
      .list-probe2 { fill: #e9f3ee; stroke: #2a6f57; stroke-width: 1.8; rx: 8; }
    </style>
  </defs>

  <rect x="4" y="4" width="912" height="432" rx="14" class="bg" />
  <text x="28" y="34" class="title">IVF: Coarse Voronoi Cells and Multi-Probe Inverted Lists</text>
  <text x="28" y="54" class="body">Vectors are assigned to their nearest coarse centroid; querying nprobe &gt; 1 cells crosses Voronoi bisectors.</text>

  <!-- Left Panel: 2D Voronoi Partition -->
  <rect x="24" y="70" width="440" height="346" class="card" />
  <text x="44" y="96" class="subtitle">1. Coarse Voronoi Cells Around c0, c1, c2</text>
  <text x="44" y="114" class="body">Bisector x1 = 1.0 separates q = (0.9, 0) in V0 from P2 = (1.1, 0) in V1:</text>

  <!-- Plot canvas: x in [-1.0, 3.0] -> [44, 444] (scale 100px/unit, x=0 at 144); y in [-0.5, 2.3] -> [340, 128] (y=0 at 296, scale 75px/unit) -->
  <rect x="44" y="128" width="400" height="212" fill="#fcfbf8" stroke="#c8bfb0" stroke-width="1.2" />

  <!-- Voronoi regions shaded -->
  <!-- V2: above y=1 (y_px < 221) and above x - y = 0 -->
  <polygon points="44,128 444,128 312,221 244,221 44,221" class="cell-c2" />
  <!-- V0: x < 1 (x_px < 244) and y < 1 (y_px > 221) -->
  <polygon points="44,221 244,221 244,340 44,340" class="cell-c0" />
  <!-- V1: x > 1 (x_px > 244) -->
  <polygon points="244,221 312,221 444,128 444,340 244,340" class="cell-c1" />

  <!-- Voronoi bisectors -->
  <!-- Bisector between c0(0,0) and c1(2,0): x = 1.0 -> x_px = 244 (for y <= 1 -> y_px >= 221) -->
  <line x1="244" y1="221" x2="244" y2="340" class="bisector" />
  <!-- Bisector between c0(0,0) and c2(0,2): y = 1.0 -> y_px = 221 (for x <= 1 -> x_px <= 244) -->
  <line x1="44" y1="221" x2="244" y2="221" class="bisector" />
  <!-- Bisector between c1(2,0) and c2(0,2): x = y -> from (1,1)=(244,221) to (2.24, 2.24)=(368,128) -->
  <line x1="244" y1="221" x2="368" y2="128" class="bisector" />

  <text x="156" y="332" class="mono-warm">Bisector x1 = 1.0</text>

  <!-- Centroids -->
  <!-- c0 = (0,0) -> (144, 296) -->
  <rect x="139" y="291" width="10" height="10" class="centroid" />
  <text x="108" y="315" class="mono-warm">c0(0,0)</text>

  <!-- c1 = (2,0) -> (344, 296) -->
  <rect x="339" y="291" width="10" height="10" class="centroid" />
  <text x="322" y="318" class="mono-warm">c1(2,0)</text>

  <!-- c2 = (0,2) -> (144, 146) -->
  <rect x="139" y="141" width="10" height="10" class="centroid" />
  <text x="156" y="150" class="mono-warm">c2(0,2)</text>

  <!-- Points -->
  <!-- P0 = (-0.5, 0) -> (94, 296) -->
  <circle cx="94" cy="296" r="4.5" class="pt-vec" />
  <text x="62" y="284" class="body">P0(-0.5, 0)</text>

  <!-- P1 = (0.4, 0.8) -> (184, 236) -->
  <circle cx="184" cy="236" r="4.5" class="pt-vec" />
  <text x="132" y="216" class="body">P1(0.4, 0.8)</text>

  <!-- q = (0.9, 0.0) -> (234, 296) -->
  <circle cx="234" cy="296" r="5" class="pt-q" />
  <text x="180" y="276" class="mono-blue">q(0.9, 0)</text>

  <!-- P2 = (1.1, 0.0) -> (254, 296) -->
  <circle cx="254" cy="296" r="5" class="pt-hit" />
  <text x="256" y="276" class="mono">P2(1.1, 0)</text>

  <!-- P3 = (2.4, 0.0) -> (384, 296) -->
  <circle cx="384" cy="296" r="4.5" class="pt-vec" />
  <text x="366" y="276" class="body">P3(2.4, 0)</text>

  <!-- P4 = (0.0, 1.8) -> (144, 161) -->
  <circle cx="144" cy="161" r="4.5" class="pt-vec" />
  <text x="68" y="168" class="body">P4(0, 1.8)</text>

  <text x="44" y="366" class="mono-blue">d^2(q, c0) = 0.81  &lt;  d^2(q, c1) = 1.21  &lt;  d^2(q, c2) = 4.81</text>
  <text x="44" y="388" class="body">Although q is closer to c0, its true nearest point P2 (d^2 = 0.04) belongs to c1.</text>

  <!-- Right Panel: Posting Lists -->
  <rect x="484" y="70" width="412" height="346" class="card" />
  <text x="504" y="96" class="subtitle">2. Inverted Posting Lists &amp; Multi-Probe Lookup</text>
  <text x="504" y="114" class="body">Coarse quantizer ranks centroids by d^2(q, c_m):</text>

  <!-- Posting List L0 -->
  <rect x="504" y="132" width="372" height="72" class="list-probe1" />
  <text x="518" y="154" class="mono-blue">1. List L0 (c0, d^2 = 0.81) [probed at nprobe &gt;= 1]</text>
  <text x="518" y="176" class="body">Entries: P0 (-0.5, 0) [d^2=1.96]  |  P1 (0.4, 0.8) [d^2=0.89]</text>
  <text x="518" y="194" class="mono-blue">Best at nprobe=1: P1 (d^2 = 0.89)</text>

  <!-- Posting List L1 -->
  <rect x="504" y="218" width="372" height="72" class="list-probe2" />
  <text x="518" y="240" class="mono">2. List L1 (c1, d^2 = 1.21) [probed at nprobe &gt;= 2]</text>
  <text x="518" y="262" class="body">Entries: P2 (1.1, 0) [d^2=0.04]   |  P3 (2.4, 0) [d^2=2.25]</text>
  <text x="518" y="280" class="mono">Best at nprobe=2: P2 (d^2 = 0.04, exact 1-NN!)</text>

  <!-- Posting List L2 -->
  <rect x="504" y="304" width="372" height="54" class="list-box" />
  <text x="518" y="326" class="mono-warm">3. List L2 (c2, d^2 = 4.81) [skipped at nprobe = 2]</text>
  <text x="518" y="346" class="body">Entries: P4 (0.0, 1.8) [d^2=4.05]</text>

  <text x="504" y="384" class="mono">Residuals: r(x) = x - c_m,  d(q, x) = d(q - c_m, r(x))</text>
  <text x="504" y="402" class="body">Probing 2 of 3 lists scans 4 vectors and recovers the exact nearest neighbor.</text>
</svg>

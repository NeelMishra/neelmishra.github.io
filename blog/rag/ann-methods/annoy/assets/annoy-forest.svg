<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
  <title id="title">Annoy: How a Forest of Random Bisector Trees Surrounds the Query</title>
  <desc id="desc">Three-step visual progression: Panel 1 shows Tree 1 slicing vertically at x=1.0 and missing neighbor x3; Panel 2 shows Tree 2 slicing horizontally at y=1.0 and keeping x1 and x3 with query q; Panel 3 overlays both leaves to show the forest union capturing all true neighbors.</desc>
  <defs>
    <marker id="an-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#1e6b52" />
    </marker>
    <marker id="an-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#c25928" />
    </marker>
  </defs>

  <rect width="960" height="470" rx="16" fill="#fffaf2" stroke="#dcd3c2" stroke-width="1.5" />

  <!-- Header -->
  <text x="32" y="38" font-family="sans-serif" font-size="20" font-weight="700" fill="#1e2d26">Annoy: Random Midpoint Hyperplanes &amp; Forest Candidate Union</text>
  <text x="32" y="62" font-family="sans-serif" font-size="13.5" fill="#52635a">Each tree bisects two random points; combining leaves from multiple trees prevents any single split from hiding a neighbor.</text>

  <!-- ==================== PANEL 1: TREE 1 ==================== -->
  <rect x="28" y="82" width="290" height="364" rx="12" fill="#ffffff" stroke="#e2ccb5" stroke-width="1.5" />
  <rect x="28" y="82" width="290" height="36" rx="12" fill="#faece0" />
  <text x="173" y="105" font-family="sans-serif" font-size="14.5" font-weight="700" fill="#8c3d19" text-anchor="middle">1. Tree 1: Vertical Bisector</text>

  <!-- 2D Box for Tree 1: [58, 134] size 230x168 -->
  <rect x="58" y="134" width="230" height="168" fill="#faf8f5" stroke="#b8b0a4" stroke-width="1.4" />
  <!-- Left Half-Plane Shaded (Visited Leaf) -->
  <rect x="58" y="134" width="115" height="168" fill="#fde4cf" fill-opacity="0.75" />

  <!-- Chord between sampled pivots x0(0,0) and x2(2,0) -->
  <line x1="94" y1="268" x2="252" y2="268" stroke="#8a7968" stroke-width="1.5" stroke-dasharray="4 3" />
  <!-- Vertical Bisector H1 at x = 1.0 (x_px = 173) -->
  <line x1="173" y1="134" x2="173" y2="302" stroke="#c25928" stroke-width="2.6" />
  <text x="180" y="234" font-family="sans-serif" font-size="11" font-weight="700" fill="#c25928">Split H1 (x = 1)</text>

  <!-- Points in Panel 1 -->
  <!-- x0(0,0) -> (94, 268), x1(0,2) -> (94, 168), x2(2,0) -> (252, 268), x3(2,2) -> (252, 168), q(0.9, 1.8) -> (165, 178) -->
  <circle cx="94" cy="268" r="6" fill="#6e655c" />
  <text x="94" y="290" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#4a433b" text-anchor="middle">x0 (pivot)</text>

  <circle cx="252" cy="268" r="6" fill="#6e655c" />
  <text x="252" y="290" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#4a433b" text-anchor="middle">x2 (pivot)</text>

  <circle cx="94" cy="168" r="7" fill="#1e6b52" stroke="#ffffff" stroke-width="1.5" />
  <text x="94" y="154" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#184e3b" text-anchor="middle">x1 (1st NN)</text>

  <circle cx="252" cy="168" r="7" fill="#8a9992" stroke="#ffffff" stroke-width="1.5" />
  <text x="242" y="154" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#6e655c" text-anchor="middle">x3 (Missed!)</text>

  <circle cx="163" cy="178" r="6.5" fill="#d13b27" stroke="#ffffff" stroke-width="1.5" />
  <text x="145" y="182" font-family="sans-serif" font-size="12" font-weight="700" fill="#d13b27">q</text>

  <!-- Mini Tree 1 below box -->
  <line x1="173" y1="334" x2="118" y2="374" stroke="#c25928" stroke-width="2.4" marker-end="url(#an-amber)" />
  <line x1="173" y1="334" x2="228" y2="374" stroke="#c2beb8" stroke-width="1.8" />
  <rect x="135" y="314" width="76" height="24" rx="12" fill="#c25928" />
  <text x="173" y="330" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Split H1</text>

  <rect x="68" y="376" width="100" height="30" rx="6" fill="#fde4cf" stroke="#c25928" stroke-width="1.8" />
  <text x="118" y="395" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#8c3d19" text-anchor="middle">Leaf: {x0, x1}</text>

  <rect x="180" y="376" width="96" height="30" rx="6" fill="#f2efeb" stroke="#c2beb8" />
  <text x="228" y="395" font-family="sans-serif" font-size="11.5" fill="#7a736b" text-anchor="middle">{x2, x3}</text>

  <text x="173" y="428" font-family="sans-serif" font-size="12" font-weight="700" fill="#8c3d19" text-anchor="middle">Finds x1, but H1 cuts off x3</text>

  <!-- ==================== PANEL 2: TREE 2 ==================== -->
  <rect x="335" y="82" width="290" height="364" rx="12" fill="#ffffff" stroke="#c8d6cc" stroke-width="1.5" />
  <rect x="335" y="82" width="290" height="36" rx="12" fill="#e6f2ec" />
  <text x="480" y="105" font-family="sans-serif" font-size="14.5" font-weight="700" fill="#184e3b" text-anchor="middle">2. Tree 2: Horizontal Bisector</text>

  <!-- 2D Box for Tree 2: [365, 134] size 230x168 -->
  <rect x="365" y="134" width="230" height="168" fill="#faf8f5" stroke="#b8b0a4" stroke-width="1.4" />
  <!-- Top Half-Plane Shaded (Visited Leaf) -->
  <rect x="365" y="134" width="230" height="84" fill="#d3ede0" fill-opacity="0.75" />

  <!-- Chord between sampled pivots x0(0,0) and x1(0,2) -->
  <line x1="401" y1="268" x2="401" y2="168" stroke="#5f786c" stroke-width="1.5" stroke-dasharray="4 3" />
  <!-- Horizontal Bisector H2 at y = 1.0 (y_px = 218) -->
  <line x1="365" y1="218" x2="595" y2="218" stroke="#1e6b52" stroke-width="2.6" />
  <text x="486" y="234" font-family="sans-serif" font-size="11" font-weight="700" fill="#1e6b52">Split H2 (y = 1)</text>

  <!-- Points in Panel 2 -->
  <circle cx="401" cy="268" r="6" fill="#6e655c" />
  <text x="401" y="290" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#4a433b" text-anchor="middle">x0 (pivot)</text>

  <circle cx="559" cy="268" r="6" fill="#8a9992" />
  <text x="559" y="290" font-family="sans-serif" font-size="11.5" fill="#6e655c" text-anchor="middle">x2</text>

  <circle cx="401" cy="168" r="7" fill="#1e6b52" stroke="#ffffff" stroke-width="1.5" />
  <text x="408" y="154" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#184e3b" text-anchor="middle">x1 (pivot)</text>

  <circle cx="559" cy="168" r="7" fill="#1e6b52" stroke="#ffffff" stroke-width="1.5" />
  <text x="552" y="154" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#184e3b" text-anchor="middle">x3 (2nd NN!)</text>

  <circle cx="470" cy="178" r="6.5" fill="#d13b27" stroke="#ffffff" stroke-width="1.5" />
  <text x="452" y="182" font-family="sans-serif" font-size="12" font-weight="700" fill="#d13b27">q</text>

  <!-- Mini Tree 2 below box -->
  <line x1="480" y1="334" x2="425" y2="374" stroke="#1e6b52" stroke-width="2.4" marker-end="url(#an-green)" />
  <line x1="480" y1="334" x2="535" y2="374" stroke="#c2beb8" stroke-width="1.8" />
  <rect x="442" y="314" width="76" height="24" rx="12" fill="#1e6b52" />
  <text x="480" y="330" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Split H2</text>

  <rect x="375" y="376" width="100" height="30" rx="6" fill="#d3ede0" stroke="#1e6b52" stroke-width="1.8" />
  <text x="425" y="395" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#184e3b" text-anchor="middle">Leaf: {x1, x3}</text>

  <rect x="487" y="376" width="96" height="30" rx="6" fill="#f2efeb" stroke="#c2beb8" />
  <text x="535" y="395" font-family="sans-serif" font-size="11.5" fill="#7a736b" text-anchor="middle">{x0, x2}</text>

  <text x="480" y="428" font-family="sans-serif" font-size="12" font-weight="700" fill="#184e3b" text-anchor="middle">Co-locates q with both x1 &amp; x3!</text>

  <!-- ==================== PANEL 3: FOREST UNION ==================== -->
  <rect x="642" y="82" width="290" height="364" rx="12" fill="#ffffff" stroke="#bfcbe0" stroke-width="1.5" />
  <rect x="642" y="82" width="290" height="36" rx="12" fill="#e6eef8" />
  <text x="787" y="105" font-family="sans-serif" font-size="14.5" font-weight="700" fill="#1e4976" text-anchor="middle">3. Forest Union (Tree 1 U Tree 2)</text>

  <!-- 2D Box for Union: [672, 134] size 230x168 -->
  <rect x="672" y="134" width="230" height="168" fill="#faf8f5" stroke="#b8b0a4" stroke-width="1.4" />
  <!-- Tree 1 Left Half-Plane -->
  <rect x="672" y="134" width="115" height="168" fill="#fde4cf" fill-opacity="0.6" />
  <!-- Tree 2 Top Half-Plane -->
  <rect x="672" y="134" width="230" height="84" fill="#d3ede0" fill-opacity="0.65" />

  <!-- Both split lines dashed -->
  <line x1="787" y1="134" x2="787" y2="302" stroke="#c25928" stroke-width="1.8" stroke-dasharray="5 3" />
  <line x1="672" y1="218" x2="902" y2="218" stroke="#1e6b52" stroke-width="1.8" stroke-dasharray="5 3" />

  <!-- Points in Panel 3 -->
  <circle cx="708" cy="268" r="6" fill="#c25928" />
  <text x="708" y="290" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#8c3d19" text-anchor="middle">x0 (in union)</text>

  <circle cx="866" cy="268" r="6" fill="#b0b8b4" />
  <text x="866" y="290" font-family="sans-serif" font-size="11.5" fill="#7a736b" text-anchor="middle">x2 (skipped)</text>

  <circle cx="708" cy="168" r="7.5" fill="#1e6b52" stroke="#ffffff" stroke-width="1.8" />
  <text x="708" y="154" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#184e3b" text-anchor="middle">x1 (Rank 1)</text>

  <circle cx="866" cy="168" r="7.5" fill="#1e6b52" stroke="#ffffff" stroke-width="1.8" />
  <text x="862" y="154" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#184e3b" text-anchor="middle">x3 (Rank 2)</text>

  <circle cx="777" cy="178" r="6.5" fill="#d13b27" stroke="#ffffff" stroke-width="1.5" />
  <text x="759" y="182" font-family="sans-serif" font-size="12" font-weight="700" fill="#d13b27">q</text>

  <!-- Candidate Pool & Rerank Box below -->
  <rect x="668" y="316" width="238" height="44" rx="7" fill="#f2f6fc" stroke="#96b3d9" stroke-width="1.6" />
  <text x="787" y="335" font-family="sans-serif" font-size="12" font-weight="700" fill="#1e4976" text-anchor="middle">Candidate Union = {x0, x1, x3}</text>
  <text x="787" y="352" font-family="sans-serif" font-size="11.5" fill="#374840" text-anchor="middle">Score exact L2 on union -&gt; [x1, x3]</text>

  <rect x="668" y="372" width="238" height="60" rx="7" fill="#eef6f2" stroke="#1e6b52" stroke-width="1.4" />
  <text x="787" y="392" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#184e3b" text-anchor="middle">Shared Priority Queue (search_k)</text>
  <text x="787" y="409" font-family="sans-serif" font-size="11" fill="#374840" text-anchor="middle">Visits all n_trees leaves first, then</text>
  <text x="787" y="424" font-family="sans-serif" font-size="11" fill="#374840" text-anchor="middle">crosses smallest-margin splits.</text>
</svg>

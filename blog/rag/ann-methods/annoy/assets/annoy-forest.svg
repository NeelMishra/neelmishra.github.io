<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" role="img" aria-labelledby="title desc">
  <title id="title">Annoy Random Projection Forest and Priority-Queue Margin Search</title>
  <desc id="desc">Left panel shows a single random-midpoint hyperplane tree separating query q from its nearest neighbor x*; right panel shows a second tree with a different random split keeping q and x* in the same leaf and a shared priority queue ordered by hyperplane margin.</desc>
  <defs>
    <style>
      .bg { fill: #fbfaf6; stroke: #d8d1c2; stroke-width: 1.5; }
      .card { fill: #ffffff; stroke: #d8d1c2; stroke-width: 1.5; rx: 12; }
      .title { font: 700 18px "EB Garamond", Georgia, serif; fill: #1d1b16; }
      .subtitle { font: 600 14px "EB Garamond", Georgia, serif; fill: #2f2a22; }
      .body { font: 400 12.5px "EB Garamond", Georgia, serif; fill: #4a4338; }
      .mono { font: 600 11.5px "JetBrains Mono", "SFMono-Regular", monospace; fill: #2a4b3c; }
      .mono-warm { font: 600 11.5px "JetBrains Mono", "SFMono-Regular", monospace; fill: #8c3d1e; }
      .mono-blue { font: 600 11.5px "JetBrains Mono", "SFMono-Regular", monospace; fill: #1f4e78; }
      .split-primary { stroke: #b8532a; stroke-width: 2.2; }
      .split-secondary { stroke: #7d7463; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .split-good { stroke: #2a6f57; stroke-width: 2.2; }
      .chord { stroke: #9a9181; stroke-width: 1.4; stroke-dasharray: 3 3; }
      .cell-highlight { fill: #e9f3ee; fill-opacity: 0.7; stroke: none; }
      .cell-miss { fill: #faeee8; fill-opacity: 0.55; stroke: none; }
      .pt-pivot { fill: #6e6556; }
      .pt-q { fill: #1f4e78; }
      .pt-star { fill: #2a6f57; }
      .pt-other { fill: #9a9181; }
      .box-note { fill: #f4f1ea; stroke: #d8d1c2; stroke-width: 1.2; rx: 8; }
      .box-good { fill: #e9f3ee; stroke: #2a6f57; stroke-width: 1.2; rx: 8; }
    </style>
  </defs>

  <rect x="4" y="4" width="912" height="432" rx="14" class="bg" />
  <text x="28" y="34" class="title">Annoy: Equidistant Midpoint Hyperplanes and Forest Union</text>
  <text x="28" y="54" class="body">Each tree splits nodes along the perpendicular bisector of two sampled points; multiple trees eliminate boundary misses.</text>

  <!-- Left Panel: Tree 1 (Boundary Miss) -->
  <rect x="24" y="70" width="424" height="346" class="card" />
  <text x="44" y="96" class="subtitle">1. Tree 1: Equidistant Split Separates q and x*</text>
  <text x="44" y="114" class="body">Sampled points (p, r) define normal w = p - r and midpoint m:</text>

  <!-- Plot box Left -->
  <rect x="44" y="128" width="384" height="196" fill="#fcfbf8" stroke="#c8bfb0" stroke-width="1.2" />
  <!-- Shaded half-plane visited in Tree 1 -->
  <polygon points="44,128 228,128 256,324 44,324" class="cell-miss" />

  <!-- Secondary child split -->
  <line x1="44" y1="236" x2="243" y2="236" class="split-secondary" />
  <!-- Primary root split hyperplane H(w, m) -->
  <line x1="228" y1="128" x2="256" y2="324" class="split-primary" />

  <!-- Pivot chord p to r -->
  <line x1="148" y1="184" x2="334" y2="162" class="chord" />
  <circle cx="148" cy="184" r="4.5" class="pt-pivot" />
  <text x="118" y="180" class="body">p</text>
  <circle cx="334" cy="162" r="4.5" class="pt-pivot" />
  <text x="344" y="166" class="body">r</text>
  <!-- Midpoint m -->
  <circle cx="241" cy="173" r="4" fill="#b8532a" />
  <text x="249" y="177" class="mono-warm">m = (p+r)/2</text>

  <!-- Query q and true neighbor x* straddling the split -->
  <circle cx="222" cy="266" r="5" class="pt-q" />
  <text x="198" y="284" class="mono-blue">q</text>
  <circle cx="264" cy="262" r="5" class="pt-star" />
  <text x="274" y="266" class="mono">x* (missed leaf)</text>

  <!-- Extra ambient points -->
  <circle cx="96" cy="278" r="3.5" class="pt-other" />
  <circle cx="136" cy="296" r="3.5" class="pt-other" />
  <circle cx="352" cy="278" r="3.5" class="pt-other" />

  <rect x="44" y="336" width="384" height="64" class="box-note" />
  <text x="58" y="356" class="mono-warm">H = { x : &lt;p - r, x - m&gt; = 0 },   margin = |&lt;w, q - m&gt;|</text>
  <text x="58" y="376" class="body">Because q has a small margin to H, a greedy 1-leaf descent in</text>
  <text x="58" y="392" class="body">Tree 1 lands on the left side while x* sits just across H.</text>

  <!-- Right Panel: Tree 2 + Shared Priority Queue -->
  <rect x="472" y="70" width="424" height="346" class="card" />
  <text x="492" y="96" class="subtitle">2. Tree 2 + Priority Queue Recover x* (n_trees, search_k)</text>
  <text x="492" y="114" class="body">Independent random pivots orient H' away from the pair (q, x*):</text>

  <!-- Plot box Right -->
  <rect x="492" y="128" width="384" height="196" fill="#fcfbf8" stroke="#c8bfb0" stroke-width="1.2" />
  <!-- Shaded bottom-right cell containing both q and x* -->
  <polygon points="492,226 876,192 876,324 492,324" class="cell-highlight" />

  <!-- Secondary split in Tree 2 -->
  <line x1="640" y1="213" x2="660" y2="324" class="split-secondary" />
  <!-- Primary split H' in Tree 2 -->
  <line x1="492" y1="226" x2="876" y2="192" class="split-good" />
  <text x="506" y="214" class="mono">Tree 2 split H'</text>

  <!-- Query q and x* together in the same leaf cell -->
  <circle cx="710" cy="266" r="5" class="pt-q" />
  <text x="688" y="284" class="mono-blue">q</text>
  <circle cx="752" cy="262" r="5" class="pt-star" />
  <text x="762" y="266" class="mono">x* (co-located!)</text>

  <!-- Extra points -->
  <circle cx="556" cy="284" r="3.5" class="pt-other" />
  <circle cx="610" cy="166" r="3.5" class="pt-other" />
  <circle cx="780" cy="158" r="3.5" class="pt-other" />

  <rect x="492" y="336" width="384" height="64" class="box-good" />
  <text x="506" y="356" class="mono">Candidate pool C(q) = Union_{t=1..n_trees} Leaves_t(q)</text>
  <text x="506" y="376" class="body">A max-heap ordered by margin |&lt;w_u, q - m_u&gt;| expands across</text>
  <text x="506" y="392" class="body">all n_trees roots until search_k candidate vectors are scored.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350" role="img" aria-labelledby="title desc"><title id="title">Two meanings of remasking</title><desc id="desc">Discarding a proposed token leaves a current mask unchanged. Erasing a committed token makes a previously visible position editable again.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs><g font-family="system-ui, sans-serif"><text x="20" y="28" font-size="21" fill="#13201a" text-anchor="start" font-weight="700">Where a token becomes a commitment</text><text x="20" y="88" font-size="16" fill="#13201a" text-anchor="start" font-weight="600">Current state</text><rect x="220" y="60" width="101" height="43" rx="6" fill="#e2f2eb" stroke="#d9cfba"/><text x="270" y="88" font-size="16" fill="#13201a" text-anchor="middle" font-weight="400">the</text><rect x="333" y="60" width="101" height="43" rx="6" fill="#f4ece0" stroke="#d9cfba" stroke-dasharray="5 3"/><text x="383" y="88" font-size="16" fill="#13201a" text-anchor="middle" font-weight="400">[M]</text><rect x="446" y="60" width="101" height="43" rx="6" fill="#f4ece0" stroke="#d9cfba" stroke-dasharray="5 3"/><text x="496" y="88" font-size="16" fill="#13201a" text-anchor="middle" font-weight="400">[M]</text><text x="20" y="163" font-size="16" fill="#13201a" text-anchor="start" font-weight="600">Proposals</text><rect x="220" y="135" width="101" height="43" rx="6" fill="#e2f2eb" stroke="#d9cfba"/><text x="270" y="163" font-size="16" fill="#13201a" text-anchor="middle" font-weight="400">the</text><rect x="333" y="135" width="101" height="43" rx="6" fill="#e2f2eb" stroke="#d9cfba"/><text x="383" y="163" font-size="16" fill="#13201a" text-anchor="middle" font-weight="400">cat</text><rect x="446" y="135" width="101" height="43" rx="6" fill="#e2f2eb" stroke="#d9cfba"/><text x="496" y="163" font-size="16" fill="#13201a" text-anchor="middle" font-weight="400">sleeps</text><text x="20" y="238" font-size="16" fill="#13201a" text-anchor="start" font-weight="600">Commit top 1</text><rect x="220" y="210" width="101" height="43" rx="6" fill="#e2f2eb" stroke="#d9cfba"/><text x="270" y="238" font-size="16" fill="#13201a" text-anchor="middle" font-weight="400">the</text><rect x="333" y="210" width="101" height="43" rx="6" fill="#e2f2eb" stroke="#d9cfba"/><text x="383" y="238" font-size="16" fill="#13201a" text-anchor="middle" font-weight="400">cat</text><rect x="446" y="210" width="101" height="43" rx="6" fill="#f4ece0" stroke="#d9cfba" stroke-dasharray="5 3"/><text x="496" y="238" font-size="16" fill="#13201a" text-anchor="middle" font-weight="400">[M]</text><text x="20" y="313" font-size="16" fill="#13201a" text-anchor="start" font-weight="600">Allow revision</text><rect x="220" y="285" width="101" height="43" rx="6" fill="#e2f2eb" stroke="#d9cfba"/><text x="270" y="313" font-size="16" fill="#13201a" text-anchor="middle" font-weight="400">the</text><rect x="333" y="285" width="101" height="43" rx="6" fill="#f4ece0" stroke="#d9cfba" stroke-dasharray="5 3"/><text x="383" y="313" font-size="16" fill="#13201a" text-anchor="middle" font-weight="400">[M]</text><rect x="446" y="285" width="101" height="43" rx="6" fill="#f4ece0" stroke="#d9cfba" stroke-dasharray="5 3"/><text x="496" y="313" font-size="16" fill="#13201a" text-anchor="middle" font-weight="400">[M]</text><path d="M385,105 L385,132" fill="none" stroke="#087856" stroke-width="2" marker-end="url(#arrow)"/><path d="M385,180 L385,207" fill="none" stroke="#087856" stroke-width="2" marker-end="url(#arrow)"/><path d="M385,256 L385,282" fill="none" stroke="#b9461c" stroke-width="2" marker-end="url(#arrow)"/><text x="577" y="234" font-size="14" fill="#4a5a53" text-anchor="start" font-weight="400">Discard a</text><text x="577" y="252" font-size="14" fill="#4a5a53" text-anchor="start" font-weight="400">proposal</text><text x="577" y="307" font-size="14" fill="#b9461c" text-anchor="start" font-weight="400">Erase a</text><text x="577" y="325" font-size="14" fill="#b9461c" text-anchor="start" font-weight="400">commitment</text></g></svg>

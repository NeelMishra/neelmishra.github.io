<svg xmlns="http://www.w3.org/2000/svg" width="320" height="410" viewBox="0 0 320 410" role="img" aria-labelledby="title description">
<title id="title">A second harmonic can fit two daily peaks</title>
<desc id="description">The 24 constructed observations at hours 0 through 23 follow 10 minus 5 times cosine of twice the daily angle. They peak at hours 6 and 18. Least squares with an intercept and one sine/cosine pair gives the dashed horizontal line at 10. Adding the second pair gives the solid curve through every observation. Curves extend to hour 24 to show the repeating cycle; hour 24 is not an additional observation.</desc>

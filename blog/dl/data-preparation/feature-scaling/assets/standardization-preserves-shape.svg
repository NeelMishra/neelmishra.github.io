<svg xmlns="http://www.w3.org/2000/svg" width="320" height="440" viewBox="0 0 320 440" role="img" aria-labelledby="title description">
<title id="title">Standardization preserves the observed frequency pattern</title>
<desc id="description">The sample contains four zeros and one each of 1, 2, 4, and 8. Both panels use the same count scale. The top panel shows original values; the bottom uses z = (x − 1.875) / 2.666341. Standardization changes the horizontal units, while the counts and relative spacing of the observations stay the same.</desc>
<style>text{font:18px Arial,sans-serif;fill:#172c24} .heading{font-weight:700}.grid{stroke:#dce3dc;stroke-width:1} .axis{stroke:#53675b;stroke-width:1.2}</style>

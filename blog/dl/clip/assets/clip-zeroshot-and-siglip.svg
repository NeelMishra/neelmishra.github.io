<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-label="Three-panel diagram showing Zero-Shot Prompt Ensembling, the Modality Gap on the unit hypersphere, and SigLIP pairwise sigmoid loss">
  <defs>
    <style>
      .bg { fill: #fbfaf6; }
      .col { fill: #ffffff; stroke: #d6dfd9; stroke-width: 1.5; rx: 12; }
      .hdr { font: 800 14px 'Manrope', sans-serif; fill: #12352a; }
      .sub { font: 500 11.2px 'Manrope', sans-serif; fill: #4a6359; }
      .code { font: 600 11px 'JetBrains Mono', monospace; fill: #17513e; }
      .lbl { font: 700 11.5px 'Manrope', sans-serif; fill: #1f3a31; }
    </style>
  </defs>
  <rect class="bg" width="960" height="430" rx="16"/>

  <!-- Panel 1: Zero-Shot Classifier & Prompt Ensembling -->
  <rect class="col" x="20" y="20" width="295" height="390"/>
  <text x="167" y="46" text-anchor="middle" class="hdr">1. Zero-Shot Prompt Classifier</text>
  <text x="167" y="64" text-anchor="middle" class="sub">Synthesize linear weights W_ZS from class names</text>

  <rect x="38" y="82" width="258" height="72" rx="6" fill="#eef4f8" stroke="#246a8c"/>
  <text x="167" y="102" text-anchor="middle" class="lbl">80 Prompt Templates per Class c</text>
  <text x="167" y="120" text-anchor="middle" class="code">"a photo of a {dog}, a type of pet."</text>
  <text x="167" y="138" text-anchor="middle" class="code">"a close-up photo of the {dog}."</text>

  <text x="167" y="172" text-anchor="middle" class="lbl">↓ Encode &amp; Average on S^(d_e−1)</text>

  <rect x="38" y="184" width="258" height="52" rx="6" fill="#eef6f2" stroke="#17644e"/>
  <text x="167" y="205" text-anchor="middle" class="code">w_c = L2_norm( Σ_m T_e(prompt_m(c)) )</text>
  <text x="167" y="224" text-anchor="middle" class="sub">Cached once! 0 extra test-time text FLOPs</text>

  <text x="167" y="256" text-anchor="middle" class="lbl">↓ Score Any Test Image x</text>

  <rect x="38" y="268" width="258" height="58" rx="6" fill="#fbf3ea" stroke="#b86514"/>
  <text x="167" y="290" text-anchor="middle" class="code">ŷ = argmax_c ( I_e(x)^T w_c )</text>
  <text x="167" y="310" text-anchor="middle" class="sub">+3.5% to +5% ImageNet accuracy gain</text>

  <text x="38" y="355" class="sub">• Resolves polysemy ("crane" bird vs machine)</text>
  <text x="38" y="375" class="sub">• Matches pretraining caption distribution</text>
  <text x="38" y="395" class="sub">• Zero labeled training images required</text>

  <!-- Panel 2: The Modality Gap -->
  <rect class="col" x="332" y="20" width="295" height="390"/>
  <text x="479" y="46" text-anchor="middle" class="hdr">2. The Modality Gap on S^(d_e−1)</text>
  <text x="479" y="64" text-anchor="middle" class="sub">Liang et al. (2022): Disjoint Embedding Cones</text>

  <circle cx="479" cy="195" r="96" fill="#f7faf8" stroke="#8aa89b" stroke-width="1.8" stroke-dasharray="5 4"/>
  <!-- Image cone -->
  <path d="M 479 195 L 405 125 A 96 96 0 0 1 455 102 Z" fill="#d3efe2" stroke="#17644e" stroke-width="1.5"/>
  <circle cx="425" cy="132" r="4" fill="#17644e"/>
  <circle cx="442" cy="122" r="4" fill="#17644e"/>
  <circle cx="435" cy="142" r="4" fill="#17644e"/>
  <text x="395" y="102" class="lbl" fill="#17644e">Image Cone I_e</text>

  <!-- Text cone -->
  <path d="M 479 195 L 555 255 A 96 96 0 0 1 510 286 Z" fill="#dfeef7" stroke="#1f6f8b" stroke-width="1.5"/>
  <circle cx="532" cy="252" r="4" fill="#1f6f8b"/>
  <circle cx="518" cy="266" r="4" fill="#1f6f8b"/>
  <circle cx="542" cy="264" r="4" fill="#1f6f8b"/>
  <text x="498" y="306" class="lbl" fill="#1f6f8b">Text Cone T_e</text>

  <!-- Gap vector -->
  <line x1="435" y1="132" x2="530" y2="258" stroke="#c0392b" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="480" y="198" text-anchor="middle" class="code" fill="#c0392b">||Ī_e − T̄_e|| ≈ 0.82</text>

  <text x="350" y="335" class="sub">• Two random-init encoders start in narrow</text>
  <text x="350" y="352" class="sub">  cones (cos &gt; 0.95 within each modality)</text>
  <text x="350" y="372" class="sub">• Sharp temperature τ ≈ 0.01 preserves</text>
  <text x="350" y="389" class="sub">  cross-modal offset Δ while aligning ranks!</text>

  <!-- Panel 3: Softmax CLIP vs Sigmoid SigLIP -->
  <rect class="col" x="645" y="20" width="295" height="390"/>
  <text x="792" y="46" text-anchor="middle" class="hdr">3. CLIP Softmax vs. SigLIP Sigmoid</text>
  <text x="792" y="64" text-anchor="middle" class="sub">Zhai et al. (ICCV 2023) Pairwise Logistic Loss</text>

  <rect x="663" y="84" width="258" height="118" rx="8" fill="#fcf6f5" stroke="#d8b2ae"/>
  <text x="792" y="106" text-anchor="middle" class="lbl" fill="#7d2c25">CLIP (Symmetric Softmax InfoNCE)</text>
  <text x="675" y="128" class="sub">• Requires global row &amp; column partition</text>
  <text x="675" y="145" class="sub">  sums Σ_{j=1}^N exp(I_i · T_j / τ)</text>
  <text x="675" y="165" class="sub">• All-Gather across all GPUs for N = 32,768</text>
  <text x="675" y="185" class="sub">• Sensitive to batch size &amp; hard-neg spikes</text>

  <rect x="663" y="218" width="258" height="172" rx="8" fill="#eef6f2" stroke="#17644e"/>
  <text x="792" y="240" text-anchor="middle" class="lbl" fill="#17644e">SigLIP (Pairwise Binary Sigmoid)</text>
  <text x="675" y="262" class="code">z_ij = +1 (if i=j) else −1</text>
  <text x="675" y="282" class="code">L = −(1/N²) Σ_ij ln σ(z_ij(t I_i·T_j + b))</text>
  <text x="675" y="306" class="sub">• Every (i, j) pair is an independent binary</text>
  <text x="675" y="323" class="sub">  logistic classifier — no global denominator!</text>
  <text x="675" y="343" class="sub">• Learnable bias b = −10 initializes prior</text>
  <text x="675" y="360" class="sub">  toward the N²−N negative pairs at step 0</text>
  <text x="675" y="378" class="sub">• Scales cleanly from 4k to 1M batch size</text>
</svg>
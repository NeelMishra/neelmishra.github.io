<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-label="Architecture comparison of CLIP Modified ResNet with AttentionPool2d, Pre-Norm Vision Transformer (ViT), and 12-layer Causal BPE Text Transformer">
  <defs>
    <style>
      .bg { fill: #fbfaf6; }
      .col { fill: #ffffff; stroke: #d6dfd9; stroke-width: 1.5; rx: 12; }
      .hdr { font: 800 14.5px 'Manrope', sans-serif; fill: #12352a; }
      .sub { font: 600 11.5px 'Manrope', sans-serif; fill: #4a6359; }
      .blk { fill: #f3f8f5; stroke: #21816a; stroke-width: 1.3; rx: 6; }
      .blk-v { fill: #fdf5ec; stroke: #c3781f; stroke-width: 1.3; rx: 6; }
      .blk-t { fill: #eff5fa; stroke: #246a8c; stroke-width: 1.3; rx: 6; }
      .txt { font: 600 11.5px 'Manrope', sans-serif; fill: #1c362d; }
      .code { font: 600 11px 'JetBrains Mono', monospace; fill: #2c4a3e; }
    </style>
  </defs>
  <rect class="bg" width="960" height="440" rx="16"/>

  <!-- Column 1: Modified ResNet-D -->
  <rect class="col" x="20" y="20" width="292" height="400"/>
  <text x="166" y="46" text-anchor="middle" class="hdr">Option A: Modified ResNet-D</text>
  <text x="166" y="64" text-anchor="middle" class="sub">RN50, RN101, RN50x4, RN50x16, RN50x64</text>

  <rect class="blk" x="40" y="82" width="252" height="46"/>
  <text x="166" y="102" text-anchor="middle" class="txt">ResNet-D Deep Stem (3 × 3×3 Conv)</text>
  <text x="166" y="119" text-anchor="middle" class="code">Replaces 7×7 conv; AvgPool before stride-2</text>

  <rect class="blk" x="40" y="144" width="252" height="46"/>
  <text x="166" y="164" text-anchor="middle" class="txt">4 Residual Stages (Bottlenecks)</text>
  <text x="166" y="181" text-anchor="middle" class="code">Feature map X ∈ R^(H×W×C), e.g. 7×7×2048</text>

  <rect class="blk" x="40" y="206" width="252" height="62"/>
  <text x="166" y="226" text-anchor="middle" class="txt">Flatten HW + 2D Positional Embed</text>
  <text x="166" y="244" text-anchor="middle" class="code">Prepend spatial mean x̄ = (1/HW) Σ x_hw</text>
  <text x="166" y="260" text-anchor="middle" class="code">Sequence length: (HW + 1) × C</text>

  <rect class="blk" x="40" y="284" width="252" height="62"/>
  <text x="166" y="304" text-anchor="middle" class="txt">AttentionPool2d (Multi-Head QKV)</text>
  <text x="166" y="322" text-anchor="middle" class="code">Query q = W_q x̄ attends to all HW+1 tokens</text>
  <text x="166" y="338" text-anchor="middle" class="code">Out-proj W_o serves as W_i → R^(d_e)</text>

  <rect x="40" y="362" width="252" height="40" rx="6" fill="#e1f2eb"/>
  <text x="166" y="386" text-anchor="middle" class="code">L2 Normalize → I_e ∈ S^(d_e−1)</text>

  <!-- Column 2: Vision Transformer (ViT) -->
  <rect class="col" x="334" y="20" width="292" height="400"/>
  <text x="480" y="46" text-anchor="middle" class="hdr">Option B: Vision Transformer (ViT)</text>
  <text x="480" y="64" text-anchor="middle" class="sub">ViT-B/32, ViT-B/16, ViT-L/14, ViT-L/14@336px</text>

  <rect class="blk-v" x="354" y="82" width="252" height="46"/>
  <text x="480" y="102" text-anchor="middle" class="txt">Non-Overlapping Patch Conv2d</text>
  <text x="480" y="119" text-anchor="middle" class="code">N_p = (H/P)² patches (e.g. 196 or 576)</text>

  <rect class="blk-v" x="354" y="144" width="252" height="54"/>
  <text x="480" y="164" text-anchor="middle" class="txt">Prepend [CLS] + Pos Embedding</text>
  <text x="480" y="182" text-anchor="middle" class="code">CLIP adds extra LayerNorm ln_pre(Z_0)</text>
  <text x="480" y="194" text-anchor="middle" class="code">before Transformer Block 1!</text>

  <rect class="blk-v" x="354" y="214" width="252" height="54"/>
  <text x="480" y="234" text-anchor="middle" class="txt">L Pre-Norm Transformer Blocks</text>
  <text x="480" y="252" text-anchor="middle" class="code">Bidirectional MHA + QuickGELU MLP</text>
  <text x="480" y="264" text-anchor="middle" class="code">12 blocks (ViT-B) or 24 blocks (ViT-L)</text>

  <rect class="blk-v" x="354" y="284" width="252" height="62"/>
  <text x="480" y="304" text-anchor="middle" class="txt">Final [CLS] Pooling &amp; Projection</text>
  <text x="480" y="322" text-anchor="middle" class="code">I_f = ln_post(Z_L[:, 0]) ∈ R^(d_i)</text>
  <text x="480" y="338" text-anchor="middle" class="code">Linear projection I_f · W_i → R^(d_e)</text>

  <rect x="354" y="362" width="252" height="40" rx="6" fill="#faecd8"/>
  <text x="480" y="386" text-anchor="middle" class="code">L2 Normalize → I_e ∈ S^(d_e−1)</text>

  <!-- Column 3: Causal Text Transformer -->
  <rect class="col" x="648" y="20" width="292" height="400"/>
  <text x="794" y="46" text-anchor="middle" class="hdr">Text Encoder: Causal Transformer</text>
  <text x="794" y="64" text-anchor="middle" class="sub">12 Layers, Width 512/768, 8/12 Heads</text>

  <rect class="blk-t" x="668" y="82" width="252" height="46"/>
  <text x="794" y="102" text-anchor="middle" class="txt">Lowercase BPE Tokenizer (49,152)</text>
  <text x="794" y="119" text-anchor="middle" class="code">[SOS] + tokens + [EOS], max L = 77</text>

  <rect class="blk-t" x="668" y="144" width="252" height="54"/>
  <text x="794" y="164" text-anchor="middle" class="txt">Token + Learnable Pos Embedding</text>
  <text x="794" y="182" text-anchor="middle" class="code">Sequence shape: [N, 77, d_t]</text>

  <rect class="blk-t" x="668" y="214" width="252" height="54"/>
  <text x="794" y="234" text-anchor="middle" class="txt">12 Pre-Norm Causal Blocks</text>
  <text x="794" y="252" text-anchor="middle" class="code">Autoregressive triangular mask M_ij</text>
  <text x="794" y="264" text-anchor="middle" class="code">Only [EOS] attends to full prompt</text>

  <rect class="blk-t" x="668" y="284" width="252" height="62"/>
  <text x="794" y="304" text-anchor="middle" class="txt">[EOS] Token State Extraction</text>
  <text x="794" y="322" text-anchor="middle" class="code">T_f = ln_final(H_L[argmax(T)]) ∈ R^(d_t)</text>
  <text x="794" y="338" text-anchor="middle" class="code">Linear projection T_f · W_t → R^(d_e)</text>

  <rect x="668" y="362" width="252" height="40" rx="6" fill="#dfeef7"/>
  <text x="794" y="386" text-anchor="middle" class="code">L2 Normalize → T_e ∈ S^(d_e−1)</text>
</svg>
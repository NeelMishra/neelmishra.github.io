<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450" role="img" aria-label="Left: CLIP predictive vs contrastive data efficiency curves over 400M images. Right: N by N image-text dot-product matrix.">
  <defs>
    <style>
      .bg { fill: #fbfaf6; }
      .panel { fill: #ffffff; stroke: #d6dfd9; stroke-width: 1.5; rx: 12; }
      .title { font: 800 15px 'Manrope', sans-serif; fill: #12352a; }
      .lbl { font: 600 11.5px 'Manrope', sans-serif; fill: #354c43; }
      .small { font: 500 11px 'Manrope', sans-serif; fill: #51685f; }
      .code { font: 700 11.5px 'JetBrains Mono', monospace; }
    </style>
  </defs>
  <rect class="bg" width="960" height="450" rx="16"/>

  <!-- Left Panel: Data Efficiency Curve -->
  <rect class="panel" x="20" y="20" width="445" height="410"/>
  <text x="38" y="48" class="title">1. Why Contrastive Beats Generative Captioning</text>
  <text x="38" y="66" class="small">Zero-Shot ImageNet Top-1 (%) vs. Images Seen (up to 400M)</text>

  <!-- Axes -->
  <line x1="72" y1="350" x2="435" y2="350" stroke="#425a50" stroke-width="1.8"/>
  <line x1="72" y1="95" x2="72" y2="350" stroke="#425a50" stroke-width="1.8"/>
  <text x="255" y="382" text-anchor="middle" class="lbl"># of Web Image-Text Pairs Processed (Millions)</text>
  <text x="28" y="225" text-anchor="middle" class="lbl" transform="rotate(-90 28 225)">Zero-Shot ImageNet Accuracy (%)</text>

  <!-- Grid & Ticks -->
  <line x1="72" y1="290" x2="435" y2="290" stroke="#e5ece8" stroke-dasharray="4 4"/>
  <line x1="72" y1="230" x2="435" y2="230" stroke="#e5ece8" stroke-dasharray="4 4"/>
  <line x1="72" y1="170" x2="435" y2="170" stroke="#e5ece8" stroke-dasharray="4 4"/>
  <line x1="72" y1="110" x2="435" y2="110" stroke="#e5ece8" stroke-dasharray="4 4"/>
  <text x="64" y="354" text-anchor="end" class="small">0%</text>
  <text x="64" y="294" text-anchor="end" class="small">10%</text>
  <text x="64" y="234" text-anchor="end" class="small">20%</text>
  <text x="64" y="174" text-anchor="end" class="small">30%</text>
  <text x="64" y="114" text-anchor="end" class="small">40%</text>

  <text x="72" y="366" text-anchor="middle" class="small">0</text>
  <text x="162" y="366" text-anchor="middle" class="small">100M</text>
  <text x="252" y="366" text-anchor="middle" class="small">200M</text>
  <text x="342" y="366" text-anchor="middle" class="small">300M</text>
  <text x="425" y="366" text-anchor="middle" class="small">400M</text>

  <!-- Curve 1: Autoregressive Transformer LM (1x) -->
  <path d="M 72 350 Q 180 315 425 278" fill="none" stroke="#2b7bba" stroke-width="2.8"/>
  <circle cx="162" cy="326" r="3.5" fill="#2b7bba"/>
  <circle cx="280" cy="302" r="3.5" fill="#2b7bba"/>
  <circle cx="425" cy="278" r="3.5" fill="#2b7bba"/>
  <text x="275" y="322" class="code" fill="#2b7bba">Transformer LM (Exact Words, 1×)</text>

  <!-- Curve 2: Bag of Words Prediction (3x) -->
  <path d="M 72 350 Q 155 245 425 196" fill="none" stroke="#d9822b" stroke-width="2.8"/>
  <circle cx="135" cy="285" r="3.5" fill="#d9822b"/>
  <circle cx="252" cy="228" r="3.5" fill="#d9822b"/>
  <circle cx="425" cy="196" r="3.5" fill="#d9822b"/>
  <text x="232" y="212" class="code" fill="#b86514">Bag-of-Words Prediction (3× faster)</text>

  <!-- Curve 3: Contrastive BoW / CLIP (12x) -->
  <path d="M 72 350 Q 100 140 425 102" fill="none" stroke="#17644e" stroke-width="3.2"/>
  <circle cx="98" cy="260" r="4" fill="#17644e"/>
  <circle cx="162" cy="158" r="4" fill="#17644e"/>
  <circle cx="280" cy="116" r="4" fill="#17644e"/>
  <circle cx="425" cy="102" r="4" fill="#17644e"/>
  <text x="128" y="128" class="code" fill="#17644e">Contrastive CLIP (4× vs BoW = 12× total)</text>

  <!-- Efficiency arrows at ~15% accuracy -->
  <line x1="94" y1="268" x2="172" y2="268" stroke="#17644e" stroke-width="1.6"/>
  <line x1="172" y1="268" x2="365" y2="268" stroke="#b86514" stroke-width="1.6"/>
  <text x="133" y="262" text-anchor="middle" class="code" fill="#17644e">4×</text>
  <text x="268" y="262" text-anchor="middle" class="code" fill="#b86514">3×</text>

  <text x="38" y="408" class="small">Predicting exact caption words wastes capacity on syntax; contrasting paired</text>
  <text x="38" y="423" class="small">(image, text) embeddings reaches the same zero-shot accuracy 12× faster.</text>

  <!-- Right Panel: N x N Similarity Matrix -->
  <rect class="panel" x="485" y="20" width="455" height="410"/>
  <text x="503" y="48" class="title">2. Contrastive Pre-Training Over N × N Pairs</text>
  <text x="503" y="66" class="small">Maximize diagonal cosine similarities (I_i · T_i), minimize N² − N off-diagonals</text>

  <!-- Text Encoder Top -->
  <rect x="615" y="82" width="305" height="32" rx="6" fill="#eef4f8" stroke="#2b7bba" stroke-width="1.4"/>
  <text x="767" y="102" text-anchor="middle" class="lbl" fill="#1b5480">Text Encoder → Normalized T_1, T_2, …, T_N</text>

  <!-- Column headers -->
  <rect x="615" y="122" width="72" height="26" rx="4" fill="#f3f7f5" stroke="#c5d4cc"/>
  <text x="651" y="139" text-anchor="middle" class="code" fill="#14382d">T_1</text>
  <rect x="692" y="122" width="72" height="26" rx="4" fill="#f3f7f5" stroke="#c5d4cc"/>
  <text x="728" y="139" text-anchor="middle" class="code" fill="#14382d">T_2</text>
  <rect x="769" y="122" width="72" height="26" rx="4" fill="#f3f7f5" stroke="#c5d4cc"/>
  <text x="805" y="139" text-anchor="middle" class="code" fill="#14382d">T_3</text>
  <rect x="846" y="122" width="72" height="26" rx="4" fill="#f3f7f5" stroke="#c5d4cc"/>
  <text x="882" y="139" text-anchor="middle" class="code" fill="#14382d">T_N</text>

  <!-- Image Encoder Left -->
  <rect x="500" y="156" width="68" height="176" rx="6" fill="#eef6f2" stroke="#17644e" stroke-width="1.4"/>
  <text x="534" y="244" text-anchor="middle" class="lbl" fill="#17644e" transform="rotate(-90 534 244)">Image Encoder → I_1 … I_N</text>

  <!-- Row headers -->
  <rect x="574" y="156" width="35" height="38" rx="4" fill="#f3f7f5" stroke="#c5d4cc"/>
  <text x="591" y="179" text-anchor="middle" class="code" fill="#14382d">I_1</text>
  <rect x="574" y="202" width="35" height="38" rx="4" fill="#f3f7f5" stroke="#c5d4cc"/>
  <text x="591" y="225" text-anchor="middle" class="code" fill="#14382d">I_2</text>
  <rect x="574" y="248" width="35" height="38" rx="4" fill="#f3f7f5" stroke="#c5d4cc"/>
  <text x="591" y="271" text-anchor="middle" class="code" fill="#14382d">I_3</text>
  <rect x="574" y="294" width="35" height="38" rx="4" fill="#f3f7f5" stroke="#c5d4cc"/>
  <text x="591" y="317" text-anchor="middle" class="code" fill="#14382d">I_N</text>

  <!-- 4x4 Matrix cells -->
  <!-- Row 1 -->
  <rect x="615" y="156" width="72" height="38" rx="5" fill="#d3efe2" stroke="#17644e" stroke-width="2"/>
  <text x="651" y="179" text-anchor="middle" class="code" fill="#0f513c">I_1 · T_1</text>
  <rect x="692" y="156" width="72" height="38" rx="5" fill="#fcf6f5" stroke="#e2cbc8"/>
  <text x="728" y="179" text-anchor="middle" class="code" fill="#8c4640">I_1 · T_2</text>
  <rect x="769" y="156" width="72" height="38" rx="5" fill="#fcf6f5" stroke="#e2cbc8"/>
  <text x="805" y="179" text-anchor="middle" class="code" fill="#8c4640">I_1 · T_3</text>
  <rect x="846" y="156" width="72" height="38" rx="5" fill="#fcf6f5" stroke="#e2cbc8"/>
  <text x="882" y="179" text-anchor="middle" class="code" fill="#8c4640">I_1 · T_N</text>

  <!-- Row 2 -->
  <rect x="615" y="202" width="72" height="38" rx="5" fill="#fcf6f5" stroke="#e2cbc8"/>
  <text x="651" y="225" text-anchor="middle" class="code" fill="#8c4640">I_2 · T_1</text>
  <rect x="692" y="202" width="72" height="38" rx="5" fill="#d3efe2" stroke="#17644e" stroke-width="2"/>
  <text x="728" y="225" text-anchor="middle" class="code" fill="#0f513c">I_2 · T_2</text>
  <rect x="769" y="202" width="72" height="38" rx="5" fill="#fcf6f5" stroke="#e2cbc8"/>
  <text x="805" y="225" text-anchor="middle" class="code" fill="#8c4640">I_2 · T_3</text>
  <rect x="846" y="202" width="72" height="38" rx="5" fill="#fcf6f5" stroke="#e2cbc8"/>
  <text x="882" y="225" text-anchor="middle" class="code" fill="#8c4640">I_2 · T_N</text>

  <!-- Row 3 -->
  <rect x="615" y="248" width="72" height="38" rx="5" fill="#fcf6f5" stroke="#e2cbc8"/>
  <text x="651" y="271" text-anchor="middle" class="code" fill="#8c4640">I_3 · T_1</text>
  <rect x="692" y="248" width="72" height="38" rx="5" fill="#fcf6f5" stroke="#e2cbc8"/>
  <text x="728" y="271" text-anchor="middle" class="code" fill="#8c4640">I_3 · T_2</text>
  <rect x="769" y="248" width="72" height="38" rx="5" fill="#d3efe2" stroke="#17644e" stroke-width="2"/>
  <text x="805" y="271" text-anchor="middle" class="code" fill="#0f513c">I_3 · T_3</text>
  <rect x="846" y="248" width="72" height="38" rx="5" fill="#fcf6f5" stroke="#e2cbc8"/>
  <text x="882" y="271" text-anchor="middle" class="code" fill="#8c4640">I_3 · T_N</text>

  <!-- Row N -->
  <rect x="615" y="294" width="72" height="38" rx="5" fill="#fcf6f5" stroke="#e2cbc8"/>
  <text x="651" y="317" text-anchor="middle" class="code" fill="#8c4640">I_N · T_1</text>
  <rect x="692" y="294" width="72" height="38" rx="5" fill="#fcf6f5" stroke="#e2cbc8"/>
  <text x="728" y="317" text-anchor="middle" class="code" fill="#8c4640">I_N · T_2</text>
  <rect x="769" y="294" width="72" height="38" rx="5" fill="#fcf6f5" stroke="#e2cbc8"/>
  <text x="805" y="317" text-anchor="middle" class="code" fill="#8c4640">I_N · T_3</text>
  <rect x="846" y="294" width="72" height="38" rx="5" fill="#d3efe2" stroke="#17644e" stroke-width="2"/>
  <text x="882" y="317" text-anchor="middle" class="code" fill="#0f513c">I_N · T_N</text>

  <!-- Example callout -->
  <rect x="500" y="348" width="420" height="68" rx="8" fill="#f7faf8" stroke="#c8dbd2"/>
  <text x="514" y="368" class="lbl">Example pair i = 1: Image_1 = [Aussie pup photo], Text_1 = "Pepper the aussie pup"</text>
  <text x="514" y="388" class="small">• Row i softmax (I → T): Which of the N texts matches Image i? (Target = col i)</text>
  <text x="514" y="405" class="small">• Col j softmax (T → I): Which of the N images matches Text j? (Target = row j)</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-label="Tensor shape pipeline tracing CLIP Figure 3 pseudocode from raw images and texts to symmetric cross-entropy loss">
  <defs>
    <style>
      .bg { fill: #fbfaf6; }
      .box-i { fill: #eef6f2; stroke: #17644e; stroke-width: 1.6; rx: 8; }
      .box-t { fill: #eef4f8; stroke: #1f6f8b; stroke-width: 1.6; rx: 8; }
      .box-m { fill: #fbf3ea; stroke: #b86514; stroke-width: 1.8; rx: 10; }
      .box-l { fill: #f4effa; stroke: #6b3fa0; stroke-width: 1.8; rx: 10; }
      .title { font: 800 16px 'Manrope', sans-serif; fill: #12352a; }
      .step { font: 800 12.5px 'Manrope', sans-serif; fill: #14382d; }
      .code { font: 700 11.5px 'JetBrains Mono', monospace; fill: #1b3a30; }
      .dim { font: 600 11px 'JetBrains Mono', monospace; fill: #526960; }
    </style>
  </defs>
  <rect class="bg" width="960" height="440" rx="16"/>
  <text x="28" y="36" class="title">CLIP Figure 3 Tensor &amp; Dimension Pipeline (Minibatch Size N = 32,768)</text>

  <!-- Image Branch (Top) -->
  <rect class="box-i" x="28" y="60" width="145" height="72"/>
  <text x="100" y="84" text-anchor="middle" class="step">1. Aligned Images</text>
  <text x="100" y="103" text-anchor="middle" class="code">I</text>
  <text x="100" y="120" text-anchor="middle" class="dim">[N, H, W, C]</text>

  <text x="186" y="100" text-anchor="middle" class="step">→</text>

  <rect class="box-i" x="200" y="60" width="165" height="72"/>
  <text x="282" y="84" text-anchor="middle" class="step">2. Image Backbone</text>
  <text x="282" y="103" text-anchor="middle" class="code">I_f = img_enc(I)</text>
  <text x="282" y="120" text-anchor="middle" class="dim">[N, d_i] (e.g. 768/2048)</text>

  <text x="378" y="100" text-anchor="middle" class="step">→</text>

  <rect class="box-i" x="392" y="60" width="175" height="72"/>
  <text x="479" y="84" text-anchor="middle" class="step">3. Linear Projection</text>
  <text x="479" y="103" text-anchor="middle" class="code">np.dot(I_f, W_i)</text>
  <text x="479" y="120" text-anchor="middle" class="dim">W_i: [d_i, d_e] → [N, d_e]</text>

  <text x="580" y="100" text-anchor="middle" class="step">→</text>

  <rect class="box-i" x="594" y="60" width="175" height="72"/>
  <text x="681" y="84" text-anchor="middle" class="step">4. Unit Hypersphere</text>
  <text x="681" y="103" text-anchor="middle" class="code">I_e = l2_norm(..., 1)</text>
  <text x="681" y="120" text-anchor="middle" class="dim">||I_e[i]||_2 = 1 [N, d_e]</text>

  <!-- Text Branch (Middle) -->
  <rect class="box-t" x="28" y="162" width="145" height="72"/>
  <text x="100" y="186" text-anchor="middle" class="step">1. Aligned Texts</text>
  <text x="100" y="205" text-anchor="middle" class="code">T</text>
  <text x="100" y="222" text-anchor="middle" class="dim">[N, L=77]</text>

  <text x="186" y="202" text-anchor="middle" class="step">→</text>

  <rect class="box-t" x="200" y="162" width="165" height="72"/>
  <text x="282" y="186" text-anchor="middle" class="step">2. Text Transformer</text>
  <text x="282" y="205" text-anchor="middle" class="code">T_f = txt_enc(T)</text>
  <text x="282" y="222" text-anchor="middle" class="dim">[N, d_t] (e.g. 512)</text>

  <text x="378" y="202" text-anchor="middle" class="step">→</text>

  <rect class="box-t" x="392" y="162" width="175" height="72"/>
  <text x="479" y="186" text-anchor="middle" class="step">3. Linear Projection</text>
  <text x="479" y="205" text-anchor="middle" class="code">np.dot(T_f, W_t)</text>
  <text x="479" y="222" text-anchor="middle" class="dim">W_t: [d_t, d_e] → [N, d_e]</text>

  <text x="580" y="202" text-anchor="middle" class="step">→</text>

  <rect class="box-t" x="594" y="162" width="175" height="72"/>
  <text x="681" y="186" text-anchor="middle" class="step">4. Unit Hypersphere</text>
  <text x="681" y="205" text-anchor="middle" class="code">T_e = l2_norm(..., 1)</text>
  <text x="681" y="222" text-anchor="middle" class="dim">||T_e[j]||_2 = 1 [N, d_e]</text>

  <!-- Convergence to Logits & Loss (Bottom) -->
  <rect class="box-m" x="28" y="268" width="435" height="145"/>
  <text x="48" y="294" class="step">5. Scaled Pairwise Cosine Logits [N, N]</text>
  <text x="48" y="318" class="code">logits = np.dot(I_e, T_e.T) * np.exp(t)</text>
  <text x="48" y="342" class="dim">• Because ||I_e||=||T_e||=1, I_e @ T_e.T = cos(θ_ij) ∈ [−1, +1]</text>
  <text x="48" y="362" class="dim">• Learnable log-scale t = ln(1/τ), init τ=0.07 (exp(t) ≈ 14.29)</text>
  <text x="48" y="382" class="dim">• Clamped at exp(t) ≤ 100 (τ ≥ 0.01) to prevent logit overflow</text>

  <text x="480" y="342" text-anchor="middle" class="step">→</text>

  <rect class="box-l" x="498" y="268" width="434" height="145"/>
  <text x="518" y="294" class="step">6. Ground-Truth Diagonal &amp; Symmetric Loss</text>
  <text x="518" y="318" class="code">labels = np.arange(n)  # [0, 1, 2, ..., n-1]</text>
  <text x="518" y="340" class="code">loss_i = cross_entropy_loss(logits, labels, axis=0)</text>
  <text x="518" y="360" class="code">loss_t = cross_entropy_loss(logits, labels, axis=1)</text>
  <text x="518" y="382" class="code">loss   = (loss_i + loss_t) / 2</text>
  <text x="518" y="402" class="dim">• Contrasts n diagonal positives (1) vs n²−n off-diagonal negatives (0)</text>
</svg>
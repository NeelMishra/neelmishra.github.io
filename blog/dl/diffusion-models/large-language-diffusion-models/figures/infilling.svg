<svg xmlns="http://www.w3.org/2000/svg" width="720" height="337" viewBox="0 0 720 337" role="img" aria-labelledby="title desc"><title id="title">Fixed context and editable positions</title><desc id="desc">A fixed prefix and suffix surround two editable positions. New and York are revealed in the middle while every context token remains unchanged.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs><g font-family="system-ui, sans-serif"><text x="20" y="28" font-size="21" fill="#13201a" text-anchor="start" font-weight="700">Generate only the editable span</text><rect x="27" y="80" width="125" height="43" rx="6" fill="#e2f2eb" stroke="#087856"/><text x="89.5" y="108" font-size="16" fill="#13201a" text-anchor="middle" font-weight="600">sent</text><rect x="166" y="80" width="125" height="43" rx="6" fill="#e2f2eb" stroke="#087856"/><text x="228.5" y="108" font-size="16" fill="#13201a" text-anchor="middle" font-weight="600">to</text><rect x="305" y="80" width="125" height="43" rx="6" fill="#fff1df" stroke="#b9461c" stroke-dasharray="5 3"/><text x="367.5" y="108" font-size="16" fill="#13201a" text-anchor="middle" font-weight="600">[M]</text><rect x="444" y="80" width="125" height="43" rx="6" fill="#fff1df" stroke="#b9461c" stroke-dasharray="5 3"/><text x="506.5" y="108" font-size="16" fill="#13201a" text-anchor="middle" font-weight="600">[M]</text><rect x="583" y="80" width="125" height="43" rx="6" fill="#e2f2eb" stroke="#087856"/><text x="645.5" y="108" font-size="16" fill="#13201a" text-anchor="middle" font-weight="600">yesterday</text><rect x="27" y="155" width="125" height="43" rx="6" fill="#e2f2eb" stroke="#087856"/><text x="89.5" y="183" font-size="16" fill="#13201a" text-anchor="middle" font-weight="600">sent</text><rect x="166" y="155" width="125" height="43" rx="6" fill="#e2f2eb" stroke="#087856"/><text x="228.5" y="183" font-size="16" fill="#13201a" text-anchor="middle" font-weight="600">to</text><rect x="305" y="155" width="125" height="43" rx="6" fill="#fff1df" stroke="#b9461c"/><text x="367.5" y="183" font-size="16" fill="#13201a" text-anchor="middle" font-weight="600">New</text><rect x="444" y="155" width="125" height="43" rx="6" fill="#fff1df" stroke="#b9461c" stroke-dasharray="5 3"/><text x="506.5" y="183" font-size="16" fill="#13201a" text-anchor="middle" font-weight="600">[M]</text><rect x="583" y="155" width="125" height="43" rx="6" fill="#e2f2eb" stroke="#087856"/><text x="645.5" y="183" font-size="16" fill="#13201a" text-anchor="middle" font-weight="600">yesterday</text><rect x="27" y="230" width="125" height="43" rx="6" fill="#e2f2eb" stroke="#087856"/><text x="89.5" y="258" font-size="16" fill="#13201a" text-anchor="middle" font-weight="600">sent</text><rect x="166" y="230" width="125" height="43" rx="6" fill="#e2f2eb" stroke="#087856"/><text x="228.5" y="258" font-size="16" fill="#13201a" text-anchor="middle" font-weight="600">to</text><rect x="305" y="230" width="125" height="43" rx="6" fill="#fff1df" stroke="#b9461c"/><text x="367.5" y="258" font-size="16" fill="#13201a" text-anchor="middle" font-weight="600">New</text><rect x="444" y="230" width="125" height="43" rx="6" fill="#fff1df" stroke="#b9461c"/><text x="506.5" y="258" font-size="16" fill="#13201a" text-anchor="middle" font-weight="600">York</text><rect x="583" y="230" width="125" height="43" rx="6" fill="#e2f2eb" stroke="#087856"/><text x="645.5" y="258" font-size="16" fill="#13201a" text-anchor="middle" font-weight="600">yesterday</text><text x="156" y="59" font-size="15" fill="#087856" text-anchor="middle" font-weight="400">fixed prefix</text><text x="442" y="59" font-size="15" fill="#b9461c" text-anchor="middle" font-weight="400">editable</text><text x="645" y="59" font-size="15" fill="#087856" text-anchor="middle" font-weight="400">fixed suffix</text><text x="360" y="313" font-size="16" fill="#4a5a53" t
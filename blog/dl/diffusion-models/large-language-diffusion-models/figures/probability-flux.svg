<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350" role="img" aria-labelledby="title desc"><title id="title">Discrete probability conservation</title><desc id="desc">Probability enters state B from A and leaves B toward C. Across all states each transfer appears once as incoming and once as outgoing.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs><g font-family="system-ui, sans-serif"><text x="20" y="28" font-size="21" fill="#13201a" text-anchor="start" font-weight="700">Probability flux = source mass × jump rate</text><rect x="60" y="130" width="130" height="58" rx="6" fill="#e2f2eb" stroke="#d9cfba"/><text x="125" y="166" font-size="18" fill="#13201a" text-anchor="middle" font-weight="700">state A</text><rect x="300" y="60" width="130" height="58" rx="6" fill="#e2f2eb" stroke="#d9cfba"/><text x="365" y="96" font-size="18" fill="#13201a" text-anchor="middle" font-weight="700">state B</text><rect x="530" y="160" width="130" height="58" rx="6" fill="#e2f2eb" stroke="#d9cfba"/><text x="595" y="196" font-size="18" fill="#13201a" text-anchor="middle" font-weight="700">state C</text><path d="M195,141 L295,102" fill="none" stroke="#087856" stroke-width="2" marker-end="url(#arrow)"/><text x="205" y="106" font-size="14" fill="#087856" text-anchor="start" font-weight="400">p(A) R(A,B)</text><path d="M433,100 L546,154" fill="none" stroke="#087856" stroke-width="2" marker-end="url(#arrow)"/><text x="450" y="105" font-size="14" fill="#087856" text-anchor="start" font-weight="400">p(B) R(B,C)</text><path d="M526,206 L194,188" fill="none" stroke="#b9461c" stroke-width="2" marker-end="url(#arrow)"/><text x="322" y="229" font-size="14" fill="#b9461c" text-anchor="start" font-weight="400">p(C) R(C,A)</text><text x="360" y="293" font-size="18" fill="#13201a" text-anchor="middle" font-weight="600">d p(B) / ds = incoming flux − outgoing flux</text><text x="360" y="327" font-size="16" fill="#4a5a53" text-anchor="middle" font-weight="400">Summed over all states, every transfer cancels.</text></g></svg>

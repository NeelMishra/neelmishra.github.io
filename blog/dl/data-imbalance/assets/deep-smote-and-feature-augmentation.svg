<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" font-family="Manrope, -apple-system, BlinkMacSystemFont, sans-serif">
  <rect width="900" height="360" rx="14" fill="#fffdf9" stroke="#e2d9c8" stroke-width="1.5"/>

  <!-- Left Panel: Off-Manifold Input Chord vs DeepSMOTE Geodesic Latent Synthesis -->
  <g transform="translate(24, 20)">
    <rect width="415" height="320" rx="10" fill="#f8f4ec" stroke="#dcd1be" stroke-width="1"/>
    <text x="16" y="26" font-size="13.5" font-weight="800" fill="#1e2420">1. Input-Space Chord vs. DeepSMOTE Latent Synthesis</text>
    <text x="16" y="44" font-size="11" fill="#5a655e">Pixel chord (1-u)x_i + u x_j leaves curved manifold M; E_φ linearizes M</text>

    <!-- Curved Image Manifold M -->
    <path d="M 38 190 Q 130 68 232 188" fill="none" stroke="#126650" stroke-width="3.2"/>
    <text x="58" y="96" font-size="11" font-weight="800" fill="#126650">Curved Data Manifold M ⊂ ℝ^D</text>

    <!-- Endpoints x_i and x_j on M -->
    <circle cx="55" cy="170" r="6.5" fill="#126650"/>
    <text x="28" y="168" font-size="10.5" font-weight="800" fill="#126650">x_i</text>
    <circle cx="215" cy="170" r="6.5" fill="#126650"/>
    <text x="224" y="168" font-size="10.5" font-weight="800" fill="#126650">x_nn</text>

    <!-- Off-manifold chord in input space -->
    <line x1="55" y1="170" x2="215" y2="170" stroke="#b42318" stroke-width="2" stroke-dasharray="5,3"/>
    <circle cx="135" cy="170" r="6" fill="#b42318"/>
    <text x="86" y="188" font-size="10.2" font-weight="700" fill="#b42318">x̃_raw (off-manifold ghost)</text>

    <!-- Decoded DeepSMOTE point on manifold crest -->
    <circle cx="135" cy="129" r="6.5" fill="#d97706" stroke="#1e2420" stroke-width="1.2"/>
    <text x="90" y="118" font-size="10.5" font-weight="800" fill="#b45309">x̃ = G_ψ(z̃) ∈ M</text>

    <!-- Arrows to Latent Bottleneck Box -->
    <rect x="260" y="84" width="138" height="148" rx="8" fill="#fffaf0" stroke="#c8bca6" stroke-width="1.2"/>
    <text x="272" y="104" font-size="11" font-weight="800" fill="#315e9a">Latent Space ℝ^p</text>
    <text x="272" y="119" font-size="9.8" fill="#5a655e">z = E_φ(x) (convex)</text>

    <circle cx="288" cy="162" r="5.5" fill="#126650"/>
    <text x="278" y="180" font-size="9.8" font-weight="700" fill="#126650">z_i</text>
    <circle cx="368" cy="162" r="5.5" fill="#126650"/>
    <text x="355" y="180" font-size="9.8" font-weight="700" fill="#126650">z_nn</text>
    <line x1="288" y1="162" x2="368" y2="162" stroke="#d97706" stroke-width="2.2"/>
    <polygon points="328,155 335,162 328,169 321,162" fill="#f59e0b" stroke="#1e2420" stroke-width="1"/>
    <text x="285" y="205" font-size="10" font-weight="700" fill="#b45309">z̃ = (1-u)z_i + u z_nn</text>

    <!-- Bottom callout -->
    <rect x="14" y="252" width="387" height="54" rx="6" fill="#fffaf0" stroke="#e5d5b5"/>
    <text x="24" y="270" font-size="10.8" font-weight="700" fill="#1e2420">Why DeepSMOTE beats cGANs at n_tail = 10:</text>
    <text x="24" y="286" font-size="10.2" fill="#49544d">Autoencoder (E_φ, G_ψ) trains on ALL N samples (no GAN mode collapse),</text>
    <text x="24" y="300" font-size="10.2" fill="#49544d">then runs k-NN SMOTE inside ℝ^p before decoding G_ψ(z̃) back onto M.</text>
  </g>

  <!-- Right Panel: Head-to-Tail Covariance Transfer & ISDA Closed-Form Limit -->
  <g transform="translate(461, 20)">
    <rect width="415" height="320" rx="10" fill="#f8f4ec" stroke="#dcd1be" stroke-width="1"/>
    <text x="16" y="26" font-size="13.5" font-weight="800" fill="#1e2420">2. Head-to-Tail Covariance Transfer &amp; ISDA</text>
    <text x="16" y="44" font-size="11" fill="#5a655e">n_tail = 5 spans rank ≤ 4; borrow variance directions Σ_head from head class</text>

    <!-- Head Class Ellipse -->
    <g transform="translate(115, 136)">
      <ellipse cx="0" cy="0" rx="76" ry="38" transform="rotate(-24)" fill="#315e9a" fill-opacity="0.14" stroke="#315e9a" stroke-width="2"/>
      <circle cx="-35" cy="14" r="3.5" fill="#315e9a"/>
      <circle cx="-18" cy="-8" r="3.5" fill="#315e9a"/>
      <circle cx="8" cy="12" r="3.5" fill="#315e9a"/>
      <circle cx="36" cy="-16" r="3.5" fill="#315e9a"/>
      <circle cx="50" cy="-22" r="3.5" fill="#315e9a"/>
      <circle cx="-48" cy="24" r="3.5" fill="#315e9a"/>
      <circle cx="0" cy="0" r="5" fill="#1e2420"/>
      <text x="-66" y="-48" font-size="10.8" font-weight="800" fill="#315e9a">Head Class (Full-Rank Σ_head)</text>
    </g>

    <!-- Transfer Arrow -->
    <path d="M 192 122 C 220 96, 248 96, 274 120" fill="none" stroke="#a45113" stroke-width="2.2" stroke-dasharray="4,3"/>
    <text x="190" y="94" font-size="10.2" font-weight="800" fill="#a45113">Transfer Σ_cal = αΣ_tail + (1-α)Σ_head</text>

    <!-- Tail Class Degenerate Line vs Calibrated Ellipse -->
    <g transform="translate(312, 148)">
      <!-- Calibrated covariance ellipse -->
      <ellipse cx="0" cy="0" rx="68" ry="34" transform="rotate(-24)" fill="#126650" fill-opacity="0.15" stroke="#126650" stroke-width="2" stroke-dasharray="5,3"/>
      <!-- Degenerate 1D SMOTE line -->
      <line x1="-38" y1="8" x2="38" y2="-8" stroke="#b42318" stroke-width="2.4"/>
      <circle cx="-32" cy="7" r="4.5" fill="#b42318"/>
      <circle cx="4" cy="-1" r="4.5" fill="#b42318"/>
      <circle cx="34" cy="-7" r="4.5" fill="#b42318"/>
      <text x="-64" y="54" font-size="10.2" font-weight="700" fill="#b42318">SMOTE: 1D line segment only</text>
      <text x="-64" y="69" font-size="10.2" font-weight="800" fill="#126650">Calibrated: 2D semantic cloud</text>
    </g>

    <!-- Bottom ISDA equation summary -->
    <rect x="14" y="242" width="387" height="64" rx="6" fill="#fffaf0" stroke="#e5d5b5"/>
    <text x="24" y="261" font-size="10.8" font-weight="800" fill="#1e2420">Infinite-Sample Limit (ISDA, M → ∞):</text>
    <text x="24" y="279" font-size="10.3" fill="#49544d">Averaging CE over h̃ ~ N(h_i, λ Σ_y) via the Gaussian MGF yields an exact</text>
    <text x="24" y="295" font-size="10.3" font-weight="700" fill="#126650">closed-form logit shift:  z̃_k = z_k + (λ/2) (w_k - w_y)^T Σ_y (w_k - w_y)</text>
  </g>
</svg>

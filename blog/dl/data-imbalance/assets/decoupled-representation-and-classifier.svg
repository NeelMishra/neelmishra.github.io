<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" font-family="Manrope, sans-serif">
  <rect width="900" height="360" rx="14" fill="#0f172a"/>
  <rect x="16" y="16" width="424" height="328" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <rect x="460" y="16" width="424" height="328" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>

  <!-- Left panel: Why Classifier Norms ||w_k||_2 Track Class Frequency n_k -->
  <text x="36" y="46" fill="#f8fafc" font-size="15" font-weight="700">1. Classifier Weight Norms ||w_k||₂ Track Frequency</text>
  <text x="36" y="68" fill="#94a3b8" font-size="12">Standard training grows large ||w_head||₂ and shrinks ||w_tail||₂</text>

  <rect x="36" y="84" width="384" height="156" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="54" y="112" fill="#e2e8f0" font-size="12" font-weight="700">Before τ-Normalization (τ = 0):</text>
  <rect x="54" y="120" width="240" height="16" rx="3" fill="#38bdf8"/>
  <text x="302" y="133" fill="#7dd3fc" font-size="12" font-weight="700">||w₁|| = 4.0 (Head)</text>
  <rect x="54" y="142" width="60" height="16" rx="3" fill="#f97316"/>
  <text x="122" y="155" fill="#fdba74" font-size="12" font-weight="700">||w₂|| = 1.0 (Tail)</text>

  <text x="54" y="182" fill="#e2e8f0" font-size="12" font-weight="700">After τ-Normalization w̃_k = w_k / ||w_k||^τ (τ = 0.5):</text>
  <rect x="54" y="190" width="120" height="16" rx="3" fill="#4ade80"/>
  <text x="182" y="203" fill="#4ade80" font-size="12" font-weight="700">||w̃₁|| = 4.0 / 4^0.5 = 2.0</text>
  <rect x="54" y="212" width="60" height="16" rx="3" fill="#f97316"/>
  <text x="122" y="225" fill="#fdba74" font-size="12" font-weight="700">||w̃₂|| = 1.0 / 1^0.5 = 1.0</text>

  <text x="36" y="264" fill="#e2e8f0" font-size="12" font-weight="600">Since z_k = ||w_k|| · ||f(x)|| cos θ_k:</text>
  <text x="36" y="286" fill="#7dd3fc" font-size="12">• A 4× larger ||w₁|| lets Head win even when cos θ₂ &gt; cos θ₁!</text>
  <text x="36" y="306" fill="#4ade80" font-size="12">• τ = 1 gives pure cosine similarity (||w̃_k|| = 1 for all classes).</text>
  <text x="36" y="326" fill="#cbd5e1" font-size="12">• τ ∈ [0.5, 0.7] equalizes norms without zeroing out confidence.</text>

  <!-- Right panel: Two-Stage Decoupled Pipeline (Kang et al., ICLR 2020) -->
  <text x="480" y="46" fill="#f8fafc" font-size="15" font-weight="700">2. Decoupled Two-Stage Pipeline (Kang et al.)</text>
  <text x="480" y="68" fill="#94a3b8" font-size="12">Stage 1 learns features at q = 1; Stage 2 fixes the classifier head</text>

  <!-- Stage 1 Box -->
  <rect x="480" y="86" width="384" height="72" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="498" y="110" fill="#7dd3fc" font-size="13" font-weight="700">Stage 1: Representation Learning (q = 1 Instance-Balanced)</text>
  <text x="498" y="130" fill="#e2e8f0" font-size="12">Train backbone f_θ(x) + head W with standard Cross-Entropy.</text>
  <text x="498" y="148" fill="#94a3b8" font-size="11">Result: clean feature clusters f_θ(x), but skewed head norms ||w_k||₂.</text>

  <!-- Arrow down -->
  <line x1="672" y1="158" x2="672" y2="178" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="672,184 666,174 678,174" fill="#94a3b8"/>

  <!-- Stage 2 Box -->
  <rect x="480" y="186" width="384" height="92" rx="8" fill="#0f172a" stroke="#4ade80" stroke-width="1.5"/>
  <text x="498" y="210" fill="#4ade80" font-size="13" font-weight="700">Stage 2: Freeze Backbone f_θ(x), Calibrate Head Only</text>
  <text x="498" y="232" fill="#e2e8f0" font-size="12">• cRT: re-init W and train head for 10 epochs with q = 0 balanced sampler.</text>
  <text x="498" y="252" fill="#fde047" font-size="12">• τ-Norm: rescale w̃_k = w_k / ||w_k||^τ (zero extra training steps!).</text>
  <text x="498" y="270" fill="#d8b4fe" font-size="12">• NCM: classify by cosine distance to class feature centroids μ_k.</text>

  <text x="480" y="304" fill="#cbd5e1" font-size="12">Key insight: class-balanced sampling (q = 0) during Stage 1</text>
  <text x="480" y="324" fill="#cbd5e1" font-size="12">degrades backbone features f_θ(x) via tail duplicate overfitting.</text>
</svg>

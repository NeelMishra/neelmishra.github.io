<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" font-family="Manrope, sans-serif">
  <rect width="900" height="360" rx="14" fill="#0f172a"/>
  <rect x="16" y="16" width="424" height="328" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <rect x="460" y="16" width="424" height="328" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>

  <!-- Left panel: Effective Number of Samples E_n = (1 - beta^n)/(1 - beta) -->
  <text x="36" y="46" fill="#f8fafc" font-size="15" font-weight="700">1. Effective Number of Samples E_n = (1 − β^n)/(1 − β)</text>
  <text x="36" y="68" fill="#94a3b8" font-size="12">Overlapping data volume saturates at 1/(1 − β) instead of growing linearly</text>

  <!-- Overlapping circles illustration -->
  <rect x="36" y="84" width="384" height="125" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="52" y="108" fill="#fdba74" font-size="12" font-weight="700">Tail (n = 3): Low overlap → E_n ≈ n</text>
  <circle cx="90" cy="148" r="24" fill="#f97316" fill-opacity="0.35" stroke="#f97316" stroke-width="2"/>
  <circle cx="132" cy="148" r="24" fill="#f97316" fill-opacity="0.35" stroke="#f97316" stroke-width="2"/>
  <circle cx="172" cy="148" r="24" fill="#f97316" fill-opacity="0.35" stroke="#f97316" stroke-width="2"/>

  <text x="235" y="108" fill="#7dd3fc" font-size="12" font-weight="700">Head (n = 1000): Heavy overlap</text>
  <circle cx="275" cy="148" r="26" fill="#38bdf8" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="290" cy="144" r="26" fill="#38bdf8" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="305" cy="152" r="26" fill="#38bdf8" stroke-opacity="0.9" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="320" cy="146" r="26" fill="#38bdf8" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="335" cy="150" r="26" fill="#38bdf8" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="348" cy="145" r="26" fill="#38bdf8" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.5"/>

  <text x="36" y="236" fill="#e2e8f0" font-size="12" font-weight="600">At β = 0.999 on n_head = 10,000 vs. n_tail = 10:</text>
  <text x="36" y="258" fill="#f43f5e" font-size="12">• Raw Inverse 1/n ratio: 10,000 / 10 = 1000× (explodes gradients!)</text>
  <text x="36" y="280" fill="#4ade80" font-size="12">• Effective Number E_10000 = 999.95, E_10 = 9.955</text>
  <text x="36" y="302" fill="#4ade80" font-size="12">• Class-Balanced weight ratio (1/E_10)/(1/E_10000) = 100.4× (stable)</text>
  <text x="36" y="324" fill="#94a3b8" font-size="12">• Limits: β → 0 gives uniform w = 1; β → 1 gives raw inverse 1/n.</text>

  <!-- Right panel: Focal Loss Modulation (1 - p_t)^gamma -->
  <text x="480" y="46" fill="#f8fafc" font-size="15" font-weight="700">2. Focal Loss Modulation Factor (1 − p_t)^γ</text>
  <text x="480" y="68" fill="#94a3b8" font-size="12">Suppressing easy negatives (p_t → 1) while keeping hard examples (p_t ≪ 1)</text>

  <rect x="480" y="84" width="384" height="165" rx="8" fill="#0f172a" stroke="#334155"/>
  <!-- Axes -->
  <line x1="520" y1="224" x2="840" y2="224" stroke="#64748b" stroke-width="1.5"/>
  <line x1="520" y1="100" x2="520" y2="224" stroke="#64748b" stroke-width="1.5"/>
  <text x="512" y="106" fill="#94a3b8" font-size="11" text-anchor="end">Loss</text>
  <text x="520" y="240" fill="#94a3b8" font-size="11" text-anchor="middle">0.0</text>
  <text x="680" y="240" fill="#94a3b8" font-size="11" text-anchor="middle">p_t = 0.5</text>
  <text x="840" y="240" fill="#94a3b8" font-size="11" text-anchor="middle">1.0</text>

  <!-- Standard CE curve (gamma = 0) -->
  <path d="M 526 102 Q 620 168 840 224" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="645" y="148" fill="#7dd3fc" font-size="12" font-weight="700">γ = 0 (Standard CE)</text>

  <!-- Focal Loss curve (gamma = 2) -->
  <path d="M 526 105 Q 585 212 840 224" fill="none" stroke="#f97316" stroke-width="3"/>
  <text x="645" y="208" fill="#fdba74" font-size="12" font-weight="700">γ = 2 (Focal Loss)</text>

  <text x="480" y="274" fill="#e2e8f0" font-size="12" font-weight="600">How (1 − p_t)² rescales each example at γ = 2:</text>
  <text x="480" y="296" fill="#7dd3fc" font-size="12">• Easy negative (p_t = 0.99): (1 − 0.99)² = 0.0001 (10,000× smaller!)</text>
  <text x="480" y="316" fill="#fdba74" font-size="12">• Hard minority (p_t = 0.10): (1 − 0.10)² = 0.8100 (8,100× larger relative weight)</text>
</svg>

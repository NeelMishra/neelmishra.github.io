<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400" role="img" aria-label="Left: Effective Number of Samples volume overlap diagram comparing tail class n=3 with head class n=10,000. Right: Exact plot of Standard Cross-Entropy versus Focal Loss (gamma=2) across predicted probability p_t.">
  <rect width="920" height="400" rx="14" fill="#fffaf2" stroke="#dedbd2" stroke-width="1.5"/>

  <!-- Left Card: Effective Number of Samples -->
  <rect x="18" y="18" width="432" height="364" rx="10" fill="#ffffff" stroke="#d8d4c8" stroke-width="1.5"/>
  <text x="36" y="46" fill="#173d35" font-family="Manrope, system-ui, sans-serif" font-size="15" font-weight="800">1. Effective Number of Samples: Eₙ = (1 − βⁿ) / (1 − β)</text>
  <text x="36" y="66" fill="#52605a" font-family="Manrope, system-ui, sans-serif" font-size="12">Overlapping feature volume saturates at V = 1 / (1 − β) instead of growing as n</text>

  <!-- Overlap visual box -->
  <rect x="36" y="80" width="396" height="148" rx="8" fill="#f7f5ef" stroke="#dedbd2" stroke-width="1.2"/>
  <line x1="226" y1="90" x2="226" y2="218" stroke="#cfc9bc" stroke-width="1.2" stroke-dasharray="4,4"/>

  <!-- Tail class sub-panel -->
  <text x="131" y="102" text-anchor="middle" fill="#b76335" font-family="Manrope, system-ui, sans-serif" font-size="12.5" font-weight="800">Tail Class (n = 10)</text>
  <text x="131" y="118" text-anchor="middle" fill="#52605a" font-family="Manrope, system-ui, sans-serif" font-size="11">Sparse samples → minimal overlap</text>
  <circle cx="83" cy="160" r="23" fill="#b76335" fill-opacity="0.20" stroke="#b76335" stroke-width="2"/>
  <circle cx="131" cy="160" r="23" fill="#b76335" fill-opacity="0.20" stroke="#b76335" stroke-width="2"/>
  <circle cx="179" cy="160" r="23" fill="#b76335" fill-opacity="0.20" stroke="#b76335" stroke-width="2"/>
  <text x="131" y="210" text-anchor="middle" fill="#173d35" font-family="Manrope, system-ui, sans-serif" font-size="12" font-weight="700">E₁₀ = 9.955  (≈ n)</text>

  <!-- Head class sub-panel -->
  <text x="329" y="102" text-anchor="middle" fill="#235d80" font-family="Manrope, system-ui, sans-serif" font-size="12.5" font-weight="800">Head Class (n = 10,000)</text>
  <text x="329" y="118" text-anchor="middle" fill="#52605a" font-family="Manrope, system-ui, sans-serif" font-size="11">Dense samples → heavy overlap</text>
  <circle cx="288" cy="162" r="24" fill="#235d80" fill-opacity="0.16" stroke="#235d80" stroke-width="1.6"/>
  <circle cx="302" cy="154" r="24" fill="#235d80" fill-opacity="0.16" stroke="#235d80" stroke-width="1.6"/>
  <circle cx="316" cy="165" r="24" fill="#235d80" fill-opacity="0.16" stroke="#235d80" stroke-width="1.6"/>
  <circle cx="330" cy="156" r="24" fill="#235d80" fill-opacity="0.16" stroke="#235d80" stroke-width="1.6"/>
  <circle cx="344" cy="164" r="24" fill="#235d80" fill-opacity="0.16" stroke="#235d80" stroke-width="1.6"/>
  <circle cx="358" cy="155" r="24" fill="#235d80" fill-opacity="0.16" stroke="#235d80" stroke-width="1.6"/>
  <circle cx="370" cy="162" r="24" fill="#235d80" fill-opacity="0.16" stroke="#235d80" stroke-width="1.6"/>
  <text x="329" y="210" text-anchor="middle" fill="#173d35" font-family="Manrope, system-ui, sans-serif" font-size="12" font-weight="700">E₁₀₀₀₀ = 999.95  (saturates at V = 1,000)</text>

  <!-- Left card comparison boxes -->
  <text x="36" y="250" fill="#173d35" font-family="Manrope, system-ui, sans-serif" font-size="12.5" font-weight="700">Tail-to-Head Weight Ratio (n_head = 10,000 vs. n_tail = 10):</text>

  <rect x="36" y="260" width="396" height="36" rx="6" fill="#fdf2ef" stroke="#e6b8af" stroke-width="1.2"/>
  <text x="48" y="283" fill="#9e2a2b" font-family="Manrope, system-ui, sans-serif" font-size="12" font-weight="800">Raw 1/n weights:</text>
  <text x="160" y="283" fill="#2c3a35" font-family="Manrope, system-ui, sans-serif" font-size="12">10,000 / 10 = 1,000×  (overshoots head logits)</text>

  <rect x="36" y="304" width="396" height="36" rx="6" fill="#eef7f3" stroke="#a6d4c2" stroke-width="1.2"/>
  <text x="48" y="327" fill="#087f68" font-family="Manrope, system-ui, sans-serif" font-size="12" font-weight="800">1/Eₙ (β = 0.999):</text>
  <text x="160" y="327" fill="#2c3a35" font-family="Manrope, system-ui, sans-serif" font-size="12">999.95 / 9.955 = 100.4×  (smooth &amp; stable)</text>

  <text x="36" y="362" fill="#52605a" font-family="Manrope, system-ui, sans-serif" font-size="11.5">Limits:  β = 0 → uniform (αₖ = 1)   |   β → 1 → raw inverse frequency (αₖ = 1/nₖ)</text>

  <!-- Right Card: Focal Loss -->
  <rect x="470" y="18" width="432" height="364" rx="10" fill="#ffffff" stroke="#d8d4c8" stroke-width="1.5"/>
  <text x="488" y="46" fill="#173d35" font-family="Manrope, system-ui, sans-serif" font-size="15" font-weight="800">2. Focal Loss: FL(pₜ) = −αₜ (1 − pₜ)^γ log(pₜ)</text>
  <text x="488" y="66" fill="#52605a" font-family="Manrope, system-ui, sans-serif" font-size="12">Suppresses easy background negatives (pₜ → 1) via modulating factor (1 − pₜ)^γ</text>

  <!-- Plot box -->
  <rect x="488" y="80" width="396" height="168" rx="8" fill="#f7f5ef" stroke="#dedbd2" stroke-width="1.2"/>

  <!-- Grid lines -->
  <g stroke="#e2ddd2" stroke-width="1">
    <line x1="536" y1="115" x2="856" y2="115"/>
    <line x1="536" y1="151" x2="856" y2="151"/>
    <line x1="536" y1="187" x2="856" y2="187"/>
    <line x1="616" y1="94" x2="616" y2="223"/>
    <line x1="696" y1="94" x2="696" y2="223"/>
    <line x1="776" y1="94" x2="776" y2="223"/>
  </g>

  <!-- Axes -->
  <line x1="536" y1="94" x2="536" y2="223" stroke="#52605a" stroke-width="1.5"/>
  <line x1="536" y1="223" x2="856" y2="223" stroke="#52605a" stroke-width="1.5"/>

  <!-- Y-axis ticks -->
  <text x="528" y="119" text-anchor="end" fill="#52605a" font-family="Manrope, system-ui, sans-serif" font-size="10.5">3</text>
  <text x="528" y="155" text-anchor="end" fill="#52605a" font-family="Manrope, system-ui, sans-serif" font-size="10.5">2</text>
  <text x="528" y="191" text-anchor="end" fill="#52605a" font-family="Manrope, system-ui, sans-serif" font-size="10.5">1</text>
  <text x="528" y="226" text-anchor="end" fill="#52605a" font-family="Manrope, system-ui, sans-serif" font-size="10.5">0</text>
  <text x="506" y="160" text-anchor="middle" transform="rotate(-90 506 160)" fill="#173d35" font-family="Manrope, system-ui, sans-serif" font-size="11" font-weight="700">Loss</text>

  <!-- X-axis ticks -->
  <text x="536" y="239" text-anchor="middle" fill="#52605a" font-family="Manrope, system-ui, sans-serif" font-size="10.5">0.0</text>
  <text x="616" y="239" text-anchor="middle" fill="#52605a" font-family="Manrope, system-ui, sans-serif" font-size="10.5">0.25</text>
  <text x="696" y="239" text-anchor="middle" fill="#173d35" font-family="Manrope, system-ui, sans-serif" font-size="10.5" font-weight="700">pₜ = 0.50</text>
  <text x="776" y="239" text-anchor="middle" fill="#52605a" font-family="Manrope, system-ui, sans-serif" font-size="10.5">0.75</text>
  <text x="856" y="239" text-anchor="middle" fill="#52605a" font-family="Manrope, system-ui, sans-serif" font-size="10.5">1.0</text>

  <!-- Standard CE curve: -ln(p_t) -->
  <path d="M 549 107 L 568 140 L 600 165 L 632 180 L 664 190 L 696 198 L 728 205 L 760 210 L 792 215 L 824 219 L 856 223" fill="none" stroke="#235d80" stroke-width="2.6" stroke-dasharray="5,3"/>

  <!-- Focal Loss curve (gamma=2): -(1 - p_t)^2 ln(p_t) -->
  <path d="M 549 116 L 568 156 L 600 186 L 632 202 L 664 211 L 696 217 L 728 220 L 760 222 L 792 222.7 L 824 223 L 856 223" fill="none" stroke="#b76335" stroke-width="3"/>

  <!-- Legend box inside plot upper-right -->
  <rect x="658" y="92" width="194" height="48" rx="6" fill="#ffffff" fill-opacity="0.94" stroke="#dedbd2" stroke-width="1"/>
  <line x1="668" y1="107" x2="692" y2="107" stroke="#235d80" stroke-width="2.6" stroke-dasharray="5,3"/>
  <text x="700" y="111" fill="#235d80" font-family="Manrope, system-ui, sans-serif" font-size="11.5" font-weight="700">γ = 0  (Standard CE)</text>
  <line x1="668" y1="127" x2="692" y2="127" stroke="#b76335" stroke-width="3"/>
  <text x="700" y="131" fill="#b76335" font-family="Manrope, system-ui, sans-serif" font-size="11.5" font-weight="700">γ = 2  (Focal Loss)</text>

  <!-- Right card comparison boxes -->
  <rect x="488" y="260" width="396" height="36" rx="6" fill="#fdf4eb" stroke="#e8c5a5" stroke-width="1.2"/>
  <text x="500" y="283" fill="#b76335" font-family="Manrope, system-ui, sans-serif" font-size="12" font-weight="800">Hard positive (pₜ = 0.10):</text>
  <text x="660" y="283" fill="#2c3a35" font-family="Manrope, system-ui, sans-serif" font-size="12">(1 − 0.10)² = 0.81  (81% weight kept)</text>

  <rect x="488" y="304" width="396" height="36" rx="6" fill="#eef4f8" stroke="#b8cfe0" stroke-width="1.2"/>
  <text x="500" y="327" fill="#235d80" font-family="Manrope, system-ui, sans-serif" font-size="12" font-weight="800">Easy negative (pₜ = 0.99):</text>
  <text x="660" y="327" fill="#2c3a35" font-family="Manrope, system-ui, sans-serif" font-size="12">(1 − 0.99)² = 0.0001  (10,000× smaller)</text>

  <text x="488" y="362" fill="#173d35" font-family="Manrope, system-ui, sans-serif" font-size="11.5" font-weight="700">Result: 0.81 / 0.0001 = 8,100× relative emphasis on the hard positive</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" font-family="Manrope, sans-serif">
  <rect width="900" height="360" rx="14" fill="#0f172a"/>
  <rect x="16" y="16" width="424" height="328" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <rect x="460" y="16" width="424" height="328" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>

  <!-- Left panel: LDAM Asymmetric Margin Delta_k propto n_k^(-1/4) -->
  <text x="36" y="46" fill="#f8fafc" font-size="15" font-weight="700">1. LDAM Margin Scaling Δ_k = C / n_k^(1/4)</text>
  <text x="36" y="68" fill="#94a3b8" font-size="12">Larger margin on the rare class pushes the boundary toward the head class</text>

  <rect x="36" y="84" width="384" height="156" rx="8" fill="#0f172a" stroke="#334155"/>
  <!-- Head region on left, Tail region on right -->
  <circle cx="95" cy="135" r="5" fill="#38bdf8"/><circle cx="118" cy="160" r="5" fill="#38bdf8"/>
  <circle cx="105" cy="190" r="5" fill="#38bdf8"/><circle cx="140" cy="130" r="5" fill="#38bdf8"/>
  <circle cx="145" cy="175" r="5" fill="#38bdf8"/><circle cx="168" cy="150" r="5" fill="#38bdf8"/>
  <text x="115" y="110" fill="#7dd3fc" font-size="12" font-weight="700" text-anchor="middle">Head (n₁ = 10,000)</text>

  <circle cx="355" cy="145" r="6" fill="#f97316"/><circle cx="372" cy="178" r="6" fill="#f97316"/>
  <text x="345" y="110" fill="#fdba74" font-size="12" font-weight="700" text-anchor="middle">Tail (n₂ = 16)</text>

  <!-- Shifted boundary and margins -->
  <line x1="215" y1="96" x2="215" y2="228" stroke="#4ade80" stroke-width="2.5"/>
  <text x="215" y="224" fill="#4ade80" font-size="11" font-weight="700" text-anchor="middle">LDAM Boundary</text>

  <!-- Small margin Delta_1 vs Large margin Delta_2 -->
  <line x1="175" y1="160" x2="215" y2="160" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="195" y="150" fill="#7dd3fc" font-size="11" font-weight="700" text-anchor="middle">Δ₁=0.05</text>

  <line x1="215" y1="160" x2="335" y2="160" stroke="#f97316" stroke-width="2.5"/>
  <text x="275" y="150" fill="#fdba74" font-size="11" font-weight="700" text-anchor="middle">Δ₂ = 0.25 (5× wider)</text>

  <text x="36" y="264" fill="#e2e8f0" font-size="12" font-weight="600">With C = 0.5 on n₁ = 10,000 (10,000^(1/4)=10) vs. n₂ = 16 (16^(1/4)=2):</text>
  <text x="36" y="286" fill="#7dd3fc" font-size="12">• Head margin: Δ₁ = 0.5 / 10 = 0.05</text>
  <text x="36" y="306" fill="#fdba74" font-size="12">• Tail margin: Δ₂ = 0.5 / 2 = 0.25 (5× larger safety buffer for tail)</text>
  <text x="36" y="326" fill="#cbd5e1" font-size="12">• DRW: train with uniform weights first, turn on 1/E_n weights at epoch 160.</text>

  <!-- Right panel: Logit Adjustment & Balanced Softmax -->
  <text x="480" y="46" fill="#f8fafc" font-size="15" font-weight="700">2. Bayes Logit Adjustment (Menon et al.)</text>
  <text x="480" y="68" fill="#94a3b8" font-size="12">Subtracting τ log π_k cancels the training prior skew inside the logits</text>

  <rect x="480" y="84" width="384" height="156" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="500" y="112" fill="#e2e8f0" font-size="12" font-weight="700">Raw Logits z = [2.5, 0.5]  (π₁ = 0.99, π₂ = 0.01)</text>
  <rect x="500" y="122" width="220" height="16" rx="3" fill="#38bdf8"/>
  <text x="728" y="135" fill="#7dd3fc" font-size="12" font-weight="700">z₁ = +2.50 (Wins raw)</text>
  <rect x="500" y="144" width="55" height="16" rx="3" fill="#f97316"/>
  <text x="564" y="157" fill="#fdba74" font-size="12" font-weight="700">z₂ = +0.50</text>

  <text x="500" y="184" fill="#e2e8f0" font-size="12" font-weight="700">Adjusted Logits z̃_k = z_k − log π_k  (τ = 1)</text>
  <rect x="500" y="194" width="110" height="16" rx="3" fill="#38bdf8"/>
  <text x="618" y="207" fill="#7dd3fc" font-size="12" font-weight="700">z̃₁ = 2.50 − (−0.01) = +2.51</text>
  <rect x="500" y="216" width="225" height="16" rx="3" fill="#4ade80"/>
  <text x="733" y="229" fill="#4ade80" font-size="12" font-weight="700">z̃₂ = 0.50 − (−4.61) = +5.11</text>

  <text x="480" y="264" fill="#e2e8f0" font-size="12" font-weight="600">Two equivalent ways to apply Logit Adjustment:</text>
  <text x="480" y="286" fill="#7dd3fc" font-size="12">• Post-hoc inference: argmax_k (z_k − τ log π_k) on standard CE model.</text>
  <text x="480" y="306" fill="#4ade80" font-size="12">• Balanced Softmax loss: L = −log [ π_y e^(z_y) / Σ_j π_j e^(z_j) ] during training.</text>
  <text x="480" y="326" fill="#cbd5e1" font-size="12">• Unlike α_y weight multipliers, logit shifts never distort gradient scale.</text>
</svg>

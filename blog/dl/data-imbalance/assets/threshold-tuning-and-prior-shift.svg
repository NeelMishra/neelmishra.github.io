<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" font-family="Manrope, sans-serif">
  <rect width="900" height="360" rx="14" fill="#0f172a"/>
  <rect x="16" y="16" width="424" height="328" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <rect x="460" y="16" width="424" height="328" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>

  <!-- Left panel: Cost-Optimal Threshold p* = C_FP / (C_FP + C_FN) -->
  <text x="36" y="46" fill="#f8fafc" font-size="15" font-weight="700">1. Cost-Optimal Decision Threshold p*</text>
  <text x="36" y="68" fill="#94a3b8" font-size="12">Minimizing expected business/clinical cost instead of using p = 0.50</text>

  <rect x="36" y="84" width="384" height="156" rx="8" fill="#0f172a" stroke="#334155"/>
  <!-- Number line 0 to 1 -->
  <line x1="66" y1="168" x2="390" y2="168" stroke="#64748b" stroke-width="3"/>
  <circle cx="66" cy="168" r="4" fill="#94a3b8"/>
  <text x="66" y="192" fill="#94a3b8" font-size="11" text-anchor="middle">0.0</text>
  <circle cx="390" cy="168" r="4" fill="#94a3b8"/>
  <text x="390" y="192" fill="#94a3b8" font-size="11" text-anchor="middle">1.0</text>

  <!-- Default threshold 0.50 -->
  <line x1="228" y1="126" x2="228" y2="180" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="228" y="116" fill="#94a3b8" font-size="11" text-anchor="middle">Default 0.50 (C_FP = C_FN)</text>

  <!-- Cost-optimal threshold p* = 1 / (1 + 19) = 0.05 -->
  <line x1="90" y1="120" x2="90" y2="184" stroke="#4ade80" stroke-width="3"/>
  <circle cx="90" cy="168" r="6" fill="#4ade80"/>
  <text x="118" y="138" fill="#4ade80" font-size="12" font-weight="700">p* = 0.05 (C_FN = 19·C_FP)</text>
  <text x="125" y="218" fill="#fdba74" font-size="11">Predict y = 1 whenever p(y=1|x) ≥ p*</text>

  <text x="36" y="264" fill="#e2e8f0" font-size="12" font-weight="600">Why threshold 0.50 is wrong for asymmetric error costs:</text>
  <text x="36" y="286" fill="#4ade80" font-size="12">• Predict 1 when E[Cost(1)] ≤ E[Cost(0)]  ⇒  (1 − p)C_FP ≤ p C_FN</text>
  <text x="36" y="306" fill="#7dd3fc" font-size="12">• Optimal cutoff: p* = C_FP / (C_FP + C_FN)</text>
  <text x="36" y="326" fill="#cbd5e1" font-size="12">• If a missed fraud costs $190 and a review costs $10, p* = 10/200 = 0.05.</text>

  <!-- Right panel: Prior-Shift / Undersampling Probability Recalibration -->
  <text x="480" y="46" fill="#f8fafc" font-size="15" font-weight="700">2. Recalibrating After 50:50 Resampling</text>
  <text x="480" y="68" fill="#94a3b8" font-size="12">Training at π_train = 0.50 inflates raw probabilities when π_real = 0.01</text>

  <rect x="480" y="84" width="384" height="156" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="500" y="114" fill="#fda4af" font-size="12" font-weight="700">Raw Resampled Model Output (π_train = 0.50):</text>
  <rect x="500" y="124" width="240" height="18" rx="4" fill="#f43f5e"/>
  <text x="748" y="138" fill="#fb7185" font-size="12" font-weight="700">p_train = 80.0% (Inflated!)</text>

  <text x="500" y="172" fill="#4ade80" font-size="12" font-weight="700">After Bayes Prior-Shift Correction (π_real = 0.01):</text>
  <rect x="500" y="182" width="12" height="18" rx="3" fill="#4ade80"/>
  <text x="520" y="196" fill="#4ade80" font-size="12" font-weight="700">p_real = 3.88% (True probability!)</text>
  <text x="500" y="222" fill="#94a3b8" font-size="11">Logit offset: z_real = z_train + log(π_real/1−π_real) − log(π_train/1−π_train)</text>

  <text x="480" y="264" fill="#e2e8f0" font-size="12" font-weight="600">Elkan / Saerens Prior-Shift Recalibration Formula:</text>
  <text x="480" y="286" fill="#fde047" font-size="12">• Odds_real(x) = Odds_train(x) × [ π_real (1 − π_train) ] / [ (1 − π_real) π_train ]</text>
  <text x="480" y="306" fill="#4ade80" font-size="12">• At p_train = 0.80 (odds = 4): Odds_real = 4 × (0.01 / 0.99) = 0.0404</text>
  <text x="480" y="326" fill="#cbd5e1" font-size="12">• True probability: p_real = 0.0404 / 1.0404 = 0.0388 (3.88%).</text>
</svg>

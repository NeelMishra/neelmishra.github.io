<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" font-family="Manrope, -apple-system, BlinkMacSystemFont, sans-serif">
  <rect width="900" height="360" rx="14" fill="#fffdf9" stroke="#e2d9c8" stroke-width="1.5"/>

  <!-- Left Panel: Vanilla SMOTE Bridge Problem vs Borderline-SMOTE Safe/Danger/Noise -->
  <g transform="translate(24, 20)">
    <rect width="415" height="320" rx="10" fill="#f8f4ec" stroke="#dcd1be" stroke-width="1"/>
    <text x="16" y="26" font-size="13.5" font-weight="800" fill="#1e2420">1. Vanilla SMOTE Bridge vs. Borderline-SMOTE Regimes</text>
    <text x="16" y="44" font-size="11" fill="#5a655e">Classify minority point x_i by majority count m' among m=5 neighbors</text>

    <!-- Decision boundary curve -->
    <path d="M 215 62 Q 195 160 225 255" fill="none" stroke="#1e2420" stroke-width="2" stroke-dasharray="5,4"/>
    <text x="162" y="72" font-size="10.5" font-weight="700" fill="#126650">Minority Side</text>
    <text x="234" y="72" font-size="10.5" font-weight="700" fill="#7b877f">Majority Side</text>

    <!-- Majority points (gray circles) -->
    <circle cx="248" cy="98" r="5.5" fill="#95a099"/>
    <circle cx="275" cy="112" r="5.5" fill="#95a099"/>
    <circle cx="238" cy="138" r="5.5" fill="#95a099"/>
    <circle cx="268" cy="155" r="5.5" fill="#95a099"/>
    <circle cx="295" cy="132" r="5.5" fill="#95a099"/>
    <circle cx="242" cy="182" r="5.5" fill="#95a099"/>
    <circle cx="276" cy="196" r="5.5" fill="#95a099"/>
    <circle cx="255" cy="225" r="5.5" fill="#95a099"/>
    <circle cx="322" cy="165" r="5.5" fill="#95a099"/>
    <circle cx="345" cy="192" r="5.5" fill="#95a099"/>
    <circle cx="315" cy="212" r="5.5" fill="#95a099"/>

    <!-- SAFE minority points (m' = 0 or 1 < m/2) -->
    <circle cx="66" cy="115" r="7" fill="#126650"/>
    <circle cx="88" cy="152" r="7" fill="#126650"/>
    <circle cx="62" cy="188" r="7" fill="#126650"/>
    <text x="26" y="152" font-size="10.5" font-weight="800" fill="#126650">SAFE</text>
    <text x="20" y="165" font-size="9.5" fill="#126650">(m'=0: skip)</text>

    <!-- DANGER minority points (m/2 <= m' < m) -->
    <circle cx="176" cy="118" r="7.5" fill="#d97706" stroke="#1e2420" stroke-width="1.2"/>
    <circle cx="168" cy="176" r="7.5" fill="#d97706" stroke="#1e2420" stroke-width="1.2"/>
    <circle cx="182" cy="222" r="7.5" fill="#d97706" stroke="#1e2420" stroke-width="1.2"/>
    <!-- Borderline-SMOTE valid synthesis segment -->
    <line x1="176" y1="118" x2="168" y2="176" stroke="#d97706" stroke-width="2.2"/>
    <line x1="168" y1="176" x2="182" y2="222" stroke="#d97706" stroke-width="2.2"/>
    <polygon points="172,141 178,147 172,153 166,147" fill="#f59e0b" stroke="#1e2420" stroke-width="1"/>
    <polygon points="175,193 181,199 175,205 169,199" fill="#f59e0b" stroke="#1e2420" stroke-width="1"/>
    <text x="102" y="122" font-size="10.5" font-weight="800" fill="#b45309">DANGER</text>
    <text x="96" y="135" font-size="9.5" fill="#b45309">(m'=3: synthesize!)</text>

    <!-- NOISE minority point (m' = m = 5) -->
    <circle cx="320" cy="188" r="7.5" fill="#b42318" stroke="#ffffff" stroke-width="1.5"/>
    <!-- False Vanilla-SMOTE bridge line across majority territory -->
    <line x1="168" y1="176" x2="320" y2="188" stroke="#b42318" stroke-width="1.8" stroke-dasharray="4,3"/>
    <circle cx="252" cy="183" r="5" fill="#b42318" opacity="0.7"/>
    <text x="334" y="184" font-size="10.5" font-weight="800" fill="#b42318">NOISE</text>
    <text x="334" y="197" font-size="9.5" fill="#b42318">(m'=5: ignore!)</text>

    <!-- Bottom callout -->
    <rect x="14" y="264" width="387" height="44" rx="6" fill="#fffaf0" stroke="#e5d5b5"/>
    <text x="24" y="281" font-size="10.8" font-weight="700" fill="#1e2420">Why Vanilla SMOTE creates false bridges:</text>
    <text x="24" y="297" font-size="10.3" fill="#49544d">Interpolating to a NOISE point (m'=5) places synthetic positives inside the majority cluster.</text>
  </g>

  <!-- Right Panel: ADASYN Density-Weighted Allocation & Tomek Link Cleaning -->
  <g transform="translate(461, 20)">
    <rect width="415" height="320" rx="10" fill="#f8f4ec" stroke="#dcd1be" stroke-width="1"/>
    <text x="16" y="26" font-size="13.5" font-weight="800" fill="#1e2420">2. ADASYN Allocation g_i = r̂_i · G &amp; Tomek Link Cleaning</text>
    <text x="16" y="44" font-size="11" fill="#5a655e">Local hardness r_i = Δ_i / K allocates more synthetic samples to harder points</text>

    <!-- Horizontal bar chart of ADASYN allocation for 3 minority examples -->
    <g transform="translate(20, 64)">
      <text x="0" y="16" font-size="11" font-weight="700" fill="#1e2420">x_1 (Δ_1=1/5, r_1=0.20)</text>
      <rect x="148" y="4" width="44" height="16" rx="4" fill="#126650"/>
      <text x="198" y="16" font-size="10.5" font-weight="700" fill="#126650">r̂_1 = 0.143  →  g_1 = 3 samples</text>

      <text x="0" y="44" font-size="11" font-weight="700" fill="#1e2420">x_2 (Δ_2=2/5, r_2=0.40)</text>
      <rect x="148" y="32" width="88" height="16" rx="4" fill="#315e9a"/>
      <text x="242" y="44" font-size="10.5" font-weight="700" fill="#315e9a">r̂_2 = 0.286  →  g_2 = 6 samples</text>

      <text x="0" y="72" font-size="11" font-weight="700" fill="#1e2420">x_3 (Δ_3=4/5, r_3=0.80)</text>
      <rect x="148" y="60" width="176" height="16" rx="4" fill="#a45113"/>
      <text x="242" y="90" font-size="10.5" font-weight="700" fill="#a45113">r̂_3 = 0.571  →  g_3 = 11 samples</text>
    </g>

    <!-- Divider -->
    <line x1="16" y1="172" x2="399" y2="172" stroke="#dcd1be" stroke-width="1"/>

    <!-- Tomek Link Cleaning diagram -->
    <text x="16" y="194" font-size="12.5" font-weight="800" fill="#1e2420">Post-SMOTE Boundary Cleaning: Tomek Links vs. ENN</text>
    <text x="16" y="211" font-size="10.6" fill="#5a655e">Pair (x_i, x_j) is a Tomek link if each is the other's 1-NN and y_i ≠ y_j:</text>

    <!-- Tomek pair illustration -->
    <g transform="translate(24, 224)">
      <rect width="176" height="78" rx="7" fill="#fffaf0" stroke="#d8ccb8"/>
      <text x="12" y="18" font-size="10.5" font-weight="800" fill="#b42318">Tomek Link (Mutual 1-NN)</text>
      <circle cx="52" cy="46" r="7" fill="#f59e0b" stroke="#1e2420" stroke-width="1.2"/>
      <circle cx="118" cy="46" r="7" fill="#95a099" stroke="#b42318" stroke-width="2" stroke-dasharray="3,2"/>
      <line x1="61" y1="46" x2="109" y2="46" stroke="#b42318" stroke-width="1.8"/>
      <text x="38" y="68" font-size="9.8" fill="#49544d">Remove overlapping pair</text>
    </g>

    <g transform="translate(214, 224)">
      <rect width="185" height="78" rx="7" fill="#fffaf0" stroke="#d8ccb8"/>
      <text x="12" y="18" font-size="10.5" font-weight="800" fill="#126650">SMOTE-ENN (3-NN Majority Vote)</text>
      <text x="12" y="38" font-size="10" fill="#49544d">Drop any point whose label</text>
      <text x="12" y="53" font-size="10" fill="#49544d">disagrees with ≥2 of its 3-NNs</text>
      <text x="12" y="68" font-size="9.8" font-weight="700" fill="#126650">→ Wider, cleaner margin</text>
    </g>
  </g>
</svg>

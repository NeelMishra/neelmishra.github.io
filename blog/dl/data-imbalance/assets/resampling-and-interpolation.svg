<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" font-family="Manrope, sans-serif">
  <rect width="900" height="360" rx="14" fill="#0f172a"/>
  <rect x="16" y="16" width="424" height="328" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <rect x="460" y="16" width="424" height="328" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>

  <!-- Left panel: q-power Sampling on (1000, 100, 10) -->
  <text x="36" y="46" fill="#f8fafc" font-size="15" font-weight="700">1. Power-Law Sampler p_k ∝ n_k^q on (1000, 100, 10)</text>
  <text x="36" y="68" fill="#94a3b8" font-size="12">Class probabilities under q = 1 (Instance), q = 0.5 (Sqrt), q = 0 (Balanced)</text>

  <!-- Group 1: q = 1 -->
  <text x="36" y="102" fill="#e2e8f0" font-size="12" font-weight="700">q = 1 (Instance-Balanced: 90.1%, 9.0%, 0.9%)</text>
  <rect x="36" y="110" width="324" height="16" rx="3" fill="#38bdf8"/>
  <rect x="362" y="110" width="32" height="16" rx="3" fill="#a855f7"/>
  <rect x="396" y="110" width="6" height="16" rx="2" fill="#f97316"/>

  <!-- Group 2: q = 0.5 -->
  <text x="36" y="156" fill="#e2e8f0" font-size="12" font-weight="700">q = 0.5 (Square-Root: 70.6%, 22.3%, 7.1%)</text>
  <rect x="36" y="164" width="254" height="16" rx="3" fill="#38bdf8"/>
  <rect x="292" y="164" width="80" height="16" rx="3" fill="#a855f7"/>
  <rect x="374" y="164" width="28" height="16" rx="3" fill="#f97316"/>

  <!-- Group 3: q = 0 -->
  <text x="36" y="210" fill="#e2e8f0" font-size="12" font-weight="700">q = 0 (Class-Balanced: 33.3%, 33.3%, 33.3%)</text>
  <rect x="36" y="218" width="120" height="16" rx="3" fill="#38bdf8"/>
  <rect x="158" y="218" width="120" height="16" rx="3" fill="#a855f7"/>
  <rect x="280" y="218" width="120" height="16" rx="3" fill="#f97316"/>

  <!-- Legend -->
  <circle cx="44" cy="262" r="5" fill="#38bdf8"/><text x="56" y="266" fill="#7dd3fc" font-size="12">Head (n₁=1000)</text>
  <circle cx="168" cy="262" r="5" fill="#a855f7"/><text x="180" y="266" fill="#d8b4fe" font-size="12">Medium (n₂=100)</text>
  <circle cx="304" cy="262" r="5" fill="#f97316"/><text x="316" y="266" fill="#fdba74" font-size="12">Tail (n₃=10)</text>

  <text x="36" y="298" fill="#cbd5e1" font-size="12">At q = 0, each tail sample is repeated 37× per epoch (memorization risk).</text>
  <text x="36" y="318" fill="#cbd5e1" font-size="12">Square-root (q = 0.5) boosts tail 8× while keeping repeat rate at 7.8×.</text>

  <!-- Right panel: SMOTE vs ReMix Interpolation -->
  <text x="480" y="46" fill="#f8fafc" font-size="15" font-weight="700">2. Synthetic Interpolation: SMOTE vs. ReMix</text>
  <text x="480" y="68" fill="#94a3b8" font-size="12">Expanding the minority decision region instead of cloning exact points</text>

  <rect x="480" y="84" width="384" height="176" rx="8" fill="#0f172a" stroke="#334155"/>
  <!-- SMOTE line between two tail samples -->
  <line x1="540" y1="130" x2="640" y2="190" stroke="#f97316" stroke-width="2" stroke-dasharray="5,4"/>
  <circle cx="540" cy="130" r="7" fill="#f97316"/>
  <text x="536" y="114" fill="#fdba74" font-size="11" font-weight="700">x_i (Tail)</text>
  <circle cx="640" cy="190" r="7" fill="#f97316"/>
  <text x="640" y="212" fill="#fdba74" font-size="11" font-weight="700" text-anchor="middle">x_nn (k-NN Tail)</text>
  <circle cx="585" cy="157" r="6" fill="#fde047" stroke="#f97316" stroke-width="2"/>
  <text x="595" y="148" fill="#fde047" font-size="11" font-weight="700">x̃_SMOTE</text>

  <!-- ReMix line between Head and Tail -->
  <line x1="715" y1="125" x2="815" y2="195" stroke="#38bdf8" stroke-width="2" stroke-dasharray="5,4"/>
  <circle cx="715" cy="125" r="7" fill="#38bdf8"/>
  <text x="715" y="110" fill="#7dd3fc" font-size="11" font-weight="700" text-anchor="middle">x_H (Head)</text>
  <circle cx="815" cy="195" r="7" fill="#f97316"/>
  <text x="815" y="216" fill="#fdba74" font-size="11" font-weight="700" text-anchor="middle">x_T (Tail)</text>
  <circle cx="765" cy="160" r="6" fill="#4ade80" stroke="#22c55e" stroke-width="2"/>
  <text x="765" y="145" fill="#4ade80" font-size="11" font-weight="700" text-anchor="middle">ReMix: λ_y → Tail</text>

  <text x="480" y="284" fill="#fde047" font-size="12">• SMOTE: x̃ = x_i + u(x_nn − x_i) within minority k-NN segment.</text>
  <text x="480" y="306" fill="#4ade80" font-size="12">• ReMix: mixes features x̃ = λ_x x_H + (1−λ_x)x_T, biases label λ_y toward Tail.</text>
  <text x="480" y="328" fill="#cbd5e1" font-size="12">• Both push the decision boundary away from the minority examples.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" font-family="Manrope, sans-serif">
  <rect width="900" height="360" rx="14" fill="#0f172a"/>
  <rect x="16" y="16" width="424" height="328" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <rect x="460" y="16" width="424" height="328" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>

  <!-- Left panel: Gradient Dominance on 99:1 Imbalance -->
  <text x="36" y="46" fill="#f8fafc" font-size="15" font-weight="700">1. Mini-Batch Gradient Dominance (99:1 Skew)</text>
  <text x="36" y="68" fill="#94a3b8" font-size="12">990 majority negatives (y=0) vs. 10 minority positives (y=1)</text>

  <!-- Decision boundary pushed into minority region -->
  <rect x="36" y="86" width="384" height="145" rx="8" fill="#0f172a" stroke="#334155"/>
  <!-- Majority negative dots -->
  <g fill="#38bdf8" opacity="0.85">
    <circle cx="70" cy="115" r="5"/><circle cx="92" cy="135" r="5"/><circle cx="80" cy="165" r="5"/>
    <circle cx="108" cy="110" r="5"/><circle cx="115" cy="148" r="5"/><circle cx="102" cy="185" r="5"/>
    <circle cx="135" cy="122" r="5"/><circle cx="142" cy="160" r="5"/><circle cx="128" cy="195" r="5"/>
    <circle cx="165" cy="112" r="5"/><circle cx="172" cy="142" r="5"/><circle cx="160" cy="178" r="5"/>
    <circle cx="195" cy="128" r="5"/><circle cx="202" cy="165" r="5"/><circle cx="188" cy="198" r="5"/>
    <circle cx="222" cy="118" r="5"/><circle cx="230" cy="150" r="5"/><circle cx="218" cy="184" r="5"/>
  </g>
  <!-- Minority positive dots -->
  <g fill="#f97316">
    <circle cx="350" cy="130" r="6"/><circle cx="372" cy="158" r="6"/><circle cx="358" cy="185" r="6"/>
  </g>
  <!-- Ideal boundary vs Skewed boundary -->
  <line x1="275" y1="94" x2="275" y2="222" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="275" y="106" fill="#94a3b8" font-size="11" text-anchor="end" dx="-6">Balanced boundary</text>
  <line x1="342" y1="94" x2="342" y2="222" stroke="#f43f5e" stroke-width="2.5"/>
  <text x="336" y="216" fill="#fda4af" font-size="11" text-anchor="end">Skewed boundary</text>

  <!-- Big gradient arrow from majority vs tiny arrow from minority -->
  <line x1="238" y1="155" x2="328" y2="155" stroke="#38bdf8" stroke-width="4"/>
  <polygon points="336,155 324,148 324,162" fill="#38bdf8"/>
  <text x="282" y="145" fill="#7dd3fc" font-size="11" font-weight="700" text-anchor="middle">99% push: p</text>

  <line x1="395" y1="155" x2="362" y2="155" stroke="#f97316" stroke-width="2.5"/>
  <polygon points="354,155 364,150 364,160" fill="#f97316"/>
  <text x="382" y="145" fill="#fdba74" font-size="11" font-weight="700" text-anchor="middle">1%</text>

  <text x="36" y="256" fill="#e2e8f0" font-size="12" font-weight="600">At initial logit z = 0 (p = 0.5):</text>
  <text x="36" y="278" fill="#7dd3fc" font-size="12">• Majority grad share: 0.99 × (+0.5) = +0.4950 (pushes z down)</text>
  <text x="36" y="298" fill="#fdba74" font-size="12">• Minority grad share: 0.01 × (−0.5) = −0.0050 (99× weaker)</text>
  <text x="36" y="320" fill="#cbd5e1" font-size="12">• Equilibrium logit: b* = log(0.01 / 0.99) = −4.595 (p* = 0.01)</text>

  <!-- Right panel: Why ROC Looks Great While Precision Collapses -->
  <text x="480" y="46" fill="#f8fafc" font-size="15" font-weight="700">2. Same Detector on N = 1000 (10 Pos, 990 Neg)</text>
  <text x="480" y="68" fill="#94a3b8" font-size="12">TP = 9, FN = 1 (Recall = 90%)  |  FP = 90, TN = 900</text>

  <!-- Metric bar comparison -->
  <text x="480" y="106" fill="#e2e8f0" font-size="12" font-weight="600">Overall Accuracy = (9 + 900) / 1000</text>
  <rect x="480" y="114" width="360" height="18" rx="4" fill="#0f172a"/>
  <rect x="480" y="114" width="327" height="18" rx="4" fill="#22c55e"/>
  <text x="850" y="128" fill="#4ade80" font-size="12" font-weight="700">90.9%</text>

  <text x="480" y="156" fill="#e2e8f0" font-size="12" font-weight="600">ROC True Negative Rate (1 − FPR = 900 / 990)</text>
  <rect x="480" y="164" width="360" height="18" rx="4" fill="#0f172a"/>
  <rect x="480" y="164" width="327" height="18" rx="4" fill="#38bdf8"/>
  <text x="850" y="178" fill="#7dd3fc" font-size="12" font-weight="700">90.9%</text>

  <text x="480" y="206" fill="#fda4af" font-size="12" font-weight="700">Precision = TP / (TP + FP) = 9 / (9 + 90)</text>
  <rect x="480" y="214" width="360" height="18" rx="4" fill="#0f172a"/>
  <rect x="480" y="214" width="33" height="18" rx="4" fill="#f43f5e"/>
  <text x="850" y="228" fill="#fb7185" font-size="12" font-weight="700">9.1%</text>

  <text x="480" y="256" fill="#fdba74" font-size="12" font-weight="700">F1 Score = 2·P·R / (P + R) = 18 / 109</text>
  <rect x="480" y="264" width="360" height="18" rx="4" fill="#0f172a"/>
  <rect x="480" y="264" width="59" height="18" rx="4" fill="#f97316"/>
  <text x="850" y="278" fill="#fdba74" font-size="12" font-weight="700">16.5%</text>

  <text x="480" y="312" fill="#cbd5e1" font-size="12">FPR divides FP = 90 by 990 negatives (looks small: 9.1%).</text>
  <text x="480" y="330" fill="#cbd5e1" font-size="12">Precision divides TP = 9 by 99 positive alerts (90 are false!).</text>
</svg>

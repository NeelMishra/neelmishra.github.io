<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" font-family="Manrope, sans-serif">
  <rect width="900" height="360" rx="14" fill="#0f172a"/>
  <rect x="16" y="16" width="424" height="328" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <rect x="460" y="16" width="424" height="328" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>

  <!-- Left panel: Pixel-wise BCE vs Region Overlap (Dice / Tversky) -->
  <text x="36" y="46" fill="#f8fafc" font-size="15" font-weight="700">1. Segmentation Overlap: Dice &amp; Tversky Loss</text>
  <text x="36" y="68" fill="#94a3b8" font-size="12">True foreground Y (orange) vs. Predicted mask P (blue) on 99.8% background</text>

  <rect x="36" y="84" width="384" height="156" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="52" y="106" fill="#64748b" font-size="11">Background TN pixels (ignored by Dice denominator!)</text>

  <!-- Overlapping circles for Y and P -->
  <circle cx="195" cy="166" r="52" fill="#f97316" fill-opacity="0.35" stroke="#f97316" stroke-width="2.5"/>
  <circle cx="255" cy="166" r="52" fill="#38bdf8" fill-opacity="0.35" stroke="#38bdf8" stroke-width="2.5"/>

  <text x="162" y="164" fill="#fdba74" font-size="12" font-weight="700" text-anchor="middle">FN</text>
  <text x="162" y="180" fill="#fdba74" font-size="10" text-anchor="middle">β weight</text>
  <text x="225" y="166" fill="#4ade80" font-size="13" font-weight="800" text-anchor="middle">TP</text>
  <text x="288" y="164" fill="#7dd3fc" font-size="12" font-weight="700" text-anchor="middle">FP</text>
  <text x="288" y="180" fill="#7dd3fc" font-size="10" text-anchor="middle">α weight</text>

  <text x="36" y="264" fill="#e2e8f0" font-size="12" font-weight="600">Why Dice &amp; Tversky ignore the 99.8% background TN:</text>
  <text x="36" y="286" fill="#4ade80" font-size="12">• Dice = 2·TP / (2·TP + FP + FN) — TN never enters the formula!</text>
  <text x="36" y="306" fill="#fdba74" font-size="12">• Tversky (β &gt; α, e.g. α=0.3, β=0.7) penalizes missed lesions (FN) harder.</text>
  <text x="36" y="326" fill="#cbd5e1" font-size="12">• Combo Loss = 0.5·BCE + 0.5·Dice pairs smooth gradients with overlap.</text>

  <!-- Right panel: Asymmetric Loss (ASL) for Multi-Label Imbalance -->
  <text x="480" y="46" fill="#f8fafc" font-size="15" font-weight="700">2. Asymmetric Loss (ASL) Probability Shifting</text>
  <text x="480" y="68" fill="#94a3b8" font-size="12">Decoupled focusing (γ₋ &gt; γ₊) + hard thresholding p_m = max(p − m, 0)</text>

  <rect x="480" y="84" width="384" height="156" rx="8" fill="#0f172a" stroke="#334155"/>
  <!-- Axes -->
  <line x1="520" y1="216" x2="836" y2="216" stroke="#64748b" stroke-width="1.5"/>
  <line x1="520" y1="100" x2="520" y2="216" stroke="#64748b" stroke-width="1.5"/>
  <text x="520" y="232" fill="#94a3b8" font-size="11" text-anchor="middle">p = 0</text>
  <text x="583" y="232" fill="#fde047" font-size="11" font-weight="700" text-anchor="middle">m = 0.2</text>
  <text x="836" y="232" fill="#94a3b8" font-size="11" text-anchor="middle">p = 1.0</text>

  <!-- Zero-loss zone [0, m] -->
  <line x1="520" y1="216" x2="583" y2="216" stroke="#fde047" stroke-width="4"/>
  <!-- ASL shifted negative loss curve -->
  <path d="M 583 216 Q 710 205 830 105" fill="none" stroke="#f43f5e" stroke-width="2.5"/>
  <text x="690" y="140" fill="#fda4af" font-size="12" font-weight="700">L₋ uses p_m = max(p − m, 0)</text>
  <text x="605" y="204" fill="#fde047" font-size="11">Exact 0 loss for p ≤ m</text>

  <text x="480" y="264" fill="#e2e8f0" font-size="12" font-weight="600">In multi-label tagging (e.g. 2 positive tags, 78 negative tags):</text>
  <text x="480" y="286" fill="#4ade80" font-size="12">• Positive tags (y=1): set γ₊ = 0 so rare positive signals never shrink.</text>
  <text x="480" y="306" fill="#fda4af" font-size="12">• Negative tags (y=0): set γ₋ = 4 and shift p_m = max(p − 0.05, 0).</text>
  <text x="480" y="326" fill="#cbd5e1" font-size="12">• Easy negatives (p &lt; m) produce 0 loss and 0 gradient completely.</text>
</svg>

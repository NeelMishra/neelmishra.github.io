<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" role="img" aria-labelledby="title desc">
  <title id="title">Online A/B Testing and ML System Design Metrics Hierarchy</title>
  <desc id="desc">Three-panel diagram showing (1) The Metric Pyramid in ML System Design: Long-term North Star / OEC, Short-term Driver / Surrogate Metrics, and Guardrail Metrics; (2) Statistical Mechanics of Online A/B Tests: Sample Ratio Mismatch, Delta Method for Ratio Metrics, and CUPED variance reduction; and (3) Subdomain Metric Map across Ads, Search, Feeds/Video, Marketplaces, SaaS, LLM Agents, and Trust/Fraud.</desc>
  <defs>
    <style>
      .bg { fill: #f8f6f1; }
      .panel { fill: #ffffff; stroke: #d5cfc2; stroke-width: 1.5; rx: 12; }
      .title { font: 700 14px "Inter", "Segoe UI", sans-serif; fill: #1e293b; }
      .subtitle { font: 600 11.5px "Inter", "Segoe UI", sans-serif; fill: #475569; }
      .label { font: 500 11px "Inter", "Segoe UI", sans-serif; fill: #334155; }
      .math { font: 600 11px "Cambria Math", "STIX Two Math", "Georgia", serif; fill: #0f172a; }
      .small { font: 500 10px "Inter", "Segoe UI", sans-serif; fill: #64748b; }
    </style>
  </defs>

  <rect width="900" height="370" class="bg" />

  <!-- PANEL 1: The ML System Design Metric Pyramid -->
  <rect x="16" y="16" width="282" height="338" class="panel" />
  <text x="30" y="40" class="title">1. The A/B Metric Hierarchy</text>
  <text x="30" y="57" class="subtitle">North Star (OEC), Drivers &amp; Guardrails</text>

  <g transform="translate(30, 74)">
    <!-- North Star / OEC -->
    <rect x="32" y="0" width="190" height="44" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6" rx="7" />
    <text x="52" y="19" class="math" fill="#15803d">North Star / OEC (↑)</text>
    <text x="44" y="34" class="small" fill="#166534">LTV, Net GMV, Sessions, Retention</text>

    <!-- Driver / Surrogate Metrics -->
    <rect x="14" y="54" width="226" height="48" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6" rx="7" />
    <text x="40" y="73" class="math" fill="#1d4ed8">Primary Driver Metrics (↑)</text>
    <text x="26" y="90" class="small" fill="#1e40af">CTR, CVR, Watch Time, TTFC, Acceptance</text>

    <!-- Guardrail Metrics -->
    <rect x="0" y="112" width="254" height="52" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6" rx="7" />
    <text x="36" y="131" class="math" fill="#b91c1c">Guardrail &amp; Invariant Metrics</text>
    <text x="14" y="148" class="small" fill="#991b1b">p99 Latency, SRM χ², Bounce, Unsub, Fraud</text>
  </g>

  <rect x="30" y="252" width="254" height="88" fill="#f8fafc" stroke="#cbd5e1" rx="6" />
  <text x="40" y="271" class="math">• OEC = ∑ w_k · Norm(Metric_k)</text>
  <text x="40" y="290" class="math">• Ship Rule: Driver ↑ AND Guardrails OK</text>
  <text x="40" y="309" class="math">• Offline → Online Gap: Position &amp; Loop Bias</text>
  <text x="40" y="328" class="small">Offline AUC/nDCG must translate to online OEC lift</text>

  <!-- PANEL 2: Statistical Engine (Delta Method & CUPED) -->
  <rect x="310" y="16" width="282" height="338" class="panel" />
  <text x="324" y="40" class="title">2. Statistical Engine: Delta &amp; CUPED</text>
  <text x="324" y="57" class="subtitle">Cluster-robust variance &amp; pre-experiment covariates</text>

  <g transform="translate(324, 74)">
    <rect x="0" y="0" width="254" height="74" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4" rx="6" />
    <text x="12" y="20" class="math" fill="#5b21b6">Ratio Metric R = Ȳ / X̄ (e.g., CTR = C / I)</text>
    <text x="12" y="39" class="math">Var(R) ≈ (1 / n μ_X²) Var(Y_i − R · X_i)</text>
    <text x="12" y="58" class="small" fill="#4c1d95">Linearized residual L_i = Y_i − R_ctrl X_i per user u</text>

    <rect x="0" y="84" width="254" height="74" fill="#fef3c7" stroke="#d97706" stroke-width="1.4" rx="6" />
    <text x="12" y="104" class="math" fill="#92400e">CUPED Variance Reduction:</text>
    <text x="12" y="123" class="math">Ŷ_cuped = Y − θ (X_pre − E[X_pre])</text>
    <text x="12" y="142" class="math" fill="#b45309">Var(Ŷ_cuped) = Var(Y) · (1 − ρ²_{X,Y})</text>
  </g>

  <rect x="324" y="252" width="254" height="88" fill="#f8fafc" stroke="#cbd5e1" rx="6" />
  <text x="334" y="271" class="math">• Sample Size n = 2(z_{α/2}+z_β)² σ² / δ²</text>
  <text x="334" y="290" class="math">• SRM Test: χ² = ∑ (O_k − E_k)² / E_k</text>
  <text x="334" y="309" class="math">• Interference: Switchback &amp; Cluster A/B</text>
  <text x="334" y="328" class="small">Always check SRM p &lt; 0.001 before reading lift!</text>

  <!-- PANEL 3: 8 ML System Design Subdomains -->
  <rect x="604" y="16" width="280" height="338" class="panel" />
  <text x="618" y="40" class="title">3. Subdomain Metric Directory</text>
  <text x="618" y="57" class="subtitle">8 ML System Design verticals covered in depth</text>

  <g transform="translate(618, 72)">
    <rect x="0" y="0" width="252" height="30" fill="#f1f5f9" stroke="#94a3b8" rx="5" />
    <text x="10" y="19" class="math">01. Experimentation Foundations (CUPED, SRM)</text>

    <rect x="0" y="34" width="252" height="30" fill="#dbeafe" stroke="#60a5fa" rx="5" />
    <text x="10" y="53" class="math">02. Ads &amp; Monetization (CTR, COEC, eCPM, ROAS)</text>

    <rect x="0" y="68" width="252" height="30" fill="#dcfce7" stroke="#4ade80" rx="5" />
    <text x="10" y="87" class="math">03. Search &amp; IR (TTFC, Abandonment, Pogo, ZRR)</text>

    <rect x="0" y="102" width="252" height="30" fill="#fef3c7" stroke="#fbbf24" rx="5" />
    <text x="10" y="121" class="math">04. Social Feeds &amp; Video (Watch Time, DAU/MAU)</text>

    <rect x="0" y="136" width="252" height="30" fill="#fce7f3" stroke="#f472b6" rx="5" />
    <text x="10" y="155" class="math">05. E-Commerce &amp; Marketplaces (GMV, RPV, ETA)</text>

    <rect x="0" y="170" width="252" height="30" fill="#ede9fe" stroke="#a78bfa" rx="5" />
    <text x="10" y="189" class="math">06. SaaS, Growth &amp; FinTech (Churn, LTV:CAC)</text>

    <rect x="0" y="204" width="252" height="30" fill="#e0f2fe" stroke="#38bdf8" rx="5" />
    <text x="10" y="223" class="math">07. LLM Agents &amp; Copilots (Persistence, TTFT)</text>

    <rect x="0" y="238" width="252" height="30" fill="#fee2e2" stroke="#f87171" rx="5" />
    <text x="10" y="257" class="math">08. Trust, Safety &amp; Fraud (VVR, Insult Rate)</text>
  </g>
</svg>

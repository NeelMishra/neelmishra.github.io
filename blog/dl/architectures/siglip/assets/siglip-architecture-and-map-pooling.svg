<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" role="img" aria-labelledby="title desc">
  <title id="title">SigLIP and SigLIP 2 Architecture: SoViT-400m/14, Multihead Attention Pooling (MAP), and Pairwise Sigmoid Loss</title>
  <desc id="desc">Architecture diagram of Google SigLIP (Zhai et al., ICCV 2023) and SigLIP 2 (2025) showing the Shape-Optimized Vision Transformer (SoViT-400m/14 with d=1152, L=27, H=16, MLP=4304 and no [CLS] token), Multihead Attention Pooling (MAP head with a learned query probe attending to N patch tokens), Bidirectional Text Transformer, Pairwise Sigmoid Binary Logistic Loss with learned bias b0=-10, and SigLIP 2 multi-task LocCa + NaFlex extensions.</desc>
  <defs>
    <linearGradient id="sigBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbf8f1"/>
      <stop offset="100%" stop-color="#f2ece0"/>
    </linearGradient>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0a8f6a"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font: 800 17px 'Syne', 'Manrope', sans-serif; fill: #14221c; }
      .sub { font: 500 11.5px 'Manrope', sans-serif; fill: #4d5f56; }
      .col-h { font: 800 12.5px 'Manrope', sans-serif; fill: #ffffff; }
      .box-h { font: 700 11.5px 'Manrope', sans-serif; fill: #14221c; }
      .box-b { font: 500 10.5px 'Manrope', sans-serif; fill: #33473e; }
      .mono-g { font: 600 10px 'JetBrains Mono', monospace; fill: #0a6b50; }
      .mono-b { font: 600 10px 'JetBrains Mono', monospace; fill: #1e40af; }
      .mono-p { font: 600 10px 'JetBrains Mono', monospace; fill: #9a3412; }
    </style>
  </defs>

  <rect width="980" height="520" rx="16" fill="url(#sigBg)" stroke="#d8ccb6" stroke-width="1.5"/>

  <text x="24" y="30" class="title">SigLIP &amp; SigLIP 2 Architecture: Shape-Optimized ViT (SoViT-400m/14), MAP Head &amp; Pairwise Sigmoid Loss</text>
  <text x="24" y="48" class="sub">Zhai et al. (ICCV 2023) &amp; Tschannen et al. (2025) — Replacing [CLS] with Multihead Attention Pooling (MAP) and global Softmax with N² independent Sigmoids</text>

  <!-- COLUMN 1: SoViT-400m/14 VISION BACKBONE (x=20..330) -->
  <rect x="20" y="62" width="310" height="360" rx="12" fill="#ffffff" stroke="#0a8f6a" stroke-width="1.8"/>
  <rect x="20" y="62" width="310" height="30" rx="12" fill="#0a8f6a"/>
  <text x="175" y="81" text-anchor="middle" class="col-h">1. VISION BACKBONE: SoViT-400m/14</text>

  <rect x="34" y="102" width="282" height="56" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="175" y="120" text-anchor="middle" class="box-h">Patchify + Learned 2D Pos Embed (NO [CLS]!)</text>
  <text x="175" y="137" text-anchor="middle" class="mono-g">Z₀ = Conv2d(I, P=14) + E_pos ∈ ℝ^(B × N × 1152)</text>
  <text x="175" y="151" text-anchor="middle" class="box-b">224² → N=256 patches  |  384² → N=729 patches</text>

  <rect x="34" y="168" width="282" height="90" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="175" y="186" text-anchor="middle" class="box-h">Shape-Optimized Pre-Norm Encoder (Alabdulmohsin '23)</text>
  <text x="175" y="203" text-anchor="middle" class="mono-g">Depth L = 27 layers  |  Width d_i = 1152</text>
  <text x="175" y="219" text-anchor="middle" class="mono-g">Heads H = 16 (d_h = 72)  |  MLP dim = 4304</text>
  <text x="175" y="236" text-anchor="middle" class="box-b">Matches ViT-g/14 accuracy with &lt;400M params;</text>
  <text x="175" y="250" text-anchor="middle" class="box-b">zero wasted compute on a dummy [CLS] token</text>

  <rect x="34" y="268" width="282" height="140" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="175" y="286" text-anchor="middle" class="box-h">Multihead Attention Pooling (MAP Head)</text>
  <text x="175" y="303" text-anchor="middle" class="box-b">Single learnable query probe q_probe ∈ ℝ^(1 × 1152)</text>
  <text x="175" y="318" text-anchor="middle" class="box-b">cross-attends over all N final patch tokens Z_L:</text>
  <text x="175" y="336" text-anchor="middle" class="mono-p">h' = MCA(Q = q_probe, K = LN(Z_L), V = LN(Z_L))</text>
  <text x="175" y="353" text-anchor="middle" class="mono-p">v_I = h' + MLP(LN(h')) ∈ ℝ^(B × 1152)</text>
  <text x="175" y="371" text-anchor="middle" class="mono-g">x_i = v_I / ||v_I||₂ ∈ 𝕊¹¹⁵¹</text>
  <text x="175" y="396" text-anchor="middle" class="box-b">(Also preserves dense patch tokens Z_L for VLM / LocCa!)</text>

  <!-- COLUMN 2: PAIRWISE SIGMOID LOSS & CHUNKED RING (x=350..650) -->
  <rect x="350" y="62" width="300" height="360" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="1.8"/>
  <rect x="350" y="62" width="300" height="30" rx="12" fill="#d97706"/>
  <text x="500" y="81" text-anchor="middle" class="col-h">2. PAIRWISE SIGMOID LOSS (NO SOFTMAX)</text>

  <rect x="364" y="102" width="272" height="78" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  <text x="500" y="120" text-anchor="middle" class="box-h">Shifted &amp; Scaled Logit Matrix</text>
  <text x="500" y="139" text-anchor="middle" class="mono-p">u_ij = exp(t') · (x_i · y_j) + b</text>
  <text x="500" y="156" text-anchor="middle" class="box-b">Initialized at t' = ln(10) ≈ 2.30,  b = −10.0</text>
  <text x="500" y="171" text-anchor="middle" class="mono-g">b = −10 prevents step-0 negative gradient explosion!</text>

  <rect x="364" y="190" width="272" height="106" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="500" y="208" text-anchor="middle" class="box-h">N² Independent Binary Logistic Losses</text>
  <text x="500" y="226" text-anchor="middle" class="mono-b">z_ij = +1 if i == j (matched pair)</text>
  <text x="500" y="242" text-anchor="middle" class="mono-p">z_ij = −1 if i != j (N² − N negatives)</text>
  <text x="500" y="262" text-anchor="middle" class="mono-g">L = (1/|B|) ∑_i ∑_j log(1 + exp(−z_ij · u_ij))</text>
  <text x="500" y="282" text-anchor="middle" class="box-b">No row/col sum denominator ∑_k exp(u_ik)!</text>

  <rect x="364" y="306" width="272" height="102" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="500" y="324" text-anchor="middle" class="box-h">Memory-Efficient Distributed Ring Chunking</text>
  <text x="500" y="342" text-anchor="middle" class="box-b">Because pairs decouple, each device holds only</text>
  <text x="500" y="357" text-anchor="middle" class="mono-g">B_local = |B| / D embeddings at a time</text>
  <text x="500" y="373" text-anchor="middle" class="box-b">and permutes text chunks around D accelerators</text>
  <text x="500" y="388" text-anchor="middle" class="mono-b">Peak memory: O((|B|/D)²) instead of O(|B|²)</text>

  <!-- COLUMN 3: TEXT TOWER (x=670..960) -->
  <rect x="670" y="62" width="290" height="360" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/>
  <rect x="670" y="62" width="290" height="30" rx="12" fill="#2563eb"/>
  <text x="815" y="81" text-anchor="middle" class="col-h">3. TEXT BACKBONE &amp; POOLING</text>

  <rect x="684" y="102" width="262" height="60" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="815" y="120" text-anchor="middle" class="box-h">SentencePiece Multilingual Tokenizer</text>
  <text x="815" y="137" text-anchor="middle" class="mono-b">C4 / WebLI (32k) or Gemma (256k vocab)</text>
  <text x="815" y="152" text-anchor="middle" class="box-b">Context length L_ctx = 64 tokens</text>

  <rect x="684" y="172" width="262" height="90" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="815" y="190" text-anchor="middle" class="box-h">Transformer Text Tower (L=27 in So400m)</text>
  <text x="815" y="207" text-anchor="middle" class="mono-b">Width d_t = 1152, H = 16, MLP = 4304</text>
  <text x="815" y="224" text-anchor="middle" class="box-b">Shape-matched to SoViT-400m/14;</text>
  <text x="815" y="239" text-anchor="middle" class="box-b">uses MAP head or [EOS] pooling</text>
  <text x="815" y="253" text-anchor="middle" class="mono-b">into shared width d_e = 1152</text>

  <rect x="684" y="272" width="262" height="136" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="815" y="292" text-anchor="middle" class="box-h">Text Head &amp; L2 Unit Hypersphere</text>
  <text x="815" y="312" text-anchor="middle" class="mono-b">u_T = TextPool(H_L) ∈ ℝ^(B × 1152)</text>
  <text x="815" y="332" text-anchor="middle" class="mono-b">y_j = u_T / ||u_T||₂ ∈ 𝕊¹¹⁵¹</text>
  <text x="815" y="356" text-anchor="middle" class="box-b">Zero-shot inference is identical to CLIP:</text>
  <text x="815" y="372" text-anchor="middle" class="mono-g">ŷ = argmax_c (x_i · y_c)</text>
  <text x="815" y="390" text-anchor="middle" class="box-b">(since exp(t')&gt;0 and b are monotonic!)</text>

  <!-- Arrows into Center Sigmoid Loss -->
  <line x1="330" y1="340" x2="350" y2="340" stroke="#0a8f6a" stroke-width="2.2" marker-end="url(#arrG)"/>
  <line x1="670" y1="340" x2="650" y2="340" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrB)"/>

  <!-- BOTTOM BANNER: SIGLIP 2 (2025) ARCHITECTURAL EXTENSIONS -->
  <rect x="20" y="434" width="940" height="72" rx="12" fill="#ffffff" stroke="#d4c8b0" stroke-width="1.5"/>
  <text x="36" y="455" class="box-h">SigLIP 2 (Tschannen et al., 2025) Architectural Upgrades — Same SoViT + MAP Backbone, Stronger Dense &amp; Dynamic Capabilities:</text>
  <text x="36" y="474" class="box-b">1. Multi-Task Pretraining: Combines Sigmoid Loss + LocCa Decoder (captioning, referring expressions &amp; grounded bounding-box coordinates) + Self-Distillation / Masked Patch Prediction.</text>
  <text x="36" y="492" class="box-b">2. NaFlex (Native Aspect Ratio &amp; Flexible Sequence Length): Preserves native image aspect ratio by dynamically interpolating 2D patch position grids on the fly for OCR/document tasks.</text>
</svg>

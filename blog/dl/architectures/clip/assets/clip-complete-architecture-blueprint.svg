<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" role="img" aria-labelledby="title desc">
  <title id="title">OpenAI CLIP Complete Dual-Tower Architecture Blueprint</title>
  <desc id="desc">Complete architecture diagram of OpenAI CLIP (Radford et al., 2021) showing the Vision Tower (Modified ResNet-D with AttentionPool2d or Pre-Norm ViT with ln_pre and QuickGELU), the Text Tower (12-layer causal BPE Transformer pooled at [EOS]), bias-free linear projections W_i and W_t, L2 normalization onto the unit hypersphere, and the N by N cosine similarity matrix scaled by exp(t) with symmetric cross-entropy loss.</desc>
  <defs>
    <linearGradient id="clipBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbf8f1"/>
      <stop offset="100%" stop-color="#f2ece0"/>
    </linearGradient>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0a8f6a"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d97706"/>
    </marker>
    <style>
      .title { font: 800 17px 'Syne', 'Manrope', sans-serif; fill: #14221c; }
      .sub { font: 500 11.5px 'Manrope', sans-serif; fill: #4d5f56; }
      .tower-h { font: 800 12.5px 'Manrope', sans-serif; fill: #ffffff; }
      .box-h { font: 700 11.5px 'Manrope', sans-serif; fill: #14221c; }
      .box-b { font: 500 10.5px 'Manrope', sans-serif; fill: #33473e; }
      .mono-g { font: 600 10px 'JetBrains Mono', monospace; fill: #0a6b50; }
      .mono-b { font: 600 10px 'JetBrains Mono', monospace; fill: #1e40af; }
      .mono-a { font: 600 10px 'JetBrains Mono', monospace; fill: #9a3412; }
    </style>
  </defs>

  <rect width="980" height="520" rx="16" fill="url(#clipBg)" stroke="#d8ccb6" stroke-width="1.5"/>

  <text x="24" y="30" class="title">OpenAI CLIP Architecture: Vision Tower (ResNet-D / Pre-Norm ViT), Causal Text Tower &amp; InfoNCE</text>
  <text x="24" y="48" class="sub">Radford et al. (ICML 2021) — Dual encoders map images and text into a shared unit hypersphere 𝕊^(d_e - 1) via cosine similarity scaled by exp(t) ≤ 100</text>

  <!-- LEFT COLUMN: VISION TOWER (x=20..360) -->
  <rect x="20" y="62" width="340" height="436" rx="12" fill="#ffffff" stroke="#0a8f6a" stroke-width="1.8"/>
  <rect x="20" y="62" width="340" height="30" rx="12" fill="#0a8f6a"/>
  <text x="190" y="81" text-anchor="middle" class="tower-h">VISION TOWER f_θ(I) — TWO BACKBONE FAMILIES</text>

  <!-- Sub-column A: Modified ResNet-D -->
  <rect x="32" y="102" width="152" height="270" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="108" y="120" text-anchor="middle" class="box-h">Family A: Mod. ResNet-D</text>
  <text x="108" y="135" text-anchor="middle" class="mono-g">RN50 / RN101 / RN50x64</text>

  <rect x="40" y="145" width="136" height="46" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="108" y="162" text-anchor="middle" class="box-h">3×Conv(3×3) Deep Stem</text>
  <text x="108" y="178" text-anchor="middle" class="box-b">+ 2×2 AvgPool (no maxpool)</text>

  <rect x="40" y="200" width="136" height="52" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="108" y="217" text-anchor="middle" class="box-h">Anti-Aliased Bottlenecks</text>
  <text x="108" y="232" text-anchor="middle" class="box-b">AvgPool2d(2×2) before</text>
  <text x="108" y="244" text-anchor="middle" class="mono-g">stride-1 1×1 skip conv</text>

  <rect x="40" y="261" width="136" height="98" rx="6" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.3"/>
  <text x="108" y="278" text-anchor="middle" class="box-h">AttentionPool2d Head</text>
  <text x="108" y="294" text-anchor="middle" class="box-b">Flatten 7×7=49 grid,</text>
  <text x="108" y="308" text-anchor="middle" class="box-b">prepend mean x̄ at idx 0,</text>
  <text x="108" y="322" text-anchor="middle" class="mono-g">+ E_pos ∈ ℝ^(50 × 2048)</text>
  <text x="108" y="338" text-anchor="middle" class="box-b">MHA(Q=z₀, K=Z, V=Z)</text>
  <text x="108" y="352" text-anchor="middle" class="mono-g">W_O projects → ℝ^(d_e)</text>

  <!-- Sub-column B: Pre-Norm CLIP ViT -->
  <rect x="196" y="102" width="152" height="270" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.4"/>
  <text x="272" y="120" text-anchor="middle" class="box-h">Family B: CLIP Pre-Norm ViT</text>
  <text x="272" y="135" text-anchor="middle" class="mono-g">B/32, B/16, L/14, L/14@336</text>

  <rect x="204" y="145" width="136" height="46" rx="6" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="272" y="162" text-anchor="middle" class="box-h">Bias-Free Patch Conv2d</text>
  <text x="272" y="178" text-anchor="middle" class="mono-g">kernel=P, stride=P, bias=F</text>

  <rect x="204" y="200" width="136" height="52" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.3"/>
  <text x="272" y="217" text-anchor="middle" class="box-h">[CLS] + E_pos + ln_pre</text>
  <text x="272" y="232" text-anchor="middle" class="mono-a">z₀ = LN_pre([cls; x_p]+E)</text>
  <text x="272" y="245" text-anchor="middle" class="box-b">Extra LN before Block 1</text>

  <rect x="204" y="261" width="136" height="54" rx="6" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="272" y="278" text-anchor="middle" class="box-h">L Pre-Norm Blocks</text>
  <text x="272" y="294" text-anchor="middle" class="box-b">Bidirectional MSA +</text>
  <text x="272" y="308" text-anchor="middle" class="mono-g">QuickGELU(x)=x·σ(1.702x)</text>

  <rect x="204" y="323" width="136" height="40" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="272" y="340" text-anchor="middle" class="box-h">ln_post(z_L⁰) @ W_i</text>
  <text x="272" y="355" text-anchor="middle" class="mono-b">W_i ∈ ℝ^(d_i × d_e), no bias</text>

  <!-- Shared Vision Output -->
  <rect x="32" y="384" width="316" height="98" rx="8" fill="#ecfdf5" stroke="#0a8f6a" stroke-width="1.4"/>
  <text x="190" y="404" text-anchor="middle" class="box-h">Vision Tower Output &amp; L2 Hypersphere Normalization</text>
  <text x="190" y="423" text-anchor="middle" class="mono-g">I_f = image_encoder(I) ∈ ℝ^(N × d_i)  →  v_I = I_f @ W_i ∈ ℝ^(N × d_e)</text>
  <text x="190" y="443" text-anchor="middle" class="mono-g">I_e = v_I / ||v_I||₂ ∈ 𝕊^(d_e - 1)   (unit-norm rows)</text>
  <text x="190" y="464" text-anchor="middle" class="box-b">d_e = 512 (ViT-B/32, ViT-B/16)  |  d_e = 768 (ViT-L/14)  |  d_e = 1024 (RN50)</text>

  <!-- RIGHT COLUMN: TEXT TOWER (x=640..960) -->
  <rect x="640" y="62" width="320" height="436" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/>
  <rect x="640" y="62" width="320" height="30" rx="12" fill="#2563eb"/>
  <text x="800" y="81" text-anchor="middle" class="tower-h">TEXT TOWER g_ϕ(T) — CAUSAL TRANSFORMER</text>

  <rect x="654" y="104" width="292" height="58" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="800" y="122" text-anchor="middle" class="box-h">1. Lowercase BPE Tokenizer (Vocab = 49,408)</text>
  <text x="800" y="139" text-anchor="middle" class="mono-b">[SOS]=49406, tokens..., [EOS]=49407, pad=0</text>
  <text x="800" y="154" text-anchor="middle" class="box-b">Fixed context window L_ctx = 77 tokens</text>

  <rect x="654" y="172" width="292" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="800" y="190" text-anchor="middle" class="box-h">2. Token + Learnable Positional Embedding</text>
  <text x="800" y="207" text-anchor="middle" class="mono-b">H⁰ = W_tok[T] + E_pos_text ∈ ℝ^(B × 77 × d_t)</text>

  <rect x="654" y="234" width="292" height="72" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="800" y="252" text-anchor="middle" class="box-h">3. 12× Causal Pre-Norm Transformer Blocks</text>
  <text x="800" y="269" text-anchor="middle" class="box-b">Autoregressive lower-triangular mask (t attends ≤ t)</text>
  <text x="800" y="285" text-anchor="middle" class="mono-b">QuickGELU MLP  |  proj_std = d_t^(-0.5)·(2L)^(-0.5)</text>
  <text x="800" y="299" text-anchor="middle" class="box-b">Width d_t = 512 (8 heads) or 768 (12 heads in ViT-L)</text>

  <rect x="654" y="316" width="292" height="58" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.3"/>
  <text x="800" y="334" text-anchor="middle" class="box-h">4. [EOS] Token Readout via text.argmax(dim=-1)</text>
  <text x="800" y="350" text-anchor="middle" class="mono-a">eos_idx = T.argmax(dim=-1)  (since [EOS]=49407 is max ID)</text>
  <text x="800" y="365" text-anchor="middle" class="box-b">Only [EOS] has attended to the entire prompt prefix!</text>

  <rect x="654" y="384" width="292" height="98" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="800" y="404" text-anchor="middle" class="box-h">Text Projection W_t &amp; L2 Normalization</text>
  <text x="800" y="423" text-anchor="middle" class="mono-b">T_f = LN_final(H¹²[B, eos_idx]) ∈ ℝ^(N × d_t)</text>
  <text x="800" y="443" text-anchor="middle" class="mono-b">u_T = T_f @ W_t ∈ ℝ^(N × d_e)  (bias-free W_t)</text>
  <text x="800" y="464" text-anchor="middle" class="mono-b">T_e = u_T / ||u_T||₂ ∈ 𝕊^(d_e - 1)</text>

  <!-- CENTER COLUMN: CONTRASTIVE ALIGNMENT & SYMMETRIC INFONCE (x=378..622) -->
  <rect x="378" y="62" width="244" height="436" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="1.8"/>
  <rect x="378" y="62" width="244" height="30" rx="12" fill="#d97706"/>
  <text x="500" y="81" text-anchor="middle" class="tower-h">SHARED HYPERSPHERE &amp; INFONCE</text>

  <rect x="390" y="106" width="220" height="78" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="500" y="125" text-anchor="middle" class="box-h">Scaled Cosine Logit Matrix (N × N)</text>
  <text x="500" y="144" text-anchor="middle" class="mono-a">logits = (I_e @ T_eᵀ) * exp(t)</text>
  <text x="500" y="161" text-anchor="middle" class="box-b">t = ln(1/τ) init at ln(1/0.07) ≈ 2.66</text>
  <text x="500" y="176" text-anchor="middle" class="mono-a">Clamped: exp(t) ≤ 100.0</text>

  <!-- Mini N x N Grid Visualization -->
  <g transform="translate(436, 196)">
    <rect x="0" y="0" width="128" height="128" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <line x1="32" y1="0" x2="32" y2="128" stroke="#cbd5e1"/>
    <line x1="64" y1="0" x2="64" y2="128" stroke="#cbd5e1"/>
    <line x1="96" y1="0" x2="96" y2="128" stroke="#cbd5e1"/>
    <line x1="0" y1="32" x2="128" y2="32" stroke="#cbd5e1"/>
    <line x1="0" y1="64" x2="128" y2="64" stroke="#cbd5e1"/>
    <line x1="0" y1="96" x2="128" y2="96" stroke="#cbd5e1"/>
    <!-- Positive Diagonal -->
    <rect x="0" y="0" width="32" height="32" fill="#10b981" fill-opacity="0.35"/>
    <rect x="32" y="32" width="32" height="32" fill="#10b981" fill-opacity="0.35"/>
    <rect x="64" y="64" width="32" height="32" fill="#10b981" fill-opacity="0.35"/>
    <rect x="96" y="96" width="32" height="32" fill="#10b981" fill-opacity="0.35"/>
    <text x="16" y="20" text-anchor="middle" class="mono-g">+1</text>
    <text x="48" y="52" text-anchor="middle" class="mono-g">+1</text>
    <text x="80" y="84" text-anchor="middle" class="mono-g">+1</text>
    <text x="112" y="116" text-anchor="middle" class="mono-g">+1</text>
  </g>
  <text x="500" y="340" text-anchor="middle" class="box-b">N=32,768 positives on diagonal;</text>
  <text x="500" y="354" text-anchor="middle" class="box-b">N² − N ≈ 1.07B in-batch negatives</text>

  <rect x="390" y="368" width="220" height="114" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.3"/>
  <text x="500" y="388" text-anchor="middle" class="box-h">Symmetric InfoNCE Loss</text>
  <text x="500" y="406" text-anchor="middle" class="mono-a">labels = arange(N)</text>
  <text x="500" y="423" text-anchor="middle" class="mono-a">L_i = CE(logits, labels, axis=1)</text>
  <text x="500" y="440" text-anchor="middle" class="mono-a">L_t = CE(logits, labels, axis=0)</text>
  <text x="500" y="458" text-anchor="middle" class="mono-g">L_CLIP = 0.5 * (L_i + L_t)</text>
  <text x="500" y="474" text-anchor="middle" class="box-b">Row softmax (I→T) + Col softmax (T→I)</text>

  <!-- Arrows from Vision & Text outputs into Center Logits -->
  <path d="M 360 432 L 385 432" stroke="#0a8f6a" stroke-width="2.2" marker-end="url(#arrGreen)"/>
  <path d="M 640 432 L 615 432" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrBlue)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 370" role="img" aria-labelledby="title desc"><title id="title">Transformer architecture families</title><desc id="desc">An encoder sees all observed source tokens. A decoder sees a causal prefix. An encoder-decoder uses source cross-attention alongside causal target self-attention.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#53655d"/></marker></defs><rect width="680" height="370" rx="14" fill="#faf8f1"/><style>text{font-family:Arial,sans-serif;fill:#283a32}.small{font-size:17px}.label{font-size:20px;font-weight:700}.muted{fill:#657369}.line{fill:none;stroke:#53655d;stroke-width:2;marker-end:url(#arrow)}</style><text x="340" y="35" class="label" text-anchor="middle">CHOOSE THE INFORMATION GRAPH</text><rect x="25" y="80" width="190" height="74" rx="9" fill="#e3f0e7" stroke="#a6bdb0"/><text x="120.0" y="114.0" class="label" text-anchor="middle">Encoder</text><text x="120.0" y="139.0" class="small" text-anchor="middle">Observed input</text><rect x="245" y="80" width="190" height="74" rx="9" fill="#e3f0e7" stroke="#a6bdb0"/><text x="340.0" y="114.0" class="label" text-anchor="middle">Decoder</text><text x="340.0" y="139.0" class="small" text-anchor="middle">Target prefix</text><rect x="465" y="80" width="190" height="74" rx="9" fill="#e3f0e7" stroke="#a6bdb0"/><text x="560.0" y="114.0" class="label" text-anchor="middle">Encoder–decoder</text><text x="560.0" y="139.0" class="small" text-anchor="middle">Source + target</text><rect x="25" y="190" width="190" height="92" rx="9" fill="#e3f0e7" stroke="#a6bdb0"/><text x="120.0" y="233.0" class="label" text-anchor="middle">Bidirectional</text><text x="120.0" y="258.0" class="small" text-anchor="middle">All valid source keys</text><path class="line" d="M120 154L120 188"/><rect x="245" y="190" width="190" height="92" rx="9" fill="#f6e9da" stroke="#a6bdb0"/><text x="340.0" y="233.0" class="label" text-anchor="middle">Causal</text><text x="340.0" y="258.0" class="small" text-anchor="middle">Earlier keys + self</text><path class="line" d="M340 154L340 188"/><rect x="465" y="190" width="190" height="92" rx="9" fill="#edf0f7" stroke="#a6bdb0"/><text x="560.0" y="233.0" class="label" text-anchor="middle">Causal + cross</text><text x="560.0" y="258.0" class="small" text-anchor="middle">Prefix + source keys</text><path class="line" d="M560 154L560 188"/><text x="340" y="327" class="small" text-anchor="middle">The objective determines which unavailable information is predicted.</text></svg>

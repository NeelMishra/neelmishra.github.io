<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" role="img" aria-labelledby="title desc"><title id="title">Kimi K3 component map</title><desc id="desc">KDA and NoPE MLA mix tokens. MLA stores a compressed token history. Latent MoE routes feed-forward functions. Block AttnRes weights depth sources.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#53655d"/></marker></defs><rect width="680" height="440" rx="14" fill="#faf8f1"/><style>text{font-family:Arial,sans-serif;fill:#283a32}.small{font-size:17px}.label{font-size:20px;font-weight:700}.muted{fill:#657369}.line{fill:none;stroke:#53655d;stroke-width:2;marker-end:url(#arrow)}</style><text x="340" y="35" class="label" text-anchor="middle">KIMI K3 · FOUR SEPARATE DECISIONS</text><rect x="30" y="80" width="300" height="110" rx="9" fill="#e3f0e7" stroke="#a6bdb0"/><text x="180.0" y="132.0" class="label" text-anchor="middle">Token mixer</text><text x="180.0" y="157.0" class="small" text-anchor="middle">69 KDA + 24 MLA layers</text><rect x="350" y="80" width="300" height="110" rx="9" fill="#edf0f7" stroke="#a6bdb0"/><text x="500.0" y="132.0" class="label" text-anchor="middle">Attention state</text><text x="500.0" y="157.0" class="small" text-anchor="middle">512-wide joint KV latent</text><rect x="30" y="220" width="300" height="110" rx="9" fill="#f6e9da" stroke="#a6bdb0"/><text x="180.0" y="272.0" class="label" text-anchor="middle">Feed-forward path</text><text x="180.0" y="297.0" class="small" text-anchor="middle">896 routed experts; select 16</text><rect x="350" y="220" width="300" height="110" rx="9" fill="#e3f0e7" stroke="#a6bdb0"/><text x="500.0" y="272.0" class="label" text-anchor="middle">Depth aggregation</text><text x="500.0" y="297.0" class="small" text-anchor="middle">Block AttnRes; groups of 12</text><text x="340" y="373" class="small" text-anchor="middle">Shared experts and the residual stream retain separate roles.</text><text x="340" y="407" class="small" text-anchor="middle">Architecture snapshot: July 2026 report + pinned official configuration.</text></svg>

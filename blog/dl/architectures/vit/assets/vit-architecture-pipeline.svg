<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" role="img" aria-labelledby="title desc">
  <title id="title">Vision Transformer (ViT) End-to-End Architecture Pipeline</title>
  <desc id="desc">Step-by-step architecture diagram of the Vision Transformer (Dosovitskiy et al., 2020): 224x224x3 input image split into N=196 patches of 16x16x3, projected via stride-16 Conv2d to 768-dim patch tokens, prepended with a learnable [CLS] token, summed with 197x768 learnable 1D positional embeddings (with 2D bicubic interpolation for higher resolutions), processed through L Pre-Norm Transformer Encoder blocks with global self-attention, and pooled at token 0 for classification.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbf8f1"/>
      <stop offset="100%" stop-color="#f3ede0"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0a8f6a"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font: 800 17px 'Syne', 'Manrope', sans-serif; fill: #14221c; }
      .sub { font: 500 11.5px 'Manrope', sans-serif; fill: #4d5f56; }
      .card-h { font: 700 12.5px 'Manrope', sans-serif; fill: #14221c; }
      .card-b { font: 500 11px 'Manrope', sans-serif; fill: #33473e; }
      .mono { font: 600 10.5px 'JetBrains Mono', monospace; fill: #0a6b50; }
      .mono-b { font: 600 10.5px 'JetBrains Mono', monospace; fill: #1e40af; }
      .mono-p { font: 600 10.5px 'JetBrains Mono', monospace; fill: #9a3412; }
      .badge { font: 700 10px 'Manrope', sans-serif; fill: #ffffff; }
    </style>
  </defs>

  <rect width="980" height="470" rx="16" fill="url(#bgGrad)" stroke="#d8ccb6" stroke-width="1.5"/>

  <text x="26" y="32" class="title">Vision Transformer (ViT) Architecture: Patchify, [CLS] Token, 1D/2D Position &amp; Pre-Norm Encoder</text>
  <text x="26" y="50" class="sub">Dosovitskiy et al. (ICLR 2021) — Turning an H×W×C image into N = (H/P)·(W/P) non-overlapping patch tokens with global self-attention from Layer 1</text>

  <!-- Stage 1: Input Image & Patch Grid -->
  <rect x="22" y="68" width="190" height="275" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="22" y="68" width="190" height="28" rx="12" fill="#0f766e"/>
  <text x="117" y="86" text-anchor="middle" class="badge">1. PATCHIFY (P = 16)</text>

  <!-- 4x4 visual grid representing 14x14 patches -->
  <g transform="translate(53, 108)">
    <rect x="0" y="0" width="128" height="128" fill="#e6f4ef" stroke="#0a8f6a" stroke-width="1.5"/>
    <line x1="32" y1="0" x2="32" y2="128" stroke="#0a8f6a" stroke-width="1" stroke-dasharray="3,2"/>
    <line x1="64" y1="0" x2="64" y2="128" stroke="#0a8f6a" stroke-width="1" stroke-dasharray="3,2"/>
    <line x1="96" y1="0" x2="96" y2="128" stroke="#0a8f6a" stroke-width="1" stroke-dasharray="3,2"/>
    <line x1="0" y1="32" x2="128" y2="32" stroke="#0a8f6a" stroke-width="1" stroke-dasharray="3,2"/>
    <line x1="0" y1="64" x2="128" y2="64" stroke="#0a8f6a" stroke-width="1" stroke-dasharray="3,2"/>
    <line x1="0" y1="96" x2="128" y2="96" stroke="#0a8f6a" stroke-width="1" stroke-dasharray="3,2"/>
    <rect x="0" y="0" width="32" height="32" fill="#0a8f6a" fill-opacity="0.28"/>
    <text x="16" y="20" text-anchor="middle" class="mono">p₁</text>
    <text x="48" y="20" text-anchor="middle" class="mono">p₂</text>
    <text x="112" y="116" text-anchor="middle" class="mono">p_N</text>
  </g>
  <text x="117" y="256" text-anchor="middle" class="card-h">Input Image I ∈ ℝ^(224×224×3)</text>
  <text x="117" y="274" text-anchor="middle" class="card-b">Grid: (224/16) × (224/16) = 14×14</text>
  <text x="117" y="292" text-anchor="middle" class="mono">N = 196 patches</text>
  <text x="117" y="310" text-anchor="middle" class="card-b">Each patch: 16×16×3 = 768 vals</text>
  <text x="117" y="328" text-anchor="middle" class="mono">x_p ∈ ℝ^(196 × 768)</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="212" y1="205" x2="236" y2="205" stroke="#0a8f6a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 2: Linear Projection / Conv2d Stem & [CLS] + Pos Embedding -->
  <rect x="240" y="68" width="246" height="275" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="240" y="68" width="246" height="28" rx="12" fill="#1d4ed8"/>
  <text x="363" y="86" text-anchor="middle" class="badge">2. PATCH STEM + [CLS] + E_pos</text>

  <rect x="254" y="106" width="218" height="62" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="363" y="124" text-anchor="middle" class="card-h">Linear Projection E ∈ ℝ^(768×d)</text>
  <text x="363" y="141" text-anchor="middle" class="mono-b">Conv2d(3, d, kernel=16, stride=16)</text>
  <text x="363" y="157" text-anchor="middle" class="card-b">Exact hardware-fused equivalent</text>

  <rect x="254" y="178" width="218" height="72" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.2"/>
  <text x="363" y="196" text-anchor="middle" class="card-h">Prepend Learnable [CLS] Token</text>
  <text x="363" y="213" text-anchor="middle" class="mono-p">x_cls ∈ ℝ^(1 × d) at index 0</text>
  <text x="363" y="230" text-anchor="middle" class="card-b">Sequence grows: 196 → 197 tokens</text>
  <text x="363" y="244" text-anchor="middle" class="mono">[x_cls ; x_p¹E ; ... ; x_p¹⁹⁶E]</text>

  <rect x="254" y="260" width="218" height="70" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
  <text x="363" y="278" text-anchor="middle" class="card-h">+ Learnable 1D Pos Embedding</text>
  <text x="363" y="295" text-anchor="middle" class="mono">z₀ = [x_cls; x_p E] + E_pos</text>
  <text x="363" y="313" text-anchor="middle" class="card-b">E_pos ∈ ℝ^((N+1) × d) = ℝ^(197 × 768)</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="486" y1="205" x2="510" y2="205" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Stage 3: L Pre-Norm Transformer Encoder Blocks -->
  <rect x="514" y="68" width="246" height="275" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="514" y="68" width="246" height="28" rx="12" fill="#0f766e"/>
  <text x="637" y="86" text-anchor="middle" class="badge">3. PRE-NORM ENCODER (× L Layers)</text>

  <rect x="528" y="106" width="218" height="96" rx="8" fill="#f0fdf4" stroke="#6ee7b7" stroke-width="1.2"/>
  <text x="637" y="124" text-anchor="middle" class="card-h">Sub-layer 1: Pre-Norm Multi-Head Attn</text>
  <text x="637" y="143" text-anchor="middle" class="mono">z'_ℓ = z_{ℓ-1} + MSA(LN(z_{ℓ-1}))</text>
  <text x="637" y="161" text-anchor="middle" class="card-b">Bidirectional (no causal mask): every</text>
  <text x="637" y="176" text-anchor="middle" class="card-b">patch attends to all 197 tokens from L=1</text>
  <text x="637" y="192" text-anchor="middle" class="mono-b">Attn Matrix: 197 × 197 per head</text>

  <rect x="528" y="212" width="218" height="82" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="637" y="230" text-anchor="middle" class="card-h">Sub-layer 2: Pre-Norm 4d MLP</text>
  <text x="637" y="249" text-anchor="middle" class="mono-b">z_ℓ = z'_ℓ + MLP(LN(z'_ℓ))</text>
  <text x="637" y="267" text-anchor="middle" class="card-b">d → 4d → d with GELU activation</text>
  <text x="637" y="283" text-anchor="middle" class="mono">ViT-B: 768 → 3072 → 768</text>

  <text x="637" y="316" text-anchor="middle" class="card-b">ViT-B: L=12, d=768, H=12 (d_h=64)</text>
  <text x="637" y="332" text-anchor="middle" class="card-b">ViT-L: L=24, d=1024, H=16 (d_h=64)</text>

  <!-- Arrow 3 -> 4 -->
  <line x1="760" y1="205" x2="784" y2="205" stroke="#0a8f6a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 4: Final LN & Readout Head -->
  <rect x="788" y="68" width="170" height="275" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="788" y="68" width="170" height="28" rx="12" fill="#b45309"/>
  <text x="873" y="86" text-anchor="middle" class="badge">4. [CLS] READOUT</text>

  <rect x="800" y="108" width="146" height="68" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.2"/>
  <text x="873" y="128" text-anchor="middle" class="card-h">Slice Token Index 0</text>
  <text x="873" y="146" text-anchor="middle" class="mono-p">y = LN(z_L⁰) ∈ ℝ^d</text>
  <text x="873" y="163" text-anchor="middle" class="card-b">Global image summary</text>

  <rect x="800" y="188" width="146" height="68" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="873" y="207" text-anchor="middle" class="card-h">Supervised ViT Head</text>
  <text x="873" y="224" text-anchor="middle" class="mono">Linear(d → K classes)</text>
  <text x="873" y="241" text-anchor="middle" class="card-b">Cross-Entropy Loss</text>

  <rect x="800" y="266" width="146" height="66" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.2"/>
  <text x="873" y="285" text-anchor="middle" class="card-h">CLIP ViT Head</text>
  <text x="873" y="302" text-anchor="middle" class="mono">ŷ = normalize(y W_i)</text>
  <text x="873" y="319" text-anchor="middle" class="card-b">Cosine InfoNCE Loss</text>

  <!-- Bottom Banner: 2D Bicubic Interpolation & Inductive Bias Summary -->
  <rect x="22" y="358" width="936" height="94" rx="12" fill="#ffffff" stroke="#d4c8b0" stroke-width="1.5"/>
  <text x="38" y="381" class="card-h">Resolution Scaling via 2D Bicubic Interpolation of E_pos &amp; Inductive Bias Trade-off:</text>
  <text x="38" y="401" class="card-b">• Changing input resolution H'×W' (e.g., 224² → 336² or 384²) keeps patch size P fixed, increasing patch count N = (H'/P)(W'/P) while keeping all weights E, MSA, MLP unchanged.</text>
  <text x="38" y="419" class="card-b">• Only E_pos changes length: keep E_pos[0] ([CLS]) intact, reshape E_pos[1:] from ℝ^(14×14×d) → 2D bicubic interpolate to ℝ^((H'/P)×(W'/P)×d) → flatten back to sequence.</text>
  <text x="38" y="437" class="mono">Inductive Bias: CNNs hard-code 2D locality + translation equivariance in every layer; ViT has only patch/pos locality and learns global geometry from data scale.</text>
</svg>

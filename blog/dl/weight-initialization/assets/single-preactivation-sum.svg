<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-label="Single neuron preactivation diagram showing n_in inputs a_1, a_2, ..., a_{n_in} multiplied by weights W_1, W_2, ..., W_{n_in} and summed to form z = sum_{j=1}^{n_in} W_j a_j with second moment E[z^2] = n_in s_W^2 q.">
  <defs>
    <marker id="arrow-edge" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#137b68"/>
    </marker>
    <marker id="arrow-out" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#477fa2"/>
    </marker>
  </defs>

  <rect width="900" height="340" rx="16" fill="#f4f7f2"/>

  <g font-family="system-ui, -apple-system, sans-serif" fill="#173d35">
    <!-- Title -->
    <text x="30" y="36" font-size="19" font-weight="700">Single hidden unit preactivation: z = ∑ⱼ₌₁ⁿⁱⁿ Wⱼ aⱼ</text>

    <!-- Left column header -->
    <text x="115" y="68" font-size="14" font-weight="700" fill="#173d35" text-anchor="middle">nᵢₙ inputs aⱼ</text>
    <text x="115" y="86" font-size="13" fill="#3c5a52" text-anchor="middle">E[aⱼ²] = q</text>

    <!-- Middle column header -->
    <text x="315" y="68" font-size="14" font-weight="700" fill="#137b68" text-anchor="middle">Independent weights Wⱼ</text>
    <text x="315" y="86" font-size="13" fill="#3c5a52" text-anchor="middle">E[Wⱼ] = 0,  Var(Wⱼ) = E[Wⱼ²] = s_W²</text>

    <!-- Edges from inputs a_j to summation node z -->
    <line x1="149" y1="120" x2="466" y2="176" stroke="#137b68" stroke-width="2.6" marker-end="url(#arrow-edge)"/>
    <line x1="149" y1="184" x2="464" y2="188" stroke="#137b68" stroke-width="2.6" marker-end="url(#arrow-edge)"/>
    <line x1="149" y1="276" x2="466" y2="202" stroke="#137b68" stroke-width="2.6" marker-end="url(#arrow-edge)"/>

    <!-- Edge weight pills -->
    <rect x="248" y="122" width="110" height="28" rx="6" fill="#ffffff" stroke="#cde0da" stroke-width="1.2"/>
    <text x="303" y="141" font-size="14" font-weight="700" fill="#137b68" text-anchor="middle">× W₁  →  W₁a₁</text>

    <rect x="248" y="171" width="110" height="28" rx="6" fill="#ffffff" stroke="#cde0da" stroke-width="1.2"/>
    <text x="303" y="190" font-size="14" font-weight="700" fill="#137b68" text-anchor="middle">× W₂  →  W₂a₂</text>

    <rect x="236" y="236" width="134" height="28" rx="6" fill="#ffffff" stroke="#cde0da" stroke-width="1.2"/>
    <text x="303" y="255" font-size="14" font-weight="700" fill="#137b68" text-anchor="middle">× Wₙᵢₙ  →  Wₙᵢₙaₙᵢₙ</text>

    <!-- Ellipsis dots between a_2 and a_{n_in} -->
    <circle cx="115" cy="221" r="2.8" fill="#3c5a52"/>
    <circle cx="115" cy="231" r="2.8" fill="#3c5a52"/>
    <circle cx="115" cy="241" r="2.8" fill="#3c5a52"/>

    <circle cx="303" cy="211" r="2.4" fill="#3c5a52"/>
    <circle cx="303" cy="219" r="2.4" fill="#3c5a52"/>
    <circle cx="303" cy="227" r="2.4" fill="#3c5a52"/>

    <!-- Input nodes a_1, a_2, a_{n_in} -->
    <circle cx="115" cy="120" r="28" fill="#173d35"/>
    <text x="115" y="126" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">a₁</text>

    <circle cx="115" cy="184" r="28" fill="#173d35"/>
    <text x="115" y="190" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">a₂</text>

    <circle cx="115" cy="276" r="28" fill="#173d35"/>
    <text x="115" y="282" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">aₙᵢₙ</text>

    <!-- Summation neuron z -->
    <circle cx="518" cy="190" r="44" fill="#137b68"/>
    <text x="518" y="184" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">∑ z</text>
    <text x="518" y="205" font-size="12" fill="#e6f5f1" text-anchor="middle">W₁a₁ + ··· + Wₙᵢₙaₙᵢₙ</text>

    <!-- Arrow from summation node z to output summary box -->
    <line x1="564" y1="190" x2="628" y2="190" stroke="#477fa2" stroke-width="3" marker-end="url(#arrow-out)"/>

    <!-- Output preactivation card -->
    <rect x="638" y="118" width="232" height="144" rx="12" fill="#ffffff" stroke="#477fa2" stroke-width="2"/>
    <text x="754" y="148" font-size="15" font-weight="700" fill="#477fa2" text-anchor="middle">Preactivation z</text>
    <text x="754" y="176" font-size="15" font-weight="600" fill="#173d35" text-anchor="middle">z = ∑ⱼ₌₁ⁿⁱⁿ Wⱼ aⱼ</text>
    <line x1="658" y1="190" x2="850" y2="190" stroke="#dde7e3" stroke-width="1.2"/>
    <text x="754" y="216" font-size="14" font-weight="600" fill="#173d35" text-anchor="middle">Mean:  E[z] = 0</text>
    <text x="754" y="242" font-size="14" font-weight="700" fill="#b66929" text-anchor="middle">Scale:  E[z²] = nᵢₙ · s_W² · q</text>

    <!-- Bottom caption inside SVG -->
    <text x="30" y="322" font-size="13.5" fill="#3c5a52">Each of the nᵢₙ incoming paths contributes E[(Wⱼaⱼ)²] = s_W² q to the sum, while cross terms E[WⱼWₖaⱼaₖ] (j ≠ k) cancel to zero.</text>
  </g>
</svg>

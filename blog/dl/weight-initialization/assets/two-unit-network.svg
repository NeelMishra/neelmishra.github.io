<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-label="Two-unit hidden layer network f(x) = v1 phi(u1^T x + b1) + v2 phi(u2^T x + b2) with forward pass and backward gradient delta = dl/df">
  <defs>
    <marker id="arrow-fwd-1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#137b68"/>
    </marker>
    <marker id="arrow-fwd-2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#b66929"/>
    </marker>
    <marker id="arrow-fwd-out" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#477fa2"/>
    </marker>
    <marker id="arrow-bwd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#9c2f2f"/>
    </marker>
  </defs>

  <rect width="900" height="340" rx="16" fill="#f4f7f2"/>

  <g font-family="system-ui, -apple-system, sans-serif" fill="#173d35">
    <!-- Title & Legend -->
    <text x="30" y="36" font-size="20" font-weight="700">Two-unit hidden layer: f(x) = v₁ ϕ(u₁ᵀx + b₁) + v₂ ϕ(u₂ᵀx + b₂)</text>
    <g font-size="13" fill="#3c5a52">
      <line x1="600" y1="31" x2="632" y2="31" stroke="#137b68" stroke-width="2.5" marker-end="url(#arrow-fwd-1)"/>
      <text x="640" y="35">Forward signal</text>
      <line x1="745" y1="31" x2="777" y2="31" stroke="#9c2f2f" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow-bwd)"/>
      <text x="785" y="35" fill="#9c2f2f">Backward gradient</text>
    </g>

    <!-- Forward edges: Input x to Hidden Units -->
    <line x1="126" y1="168" x2="322" y2="104" stroke="#137b68" stroke-width="3" marker-end="url(#arrow-fwd-1)"/>
    <line x1="126" y1="192" x2="322" y2="256" stroke="#b66929" stroke-width="3" marker-end="url(#arrow-fwd-2)"/>

    <!-- Edge labels: u1, b1 and u2, b2 -->
    <rect x="172" y="96" width="112" height="28" rx="6" fill="#ffffff" stroke="#cde0da" stroke-width="1"/>
    <text x="228" y="115" font-size="15" font-weight="600" fill="#137b68" text-anchor="middle">u₁ᵀx + b₁</text>

    <rect x="172" y="236" width="112" height="28" rx="6" fill="#ffffff" stroke="#ead5c3" stroke-width="1"/>
    <text x="228" y="255" font-size="15" font-weight="600" fill="#b66929" text-anchor="middle">u₂ᵀx + b₂</text>

    <!-- Forward edges: Hidden Units to Output f(x) -->
    <line x1="454" y1="104" x2="626" y2="166" stroke="#137b68" stroke-width="3" marker-end="url(#arrow-fwd-1)"/>
    <line x1="454" y1="256" x2="626" y2="194" stroke="#b66929" stroke-width="3" marker-end="url(#arrow-fwd-2)"/>

    <!-- Edge labels: v1 and v2 -->
    <rect x="518" y="100" width="46" height="26" rx="6" fill="#ffffff" stroke="#cde0da" stroke-width="1"/>
    <text x="541" y="118" font-size="15" font-weight="700" fill="#137b68" text-anchor="middle">v₁</text>

    <rect x="518" y="234" width="46" height="26" rx="6" fill="#ffffff" stroke="#ead5c3" stroke-width="1"/>
    <text x="541" y="252" font-size="15" font-weight="700" fill="#b66929" text-anchor="middle">v₂</text>

    <!-- Backward dashed arrows: from f(x) back to hidden units -->
    <path d="M 622 152 Q 540 122 458 88" fill="none" stroke="#9c2f2f" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow-bwd)"/>
    <text x="558" y="88" font-size="13" font-weight="600" fill="#9c2f2f" text-anchor="middle">δ · v₁ ϕ′(z₁)</text>

    <path d="M 622 208 Q 540 238 458 272" fill="none" stroke="#9c2f2f" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow-bwd)"/>
    <text x="558" y="284" font-size="13" font-weight="600" fill="#9c2f2f" text-anchor="middle">δ · v₂ ϕ′(z₂)</text>

    <!-- Forward & backward between Output f(x) and Loss l -->
    <line x1="696" y1="173" x2="778" y2="173" stroke="#477fa2" stroke-width="3" marker-end="url(#arrow-fwd-out)"/>
    <line x1="780" y1="191" x2="698" y2="191" stroke="#9c2f2f" stroke-width="2.2" stroke-dasharray="5,4" marker-end="url(#arrow-bwd)"/>
    <text x="739" y="214" font-size="14" font-weight="700" fill="#9c2f2f" text-anchor="middle">δ = ∂ℓ/∂f</text>

    <!-- Node: Input x -->
    <circle cx="92" cy="180" r="34" fill="#173d35"/>
    <text x="92" y="186" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">x</text>
    <text x="92" y="234" font-size="14" fill="#3c5a52" text-anchor="middle">Input vector</text>

    <!-- Node: Hidden Unit 1 -->
    <rect x="328" y="64" width="122" height="64" rx="32" fill="#137b68"/>
    <text x="389" y="92" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Unit 1</text>
    <text x="389" y="113" font-size="14" fill="#e6f5f1" text-anchor="middle">h₁ = ϕ(z₁)</text>

    <!-- Node: Hidden Unit 2 -->
    <rect x="328" y="232" width="122" height="64" rx="32" fill="#b66929"/>
    <text x="389" y="260" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Unit 2</text>
    <text x="389" y="281" font-size="14" fill="#fdf3eb" text-anchor="middle">h₂ = ϕ(z₂)</text>

    <!-- Node: Output f(x) -->
    <circle cx="660" cy="180" r="36" fill="#477fa2"/>
    <text x="660" y="177" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">f(x)</text>
    <text x="660" y="196" font-size="12" fill="#e8f1f6" text-anchor="middle">v₁h₁ + v₂h₂</text>

    <!-- Node: Loss l -->
    <rect x="784" y="150" width="76" height="60" rx="12" fill="#ffffff" stroke="#9c2f2f" stroke-width="2.5"/>
    <text x="822" y="178" font-size="18" font-weight="700" fill="#9c2f2f" text-anchor="middle">ℓ(f)</text>
    <text x="822" y="197" font-size="12" fill="#9c2f2f" text-anchor="middle">Loss</text>

    <!-- Bottom summary caption inside SVG -->
    <text x="30" y="322" font-size="14" fill="#3c5a52">Each unit j ∈ {1, 2} computes preactivation zⱼ = uⱼᵀx + bⱼ, activation hⱼ = ϕ(zⱼ), and receives backward signal δ · vⱼ ϕ′(zⱼ).</text>
  </g>
</svg>

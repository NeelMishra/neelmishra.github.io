<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 365" role="img" aria-label="Initialize the branch in the context of the whole network"><rect width="900" height="365" rx="16" fill="#f4f7f2"/><g font-family="system-ui,sans-serif" fill="#173d35"><text x="30" y="40" font-size="23">Initialize the branch in the context of the whole network</text><text x="35" y="90" font-size="20">Identity path plus a scaled branch</text><polyline points="50.000,220.000 180.000,220.000 180.000,135.000 380.000,135.000 380.000,220.000 465.000,220.000" fill="none" stroke="#137b68" stroke-width="3"/><polyline points="180.000,220.000 180.000,280.000 380.000,280.000 380.000,220.000" fill="none" stroke="#b66929" stroke-width="3"/><text x="210" y="120" font-size="20">h</text><text x="208" y="265" font-size="20">α F(h)</text><text x="40" y="255" font-size="18">Input h</text><text x="410" y="255" font-size="18">Sum</text><circle cx="380" cy="220" r="18" fill="#f4f7f2" stroke="#173d35"/><text x="372" y="227" font-size="24">+</text><text x="510" y="135" font-size="17">Uncorrelated, equal-variance approximation:</text><text x="550" y="190" font-size="25">q next = (1 + α²) q</text><text x="530" y="245" font-size="20">α = 1: factor 2 per block</text><text x="530" y="295" font-size="20">α = 1/√L: factor 1 + 1/L</text></g></svg>
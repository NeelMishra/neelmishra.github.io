<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" role="img" aria-label="The factor of two compensates for the activation"><rect width="900" height="370" rx="16" fill="#f4f7f2"/><g font-family="system-ui,sans-serif" fill="#173d35"><text x="30" y="40" font-size="23">The factor of two compensates for the activation</text><text x="30" y="90" font-size="17">Green: ReLU     Orange: leaky ReLU, a = 0.2</text><polyline points="50.000,280.000 240.000,280.000 430.000,120.000" fill="none" stroke="#137b68" stroke-width="3"/><polyline points="50.000,312.000 240.000,280.000 430.000,120.000" fill="none" stroke="#b66929" stroke-width="2"/><text x="490" y="125" font-size="20">For Gaussian preactivation q = 2:</text><text x="520" y="175" font-size="20">Second moment after ReLU = 1</text><text x="520" y="220" font-size="20">Mean after ReLU ≈ 0.564</text><text x="520" y="265" font-size="20">Variance after ReLU ≈ 0.682</text><text x="30" y="345" font-size="17">The negative half of squared magnitude is removed; the mean becomes positive.</text></g></svg>
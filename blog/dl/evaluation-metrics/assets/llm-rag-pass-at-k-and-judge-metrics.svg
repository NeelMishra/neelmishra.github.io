<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" role="img" aria-labelledby="title desc">
  <title id="title">Modern LLM, RAG, Code Execution, and Judge Evaluation Metrics</title>
  <desc id="desc">Three-panel diagram illustrating (1) Unbiased pass@k hypergeometric estimator vs. Majority Voting Maj@k for code and reasoning; (2) The RAGAS Triad (Context Precision, Context Recall, Faithfulness, and Answer Relevance) plus atomic FActScore; and (3) Pairwise Bradley-Terry Elo, Length-Controlled Win Rate, and Rogan-Gladen judge bias correction.</desc>
  <defs>
    <style>
      .bg { fill: #f8f6f1; }
      .panel { fill: #ffffff; stroke: #d5cfc2; stroke-width: 1.5; rx: 12; }
      .title { font: 700 14px "Inter", "Segoe UI", sans-serif; fill: #1e293b; }
      .subtitle { font: 600 11.5px "Inter", "Segoe UI", sans-serif; fill: #475569; }
      .label { font: 500 11px "Inter", "Segoe UI", sans-serif; fill: #334155; }
      .math { font: 600 11px "Cambria Math", "STIX Two Math", "Georgia", serif; fill: #0f172a; }
      .small { font: 500 10px "Inter", "Segoe UI", sans-serif; fill: #64748b; }
      .axis { stroke: #64748b; stroke-width: 1.3; }
      .curve-pass { fill: none; stroke: #2563eb; stroke-width: 2.3; }
      .curve-maj { fill: none; stroke: #0d9488; stroke-width: 2.2; stroke-dasharray: 5 3; }
      .node-box { fill: #f8fafc; stroke: #64748b; stroke-width: 1.5; rx: 6; }
    </style>
  </defs>

  <rect width="900" height="370" class="bg" />

  <!-- PANEL 1: Code & Reasoning pass@k vs Maj@k -->
  <rect x="16" y="16" width="282" height="338" class="panel" />
  <text x="30" y="40" class="title">1. Code &amp; Reasoning: pass@k &amp; Maj@k</text>
  <text x="30" y="57" class="subtitle">Unbiased hypergeometric estimator from n samples</text>

  <g transform="translate(36, 74)">
    <line x1="20" y1="126" x2="232" y2="126" class="axis" />
    <line x1="20" y1="10" x2="20" y2="126" class="axis" />

    <!-- pass@k curve -->
    <path d="M 20 96 Q 82 36, 232 14" class="curve-pass" />
    <!-- Maj@k curve -->
    <path d="M 20 96 Q 82 64, 232 48" class="curve-maj" />

    <!-- Verification gap arrow -->
    <line x1="185" y1="22" x2="185" y2="52" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="3 2" />
    <text x="115" y="42" class="small" fill="#b91c1c">Verification gap</text>

    <text x="116" y="18" class="math" fill="#1d4ed8">pass@k (oracle verifier)</text>
    <text x="118" y="68" class="math" fill="#0f766e">Maj@k (self-consistency)</text>
    <text x="58" y="142" class="small">Number of samples k (log scale)</text>
    <text x="0" y="18" class="small">1.0</text>
    <text x="4" y="126" class="small">0</text>
  </g>

  <rect x="30" y="226" width="254" height="114" fill="#f8fafc" stroke="#cbd5e1" rx="6" />
  <text x="40" y="245" class="math" fill="#1d4ed8">• pass@k = 1 − C(n − c, k) / C(n, k)</text>
  <text x="40" y="264" class="math">• = 1 − ∏_{j=0}^{k−1} (n − c − j) / (n − j)</text>
  <text x="40" y="283" class="math" fill="#0f766e">• Maj@k = I[ mode(ŷ₁..ŷ_k) == y* ]</text>
  <text x="40" y="302" class="math">• Token F₁ = 2 |T_pred ∩ T_ref| / (|T_p|+|T_r|)</text>
  <text x="40" y="321" class="small">Unbiased pass@k eliminates subset sampling variance</text>

  <!-- PANEL 2: The RAGAS Triad & FActScore -->
  <rect x="310" y="16" width="282" height="338" class="panel" />
  <text x="324" y="40" class="title">2. RAG Triad &amp; Atomic FActScore</text>
  <text x="324" y="57" class="subtitle">Separating retrieval failures from hallucinations</text>

  <g transform="translate(328, 72)">
    <!-- Triangle connecting Query q, Context C, Answer a -->
    <rect x="86" y="4" width="76" height="28" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" rx="6" />
    <text x="102" y="22" class="math" fill="#1d4ed8">Query q</text>

    <rect x="6" y="92" width="90" height="30" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" rx="6" />
    <text x="16" y="111" class="math" fill="#15803d">Context C</text>

    <rect x="152" y="92" width="90" height="30" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" rx="6" />
    <text x="166" y="111" class="math" fill="#92400e">Answer a</text>

    <!-- Edges of the RAG Triad -->
    <line x1="102" y1="32" x2="54" y2="92" stroke="#16a34a" stroke-width="1.8" />
    <text x="8" y="62" class="small" fill="#15803d">Context Precision</text>
    <text x="8" y="74" class="small" fill="#15803d">&amp; Recall (vs. Ref)</text>

    <line x1="146" y1="32" x2="194" y2="92" stroke="#2563eb" stroke-width="1.8" />
    <text x="160" y="64" class="small" fill="#1d4ed8">Answer</text>
    <text x="160" y="76" class="small" fill="#1d4ed8">Relevance</text>

    <line x1="96" y1="107" x2="152" y2="107" stroke="#dc2626" stroke-width="2" />
    <text x="92" y="136" class="math" fill="#b91c1c">Faithfulness (C ⊨ s_j)</text>
  </g>

  <rect x="324" y="218" width="254" height="122" fill="#f8fafc" stroke="#cbd5e1" rx="6" />
  <text x="334" y="237" class="math">• CtxPrec@K = ∑_{k=1}^K (P@k · v_k) / ∑ v_k</text>
  <text x="334" y="256" class="math">• CtxRecall = |{claims in y ⊂ C}| / |claims(y)|</text>
  <text x="334" y="275" class="math" fill="#b91c1c">• Faithfulness = |{s_j ∈ S(a) : C ⊨ s_j}| / |S(a)|</text>
  <text x="334" y="294" class="math">• AnsRel = (1/M) ∑_{m=1}^M cos(e_q, e_{q̂_m})</text>
  <text x="334" y="313" class="math" fill="#0f766e">• FActScore = atomic fact precision vs. KB</text>
  <text x="334" y="330" class="small">Pinpoints retriever bottleneck vs. generator hallucination</text>

  <!-- PANEL 3: LLM-as-a-Judge & Arena Elo -->
  <rect x="604" y="16" width="280" height="338" class="panel" />
  <text x="618" y="40" class="title">3. LLM-as-a-Judge &amp; Arena Elo</text>
  <text x="618" y="57" class="subtitle">Bradley–Terry MLE, length control &amp; debiasing</text>

  <g transform="translate(624, 72)">
    <!-- Pairwise battle diagram -->
    <rect x="6" y="16" width="84" height="32" fill="#dbeafe" stroke="#2563eb" rx="5" />
    <text x="16" y="36" class="math" fill="#1d4ed8">Model i (R_i)</text>

    <rect x="150" y="16" width="84" height="32" fill="#fce7f3" stroke="#db2777" rx="5" />
    <text x="160" y="36" class="math" fill="#be185d">Model j (R_j)</text>

    <text x="108" y="36" class="math">vs.</text>

    <rect x="24" y="64" width="192" height="58" fill="#f8fafc" stroke="#94a3b8" rx="6" />
    <text x="34" y="83" class="math">P(i ≻ j) = 1 / (1 + 10^{(R_j − R_i)/400})</text>
    <text x="34" y="101" class="small">Swap (A,B) &amp; (B,A) to cancel position bias;</text>
    <text x="34" y="114" class="small">set Δlength = 0 for Length-Controlled Win Rate</text>
  </g>

  <rect x="618" y="218" width="252" height="122" fill="#f8fafc" stroke="#cbd5e1" rx="6" />
  <text x="628" y="237" class="math">• Bradley–Terry: P(i ≻ j) = σ(β_i − β_j)</text>
  <text x="628" y="256" class="math">• Elo Update: R_i ← R_i + K (S_{ij} − E_{ij})</text>
  <text x="628" y="275" class="math" fill="#0f766e">• LC-WinRate: σ(θ_m − θ_b + w_L·0)</text>
  <text x="628" y="294" class="math" fill="#b91c1c">• Judge Debias: θ̂ = (p̂_obs + q₀ − 1)/(q₁+q₀−1)</text>
  <text x="628" y="313" class="math">• Consistency: Cohen's κ &amp; Krippendorff α</text>
  <text x="628" y="330" class="small">Corrects verbosity, position &amp; judge error rates</text>
</svg>

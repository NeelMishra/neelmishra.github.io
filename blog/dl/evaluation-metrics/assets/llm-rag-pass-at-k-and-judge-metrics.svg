<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="'Manrope', -apple-system, sans-serif">
  <rect width="760" height="300" rx="12" fill="#fbfaf6" stroke="#d8d2c5" stroke-width="1.5"/>

  <!-- Card 1: pass@k vs Maj@k -->
  <g transform="translate(16, 16)">
    <rect width="232" height="268" rx="10" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.2"/>
    <text x="116" y="24" text-anchor="middle" font-size="12.5" font-weight="800" fill="#1e2422">1. Code &amp; Reasoning (pass@k)</text>
    <text x="116" y="41" text-anchor="middle" font-size="10" fill="#5a625e">Oracle verifier vs. majority voting</text>

    <g transform="translate(16, 52)">
      <rect width="200" height="160" rx="8" fill="#fbfaf6" stroke="#d8d2c5"/>

      <!-- Axes: origin (30, 132), width 152, height 106 (y from 26 to 132) -->
      <line x1="30" y1="132" x2="182" y2="132" stroke="#5a625e" stroke-width="1.3"/>
      <line x1="30" y1="26" x2="30" y2="132" stroke="#5a625e" stroke-width="1.3"/>
      <text x="23" y="32" text-anchor="end" font-size="8.5" fill="#5a625e">1.0</text>
      <text x="23" y="132" text-anchor="end" font-size="8.5" fill="#5a625e">0.0</text>

      <!-- pass@k curve -->
      <path d="M 30,106 Q 76,42 182,28" fill="none" stroke="#165d4c" stroke-width="2.3"/>
      <text x="98" y="38" text-anchor="middle" font-size="9.5" font-weight="800" fill="#173d35">pass@k (Verifier)</text>

      <!-- Maj@k curve -->
      <path d="M 30,106 Q 76,74 182,62" fill="none" stroke="#8c5d16" stroke-width="2.2" stroke-dasharray="5,3"/>
      <text x="112" y="84" text-anchor="middle" font-size="9.5" font-weight="800" fill="#8c5d16">Maj@k (Vote)</text>

      <!-- Verification gap -->
      <line x1="162" y1="31" x2="162" y2="63" stroke="#9e2f24" stroke-width="1.6" stroke-dasharray="3,2"/>
      <text x="148" y="51" text-anchor="end" font-size="8.5" font-weight="800" fill="#9e2f24">Gap</text>

      <text x="106" y="149" text-anchor="middle" font-size="9" font-weight="700" fill="#3a423e">Samples k (log scale)</text>
    </g>

    <rect x="16" y="222" width="200" height="32" rx="6" fill="#eef6f0" stroke="#a8cbb7"/>
    <text x="116" y="242" text-anchor="middle" font-size="9.5" font-weight="800" fill="#173d35">Unbiased Hypergeometric Estimator</text>
  </g>

  <!-- Card 2: The RAGAS Triad -->
  <g transform="translate(264, 16)">
    <rect width="232" height="268" rx="10" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.2"/>
    <text x="116" y="24" text-anchor="middle" font-size="12.5" font-weight="800" fill="#1e2422">2. The RAGAS Evaluation Triad</text>
    <text x="116" y="41" text-anchor="middle" font-size="10" fill="#5a625e">Query q, Retrieved Context C, Answer a</text>

    <g transform="translate(16, 52)">
      <rect width="200" height="160" rx="8" fill="#fbfaf6" stroke="#d8d2c5"/>

      <!-- Top Node: Query q -->
      <rect x="64" y="12" width="72" height="28" rx="6" fill="#fdf6e9" stroke="#8c5d16" stroke-width="1.5"/>
      <text x="100" y="30" text-anchor="middle" font-size="10" font-weight="800" fill="#8c5d16">Query q</text>

      <!-- Bottom Left: Context C -->
      <rect x="12" y="106" width="76" height="28" rx="6" fill="#eef6f0" stroke="#165d4c" stroke-width="1.5"/>
      <text x="50" y="124" text-anchor="middle" font-size="10" font-weight="800" fill="#173d35">Context C</text>

      <!-- Bottom Right: Answer a -->
      <rect x="112" y="106" width="76" height="28" rx="6" fill="#fdf2f0" stroke="#9e2f24" stroke-width="1.5"/>
      <text x="150" y="124" text-anchor="middle" font-size="10" font-weight="800" fill="#9e2f24">Answer a</text>

      <!-- Edges -->
      <line x1="82" y1="40" x2="50" y2="106" stroke="#165d4c" stroke-width="1.8"/>
      <text x="44" y="68" text-anchor="middle" font-size="8.5" font-weight="800" fill="#173d35">Context</text>
      <text x="44" y="80" text-anchor="middle" font-size="8.5" font-weight="800" fill="#173d35">Prec &amp; Rec</text>

      <line x1="118" y1="40" x2="150" y2="106" stroke="#8c5d16" stroke-width="1.8"/>
      <text x="156" y="68" text-anchor="middle" font-size="8.5" font-weight="800" fill="#8c5d16">Answer</text>
      <text x="156" y="80" text-anchor="middle" font-size="8.5" font-weight="800" fill="#8c5d16">Relevance</text>

      <line x1="88" y1="120" x2="112" y2="120" stroke="#9e2f24" stroke-width="2.0"/>
      <text x="100" y="149" text-anchor="middle" font-size="9" font-weight="800" fill="#9e2f24">Faithfulness (C Entails a)</text>
    </g>

    <rect x="16" y="222" width="200" height="32" rx="6" fill="#fdf6e9" stroke="#d9c091"/>
    <text x="116" y="242" text-anchor="middle" font-size="9.5" font-weight="800" fill="#8c5d16">Isolates Retriever vs. Generator</text>
  </g>

  <!-- Card 3: Pairwise Judge & Arena Elo -->
  <g transform="translate(512, 16)">
    <rect width="232" height="268" rx="10" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.2"/>
    <text x="116" y="24" text-anchor="middle" font-size="12.5" font-weight="800" fill="#1e2422">3. Pairwise Judge &amp; Arena Elo</text>
    <text x="116" y="41" text-anchor="middle" font-size="10" fill="#5a625e">Bradley–Terry MLE &amp; judge debiasing</text>

    <g transform="translate(16, 52)">
      <rect width="200" height="160" rx="8" fill="#fbfaf6" stroke="#d8d2c5"/>

      <!-- Model A vs Model B -->
      <rect x="14" y="16" width="74" height="30" rx="5" fill="#eef6f0" stroke="#165d4c" stroke-width="1.4"/>
      <text x="51" y="35" text-anchor="middle" font-size="9.5" font-weight="800" fill="#173d35">Model A</text>

      <text x="100" y="35" text-anchor="middle" font-size="9.5" font-weight="800" fill="#5a625e">vs.</text>

      <rect x="112" y="16" width="74" height="30" rx="5" fill="#fdf6e9" stroke="#8c5d16" stroke-width="1.4"/>
      <text x="149" y="35" text-anchor="middle" font-size="9.5" font-weight="800" fill="#8c5d16">Model B</text>

      <!-- Debiasing pipeline boxes -->
      <rect x="14" y="58" width="172" height="40" rx="5" fill="#ffffff" stroke="#d8d2c5"/>
      <text x="100" y="75" text-anchor="middle" font-size="9" font-weight="800" fill="#1e2422">1. Swap Slots (A, B) &amp; (B, A)</text>
      <text x="100" y="90" text-anchor="middle" font-size="8.5" fill="#5a625e">Cancels first-position bias</text>

      <rect x="14" y="106" width="172" height="42" rx="5" fill="#ffffff" stroke="#d8d2c5"/>
      <text x="100" y="123" text-anchor="middle" font-size="9" font-weight="800" fill="#1e2422">2. Length Control (Δlen = 0)</text>
      <text x="100" y="138" text-anchor="middle" font-size="8.5" fill="#5a625e">&amp; Rogan–Gladen TPR/TNR correction</text>
    </g>

    <rect x="16" y="222" width="200" height="32" rx="6" fill="#eef6f0" stroke="#a8cbb7"/>
    <text x="116" y="242" text-anchor="middle" font-size="9.5" font-weight="800" fill="#173d35">+100 Elo → 64.0% Expected Win Rate</text>
  </g>
</svg>

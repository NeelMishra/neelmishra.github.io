<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="'Manrope', -apple-system, sans-serif">
  <rect width="760" height="300" rx="12" fill="#fbfaf6" stroke="#d8d2c5" stroke-width="1.5"/>

  <!-- Card 1: Perturbation Faithfulness -->
  <g transform="translate(16, 16)">
    <rect width="232" height="268" rx="10" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.2"/>
    <text x="116" y="24" text-anchor="middle" font-size="12.5" font-weight="800" fill="#1e2422">1. Perturbation Faithfulness</text>
    <text x="116" y="41" text-anchor="middle" font-size="10" fill="#5a625e">Deletion (MoRF) vs. Insertion curves</text>

    <g transform="translate(16, 52)">
      <rect width="200" height="160" rx="8" fill="#fbfaf6" stroke="#d8d2c5"/>

      <!-- Axes: origin (30, 132), width 152, height 108 (y from 24 to 132) -->
      <line x1="30" y1="132" x2="182" y2="132" stroke="#5a625e" stroke-width="1.3"/>
      <line x1="30" y1="24" x2="30" y2="132" stroke="#5a625e" stroke-width="1.3"/>
      <text x="23" y="30" text-anchor="end" font-size="8.5" fill="#5a625e">1.0</text>
      <text x="23" y="132" text-anchor="end" font-size="8.5" fill="#5a625e">0.0</text>

      <!-- Insertion curve (rising) -->
      <path d="M 30,128 Q 66,32 182,26 L 182,132 L 30,132 Z" fill="#165d4c" fill-opacity="0.15"/>
      <path d="M 30,128 Q 66,32 182,26" fill="none" stroke="#165d4c" stroke-width="2.2"/>
      <text x="116" y="44" text-anchor="middle" font-size="9.5" font-weight="800" fill="#173d35">Insertion AUC ↑</text>

      <!-- Deletion curve (falling) -->
      <path d="M 30,26 Q 62,122 182,128 L 182,132 L 30,132 Z" fill="#9e2f24" fill-opacity="0.14"/>
      <path d="M 30,26 Q 62,122 182,128" fill="none" stroke="#9e2f24" stroke-width="2.2"/>
      <text x="118" y="114" text-anchor="middle" font-size="9.5" font-weight="800" fill="#9e2f24">Deletion AUC ↓</text>

      <text x="106" y="149" text-anchor="middle" font-size="9" font-weight="700" fill="#3a423e">Top-k% Features Perturbed</text>
    </g>

    <rect x="16" y="222" width="200" height="32" rx="6" fill="#eef6f0" stroke="#a8cbb7"/>
    <text x="116" y="242" text-anchor="middle" font-size="9.5" font-weight="800" fill="#173d35">Del AUC = 0.233 · Ins AUC = 0.733</text>
  </g>

  <!-- Card 2: Stability & Localization -->
  <g transform="translate(264, 16)">
    <rect width="232" height="268" rx="10" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.2"/>
    <text x="116" y="24" text-anchor="middle" font-size="12.5" font-weight="800" fill="#1e2422">2. Stability &amp; Localization</text>
    <text x="116" y="41" text-anchor="middle" font-size="10" fill="#5a625e">Max-Sensitivity ball &amp; Pointing Game</text>

    <g transform="translate(16, 52)">
      <rect width="200" height="160" rx="8" fill="#fbfaf6" stroke="#d8d2c5"/>

      <!-- Left: Sensitivity ball -->
      <circle cx="54" cy="70" r="34" fill="#fdf6e9" stroke="#8c5d16" stroke-width="1.4" stroke-dasharray="4,3"/>
      <circle cx="54" cy="70" r="3.8" fill="#1e2422"/>
      <text x="46" y="64" font-size="9.5" font-weight="800" fill="#1e2422">x</text>
      <circle cx="76" cy="50" r="3.8" fill="#9e2f24"/>
      <line x1="54" y1="70" x2="76" y2="50" stroke="#9e2f24" stroke-width="1.5"/>
      <text x="54" y="122" text-anchor="middle" font-size="9" font-weight="700" fill="#8c5d16">‖δ‖ ≤ r Ball</text>
      <text x="54" y="136" text-anchor="middle" font-size="8.5" fill="#5a625e">Max-Sensitivity</text>

      <!-- Right: EBPG Box -->
      <rect x="106" y="32" width="80" height="76" rx="4" fill="#f7f4ec" stroke="#aba496" stroke-width="1.2"/>
      <rect x="122" y="46" width="48" height="44" rx="3" fill="#eef6f0" stroke="#165d4c" stroke-width="1.6"/>
      <circle cx="146" cy="68" r="13" fill="#fdf6e9" stroke="#8c5d16" stroke-width="1.2"/>
      <circle cx="146" cy="68" r="5.5" fill="#9e2f24"/>
      <text x="146" y="122" text-anchor="middle" font-size="9" font-weight="700" fill="#173d35">GT Mask M_gt</text>
      <text x="146" y="136" text-anchor="middle" font-size="8.5" fill="#5a625e">EBPG Energy Ratio</text>
    </g>

    <rect x="16" y="222" width="200" height="32" rx="6" fill="#fdf6e9" stroke="#d9c091"/>
    <text x="116" y="242" text-anchor="middle" font-size="9.5" font-weight="800" fill="#8c5d16">Pass Weight-Randomization Check</text>
  </g>

  <!-- Card 3: Group Fairness Audit -->
  <g transform="translate(512, 16)">
    <rect width="232" height="268" rx="10" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.2"/>
    <text x="116" y="24" text-anchor="middle" font-size="12.5" font-weight="800" fill="#1e2422">3. Group Fairness Audit</text>
    <text x="116" y="41" text-anchor="middle" font-size="10" fill="#5a625e">Group A = 0 vs. Group A = 1 rates</text>

    <g transform="translate(16, 52)">
      <rect width="200" height="160" rx="8" fill="#fbfaf6" stroke="#d8d2c5"/>

      <!-- Legend -->
      <rect x="24" y="10" width="9" height="9" rx="2" fill="#9e2f24"/>
      <text x="37" y="18" font-size="9" font-weight="700" fill="#9e2f24">Group A=0</text>
      <rect x="108" y="10" width="9" height="9" rx="2" fill="#165d4c"/>
      <text x="121" y="18" font-size="9" font-weight="700" fill="#173d35">Group A=1</text>

      <!-- Axes: origin (28, 130), width 154, height 96 (1.0 -> 96px) -->
      <line x1="28" y1="130" x2="182" y2="130" stroke="#5a625e" stroke-width="1.3"/>
      <line x1="28" y1="30" x2="28" y2="130" stroke="#5a625e" stroke-width="1.3"/>

      <!-- Selection Rate: A=0 is 0.36 (35px, y=95), A=1 is 0.50 (48px, y=82) -->
      <rect x="44" y="95" width="22" height="35" rx="2" fill="#9e2f24"/>
      <text x="55" y="90" text-anchor="middle" font-size="8.5" font-weight="700" fill="#9e2f24">0.36</text>
      <rect x="70" y="82" width="22" height="48" rx="2" fill="#165d4c"/>
      <text x="81" y="77" text-anchor="middle" font-size="8.5" font-weight="700" fill="#173d35">0.50</text>
      <text x="68" y="146" text-anchor="middle" font-size="9" font-weight="700" fill="#3a423e">Selection Rate</text>

      <!-- TPR: A=0 is 0.60 (58px, y=72), A=1 is 0.80 (77px, y=53) -->
      <rect x="118" y="72" width="22" height="58" rx="2" fill="#9e2f24"/>
      <text x="129" y="67" text-anchor="middle" font-size="8.5" font-weight="700" fill="#9e2f24">0.60</text>
      <rect x="144" y="53" width="22" height="77" rx="2" fill="#165d4c"/>
      <text x="155" y="48" text-anchor="middle" font-size="8.5" font-weight="700" fill="#173d35">0.80</text>
      <text x="142" y="146" text-anchor="middle" font-size="9" font-weight="700" fill="#3a423e">True Pos Rate</text>
    </g>

    <rect x="16" y="222" width="200" height="32" rx="6" fill="#fdf2f0" stroke="#dfb0a8"/>
    <text x="116" y="242" text-anchor="middle" font-size="9.5" font-weight="800" fill="#9e2f24">DI = 0.72 (&lt; 0.80) · EOD = 0.20</text>
  </g>
</svg>

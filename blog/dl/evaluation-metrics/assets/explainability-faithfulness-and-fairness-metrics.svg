<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" role="img" aria-labelledby="title desc">
  <title id="title">Explainability (XAI), Attribution Faithfulness, and Algorithmic Fairness Metrics</title>
  <desc id="desc">Three-panel diagram showing (1) Deletion (MoRF) and Insertion perturbation faithfulness curves and ERASER Comprehensiveness &amp; Sufficiency; (2) Infidelity, Max-Sensitivity ball perturbation, Energy-Based Pointing Game EBPG, and Adebayo Sanity Checks; and (3) Algorithmic Fairness metrics Demographic Parity, Disparate Impact, Equal Opportunity, and Equalized Odds.</desc>
  <defs>
    <style>
      .bg { fill: #f8f6f1; }
      .panel { fill: #ffffff; stroke: #d5cfc2; stroke-width: 1.5; rx: 12; }
      .title { font: 700 14px "Inter", "Segoe UI", sans-serif; fill: #1e293b; }
      .subtitle { font: 600 11.5px "Inter", "Segoe UI", sans-serif; fill: #475569; }
      .label { font: 500 11px "Inter", "Segoe UI", sans-serif; fill: #334155; }
      .math { font: 600 11px "Cambria Math", "STIX Two Math", "Georgia", serif; fill: #0f172a; }
      .small { font: 500 10px "Inter", "Segoe UI", sans-serif; fill: #64748b; }
      .axis { stroke: #64748b; stroke-width: 1.3; }
      .grid { stroke: #e2e8f0; stroke-width: 1; stroke-dasharray: 3 3; }
      .curve-del { fill: none; stroke: #dc2626; stroke-width: 2.3; }
      .curve-ins { fill: none; stroke: #16a34a; stroke-width: 2.3; }
      .area-del { fill: #fecaca; opacity: 0.35; }
      .area-ins { fill: #bbf7d0; opacity: 0.35; }
    </style>
  </defs>

  <rect width="900" height="370" class="bg" />

  <!-- PANEL 1: Faithfulness Curves & ERASER -->
  <rect x="16" y="16" width="282" height="338" class="panel" />
  <text x="30" y="40" class="title">1. Faithfulness: Deletion &amp; Insertion</text>
  <text x="30" y="57" class="subtitle">Perturbing top-attributed features (MoRF)</text>

  <g transform="translate(36, 74)">
    <line x1="20" y1="128" x2="232" y2="128" class="axis" />
    <line x1="20" y1="10" x2="20" y2="128" class="axis" />
    <line x1="20" y1="69" x2="232" y2="69" class="grid" />

    <!-- Insertion AUC area & curve -->
    <path d="M 20 124 Q 65 20, 232 14 L 232 128 L 20 128 Z" class="area-ins" />
    <path d="M 20 124 Q 65 20, 232 14" class="curve-ins" />

    <!-- Deletion AUC area & curve -->
    <path d="M 20 14 Q 55 118, 232 124 L 232 128 L 20 128 Z" class="area-del" />
    <path d="M 20 14 Q 55 118, 232 124" class="curve-del" />

    <text x="115" y="34" class="math" fill="#15803d">Insertion AUC ↑</text>
    <text x="95" y="106" class="math" fill="#b91c1c">Deletion AUC ↓ (MoRF)</text>
    <text x="42" y="143" class="small">Fraction k/d of top features perturbed</text>
    <text x="0" y="18" class="small">1.0</text>
    <text x="4" y="128" class="small">0</text>
  </g>

  <rect x="30" y="226" width="254" height="114" fill="#f8fafc" stroke="#cbd5e1" rx="6" />
  <text x="40" y="245" class="math">• Deletion AUC ↓: mask top-k% features</text>
  <text x="40" y="264" class="math">• Insertion AUC ↑: reveal top-k% features</text>
  <text x="40" y="283" class="math" fill="#0f766e">• Comp(x, r) = m(x)_y − m(x \ r)_y  (↑)</text>
  <text x="40" y="302" class="math" fill="#1d4ed8">• Suff(x, r) = m(x)_y − m(r)_y      (↓)</text>
  <text x="40" y="321" class="small">Completeness: ∑_i Φ_i(x) = f(x) − f(x₀)</text>

  <!-- PANEL 2: Infidelity, Sensitivity & EBPG -->
  <rect x="310" y="16" width="282" height="338" class="panel" />
  <text x="324" y="40" class="title">2. Infidelity, Sensitivity &amp; EBPG</text>
  <text x="324" y="57" class="subtitle">Local Taylor accuracy, stability &amp; localization</text>

  <g transform="translate(328, 72)">
    <!-- Sensitivity ball around x -->
    <circle cx="62" cy="64" r="42" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4 3" />
    <circle cx="62" cy="64" r="4" fill="#4c1d95" />
    <text x="52" y="54" class="math">x</text>
    <circle cx="88" cy="40" r="4" fill="#dc2626" />
    <line x1="62" y1="64" x2="88" y2="40" stroke="#dc2626" stroke-width="1.6" />
    <text x="72" y="72" class="small" fill="#6d28d9">‖δ‖ ≤ r</text>
    <text x="12" y="122" class="small">Max-Sensitivity in ε-ball</text>

    <!-- Energy-Based Pointing Game box -->
    <rect x="134" y="18" width="108" height="90" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4" rx="4" />
    <rect x="156" y="34" width="60" height="52" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8" />
    <circle cx="186" cy="58" r="16" fill="#fde047" opacity="0.85" />
    <circle cx="186" cy="58" r="7" fill="#ef4444" />
    <text x="160" y="29" class="small" fill="#15803d">GT Mask M_gt</text>
    <text x="140" y="122" class="small">EBPG: saliency mass in M_gt</text>
  </g>

  <rect x="324" y="218" width="254" height="122" fill="#f8fafc" stroke="#cbd5e1" rx="6" />
  <text x="334" y="237" class="math">• Infidelity = E_I[ (IᵀΦ(x) − (f(x)−f(x−I)))² ]</text>
  <text x="334" y="256" class="math">• Sens_max = max_{‖δ‖≤r} ‖Φ(x+δ)−Φ(x)‖ / ‖Φ(x)‖</text>
  <text x="334" y="275" class="math">• Pointing Game = I[ argmax S_{h,w} ∈ M_gt ]</text>
  <text x="334" y="294" class="math" fill="#0f766e">• EBPG = ∑_{(h,w)∈M_gt} |S| / ∑_{all} |S|</text>
  <text x="334" y="313" class="math">• Sanity Check: Corr(S(θ), S(θ_rand)) ≈ 0</text>
  <text x="334" y="330" class="small">Adebayo et al. cascading weight randomization</text>

  <!-- PANEL 3: Algorithmic Fairness Metrics -->
  <rect x="604" y="16" width="280" height="338" class="panel" />
  <text x="618" y="40" class="title">3. Algorithmic Fairness &amp; Parity</text>
  <text x="618" y="57" class="subtitle">Group rates across protected attribute A ∈ {0, 1}</text>

  <g transform="translate(626, 74)">
    <!-- Group A=0 vs A=1 selection & TPR bars -->
    <line x1="20" y1="120" x2="226" y2="120" class="axis" />
    <line x1="20" y1="10" x2="20" y2="120" class="axis" />

    <!-- P(Y_hat=1 | A) -->
    <rect x="38" y="48" width="24" height="72" fill="#3b82f6" rx="3" />
    <rect x="66" y="32" width="24" height="88" fill="#60a5fa" rx="3" />
    <text x="34" y="135" class="small">Selection P(Ŷ=1)</text>

    <!-- TPR P(Y_hat=1 | Y=1, A) -->
    <rect x="136" y="26" width="24" height="94" fill="#0d9488" rx="3" />
    <rect x="164" y="30" width="24" height="90" fill="#2dd4bf" rx="3" />
    <text x="130" y="135" class="small">TPR P(Ŷ=1|Y=1)</text>

    <!-- 80% Disparate Impact threshold line -->
    <line x1="32" y1="50" x2="96" y2="50" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3 2" />
    <text x="34" y="24" class="small" fill="#b91c1c">DI ≥ 0.80 rule</text>
  </g>

  <rect x="618" y="218" width="252" height="122" fill="#f8fafc" stroke="#cbd5e1" rx="6" />
  <text x="628" y="237" class="math">• SPD = |P(Ŷ=1|A=0) − P(Ŷ=1|A=1)|</text>
  <text x="628" y="256" class="math">• Disparate Impact DI = P(Ŷ=1|A=0) / P(Ŷ=1|A=1)</text>
  <text x="628" y="275" class="math">• Equal Opportunity = |TPR_{A=0} − TPR_{A=1}|</text>
  <text x="628" y="294" class="math" fill="#0f766e">• Equalized Odds = ΔTPR + ΔFPR</text>
  <text x="628" y="313" class="math">• Predictive Parity = |PPV_{A=0} − PPV_{A=1}|</text>
  <text x="628" y="330" class="small">Impossibility theorem when base rates differ</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="'Manrope', -apple-system, sans-serif">
  <rect width="760" height="330" rx="14" fill="#fbfaf6" stroke="#d8d2c5" stroke-width="1.5"/>

  <!-- Left Panel: 2x2 Confusion Matrix -->
  <g transform="translate(18, 16)">
    <rect width="450" height="298" rx="10" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.2"/>
    <text x="225" y="24" text-anchor="middle" font-size="13" font-weight="800" fill="#173d35">1. Confusion Matrix Conditioning</text>
    <text x="225" y="41" text-anchor="middle" font-size="10.5" fill="#536b62">Rows normalize by true class y; columns normalize by predicted class ŷ</text>

    <!-- Column headers -->
    <text x="166" y="64" text-anchor="middle" font-size="10.5" font-weight="800" fill="#165d4c">Predicted ŷ = 1</text>
    <text x="282" y="64" text-anchor="middle" font-size="10.5" font-weight="800" fill="#536b62">Predicted ŷ = 0</text>
    <text x="392" y="64" text-anchor="middle" font-size="10" font-weight="800" fill="#165d4c">Row Rate</text>

    <!-- Row headers -->
    <text x="56" y="106" text-anchor="middle" font-size="10.5" font-weight="800" fill="#165d4c">Actual</text>
    <text x="56" y="120" text-anchor="middle" font-size="10.5" font-weight="800" fill="#165d4c">y = 1</text>
    <text x="56" y="182" text-anchor="middle" font-size="10.5" font-weight="800" fill="#536b62">Actual</text>
    <text x="56" y="196" text-anchor="middle" font-size="10.5" font-weight="800" fill="#536b62">y = 0</text>
    <text x="56" y="252" text-anchor="middle" font-size="10" font-weight="800" fill="#8c5d16">Col Rate</text>

    <!-- TP Box -->
    <rect x="112" y="74" width="108" height="66" rx="8" fill="#eef6f0" stroke="#8abfa3" stroke-width="1.6"/>
    <text x="166" y="100" text-anchor="middle" font-size="14" font-weight="800" fill="#165d4c">TP</text>
    <text x="166" y="117" text-anchor="middle" font-size="9.5" fill="#295c46">True Positive</text>
    <text x="166" y="131" text-anchor="middle" font-size="9" font-weight="700" fill="#165d4c">Hit</text>

    <!-- FN Box -->
    <rect x="228" y="74" width="108" height="66" rx="8" fill="#fdf6e9" stroke="#e2b976" stroke-width="1.6"/>
    <text x="282" y="100" text-anchor="middle" font-size="14" font-weight="800" fill="#9a5b13">FN</text>
    <text x="282" y="117" text-anchor="middle" font-size="9.5" fill="#9a5b13">False Negative</text>
    <text x="282" y="131" text-anchor="middle" font-size="9" font-weight="700" fill="#9a5b13">Type II Miss</text>

    <!-- Row 1 Summary: Recall -->
    <rect x="344" y="74" width="94" height="66" rx="8" fill="#f4f8f5" stroke="#c6d9ce" stroke-width="1.2"/>
    <text x="391" y="103" text-anchor="middle" font-size="10.5" font-weight="800" fill="#165d4c">Recall (TPR)</text>
    <text x="391" y="121" text-anchor="middle" font-size="9.5" fill="#295c46">TP / (TP + FN)</text>

    <!-- FP Box -->
    <rect x="112" y="148" width="108" height="66" rx="8" fill="#fdf2f0" stroke="#e4a99e" stroke-width="1.6"/>
    <text x="166" y="174" text-anchor="middle" font-size="14" font-weight="800" fill="#9e2f24">FP</text>
    <text x="166" y="191" text-anchor="middle" font-size="9.5" fill="#9e2f24">False Positive</text>
    <text x="166" y="205" text-anchor="middle" font-size="9" font-weight="700" fill="#9e2f24">Type I Alarm</text>

    <!-- TN Box -->
    <rect x="228" y="148" width="108" height="66" rx="8" fill="#f5f4ef" stroke="#d0cbc0" stroke-width="1.6"/>
    <text x="282" y="174" text-anchor="middle" font-size="14" font-weight="800" fill="#3d4f48">TN</text>
    <text x="282" y="191" text-anchor="middle" font-size="9.5" fill="#536b62">True Negative</text>
    <text x="282" y="205" text-anchor="middle" font-size="9" font-weight="700" fill="#6b7d75">Not in P, R, F₁</text>

    <!-- Row 2 Summary: Specificity -->
    <rect x="344" y="148" width="94" height="66" rx="8" fill="#f5f4ef" stroke="#d0cbc0" stroke-width="1.2"/>
    <text x="391" y="177" text-anchor="middle" font-size="10.5" font-weight="800" fill="#3d4f48">Specificity</text>
    <text x="391" y="195" text-anchor="middle" font-size="9.5" fill="#536b62">TN / (TN + FP)</text>

    <!-- Col 1 Summary: Precision -->
    <rect x="112" y="224" width="108" height="52" rx="8" fill="#fdf6e9" stroke="#e2b976" stroke-width="1.2"/>
    <text x="166" y="246" text-anchor="middle" font-size="10.5" font-weight="800" fill="#8c5d16">Precision (PPV)</text>
    <text x="166" y="264" text-anchor="middle" font-size="9.5" fill="#8c5d16">TP / (TP + FP)</text>

    <!-- Col 2 Summary: NPV -->
    <rect x="228" y="224" width="108" height="52" rx="8" fill="#f5f4ef" stroke="#d0cbc0" stroke-width="1.2"/>
    <text x="282" y="246" text-anchor="middle" font-size="10.5" font-weight="800" fill="#3d4f48">NPV</text>
    <text x="282" y="264" text-anchor="middle" font-size="9.5" fill="#536b62">TN / (TN + FN)</text>
  </g>

  <!-- Right Panel: Arithmetic vs Geometric vs Harmonic Mean -->
  <g transform="translate(482, 16)">
    <rect width="260" height="298" rx="10" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.2"/>
    <text x="130" y="24" text-anchor="middle" font-size="13" font-weight="800" fill="#173d35">2. Why Harmonic Mean (F₁)?</text>
    <text x="130" y="41" text-anchor="middle" font-size="10.5" fill="#536b62">When P = 0.02 and R = 1.00</text>

    <!-- Arithmetic Mean -->
    <text x="20" y="76" font-size="10.5" font-weight="700" fill="#9e2f24">Arithmetic: (P + R) / 2</text>
    <rect x="20" y="84" width="220" height="18" rx="4" fill="#f2ece4"/>
    <rect x="20" y="84" width="112" height="18" rx="4" fill="#c94a38"/>
    <text x="140" y="97" font-size="10.5" font-weight="800" fill="#9e2f24">0.510</text>

    <!-- Geometric Mean -->
    <text x="20" y="132" font-size="10.5" font-weight="700" fill="#8c5d16">Geometric: √(P · R)</text>
    <rect x="20" y="140" width="220" height="18" rx="4" fill="#f2ece4"/>
    <rect x="20" y="140" width="31" height="18" rx="4" fill="#cf8125"/>
    <text x="59" y="153" font-size="10.5" font-weight="800" fill="#8c5d16">0.141</text>

    <!-- Harmonic Mean -->
    <text x="20" y="188" font-size="10.5" font-weight="700" fill="#165d4c">Harmonic F₁: 2PR / (P + R)</text>
    <rect x="20" y="196" width="220" height="18" rx="4" fill="#f2ece4"/>
    <rect x="20" y="196" width="9" height="18" rx="4" fill="#25856b"/>
    <text x="37" y="209" font-size="10.5" font-weight="800" fill="#165d4c">0.039</text>

    <!-- Summary Note -->
    <rect x="18" y="232" width="224" height="50" rx="8" fill="#f4f8f5" stroke="#c6d9ce"/>
    <text x="130" y="252" text-anchor="middle" font-size="10" font-weight="700" fill="#173d35">min(P, R) ≤ F₁ ≤ √(PR) ≤ (P+R)/2</text>
    <text x="130" y="269" text-anchor="middle" font-size="9.5" fill="#536b62">F₁ stays near the smaller of P and R</text>
  </g>
</svg>

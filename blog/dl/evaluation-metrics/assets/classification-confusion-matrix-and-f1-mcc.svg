<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" width="900" height="370" font-family="'Manrope', -apple-system, sans-serif">
  <rect width="900" height="370" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Left Panel: 2x2 Confusion Matrix Anatomy -->
  <g transform="translate(20, 18)">
    <rect width="420" height="334" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
    <text x="210" y="24" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">1. Confusion Matrix Conditioning Geometry</text>
    <text x="210" y="41" text-anchor="middle" font-size="10.5" fill="#475569">Row-normalized = Recall (TPR) &amp; TNR; Column-normalized = Precision (PPV)</text>

    <!-- Column headers -->
    <text x="165" y="66" text-anchor="middle" font-size="10.5" font-weight="800" fill="#1e40af">Predicted Positive (ŷ=1)</text>
    <text x="295" y="66" text-anchor="middle" font-size="10.5" font-weight="800" fill="#475569">Predicted Negative (ŷ=0)</text>

    <!-- Row headers -->
    <text x="54" y="114" text-anchor="middle" font-size="10.5" font-weight="800" fill="#0f766e">Actual</text>
    <text x="54" y="128" text-anchor="middle" font-size="10.5" font-weight="800" fill="#0f766e">Pos (y=1)</text>
    <text x="54" y="198" text-anchor="middle" font-size="10.5" font-weight="800" fill="#475569">Actual</text>
    <text x="54" y="212" text-anchor="middle" font-size="10.5" font-weight="800" fill="#475569">Neg (y=0)</text>

    <!-- TP Box -->
    <rect x="105" y="78" width="120" height="74" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.8"/>
    <text x="165" y="104" text-anchor="middle" font-size="13" font-weight="800" fill="#166534">TP</text>
    <text x="165" y="122" text-anchor="middle" font-size="9.5" fill="#15803d">True Positive (Hit)</text>
    <text x="165" y="138" text-anchor="middle" font-size="9" font-weight="700" fill="#166534">Shared by P &amp; R</text>

    <!-- FN Box -->
    <rect x="235" y="78" width="120" height="74" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.8"/>
    <text x="295" y="104" text-anchor="middle" font-size="13" font-weight="800" fill="#9a3412">FN</text>
    <text x="295" y="122" text-anchor="middle" font-size="9.5" fill="#c2410c">False Negative (Miss)</text>
    <text x="295" y="138" text-anchor="middle" font-size="9" font-weight="700" fill="#9a3412">Type II Error</text>

    <!-- FP Box -->
    <rect x="105" y="162" width="120" height="74" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.8"/>
    <text x="165" y="188" text-anchor="middle" font-size="13" font-weight="800" fill="#991b1b">FP</text>
    <text x="165" y="206" text-anchor="middle" font-size="9.5" fill="#b91c1c">False Positive (Alarm)</text>
    <text x="165" y="222" text-anchor="middle" font-size="9" font-weight="700" fill="#991b1b">Type I Error</text>

    <!-- TN Box -->
    <rect x="235" y="162" width="120" height="74" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.8"/>
    <text x="295" y="188" text-anchor="middle" font-size="13" font-weight="800" fill="#334155">TN</text>
    <text x="295" y="206" text-anchor="middle" font-size="9.5" fill="#475569">True Negative</text>
    <text x="295" y="222" text-anchor="middle" font-size="9" font-weight="700" fill="#64748b">Ignored by P, R, F₁!</text>

    <!-- Row summaries on right -->
    <text x="387" y="110" text-anchor="middle" font-size="9.5" font-weight="800" fill="#0f766e">Recall (TPR)</text>
    <text x="387" y="124" text-anchor="middle" font-size="9" fill="#0f766e">TP / (TP+FN)</text>
    <text x="387" y="194" text-anchor="middle" font-size="9.5" font-weight="800" fill="#334155">Specificity</text>
    <text x="387" y="208" text-anchor="middle" font-size="9" fill="#334155">TN / (TN+FP)</text>

    <!-- Column summaries at bottom -->
    <rect x="105" y="246" width="120" height="40" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="165" y="263" text-anchor="middle" font-size="9.5" font-weight="800" fill="#1e40af">Precision (PPV)</text>
    <text x="165" y="278" text-anchor="middle" font-size="9" fill="#1d4ed8">TP / (TP + FP)</text>

    <rect x="235" y="246" width="120" height="40" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="295" y="263" text-anchor="middle" font-size="9.5" font-weight="800" fill="#334155">NPV</text>
    <text x="295" y="278" text-anchor="middle" font-size="9" fill="#475569">TN / (TN + FN)</text>

    <text x="210" y="312" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Balanced Accuracy = ½(TPR + TNR)   |   Youden's J = TPR + TNR − 1</text>
  </g>

  <!-- Right Panel: F_beta Harmonic Mean vs MCC -->
  <g transform="translate(455, 18)">
    <rect width="425" height="334" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
    <text x="212" y="24" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">2. Why Harmonic Mean F₁ &amp; Four-Quadrant MCC Matter</text>
    <text x="212" y="41" text-anchor="middle" font-size="10.5" fill="#475569">F₁ penalizes extreme P/R imbalance; MCC is invariant to class-label swapping</text>

    <!-- Box A: Arithmetic vs Geometric vs Harmonic Mean -->
    <g transform="translate(18, 56)">
      <rect width="389" height="122" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="12" y="18" font-size="11" font-weight="800" fill="#1e40af">A. Trivial Recall Trap: Suppose Precision = 0.02, Recall = 1.00</text>
      <text x="12" y="34" font-size="9.5" fill="#1e3a8a">(A lazy classifier that predicts ŷ = 1 for every single patient!)</text>

      <!-- Bar 1: Arithmetic -->
      <text x="12" y="56" font-size="9.5" font-weight="700" fill="#991b1b">Arithmetic (P+R)/2</text>
      <rect x="130" y="46" width="194" height="13" rx="3" fill="#ef4444"/>
      <text x="330" y="56" font-size="9.5" font-weight="800" fill="#991b1b">0.510 (Misleading!)</text>

      <!-- Bar 2: Geometric -->
      <text x="12" y="79" font-size="9.5" font-weight="700" fill="#d97706">Geometric √(P·R)</text>
      <rect x="130" y="69" width="54" height="13" rx="3" fill="#f59e0b"/>
      <text x="190" y="79" font-size="9.5" font-weight="800" fill="#b45309">0.141 (Fowlkes–Mallows)</text>

      <!-- Bar 3: Harmonic F1 -->
      <text x="12" y="102" font-size="9.5" font-weight="700" fill="#0f766e">Harmonic F₁ = 2PR/(P+R)</text>
      <rect x="130" y="92" width="15" height="13" rx="3" fill="#0d9488"/>
      <text x="152" y="102" font-size="9.5" font-weight="800" fill="#0f766e">0.039 (Pulled to min(P, R)!)</text>
    </g>

    <!-- Box B: Why F1 fails when TN is huge or classes swap, and how MCC fixes it -->
    <g transform="translate(18, 190)">
      <rect width="389" height="128" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
      <text x="12" y="18" font-size="11" font-weight="800" fill="#166534">B. Matthews Correlation Coefficient (MCC / φ-Coefficient)</text>
      <text x="194" y="40" text-anchor="middle" font-size="10.5" font-weight="800" fill="#14532d">MCC = (TP·TN − FP·FN) / √((TP+FP)(TP+FN)(TN+FP)(TN+FN)) ∈ [−1, +1]</text>
      <text x="12" y="60" font-size="9.5" fill="#15803d">• Uses all 4 cells (TP, FP, FN, TN) symmetrically: swapping y=1 ↔ y=0</text>
      <text x="12" y="75" font-size="9.5" fill="#15803d">  leaves MCC unchanged, whereas F₁ changes arbitrarily when classes flip.</text>
      <text x="12" y="92" font-size="9.5" fill="#15803d">• MCC = 0 iff predictions are no better than random coin-flipping (TP·TN = FP·FN).</text>
      <text x="12" y="109" font-size="9.5" font-weight="700" fill="#166534">• Cohen's κ = (p_o − p_e) / (1 − p_e) measures agreement above chance baseline p_e.</text>
    </g>
  </g>
</svg>

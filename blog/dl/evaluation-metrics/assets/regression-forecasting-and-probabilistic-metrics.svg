<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" width="760" height="310" font-family="'Manrope', -apple-system, sans-serif">
  <rect width="760" height="310" rx="12" fill="#fbfaf6" stroke="#d8d2c5" stroke-width="1.5"/>

  <!-- Left Card: Loss Geometry -->
  <g transform="translate(18, 16)">
    <rect width="352" height="278" rx="10" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.2"/>
    <text x="176" y="24" text-anchor="middle" font-size="13" font-weight="800" fill="#1e2422">1. Loss Geometry &amp; Elicited Functional</text>
    <text x="176" y="42" text-anchor="middle" font-size="10.5" fill="#5a625e">Loss shape determines the optimal point prediction on p(y | x)</text>

    <!-- Plot Box -->
    <g transform="translate(16, 52)">
      <rect width="320" height="170" rx="8" fill="#fbfaf6" stroke="#d8d2c5"/>

      <!-- Origin at (160, 138) -->
      <line x1="28" y1="138" x2="292" y2="138" stroke="#5a625e" stroke-width="1.3"/>
      <line x1="160" y1="20" x2="160" y2="148" stroke="#5a625e" stroke-width="1.3"/>

      <!-- Axis labels -->
      <text x="86" y="156" text-anchor="middle" font-size="9" fill="#5a625e">Over-predict (e &lt; 0)</text>
      <text x="234" y="156" text-anchor="middle" font-size="9" fill="#5a625e">Under-predict (e &gt; 0)</text>

      <!-- MSE Parabola: vertex at (160, 138), endpoints at (60, 26) and (260, 26) -> control point (160, 250) -->
      <path d="M 60,26 Q 160,250 260,26" fill="none" stroke="#9e2f24" stroke-width="2.2"/>
      <text x="80" y="38" font-size="9.5" font-weight="800" fill="#9e2f24">MSE (e²)</text>

      <!-- MAE V-shape: (44, 42) to (160, 138) to (276, 42) -->
      <polyline points="44,42 160,138 276,42" fill="none" stroke="#165d4c" stroke-width="2.2"/>
      <text x="56" y="88" font-size="9.5" font-weight="800" fill="#165d4c">MAE (|e|)</text>

      <!-- Pinball Loss (tau = 0.8): shallow on left (44, 112), steep on right (246, 26) -->
      <polyline points="44,112 160,138 246,26" fill="none" stroke="#8c5d16" stroke-width="2.2" stroke-dasharray="5,3"/>
      <text x="248" y="64" font-size="9.5" font-weight="800" fill="#8c5d16">Pinball (τ = 0.8)</text>
    </g>

    <!-- Bottom Legend Pills -->
    <g transform="translate(16, 232)">
      <rect x="0" y="0" width="100" height="32" rx="6" fill="#fdf2f0" stroke="#dfb0a8"/>
      <text x="50" y="20" text-anchor="middle" font-size="9.5" font-weight="800" fill="#9e2f24">MSE → Mean</text>

      <rect x="110" y="0" width="100" height="32" rx="6" fill="#eef6f0" stroke="#a8cbb7"/>
      <text x="160" y="20" text-anchor="middle" font-size="9.5" font-weight="800" fill="#173d35">MAE → Median</text>

      <rect x="220" y="0" width="100" height="32" rx="6" fill="#fdf6e9" stroke="#d9c091"/>
      <text x="270" y="20" text-anchor="middle" font-size="9.5" font-weight="800" fill="#8c5d16">Pinball → Q_τ</text>
    </g>
  </g>

  <!-- Right Card: CRPS (Distributional Forecast) -->
  <g transform="translate(390, 16)">
    <rect width="352" height="278" rx="10" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.2"/>
    <text x="176" y="24" text-anchor="middle" font-size="13" font-weight="800" fill="#1e2422">2. Continuous Ranked Probability Score (CRPS)</text>
    <text x="176" y="42" text-anchor="middle" font-size="10.5" fill="#5a625e">Integrated squared distance between predicted CDF F(z) and step at y</text>

    <!-- Plot Box -->
    <g transform="translate(16, 52)">
      <rect width="320" height="170" rx="8" fill="#fbfaf6" stroke="#d8d2c5"/>

      <!-- Axes: x from 44 to 296, y from 136 (0.0) to 36 (1.0) -->
      <line x1="44" y1="136" x2="296" y2="136" stroke="#5a625e" stroke-width="1.3"/>
      <line x1="44" y1="32" x2="44" y2="136" stroke="#5a625e" stroke-width="1.3"/>
      <text x="30" y="40" text-anchor="end" font-size="9" font-weight="700" fill="#5a625e">1.0</text>
      <text x="30" y="136" text-anchor="end" font-size="9" font-weight="700" fill="#5a625e">0.0</text>

      <!-- Shaded CRPS area around observed y at x=170 -->
      <path d="M 76,136 C 125,135 148,110 170,86 L 170,136 Z" fill="#165d4c" fill-opacity="0.22"/>
      <path d="M 170,36 L 170,86 C 192,62 215,37 264,36 Z" fill="#165d4c" fill-opacity="0.22"/>

      <!-- Observed step function 1[z >= y] -->
      <polyline points="44,136 170,136 170,36 296,36" fill="none" stroke="#9e2f24" stroke-width="2.2"/>
      <text x="170" y="154" text-anchor="middle" font-size="9.5" font-weight="800" fill="#9e2f24">Observed Outcome y</text>

      <!-- Predicted smooth CDF F(z) -->
      <path d="M 60,136 C 120,136 146,112 170,86 C 194,60 220,36 280,36" fill="none" stroke="#165d4c" stroke-width="2.4"/>
      <text x="108" y="96" text-anchor="middle" font-size="9.5" font-weight="800" fill="#173d35">Predicted CDF F(z)</text>
      <text x="238" y="84" text-anchor="middle" font-size="9" font-weight="700" fill="#5a625e">Shaded area =</text>
      <text x="238" y="97" text-anchor="middle" font-size="9" font-weight="700" fill="#5a625e">CRPS penalty</text>
    </g>

    <!-- Bottom summary banner -->
    <rect x="16" y="232" width="320" height="32" rx="6" fill="#eef6f0" stroke="#a8cbb7"/>
    <text x="176" y="252" text-anchor="middle" font-size="10" font-weight="700" fill="#173d35">When F(z) collapses to a point forecast, CRPS reduces to MAE</text>
  </g>
</svg>

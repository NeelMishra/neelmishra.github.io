<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" width="900" height="370" font-family="'Manrope', -apple-system, sans-serif">
  <rect width="900" height="370" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Left Panel: MSE, MAE, Huber, and Pinball Loss Geometry -->
  <g transform="translate(20, 18)">
    <rect width="420" height="334" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
    <text x="210" y="24" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">1. Elicitation Geometry: MSE, MAE, Huber &amp; Pinball ρ_τ</text>
    <text x="210" y="41" text-anchor="middle" font-size="10.5" fill="#475569">Each loss uniquely elicits a different functional of p(y | x)</text>

    <!-- Plot area: center x=210, bottom y=218 -->
    <g transform="translate(210, 212)">
      <!-- Axes -->
      <line x1="-175" y1="0" x2="175" y2="0" stroke="#94a3b8" stroke-width="1.4"/>
      <line x1="0" y1="-150" x2="0" y2="15" stroke="#94a3b8" stroke-width="1.4"/>
      <text x="160" y="14" text-anchor="middle" font-size="9.5" font-weight="700" fill="#334155">e = y − ŷ</text>
      <text x="-145" y="14" text-anchor="middle" font-size="9" fill="#64748b">Over-predict (ŷ &gt; y)</text>
      <text x="95" y="14" text-anchor="middle" font-size="9" fill="#64748b">Under-predict (ŷ &lt; y)</text>

      <!-- MSE parabola: e^2 -->
      <path d="M -125,-145 Q 0,145 125,-145" fill="none" stroke="#dc2626" stroke-width="2.2"/>
      <text x="-132" y="-132" font-size="9.5" font-weight="800" fill="#dc2626">MSE: e² → E[Y|X]</text>

      <!-- MAE V-shape: |e| -->
      <polyline points="-145,-118 0,0 145,-118" fill="none" stroke="#2563eb" stroke-width="2.2"/>
      <text x="-158" y="-96" font-size="9.5" font-weight="800" fill="#1d4ed8">MAE: |e| → Median</text>

      <!-- Huber loss: quadratic near 0, linear outside -->
      <path d="M -145,-92 L -40,-16 Q 0,0 40,-16 L 145,-92" fill="none" stroke="#0d9488" stroke-width="2.2" stroke-dasharray="5,3"/>
      <text x="82" y="-38" font-size="9.5" font-weight="800" fill="#0f766e">Huber L_δ(e)</text>

      <!-- Pinball Loss tau=0.85: steep for e > 0, flat for e < 0 -->
      <polyline points="-145,-26 0,0 105,-142" fill="none" stroke="#7c3aed" stroke-width="2.4"/>
      <text x="58" y="-128" font-size="9.5" font-weight="800" fill="#6d28d9">Pinball ρ₀.₈₅(e) → Q₀.₈₅</text>
    </g>

    <!-- Bottom summary table inside left card -->
    <g transform="translate(18, 240)">
      <rect width="384" height="78" rx="7" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="10" y="18" font-size="10" font-weight="800" fill="#0f172a">Why Optimal Point Forecasts Depend on the Evaluation Metric:</text>
      <text x="10" y="35" font-size="9.5" fill="#334155">• argmin_ŷ E[(Y − ŷ)²] = E[Y | X] (Mean)   |   argmin_ŷ E[|Y − ŷ|] = Median(Y | X)</text>
      <text x="10" y="51" font-size="9.5" fill="#334155">• argmin_ŷ E[ρ_τ(Y − ŷ)] = F_Y⁻¹(τ | X) (Exact τ-th conditional quantile!)</text>
      <text x="10" y="67" font-size="9" font-weight="700" fill="#dc2626">• Also fulfills RMSE ≥ MAE ≥ RMSE / √N (equality iff all residuals |e_i| are equal).</text>
    </g>
  </g>

  <!-- Right Panel: CRPS & Time-Series / Relative Metrics -->
  <g transform="translate(455, 18)">
    <rect width="425" height="334" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
    <text x="212" y="24" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">2. Distributional CRPS &amp; Time-Series Scaling (MASE)</text>
    <text x="212" y="41" text-anchor="middle" font-size="10.5" fill="#475569">Evaluating full predictive CDFs F(z) and scale-free multi-series errors</text>

    <!-- Top Box: CRPS Diagram -->
    <g transform="translate(18, 56)">
      <rect width="389" height="145" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="194" y="18" text-anchor="middle" font-size="10.5" font-weight="800" fill="#1e40af">Continuous Ranked Probability Score: CRPS(F, y) = ∫ (F(z) − 1[z ≥ y])² dz</text>

      <!-- CDF axes: x from 45 to 345, y from 122 (0.0) to 42 (1.0) -->
      <line x1="45" y1="122" x2="345" y2="122" stroke="#64748b" stroke-width="1.4"/>
      <line x1="45" y1="38" x2="45" y2="122" stroke="#64748b" stroke-width="1.4"/>
      <text x="32" y="46" font-size="8.5" fill="#475569">1.0</text>
      <text x="32" y="122" font-size="8.5" fill="#475569">0.0</text>

      <!-- Shaded area between F(z) and Heaviside step at y=195 -->
      <path d="M 85,122 C 145,120 170,95 195,78 L 195,122 Z" fill="#93c5fd" fill-opacity="0.55"/>
      <path d="M 195,42 L 195,78 C 220,60 250,44 315,42 Z" fill="#93c5fd" fill-opacity="0.55"/>

      <!-- Step function 1[z >= y] -->
      <polyline points="45,122 195,122 195,42 345,42" fill="none" stroke="#dc2626" stroke-width="2.2"/>
      <text x="195" y="136" text-anchor="middle" font-size="9" font-weight="800" fill="#dc2626">Observed y</text>

      <!-- Smooth CDF F(z) -->
      <path d="M 65,122 C 140,122 165,98 195,78 C 225,58 250,42 325,42" fill="none" stroke="#2563eb" stroke-width="2.3"/>
      <text x="128" y="96" font-size="9" font-weight="700" fill="#1e40af">Predicted CDF F(z)</text>
      <text x="272" y="75" font-size="8.5" font-weight="700" fill="#1d4ed8">Reduces to MAE when</text>
      <text x="272" y="87" font-size="8.5" font-weight="700" fill="#1d4ed8">F(z) is a point mass!</text>
    </g>

    <!-- Bottom Box: R^2, MAPE trap, and MASE -->
    <g transform="translate(18, 211)">
      <rect width="389" height="107" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
      <text x="12" y="18" font-size="10.5" font-weight="800" fill="#166534">Why MAPE Fails &amp; How R² and MASE Standardize Errors:</text>
      <text x="12" y="36" font-size="9.5" fill="#15803d">• MAPE = (100/N) ∑ |y_i − ŷ_i| / |y_i|: explodes at y_i = 0 and is asymmetric</text>
      <text x="12" y="50" font-size="9.5" fill="#15803d">  (y=100, ŷ=50 → 50% error; swapped y=50, ŷ=100 → 100% error for same |e|=50!).</text>
      <text x="12" y="68" font-size="9.5" fill="#15803d">• RMSLE = √( (1/N) ∑ (ln(1+ŷ_i) − ln(1+y_i))² ): symmetric on multiplicative ratios.</text>
      <text x="12" y="84" font-size="9.5" font-weight="700" fill="#166534">• MASE = MAE / ( (1/(T−m)) ∑_{t=m+1}^T |y_t − y_{t−m}| ): never divides by zero;</text>
      <text x="12" y="98" font-size="9.5" font-weight="700" fill="#166534">  MASE &lt; 1 means the model beats the in-sample seasonal naive baseline.</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" font-family="'Manrope', -apple-system, sans-serif">
  <rect width="760" height="320" rx="12" fill="#fbfaf6" stroke="#d8d2c5" stroke-width="1.5"/>

  <!-- Left Card: Top-5 Ranked Slate -->
  <g transform="translate(18, 16)">
    <rect width="352" height="288" rx="10" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.2"/>
    <text x="176" y="24" text-anchor="middle" font-size="13" font-weight="800" fill="#1e2422">1. Top-5 Ranked Slate (4 Relevant in Corpus)</text>
    <text x="176" y="42" text-anchor="middle" font-size="10.5" fill="#5a625e">Grades r = [3, 0, 2, 1, 0] plus 1 missed item (r = 2) at rank 8</text>

    <!-- 5 Ranked Slots -->
    <g transform="translate(18, 54)">
      <!-- k = 1 -->
      <rect x="0" y="0" width="316" height="32" rx="6" fill="#eef6f0" stroke="#a8cbb7" stroke-width="1.2"/>
      <text x="12" y="20" font-size="10.5" font-weight="800" fill="#173d35">Rank 1 · Grade r = 3 (Hit)</text>
      <text x="304" y="20" text-anchor="end" font-size="10" font-weight="700" fill="#165d4c">P@1 = 1/1 = 1.00</text>

      <!-- k = 2 -->
      <rect x="0" y="37" width="316" height="32" rx="6" fill="#f7f4ec" stroke="#d8d2c5" stroke-width="1.1"/>
      <text x="12" y="57" font-size="10.5" font-weight="600" fill="#5a625e">Rank 2 · Grade r = 0 (Miss)</text>
      <text x="304" y="57" text-anchor="end" font-size="9.5" fill="#7a827e">skipped in AP</text>

      <!-- k = 3 -->
      <rect x="0" y="74" width="316" height="32" rx="6" fill="#eef6f0" stroke="#a8cbb7" stroke-width="1.2"/>
      <text x="12" y="94" font-size="10.5" font-weight="800" fill="#173d35">Rank 3 · Grade r = 2 (Hit)</text>
      <text x="304" y="94" text-anchor="end" font-size="10" font-weight="700" fill="#165d4c">P@3 = 2/3 = 0.67</text>

      <!-- k = 4 -->
      <rect x="0" y="111" width="316" height="32" rx="6" fill="#eef6f0" stroke="#a8cbb7" stroke-width="1.2"/>
      <text x="12" y="131" font-size="10.5" font-weight="800" fill="#173d35">Rank 4 · Grade r = 1 (Hit)</text>
      <text x="304" y="131" text-anchor="end" font-size="10" font-weight="700" fill="#165d4c">P@4 = 3/4 = 0.75</text>

      <!-- k = 5 -->
      <rect x="0" y="148" width="316" height="32" rx="6" fill="#f7f4ec" stroke="#d8d2c5" stroke-width="1.1"/>
      <text x="12" y="168" font-size="10.5" font-weight="600" fill="#5a625e">Rank 5 · Grade r = 0 (Miss)</text>
      <text x="304" y="168" text-anchor="end" font-size="9.5" fill="#7a827e">missed r = 2 at k = 8</text>
    </g>

    <!-- Bottom Summary Pill -->
    <rect x="18" y="244" width="316" height="30" rx="6" fill="#fdf6e9" stroke="#d9c091"/>
    <text x="176" y="263" text-anchor="middle" font-size="10" font-weight="800" fill="#8c5d16">P@5 = 0.60 · Recall@5 = 0.75 · RR = 1.00 · AP@5 = 0.604</text>
  </g>

  <!-- Right Card: Graded Discounted Gain (nDCG@5) -->
  <g transform="translate(390, 16)">
    <rect width="352" height="288" rx="10" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.2"/>
    <text x="176" y="24" text-anchor="middle" font-size="13" font-weight="800" fill="#1e2422">2. Discounted Gain: Actual DCG vs. Ideal IDCG</text>
    <text x="176" y="42" text-anchor="middle" font-size="10.5" fill="#5a625e">Discounted term (2ʳ − 1) / log₂(k + 1) at each rank k = 1..5</text>

    <!-- Bar Chart Area -->
    <g transform="translate(18, 54)">
      <rect width="316" height="178" rx="8" fill="#fbfaf6" stroke="#d8d2c5"/>

      <!-- Legend inside top-right -->
      <rect x="148" y="12" width="10" height="10" rx="2" fill="#165d4c"/>
      <text x="163" y="21" font-size="9.5" font-weight="700" fill="#1e2422">Actual [3,0,2,1,0]</text>
      <rect x="148" y="28" width="10" height="10" rx="2" fill="#d9c091" stroke="#8c5d16"/>
      <text x="163" y="37" font-size="9.5" font-weight="700" fill="#8c5d16">Ideal [3,2,2,1,0]</text>

      <!-- Axes: origin (38, 148), width 256, height 124 (scale: 7.0 -> 119px, so 17px per unit) -->
      <line x1="38" y1="148" x2="294" y2="148" stroke="#5a625e" stroke-width="1.3"/>
      <line x1="38" y1="24" x2="38" y2="148" stroke="#5a625e" stroke-width="1.3"/>
      <text x="30" y="32" text-anchor="end" font-size="8.5" fill="#5a625e">7.0</text>
      <text x="30" y="90" text-anchor="end" font-size="8.5" fill="#5a625e">3.5</text>
      <text x="30" y="148" text-anchor="end" font-size="8.5" fill="#5a625e">0.0</text>

      <!-- k=1: Actual 7.00 (119px), Ideal 7.00 (119px) -->
      <rect x="50" y="29" width="16" height="119" rx="2" fill="#165d4c"/>
      <rect x="68" y="29" width="16" height="119" rx="2" fill="#d9c091" stroke="#8c5d16"/>
      <text x="67" y="164" text-anchor="middle" font-size="9.5" font-weight="700" fill="#3a423e">k=1</text>

      <!-- k=2: Actual 0.00, Ideal 1.89 (32px) -->
      <rect x="98" y="146" width="16" height="2" rx="1" fill="#9e2f24"/>
      <rect x="116" y="116" width="16" height="32" rx="2" fill="#d9c091" stroke="#8c5d16"/>
      <text x="115" y="164" text-anchor="middle" font-size="9.5" font-weight="700" fill="#3a423e">k=2</text>

      <!-- k=3: Actual 1.50 (26px), Ideal 1.50 (26px) -->
      <rect x="146" y="122" width="16" height="26" rx="2" fill="#165d4c"/>
      <rect x="164" y="122" width="16" height="26" rx="2" fill="#d9c091" stroke="#8c5d16"/>
      <text x="163" y="164" text-anchor="middle" font-size="9.5" font-weight="700" fill="#3a423e">k=3</text>

      <!-- k=4: Actual 0.43 (8px), Ideal 0.43 (8px) -->
      <rect x="194" y="140" width="16" height="8" rx="2" fill="#165d4c"/>
      <rect x="212" y="140" width="16" height="8" rx="2" fill="#d9c091" stroke="#8c5d16"/>
      <text x="211" y="164" text-anchor="middle" font-size="9.5" font-weight="700" fill="#3a423e">k=4</text>

      <!-- k=5: Actual 0.00, Ideal 0.00 -->
      <rect x="242" y="146" width="16" height="2" rx="1" fill="#9e2f24"/>
      <rect x="260" y="146" width="16" height="2" rx="1" fill="#d9c091"/>
      <text x="259" y="164" text-anchor="middle" font-size="9.5" font-weight="700" fill="#3a423e">k=5</text>
    </g>

    <!-- Bottom Summary Pill -->
    <rect x="18" y="244" width="316" height="30" rx="6" fill="#eef6f0" stroke="#a8cbb7"/>
    <text x="176" y="263" text-anchor="middle" font-size="10" font-weight="800" fill="#173d35">DCG@5 = 8.931 · IDCG@5 = 10.824 · nDCG@5 = 0.825</text>
  </g>
</svg>

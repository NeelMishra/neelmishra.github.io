<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" role="img" aria-labelledby="title desc">
  <title id="title">Search, Retrieval, and Recommendation Ranking Metrics</title>
  <desc id="desc">Three-panel diagram showing (1) Top-K ranked list with binary hits, MRR, and AP@K cumulative precision; (2) Graded relevance nDCG@K comparing actual DCG@K against Ideal IDCG@K with logarithmic discount 1/log2(k+1); and (3) Beyond-accuracy recommender metrics including Intra-List Diversity, Novelty, and Gini exposure Lorenz curve.</desc>
  <defs>
    <style>
      .bg { fill: #f8f6f1; }
      .panel { fill: #ffffff; stroke: #d5cfc2; stroke-width: 1.5; rx: 12; }
      .title { font: 700 14px "Inter", "Segoe UI", sans-serif; fill: #1e293b; }
      .subtitle { font: 600 11.5px "Inter", "Segoe UI", sans-serif; fill: #475569; }
      .label { font: 500 11px "Inter", "Segoe UI", sans-serif; fill: #334155; }
      .math { font: 600 11px "Cambria Math", "STIX Two Math", "Georgia", serif; fill: #0f172a; }
      .small { font: 500 10px "Inter", "Segoe UI", sans-serif; fill: #64748b; }
      .hit { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.4; rx: 5; }
      .miss { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.2; rx: 5; }
      .bar-actual { fill: #2563eb; opacity: 0.85; rx: 3; }
      .bar-ideal { fill: #0d9488; opacity: 0.85; rx: 3; }
      .axis { stroke: #64748b; stroke-width: 1.3; }
      .grid { stroke: #e2e8f0; stroke-width: 1; stroke-dasharray: 3 3; }
      .curve-discount { fill: none; stroke: #d97706; stroke-width: 2.2; }
      .curve-lorenz { fill: none; stroke: #dc2626; stroke-width: 2.2; }
      .curve-equal { fill: none; stroke: #64748b; stroke-width: 1.4; stroke-dasharray: 4 3; }
      .gini-area { fill: #fecaca; opacity: 0.45; }
    </style>
  </defs>

  <rect width="900" height="370" class="bg" />

  <!-- PANEL 1: Binary Top-K, MRR & AP@K -->
  <rect x="16" y="16" width="282" height="338" class="panel" />
  <text x="30" y="40" class="title">1. Binary Top-K: P@K, MRR &amp; AP@K</text>
  <text x="30" y="57" class="subtitle">Ranked list for query q (|R_q| = 4 relevant total)</text>

  <!-- Ranked Slots k=1..5 -->
  <g transform="translate(30, 72)">
    <!-- k=1 -->
    <rect x="0" y="0" width="254" height="34" class="hit" />
    <text x="10" y="21" class="math">k=1: Item d₁ (rel = 1)</text>
    <text x="148" y="21" class="label" fill="#15803d">P@1 = 1/1 = 1.00</text>

    <!-- k=2 -->
    <rect x="0" y="40" width="254" height="34" class="miss" />
    <text x="10" y="61" class="math">k=2: Item d₂ (rel = 0)</text>
    <text x="148" y="61" class="small">miss (skipped in AP)</text>

    <!-- k=3 -->
    <rect x="0" y="80" width="254" height="34" class="hit" />
    <text x="10" y="101" class="math">k=3: Item d₃ (rel = 1)</text>
    <text x="148" y="101" class="label" fill="#15803d">P@3 = 2/3 = 0.67</text>

    <!-- k=4 -->
    <rect x="0" y="120" width="254" height="34" class="hit" />
    <text x="10" y="141" class="math">k=4: Item d₄ (rel = 1)</text>
    <text x="148" y="141" class="label" fill="#15803d">P@4 = 3/4 = 0.75</text>

    <!-- k=5 -->
    <rect x="0" y="160" width="254" height="34" class="miss" />
    <text x="10" y="181" class="math">k=5: Item d₅ (rel = 0)</text>
    <text x="148" y="181" class="small">miss (1 rel at k=8)</text>
  </g>

  <rect x="30" y="276" width="254" height="64" fill="#f8fafc" stroke="#cbd5e1" rx="6" />
  <text x="40" y="295" class="math">• P@5 = 3/5 = 0.60,  Recall@5 = 3/4 = 0.75</text>
  <text x="40" y="313" class="math">• RR = 1 / k_first = 1/1 = 1.00</text>
  <text x="40" y="331" class="math">• AP@5 = (1.00 + 0.67 + 0.75) / 4 = 0.604</text>

  <!-- PANEL 2: Graded Relevance & nDCG@K -->
  <rect x="310" y="16" width="282" height="338" class="panel" />
  <text x="324" y="40" class="title">2. Graded Gain &amp; Log Discount (nDCG)</text>
  <text x="324" y="57" class="subtitle">Gain G(r) = 2ʳ − 1, Discount D(k) = 1/log₂(k+1)</text>

  <!-- Plot of Discounted Gain per Rank -->
  <g transform="translate(334, 78)">
    <line x1="20" y1="140" x2="238" y2="140" class="axis" />
    <line x1="20" y1="10" x2="20" y2="140" class="axis" />
    <line x1="20" y1="42" x2="238" y2="42" class="grid" />
    <line x1="20" y1="75" x2="238" y2="75" class="grid" />
    <line x1="20" y1="108" x2="238" y2="108" class="grid" />

    <text x="2" y="16" class="small">7</text>
    <text x="2" y="78" class="small">3.5</text>
    <text x="6" y="140" class="small">0</text>

    <!-- k=1: Actual r=3 (G/D=7.0), Ideal r=3 (7.0) -->
    <rect x="34" y="12" width="13" height="128" class="bar-actual" />
    <rect x="49" y="12" width="13" height="128" class="bar-ideal" />
    <text x="36" y="155" class="small">k=1</text>

    <!-- k=2: Actual r=0 (0), Ideal r=2 (3*0.631=1.89) -->
    <rect x="76" y="139" width="13" height="1" class="bar-actual" />
    <rect x="91" y="105" width="13" height="35" class="bar-ideal" />
    <text x="78" y="155" class="small">k=2</text>

    <!-- k=3: Actual r=2 (3*0.5=1.5), Ideal r=2 (1.5) -->
    <rect x="118" y="112" width="13" height="28" class="bar-actual" />
    <rect x="133" y="112" width="13" height="28" class="bar-ideal" />
    <text x="120" y="155" class="small">k=3</text>

    <!-- k=4: Actual r=1 (1*0.431=0.43), Ideal r=1 (0.43) -->
    <rect x="160" y="132" width="13" height="8" class="bar-actual" />
    <rect x="175" y="132" width="13" height="8" class="bar-ideal" />
    <text x="162" y="155" class="small">k=4</text>

    <!-- k=5: Actual r=0 (0), Ideal r=0 (0) -->
    <rect x="202" y="139" width="13" height="1" class="bar-actual" />
    <rect x="217" y="139" width="13" height="1" class="bar-ideal" />
    <text x="204" y="155" class="small">k=5</text>

    <!-- Discount curve overlay (scaled to top=7) -->
    <path d="M 42 12 Q 84 62, 126 76 T 210 92" class="curve-discount" />
    <text x="116" y="32" class="small" fill="#b45309">7 / log₂(k+1) envelope</text>
  </g>

  <!-- Legend -->
  <rect x="334" y="244" width="10" height="10" class="bar-actual" />
  <text x="348" y="253" class="small">Actual [3,0,2,1,0]</text>
  <rect x="450" y="244" width="10" height="10" class="bar-ideal" />
  <text x="464" y="253" class="small">Ideal [3,2,2,1,0]</text>

  <rect x="324" y="266" width="254" height="74" fill="#f8fafc" stroke="#cbd5e1" rx="6" />
  <text x="334" y="285" class="math">• DCG@5 = 7.00 + 0 + 1.50 + 0.431 + 0 = 8.931</text>
  <text x="334" y="303" class="math">• IDCG@5 = 7.00 + 1.893 + 1.50 + 0.431 = 10.824</text>
  <text x="334" y="322" class="math" fill="#0f766e">• nDCG@5 = 8.931 / 10.824 = 0.8251</text>

  <!-- PANEL 3: Beyond-Accuracy & Gini Exposure -->
  <rect x="604" y="16" width="280" height="338" class="panel" />
  <text x="618" y="40" class="title">3. Beyond Accuracy: Diversity &amp; Gini</text>
  <text x="618" y="57" class="subtitle">Item exposure Lorenz curve &amp; catalog tail</text>

  <!-- Lorenz Curve Plot -->
  <g transform="translate(632, 74)">
    <line x1="20" y1="145" x2="215" y2="145" class="axis" />
    <line x1="20" y1="10" x2="20" y2="145" class="axis" />
    <!-- Equality diagonal -->
    <line x1="20" y1="145" x2="215" y2="10" class="curve-equal" />
    <!-- Shaded Gini area -->
    <path d="M 20 145 L 215 10 L 215 145 Z" fill="none" />
    <path d="M 20 145 Q 155 142, 215 10 L 20 145 Z" class="gini-area" />
    <!-- Lorenz curve -->
    <path d="M 20 145 Q 155 142, 215 10" class="curve-lorenz" />

    <text x="62" y="75" class="small" fill="#475569">Uniform exposure</text>
    <text x="112" y="114" class="math" fill="#b91c1c">Area A (Gini = 2A)</text>
    <text x="48" y="160" class="small">Cumulative fraction of catalog items</text>
    <text x="2" y="18" class="small">1.0</text>
    <text x="2" y="145" class="small">0</text>
  </g>

  <rect x="618" y="246" width="252" height="94" fill="#f8fafc" stroke="#cbd5e1" rx="6" />
  <text x="628" y="265" class="math">• ILD(L) = (2 / K(K−1)) ∑ d(i, j)</text>
  <text x="628" y="284" class="math">• Novelty(L) = (1 / K) ∑ (−log₂ P(i))</text>
  <text x="628" y="303" class="math">• Coverage = |⋃_u L_u| / |I|</text>
  <text x="628" y="322" class="math">• Serendipity = Unusual(i, u) × Rel(i, u)</text>
</svg>

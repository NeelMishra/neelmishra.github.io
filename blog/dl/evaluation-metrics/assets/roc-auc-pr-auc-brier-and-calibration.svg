<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" font-family="'Manrope', -apple-system, sans-serif">
  <rect width="760" height="320" rx="12" fill="#fbfaf6" stroke="#d8d2c5" stroke-width="1.5"/>

  <!-- Left Card: ROC vs PR Curve -->
  <g transform="translate(18, 16)">
    <rect width="352" height="288" rx="10" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.2"/>
    <text x="176" y="24" text-anchor="middle" font-size="13" font-weight="800" fill="#1e2422">1. Ranking: ROC vs. PR Curve</text>
    <text x="176" y="42" text-anchor="middle" font-size="10.5" fill="#5a625e">100 Positives, 9,900 Negatives · TP = 90, FP = 500</text>

    <!-- Mini Plot A: ROC Curve -->
    <g transform="translate(16, 54)">
      <rect width="154" height="176" rx="8" fill="#eef6f0" stroke="#a8cbb7"/>
      <text x="77" y="18" text-anchor="middle" font-size="10.5" font-weight="800" fill="#173d35">ROC Curve</text>
      <text x="77" y="32" text-anchor="middle" font-size="9.5" font-weight="700" fill="#165d4c">ROC-AUC = 0.95</text>

      <!-- Axes: origin (28, 144), width 108, height 96 -->
      <line x1="28" y1="144" x2="136" y2="144" stroke="#5a625e" stroke-width="1.3"/>
      <line x1="28" y1="48" x2="28" y2="144" stroke="#5a625e" stroke-width="1.3"/>
      <line x1="28" y1="144" x2="136" y2="48" stroke="#8a928e" stroke-dasharray="3,3" stroke-width="1.2"/>

      <!-- ROC curve -->
      <path d="M 28,144 C 31,68 42,54 136,48 L 136,144 Z" fill="#165d4c" fill-opacity="0.16"/>
      <path d="M 28,144 C 31,68 42,54 136,48" fill="none" stroke="#165d4c" stroke-width="2.2"/>
      <circle cx="36" cy="60" r="3.8" fill="#9e2f24"/>
      <text x="44" y="64" font-size="8.5" font-weight="700" fill="#9e2f24">FPR = 0.05</text>

      <text x="82" y="162" text-anchor="middle" font-size="9" font-weight="700" fill="#3a423e">False Positive Rate</text>
      <text x="15" y="96" text-anchor="middle" font-size="9" font-weight="700" fill="#3a423e" transform="rotate(-90 15 96)">TPR</text>
    </g>

    <!-- Mini Plot B: PR Curve -->
    <g transform="translate(182, 54)">
      <rect width="154" height="176" rx="8" fill="#fdf2f0" stroke="#dfb0a8"/>
      <text x="77" y="18" text-anchor="middle" font-size="10.5" font-weight="800" fill="#9e2f24">PR Curve</text>
      <text x="77" y="32" text-anchor="middle" font-size="9.5" font-weight="700" fill="#9e2f24">PR-AUC = 0.34</text>

      <!-- Axes: origin (28, 144), width 108, height 96 -->
      <line x1="28" y1="144" x2="136" y2="144" stroke="#5a625e" stroke-width="1.3"/>
      <line x1="28" y1="48" x2="28" y2="144" stroke="#5a625e" stroke-width="1.3"/>
      <!-- Random baseline at 1% -->
      <line x1="28" y1="142" x2="136" y2="142" stroke="#9e2f24" stroke-dasharray="3,3" stroke-width="1.2"/>

      <!-- PR curve -->
      <path d="M 28,52 C 48,68 74,122 136,138 L 136,144 L 28,144 Z" fill="#9e2f24" fill-opacity="0.15"/>
      <path d="M 28,52 C 48,68 74,122 136,138" fill="none" stroke="#9e2f24" stroke-width="2.2"/>
      <circle cx="118" cy="133" r="3.8" fill="#9e2f24"/>
      <text x="86" y="122" text-anchor="middle" font-size="8.5" font-weight="700" fill="#9e2f24">Prec = 0.15</text>

      <text x="82" y="162" text-anchor="middle" font-size="9" font-weight="700" fill="#3a423e">Recall (TPR)</text>
      <text x="15" y="96" text-anchor="middle" font-size="9" font-weight="700" fill="#3a423e" transform="rotate(-90 15 96)">Precision</text>
    </g>

    <!-- Bottom summary pill -->
    <rect x="16" y="242" width="320" height="32" rx="6" fill="#f7f4ec" stroke="#d8d2c5"/>
    <text x="176" y="262" text-anchor="middle" font-size="10" font-weight="700" fill="#3a423e">500 false alarms barely move FPR (5%), but drop Precision to 15%</text>
  </g>

  <!-- Right Card: Reliability Diagram & ECE -->
  <g transform="translate(390, 16)">
    <rect width="352" height="288" rx="10" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.2"/>
    <text x="176" y="24" text-anchor="middle" font-size="13" font-weight="800" fill="#1e2422">2. Calibration: Confidence vs. Accuracy</text>
    <text x="176" y="42" text-anchor="middle" font-size="10.5" fill="#5a625e">Do 80%-confidence predictions actually happen 80% of the time?</text>

    <!-- Plot Box -->
    <g transform="translate(16, 54)">
      <rect width="320" height="176" rx="8" fill="#fbfaf6" stroke="#d8d2c5"/>

      <!-- Axes: origin (42, 144), width 150, height 110 (y from 34 to 144) -->
      <line x1="42" y1="144" x2="192" y2="144" stroke="#5a625e" stroke-width="1.3"/>
      <line x1="42" y1="34" x2="42" y2="144" stroke="#5a625e" stroke-width="1.3"/>
      <!-- Perfect calibration diagonal -->
      <line x1="42" y1="144" x2="192" y2="34" stroke="#173d35" stroke-dasharray="4,3" stroke-width="1.4"/>

      <!-- 5 Bins (each width 22, spacing 28) -->
      <!-- Bin 1: conf 0.1, acc 0.12 -->
      <rect x="47" y="131" width="22" height="13" fill="#165d4c" fill-opacity="0.75" stroke="#173d35"/>
      <!-- Bin 2: conf 0.3, acc 0.28 -->
      <rect x="75" y="113" width="22" height="31" fill="#165d4c" fill-opacity="0.75" stroke="#173d35"/>
      <!-- Bin 3: conf 0.5, acc 0.43 + gap -->
      <rect x="103" y="97" width="22" height="47" fill="#165d4c" fill-opacity="0.75" stroke="#173d35"/>
      <rect x="103" y="89" width="22" height="8" fill="#fdf2f0" stroke="#9e2f24" stroke-dasharray="2,2"/>
      <!-- Bin 4: conf 0.7, acc 0.55 + gap -->
      <rect x="131" y="84" width="22" height="60" fill="#165d4c" fill-opacity="0.75" stroke="#173d35"/>
      <rect x="131" y="67" width="22" height="17" fill="#fdf2f0" stroke="#9e2f24" stroke-dasharray="2,2"/>
      <!-- Bin 5: conf 0.9, acc 0.70 + gap -->
      <rect x="159" y="67" width="22" height="77" fill="#165d4c" fill-opacity="0.75" stroke="#173d35"/>
      <rect x="159" y="45" width="22" height="22" fill="#fdf2f0" stroke="#9e2f24" stroke-dasharray="2,2"/>

      <text x="117" y="162" text-anchor="middle" font-size="9" font-weight="700" fill="#3a423e">Predicted Confidence</text>
      <text x="22" y="89" text-anchor="middle" font-size="9" font-weight="700" fill="#3a423e" transform="rotate(-90 22 89)">Actual Accuracy</text>

      <!-- Legend / Explanation on the right (x=204..308) -->
      <rect x="204" y="36" width="12" height="10" fill="#165d4c" fill-opacity="0.75" stroke="#173d35"/>
      <text x="222" y="45" font-size="9.5" font-weight="700" fill="#1e2422">Actual Accuracy</text>

      <rect x="204" y="58" width="12" height="10" fill="#fdf2f0" stroke="#9e2f24" stroke-dasharray="2,2"/>
      <text x="222" y="67" font-size="9.5" font-weight="700" fill="#9e2f24">Overconfidence Gap</text>

      <line x1="204" y1="88" x2="306" y2="88" stroke="#e2ddd2"/>
      <text x="204" y="106" font-size="9.5" font-weight="800" fill="#173d35">ECE = Weighted Gap</text>
      <text x="204" y="121" font-size="9" fill="#5a625e">Average |acc − conf|</text>
      <text x="204" y="134" font-size="9" fill="#5a625e">across confidence bins</text>
    </g>

    <!-- Bottom summary pill -->
    <rect x="16" y="242" width="320" height="32" rx="6" fill="#fdf6e9" stroke="#d9c091"/>
    <text x="176" y="262" text-anchor="middle" font-size="10" font-weight="700" fill="#8c5d16">Brier = Mean Squared Error (p̂ − y)²  |  ECE = Mean Bin Gap</text>
  </g>
</svg>

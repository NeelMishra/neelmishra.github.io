<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" width="900" height="370" font-family="'Manrope', -apple-system, sans-serif">
  <rect width="900" height="370" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Left Panel: ROC-AUC vs PR-AUC under 1% Prevalence -->
  <g transform="translate(20, 18)">
    <rect width="420" height="334" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
    <text x="210" y="24" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">1. ROC-AUC vs. PR-AUC (AP) on Rare Positives (π = 1%)</text>
    <text x="210" y="41" text-anchor="middle" font-size="10.5" fill="#475569">ROC-AUC = Pr(ŝ₊ &gt; ŝ₋) is prevalence-invariant; PR-AUC tracks FP/(TP+FP)</text>

    <!-- Mini Plot 1: ROC Curve -->
    <g transform="translate(18, 56)">
      <rect width="184" height="190" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="92" y="18" text-anchor="middle" font-size="10.5" font-weight="800" fill="#1e40af">ROC Curve (TPR vs. FPR)</text>
      <text x="92" y="32" text-anchor="middle" font-size="9" fill="#1d4ed8">ROC-AUC = 0.95 (Looks great!)</text>
      <!-- Axes: origin at (32, 160), size 130x115 -->
      <line x1="32" y1="160" x2="162" y2="160" stroke="#64748b" stroke-width="1.4"/>
      <line x1="32" y1="45" x2="32" y2="160" stroke="#64748b" stroke-width="1.4"/>
      <!-- Random diagonal -->
      <line x1="32" y1="160" x2="162" y2="45" stroke="#94a3b8" stroke-dasharray="4,3" stroke-width="1.3"/>
      <!-- ROC curve hugging top-left -->
      <path d="M 32,160 C 35,70 46,52 162,45 L 162,160 Z" fill="#93c5fd" fill-opacity="0.35"/>
      <path d="M 32,160 C 35,70 46,52 162,45" fill="none" stroke="#2563eb" stroke-width="2.4"/>
      <circle cx="42" cy="64" r="4" fill="#dc2626"/>
      <text x="48" y="68" font-size="8.5" font-weight="700" fill="#991b1b">FP=500 → FPR=0.05</text>
      <text x="97" y="176" text-anchor="middle" font-size="9" font-weight="700" fill="#334155">FPR = FP / (FP + TN)</text>
    </g>

    <!-- Mini Plot 2: PR Curve -->
    <g transform="translate(216, 56)">
      <rect width="186" height="190" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
      <text x="93" y="18" text-anchor="middle" font-size="10.5" font-weight="800" fill="#9a3412">PR Curve (Precision vs. Recall)</text>
      <text x="93" y="32" text-anchor="middle" font-size="9" fill="#c2410c">PR-AUC = 0.34 (Exposes 500 FPs!)</text>
      <!-- Axes: origin at (32, 160), size 130x115 -->
      <line x1="32" y1="160" x2="162" y2="160" stroke="#64748b" stroke-width="1.4"/>
      <line x1="32" y1="45" x2="32" y2="160" stroke="#64748b" stroke-width="1.4"/>
      <!-- Random baseline at prevalence pi = 0.01 -->
      <line x1="32" y1="157" x2="162" y2="157" stroke="#dc2626" stroke-dasharray="4,3" stroke-width="1.3"/>
      <text x="98" y="153" text-anchor="middle" font-size="8" font-weight="700" fill="#dc2626">Random baseline = π (0.01)</text>
      <!-- PR curve dropping sharply -->
      <path d="M 32,50 C 55,68 85,135 162,155 L 162,160 L 32,160 Z" fill="#fdba74" fill-opacity="0.35"/>
      <path d="M 32,50 C 55,68 85,135 162,155" fill="none" stroke="#ea580c" stroke-width="2.4"/>
      <circle cx="135" cy="141" r="4" fill="#dc2626"/>
      <text x="94" y="132" font-size="8.5" font-weight="700" fill="#9a3412">P = 90/590 = 0.15!</text>
      <text x="97" y="176" text-anchor="middle" font-size="9" font-weight="700" fill="#334155">Recall = TP / (TP + FN)</text>
    </g>

    <!-- Bottom takeaway box -->
    <g transform="translate(18, 256)">
      <rect width="384" height="62" rx="7" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="10" y="18" font-size="10" font-weight="800" fill="#0f172a">Wilcoxon–Mann–Whitney Equivalence (Rank-Only Metric):</text>
      <text x="10" y="35" font-size="9.5" fill="#334155">ROC-AUC = (1 / P·N) ∑_{i∈Pos} ∑_{j∈Neg} ( 1[ŝ_i &gt; ŝ_j] + ½ 1[ŝ_i = ŝ_j] )</text>
      <text x="10" y="51" font-size="9" fill="#0f766e" font-weight="700">Invariant to any strictly increasing transform g(ŝ) — so ROC-AUC ignores calibration!</text>
    </g>
  </g>

  <!-- Right Panel: Calibration Reliability Diagram, ECE, and Brier Decomposition -->
  <g transform="translate(455, 18)">
    <rect width="425" height="334" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
    <text x="212" y="24" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">2. Calibration: Reliability Diagram, ECE &amp; Brier Score</text>
    <text x="212" y="41" text-anchor="middle" font-size="10.5" fill="#475569">Do predicted probabilities p̂ = 0.80 actually come true 80% of the time?</text>

    <!-- Reliability Diagram -->
    <g transform="translate(20, 56)">
      <rect width="385" height="172" rx="8" fill="#f0fdfa" stroke="#99f6e4"/>
      <text x="192" y="18" text-anchor="middle" font-size="10.5" font-weight="800" fill="#115e59">Reliability Diagram &amp; Bin Calibration Gap |acc(B_m) − conf(B_m)|</text>

      <!-- Plot area: x from 48 to 218 (width 170), y from 148 to 32 (height 116) -->
      <line x1="48" y1="148" x2="218" y2="148" stroke="#64748b" stroke-width="1.4"/>
      <line x1="48" y1="32" x2="48" y2="148" stroke="#64748b" stroke-width="1.4"/>
      <!-- Ideal diagonal -->
      <line x1="48" y1="148" x2="218" y2="32" stroke="#0d9488" stroke-dasharray="4,3" stroke-width="1.6"/>

      <!-- 5 Bins showing overconfident deep net at high conf -->
      <!-- Bin 1: conf 0.1, acc 0.12 -->
      <rect x="52" y="134" width="26" height="14" fill="#2dd4bf" fill-opacity="0.7" stroke="#0f766e"/>
      <!-- Bin 2: conf 0.3, acc 0.27 -->
      <rect x="86" y="116" width="26" height="32" fill="#2dd4bf" fill-opacity="0.7" stroke="#0f766e"/>
      <!-- Bin 3: conf 0.5, acc 0.44 -->
      <rect x="120" y="97" width="26" height="51" fill="#2dd4bf" fill-opacity="0.7" stroke="#0f766e"/>
      <!-- Bin 4: conf 0.7, acc 0.56 (gap!) -->
      <rect x="154" y="83" width="26" height="65" fill="#2dd4bf" fill-opacity="0.7" stroke="#0f766e"/>
      <rect x="154" y="67" width="26" height="16" fill="#fca5a5" fill-opacity="0.65" stroke="#dc2626" stroke-dasharray="2,2"/>
      <!-- Bin 5: conf 0.9, acc 0.72 (overconfident gap!) -->
      <rect x="188" y="64" width="26" height="84" fill="#2dd4bf" fill-opacity="0.7" stroke="#0f766e"/>
      <rect x="188" y="43" width="26" height="21" fill="#fca5a5" fill-opacity="0.65" stroke="#dc2626" stroke-dasharray="2,2"/>

      <text x="133" y="164" text-anchor="middle" font-size="9" font-weight="700" fill="#134e4a">Predicted Confidence conf(B_m)</text>

      <!-- Callout text on right inside box -->
      <text x="230" y="54" font-size="9.5" font-weight="800" fill="#991b1b">Red hatched = Gap</text>
      <text x="230" y="69" font-size="9" fill="#b91c1c">|acc(B_m) − conf(B_m)|</text>
      <text x="230" y="92" font-size="9.5" font-weight="800" fill="#115e59">ECE Formula:</text>
      <text x="230" y="107" font-size="9" fill="#0f766e">∑_{m=1}^M (|B_m|/N) |acc_m − conf_m|</text>
      <text x="230" y="128" font-size="9.5" font-weight="800" fill="#115e59">MCE (Worst Bin):</text>
      <text x="230" y="143" font-size="9" fill="#0f766e">max_m |acc(B_m) − conf(B_m)|</text>
    </g>

    <!-- Brier Score 3-Way Decomposition Box -->
    <g transform="translate(20, 238)">
      <rect width="385" height="80" rx="8" fill="#f5f3ff" stroke="#ddd6fe"/>
      <text x="12" y="18" font-size="10.5" font-weight="800" fill="#5b21b6">Murphy's Exact 3-Way Brier Score Decomposition:</text>
      <text x="192" y="38" text-anchor="middle" font-size="10" font-weight="800" fill="#4c1d95">BS = (1/N)∑(p̂_i − y_i)² = Reliability (↓) − Resolution (↑) + Uncertainty</text>
      <text x="12" y="56" font-size="9" fill="#5b21b6">• Reliability = calibration error; Resolution = how far bin accuracies separate from π;</text>
      <text x="12" y="70" font-size="9" fill="#5b21b6">• Strictly proper scoring rule: uniquely minimized when p̂(x) = Pr(Y=1 | X=x).</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="'Manrope', -apple-system, sans-serif">
  <rect width="760" height="300" rx="12" fill="#fbfaf6" stroke="#d8d2c5" stroke-width="1.5"/>

  <!-- Card 1: The RAGAS Evaluation Triad -->
  <g transform="translate(16, 16)">
    <rect width="232" height="268" rx="10" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.2"/>
    <text x="116" y="24" text-anchor="middle" font-size="12.5" font-weight="800" fill="#1e2422">1. The RAGAS Evaluation Triad</text>
    <text x="116" y="41" text-anchor="middle" font-size="10" fill="#5a625e">Query q, Context C, and Answer a</text>

    <g transform="translate(16, 52)">
      <rect width="200" height="160" rx="8" fill="#fbfaf6" stroke="#d8d2c5"/>

      <!-- Top Node: Query q -->
      <rect x="64" y="12" width="72" height="28" rx="6" fill="#fdf6e9" stroke="#8c5d16" stroke-width="1.5"/>
      <text x="100" y="30" text-anchor="middle" font-size="10" font-weight="800" fill="#8c5d16">Query q</text>

      <!-- Bottom Left: Context C -->
      <rect x="12" y="106" width="76" height="28" rx="6" fill="#eef6f0" stroke="#165d4c" stroke-width="1.5"/>
      <text x="50" y="124" text-anchor="middle" font-size="10" font-weight="800" fill="#173d35">Context C</text>

      <!-- Bottom Right: Answer a -->
      <rect x="112" y="106" width="76" height="28" rx="6" fill="#fdf2f0" stroke="#9e2f24" stroke-width="1.5"/>
      <text x="150" y="124" text-anchor="middle" font-size="10" font-weight="800" fill="#9e2f24">Answer a</text>

      <!-- Edges -->
      <line x1="82" y1="40" x2="50" y2="106" stroke="#165d4c" stroke-width="1.8"/>
      <text x="44" y="68" text-anchor="middle" font-size="8.5" font-weight="800" fill="#173d35">Context</text>
      <text x="44" y="80" text-anchor="middle" font-size="8.5" font-weight="800" fill="#173d35">Prec &amp; Rec</text>

      <line x1="118" y1="40" x2="150" y2="106" stroke="#8c5d16" stroke-width="1.8"/>
      <text x="156" y="68" text-anchor="middle" font-size="8.5" font-weight="800" fill="#8c5d16">Answer</text>
      <text x="156" y="80" text-anchor="middle" font-size="8.5" font-weight="800" fill="#8c5d16">Relevance</text>

      <line x1="88" y1="120" x2="112" y2="120" stroke="#9e2f24" stroke-width="2.0"/>
      <text x="100" y="149" text-anchor="middle" font-size="9" font-weight="800" fill="#9e2f24">Faithfulness (C Entails a)</text>
    </g>

    <rect x="16" y="222" width="200" height="32" rx="6" fill="#eef6f0" stroke="#a8cbb7"/>
    <text x="116" y="242" text-anchor="middle" font-size="9.5" font-weight="800" fill="#173d35">Separates Retriever vs. Generator</text>
  </g>

  <!-- Card 2: Context Precision@K -->
  <g transform="translate(264, 16)">
    <rect width="232" height="268" rx="10" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.2"/>
    <text x="116" y="24" text-anchor="middle" font-size="12.5" font-weight="800" fill="#1e2422">2. Context Precision@K</text>
    <text x="116" y="41" text-anchor="middle" font-size="10" fill="#5a625e">Rank-weighted chunk relevance</text>

    <g transform="translate(16, 52)">
      <rect width="200" height="160" rx="8" fill="#fbfaf6" stroke="#d8d2c5"/>

      <!-- 4 Ranked Chunks -->
      <rect x="14" y="14" width="172" height="26" rx="4" fill="#eef6f0" stroke="#165d4c" stroke-width="1.3"/>
      <text x="24" y="31" font-size="8.5" font-weight="800" fill="#173d35">k=1: Relevant (v_1=1)</text>
      <text x="178" y="31" text-anchor="end" font-size="8.5" font-weight="800" fill="#173d35">P@1 = 1/1</text>

      <rect x="14" y="46" width="172" height="26" rx="4" fill="#fdf2f0" stroke="#9e2f24" stroke-width="1.2"/>
      <text x="24" y="63" font-size="8.5" font-weight="700" fill="#9e2f24">k=2: Noise (v_2=0)</text>
      <text x="178" y="63" text-anchor="end" font-size="8.5" fill="#5a625e">skip</text>

      <rect x="14" y="78" width="172" height="26" rx="4" fill="#eef6f0" stroke="#165d4c" stroke-width="1.3"/>
      <text x="24" y="95" font-size="8.5" font-weight="800" fill="#173d35">k=3: Relevant (v_3=1)</text>
      <text x="178" y="95" text-anchor="end" font-size="8.5" font-weight="800" fill="#173d35">P@3 = 2/3</text>

      <rect x="14" y="110" width="172" height="26" rx="4" fill="#eef6f0" stroke="#165d4c" stroke-width="1.3"/>
      <text x="24" y="127" font-size="8.5" font-weight="800" fill="#173d35">k=4: Relevant (v_4=1)</text>
      <text x="178" y="127" text-anchor="end" font-size="8.5" font-weight="800" fill="#173d35">P@4 = 3/4</text>

      <text x="100" y="151" text-anchor="middle" font-size="8.5" font-weight="800" fill="#3a423e">Avg: (1 + 0.667 + 0.75) / 3 = 0.8056</text>
    </g>

    <rect x="16" y="222" width="200" height="32" rx="6" fill="#fdf6e9" stroke="#d9c091"/>
    <text x="116" y="242" text-anchor="middle" font-size="9.5" font-weight="800" fill="#8c5d16">Rewards Relevant Chunks Early</text>
  </g>

  <!-- Card 3: Atomic Faithfulness & FActScore -->
  <g transform="translate(512, 16)">
    <rect width="232" height="268" rx="10" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.2"/>
    <text x="116" y="24" text-anchor="middle" font-size="12.5" font-weight="800" fill="#1e2422">3. Atomic Claim Entailment</text>
    <text x="116" y="41" text-anchor="middle" font-size="10" fill="#5a625e">Faithfulness &amp; FActScore verification</text>

    <g transform="translate(16, 52)">
      <rect width="200" height="160" rx="8" fill="#fbfaf6" stroke="#d8d2c5"/>

      <text x="100" y="22" text-anchor="middle" font-size="8.5" font-weight="800" fill="#3a423e">Answer a → Atomic Claims S(a)</text>

      <!-- Claim 1 -->
      <rect x="14" y="30" width="172" height="24" rx="4" fill="#eef6f0" stroke="#165d4c"/>
      <text x="22" y="46" font-size="8.5" font-weight="700" fill="#173d35">Claim s_1: Entailed by C</text>
      <text x="178" y="46" text-anchor="end" font-size="8.5" font-weight="800" fill="#173d35">✓ 1</text>

      <!-- Claim 2 -->
      <rect x="14" y="60" width="172" height="24" rx="4" fill="#eef6f0" stroke="#165d4c"/>
      <text x="22" y="76" font-size="8.5" font-weight="700" fill="#173d35">Claim s_2: Entailed by C</text>
      <text x="178" y="76" text-anchor="end" font-size="8.5" font-weight="800" fill="#173d35">✓ 1</text>

      <!-- Claim 3 -->
      <rect x="14" y="90" width="172" height="24" rx="4" fill="#eef6f0" stroke="#165d4c"/>
      <text x="22" y="106" font-size="8.5" font-weight="700" fill="#173d35">Claim s_3: Entailed by C</text>
      <text x="178" y="106" text-anchor="end" font-size="8.5" font-weight="800" fill="#173d35">✓ 1</text>

      <!-- Claim 4 (Hallucinated) -->
      <rect x="14" y="120" width="172" height="24" rx="4" fill="#fdf2f0" stroke="#9e2f24"/>
      <text x="22" y="136" font-size="8.5" font-weight="700" fill="#9e2f24">Claim s_4: Unsupported</text>
      <text x="178" y="136" text-anchor="end" font-size="8.5" font-weight="800" fill="#9e2f24">✗ 0</text>
    </g>

    <rect x="16" y="222" width="200" height="32" rx="6" fill="#eef6f0" stroke="#a8cbb7"/>
    <text x="116" y="242" text-anchor="middle" font-size="9.5" font-weight="800" fill="#173d35">Faithfulness = 3/4 = 75% (25% Halluc.)</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" role="img" aria-labelledby="title desc">
  <title id="title">Vision, Segmentation, Generative, and Clustering Metrics</title>
  <desc id="desc">Three-panel diagram illustrating (1) IoU, Dice, GIoU enclosing hull C, and COCO mAP@[.50:.05:.95] + Panoptic Quality PQ=SQ*RQ; (2) Reconstruction and Generative metrics PSNR, SSIM, Inception Score KL divergence, and Frechet Inception Distance 2-Wasserstein Gaussian alignment; and (3) Clustering internal Silhouette s(i) and external Adjusted Rand Index / NMI.</desc>
  <defs>
    <style>
      .bg { fill: #f8f6f1; }
      .panel { fill: #ffffff; stroke: #d5cfc2; stroke-width: 1.5; rx: 12; }
      .title { font: 700 14px "Inter", "Segoe UI", sans-serif; fill: #1e293b; }
      .subtitle { font: 600 11.5px "Inter", "Segoe UI", sans-serif; fill: #475569; }
      .label { font: 500 11px "Inter", "Segoe UI", sans-serif; fill: #334155; }
      .math { font: 600 11px "Cambria Math", "STIX Two Math", "Georgia", serif; fill: #0f172a; }
      .small { font: 500 10px "Inter", "Segoe UI", sans-serif; fill: #64748b; }
      .box-gt { fill: #dcfce7; fill-opacity: 0.6; stroke: #16a34a; stroke-width: 2; }
      .box-pred { fill: #dbeafe; fill-opacity: 0.6; stroke: #2563eb; stroke-width: 2; }
      .box-inter { fill: #fef08a; fill-opacity: 0.85; stroke: #ca8a04; stroke-width: 1.5; }
      .box-hull { fill: none; stroke: #9333ea; stroke-width: 1.6; stroke-dasharray: 4 3; }
      .ellipse-real { fill: #dcfce7; fill-opacity: 0.5; stroke: #15803d; stroke-width: 2; }
      .ellipse-gen { fill: #fee2e2; fill-opacity: 0.5; stroke: #dc2626; stroke-width: 2; }
    </style>
  </defs>

  <rect width="900" height="370" class="bg" />

  <!-- PANEL 1: Spatial Overlap (IoU, GIoU, Dice, PQ) -->
  <rect x="16" y="16" width="282" height="338" class="panel" />
  <text x="30" y="40" class="title">1. Spatial Overlap: IoU, Dice &amp; PQ</text>
  <text x="30" y="57" class="subtitle">Bounding boxes, masks, and enclosing hull C</text>

  <g transform="translate(36, 72)">
    <!-- Enclosing Hull C -->
    <rect x="8" y="6" width="228" height="132" class="box-hull" />
    <text x="150" y="20" class="small" fill="#7e22ce">Enclosing hull C (GIoU)</text>

    <!-- Ground-Truth Box A -->
    <rect x="20" y="24" width="120" height="90" class="box-gt" />
    <text x="28" y="44" class="math" fill="#15803d">GT Box A</text>

    <!-- Predicted Box B -->
    <rect x="92" y="44" width="130" height="84" class="box-pred" />
    <text x="152" y="116" class="math" fill="#1d4ed8">Pred Box B</text>

    <!-- Intersection A ∩ B -->
    <rect x="92" y="44" width="48" height="70" class="box-inter" />
    <text x="98" y="83" class="math" fill="#854d0e">A ∩ B</text>
  </g>

  <rect x="30" y="218" width="254" height="122" fill="#f8fafc" stroke="#cbd5e1" rx="6" />
  <text x="40" y="237" class="math">• IoU = |A ∩ B| / |A ∪ B| = TP / (TP+FP+FN)</text>
  <text x="40" y="256" class="math">• Dice = 2|A ∩ B| / (|A|+|B|) = 2·IoU / (1+IoU)</text>
  <text x="40" y="275" class="math">• GIoU = IoU − |C \ (A ∪ B)| / |C| ∈ [−1, 1]</text>
  <text x="40" y="294" class="math">• COCO mAP = mean AP over τ ∈ [.50:.05:.95]</text>
  <text x="40" y="313" class="math" fill="#0f766e">• Panoptic PQ = SQ × RQ (IoU × F₁ match)</text>
  <text x="40" y="330" class="small">HD₉₅ measures 95th-percentile contour distance</text>

  <!-- PANEL 2: Perceptual & Generative (SSIM, IS, FID) -->
  <rect x="310" y="16" width="282" height="338" class="panel" />
  <text x="324" y="40" class="title">2. Reconstruction &amp; Generative FID</text>
  <text x="324" y="57" class="subtitle">Feature distribution alignment in Inception space</text>

  <g transform="translate(330, 74)">
    <!-- Real Gaussian N(mu_r, Sigma_r) -->
    <ellipse cx="75" cy="68" rx="56" ry="34" transform="rotate(-18 75 68)" class="ellipse-real" />
    <circle cx="75" cy="68" r="3.5" fill="#15803d" />
    <text x="36" y="42" class="math" fill="#15803d">Real N(μᵣ, Σᵣ)</text>

    <!-- Generated Gaussian N(mu_g, Sigma_g) -->
    <ellipse cx="175" cy="78" rx="48" ry="40" transform="rotate(22 175 78)" class="ellipse-gen" />
    <circle cx="175" cy="78" r="3.5" fill="#dc2626" />
    <text x="140" y="38" class="math" fill="#b91c1c">Gen N(μ_g, Σ_g)</text>

    <!-- Mean shift vector -->
    <line x1="75" y1="68" x2="175" y2="78" stroke="#0f172a" stroke-width="2" stroke-dasharray="4 2" />
    <text x="95" y="64" class="math">‖μᵣ − μ_g‖₂²</text>
    <text x="32" y="132" class="small">+ Tr(Σᵣ + Σ_g − 2(ΣᵣΣ_g)¹ᐟ²) covariance mismatch</text>
  </g>

  <rect x="324" y="218" width="254" height="122" fill="#f8fafc" stroke="#cbd5e1" rx="6" />
  <text x="334" y="237" class="math">• PSNR = 10 log₁₀(MAX² / MSE)  (pixel dB)</text>
  <text x="334" y="256" class="math">• SSIM = l(x,y) · c(x,y) · s(x,y) ∈ [−1, 1]</text>
  <text x="334" y="275" class="math">• LPIPS = ∑_l ‖w_l ⊙ (φ̂_l(x) − φ̂_l(y))‖₂²</text>
  <text x="334" y="294" class="math">• IS = exp( E_x[ KL( p(y|x) ‖ p(y) ) ] )</text>
  <text x="334" y="313" class="math" fill="#b91c1c">• FID = W₂²( N(μᵣ,Σᵣ), N(μ_g,Σ_g) )</text>
  <text x="334" y="330" class="small">CLIPScore = w · max(cos(e_img, e_txt), 0)</text>

  <!-- PANEL 3: Clustering Metrics (Silhouette, ARI, NMI) -->
  <rect x="604" y="16" width="280" height="338" class="panel" />
  <text x="618" y="40" class="title">3. Clustering: Silhouette, ARI &amp; NMI</text>
  <text x="618" y="57" class="subtitle">Cohesion a(i) vs. nearest-cluster separation b(i)</text>

  <g transform="translate(624, 74)">
    <!-- Cluster A -->
    <circle cx="58" cy="68" r="42" fill="#dbeafe" fill-opacity="0.55" stroke="#3b82f6" stroke-dasharray="3 3" />
    <circle cx="42" cy="52" r="4" fill="#1d4ed8" />
    <circle cx="48" cy="84" r="4" fill="#1d4ed8" />
    <circle cx="72" cy="66" r="5" fill="#dc2626" />
    <text x="64" y="58" class="math" fill="#dc2626">i</text>
    <!-- Cohesion lines a(i) -->
    <line x1="72" y1="66" x2="42" y2="52" stroke="#1d4ed8" stroke-width="1.4" />
    <line x1="72" y1="66" x2="48" y2="84" stroke="#1d4ed8" stroke-width="1.4" />
    <text x="20" y="122" class="small" fill="#1d4ed8">a(i): intra-cluster dist</text>

    <!-- Cluster B -->
    <circle cx="184" cy="68" r="40" fill="#dcfce7" fill-opacity="0.55" stroke="#16a34a" stroke-dasharray="3 3" />
    <circle cx="170" cy="54" r="4" fill="#15803d" />
    <circle cx="192" cy="76" r="4" fill="#15803d" />
    <circle cx="178" cy="86" r="4" fill="#15803d" />
    <!-- Separation lines b(i) -->
    <line x1="72" y1="66" x2="170" y2="54" stroke="#15803d" stroke-width="1.5" stroke-dasharray="3 2" />
    <line x1="72" y1="66" x2="178" y2="86" stroke="#15803d" stroke-width="1.5" stroke-dasharray="3 2" />
    <text x="128" y="122" class="small" fill="#15803d">b(i): nearest cluster dist</text>
  </g>

  <rect x="618" y="218" width="252" height="122" fill="#f8fafc" stroke="#cbd5e1" rx="6" />
  <text x="628" y="237" class="math">• Silhouette s(i) = (b(i) − a(i)) / max(a(i),b(i))</text>
  <text x="628" y="256" class="math">• Davies–Bouldin = (1/K) ∑_k max_{j≠k} (s_k+s_j)/d_kj</text>
  <text x="628" y="275" class="math">• Calinski–Harabasz = [Tr(B_K)/(K−1)] / [Tr(W_K)/(N−K)]</text>
  <text x="628" y="294" class="math">• ARI = (RI − E[RI]) / (max(RI) − E[RI])</text>
  <text x="628" y="313" class="math" fill="#0f766e">• NMI(U, V) = 2 I(U; V) / (H(U) + H(V))</text>
  <text x="628" y="330" class="small">Internal (no labels) vs. External (vs. ground truth V)</text>
</svg>

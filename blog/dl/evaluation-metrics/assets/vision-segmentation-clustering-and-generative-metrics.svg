<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="'Manrope', -apple-system, sans-serif">
  <rect width="760" height="300" rx="12" fill="#fbfaf6" stroke="#d8d2c5" stroke-width="1.5"/>

  <!-- Card 1: Spatial Overlap -->
  <g transform="translate(16, 16)">
    <rect width="232" height="268" rx="10" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.2"/>
    <text x="116" y="24" text-anchor="middle" font-size="12.5" font-weight="800" fill="#1e2422">1. Spatial Overlap (IoU &amp; GIoU)</text>
    <text x="116" y="41" text-anchor="middle" font-size="10" fill="#5a625e">Boxes A, B and enclosing hull C</text>

    <g transform="translate(16, 52)">
      <rect width="200" height="160" rx="8" fill="#fbfaf6" stroke="#d8d2c5"/>

      <!-- Enclosing Hull C -->
      <rect x="20" y="16" width="160" height="128" fill="none" stroke="#8c5d16" stroke-width="1.5" stroke-dasharray="4,3"/>
      <text x="174" y="29" text-anchor="end" font-size="9" font-weight="700" fill="#8c5d16">Hull C</text>

      <!-- GT Box A -->
      <rect x="28" y="26" width="88" height="72" rx="3" fill="#eef6f0" fill-opacity="0.85" stroke="#165d4c" stroke-width="1.8"/>
      <text x="36" y="44" font-size="9.5" font-weight="800" fill="#173d35">GT Box A</text>

      <!-- Pred Box B -->
      <rect x="84" y="62" width="88" height="72" rx="3" fill="#fdf2f0" fill-opacity="0.85" stroke="#9e2f24" stroke-width="1.8"/>
      <text x="164" y="124" text-anchor="end" font-size="9.5" font-weight="800" fill="#9e2f24">Pred Box B</text>

      <!-- Intersection A ∩ B -->
      <rect x="84" y="62" width="32" height="36" fill="#fdf6e9" stroke="#8c5d16" stroke-width="1.5"/>
      <text x="100" y="84" text-anchor="middle" font-size="9" font-weight="800" fill="#8c5d16">A∩B</text>
    </g>

    <rect x="16" y="222" width="200" height="32" rx="6" fill="#eef6f0" stroke="#a8cbb7"/>
    <text x="116" y="242" text-anchor="middle" font-size="9.5" font-weight="800" fill="#173d35">IoU = 0.143 · Dice = 0.250</text>
  </g>

  <!-- Card 2: Generative FID -->
  <g transform="translate(264, 16)">
    <rect width="232" height="268" rx="10" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.2"/>
    <text x="116" y="24" text-anchor="middle" font-size="12.5" font-weight="800" fill="#1e2422">2. Generative Distance (FID)</text>
    <text x="116" y="41" text-anchor="middle" font-size="10" fill="#5a625e">Feature Gaussians in Inception space</text>

    <g transform="translate(16, 52)">
      <rect width="200" height="160" rx="8" fill="#fbfaf6" stroke="#d8d2c5"/>

      <!-- Real Gaussian -->
      <ellipse cx="64" cy="74" rx="44" ry="28" transform="rotate(-16 64 74)" fill="#eef6f0" stroke="#165d4c" stroke-width="1.8"/>
      <circle cx="64" cy="74" r="3.5" fill="#173d35"/>
      <text x="64" y="34" text-anchor="middle" font-size="9.5" font-weight="800" fill="#173d35">Real (μ_r, Σ_r)</text>

      <!-- Generated Gaussian -->
      <ellipse cx="142" cy="88" rx="38" ry="30" transform="rotate(20 142 88)" fill="#fdf2f0" stroke="#9e2f24" stroke-width="1.8"/>
      <circle cx="142" cy="88" r="3.5" fill="#9e2f24"/>
      <text x="142" y="44" text-anchor="middle" font-size="9.5" font-weight="800" fill="#9e2f24">Gen (μ_g, Σ_g)</text>

      <!-- Mean shift -->
      <line x1="64" y1="74" x2="142" y2="88" stroke="#1e2422" stroke-width="1.8" stroke-dasharray="4,2"/>
      <text x="100" y="138" text-anchor="middle" font-size="9" font-weight="700" fill="#5a625e">Mean shift + Covariance trace</text>
    </g>

    <rect x="16" y="222" width="200" height="32" rx="6" fill="#fdf6e9" stroke="#d9c091"/>
    <text x="116" y="242" text-anchor="middle" font-size="9.5" font-weight="800" fill="#8c5d16">Squared 2-Wasserstein Distance</text>
  </g>

  <!-- Card 3: Clustering Geometry -->
  <g transform="translate(512, 16)">
    <rect width="232" height="268" rx="10" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.2"/>
    <text x="116" y="24" text-anchor="middle" font-size="12.5" font-weight="800" fill="#1e2422">3. Clustering (Silhouette)</text>
    <text x="116" y="41" text-anchor="middle" font-size="10" fill="#5a625e">Cohesion a(i) vs. separation b(i)</text>

    <g transform="translate(16, 52)">
      <rect width="200" height="160" rx="8" fill="#fbfaf6" stroke="#d8d2c5"/>

      <!-- Cluster A -->
      <circle cx="56" cy="76" r="36" fill="#eef6f0" stroke="#165d4c" stroke-width="1.4" stroke-dasharray="3,3"/>
      <circle cx="42" cy="60" r="3.8" fill="#165d4c"/>
      <circle cx="46" cy="92" r="3.8" fill="#165d4c"/>
      <circle cx="68" cy="76" r="4.5" fill="#9e2f24"/>
      <text x="68" y="66" text-anchor="middle" font-size="9.5" font-weight="800" fill="#9e2f24">i</text>

      <!-- Cohesion lines a(i) -->
      <line x1="68" y1="76" x2="42" y2="60" stroke="#165d4c" stroke-width="1.4"/>
      <line x1="68" y1="76" x2="46" y2="92" stroke="#165d4c" stroke-width="1.4"/>
      <text x="56" y="132" text-anchor="middle" font-size="9" font-weight="700" fill="#173d35">a(i): cohesion</text>

      <!-- Cluster B -->
      <circle cx="148" cy="76" r="34" fill="#fdf6e9" stroke="#8c5d16" stroke-width="1.4" stroke-dasharray="3,3"/>
      <circle cx="136" cy="62" r="3.8" fill="#8c5d16"/>
      <circle cx="156" cy="78" r="3.8" fill="#8c5d16"/>
      <circle cx="142" cy="92" r="3.8" fill="#8c5d16"/>

      <!-- Separation lines b(i) -->
      <line x1="68" y1="76" x2="136" y2="62" stroke="#8c5d16" stroke-width="1.4" stroke-dasharray="3,2"/>
      <line x1="68" y1="76" x2="142" y2="92" stroke="#8c5d16" stroke-width="1.4" stroke-dasharray="3,2"/>
      <text x="148" y="132" text-anchor="middle" font-size="9" font-weight="700" fill="#8c5d16">b(i): separation</text>
    </g>

    <rect x="16" y="222" width="200" height="32" rx="6" fill="#eef6f0" stroke="#a8cbb7"/>
    <text x="116" y="242" text-anchor="middle" font-size="9.5" font-weight="800" fill="#173d35">s(i) = (b(i) − a(i)) / max(a, b)</text>
  </g>
</svg>

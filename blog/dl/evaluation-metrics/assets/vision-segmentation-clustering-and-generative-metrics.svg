<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" width="760" height="310" font-family="'Manrope', -apple-system, sans-serif">
  <rect width="760" height="310" rx="12" fill="#fbfaf6" stroke="#d8d2c5" stroke-width="1.5"/>

  <!-- Left Card: Generative Vision (IS & FID) -->
  <g transform="translate(18, 16)">
    <rect width="352" height="278" rx="10" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.2"/>
    <text x="176" y="24" text-anchor="middle" font-size="13" font-weight="800" fill="#1e2422">1. Generative Vision: Inception Score &amp; FID</text>
    <text x="176" y="42" text-anchor="middle" font-size="10.5" fill="#5a625e">2-Wasserstein distance between feature Gaussians in Inception space</text>

    <g transform="translate(16, 52)">
      <rect width="320" height="170" rx="8" fill="#fbfaf6" stroke="#d8d2c5"/>

      <!-- Real Gaussian N(mu_r, Sigma_r) -->
      <ellipse cx="96" cy="82" rx="62" ry="38" transform="rotate(-16 96 82)" fill="#eef6f0" stroke="#165d4c" stroke-width="2"/>
      <circle cx="96" cy="82" r="4" fill="#173d35"/>
      <text x="96" y="30" text-anchor="middle" font-size="10" font-weight="800" fill="#173d35">Real Features N(μ_r, Σ_r)</text>

      <!-- Generated Gaussian N(mu_g, Sigma_g) -->
      <ellipse cx="226" cy="96" rx="52" ry="40" transform="rotate(18 226 96)" fill="#fdf2f0" stroke="#9e2f24" stroke-width="2"/>
      <circle cx="226" cy="96" r="4" fill="#9e2f24"/>
      <text x="226" y="38" text-anchor="middle" font-size="10" font-weight="800" fill="#9e2f24">Generated N(μ_g, Σ_g)</text>

      <!-- Mean shift vector -->
      <line x1="96" y1="82" x2="226" y2="96" stroke="#1e2422" stroke-width="2" stroke-dasharray="4,3"/>
      <rect x="122" y="73" width="78" height="20" rx="4" fill="#ffffff" stroke="#d8d2c5"/>
      <text x="161" y="87" text-anchor="middle" font-size="9" font-weight="800" fill="#1e2422">Mean Shift</text>

      <text x="160" y="154" text-anchor="middle" font-size="9.5" font-weight="700" fill="#5a625e">IS = exp(H(Y) − H(Y|X)) · FID adds covariance mismatch</text>
    </g>

    <rect x="16" y="232" width="320" height="32" rx="6" fill="#fdf6e9" stroke="#d9c091"/>
    <text x="176" y="252" text-anchor="middle" font-size="10" font-weight="800" fill="#8c5d16">Worked 2D FID: Mean Shift (5.0) + Cov Trace (2.0) = 7.0</text>
  </g>

  <!-- Right Card: Unsupervised Clustering (Silhouette, ARI & NMI) -->
  <g transform="translate(390, 16)">
    <rect width="352" height="278" rx="10" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.2"/>
    <text x="176" y="24" text-anchor="middle" font-size="13" font-weight="800" fill="#1e2422">2. Clustering: Silhouette, ARI &amp; NMI</text>
    <text x="176" y="42" text-anchor="middle" font-size="10.5" fill="#5a625e">Intra-cluster cohesion a(i) vs. nearest-cluster separation b(i)</text>

    <g transform="translate(16, 52)">
      <rect width="320" height="170" rx="8" fill="#fbfaf6" stroke="#d8d2c5"/>

      <!-- Cluster U_1 -->
      <circle cx="92" cy="82" r="48" fill="#eef6f0" stroke="#165d4c" stroke-width="1.5" stroke-dasharray="4,3"/>
      <text x="92" y="24" text-anchor="middle" font-size="10" font-weight="800" fill="#173d35">Cluster U₁</text>
      <circle cx="68" cy="64" r="4.2" fill="#165d4c"/>
      <circle cx="74" cy="104" r="4.2" fill="#165d4c"/>
      <circle cx="110" cy="82" r="5" fill="#9e2f24"/>
      <text x="110" y="70" text-anchor="middle" font-size="10" font-weight="800" fill="#9e2f24">Point i</text>

      <!-- Cohesion lines a(i) -->
      <line x1="110" y1="82" x2="68" y2="64" stroke="#165d4c" stroke-width="1.6"/>
      <line x1="110" y1="82" x2="74" y2="104" stroke="#165d4c" stroke-width="1.6"/>
      <text x="92" y="150" text-anchor="middle" font-size="9.5" font-weight="800" fill="#173d35">a(i): Mean Intra-Cluster Dist</text>

      <!-- Cluster U_2 -->
      <circle cx="232" cy="82" r="46" fill="#fdf6e9" stroke="#8c5d16" stroke-width="1.5" stroke-dasharray="4,3"/>
      <text x="232" y="24" text-anchor="middle" font-size="10" font-weight="800" fill="#8c5d16">Nearest Cluster U₂</text>
      <circle cx="212" cy="64" r="4.2" fill="#8c5d16"/>
      <circle cx="246" cy="82" r="4.2" fill="#8c5d16"/>
      <circle cx="220" cy="102" r="4.2" fill="#8c5d16"/>

      <!-- Separation lines b(i) -->
      <line x1="110" y1="82" x2="212" y2="64" stroke="#8c5d16" stroke-width="1.6" stroke-dasharray="4,2"/>
      <line x1="110" y1="82" x2="246" y2="82" stroke="#8c5d16" stroke-width="1.6" stroke-dasharray="4,2"/>
      <line x1="110" y1="82" x2="220" y2="102" stroke="#8c5d16" stroke-width="1.6" stroke-dasharray="4,2"/>
      <text x="232" y="150" text-anchor="middle" font-size="9.5" font-weight="800" fill="#8c5d16">b(i): Nearest-Cluster Dist</text>
    </g>

    <rect x="16" y="232" width="320" height="32" rx="6" fill="#eef6f0" stroke="#a8cbb7"/>
    <text x="176" y="252" text-anchor="middle" font-size="10" font-weight="800" fill="#173d35">s(i) = (b(i) − a(i)) / max(a(i), b(i)) · ARI adjusts for chance</text>
  </g>
</svg>

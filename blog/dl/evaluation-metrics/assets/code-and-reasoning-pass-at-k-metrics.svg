<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="'Manrope', -apple-system, sans-serif">
  <rect width="760" height="300" rx="12" fill="#fbfaf6" stroke="#d8d2c5" stroke-width="1.5"/>

  <!-- Card 1: Jensen's Inequality Downward Bias -->
  <g transform="translate(16, 16)">
    <rect width="232" height="268" rx="10" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.2"/>
    <text x="116" y="24" text-anchor="middle" font-size="12.5" font-weight="800" fill="#1e2422">1. Naive Plug-In Is Biased</text>
    <text x="116" y="41" text-anchor="middle" font-size="10" fill="#5a625e">Concavity of f(p) = 1 − (1 − p)^k</text>

    <g transform="translate(16, 52)">
      <rect width="200" height="160" rx="8" fill="#fbfaf6" stroke="#d8d2c5"/>

      <!-- Axes -->
      <line x1="28" y1="132" x2="182" y2="132" stroke="#5a625e" stroke-width="1.3"/>
      <line x1="28" y1="24" x2="28" y2="132" stroke="#5a625e" stroke-width="1.3"/>
      <text x="22" y="30" text-anchor="end" font-size="8.5" fill="#5a625e">1.0</text>
      <text x="22" y="132" text-anchor="end" font-size="8.5" fill="#5a625e">0.0</text>

      <!-- Strictly concave curve f(p) -->
      <path d="M 28,132 Q 70,32 180,26" fill="none" stroke="#165d4c" stroke-width="2.3"/>
      <text x="135" y="42" text-anchor="middle" font-size="9" font-weight="800" fill="#173d35">True f(p)</text>

      <!-- Secant chord showing E[f(p_hat)] < f(p) -->
      <line x1="28" y1="132" x2="146" y2="33" stroke="#9e2f24" stroke-width="1.5" stroke-dasharray="4,3"/>
      <circle cx="87" cy="57" r="3.5" fill="#165d4c"/>
      <circle cx="87" cy="82" r="3.5" fill="#9e2f24"/>
      <line x1="87" y1="57" x2="87" y2="82" stroke="#9e2f24" stroke-width="1.6"/>
      <text x="132" y="84" text-anchor="middle" font-size="8.5" font-weight="800" fill="#9e2f24">Jensen Bias ↓</text>

      <text x="106" y="149" text-anchor="middle" font-size="9" font-weight="700" fill="#3a423e">Pass Probability p</text>
    </g>

    <rect x="16" y="222" width="200" height="32" rx="6" fill="#fdf2f0" stroke="#e4b4ae"/>
    <text x="116" y="242" text-anchor="middle" font-size="9.5" font-weight="800" fill="#9e2f24">E[1 − (1 − c/n)^k] &lt; 1 − (1 − p)^k</text>
  </g>

  <!-- Card 2: Unbiased Hypergeometric Estimator -->
  <g transform="translate(264, 16)">
    <rect width="232" height="268" rx="10" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.2"/>
    <text x="116" y="24" text-anchor="middle" font-size="12.5" font-weight="800" fill="#1e2422">2. Hypergeometric Subset</text>
    <text x="116" y="41" text-anchor="middle" font-size="10" fill="#5a625e">n = 10 total, c = 2 pass, n − c = 8 fail</text>

    <g transform="translate(16, 52)">
      <rect width="200" height="160" rx="8" fill="#fbfaf6" stroke="#d8d2c5"/>

      <text x="100" y="22" text-anchor="middle" font-size="8.5" font-weight="800" fill="#3a423e">Pool of n = 10 Generated Programs</text>

      <!-- Row 1 of 5 samples (2 pass, 3 fail) -->
      <rect x="18" y="32" width="28" height="24" rx="4" fill="#eef6f0" stroke="#165d4c" stroke-width="1.4"/>
      <text x="32" y="48" text-anchor="middle" font-size="9" font-weight="800" fill="#173d35">✓</text>
      <rect x="52" y="32" width="28" height="24" rx="4" fill="#eef6f0" stroke="#165d4c" stroke-width="1.4"/>
      <text x="66" y="48" text-anchor="middle" font-size="9" font-weight="800" fill="#173d35">✓</text>
      <rect x="86" y="32" width="28" height="24" rx="4" fill="#fdf2f0" stroke="#9e2f24"/>
      <text x="100" y="48" text-anchor="middle" font-size="9" font-weight="800" fill="#9e2f24">✗</text>
      <rect x="120" y="32" width="28" height="24" rx="4" fill="#fdf2f0" stroke="#9e2f24"/>
      <text x="134" y="48" text-anchor="middle" font-size="9" font-weight="800" fill="#9e2f24">✗</text>
      <rect x="154" y="32" width="28" height="24" rx="4" fill="#fdf2f0" stroke="#9e2f24"/>
      <text x="168" y="48" text-anchor="middle" font-size="9" font-weight="800" fill="#9e2f24">✗</text>

      <!-- Row 2 of 5 samples (all fail) -->
      <rect x="18" y="62" width="28" height="24" rx="4" fill="#fdf2f0" stroke="#9e2f24"/>
      <text x="32" y="78" text-anchor="middle" font-size="9" font-weight="800" fill="#9e2f24">✗</text>
      <rect x="52" y="62" width="28" height="24" rx="4" fill="#fdf2f0" stroke="#9e2f24"/>
      <text x="66" y="78" text-anchor="middle" font-size="9" font-weight="800" fill="#9e2f24">✗</text>
      <rect x="86" y="62" width="28" height="24" rx="4" fill="#fdf2f0" stroke="#9e2f24"/>
      <text x="100" y="78" text-anchor="middle" font-size="9" font-weight="800" fill="#9e2f24">✗</text>
      <rect x="120" y="62" width="28" height="24" rx="4" fill="#fdf2f0" stroke="#9e2f24"/>
      <text x="134" y="78" text-anchor="middle" font-size="9" font-weight="800" fill="#9e2f24">✗</text>
      <rect x="154" y="62" width="28" height="24" rx="4" fill="#fdf2f0" stroke="#9e2f24"/>
      <text x="168" y="78" text-anchor="middle" font-size="9" font-weight="800" fill="#9e2f24">✗</text>

      <!-- Formula box -->
      <rect x="14" y="96" width="172" height="50" rx="5" fill="#ffffff" stroke="#d8d2c5"/>
      <text x="100" y="114" text-anchor="middle" font-size="8.5" font-weight="800" fill="#1e2422">Draw k = 5 Without Replacement:</text>
      <text x="100" y="134" text-anchor="middle" font-size="9" font-weight="800" fill="#173d35">1 − C(8, 5)/C(10, 5) = 1 − 56/252 = 77.8%</text>
    </g>

    <rect x="16" y="222" width="200" height="32" rx="6" fill="#eef6f0" stroke="#a8cbb7"/>
    <text x="116" y="242" text-anchor="middle" font-size="9.5" font-weight="800" fill="#173d35">Minimum-Variance Unbiased (MVUE)</text>
  </g>

  <!-- Card 3: pass@k vs Maj@k -->
  <g transform="translate(512, 16)">
    <rect width="232" height="268" rx="10" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.2"/>
    <text x="116" y="24" text-anchor="middle" font-size="12.5" font-weight="800" fill="#1e2422">3. Oracle pass@k vs. Maj@k</text>
    <text x="116" y="41" text-anchor="middle" font-size="10" fill="#5a625e">Unit-test verifier vs. majority vote</text>

    <g transform="translate(16, 52)">
      <rect width="200" height="160" rx="8" fill="#fbfaf6" stroke="#d8d2c5"/>

      <!-- Axes -->
      <line x1="30" y1="132" x2="182" y2="132" stroke="#5a625e" stroke-width="1.3"/>
      <line x1="30" y1="26" x2="30" y2="132" stroke="#5a625e" stroke-width="1.3"/>
      <text x="23" y="32" text-anchor="end" font-size="8.5" fill="#5a625e">1.0</text>
      <text x="23" y="132" text-anchor="end" font-size="8.5" fill="#5a625e">0.0</text>

      <!-- pass@k curve -->
      <path d="M 30,106 Q 76,42 182,28" fill="none" stroke="#165d4c" stroke-width="2.3"/>
      <text x="98" y="38" text-anchor="middle" font-size="9.5" font-weight="800" fill="#173d35">pass@k (Verifier)</text>

      <!-- Maj@k curve -->
      <path d="M 30,106 Q 76,74 182,62" fill="none" stroke="#8c5d16" stroke-width="2.2" stroke-dasharray="5,3"/>
      <text x="112" y="84" text-anchor="middle" font-size="9.5" font-weight="800" fill="#8c5d16">Maj@k (Vote)</text>

      <!-- Verification gap -->
      <line x1="162" y1="31" x2="162" y2="63" stroke="#9e2f24" stroke-width="1.6" stroke-dasharray="3,2"/>
      <text x="148" y="51" text-anchor="end" font-size="8.5" font-weight="800" fill="#9e2f24">Gap</text>

      <text x="106" y="149" text-anchor="middle" font-size="9" font-weight="700" fill="#3a423e">Samples k (log scale)</text>
    </g>

    <rect x="16" y="222" width="200" height="32" rx="6" fill="#fdf6e9" stroke="#d9c091"/>
    <text x="116" y="242" text-anchor="middle" font-size="9.5" font-weight="800" fill="#8c5d16">Gap = Latent Unconcentrated Skill</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="'Manrope', -apple-system, sans-serif">
  <rect width="760" height="300" rx="12" fill="#fbfaf6" stroke="#d8d2c5" stroke-width="1.5"/>

  <!-- Card 1: Perplexity & Bits-Per-Byte -->
  <g transform="translate(16, 16)">
    <rect width="232" height="268" rx="10" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.2"/>
    <text x="116" y="24" text-anchor="middle" font-size="12.5" font-weight="800" fill="#1e2422">1. Perplexity &amp; Bits-Per-Byte</text>
    <text x="116" y="41" text-anchor="middle" font-size="10" fill="#5a625e">Next-token branching &amp; byte scaling</text>

    <g transform="translate(16, 52)">
      <rect width="200" height="160" rx="8" fill="#fbfaf6" stroke="#d8d2c5"/>

      <!-- Context box -->
      <rect x="12" y="62" width="56" height="34" rx="6" fill="#fdf6e9" stroke="#8c5d16" stroke-width="1.4"/>
      <text x="40" y="83" text-anchor="middle" font-size="9.5" font-weight="800" fill="#8c5d16">Context</text>

      <!-- Branching lines -->
      <line x1="68" y1="79" x2="104" y2="28" stroke="#8a928e" stroke-width="1.3"/>
      <line x1="68" y1="79" x2="104" y2="62" stroke="#165d4c" stroke-width="2.0"/>
      <line x1="68" y1="79" x2="104" y2="96" stroke="#8a928e" stroke-width="1.3"/>
      <line x1="68" y1="79" x2="104" y2="130" stroke="#8a928e" stroke-width="1.3"/>

      <!-- Candidate boxes -->
      <rect x="104" y="16" width="84" height="24" rx="4" fill="#f7f4ec" stroke="#d8d2c5"/>
      <text x="146" y="32" text-anchor="middle" font-size="9" fill="#5a625e">"mat" (0.15)</text>

      <rect x="104" y="50" width="84" height="24" rx="4" fill="#eef6f0" stroke="#165d4c" stroke-width="1.5"/>
      <text x="146" y="66" text-anchor="middle" font-size="9.5" font-weight="800" fill="#173d35">"rug" (0.50)</text>

      <rect x="104" y="84" width="84" height="24" rx="4" fill="#f7f4ec" stroke="#d8d2c5"/>
      <text x="146" y="100" text-anchor="middle" font-size="9" fill="#5a625e">"sofa" (0.25)</text>

      <rect x="104" y="118" width="84" height="24" rx="4" fill="#f7f4ec" stroke="#d8d2c5"/>
      <text x="146" y="134" text-anchor="middle" font-size="9" fill="#5a625e">"floor" (0.10)</text>
    </g>

    <rect x="16" y="222" width="200" height="32" rx="6" fill="#eef6f0" stroke="#a8cbb7"/>
    <text x="116" y="242" text-anchor="middle" font-size="9.5" font-weight="800" fill="#173d35">BPB normalizes across tokenizers</text>
  </g>

  <!-- Card 2: BLEU Clipping & Brevity Penalty -->
  <g transform="translate(264, 16)">
    <rect width="232" height="268" rx="10" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.2"/>
    <text x="116" y="24" text-anchor="middle" font-size="12.5" font-weight="800" fill="#1e2422">2. Clipped BLEU &amp; ROUGE-L</text>
    <text x="116" y="41" text-anchor="middle" font-size="10" fill="#5a625e">Caps repeated n-grams at reference max</text>

    <g transform="translate(16, 52)">
      <rect width="200" height="160" rx="8" fill="#fbfaf6" stroke="#d8d2c5"/>

      <text x="12" y="20" font-size="9" font-weight="700" fill="#5a625e">Candidate ("the" repeated 3×):</text>

      <!-- 4 token pills -->
      <rect x="12" y="28" width="38" height="24" rx="4" fill="#eef6f0" stroke="#165d4c" stroke-width="1.3"/>
      <text x="31" y="44" text-anchor="middle" font-size="9.5" font-weight="800" fill="#173d35">the</text>

      <rect x="56" y="28" width="38" height="24" rx="4" fill="#eef6f0" stroke="#165d4c" stroke-width="1.3"/>
      <text x="75" y="44" text-anchor="middle" font-size="9.5" font-weight="800" fill="#173d35">the</text>

      <rect x="100" y="28" width="44" height="24" rx="4" fill="#fdf2f0" stroke="#9e2f24" stroke-width="1.3"/>
      <text x="122" y="44" text-anchor="middle" font-size="9.5" font-weight="800" fill="#9e2f24">the ✗</text>

      <rect x="150" y="28" width="38" height="24" rx="4" fill="#eef6f0" stroke="#165d4c" stroke-width="1.3"/>
      <text x="169" y="44" text-anchor="middle" font-size="9.5" font-weight="800" fill="#173d35">cat</text>

      <text x="12" y="72" font-size="9" fill="#5a625e">Ref max count("the") = 2 → Clipped = 2</text>

      <!-- Brevity Penalty box -->
      <rect x="12" y="88" width="176" height="56" rx="6" fill="#fdf6e9" stroke="#d9c091"/>
      <text x="100" y="108" text-anchor="middle" font-size="9.5" font-weight="800" fill="#8c5d16">Brevity Penalty (c ≤ r)</text>
      <text x="100" y="124" text-anchor="middle" font-size="9" font-weight="700" fill="#3a423e">BP = exp(1 − r / c)</text>
      <text x="100" y="138" text-anchor="middle" font-size="8.5" fill="#5a625e">Penalizes overly short outputs</text>
    </g>

    <rect x="16" y="222" width="200" height="32" rx="6" fill="#fdf6e9" stroke="#d9c091"/>
    <text x="116" y="242" text-anchor="middle" font-size="9.5" font-weight="800" fill="#8c5d16">BLEU-2 = 0.409 · ROUGE-L = 0.727</text>
  </g>

  <!-- Card 3: Contextual BERTScore -->
  <g transform="translate(512, 16)">
    <rect width="232" height="268" rx="10" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.2"/>
    <text x="116" y="24" text-anchor="middle" font-size="12.5" font-weight="800" fill="#1e2422">3. Contextual BERTScore</text>
    <text x="116" y="41" text-anchor="middle" font-size="10" fill="#5a625e">Max-cosine token embedding match</text>

    <g transform="translate(16, 52)">
      <rect width="200" height="160" rx="8" fill="#fbfaf6" stroke="#d8d2c5"/>

      <!-- Reference Row -->
      <text x="12" y="18" font-size="8.5" font-weight="700" fill="#5a625e">Reference Tokens:</text>
      <rect x="12" y="24" width="52" height="24" rx="4" fill="#eef6f0" stroke="#165d4c" stroke-width="1.3"/>
      <text x="38" y="40" text-anchor="middle" font-size="9.5" font-weight="800" fill="#173d35">"icy"</text>

      <rect x="74" y="24" width="52" height="24" rx="4" fill="#eef6f0" stroke="#165d4c" stroke-width="1.3"/>
      <text x="100" y="40" text-anchor="middle" font-size="9.5" font-weight="800" fill="#173d35">"wind"</text>

      <rect x="136" y="24" width="52" height="24" rx="4" fill="#eef6f0" stroke="#165d4c" stroke-width="1.3"/>
      <text x="162" y="40" text-anchor="middle" font-size="9.5" font-weight="800" fill="#173d35">"howled"</text>

      <!-- Cosine alignment lines -->
      <line x1="38" y1="48" x2="38" y2="104" stroke="#165d4c" stroke-width="1.8"/>
      <text x="38" y="80" text-anchor="middle" font-size="8.5" font-weight="800" fill="#165d4c">0.91</text>

      <line x1="100" y1="48" x2="100" y2="104" stroke="#165d4c" stroke-width="1.8"/>
      <text x="100" y="80" text-anchor="middle" font-size="8.5" font-weight="800" fill="#165d4c">0.88</text>

      <line x1="162" y1="48" x2="162" y2="104" stroke="#165d4c" stroke-width="1.8"/>
      <text x="162" y="80" text-anchor="middle" font-size="8.5" font-weight="800" fill="#165d4c">0.86</text>

      <!-- Candidate Row -->
      <rect x="12" y="104" width="52" height="24" rx="4" fill="#fdf6e9" stroke="#8c5d16" stroke-width="1.3"/>
      <text x="38" y="120" text-anchor="middle" font-size="9" font-weight="800" fill="#8c5d16">"freezing"</text>

      <rect x="74" y="104" width="52" height="24" rx="4" fill="#fdf6e9" stroke="#8c5d16" stroke-width="1.3"/>
      <text x="100" y="120" text-anchor="middle" font-size="9" font-weight="800" fill="#8c5d16">"breeze"</text>

      <rect x="136" y="104" width="52" height="24" rx="4" fill="#fdf6e9" stroke="#8c5d16" stroke-width="1.3"/>
      <text x="162" y="120" text-anchor="middle" font-size="9" font-weight="800" fill="#8c5d16">"roared"</text>
      <text x="12" y="144" font-size="8.5" font-weight="700" fill="#5a625e">Paraphrase Tokens (0 lexical overlap)</text>
    </g>

    <rect x="16" y="222" width="200" height="32" rx="6" fill="#eef6f0" stroke="#a8cbb7"/>
    <text x="116" y="242" text-anchor="middle" font-size="9.5" font-weight="800" fill="#173d35">BLEU = 0.00 · BERTScore = 0.883</text>
  </g>
</svg>

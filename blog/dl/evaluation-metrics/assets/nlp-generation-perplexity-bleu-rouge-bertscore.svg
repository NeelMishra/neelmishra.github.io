<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" role="img" aria-labelledby="title desc">
  <title id="title">Classical NLP and Text Generation Evaluation Metrics</title>
  <desc id="desc">Three-panel diagram showing (1) Perplexity branching factor exp(L_CE) and tokenizer-invariant Bits-Per-Byte (BPB); (2) Lexical overlap metrics BLEU clipped n-gram precision + Brevity Penalty, ROUGE-L Longest Common Subsequence, and Levenshtein WER; and (3) Contextual BERTScore greedy token embedding cosine alignment.</desc>
  <defs>
    <style>
      .bg { fill: #f8f6f1; }
      .panel { fill: #ffffff; stroke: #d5cfc2; stroke-width: 1.5; rx: 12; }
      .title { font: 700 14px "Inter", "Segoe UI", sans-serif; fill: #1e293b; }
      .subtitle { font: 600 11.5px "Inter", "Segoe UI", sans-serif; fill: #475569; }
      .label { font: 500 11px "Inter", "Segoe UI", sans-serif; fill: #334155; }
      .math { font: 600 11px "Cambria Math", "STIX Two Math", "Georgia", serif; fill: #0f172a; }
      .small { font: 500 10px "Inter", "Segoe UI", sans-serif; fill: #64748b; }
      .tok-ref { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.4; rx: 5; }
      .tok-cand { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.4; rx: 5; }
      .tok-clip { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.4; rx: 5; }
    </style>
  </defs>

  <rect width="900" height="370" class="bg" />

  <!-- PANEL 1: Perplexity & Bits-Per-Byte (BPB) -->
  <rect x="16" y="16" width="282" height="338" class="panel" />
  <text x="30" y="40" class="title">1. Perplexity &amp; Bits-Per-Byte (BPB)</text>
  <text x="30" y="57" class="subtitle">Effective branching factor &amp; tokenizer invariance</text>

  <g transform="translate(34, 72)">
    <!-- Context token node -->
    <rect x="6" y="44" width="66" height="34" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" rx="6" />
    <text x="16" y="65" class="math" fill="#5b21b6">w_{&lt;t}</text>

    <!-- Branching arrows to candidate tokens -->
    <line x1="72" y1="61" x2="128" y2="18" stroke="#64748b" stroke-width="1.4" />
    <line x1="72" y1="61" x2="128" y2="50" stroke="#16a34a" stroke-width="2.2" />
    <line x1="72" y1="61" x2="128" y2="82" stroke="#64748b" stroke-width="1.4" />
    <line x1="72" y1="61" x2="128" y2="114" stroke="#64748b" stroke-width="1.4" />

    <rect x="128" y="4" width="114" height="24" fill="#f1f5f9" stroke="#94a3b8" rx="4" />
    <text x="136" y="20" class="small">"mat" (p = 0.15)</text>

    <rect x="128" y="36" width="114" height="26" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6" rx="4" />
    <text x="136" y="53" class="math" fill="#15803d">"rug" (p* = 0.50)</text>

    <rect x="128" y="68" width="114" height="24" fill="#f1f5f9" stroke="#94a3b8" rx="4" />
    <text x="136" y="84" class="small">"sofa" (p = 0.25)</text>

    <rect x="128" y="100" width="114" height="24" fill="#f1f5f9" stroke="#94a3b8" rx="4" />
    <text x="136" y="116" class="small">"floor" (p = 0.10)</text>
  </g>

  <rect x="30" y="218" width="254" height="122" fill="#f8fafc" stroke="#cbd5e1" rx="6" />
  <text x="40" y="237" class="math">• L_CE = −(1/T) ∑_{t=1}^T log_e p_θ(w_t | w_{&lt;t})</text>
  <text x="40" y="256" class="math" fill="#5b21b6">• PPL = exp(L_CE) = 2^{H₂(p_θ)}  (↓)</text>
  <text x="40" y="275" class="math">• Uniform over k choices ⇒ PPL = k</text>
  <text x="40" y="294" class="math" fill="#0f766e">• BPB = (−∑ log₂ p_θ(w_t)) / N_{bytes}</text>
  <text x="40" y="313" class="math">• BPB = (T / N_{bytes}) · (L_CE / ln 2)</text>
  <text x="40" y="330" class="small">BPB compares models across different tokenizers!</text>

  <!-- PANEL 2: BLEU Clipping, ROUGE-L & WER -->
  <rect x="310" y="16" width="282" height="338" class="panel" />
  <text x="324" y="40" class="title">2. Lexical Overlap: BLEU, ROUGE &amp; WER</text>
  <text x="324" y="57" class="subtitle">Clipped n-gram precision, LCS &amp; edit distance</text>

  <g transform="translate(326, 72)">
    <text x="4" y="14" class="small">Candidate C ("the" repeated 4×):</text>
    <rect x="4" y="20" width="46" height="24" class="tok-ref" />
    <text x="15" y="36" class="math" fill="#15803d">the</text>
    <rect x="56" y="20" width="46" height="24" class="tok-ref" />
    <text x="67" y="36" class="math" fill="#15803d">the</text>
    <rect x="108" y="20" width="46" height="24" class="tok-clip" />
    <text x="119" y="36" class="math" fill="#b91c1c">the✗</text>
    <rect x="160" y="20" width="46" height="24" class="tok-clip" />
    <text x="171" y="36" class="math" fill="#b91c1c">the✗</text>
    <rect x="212" y="20" width="38" height="24" class="tok-ref" />
    <text x="220" y="36" class="math" fill="#15803d">cat</text>

    <text x="4" y="64" class="small">Reference R ("the cat on the mat" → max "the" = 2):</text>
    <text x="4" y="82" class="math" fill="#1e293b">Count_clip("the") = min(4, 2) = 2  ⇒  p₁ = 3/5</text>

    <!-- Brevity penalty & LCS note -->
    <rect x="4" y="94" width="246" height="38" fill="#fef3c7" stroke="#f59e0b" rx="5" />
    <text x="12" y="110" class="math" fill="#92400e">Brevity Penalty BP = exp(1 − r/c) if c ≤ r</text>
    <text x="12" y="125" class="small" fill="#92400e">Prevents 1-word high-precision cheating</text>
  </g>

  <rect x="324" y="218" width="254" height="122" fill="#f8fafc" stroke="#cbd5e1" rx="6" />
  <text x="334" y="237" class="math">• BLEU-N = BP · exp( ∑_{n=1}^N w_n log p_n )</text>
  <text x="334" y="256" class="math">• ROUGE-N = Recall of n-grams in Ref</text>
  <text x="334" y="275" class="math" fill="#0f766e">• ROUGE-L = F_β of LCS(Ref, Cand)</text>
  <text x="334" y="294" class="math">• METEOR = F_{9×R} · (1 − γ(chunks/m)^θ)</text>
  <text x="334" y="313" class="math" fill="#b91c1c">• WER = (S + D + I) / N_{ref}  (Levenshtein)</text>
  <text x="334" y="330" class="small">chrF++ includes character + word n-gram F_β</text>

  <!-- PANEL 3: Contextual Embedding BERTScore -->
  <rect x="604" y="16" width="280" height="338" class="panel" />
  <text x="618" y="40" class="title">3. Contextual Semantic: BERTScore</text>
  <text x="618" y="57" class="subtitle">Greedy max-cosine matching in embedding space</text>

  <g transform="translate(622, 74)">
    <!-- Reference tokens -->
    <text x="4" y="12" class="small">Ref x (Contextual Embeddings e_x):</text>
    <rect x="4" y="20" width="68" height="26" class="tok-ref" />
    <text x="14" y="37" class="math">"icy"</text>
    <rect x="86" y="20" width="68" height="26" class="tok-ref" />
    <text x="96" y="37" class="math">"wind"</text>
    <rect x="168" y="20" width="74" height="26" class="tok-ref" />
    <text x="176" y="37" class="math">"howled"</text>

    <!-- Max cosine bipartite lines -->
    <line x1="38" y1="46" x2="42" y2="92" stroke="#16a34a" stroke-width="2" />
    <text x="8" y="73" class="small" fill="#15803d">cos=0.91</text>

    <line x1="120" y1="46" x2="124" y2="92" stroke="#16a34a" stroke-width="2" />
    <text x="90" y="73" class="small" fill="#15803d">cos=0.88</text>

    <line x1="205" y1="46" x2="205" y2="92" stroke="#16a34a" stroke-width="2" />
    <text x="174" y="73" class="small" fill="#15803d">cos=0.86</text>

    <!-- Candidate tokens (zero lexical overlap, high semantic similarity!) -->
    <rect x="4" y="92" width="76" height="26" class="tok-cand" />
    <text x="12" y="109" class="math">"freezing"</text>
    <rect x="90" y="92" width="68" height="26" class="tok-cand" />
    <text x="96" y="109" class="math">"breeze"</text>
    <rect x="168" y="92" width="74" height="26" class="tok-cand" />
    <text x="176" y="109" class="math">"roared"</text>
    <text x="4" y="134" class="small">Cand x̂ (BLEU = 0.00, BERTScore F₁ = 0.883)</text>
  </g>

  <rect x="618" y="218" width="252" height="122" fill="#f8fafc" stroke="#cbd5e1" rx="6" />
  <text x="628" y="237" class="math">• Sim_{i,j} = e_{x_i}ᵀ e_{x̂_j} / (‖e_{x_i}‖ ‖e_{x̂_j}‖)</text>
  <text x="628" y="256" class="math">• R_BERT = ∑_i idf(x_i) max_j Sim_{i,j} / ∑ idf</text>
  <text x="628" y="275" class="math">• P_BERT = ∑_j idf(x̂_j) max_i Sim_{i,j} / ∑ idf</text>
  <text x="628" y="294" class="math" fill="#0f766e">• F_BERT = 2 P_BERT R_BERT / (P_BERT + R_BERT)</text>
  <text x="628" y="313" class="math">• Rescaled: (Score − b) / (1 − b)</text>
  <text x="628" y="330" class="small">Captures synonyms, paraphrases &amp; word order</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="'Manrope', -apple-system, sans-serif">
  <rect width="760" height="300" rx="12" fill="#fbfaf6" stroke="#d8d2c5" stroke-width="1.5"/>

  <!-- Card 1: Bradley-Terry Arena Elo -->
  <g transform="translate(16, 16)">
    <rect width="232" height="268" rx="10" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.2"/>
    <text x="116" y="24" text-anchor="middle" font-size="12.5" font-weight="800" fill="#1e2422">1. Bradley–Terry Arena Elo</text>
    <text x="116" y="41" text-anchor="middle" font-size="10" fill="#5a625e">Pairwise win probability P(i &gt; j)</text>

    <g transform="translate(16, 52)">
      <rect width="200" height="160" rx="8" fill="#fbfaf6" stroke="#d8d2c5"/>

      <!-- Axes -->
      <line x1="30" y1="132" x2="182" y2="132" stroke="#5a625e" stroke-width="1.3"/>
      <line x1="30" y1="24" x2="30" y2="132" stroke="#5a625e" stroke-width="1.3"/>
      <text x="24" y="30" text-anchor="end" font-size="8.5" fill="#5a625e">1.0</text>
      <text x="24" y="80" text-anchor="end" font-size="8.5" fill="#5a625e">0.5</text>
      <text x="24" y="132" text-anchor="end" font-size="8.5" fill="#5a625e">0.0</text>

      <!-- Midline at 0.5, x=106 -->
      <line x1="30" y1="78" x2="182" y2="78" stroke="#c8c2b5" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="106" y1="24" x2="106" y2="132" stroke="#c8c2b5" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- Logistic S-curve -->
      <path d="M 32,126 C 68,124 84,104 106,78 C 128,52 144,32 180,30" fill="none" stroke="#165d4c" stroke-width="2.4"/>

      <!-- +100 Elo marker at (130, 63) -->
      <circle cx="130" cy="63" r="4" fill="#9e2f24"/>
      <text x="132" y="53" text-anchor="middle" font-size="8.5" font-weight="800" fill="#9e2f24">+100 → 64%</text>

      <text x="106" y="149" text-anchor="middle" font-size="9" font-weight="700" fill="#3a423e">Rating Difference ΔR = R_i − R_j</text>
    </g>

    <rect x="16" y="222" width="200" height="32" rx="6" fill="#eef6f0" stroke="#a8cbb7"/>
    <text x="116" y="242" text-anchor="middle" font-size="9.5" font-weight="800" fill="#173d35">Order-Independent Global MLE</text>
  </g>

  <!-- Card 2: Position Swap & Length Control -->
  <g transform="translate(264, 16)">
    <rect width="232" height="268" rx="10" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.2"/>
    <text x="116" y="24" text-anchor="middle" font-size="12.5" font-weight="800" fill="#1e2422">2. Position &amp; Length Control</text>
    <text x="116" y="41" text-anchor="middle" font-size="10" fill="#5a625e">Removing slot &amp; verbosity biases</text>

    <g transform="translate(16, 52)">
      <rect width="200" height="160" rx="8" fill="#fbfaf6" stroke="#d8d2c5"/>

      <!-- Box 1: Position Swap -->
      <rect x="12" y="14" width="176" height="60" rx="6" fill="#ffffff" stroke="#d8d2c5"/>
      <text x="100" y="32" text-anchor="middle" font-size="9.5" font-weight="800" fill="#173d35">Bidirectional Slot Swap</text>
      <text x="100" y="48" text-anchor="middle" font-size="8.5" fill="#3a423e">Pass 1: (A, B)   |   Pass 2: (B, A)</text>
      <text x="100" y="63" text-anchor="middle" font-size="8.5" font-weight="700" fill="#8c5d16">Disagreement → Declare Tie</text>

      <!-- Box 2: Length-Controlled GLM -->
      <rect x="12" y="86" width="176" height="60" rx="6" fill="#ffffff" stroke="#d8d2c5"/>
      <text x="100" y="104" text-anchor="middle" font-size="9.5" font-weight="800" fill="#9e2f24">Length-Controlled Win Rate</text>
      <text x="100" y="120" text-anchor="middle" font-size="8.5" fill="#3a423e">Fit: σ(θ_m − θ_b + φ·tanh(Δlen))</text>
      <text x="100" y="135" text-anchor="middle" font-size="8.5" font-weight="700" fill="#173d35">Predict at Counterfactual Δlen = 0</text>
    </g>

    <rect x="16" y="222" width="200" height="32" rx="6" fill="#fdf6e9" stroke="#d9c091"/>
    <text x="116" y="242" text-anchor="middle" font-size="9.5" font-weight="800" fill="#8c5d16">Isolates Quality from Verbosity</text>
  </g>

  <!-- Card 3: Rogan-Gladen Calibration -->
  <g transform="translate(512, 16)">
    <rect width="232" height="268" rx="10" fill="#ffffff" stroke="#e2ddd2" stroke-width="1.2"/>
    <text x="116" y="24" text-anchor="middle" font-size="12.5" font-weight="800" fill="#1e2422">3. Rogan–Gladen Calibration</text>
    <text x="116" y="41" text-anchor="middle" font-size="10" fill="#5a625e">Debiasing noisy binary LLM judges</text>

    <g transform="translate(16, 52)">
      <rect width="200" height="160" rx="8" fill="#fbfaf6" stroke="#d8d2c5"/>

      <!-- Observed Judge Rate -->
      <rect x="14" y="14" width="172" height="36" rx="5" fill="#fdf2f0" stroke="#9e2f24" stroke-width="1.3"/>
      <text x="100" y="29" text-anchor="middle" font-size="9" font-weight="800" fill="#9e2f24">Raw Judge Pass Rate: p_obs = 62%</text>
      <text x="100" y="42" text-anchor="middle" font-size="8" fill="#5a625e">Includes false positives (1 − q_0)</text>

      <!-- Calibration parameters -->
      <rect x="14" y="60" width="172" height="38" rx="5" fill="#ffffff" stroke="#d8d2c5"/>
      <text x="100" y="76" text-anchor="middle" font-size="9" font-weight="800" fill="#1e2422">Human Calibration (TPR &amp; TNR)</text>
      <text x="100" y="90" text-anchor="middle" font-size="8.5" fill="#5a625e">Sensitivity q_1 = 0.90, Specificity q_0 = 0.80</text>

      <!-- Corrected True Prevalence -->
      <rect x="14" y="108" width="172" height="38" rx="5" fill="#eef6f0" stroke="#165d4c" stroke-width="1.4"/>
      <text x="100" y="124" text-anchor="middle" font-size="9" font-weight="800" fill="#173d35">θ_corr = (p_obs + q_0 − 1) / (q_1 + q_0 − 1)</text>
      <text x="100" y="138" text-anchor="middle" font-size="8.5" font-weight="800" fill="#173d35">(0.62 + 0.80 − 1) / 0.70 = 60.0%</text>
    </g>

    <rect x="16" y="222" width="200" height="32" rx="6" fill="#eef6f0" stroke="#a8cbb7"/>
    <text x="116" y="242" text-anchor="middle" font-size="9.5" font-weight="800" fill="#173d35">Unbiased True Pass Prevalence</text>
  </g>
</svg>

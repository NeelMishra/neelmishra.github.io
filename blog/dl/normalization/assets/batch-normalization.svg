<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-label="Left: Batch Normalization computational graph showing the three backward gradient paths through x_hat, mu_B, and sigma_B^2. Right: Conv + BatchNorm inference folding into a single linear operator.">
  <defs>
    <marker id="bn-fwd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#137b68"/>
    </marker>
    <marker id="bn-bwd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#9c2f2f"/>
    </marker>
    <marker id="bn-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#477fa2"/>
    </marker>
  </defs>

  <rect width="900" height="360" rx="16" fill="#f4f7f2"/>

  <g font-family="system-ui, -apple-system, sans-serif" fill="#173d35">
    <!-- Left Panel: 3-path Computational Graph -->
    <rect x="20" y="20" width="500" height="320" rx="12" fill="#ffffff" stroke="#d7e2dc" stroke-width="1.5"/>
    <text x="38" y="48" font-size="17" font-weight="700">1. Three-Path Computational Graph of BatchNorm</text>
    <text x="38" y="68" font-size="12.5" fill="#3c5a52">Every xᵢ affects yⱼ directly AND via shared mini-batch moments μ_B, σ_B²</text>

    <!-- Nodes -->
    <circle cx="72" cy="180" r="28" fill="#173d35"/>
    <text x="72" y="185" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">xᵢ</text>

    <rect x="168" y="102" width="84" height="44" rx="10" fill="#e6f5f1" stroke="#137b68" stroke-width="2"/>
    <text x="210" y="129" font-size="15" font-weight="700" fill="#137b68" text-anchor="middle">μ_B</text>

    <rect x="168" y="218" width="84" height="44" rx="10" fill="#fdf3eb" stroke="#b66929" stroke-width="2"/>
    <text x="210" y="245" font-size="15" font-weight="700" fill="#b66929" text-anchor="middle">σ_B²</text>

    <circle cx="338" cy="180" r="30" fill="#137b68"/>
    <text x="338" y="186" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">x̂ᵢ</text>

    <circle cx="458" cy="180" r="30" fill="#477fa2"/>
    <text x="458" y="177" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">yᵢ</text>
    <text x="458" y="194" font-size="11" fill="#e8f1f6" text-anchor="middle">γx̂ᵢ + β</text>

    <!-- Forward solid arrows -->
    <line x1="100" y1="180" x2="304" y2="180" stroke="#137b68" stroke-width="2.5" marker-end="url(#bn-fwd)"/>
    <line x1="96" y1="163" x2="164" y2="126" stroke="#137b68" stroke-width="2" marker-end="url(#bn-fwd)"/>
    <line x1="96" y1="197" x2="164" y2="234" stroke="#137b68" stroke-width="2" marker-end="url(#bn-fwd)"/>
    <line x1="210" y1="146" x2="210" y2="214" stroke="#137b68" stroke-width="2" marker-end="url(#bn-fwd)"/>
    <line x1="252" y1="124" x2="312" y2="162" stroke="#137b68" stroke-width="2" marker-end="url(#bn-fwd)"/>
    <line x1="252" y1="236" x2="312" y2="198" stroke="#137b68" stroke-width="2" marker-end="url(#bn-fwd)"/>
    <line x1="368" y1="180" x2="424" y2="180" stroke="#137b68" stroke-width="2.5" marker-end="url(#bn-fwd)"/>

    <!-- Backward dashed arrows -->
    <path d="M 308 170 L 106 170" fill="none" stroke="#9c2f2f" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#bn-bwd)"/>
    <text x="206" y="164" font-size="11.5" font-weight="700" fill="#9c2f2f" text-anchor="middle">① Direct: ∂L/∂x̂ᵢ · 1/σ</text>

    <path d="M 318 152 Q 275 110 254 114" fill="none" stroke="#9c2f2f" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#bn-bwd)"/>
    <text x="270" y="94" font-size="11.5" font-weight="700" fill="#9c2f2f" text-anchor="middle">② Mean: −(1/m) ∑ⱼ ∂L/∂x̂ⱼ</text>

    <path d="M 318 208 Q 275 250 254 246" fill="none" stroke="#9c2f2f" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#bn-bwd)"/>
    <text x="275" y="282" font-size="11.5" font-weight="700" fill="#9c2f2f" text-anchor="middle">③ Scale: −(x̂ᵢ/m) ∑ⱼ (∂L/∂x̂ⱼ) x̂ⱼ</text>

    <text x="270" y="322" font-size="12.5" font-weight="600" fill="#173d35" text-anchor="middle">Orthogonal invariants:  ∑ᵢ ∂L/∂xᵢ = 0   and   ∑ᵢ (∂L/∂xᵢ) x̂ᵢ = 0</text>

    <!-- Right Panel: Inference Folding -->
    <rect x="538" y="20" width="342" height="320" rx="12" fill="#ffffff" stroke="#d7e2dc" stroke-width="1.5"/>
    <text x="556" y="48" font-size="17" font-weight="700">2. Train vs. Eval &amp; Weight Folding</text>
    <text x="556" y="68" font-size="12.5" fill="#3c5a52">At inference, freeze EMA moments and fuse into Conv/Linear</text>

    <!-- Training box -->
    <rect x="558" y="88" width="302" height="94" rx="10" fill="#f4f7f2" stroke="#cde0da" stroke-width="1.5"/>
    <text x="572" y="110" font-size="13.5" font-weight="700" fill="#137b68">Training mode (model.train())</text>
    <text x="572" y="132" font-size="12.5" fill="#173d35">• Normalize by mini-batch μ_B, σ_B² over (N, H, W)</text>
    <text x="572" y="152" font-size="12.5" fill="#173d35">• Update EMA buffers (unbiased variance m/(m−1)):</text>
    <text x="582" y="171" font-size="12" font-weight="600" fill="#3c5a52">μ_run ← (1−α)μ_run + α μ_B,  σ²_run ← (1−α)σ²_run + α·m/(m−1)·σ²_B</text>

    <!-- Inference fusion box -->
    <rect x="558" y="198" width="302" height="124" rx="10" fill="#fdf3eb" stroke="#ead5c3" stroke-width="1.5"/>
    <text x="572" y="220" font-size="13.5" font-weight="700" fill="#b66929">Inference mode (model.eval() + Fuse)</text>
    <text x="572" y="242" font-size="12.5" fill="#173d35">• μ_run, σ²_run are constants → BN is purely linear!</text>
    <text x="572" y="264" font-size="12.5" font-weight="700" fill="#173d35">W_fold = (γ / √(σ²_run + ε)) · W</text>
    <text x="572" y="286" font-size="12.5" font-weight="700" fill="#173d35">b_fold = (γ / √(σ²_run + ε)) · (b − μ_run) + β</text>
    <text x="572" y="309" font-size="12" fill="#3c5a52">Zero runtime overhead: BN layer disappears at deployment.</text>
  </g>
</svg>

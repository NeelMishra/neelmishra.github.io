<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img" aria-label="Four (N, C, (H,W)) cubes comparing the reduction slices of BatchNorm, LayerNorm, InstanceNorm, and GroupNorm.">
  <rect width="900" height="350" rx="16" fill="#f4f7f2"/>

  <g font-family="system-ui, -apple-system, sans-serif" fill="#173d35">
    <text x="30" y="38" font-size="19" font-weight="700">The Four Slices of the (N, C, H×W) Activation Cube (Wu &amp; He, 2018)</text>
    <text x="30" y="60" font-size="13" fill="#3c5a52">Shaded blocks show the subset Sᵢ of elements pooled together to compute one (μ, σ²) pair</text>

    <!-- 1. BatchNorm -->
    <g transform="translate(26, 80)">
      <rect width="198" height="244" rx="12" fill="#ffffff" stroke="#d7e2dc" stroke-width="1.5"/>
      <text x="99" y="26" font-size="15" font-weight="700" fill="#137b68" text-anchor="middle">BatchNorm</text>
      <text x="99" y="44" font-size="11.5" fill="#3c5a52" text-anchor="middle">Slice: 1 channel across all N</text>

      <!-- Grid: 6 cols (C), 4 rows (H,W), stacked over N -->
      <rect x="28" y="64" width="142" height="106" fill="#eef2ef" stroke="#9ab0a8" stroke-width="1"/>
      <!-- Highlight 1 column across whole height & depth -->
      <rect x="52" y="64" width="24" height="106" fill="#137b68" fill-opacity="0.82" stroke="#0d594b" stroke-width="1.5"/>
      <!-- Grid lines -->
      <line x1="52" y1="64" x2="52" y2="170" stroke="#9ab0a8" stroke-width="1"/>
      <line x1="76" y1="64" x2="76" y2="170" stroke="#9ab0a8" stroke-width="1"/>
      <line x1="100" y1="64" x2="100" y2="170" stroke="#9ab0a8" stroke-width="1"/>
      <line x1="124" y1="64" x2="124" y2="170" stroke="#9ab0a8" stroke-width="1"/>
      <line x1="146" y1="64" x2="146" y2="170" stroke="#9ab0a8" stroke-width="1"/>
      <line x1="28" y1="90" x2="170" y2="90" stroke="#9ab0a8" stroke-width="1"/>
      <line x1="28" y1="117" x2="170" y2="117" stroke="#9ab0a8" stroke-width="1"/>
      <line x1="28" y1="144" x2="170" y2="144" stroke="#9ab0a8" stroke-width="1"/>

      <text x="99" y="188" font-size="11.5" font-weight="700" fill="#173d35" text-anchor="middle">Axes: C →  |  N, (H,W) ↓</text>
      <text x="99" y="210" font-size="12" font-weight="700" fill="#137b68" text-anchor="middle">m = N · H · W</text>
      <text x="99" y="229" font-size="11" fill="#9c2f2f" text-anchor="middle">Depends on batch N</text>
    </g>

    <!-- 2. LayerNorm -->
    <g transform="translate(244, 80)">
      <rect width="198" height="244" rx="12" fill="#ffffff" stroke="#d7e2dc" stroke-width="1.5"/>
      <text x="99" y="26" font-size="15" font-weight="700" fill="#477fa2" text-anchor="middle">LayerNorm</text>
      <text x="99" y="44" font-size="11.5" fill="#3c5a52" text-anchor="middle">Slice: all C across 1 sample n</text>

      <rect x="28" y="64" width="142" height="106" fill="#eef2ef" stroke="#9ab0a8" stroke-width="1"/>
      <!-- Highlight 1 sample row across all C -->
      <rect x="28" y="64" width="142" height="26" fill="#477fa2" fill-opacity="0.85" stroke="#2d5b78" stroke-width="1.5"/>
      <line x1="52" y1="64" x2="52" y2="170" stroke="#9ab0a8" stroke-width="1"/>
      <line x1="76" y1="64" x2="76" y2="170" stroke="#9ab0a8" stroke-width="1"/>
      <line x1="100" y1="64" x2="100" y2="170" stroke="#9ab0a8" stroke-width="1"/>
      <line x1="124" y1="64" x2="124" y2="170" stroke="#9ab0a8" stroke-width="1"/>
      <line x1="146" y1="64" x2="146" y2="170" stroke="#9ab0a8" stroke-width="1"/>
      <line x1="28" y1="90" x2="170" y2="90" stroke="#9ab0a8" stroke-width="1"/>
      <line x1="28" y1="117" x2="170" y2="117" stroke="#9ab0a8" stroke-width="1"/>
      <line x1="28" y1="144" x2="170" y2="144" stroke="#9ab0a8" stroke-width="1"/>

      <text x="99" y="188" font-size="11.5" font-weight="700" fill="#173d35" text-anchor="middle">G = 1 group of all C</text>
      <text x="99" y="210" font-size="12" font-weight="700" fill="#477fa2" text-anchor="middle">m = C · H · W (or C)</text>
      <text x="99" y="229" font-size="11" fill="#137b68" text-anchor="middle">Batch-independent ✓</text>
    </g>

    <!-- 3. InstanceNorm -->
    <g transform="translate(462, 80)">
      <rect width="198" height="244" rx="12" fill="#ffffff" stroke="#d7e2dc" stroke-width="1.5"/>
      <text x="99" y="26" font-size="15" font-weight="700" fill="#b66929" text-anchor="middle">InstanceNorm</text>
      <text x="99" y="44" font-size="11.5" fill="#3c5a52" text-anchor="middle">Slice: 1 channel, 1 sample (n,c)</text>

      <rect x="28" y="64" width="142" height="106" fill="#eef2ef" stroke="#9ab0a8" stroke-width="1"/>
      <!-- Highlight single cell (1 sample, 1 channel over H,W) -->
      <rect x="52" y="64" width="24" height="26" fill="#b66929" fill-opacity="0.88" stroke="#854816" stroke-width="1.5"/>
      <line x1="52" y1="64" x2="52" y2="170" stroke="#9ab0a8" stroke-width="1"/>
      <line x1="76" y1="64" x2="76" y2="170" stroke="#9ab0a8" stroke-width="1"/>
      <line x1="100" y1="64" x2="100" y2="170" stroke="#9ab0a8" stroke-width="1"/>
      <line x1="124" y1="64" x2="124" y2="170" stroke="#9ab0a8" stroke-width="1"/>
      <line x1="146" y1="64" x2="146" y2="170" stroke="#9ab0a8" stroke-width="1"/>
      <line x1="28" y1="90" x2="170" y2="90" stroke="#9ab0a8" stroke-width="1"/>
      <line x1="28" y1="117" x2="170" y2="117" stroke="#9ab0a8" stroke-width="1"/>
      <line x1="28" y1="144" x2="170" y2="144" stroke="#9ab0a8" stroke-width="1"/>

      <text x="99" y="188" font-size="11.5" font-weight="700" fill="#173d35" text-anchor="middle">G = C separate channels</text>
      <text x="99" y="210" font-size="12" font-weight="700" fill="#b66929" text-anchor="middle">m = H · W</text>
      <text x="99" y="229" font-size="11" fill="#137b68" text-anchor="middle">Strips instance style ✓</text>
    </g>

    <!-- 4. GroupNorm -->
    <g transform="translate(680, 80)">
      <rect width="194" height="244" rx="12" fill="#ffffff" stroke="#d7e2dc" stroke-width="1.5"/>
      <text x="97" y="26" font-size="15" font-weight="700" fill="#9c2f2f" text-anchor="middle">GroupNorm</text>
      <text x="97" y="44" font-size="11.5" fill="#3c5a52" text-anchor="middle">Slice: C/G channels, 1 sample</text>

      <rect x="26" y="64" width="142" height="106" fill="#eef2ef" stroke="#9ab0a8" stroke-width="1"/>
      <!-- Highlight 3 channels of 1 sample (group of C/G) -->
      <rect x="26" y="64" width="72" height="26" fill="#9c2f2f" fill-opacity="0.85" stroke="#6e1d1d" stroke-width="1.5"/>
      <line x1="50" y1="64" x2="50" y2="170" stroke="#9ab0a8" stroke-width="1"/>
      <line x1="74" y1="64" x2="74" y2="170" stroke="#9ab0a8" stroke-width="1"/>
      <line x1="98" y1="64" x2="98" y2="170" stroke="#173d35" stroke-width="2"/>
      <line x1="122" y1="64" x2="122" y2="170" stroke="#9ab0a8" stroke-width="1"/>
      <line x1="144" y1="64" x2="144" y2="170" stroke="#9ab0a8" stroke-width="1"/>
      <line x1="26" y1="90" x2="168" y2="90" stroke="#9ab0a8" stroke-width="1"/>
      <line x1="26" y1="117" x2="168" y2="117" stroke="#9ab0a8" stroke-width="1"/>
      <line x1="26" y1="144" x2="168" y2="144" stroke="#9ab0a8" stroke-width="1"/>

      <text x="97" y="188" font-size="11.5" font-weight="700" fill="#173d35" text-anchor="middle">1 &lt; G &lt; C (default G = 32)</text>
      <text x="97" y="210" font-size="12" font-weight="700" fill="#9c2f2f" text-anchor="middle">m = (C / G) · H · W</text>
      <text x="97" y="229" font-size="11" fill="#137b68" text-anchor="middle">Stable at batch size N=1 ✓</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" width="900" height="370" font-family="'Manrope', -apple-system, sans-serif">
  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0d9488"/>
    </marker>
  </defs>

  <rect width="900" height="370" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Left Panel: Loss Contours & Condition Number -->
  <g transform="translate(20, 18)">
    <rect width="415" height="334" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
    <text x="207" y="24" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">1. Why Feature Scaling Accelerates Gradient Descent</text>
    <text x="207" y="41" text-anchor="middle" font-size="10.5" fill="#475569">Hessian H = (1/N) XᵀX eigenvalues match feature scales σ₁², σ₂²</text>

    <!-- Unscaled canyon -->
    <g transform="translate(20, 54)">
      <rect width="375" height="122" rx="8" fill="#fef2f2" stroke="#fecaca"/>
      <text x="12" y="18" font-size="11" font-weight="700" fill="#991b1b">Unnormalized Features (x₁ ∈ [0, 2000], x₂ ∈ [1, 5])</text>
      <text x="12" y="33" font-size="10" fill="#7f1d1d">Ill-conditioned κ(H) = λ_max / λ_min ≫ 1 → steep in w₁, flat in w₂</text>

      <!-- Elongated ellipses -->
      <ellipse cx="235" cy="76" rx="122" ry="34" fill="none" stroke="#fca5a5" stroke-width="1.3"/>
      <ellipse cx="235" cy="76" rx="90" ry="23" fill="none" stroke="#f87171" stroke-width="1.3"/>
      <ellipse cx="235" cy="76" rx="54" ry="12" fill="none" stroke="#ef4444" stroke-width="1.3"/>
      <circle cx="235" cy="76" r="3.5" fill="#991b1b"/>
      <text x="243" y="79" font-size="10" font-weight="800" fill="#991b1b">w*</text>

      <!-- Zig-zag trajectory -->
      <polyline points="122,64 140,96 158,56 176,92 194,61 212,86 228,74" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
      <circle cx="122" cy="64" r="3.5" fill="#dc2626"/>
      <text x="86" y="67" font-size="9.5" font-weight="700" fill="#991b1b">w₀ (zig-zag)</text>
    </g>

    <!-- Normalized spherical bowl -->
    <g transform="translate(20, 188)">
      <rect width="375" height="130" rx="8" fill="#f0fdfa" stroke="#99f6e4"/>
      <text x="12" y="18" font-size="11" font-weight="700" fill="#115e59">Normalized Features (Min-Max [0,1] or Z-Score μ=0, σ=1)</text>
      <text x="12" y="33" font-size="10" fill="#134e4a">Well-conditioned κ(H) ≈ 1 → −∇L points straight toward w*</text>

      <!-- Circular contours -->
      <circle cx="235" cy="80" r="42" fill="none" stroke="#5eead4" stroke-width="1.3"/>
      <circle cx="235" cy="80" r="28" fill="none" stroke="#2dd4bf" stroke-width="1.3"/>
      <circle cx="235" cy="80" r="14" fill="none" stroke="#14b8a6" stroke-width="1.3"/>
      <circle cx="235" cy="80" r="3.5" fill="#115e59"/>
      <text x="243" y="83" font-size="10" font-weight="800" fill="#115e59">w*</text>

      <!-- Direct trajectory -->
      <line x1="158" y1="62" x2="227" y2="78" stroke="#0d9488" stroke-width="2.2" marker-end="url(#arrow-teal)"/>
      <circle cx="158" cy="62" r="3.5" fill="#0d9488"/>
      <text x="105" y="64" font-size="9.5" font-weight="700" fill="#115e59">w₀ (direct step)</text>
    </g>
  </g>

  <!-- Right Panel: Outlier Sensitivity Across 4 Standard Scalers -->
  <g transform="translate(450, 18)">
    <rect width="430" height="334" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
    <text x="215" y="24" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">2. Outlier Compression: x = [10, 20, 30, 40, 500]</text>
    <text x="215" y="41" text-anchor="middle" font-size="10.5" fill="#475569">Four normal points (blue) + one extreme outlier x₅ = 500 (red)</text>

    <!-- Track 1: Min-Max Scaling -->
    <g transform="translate(20, 58)">
      <rect width="390" height="62" rx="7" fill="#fff7ed" stroke="#fed7aa"/>
      <text x="10" y="16" font-size="10.5" font-weight="800" fill="#9a3412">Min-Max Scaling: x' = (x − x_min) / (x_max − x_min) ∈ [0, 1]</text>
      <text x="10" y="30" font-size="9.5" fill="#c2410c">x' = [0.00, 0.02, 0.04, 0.06, 1.00] — 80% of data crushed into [0, 0.061]!</text>
      <line x1="25" y1="46" x2="365" y2="46" stroke="#fdba74" stroke-width="2"/>
      <!-- Inliers squished at left -->
      <circle cx="25" cy="46" r="4" fill="#2563eb"/>
      <circle cx="32" cy="46" r="4" fill="#2563eb"/>
      <circle cx="39" cy="46" r="4" fill="#2563eb"/>
      <circle cx="46" cy="46" r="4" fill="#2563eb"/>
      <!-- Outlier at 1.0 -->
      <circle cx="365" cy="46" r="4.5" fill="#dc2626"/>
      <text x="25" y="58" text-anchor="middle" font-size="8.5" fill="#7c2d12">0.0</text>
      <text x="58" y="58" font-size="8.5" fill="#1d4ed8">inliers ≤ 0.061</text>
      <text x="365" y="58" text-anchor="middle" font-size="8.5" font-weight="700" fill="#dc2626">1.0 (500)</text>
    </g>

    <!-- Track 2: Z-Score Standardization -->
    <g transform="translate(20, 128)">
      <rect width="390" height="62" rx="7" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="10" y="16" font-size="10.5" font-weight="800" fill="#1e40af">Z-Score Standardization: z = (x − μ) / σ   (μ = 120, σ = 190.1)</text>
      <text x="10" y="30" font-size="9.5" fill="#1d4ed8">z = [−0.58, −0.53, −0.47, −0.42, +2.00] — mean &amp; σ pulled by outlier</text>
      <line x1="25" y1="46" x2="365" y2="46" stroke="#93c5fd" stroke-width="2"/>
      <circle cx="65" cy="46" r="4" fill="#2563eb"/>
      <circle cx="72" cy="46" r="4" fill="#2563eb"/>
      <circle cx="79" cy="46" r="4" fill="#2563eb"/>
      <circle cx="86" cy="46" r="4" fill="#2563eb"/>
      <line x1="142" y1="39" x2="142" y2="53" stroke="#1e3a8a" stroke-width="1.5"/>
      <text x="142" y="58" text-anchor="middle" font-size="8.5" fill="#1e3a8a">z = 0 (μ=120)</text>
      <circle cx="355" cy="46" r="4.5" fill="#dc2626"/>
      <text x="355" y="58" text-anchor="middle" font-size="8.5" font-weight="700" fill="#dc2626">+2.00</text>
    </g>

    <!-- Track 3: Robust Scaler (Median + IQR) -->
    <g transform="translate(20, 198)">
      <rect width="390" height="62" rx="7" fill="#f0fdf4" stroke="#bbf7d0"/>
      <text x="10" y="16" font-size="10.5" font-weight="800" fill="#166534">Robust Scaling: x_rob = (x − Q₅₀) / (Q₇₅ − Q₂₅)   (Q₅₀ = 30, IQR = 20)</text>
      <text x="10" y="30" font-size="9.5" fill="#15803d">x_rob = [−1.0, −0.5, 0.0, +0.5, +23.5] — inlier spacing 100% preserved!</text>
      <line x1="25" y1="46" x2="365" y2="46" stroke="#86efac" stroke-width="2"/>
      <circle cx="55" cy="46" r="4.2" fill="#16a34a"/>
      <circle cx="115" cy="46" r="4.2" fill="#16a34a"/>
      <circle cx="175" cy="46" r="4.2" fill="#16a34a"/>
      <circle cx="235" cy="46" r="4.2" fill="#16a34a"/>
      <circle cx="355" cy="46" r="4.5" fill="#dc2626"/>
      <text x="55" y="58" text-anchor="middle" font-size="8.5" fill="#166534">−1.0</text>
      <text x="115" y="58" text-anchor="middle" font-size="8.5" fill="#166534">−0.5</text>
      <text x="175" y="58" text-anchor="middle" font-size="8.5" font-weight="700" fill="#166534">0.0 (Q₅₀)</text>
      <text x="235" y="58" text-anchor="middle" font-size="8.5" fill="#166534">+0.5</text>
      <text x="345" y="58" text-anchor="middle" font-size="8.5" font-weight="700" fill="#dc2626">+23.5 (clip)</text>
    </g>

    <!-- Track 4: MaxAbs Scaling (Sparsity Preserving) -->
    <g transform="translate(20, 266)">
      <rect width="390" height="54" rx="7" fill="#f5f3ff" stroke="#ddd6fe"/>
      <text x="10" y="17" font-size="10.5" font-weight="800" fill="#5b21b6">MaxAbs Scaling: x' = x / max|x| ∈ [−1, 1]   (Sparsity-Preserving: 0 ↦ 0)</text>
      <text x="10" y="33" font-size="9.5" fill="#6d28d9">Never subtracts μ or x_min → keeps sparse CSR matrices 99.9% zero in memory</text>
      <text x="10" y="46" font-size="9" fill="#4c1d95">Crucial rule: Fit x_min, x_max, μ, σ, Q₅₀ ONLY on D_train — never on D_test!</text>
    </g>
  </g>
</svg>

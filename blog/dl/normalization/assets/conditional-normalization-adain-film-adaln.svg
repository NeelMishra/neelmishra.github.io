<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-label="Left: Evolution of conditional normalization from AdaIN and FiLM to spatially varying SPADE. Right: DiT AdaLN-Zero block architecture modulating scale, shift, and zero-initialized residual gates.">
  <defs>
    <marker id="cn-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#173d35"/>
    </marker>
    <marker id="cn-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#b66929"/>
    </marker>
    <marker id="cn-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#137b68"/>
    </marker>
  </defs>

  <rect width="900" height="360" rx="16" fill="#f4f7f2"/>

  <g font-family="system-ui, -apple-system, sans-serif" fill="#173d35">
    <!-- Left Panel: AdaIN / FiLM vs SPADE -->
    <rect x="20" y="20" width="415" height="320" rx="12" fill="#ffffff" stroke="#d7e2dc" stroke-width="1.5"/>
    <text x="38" y="48" font-size="17" font-weight="700">1. AdaIN / FiLM vs. Spatial SPADE</text>
    <text x="38" y="68" font-size="12.5" fill="#3c5a52">Conditioning replaces static (γ, β) with dynamic functions of c</text>

    <!-- AdaIN / FiLM box -->
    <rect x="38" y="86" width="378" height="106" rx="10" fill="#f4f7f2" stroke="#cde0da" stroke-width="1.5"/>
    <text x="54" y="108" font-size="14" font-weight="700" fill="#137b68">AdaIN &amp; FiLM (Channel-wise vectors γ(c), β(c) ∈ ℝ^C)</text>
    <text x="54" y="130" font-size="12.5" fill="#173d35">• AdaIN(x, y)_c = σ_c(y) · ((x_c − μ_c(x)) / σ_c(x)) + μ_c(y)</text>
    <text x="54" y="152" font-size="12.5" fill="#173d35">• FiLM(x | c)_c  = γ_c(c) · Norm(x)_c + β_c(c)</text>
    <text x="54" y="174" font-size="12" fill="#3c5a52">Transfers global style, class, or text prompt with only 2C scalars.</text>

    <!-- SPADE box -->
    <rect x="38" y="206" width="378" height="118" rx="10" fill="#fdf3eb" stroke="#ead5c3" stroke-width="1.5"/>
    <text x="54" y="228" font-size="14" font-weight="700" fill="#b66929">SPADE (Spatially-varying tensors Γ_{c,h,w}(M), B_{c,h,w}(M))</text>
    <text x="54" y="250" font-size="12.5" fill="#173d35">• Semantic mask M ∈ ℝ^{H×W} fed through 2-layer Conv:</text>
    <text x="54" y="272" font-size="12.5" font-weight="700" fill="#173d35">  y_{n,c,h,w} = Γ_{c,h,w}(M) · x̂_{n,c,h,w} + B_{c,h,w}(M)</text>
    <text x="54" y="294" font-size="12" fill="#3c5a52">Prevents InstanceNorm from washing out uniform semantic masks</text>
    <text x="54" y="312" font-size="12" fill="#3c5a52">(e.g. a flat "sky" mask where spatial variance σ²_{H,W} = 0).</text>

    <!-- Right Panel: DiT AdaLN-Zero -->
    <rect x="452" y="20" width="428" height="320" rx="12" fill="#ffffff" stroke="#d7e2dc" stroke-width="1.5"/>
    <text x="470" y="48" font-size="17" font-weight="700">2. DiT AdaLN-Zero Block (Peebles &amp; Xie, 2023)</text>
    <text x="470" y="68" font-size="12.5" fill="#3c5a52">Zero-initialized MLP predicts (γ₁, β₁, α₁, γ₂, β₂, α₂) from (t, y)</text>

    <!-- Conditioning MLP on left of right panel -->
    <rect x="472" y="138" width="114" height="86" rx="10" fill="#fdf3eb" stroke="#b66929" stroke-width="2"/>
    <text x="529" y="162" font-size="12.5" font-weight="700" fill="#b66929" text-anchor="middle">Cond. c = t + y</text>
    <text x="529" y="182" font-size="12" fill="#173d35" text-anchor="middle">SiLU → Linear</text>
    <text x="529" y="200" font-size="11.5" font-weight="700" fill="#9c2f2f" text-anchor="middle">(W = 0, b = 0)</text>
    <text x="529" y="216" font-size="11" fill="#3c5a52" text-anchor="middle">Outputs γ, β, α = 0</text>

    <!-- Residual spine on right -->
    <line x1="644" y1="296" x2="644" y2="96" stroke="#137b68" stroke-width="3.5" marker-end="url(#cn-teal)"/>
    <text x="644" y="314" font-size="12.5" font-weight="700" fill="#173d35" text-anchor="middle">Input x_l</text>

    <!-- Branch: LN -> Modulate(1+gamma, beta) -> Attn -> Gate(alpha) -->
    <path d="M 644 276 L 758 276 L 758 256" fill="none" stroke="#173d35" stroke-width="2" marker-end="url(#cn-arr)"/>
    <rect x="696" y="222" width="124" height="30" rx="6" fill="#137b68"/>
    <text x="758" y="242" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">(1+γ₁)⊙LN(x) + β₁</text>

    <line x1="758" y1="222" x2="758" y2="198" stroke="#173d35" stroke-width="2"/>
    <rect x="706" y="164" width="104" height="32" rx="8" fill="#477fa2"/>
    <text x="758" y="185" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Attention / FFN</text>

    <line x1="758" y1="164" x2="758" y2="142" stroke="#173d35" stroke-width="2"/>
    <rect x="706" y="110" width="104" height="30" rx="6" fill="#9c2f2f"/>
    <text x="758" y="130" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Gate: α₁ ⊙ (·)</text>

    <!-- Arrows from Conditioning MLP to Modulate and Gate -->
    <path d="M 586 196 L 692 236" fill="none" stroke="#b66929" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#cn-amber)"/>
    <path d="M 586 164 L 702 125" fill="none" stroke="#b66929" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#cn-amber)"/>

    <path d="M 706 125 L 658 125" fill="none" stroke="#173d35" stroke-width="2" marker-end="url(#cn-arr)"/>
    <circle cx="644" cy="125" r="12" fill="#e6f5f1" stroke="#137b68" stroke-width="2"/>
    <text x="644" y="130" font-size="14" font-weight="700" fill="#137b68" text-anchor="middle">+</text>

    <text x="666" y="330" font-size="12" font-weight="600" fill="#137b68" text-anchor="middle">At step 0: α₁ = 0 ⇒ Exact identity block x_{l+1} = x_l</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-label="Left: Loss landscape L-smoothness before and after normalization. Right: Scale invariance on the weight sphere showing gradient orthogonality W^T grad L = 0 and Pythagorean norm growth balanced by weight decay.">
  <defs>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#137b68"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#b66929"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#9c2f2f"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#477fa2"/>
    </marker>
  </defs>

  <rect width="900" height="360" rx="16" fill="#f4f7f2"/>

  <g font-family="system-ui, -apple-system, sans-serif" fill="#173d35">
    <!-- Left Panel: Loss Landscape Smoothing -->
    <rect x="22" y="20" width="415" height="320" rx="12" fill="#ffffff" stroke="#d7e2dc" stroke-width="1.5"/>
    <text x="42" y="50" font-size="18" font-weight="700">1. Lipschitz Loss-Landscape Smoothing</text>
    <text x="42" y="72" font-size="13" fill="#3c5a52">Smaller curvature L allows larger stable step sizes η ≤ 2/L</text>

    <!-- Axes -->
    <line x1="55" y1="275" x2="405" y2="275" stroke="#8aa29b" stroke-width="1.5"/>
    <line x1="55" y1="95" x2="55" y2="275" stroke="#8aa29b" stroke-width="1.5"/>
    <text x="230" y="298" font-size="13" fill="#3c5a52" text-anchor="middle">Step along gradient direction (−η ∇L)</text>
    <text x="40" y="185" font-size="13" fill="#3c5a52" text-anchor="middle" transform="rotate(-90 40 185)">Loss L(w)</text>

    <!-- Unnormalized jagged high-curvature curve -->
    <path d="M 65 115 Q 95 255 125 140 T 185 240 T 245 135 T 315 245 T 390 130" fill="none" stroke="#9c2f2f" stroke-width="2.5" stroke-dasharray="6,4"/>
    <text x="295" y="122" font-size="13" font-weight="700" fill="#9c2f2f">Unnormalized (large L)</text>

    <!-- Normalized smooth curve -->
    <path d="M 65 125 C 135 160, 210 245, 295 252 C 335 255, 365 242, 395 225" fill="none" stroke="#137b68" stroke-width="3.5"/>
    <text x="165" y="218" font-size="14" font-weight="700" fill="#137b68">Normalized (small L_norm)</text>

    <!-- Large safe step arrow -->
    <circle cx="85" cy="136" r="5" fill="#137b68"/>
    <circle cx="295" cy="252" r="5" fill="#137b68"/>
    <path d="M 92 142 Q 190 215 286 249" fill="none" stroke="#137b68" stroke-width="2" marker-end="url(#arr-teal)"/>
    <text x="230" y="322" font-size="12.5" fill="#173d35" text-anchor="middle">‖∇_x Norm(x)‖ scales by γ / σ and projects out mean &amp; scale</text>

    <!-- Right Panel: Scale Invariance & Orthogonality -->
    <rect x="458" y="20" width="420" height="320" rx="12" fill="#ffffff" stroke="#d7e2dc" stroke-width="1.5"/>
    <text x="478" y="50" font-size="18" font-weight="700">2. Scale Invariance &amp; Orthogonal Gradients</text>
    <text x="478" y="72" font-size="13" fill="#3c5a52">Norm(αWx) = Norm(Wx)  ⇒  Wᵀ ∇_W L(W) = 0</text>

    <!-- Weight Sphere Arc -->
    <path d="M 520 285 A 160 160 0 0 1 785 115" fill="none" stroke="#cde0da" stroke-width="2.5" stroke-dasharray="5,5"/>
    <circle cx="520" cy="285" r="4" fill="#173d35"/>
    <text x="505" y="302" font-size="13" font-weight="700">0</text>

    <!-- Weight vector W_t -->
    <line x1="520" y1="285" x2="652" y2="193" stroke="#137b68" stroke-width="3.5" marker-end="url(#arr-teal)"/>
    <text x="572" y="225" font-size="15" font-weight="700" fill="#137b68">W_t</text>

    <!-- Orthogonal tangent step -eta grad L(W_t) -->
    <line x1="656" y1="190" x2="722" y2="284" stroke="#b66929" stroke-width="3" marker-end="url(#arr-amber)"/>
    <text x="728" y="242" font-size="14" font-weight="700" fill="#b66929">−η ∇_W L(W_t)</text>

    <!-- Right angle marker at W_t tip -->
    <polyline points="644,199 653,211 665,202" fill="none" stroke="#173d35" stroke-width="1.8"/>

    <!-- Resulting W_{t+1} without weight decay (longer norm!) -->
    <line x1="520" y1="285" x2="718" y2="285" stroke="#477fa2" stroke-width="3" marker-end="url(#arr-blue)"/>
    <text x="625" y="305" font-size="14" font-weight="700" fill="#477fa2">W_{t+1} (‖W_{t+1}‖² = ‖W_t‖² + η²‖∇L‖²)</text>

    <!-- Radial weight decay pull -eta lambda W_t -->
    <line x1="722" y1="285" x2="676" y2="285" stroke="#9c2f2f" stroke-width="2.5" marker-end="url(#arr-red)"/>
    <text x="765" y="135" font-size="13" fill="#3c5a52" text-anchor="middle">Constant-direction rays</text>
    <text x="765" y="153" font-size="13" font-weight="700" fill="#137b68" text-anchor="middle">∇L(αW) = (1/α) ∇L(W)</text>
    <text x="668" y="326" font-size="12.5" fill="#9c2f2f" text-anchor="middle">Weight decay (−ηλW) pulls radial norm back to equilibrium sphere</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" width="900" height="370" font-family="'Manrope', -apple-system, sans-serif">
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0d9488"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="900" height="370" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Left Panel: Non-Linear & Quantile Transforms -->
  <g transform="translate(20, 18)">
    <rect width="415" height="334" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
    <text x="207" y="24" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">1. Non-Linear &amp; Rank-Gauss Distribution Shaping</text>
    <text x="207" y="41" text-anchor="middle" font-size="10.5" fill="#475569">Linear scaling (ax + b) cannot fix skewness; non-linear maps reshape tails</text>

    <!-- Skewed distribution box -->
    <g transform="translate(20, 54)">
      <rect width="375" height="114" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
      <text x="12" y="18" font-size="11" font-weight="700" fill="#9a3412">Raw / Z-Scored Right-Skewed Feature (Skewness γ₁ ≫ 0)</text>
      <text x="12" y="33" font-size="9.5" fill="#c2410c">Income, token counts, rewards: 95% bunched on left, extreme tail on right</text>
      <!-- Axis -->
      <line x1="24" y1="96" x2="352" y2="96" stroke="#94a3b8" stroke-width="1.5"/>
      <!-- Skewed curve -->
      <path d="M 28,96 C 36,38 52,38 74,64 C 102,88 180,94 345,95.5" fill="#fed7aa" fill-opacity="0.55" stroke="#ea580c" stroke-width="2.2"/>
      <text x="54" y="54" font-size="9.5" font-weight="700" fill="#9a3412">Mode</text>
      <text x="245" y="86" font-size="9.5" font-weight="700" fill="#c2410c">Heavy Pareto / power-law tail →</text>
    </g>

    <!-- Arrow down -->
    <line x1="207" y1="172" x2="207" y2="194" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>
    <text x="216" y="187" font-size="9.5" font-weight="700" fill="#1d4ed8">Box-Cox / Yeo-Johnson / SymLog / Φ⁻¹(F̂(x))</text>

    <!-- Gaussianized distribution box -->
    <g transform="translate(20, 198)">
      <rect width="375" height="120" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="12" y="18" font-size="11" font-weight="700" fill="#1e40af">After Power Transform or Rank-Gauss: z = Φ⁻¹(rank(x)/(N+1))</text>
      <text x="12" y="33" font-size="9.5" fill="#1d4ed8">Pulls in right tail, expands dense core → symmetric N(0, 1) bell curve</text>
      <!-- Axis -->
      <line x1="24" y1="100" x2="352" y2="100" stroke="#94a3b8" stroke-width="1.5"/>
      <!-- Symmetric Gaussian curve -->
      <path d="M 35,99 C 95,98 135,40 188,40 C 241,40 281,98 341,99" fill="#bfdbfe" fill-opacity="0.55" stroke="#2563eb" stroke-width="2.2"/>
      <line x1="188" y1="40" x2="188" y2="100" stroke="#1d4ed8" stroke-dasharray="3,3" stroke-width="1.3"/>
      <text x="188" y="113" text-anchor="middle" font-size="9" font-weight="700" fill="#1e3a8a">z = 0 (μ=0, σ=1, γ₁=0)</text>
      <text x="115" y="113" text-anchor="middle" font-size="8.5" fill="#475569">−2σ</text>
      <text x="261" y="113" text-anchor="middle" font-size="8.5" fill="#475569">+2σ</text>
    </g>
  </g>

  <!-- Right Panel: Z-Score vs PCA Whitening vs ZCA Whitening -->
  <g transform="translate(450, 18)">
    <rect width="430" height="334" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
    <text x="215" y="24" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">2. Z-Score vs. PCA Whitening vs. ZCA Whitening</text>
    <text x="215" y="41" text-anchor="middle" font-size="10.5" fill="#475569">Removing cross-feature correlation Σ = U Λ Uᵀ so Cov(X_white) = I</text>

    <!-- 3 side-by-side coordinate plots -->
    <!-- Plot A: Z-Score (correlated) -->
    <g transform="translate(14, 58)">
      <rect width="126" height="165" rx="8" fill="#fef2f2" stroke="#fecaca"/>
      <text x="63" y="17" text-anchor="middle" font-size="10.5" font-weight="800" fill="#991b1b">A. Z-Score Only</text>
      <text x="63" y="30" text-anchor="middle" font-size="9" fill="#b91c1c">diag(Σ)=I, off-diag ρ≠0</text>
      <line x1="18" y1="95" x2="108" y2="95" stroke="#cbd5e1" stroke-width="1.2"/>
      <line x1="63" y1="50" x2="63" y2="140" stroke="#cbd5e1" stroke-width="1.2"/>
      <!-- Tilted ellipse -->
      <g transform="translate(63, 95) rotate(-38)">
        <ellipse cx="0" cy="0" rx="40" ry="13" fill="#fca5a5" fill-opacity="0.35" stroke="#dc2626" stroke-width="1.8"/>
        <circle cx="28" cy="0" r="3.5" fill="#dc2626"/>
        <text x="16" y="-6" font-size="8.5" font-weight="800" fill="#991b1b">p₁</text>
      </g>
      <text x="63" y="155" text-anchor="middle" font-size="8.5" fill="#7f1d1d">Still correlated!</text>
    </g>

    <!-- Plot B: PCA Whitening -->
    <g transform="translate(152, 58)">
      <rect width="126" height="165" rx="8" fill="#f5f3ff" stroke="#ddd6fe"/>
      <text x="63" y="17" text-anchor="middle" font-size="10.5" font-weight="800" fill="#5b21b6">B. PCA Whitening</text>
      <text x="63" y="30" text-anchor="middle" font-size="9" fill="#6d28d9">Λ⁻¹/² Uᵀ X (Cov = I)</text>
      <line x1="18" y1="95" x2="108" y2="95" stroke="#cbd5e1" stroke-width="1.2"/>
      <line x1="63" y1="50" x2="63" y2="140" stroke="#cbd5e1" stroke-width="1.2"/>
      <circle cx="63" cy="95" r="28" fill="#ddd6fe" fill-opacity="0.4" stroke="#7c3aed" stroke-width="1.8"/>
      <!-- Point p1 rotated onto horizontal eigen-axis! -->
      <circle cx="91" cy="95" r="3.5" fill="#7c3aed"/>
      <text x="88" y="86" font-size="8.5" font-weight="800" fill="#5b21b6">p₁ (rotated)</text>
      <text x="63" y="155" text-anchor="middle" font-size="8.5" fill="#5b21b6">Axes rotated by Uᵀ</text>
    </g>

    <!-- Plot C: ZCA Whitening -->
    <g transform="translate(290, 58)">
      <rect width="126" height="165" rx="8" fill="#f0fdfa" stroke="#99f6e4"/>
      <text x="63" y="17" text-anchor="middle" font-size="10.5" font-weight="800" fill="#115e59">C. ZCA Whitening</text>
      <text x="63" y="30" text-anchor="middle" font-size="9" fill="#0f766e">U Λ⁻¹/² Uᵀ X = Σ⁻¹/² X</text>
      <line x1="18" y1="95" x2="108" y2="95" stroke="#cbd5e1" stroke-width="1.2"/>
      <line x1="63" y1="50" x2="63" y2="140" stroke="#cbd5e1" stroke-width="1.2"/>
      <circle cx="63" cy="95" r="28" fill="#99f6e4" fill-opacity="0.4" stroke="#0d9488" stroke-width="1.8"/>
      <!-- Point p1 preserved at original angle -38 deg! -->
      <circle cx="85" cy="78" r="3.5" fill="#0d9488"/>
      <text x="75" y="72" font-size="8.5" font-weight="800" fill="#115e59">p₁ (aligned!)</text>
      <text x="63" y="155" text-anchor="middle" font-size="8.5" fill="#115e59">Closest to X in L₂!</text>
    </g>

    <!-- Bottom summary box -->
    <g transform="translate(14, 235)">
      <rect width="402" height="83" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="12" y="19" font-size="10.5" font-weight="800" fill="#0f172a">Why ZCA (Zero-phase Component Analysis) Preserves Feature Identity:</text>
      <text x="12" y="36" font-size="9.5" fill="#334155">• Any orthogonal rotation R applied to PCA whitening W = R Λ⁻¹/² Uᵀ still satisfies Cov(WX) = I.</text>
      <text x="12" y="52" font-size="9.5" fill="#334155">• Choosing R = U gives the symmetric positive-definite matrix W_ZCA = U Λ⁻¹/² Uᵀ = Σ⁻¹/²,</text>
      <text x="12" y="68" font-size="9.5" fill="#0f766e" font-weight="700">  which uniquely minimizes E[‖WX − X‖₂²] — preserving spatial pixel &amp; channel semantics.</text>
    </g>
  </g>
</svg>

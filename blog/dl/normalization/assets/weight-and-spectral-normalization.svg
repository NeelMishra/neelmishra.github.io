<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-label="Left: Weight Normalization decoupling scalar gain g and direction v / ||v||_2 with orthogonal tangent gradient. Right: Spectral Normalization dividing W by top singular value sigma_1(W) via 1-step power iteration to map the unit ball to a unit-radius ellipsoid.">
  <defs>
    <marker id="wn-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#137b68"/>
    </marker>
    <marker id="wn-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#b66929"/>
    </marker>
    <marker id="wn-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#477fa2"/>
    </marker>
  </defs>

  <rect width="900" height="360" rx="16" fill="#f4f7f2"/>

  <g font-family="system-ui, -apple-system, sans-serif" fill="#173d35">
    <!-- Left Panel: Weight Normalization -->
    <rect x="20" y="20" width="415" height="320" rx="12" fill="#ffffff" stroke="#d7e2dc" stroke-width="1.5"/>
    <text x="38" y="48" font-size="17" font-weight="700">1. Weight Normalization (Salimans &amp; Kingma)</text>
    <text x="38" y="68" font-size="12.5" fill="#3c5a52">Decouples each neuron’s magnitude g from its unit direction v / ‖v‖₂</text>

    <!-- Unit circle arc -->
    <path d="M 90 270 A 130 130 0 0 1 220 140" fill="none" stroke="#cde0da" stroke-width="2.5" stroke-dasharray="5,4"/>
    <circle cx="90" cy="270" r="4" fill="#173d35"/>
    <text x="74" y="286" font-size="12.5" font-weight="700">0</text>

    <!-- Unit vector v / ||v|| -->
    <line x1="90" y1="270" x2="182" y2="178" stroke="#137b68" stroke-width="3.5" marker-end="url(#wn-teal)"/>
    <text x="112" y="208" font-size="13.5" font-weight="700" fill="#137b68">v / ‖v‖₂</text>

    <!-- Extended vector v -->
    <line x1="182" y1="178" x2="256" y2="104" stroke="#477fa2" stroke-width="2.5" stroke-dasharray="4,3" marker-end="url(#wn-blue)"/>
    <text x="242" y="96" font-size="14" font-weight="700" fill="#477fa2">v</text>

    <!-- Orthogonal gradient projection P_{v^\perp} grad_w L -->
    <line x1="256" y1="104" x2="328" y2="176" stroke="#b66929" stroke-width="3" marker-end="url(#wn-amber)"/>
    <polyline points="247,113 257,123 266,114" fill="none" stroke="#173d35" stroke-width="1.6"/>
    <text x="302" y="130" font-size="13" font-weight="700" fill="#b66929">∇_v L = (g/‖v‖₂) P_{v⊥} ∇_w L</text>

    <rect x="38" y="294" width="378" height="32" rx="6" fill="#f4f7f2"/>
    <text x="227" y="315" font-size="12.5" font-weight="600" fill="#173d35" text-anchor="middle">w = g · (v / ‖v‖₂)    |    ∂L/∂g = (vᵀ / ‖v‖₂) ∇_w L</text>

    <!-- Right Panel: Spectral Normalization -->
    <rect x="452" y="20" width="428" height="320" rx="12" fill="#ffffff" stroke="#d7e2dc" stroke-width="1.5"/>
    <text x="470" y="48" font-size="17" font-weight="700">2. Spectral Normalization (Miyato et al., 2018)</text>
    <text x="470" y="68" font-size="12.5" fill="#3c5a52">W_SN = W / σ₁(W) guarantees 1-Lipschitz layer: ‖W_SN‖₂ = 1</text>

    <!-- Unnormalized Ellipsoid vs Spectral-Normalized Ellipsoid -->
    <ellipse cx="666" cy="175" rx="164" ry="52" transform="rotate(-18 666 175)" fill="#fdf3eb" stroke="#b66929" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="765" y="108" font-size="12.5" font-weight="700" fill="#b66929">Unnormalized W (σ₁ = 2.4 &gt; 1)</text>

    <!-- Unit circle reference -->
    <circle cx="666" cy="175" r="68" fill="none" stroke="#8aa29b" stroke-width="1.5" stroke-dasharray="3,3"/>

    <!-- Spectral Normalized Ellipsoid (major radius = unit circle radius = 68) -->
    <ellipse cx="666" cy="175" rx="68" ry="24" transform="rotate(-18 666 175)" fill="#e6f5f1" fill-opacity="0.85" stroke="#137b68" stroke-width="3"/>
    <line x1="666" y1="175" x2="729" y2="154" stroke="#137b68" stroke-width="2.5" marker-end="url(#wn-teal)"/>
    <text x="655" y="160" font-size="12.5" font-weight="700" fill="#137b68">σ₁(W_SN) = 1</text>

    <!-- Power iteration & gradient box -->
    <rect x="470" y="256" width="392" height="68" rx="8" fill="#f4f7f2" stroke="#cde0da" stroke-width="1"/>
    <text x="666" y="278" font-size="12.5" font-weight="700" fill="#173d35" text-anchor="middle">1-Step Power Iteration:  u ← Wv / ‖Wv‖₂ ,   v ← Wᵀu / ‖Wᵀu‖₂ ,   σ₁ = uᵀWv</text>
    <text x="666" y="302" font-size="12.5" font-weight="600" fill="#9c2f2f" text-anchor="middle">Backward:  ∇_W L = (1/σ₁) (∇_{W_SN} L − ⟨∇_{W_SN} L, uvᵀ⟩ uvᵀ)</text>
  </g>
</svg>

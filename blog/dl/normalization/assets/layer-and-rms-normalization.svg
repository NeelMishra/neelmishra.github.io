<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-label="Left: BatchNorm vs LayerNorm reduction across a (B, T, D) sequence tensor. Right: LayerNorm vs RMSNorm compute passes and Jacobian projection.">
  <defs>
    <marker id="ln-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#137b68"/>
    </marker>
    <marker id="rms-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#b66929"/>
    </marker>
  </defs>

  <rect width="900" height="360" rx="16" fill="#f4f7f2"/>

  <g font-family="system-ui, -apple-system, sans-serif" fill="#173d35">
    <!-- Left Panel: Per-token reduction over D -->
    <rect x="20" y="20" width="420" height="320" rx="12" fill="#ffffff" stroke="#d7e2dc" stroke-width="1.5"/>
    <text x="38" y="48" font-size="17" font-weight="700">1. Per-Token Normalization on (B, T, D)</text>
    <text x="38" y="68" font-size="12.5" fill="#3c5a52">Each token vector x_{b,t} ∈ ℝ^D is normalized across its own D features</text>

    <!-- Token grid for Sample b -->
    <text x="48" y="102" font-size="13" font-weight="700" fill="#173d35">Features D →</text>
    <text x="42" y="140" font-size="12.5" font-weight="600" fill="#137b68">Token t=1</text>
    <rect x="112" y="122" width="248" height="28" rx="6" fill="#137b68"/>
    <text x="236" y="141" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">Reduce over D  →  (μ_{b,1}, σ²_{b,1})</text>

    <text x="42" y="180" font-size="12.5" font-weight="600" fill="#477fa2">Token t=2</text>
    <rect x="112" y="162" width="248" height="28" rx="6" fill="#477fa2"/>
    <text x="236" y="181" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">Reduce over D  →  (μ_{b,2}, σ²_{b,2})</text>

    <text x="42" y="220" font-size="12.5" font-weight="600" fill="#b66929">Token t=3</text>
    <rect x="112" y="202" width="248" height="28" rx="6" fill="#b66929"/>
    <text x="236" y="221" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">Reduce over D  →  (μ_{b,3}, σ²_{b,3})</text>

    <!-- Padding token row -->
    <text x="42" y="260" font-size="12.5" fill="#8aa29b">[PAD] t=4</text>
    <rect x="112" y="242" width="248" height="28" rx="6" fill="#eef2ef" stroke="#bccbc5" stroke-dasharray="4,3"/>
    <text x="236" y="261" font-size="12" fill="#6b827b" text-anchor="middle">Isolated! Never pollutes tokens t=1..3</text>

    <text x="230" y="302" font-size="12.5" font-weight="600" fill="#173d35" text-anchor="middle">✓ Identical in train() and eval()    ✓ Works at B = 1, T = 1</text>
    <text x="230" y="322" font-size="12" fill="#3c5a52" text-anchor="middle">✓ No running EMA buffers needed</text>

    <!-- Right Panel: LayerNorm vs RMSNorm -->
    <rect x="458" y="20" width="422" height="320" rx="12" fill="#ffffff" stroke="#d7e2dc" stroke-width="1.5"/>
    <text x="476" y="48" font-size="17" font-weight="700">2. LayerNorm vs. RMSNorm</text>
    <text x="476" y="68" font-size="12.5" fill="#3c5a52">RMSNorm drops mean-centering (μ_L, β) to save HBM bandwidth</text>

    <!-- LayerNorm Box -->
    <rect x="476" y="86" width="386" height="106" rx="10" fill="#f4f7f2" stroke="#cde0da" stroke-width="1.5"/>
    <text x="492" y="108" font-size="14" font-weight="700" fill="#137b68">LayerNorm (Ba et al., 2016)</text>
    <text x="492" y="130" font-size="13" fill="#173d35">Forward:  y = γ ⊙ (x − μ_L) / √(σ²_L + ε) + β     (2 reductions: μ_L, σ²_L)</text>
    <text x="492" y="152" font-size="13" fill="#173d35">Jacobian:  P_{LN} = I − (1/D)11ᵀ − (1/D)x̂x̂ᵀ   (Rank-2 projection)</text>
    <text x="492" y="174" font-size="12" fill="#3c5a52">Invariance: Both shift-invariant (x + c1) and scale-invariant (αx)</text>

    <!-- RMSNorm Box -->
    <rect x="476" y="206" width="386" height="118" rx="10" fill="#fdf3eb" stroke="#ead5c3" stroke-width="1.5"/>
    <text x="492" y="228" font-size="14" font-weight="700" fill="#b66929">RMSNorm (Zhang &amp; Sennrich, 2019)</text>
    <text x="492" y="250" font-size="13" fill="#173d35">Forward:  y = γ ⊙ x / √((1/D)∑ xᵢ² + ε)            (1 reduction: mean square)</text>
    <text x="492" y="272" font-size="13" fill="#173d35">Jacobian:  P_{RMS} = I − (1/D)x̄x̄ᵀ                     (Rank-1 projection)</text>
    <text x="492" y="294" font-size="12" fill="#3c5a52">Invariance: Scale-invariant (αx); 7%–40% faster kernel execution</text>
    <text x="492" y="313" font-size="12" font-weight="600" fill="#9c2f2f">Zero-centered variant (Gemma): y = (1 + w) ⊙ x̄  with w₀ = 0</text>
  </g>
</svg>

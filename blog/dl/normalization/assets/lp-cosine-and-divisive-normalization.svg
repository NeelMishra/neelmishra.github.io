<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" width="900" height="370" font-family="'Manrope', -apple-system, sans-serif">
  <defs>
    <marker id="arr-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0f172a"/>
    </marker>
    <marker id="arr-blue2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="900" height="370" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Left Panel: Lp Unit Balls & Cosine / Hyperspherical Normalization -->
  <g transform="translate(20, 18)">
    <rect width="415" height="334" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
    <text x="207" y="24" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">1. Sample-Wise L_p Unit Balls &amp; Cosine Normalization</text>
    <text x="207" y="41" text-anchor="middle" font-size="10.5" fill="#475569">Row-wise projection x̂ = x / ‖x‖_p onto L₁ diamond, L₂ sphere, L_∞ cube</text>

    <!-- Coordinate system centered at (207, 178), radius R = 92 -->
    <g transform="translate(207, 176)">
      <!-- Axes -->
      <line x1="-130" y1="0" x2="130" y2="0" stroke="#cbd5e1" stroke-width="1.3"/>
      <line x1="0" y1="-118" x2="0" y2="118" stroke="#cbd5e1" stroke-width="1.3"/>

      <!-- L_inf unit square (radius 92) -->
      <rect x="-92" y="-92" width="184" height="184" fill="#f5f3ff" fill-opacity="0.35" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="5,3"/>
      <text x="-88" y="-97" font-size="9.5" font-weight="700" fill="#6d28d9">L_∞: max|x_j| = 1</text>

      <!-- L_2 unit circle (radius 92) -->
      <circle cx="0" cy="0" r="92" fill="#eff6ff" fill-opacity="0.45" stroke="#2563eb" stroke-width="2.2"/>
      <text x="68" y="-72" font-size="9.5" font-weight="800" fill="#1d4ed8">L₂ sphere ‖x̂‖₂ = 1</text>

      <!-- L_1 unit diamond (radius 92) -->
      <polygon points="0,-92 92,0 0,92 -92,0" fill="#fff7ed" fill-opacity="0.45" stroke="#ea580c" stroke-width="2"/>
      <text x="-76" y="45" font-size="9.5" font-weight="700" fill="#c2410c">L₁: ∑|x_j| = 1</text>

      <!-- Ray for vector x = (3, 4) -> angle -53.13 deg in SVG coords (x=55.2, y=-73.6 on L2) -->
      <line x1="0" y1="0" x2="84" y2="-112" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3,3"/>
      <circle cx="84" cy="-112" r="4" fill="#334155"/>
      <text x="90" y="-108" font-size="9.5" font-weight="700" fill="#0f172a">Raw x = (3, 4)</text>

      <!-- L_inf projection: (3/4, 4/4) * 92 = (69, -92) -->
      <circle cx="69" cy="-92" r="4" fill="#7c3aed"/>
      <!-- L_2 projection: (0.6, 0.8) * 92 = (55.2, -73.6) -->
      <circle cx="55.2" cy="-73.6" r="4.5" fill="#2563eb"/>
      <text x="62" y="-58" font-size="9" font-weight="800" fill="#1e40af">x̂_L2=(0.6, 0.8)</text>
      <!-- L_1 projection: (3/7, 4/7) * 92 = (39.4, -52.6) -->
      <circle cx="39.4" cy="-52.6" r="4" fill="#ea580c"/>
      <text x="8" y="-34" font-size="8.5" font-weight="700" fill="#9a3412">x̂_L1=(3/7, 4/7)</text>

      <!-- Second vector w on L2 sphere to show angle theta -->
      <line x1="0" y1="0" x2="88" y2="-26" stroke="#0d9488" stroke-width="2" marker-end="url(#arr-blue2)"/>
      <text x="93" y="-22" font-size="9.5" font-weight="800" fill="#0f766e">ŵ</text>
      <path d="M 35,-10 A 36,36 0 0,0 22,-29" fill="none" stroke="#0f172a" stroke-width="1.5"/>
      <text x="36" y="-21" font-size="10" font-weight="800" fill="#0f172a">θ</text>
    </g>

    <text x="207" y="317" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1e3a8a">On S^(d−1): ‖x̂ − ŵ‖₂² = 2(1 − cos θ)   |   Cosine Norm: y = (wᵀx) / (‖w‖₂‖x‖₂)</text>
  </g>

  <!-- Right Panel: Divisive & Small-Batch CNN Normalizations -->
  <g transform="translate(450, 18)">
    <rect width="430" height="334" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
    <text x="215" y="24" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">2. Divisive &amp; Batch-Free CNN Normalizations</text>
    <text x="215" y="41" text-anchor="middle" font-size="10.5" fill="#475569">From neuroscience lateral inhibition (LRN) to FRN+TLU and Batch Renorm</text>

    <!-- Box 1: LRN (AlexNet) -->
    <g transform="translate(18, 56)">
      <rect width="394" height="82" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
      <text x="12" y="18" font-size="11" font-weight="800" fill="#9a3412">A. Local Response Normalization (LRN — AlexNet, 2012)</text>
      <text x="12" y="35" font-size="9.5" fill="#c2410c">Pools squared energy across n adjacent channels at the same spatial pixel (x, y):</text>
      <text x="197" y="55" text-anchor="middle" font-size="10.5" font-weight="800" fill="#7c2d12">b_{x,y}^i = a_{x,y}^i / ( k + α ∑_{j=i−n/2}^{i+n/2} (a_{x,y}^j)² )^β</text>
      <text x="12" y="72" font-size="9" fill="#9a3412">Bio-inspired lateral inhibition: a strong filter response suppresses its neighbors.</text>
    </g>

    <!-- Box 2: Filter Response Normalization (FRN + TLU) -->
    <g transform="translate(18, 148)">
      <rect width="394" height="84" rx="8" fill="#f0fdfa" stroke="#99f6e4"/>
      <text x="12" y="18" font-size="11" font-weight="800" fill="#115e59">B. Filter Response Normalization (FRN + TLU, CVPR 2020)</text>
      <text x="12" y="35" font-size="9.5" fill="#0f766e">Per-sample, per-channel RMS over (H, W) with NO mean subtraction:</text>
      <text x="197" y="54" text-anchor="middle" font-size="10.5" font-weight="800" fill="#134e4a">ν² = (1/HW) ∑_{h,w} x_{n,c,h,w}²,    y = γ (x / √(ν² + ε)) + β,    z = max(y, τ_c)</text>
      <text x="12" y="73" font-size="9" fill="#115e59">Learned threshold τ_c in TLU replaces mean-centering; works at batch size N = 1!</text>
    </g>

    <!-- Box 3: Batch Renormalization -->
    <g transform="translate(18, 242)">
      <rect width="394" height="78" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="12" y="18" font-size="11" font-weight="800" fill="#1e40af">C. Batch Renormalization (Ioffe, 2017)</text>
      <text x="12" y="35" font-size="9.5" fill="#1d4ed8">Fixes BatchNorm small-batch drift by correcting batch stats toward running EMA:</text>
      <text x="197" y="54" text-anchor="middle" font-size="10.5" font-weight="800" fill="#1e3a8a">x̂_renorm = ((x − μ_B) / σ_B) · r + d,     r = stop_grad(clip(σ_B/σ_EMA)),  d = stop_grad(clip((μ_B−μ_EMA)/σ_EMA))</text>
      <text x="12" y="70" font-size="9" fill="#1e40af">Guarantees train and eval forward passes match even when micro-batch N = 2–4.</text>
    </g>
  </g>
</svg>

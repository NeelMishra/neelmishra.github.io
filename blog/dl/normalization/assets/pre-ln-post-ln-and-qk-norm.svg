<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-label="Comparison of Post-LN, Pre-LN, Sandwich/Peri-LN Transformer blocks, and QK-Norm inside multi-head attention.">
  <defs>
    <marker id="tr-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#173d35"/>
    </marker>
    <marker id="tr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#137b68"/>
    </marker>
  </defs>

  <rect width="900" height="360" rx="16" fill="#f4f7f2"/>

  <g font-family="system-ui, -apple-system, sans-serif" fill="#173d35">
    <!-- 1. Post-LN -->
    <g transform="translate(20, 20)">
      <rect width="202" height="320" rx="12" fill="#ffffff" stroke="#d7e2dc" stroke-width="1.5"/>
      <text x="101" y="28" font-size="15.5" font-weight="700" fill="#9c2f2f" text-anchor="middle">1. Post-LN</text>
      <text x="101" y="46" font-size="11.5" fill="#3c5a52" text-anchor="middle">x_{l+1} = LN(x_l + F(x_l))</text>

      <!-- Residual spine -->
      <line x1="60" y1="275" x2="60" y2="148" stroke="#173d35" stroke-width="2.5" marker-end="url(#tr-arr)"/>
      <path d="M 60 250 L 138 250 L 138 214" fill="none" stroke="#173d35" stroke-width="2" marker-end="url(#tr-arr)"/>
      <rect x="98" y="172" width="80" height="38" rx="8" fill="#477fa2"/>
      <text x="138" y="196" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">Attn / FFN</text>
      <path d="M 138 172 L 138 134 L 74 134" fill="none" stroke="#173d35" stroke-width="2" marker-end="url(#tr-arr)"/>

      <circle cx="60" cy="134" r="12" fill="#eef2ef" stroke="#173d35" stroke-width="2"/>
      <text x="60" y="139" font-size="14" font-weight="700" text-anchor="middle">+</text>

      <!-- LN ON THE MAIN HIGHWAY -->
      <line x1="60" y1="122" x2="60" y2="104" stroke="#173d35" stroke-width="2.5"/>
      <rect x="24" y="72" width="72" height="30" rx="6" fill="#9c2f2f"/>
      <text x="60" y="92" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">LayerNorm</text>

      <text x="101" y="296" font-size="11.5" font-weight="600" fill="#9c2f2f" text-anchor="middle">Highway damped by 1/√(1+σ²_F)</text>
      <text x="101" y="312" font-size="11" fill="#3c5a52" text-anchor="middle">Needs LR warmup</text>
    </g>

    <!-- 2. Pre-LN -->
    <g transform="translate(238, 20)">
      <rect width="202" height="320" rx="12" fill="#ffffff" stroke="#d7e2dc" stroke-width="1.5"/>
      <text x="101" y="28" font-size="15.5" font-weight="700" fill="#137b68" text-anchor="middle">2. Pre-LN</text>
      <text x="101" y="46" font-size="11.5" fill="#3c5a52" text-anchor="middle">x_{l+1} = x_l + F(LN(x_l))</text>

      <!-- Clean Identity Highway -->
      <line x1="56" y1="275" x2="56" y2="96" stroke="#137b68" stroke-width="3.5" marker-end="url(#tr-teal)"/>
      <path d="M 56 254 L 138 254 L 138 232" fill="none" stroke="#173d35" stroke-width="2" marker-end="url(#tr-arr)"/>

      <rect x="100" y="198" width="76" height="30" rx="6" fill="#137b68"/>
      <text x="138" y="218" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">RMSNorm</text>

      <line x1="138" y1="198" x2="138" y2="174" stroke="#173d35" stroke-width="2" marker-end="url(#tr-arr)"/>
      <rect x="98" y="134" width="80" height="36" rx="8" fill="#477fa2"/>
      <text x="138" y="157" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">Attn / FFN</text>

      <path d="M 138 134 L 138 82 L 70 82" fill="none" stroke="#173d35" stroke-width="2" marker-end="url(#tr-arr)"/>
      <circle cx="56" cy="82" r="12" fill="#e6f5f1" stroke="#137b68" stroke-width="2"/>
      <text x="56" y="87" font-size="14" font-weight="700" fill="#137b68" text-anchor="middle">+</text>

      <text x="101" y="296" font-size="11.5" font-weight="600" fill="#137b68" text-anchor="middle">Clean identity Jacobian I</text>
      <text x="101" y="312" font-size="11" fill="#3c5a52" text-anchor="middle">Var(x_l) grows as O(l)</text>
    </g>

    <!-- 3. Sandwich / Peri-LN -->
    <g transform="translate(456, 20)">
      <rect width="202" height="320" rx="12" fill="#ffffff" stroke="#d7e2dc" stroke-width="1.5"/>
      <text x="101" y="28" font-size="15.5" font-weight="700" fill="#b66929" text-anchor="middle">3. Sandwich / Peri-LN</text>
      <text x="101" y="46" font-size="11.5" fill="#3c5a52" text-anchor="middle">x_l + LN_post(F(LN_pre(x_l)))</text>

      <!-- Clean Identity Highway -->
      <line x1="52" y1="275" x2="52" y2="96" stroke="#137b68" stroke-width="3.5" marker-end="url(#tr-teal)"/>
      <path d="M 52 260 L 138 260 L 138 242" fill="none" stroke="#173d35" stroke-width="2" marker-end="url(#tr-arr)"/>

      <rect x="100" y="212" width="76" height="26" rx="6" fill="#137b68"/>
      <text x="138" y="229" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">LN_pre</text>

      <line x1="138" y1="212" x2="138" y2="192" stroke="#173d35" stroke-width="2"/>
      <rect x="98" y="158" width="80" height="32" rx="8" fill="#477fa2"/>
      <text x="138" y="179" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Attn / FFN</text>

      <line x1="138" y1="158" x2="138" y2="138" stroke="#173d35" stroke-width="2"/>
      <rect x="100" y="110" width="76" height="26" rx="6" fill="#b66929"/>
      <text x="138" y="127" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">LN_post</text>

      <path d="M 138 110 L 138 82 L 66 82" fill="none" stroke="#173d35" stroke-width="2" marker-end="url(#tr-arr)"/>
      <circle cx="52" cy="82" r="12" fill="#e6f5f1" stroke="#137b68" stroke-width="2"/>
      <text x="52" y="87" font-size="14" font-weight="700" fill="#137b68" text-anchor="middle">+</text>

      <text x="101" y="296" font-size="11.5" font-weight="600" fill="#b66929" text-anchor="middle">Bounds branch &amp; keeps I path</text>
      <text x="101" y="312" font-size="11" fill="#3c5a52" text-anchor="middle">Used in Gemma 2 / OLMo 2</text>
    </g>

    <!-- 4. QK-Norm -->
    <g transform="translate(674, 20)">
      <rect width="206" height="320" rx="12" fill="#ffffff" stroke="#d7e2dc" stroke-width="1.5"/>
      <text x="103" y="28" font-size="15.5" font-weight="700" fill="#477fa2" text-anchor="middle">4. QK-Norm</text>
      <text x="103" y="46" font-size="11.5" fill="#3c5a52" text-anchor="middle">Normalize Q, K before QKᵀ</text>

      <!-- Q and K branches -->
      <rect x="26" y="198" width="66" height="32" rx="6" fill="#eef2ef" stroke="#477fa2" stroke-width="1.5"/>
      <text x="59" y="219" font-size="12" font-weight="700" fill="#477fa2" text-anchor="middle">q = W_Q x</text>

      <rect x="114" y="198" width="66" height="32" rx="6" fill="#eef2ef" stroke="#477fa2" stroke-width="1.5"/>
      <text x="147" y="219" font-size="12" font-weight="700" fill="#477fa2" text-anchor="middle">k = W_K x</text>

      <line x1="59" y1="198" x2="59" y2="172" stroke="#173d35" stroke-width="2"/>
      <line x1="147" y1="198" x2="147" y2="172" stroke="#173d35" stroke-width="2"/>

      <rect x="24" y="140" width="70" height="30" rx="6" fill="#137b68"/>
      <text x="59" y="159" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">RMSNorm</text>

      <rect x="112" y="140" width="70" height="30" rx="6" fill="#137b68"/>
      <text x="147" y="159" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">RMSNorm</text>

      <path d="M 59 140 L 92 106" fill="none" stroke="#173d35" stroke-width="2"/>
      <path d="M 147 140 L 114 106" fill="none" stroke="#173d35" stroke-width="2"/>

      <rect x="42" y="72" width="122" height="34" rx="8" fill="#477fa2"/>
      <text x="103" y="94" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">softmax(q̂ᵀk̂ / √d_k)</text>

      <text x="103" y="264" font-size="11.5" font-weight="700" fill="#173d35" text-anchor="middle">|q̂ᵀk̂ / √d_k| ≤ √d_k ‖γ_q‖ ‖γ_k‖</text>
      <text x="103" y="296" font-size="11.5" font-weight="600" fill="#137b68" text-anchor="middle">Prevents logit overflow</text>
      <text x="103" y="312" font-size="11" fill="#3c5a52" text-anchor="middle">&amp; entropy collapse in bf16</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 410" role="img" aria-labelledby="title desc"><title id="title">Paged KV memory</title><desc id="desc">Logical blocks 0, 1, 2 map to physical blocks 7, 2, 11. Token 6 is in logical block 1 at offset 2, physically block 2. The last block has two unused slots.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#53655d"/></marker></defs><rect width="680" height="410" rx="14" fill="#faf8f1"/><style>text{font-family:Arial,sans-serif;fill:#283a32}.small{font-size:17px}.label{font-size:20px;font-weight:700}.muted{fill:#657369}.line{fill:none;stroke:#53655d;stroke-width:2;marker-end:url(#arrow)}</style><text x="340" y="35" class="label" text-anchor="middle">LOGICAL ORDER ≠ PHYSICAL PLACEMENT</text><text x="125" y="77" class="label" text-anchor="middle">Logical token blocks</text><text x="480" y="77" class="label" text-anchor="middle">Physical KV blocks</text><rect x="35" y="105" width="190" height="57" rx="9" fill="#e3f0e7" stroke="#a6bdb0"/><text x="130.0" y="140.5" class="label" text-anchor="middle">0  1  2  3</text><text x="130" y="183" class="small" text-anchor="middle">Logical block 0</text><path class="line" d="M225 133L385 220"/><rect x="390" y="192" width="245" height="57" rx="9" fill="#e3f0e7" stroke="#a6bdb0"/><text x="512.5" y="217.5" class="label" text-anchor="middle">Block 7</text><text x="512.5" y="242.5" class="small" text-anchor="middle">0  1  2  3</text><rect x="35" y="192" width="190" height="57" rx="9" fill="#e3f0e7" stroke="#a6bdb0"/><text x="130.0" y="227.5" class="label" text-anchor="middle">4  5  6  7</text><text x="130" y="270" class="small" text-anchor="middle">Logical block 1</text><path class="line" d="M225 220L385 133"/><rect x="390" y="105" width="245" height="57" rx="9" fill="#f6e9da" stroke="#a6bdb0"/><text x="512.5" y="130.5" class="label" text-anchor="middle">Block 2</text><text x="512.5" y="155.5" class="small" text-anchor="middle">4  5  6  7</text><rect x="35" y="279" width="190" height="57" rx="9" fill="#e3f0e7" stroke="#a6bdb0"/><text x="130.0" y="314.5" class="label" text-anchor="middle">8  9  ·  ·</text><text x="130" y="357" class="small" text-anchor="middle">Logical block 2</text><path class="line" d="M225 307L385 307"/><rect x="390" y="279" width="245" height="57" rx="9" fill="#e3f0e7" stroke="#a6bdb0"/><text x="512.5" y="304.5" class="label" text-anchor="middle">Block 11</text><text x="512.5" y="329.5" class="small" text-anchor="middle">8  9  ·  ·</text><text x="340" y="384" class="small" text-anchor="middle">Token 6: logical block ⌊6 / 4⌋ = 1, offset 2 → physical block 2.</text></svg>

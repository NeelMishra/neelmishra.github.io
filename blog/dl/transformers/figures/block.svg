<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 490" role="img" aria-labelledby="title desc"><title id="title">One pre-norm Transformer block</title><desc id="desc">Attention reads normalized X and writes an update to X. The MLP then reads normalized U and writes another update. Residual width is preserved.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#53655d"/></marker></defs><rect width="680" height="490" rx="14" fill="#faf8f1"/><style>text{font-family:Arial,sans-serif;fill:#283a32}.small{font-size:17px}.label{font-size:20px;font-weight:700}.muted{fill:#657369}.line{fill:none;stroke:#53655d;stroke-width:2;marker-end:url(#arrow)}</style><text x="340" y="35" class="label" text-anchor="middle">ONE BLOCK · TWO RESIDUAL WRITES</text><rect x="220" y="65" width="240" height="50" rx="9" fill="#e3f0e7" stroke="#a6bdb0"/><text x="340.0" y="97.0" class="label" text-anchor="middle">Input X: n × d</text><path class="line" d="M340 115L340 140"/><rect x="220" y="140" width="240" height="66" rx="9" fill="#e3f0e7" stroke="#a6bdb0"/><text x="340.0" y="170.0" class="label" text-anchor="middle">Normalize → attention</text><text x="340.0" y="195.0" class="small" text-anchor="middle">Mix sequence positions</text><path class="line" d="M340 206L340 232"/><rect x="220" y="232" width="240" height="50" rx="9" fill="#f6e9da" stroke="#a6bdb0"/><text x="340.0" y="264.0" class="label" text-anchor="middle">U = X + attention update</text><path class="line" d="M220 90H100V257H218"/><text x="95" y="175" class="label" text-anchor="middle">X</text><path class="line" d="M340 282L340 307"/><rect x="220" y="307" width="240" height="66" rx="9" fill="#e3f0e7" stroke="#a6bdb0"/><text x="340.0" y="337.0" class="label" text-anchor="middle">Normalize → MLP</text><text x="340.0" y="362.0" class="small" text-anchor="middle">Transform each position</text><path class="line" d="M340 373L340 398"/><rect x="220" y="398" width="240" height="50" rx="9" fill="#f6e9da" stroke="#a6bdb0"/><text x="340.0" y="430.0" class="label" text-anchor="middle">Y = U + MLP update</text><path class="line" d="M460 257H575V423H462"/><text x="586" y="344" class="label" text-anchor="middle">U</text><text x="340" y="475" class="small" text-anchor="middle">Both updates preserve the residual shape n × d.</text></svg>

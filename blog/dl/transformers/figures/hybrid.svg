<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" role="img" aria-labelledby="title desc"><title id="title">Hybrid attention stack</title><desc id="desc">Three recurrent layers maintain fixed matrix states. A fourth attention layer maintains per-token KV entries. Each layer receives the previous layer output.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#53655d"/></marker></defs><rect width="680" height="440" rx="14" fill="#faf8f1"/><style>text{font-family:Arial,sans-serif;fill:#283a32}.small{font-size:17px}.label{font-size:20px;font-weight:700}.muted{fill:#657369}.line{fill:none;stroke:#53655d;stroke-width:2;marker-end:url(#arrow)}</style><text x="340" y="35" class="label" text-anchor="middle">ONE STREAM, TWO MEMORY FORMATS</text><rect x="35" y="65" width="245" height="58" rx="9" fill="#e3f0e7" stroke="#a6bdb0"/><text x="157.5" y="101.0" class="label" text-anchor="middle">Recurrent layer 1</text><path class="line" d="M157 123L157 144"/><path class="line" d="M280 94L350 94"/><rect x="360" y="65" width="285" height="58" rx="9" fill="#edf0f7" stroke="#a6bdb0"/><text x="502.5" y="91.0" class="label" text-anchor="middle">Matrix state S1</text><text x="502.5" y="116.0" class="small" text-anchor="middle">Fixed size in n</text><rect x="35" y="145" width="245" height="58" rx="9" fill="#e3f0e7" stroke="#a6bdb0"/><text x="157.5" y="181.0" class="label" text-anchor="middle">Recurrent layer 2</text><path class="line" d="M157 203L157 224"/><path class="line" d="M280 174L350 174"/><rect x="360" y="145" width="285" height="58" rx="9" fill="#edf0f7" stroke="#a6bdb0"/><text x="502.5" y="171.0" class="label" text-anchor="middle">Matrix state S2</text><text x="502.5" y="196.0" class="small" text-anchor="middle">Fixed size in n</text><rect x="35" y="225" width="245" height="58" rx="9" fill="#e3f0e7" stroke="#a6bdb0"/><text x="157.5" y="261.0" class="label" text-anchor="middle">Recurrent layer 3</text><path class="line" d="M157 283L157 304"/><path class="line" d="M280 254L350 254"/><rect x="360" y="225" width="285" height="58" rx="9" fill="#edf0f7" stroke="#a6bdb0"/><text x="502.5" y="251.0" class="label" text-anchor="middle">Matrix state S3</text><text x="502.5" y="276.0" class="small" text-anchor="middle">Fixed size in n</text><rect x="35" y="305" width="245" height="58" rx="9" fill="#f6e9da" stroke="#a6bdb0"/><text x="157.5" y="341.0" class="label" text-anchor="middle">Attention layer 4</text><path class="line" d="M280 334L350 334"/><rect x="360" y="305" width="285" height="58" rx="9" fill="#edf0f7" stroke="#a6bdb0"/><text x="502.5" y="331.0" class="label" text-anchor="middle">Token-indexed K/V</text><text x="502.5" y="356.0" class="small" text-anchor="middle">Grows with sequence length</text><text x="340" y="413" class="small" text-anchor="middle">Illustrative layer pattern. Each layer has its own memory.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-labelledby="title desc">
  <title id="title">Adam step 1 bias correction and why uncorrected steps overshoot</title>
  <desc id="desc">Comparison at step 1 for g_1 = 2, beta_1 = 0.9, beta_2 = 0.999 showing how m_1 = 0.2 is shrunk 10x while v_1 = 0.004 is shrunk 1000x (RMS shrunk 31.6x). Bias correction restores m_hat_1 = 2 and v_hat_1 = 4 for a unit step ratio 1, whereas skipping bias correction yields 0.2 / 0.0632 = 3.162.</desc>
  <defs>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#137b68"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#b66929"/>
    </marker>
  </defs>

  <rect width="900" height="390" rx="18" fill="#f4f7f2"/>

  <g font-family="system-ui,sans-serif" fill="#173d35">
    <text x="35" y="42" font-size="22" font-weight="700">Step 1 Audit (g₁ = 2, β₁ = 0.9, β₂ = 0.999, m₀ = v₀ = 0)</text>

    <!-- TOP LEFT: 1st Moment m_1 -->
    <rect x="35" y="65" width="405" height="142" rx="12" fill="#fff" stroke="#b9cfc3" stroke-width="1.5"/>
    <text x="55" y="94" font-size="14" font-weight="700" fill="#137b68">1ST MOMENT (SIGNED DIRECTION, β₁ = 0.9)</text>
    <text x="55" y="126" font-size="17" font-weight="600">Raw:  m₁ = (1 − 0.9)g₁ = 0.1(2) = 0.2</text>
    <text x="55" y="150" font-size="13.5" fill="#52685c">Shrunk 10× toward m₀ = 0</text>
    <text x="55" y="184" font-size="18" font-weight="700" fill="#137b68">Corrected:  m̂₁ = m₁ / (1 − 0.9¹) = 0.2 / 0.1 = 2</text>

    <!-- TOP RIGHT: 2nd Moment v_1 -->
    <rect x="460" y="65" width="405" height="142" rx="12" fill="#fff" stroke="#b9cfc3" stroke-width="1.5"/>
    <text x="480" y="94" font-size="14" font-weight="700" fill="#b66929">2ND MOMENT (SQUARED MAGNITUDE, β₂ = 0.999)</text>
    <text x="480" y="126" font-size="17" font-weight="600">Raw:  v₁ = (1 − 0.999)g₁² = 0.001(4) = 0.004</text>
    <text x="480" y="150" font-size="13.5" fill="#52685c">Shrunk 1000× toward v₀ = 0  (so √v₁ ≈ 0.0632 is shrunk 31.6×)</text>
    <text x="480" y="184" font-size="18" font-weight="700" fill="#b66929">Corrected:  v̂₁ = v₁ / (1 − 0.999¹) = 0.004 / 0.001 = 4</text>

    <!-- BOTTOM LEFT: With Bias Correction -->
    <rect x="35" y="226" width="405" height="136" rx="12" fill="#fff" stroke="#137b68" stroke-width="2"/>
    <text x="55" y="256" font-size="15" font-weight="700" fill="#137b68">With Bias Correction (Standard Adam)</text>
    <text x="55" y="292" font-size="20" font-weight="700">m̂₁ / √v̂₁ = 2 / √4 = 1 = sign(g₁)</text>
    <text x="55" y="324" font-size="14.5" font-weight="600" fill="#173d35">Step:  Δw₁ = −η · (1) = −0.1</text>
    <text x="55" y="346" font-size="13" fill="#52685c">Exact unit step size η in the negative gradient direction.</text>

    <!-- BOTTOM RIGHT: Without Bias Correction -->
    <rect x="460" y="226" width="405" height="136" rx="12" fill="#fff" stroke="#b66929" stroke-width="2"/>
    <text x="480" y="256" font-size="15" font-weight="700" fill="#b66929">Without Bias Correction (Raw Ratio)</text>
    <text x="480" y="292" font-size="20" font-weight="700">m₁ / √v₁ = 0.2 / √0.004 ≈ 3.162</text>
    <text x="480" y="324" font-size="14.5" font-weight="600" fill="#b66929">Step:  Δw₁ = −η · (3.162) ≈ −0.3162  (3.16× oversized!)</text>
    <text x="480" y="346" font-size="13" fill="#52685c">Because √v₁ is shrunk by √0.001 ≈ 0.0316, more than m₁ (0.1).</text>
  </g>
</svg>
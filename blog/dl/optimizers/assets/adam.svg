<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-label="Correct the two memories before taking their ratio"><rect width="900" height="380" rx="16" fill="#f4f7f2"/><g font-family="system-ui,sans-serif" fill="#173d35"><text x="32" y="42" font-size="23" font-weight="700">Correct the two memories before taking their ratio</text><rect x="35" y="85" width="395" height="175" rx="12" fill="white" stroke="#b9cfc3"/><text x="55" y="119" font-size="21">Signed first moment</text><text x="55" y="167" font-size="27">m₁ = 0.2</text><text x="55" y="220" font-size="23">m̂₁ = 0.2 / 0.1 = 2</text><rect x="465" y="85" width="395" height="175" rx="12" fill="white" stroke="#b9cfc3"/><text x="485" y="119" font-size="21">Squared second moment</text><text x="485" y="167" font-size="27">v₁ = 0.004</text><text x="485" y="220" font-size="23">v̂₁ = 0.004 / 0.001 = 4</text><text x="35" y="310" font-size="25">Normalized direction:  2 / √4 = 1</text><text x="35" y="350" font-size="17">g₁ = 2 · β₁ = 0.9 · β₂ = 0.999 · zero initial state</text></g></svg>
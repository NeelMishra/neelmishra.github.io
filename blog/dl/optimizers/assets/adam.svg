<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-labelledby="title desc">
  <title id="title">Adam bias correction and why uncorrected steps overshoot</title>
  <desc id="desc">Symbolic comparison at step t and step 1 showing m_t = (1 - beta_1) sum beta_1^{t-k} g_k and v_t = (1 - beta_2) sum beta_2^{t-k} g_k^2, and how dividing by 1 - beta^t yields a unit step sign(g_1) on step 1 whereas skipping bias correction scales the step by (1 - beta_1) / sqrt(1 - beta_2).</desc>

  <rect width="900" height="390" rx="18" fill="#f4f7f2"/>

  <g font-family="system-ui,sans-serif" fill="#173d35">
    <text x="35" y="42" font-size="21" font-weight="700">Why Bias Correction Divides by (1 − βᵗ) from m₀ = v₀ = 0</text>

    <!-- TOP LEFT: 1st Moment m_t -->
    <rect x="35" y="65" width="405" height="142" rx="12" fill="#fff" stroke="#b9cfc3" stroke-width="1.5"/>
    <text x="55" y="94" font-size="13.5" font-weight="700" fill="#137b68">1ST MOMENT (SIGNED DIRECTION, β₁)</text>
    <text x="55" y="126" font-size="16" font-weight="600">Raw:  E[m_t] = (1 − β₁ᵗ) μ,   m₁ = (1 − β₁) g₁</text>
    <text x="55" y="150" font-size="13" fill="#52685c">Biased toward m₀ = 0 by factor (1 − β₁ᵗ)</text>
    <text x="55" y="182" font-size="15.5" font-weight="700" fill="#137b68">Corrected:  m̂_t = m_t / (1 − β₁ᵗ)  ⇒  m̂₁ = g₁</text>

    <!-- TOP RIGHT: 2nd Moment v_t -->
    <rect x="460" y="65" width="405" height="142" rx="12" fill="#fff" stroke="#b9cfc3" stroke-width="1.5"/>
    <text x="480" y="94" font-size="13.5" font-weight="700" fill="#b66929">2ND MOMENT (SQUARED MAGNITUDE, β₂)</text>
    <text x="480" y="126" font-size="16" font-weight="600">Raw:  E[v_t] = (1 − β₂ᵗ) σ²,   v₁ = (1 − β₂) g₁²</text>
    <text x="480" y="150" font-size="13" fill="#52685c">Biased toward v₀ = 0 by factor (1 − β₂ᵗ)</text>
    <text x="480" y="182" font-size="15.5" font-weight="700" fill="#b66929">Corrected:  v̂_t = v_t / (1 − β₂ᵗ)  ⇒  v̂₁ = g₁²</text>

    <!-- BOTTOM LEFT: With Bias Correction -->
    <rect x="35" y="226" width="405" height="136" rx="12" fill="#fff" stroke="#137b68" stroke-width="2"/>
    <text x="55" y="256" font-size="15" font-weight="700" fill="#137b68">With Bias Correction (t = 1, ε ≈ 0)</text>
    <text x="55" y="290" font-size="18.5" font-weight="700">m̂₁ / √v̂₁ = g₁ / √(g₁²) = sign(g₁)</text>
    <text x="55" y="322" font-size="14" font-weight="600" fill="#173d35">Step:  Δw₁ = −η sign(g₁)</text>
    <text x="55" y="345" font-size="12.5" fill="#52685c">Exact unit step size η along the negative gradient.</text>

    <!-- BOTTOM RIGHT: Without Bias Correction -->
    <rect x="460" y="226" width="405" height="136" rx="12" fill="#fff" stroke="#b66929" stroke-width="2"/>
    <text x="480" y="256" font-size="15" font-weight="700" fill="#b66929">Without Bias Correction (t = 1, ε ≈ 0)</text>
    <text x="480" y="290" font-size="17.5" font-weight="700">m₁ / √v₁ = [(1 − β₁) / √(1 − β₂)] sign(g₁)</text>
    <text x="480" y="322" font-size="14" font-weight="600" fill="#b66929">Step:  Δw₁ = −η [(1 − β₁) / √(1 − β₂)] sign(g₁)</text>
    <text x="480" y="345" font-size="12.5" fill="#52685c">When β₂ &gt; β₁, √(1 − β₂) ≪ (1 − β₁), so the uncorrected step overshoots.</text>
  </g>
</svg>
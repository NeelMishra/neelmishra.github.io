<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-labelledby="title desc">
  <title id="title">Heavy-ball momentum versus Nesterov lookahead momentum</title>
  <desc id="desc">Side-by-side vector diagram comparing standard heavy-ball momentum, which evaluates the gradient at w_{t-1} and adds momentum to overshoot the valley, against Nesterov momentum, which first steps along beta v_{t-1} to the lookahead point w-tilde and evaluates a corrective gradient pointing back toward the valley.</desc>
  <defs>
    <marker id="arr-mom" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#173d35"/>
    </marker>
    <marker id="arr-grad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#b66929"/>
    </marker>
    <marker id="arr-net" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#137b68"/>
    </marker>
    <clipPath id="clip-left">
      <rect x="36" y="100" width="403" height="212"/>
    </clipPath>
    <clipPath id="clip-right">
      <rect x="461" y="100" width="403" height="212"/>
    </clipPath>
  </defs>

  <rect width="900" height="390" rx="18" fill="#f4f7f2"/>

  <g font-family="system-ui,sans-serif" fill="#173d35">
    <text x="35" y="42" font-size="22" font-weight="700">Heavy-Ball vs. Nesterov: Where the gradient is evaluated</text>

    <!-- LEFT PANEL: Heavy-Ball Momentum -->
    <rect x="35" y="62" width="405" height="300" rx="12" fill="#fff" stroke="#b9cfc3"/>
    <text x="55" y="92" font-size="16.5" font-weight="700">1. Heavy-Ball Momentum (gradient at wₜ₋₁)</text>

    <!-- Contours centered near minimum (305, 205) -->
    <g clip-path="url(#clip-left)">
      <ellipse cx="305" cy="205" rx="165" ry="74" fill="none" stroke="#dce7e1" stroke-width="2"/>
      <ellipse cx="305" cy="205" rx="112" ry="48" fill="none" stroke="#c3d6cc" stroke-width="2"/>
      <ellipse cx="305" cy="205" rx="58" ry="24" fill="none" stroke="#9ab5a7" stroke-width="2"/>
    </g>
    <circle cx="305" cy="205" r="4" fill="#52685c"/>
    <text x="314" y="210" font-size="13" font-weight="600" fill="#52685c">w*</text>

    <!-- Step 1: Gradient step at w_{t-1} = (95, 260) -> (190, 232) -->
    <line x1="95" y1="260" x2="185" y2="233" stroke="#b66929" stroke-width="3.2" marker-end="url(#arr-grad)"/>
    <text x="112" y="272" font-size="13.5" font-weight="700" fill="#b66929">1. −η∇L(wₜ₋₁)</text>
    <circle cx="190" cy="232" r="4" fill="#b66929"/>

    <!-- Step 2: Add momentum beta v_{t-1} = (+115, -112) from (190, 232) -> w_t = (305, 120) -->
    <line x1="190" y1="232" x2="301" y2="124" stroke="#173d35" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arr-mom)"/>
    <text x="246" y="186" font-size="13.5" font-weight="700" fill="#173d35">2. + βvₜ₋₁</text>

    <!-- Net update w_{t-1} -> w_t (95, 260) -> (305, 120) -->
    <line x1="95" y1="260" x2="299" y2="124" stroke="#137b68" stroke-width="3.5" marker-end="url(#arr-net)"/>
    <text x="118" y="182" font-size="14" font-weight="700" fill="#137b68">Net step vₜ</text>

    <!-- Points -->
    <circle cx="95" cy="260" r="5.5" fill="#173d35"/>
    <text x="54" y="265" font-size="15" font-weight="700">wₜ₋₁</text>

    <circle cx="305" cy="120" r="5.5" fill="#137b68"/>
    <text x="315" y="124" font-size="14.5" font-weight="700" fill="#137b68">wₜ (overshoots)</text>

    <text x="55" y="326" font-size="13.5" fill="#52685c">Both −η∇L(wₜ₋₁) and βvₜ₋₁ push upward,</text>
    <text x="55" y="345" font-size="13.5" fill="#52685c">carrying wₜ high onto the opposite valley wall.</text>

    <!-- RIGHT PANEL: Nesterov Momentum -->
    <rect x="460" y="62" width="405" height="300" rx="12" fill="#fff" stroke="#b9cfc3"/>
    <text x="480" y="92" font-size="16.5" font-weight="700">2. Nesterov Momentum (gradient at lookahead w̃)</text>

    <!-- Contours centered near minimum (730, 205) -->
    <g clip-path="url(#clip-right)">
      <ellipse cx="730" cy="205" rx="165" ry="74" fill="none" stroke="#dce7e1" stroke-width="2"/>
      <ellipse cx="730" cy="205" rx="112" ry="48" fill="none" stroke="#c3d6cc" stroke-width="2"/>
      <ellipse cx="730" cy="205" rx="58" ry="24" fill="none" stroke="#9ab5a7" stroke-width="2"/>
    </g>
    <circle cx="730" cy="205" r="4" fill="#52685c"/>
    <text x="739" y="210" font-size="13" font-weight="600" fill="#52685c">w*</text>

    <!-- Step 1: Lookahead move beta v_{t-1} = (+115, -112) from w_{t-1} = (520, 260) -> w-tilde = (635, 148) -->
    <line x1="520" y1="260" x2="631" y2="152" stroke="#173d35" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arr-mom)"/>
    <text x="495" y="192" font-size="13.5" font-weight="700" fill="#173d35">1. Lookahead βvₜ₋₁</text>

    <!-- Lookahead point w-tilde = (635, 148) -->
    <circle cx="635" cy="148" r="5" fill="#173d35"/>
    <text x="582" y="132" font-size="14" font-weight="700" fill="#173d35">w̃ = wₜ₋₁ + βvₜ₋₁</text>

    <!-- Step 2: Corrective gradient step at w-tilde: from (635, 148) down-right toward valley (712, 192) -->
    <line x1="635" y1="148" x2="707" y2="189" stroke="#b66929" stroke-width="3.2" marker-end="url(#arr-grad)"/>
    <text x="668" y="156" font-size="13.5" font-weight="700" fill="#b66929">2. −η∇L(w̃)</text>

    <!-- Net update w_{t-1} -> w_t (520, 260) -> (712, 192) -->
    <line x1="520" y1="260" x2="706" y2="194" stroke="#137b68" stroke-width="3.5" marker-end="url(#arr-net)"/>
    <text x="595" y="253" font-size="14" font-weight="700" fill="#137b68">Corrected step vₜ</text>

    <!-- Points -->
    <circle cx="520" cy="260" r="5.5" fill="#173d35"/>
    <text x="479" y="265" font-size="15" font-weight="700">wₜ₋₁</text>

    <circle cx="712" cy="192" r="5.5" fill="#137b68"/>
    <text x="722" y="193" font-size="14.5" font-weight="700" fill="#137b68">wₜ (corrected)</text>

    <text x="480" y="326" font-size="13.5" fill="#52685c">At lookahead w̃, the slope points back down</text>
    <text x="480" y="345" font-size="13.5" fill="#52685c">toward the valley, pulling wₜ back before stepping.</text>
  </g>
</svg>

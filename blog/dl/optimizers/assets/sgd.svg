<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img" aria-labelledby="title desc"><title id="title">One SGD update</title><desc id="desc">Average example gradients, multiply by negative learning rate, then add the displacement to the old parameter.</desc><rect width="900" height="350" rx="18" fill="#f4f7f2"/><g font-family="system-ui,sans-serif" fill="#173d35"><text x="35" y="45" font-size="24" font-weight="700">One batch. One gradient. One update.</text><g fill="#fff" stroke="#b9cfc3"><rect x="35" y="85" width="245" height="155" rx="12"/><rect x="330" y="85" width="240" height="155" rx="12"/><rect x="620" y="85" width="245" height="155" rx="12"/></g><g font-size="17"><text x="55" y="117">EXAMPLE GRADIENTS</text><text x="55" y="161" font-size="27">(2, 6)    (4, 2)</text><text x="55" y="207">Both evaluated at (3, 2)</text><text x="350" y="117">AVERAGE → SCALE</text><text x="350" y="161" font-size="27">g = (3, 4)</text><text x="350" y="207">Δw = −0.1g = (−0.3, −0.4)</text><text x="640" y="117">NEW PARAMETER</text><text x="640" y="161" font-size="27">w = (2.7, 1.6)</text><text x="640" y="207">Old parameter + Δw</text></g><g font-size="30" fill="#137b68"><text x="293" y="167">→</text><text x="583" y="167">→</text></g><text x="35" y="292" font-size="18">The gradient describes sensitivity. The learning rate sets the step scale.</text><text x="35" y="320" font-size="16" fill="#52685c">All coordinates share η; their individual derivatives still determine their movements.</text></g></svg>
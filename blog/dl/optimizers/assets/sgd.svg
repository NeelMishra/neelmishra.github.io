<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img" aria-labelledby="title desc"><title id="title">One SGD update</title><desc id="desc">Average example gradients at w_{t-1}, multiply by the negative learning rate -eta_t, then add the displacement to form w_t.</desc><rect width="900" height="350" rx="18" fill="#f4f7f2"/><g font-family="system-ui,sans-serif" fill="#173d35"><text x="35" y="45" font-size="24" font-weight="700">One mini-batch. One average gradient. One step.</text><g fill="#fff" stroke="#b9cfc3"><rect x="35" y="85" width="250" height="155" rx="12"/><rect x="325" y="85" width="250" height="155" rx="12"/><rect x="615" y="85" width="250" height="155" rx="12"/></g><g font-size="16"><text x="55" y="117" font-weight="700" fill="#137b68">1. BATCH GRADIENTS</text><text x="55" y="162" font-size="22" font-weight="700">g_t = (1/B) ∑ ∇ℓ_i(w_{t−1})</text><text x="55" y="205" fill="#52685c">Evaluated at current w_{t−1}</text><text x="345" y="117" font-weight="700" fill="#b66929">2. DISPLACEMENT</text><text x="345" y="162" font-size="24" font-weight="700">Δw_t = −η_t g_t</text><text x="345" y="205" fill="#52685c">Scale by −η_t along −g_t</text><text x="635" y="117" font-weight="700" fill="#173d35">3. NEW PARAMETER</text><text x="635" y="162" font-size="24" font-weight="700">w_t = w_{t−1} + Δw_t</text><text x="635" y="205" fill="#52685c">w_t = w_{t−1} − η_t g_t</text></g><g font-size="30" fill="#137b68"><text x="296" y="167">→</text><text x="586" y="167">→</text></g><text x="35" y="292" font-size="18">The batch gradient supplies the direction; the learning rate η_t sets the step scale.</text><text x="35" y="320" font-size="16" fill="#52685c">All coordinates share η_t, while their partial derivatives determine their relative movements.</text></g></svg>
25,245.75 L298.66,243.53 L297.00,241.34 L295.29,239.17 L293.51,237.02 L291.67,234.90 L289.77,232.81 L287.82,230.75 L285.80,228.71 L283.72,226.71 L281.59,224.73 L279.40,222.79 L277.16,220.87 L274.86,218.99 L272.51,217.14 L270.10,215.33 L267.65,213.55 L265.14,211.81 L262.58,210.10 L259.98,208.44 L257.33,206.80 L254.63,205.21 L251.88,203.66 L249.10,202.14 L246.26,200.67 L243.39,199.24 L240.48,197.84 L237.53,196.49 L234.54,195.19 L231.51,193.92 L228.45,192.70 L225.35,191.53 L222.22,190.40 L219.06,189.31 L215.86,188.27 L212.64,187.28 L209.39,186.33 L206.12,185.43 L202.81,184.58 L199.49,183.77 L196.14,183.01 L192.77,182.30 L189.38,181.64 L185.98,181.03 L182.55,180.46 L179.11,179.95 L175.66,179.48 L172.20,179.07 L168.72,178.70 L165.23,178.39 L161.74,178.12 L158.23,177.91 L154.73,177.74 L151.21,177.63 L147.70,177.56 L144.19,177.55 L140.67,177.59 L137.16,177.68 L133.65,177.81 L130.14,178.00 L126.64,178.24 L123.15,178.53 L119.67,178.87 L116.20,179.26 L112.74,179.69 L109.29,180.18 L105.86,180.72 L102.44,181.31 L99.04,181.94 L95.66,182.62 L92.30,183.36" fill="none" stroke="#137b68" stroke-width="2.6"/><text x="325" y="315" font-size="12" fill="#137b68" font-weight="600">Contour L = 8.5</text><line x1="145" y1="300" x2="271" y2="216" stroke="#8fa69b" stroke-width="1.8" stroke-dasharray="5,5"/><text x="152" y="252" font-size="12" fill="#52685c">Ray to w* = (0, 0)</text><line x1="347" y1="273" x2="195" y2="159" stroke="#173d35" stroke-width="2.2" stroke-dasharray="6,4" marker-end="url(#arr-tan)"/><text x="82" y="148" font-size="13" font-weight="600">Tangent v = (−4, 3)</text><text x="82" y="165" font-size="12" fill="#52685c">dL/ds = ∇Lᵀv = 0</text><polyline points="259.8,207.6 268.2,196.4 279.4,204.8" fill="none" stroke="#173d35" stroke-width="1.8"/><polyline points="259.8,207.6 251.4,218.8 262.6,227.2" fill="none" stroke="#137b68" stroke-width="1.6"/><text x="275" y="195" font-size="12" font-weight="700">90°</text><line x1="271" y1="216" x2="319" y2="152" stroke="#b66929" stroke-width="3" marker-end="url(#arr-up)"/><text x="325" y="146" font-size="13" font-weight="700" fill="#b66929">∇L(w₀) = (3, 4)</text><text x="325" y="163" font-size="12" fill="#b66929">Steepest ascent (⊥ tangent)</text><line x1="271" y1="216" x2="226" y2="276" stroke="#137b68" stroke-width="3" marker-end="url(#arr-down)"/><text x="234" y="286" font-size="13" font-weight="700" fill="#137b68">−∇L(w₀) = (−3, −4)</text><text x="234" y="302" font-size="12" fill="#137b68">Steepest descent (⊥ tangent)</text><circle cx="145" cy="300" r="4.5" fill="#173d35"/><text x="102" y="320" font-size="13" font-weight="600">w* = (0, 0)</text><circle cx="271" cy="216" r="5" fill="#b66929"/><text x="282" y="224" font-size="13" font-weight="700">w₀ = (3, 2)</text><rect x="520" y="60" width="348" height="305" rx="12" fill="#ffffff" stroke="#b9cfc3"/><text x="540" y="88" font-size="15" font-weight="700">INNER PRODUCT AT w₀ = (3, 2)</text><rect x="540" y="102" width="308" height="64" rx="8" fill="#f4f7f2"/><text x="552" y="124" font-size="14" font-weight="700">1. Along the tangent (θ = 90°)</text><text x="552" y="144" font-size="14">∇L(w₀)ᵀv = 3(−4) + 4(3) = 0</text><text x="552" y="160" font-size="12" fill="#52685c">Moving along the contour keeps loss constant to 1st order.</text><rect x="540" y="176" width="308" height="64" rx="8" fill="#f4f7f2"/><text x="552" y="198" font-size="14" font-weight="700" fill="#b66929">2. Along +∇L(w₀) (θ = 0°)</text><text x="552" y="218" font-size="14">∇L(w₀)ᵀ∇L(w₀) = 3² + 4² = 25 &gt; 0</text><text x="552" y="234" font-size="12" fill="#52685c">Crosses contours orthogonally in the uphill direction.</text><rect x="540" y="250" width="308" height="64" rx="8" fill="#f4f7f2"/><text x="552" y="272" font-size="14" font-weight="700" fill="#137b68">3. Along −∇L(w₀) (θ = 180°)</text><text x="552" y="292" font-size="14">∇L(w₀)ᵀ(−∇L(w₀)) = −25 &lt; 0</text><text x="552" y="308" font-size="12" fill="#52685c">Crosses contours orthogonally in the downhill direction.</text><text x="540" y="338" font-size="13" fill="#173d35" font-weight="600">Why −∇L misses w* on elongated contours:</text><text x="540" y="355" font-size="12" fill="#52685c">The normal to an ellipse’s tangent tilts toward the steeper axis.</text><text x="32" y="395" font-size="16" fill="#52685c">For any unit step u at angle θ to ∇L(w₀), the directional derivative is ∇L(w₀)ᵀu = ‖∇L(w₀)‖ cos θ: zero at 90°, maximal at 0°, most negative at 180°.</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc"><title id="title">Gradient vector is perpendicular to the contour tangent vector</title><desc id="desc">At w0 = (3, 2) on the contour 0.5 w1^2 + w2^2 = 8.5, Vector 1 is the gradient nabla L(w0) = (3, 4) and Vector 2 is the contour tangent t = (-4, 3). Their dot product is 3(-4) + 4(3) = 0, so the angle between them is 90 degrees.</desc><defs><marker id="arr-up" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#b66929"/></marker><marker id="arr-down" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#137b68"/></marker><marker id="arr-tan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#173d35"/></marker></defs><rect width="900" height="360" rx="18" fill="#f4f7f2"/><g font-family="system-ui,sans-serif" fill="#173d35"><text x="35" y="45" font-size="24" font-weight="700">Why the gradient vector is 90° to the tangent vector</text><rect x="35" y="70" width="430" height="255" rx="12" fill="#fff" stroke="#b9cfc3"/><path d="M323.30,293.95 L322.89,291.68 L322.42,289.43 L321.90,287.18 L321.32,284.94 L320.69,282.70 L320.01,280.47 L319.27,278.25 L318.48,276.04 L317.64,273.84 L316.74,271.65 L315.80,269.47 L314.79,267.30 L313.74,265.15 L312.64,263.01 L311.48,260.88 L310.28,258.76 L309.02,256.66 L307.71,254.58 L306.35,252.51 L304.95,250.46 L303.49,248.43 L301.99,246.41 L300.43,244.41 L298.83,242.43 L297.19,240.47 L295.49,238.53 L293.75,236.62 L291.96,234.72 L290.13,232.84 L288.25,230.99 L286.33,229.16 L284.37,227.35 L282.36,225.57 L280.31,223.81 L278.21,222.07 L276.08,220.37 L273.90,218.68 L271.69,217.03 L269.43,215.40 L267.14,213.79 L264.81,212.22 L262.44,210.67 L260.03,209.16 L257.59,207.67 L255.11,206.21 L252.60,204.78 L250.05,203.38 L247.47,202.01 L244.86,200.68 L242.22,199.37 L239.54,198.10 L236.84,196.86 L234.10,195.65 L231.34,194.48 L228.55,193.34 L225.73,192.23 L222.88,191.15 L220.01,190.12 L217.12,189.11 L214.20,188.14 L211.26,187.21 L208.30,186.31 L205.31,185.44 L202.31,184.62 L199.29,183.83 L196.24,183.07 L193.18,182.35 L190.11,181.67 L187.01,181.03 L183.90,180.42 L180.78,179.85 L177.65,179.32 L174.50,178.83 L171.34,178.37 L168.17,177.96 L164.99,177.58 L161.80,177.23 L158.61,176.93 L155.41,176.67 L152.20,176.44" fill="none" stroke="#8fa69b" stroke-width="3"/><text x="305" y="295" font-size="14" fill="#52685c">Contour: ½w₁² + w₂² = 8.5</text><line x1="353" y1="278" x2="193" y2="158" stroke="#173d35" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arr-tan)"/><text x="62" y="146" font-size="16" font-weight="700">Tangent vector t = (−4, 3)</text><text x="62" y="168" font-size="14" fill="#52685c">Along contour (ΔL = 0)</text><polyline points="260.2,208.4 269.8,195.6 282.6,205.2" fill="none" stroke="#173d35" stroke-width="2"/><text x="278" y="193" font-size="14" font-weight="700">θ = 90°</text><line x1="273" y1="218" x2="327" y2="146" stroke="#b66929" stroke-width="3.5" marker-end="url(#arr-up)"/><text x="333" y="144" font-size="16" font-weight="700" fill="#b66929">∇L(w₀) = (3, 4)</text><text x="333" y="164" font-size="14" fill="#b66929">Gradient vector</text><line x1="273" y1="218" x2="219" y2="290" stroke="#137b68" stroke-width="3.5" marker-end="url(#arr-down)"/><text x="95" y="295" font-size="16" font-weight="700" fill="#137b68">−∇L(w₀) = (−3, −4)</text><text x="95" y="314" font-size="14" fill="#137b68">SGD step direction</text><circle cx="273" cy="218" r="5.5" fill="#b66929"/><text x="285" y="226" font-size="15" font-weight="700">w₀ = (3, 2)</text><rect x="490" y="70" width="375" height="255" rx="12" fill="#fff" stroke="#b9cfc3"/><text x="515" y="108" font-size="16" font-weight="700">The two vectors at w₀ = (3, 2):</text><text x="515" y="136" font-size="16" fill="#b66929" font-weight="600">• Gradient vector: ∇L(w₀) = (3, 4)</text><text x="515" y="162" font-size="16" fill="#173d35" font-weight="600">• Tangent vector: t = (−4, 3)</text><text x="515" y="205" font-size="16" font-weight="700">Dot product = 0 along the contour:</text><text x="515" y="233" font-size="17">∇L(w₀)ᵀ t = ‖∇L(w₀)‖ ‖t‖ cos θ = 0</text><text x="515" y="274" font-size="16" font-weight="700">Therefore cos θ = 0  ⇒  θ = 90°:</text><text x="515" y="300" font-size="16" fill="#52685c">3(−4) + 4(3) = 0, so ∇L(w₀) ⊥ t.</text></g></svg>

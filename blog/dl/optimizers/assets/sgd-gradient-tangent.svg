<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">The gradient is perpendicular to the contour tangent</title><desc id="desc">At w0 = (3, 2) on the elliptical contour 0.5 w1^2 + w2^2 = 8.5, the tangent vector v = (-4, 3) has zero dot product with the gradient (3, 4). The gradient points uphill at 90 degrees to the tangent, and the negative gradient points downhill at 90 degrees to the tangent rather than straight toward the minimum (0, 0).</desc><defs><marker id="arr-up" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#b66929"/></marker><marker id="arr-down" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#137b68"/></marker><marker id="arr-tan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#173d35"/></marker></defs><rect width="900" height="420" rx="16" fill="#f4f7f2"/><g font-family="system-ui,sans-serif" fill="#173d35"><text x="32" y="40" font-size="23" font-weight="700">The gradient is perpendicular to the contour tangent</text><rect x="32" y="60" width="470" height="305" rx="12" fill="#ffffff" stroke="#b9cfc3"/><text x="50" y="88" font-size="15" font-weight="700">LEVEL CURVES OF L(w₁, w₂) = ½w₁² + w₂²   (1:1 AXES)</text><line x1="65" y1="300" x2="465" y2="300" stroke="#cbd9d1" stroke-width="1.5"/><line x1="145" y1="105" x2="145" y2="345" stroke="#cbd9d1" stroke-width="1.5"/><text x="452" y="318" font-size="13" fill="#52685c">w₁</text><text x="125" y="116" font-size="13" fill="#52685c">w₂</text><path d="M213.34,317.64 L214.15,315.97 L214.88,314.29 L215.54,312.58 L216.10,310.87 L216.59,309.14 L216.99,307.40 L217.31,305.65 L217.54,303.89 L217.68,302.13 L217.74,300.37 L217.72,298.60 L217.61,296.84 L217.41,295.08 L217.13,293.33 L216.77,291.59 L216.32,289.85 L215.78,288.13 L215.1
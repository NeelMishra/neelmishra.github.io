<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" role="img" aria-labelledby="title desc">
  <title id="title">Classical cubic vs. Muon quintic Newton–Schulz polynomials</title>
  <desc id="desc">Left panel plots the scalar polynomials phi_cubic(s) = 1.5s - 0.5s^3 and phi_quintic(s) = 3.4445s - 4.7750s^3 + 2.0315s^5 on [0, 1.2]. Right panel compares 5 iterations starting from a small singular value s_0 = 0.05, showing Muon's quintic reaching ~1 in 3-5 steps while the cubic only reaches 0.366.</desc>

  <rect width="900" height="410" rx="18" fill="#f4f7f2"/>

  <g font-family="system-ui,sans-serif" fill="#173d35">
    <text x="35" y="40" font-size="22" font-weight="700">How Newton–Schulz Polynomials Push Singular Values Toward 1</text>

    <!-- LEFT PANEL: Scalar Map phi(s) -->
    <rect x="35" y="60" width="435" height="325" rx="12" fill="#fff" stroke="#b9cfc3" stroke-width="1.5"/>
    <text x="55" y="88" font-size="16" font-weight="700">1. One-Step Scalar Map s ↦ φ(s)</text>

    <!-- Plot area: x in [0, 1.2] -> [80, 440] (scale 300 px/unit), y in [0, 1.4] -> [330, 120] (scale 150 px/unit) -->
    <!-- Shaded target band [0.7, 1.2] -> y in [225, 150] -->
    <rect x="80" y="150" width="360" height="75" fill="#eef5f1"/>
    <text x="86" y="164" font-size="11.5" fill="#52685c">Target band [0.7, 1.2]</text>

    <!-- Grid lines -->
    <line x1="80" y1="330" x2="440" y2="330" stroke="#c3d6cc" stroke-width="1.5"/>
    <line x1="80" y1="255" x2="440" y2="255" stroke="#dce7e1" stroke-width="1"/>
    <line x1="80" y1="180" x2="440" y2="180" stroke="#9ab5a7" stroke-width="1.5" stroke-dasharray="4,3"/>
    <line x1="380" y1="120" x2="380" y2="330" stroke="#dce7e1" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="80" y1="120" x2="80" y2="330" stroke="#c3d6cc" stroke-width="1.5"/>

    <!-- Axis labels -->
    <text x="54" y="334" font-size="12" fill="#52685c">0.0</text>
    <text x="54" y="259" font-size="12" fill="#52685c">0.5</text>
    <text x="54" y="184" font-size="12" font-weight="700">1.0</text>
    <text x="75" y="348" font-size="12" fill="#52685c">0</text>
    <text x="222" y="348" font-size="12" fill="#52685c">0.5</text>
    <text x="372" y="348" font-size="12" font-weight="700">1.0</text>
    <text x="200" y="370" font-size="13" font-weight="600" fill="#52685c">Input singular value s</text>

    <!-- Diagonal y = s: (0,0)->(80,330) to (1.2,1.2)->(440,150) -->
    <line x1="80" y1="330" x2="440" y2="150" stroke="#8fa69b" stroke-width="2" stroke-dasharray="5,4"/>
    <text x="400" y="144" font-size="12" fill="#52685c">φ(s) = s</text>

    <!-- Cubic curve: phi(s) = 1.5 s - 0.5 s^3 -->
    <polyline points="80.0,330.0 98.0,316.5 116.0,303.1 134.0,289.9 152.0,277.0 170.0,264.5 188.0,252.5 206.0,241.1 224.0,230.4 242.0,220.4 260.0,211.2 278.0,202.9 296.0,195.6 314.0,189.4 332.0,184.4 350.0,180.7 368.0,178.3 380.0,180.0 398.0,180.8 416.0,183.1 434.0,186.9" fill="none" stroke="#137b68" stroke-width="3"/>

    <!-- Muon Quintic curve: phi(s) = 3.4445 s - 4.7750 s^3 + 2.0315 s^5 -->
    <polyline points="80.0,330.0 98.0,299.2 116.0,269.2 134.0,240.9 152.0,215.2 170.0,192.9 188.0,174.6 206.0,160.8 224.0,151.6 242.0,147.1 260.0,146.9 278.0,150.6 296.0,157.5 314.0,166.7 332.0,177.2 350.0,187.6 368.0,196.4 380.0,224.8 398.0,225.7 416.0,220.1 434.0,204.2" fill="none" stroke="#b66929" stroke-width="3"/>

    <!-- Key points on s = 1 (x = 380) -->
    <circle cx="380" cy="180" r="4.5" fill="#137b68"/>
    <circle cx="380" cy="224.8" r="4.5" fill="#b66929"/>
    <text x="310" y="242" font-size="12" font-weight="700" fill="#b66929">φ(1) = 0.701</text>

    <!-- Legend annotations inside Left Panel -->
    <text x="95" y="135" font-size="13" font-weight="700" fill="#b66929">Quintic (slope 3.44 at 0)</text>
    <text x="245" y="275" font-size="13" font-weight="700" fill="#137b68">Cubic (slope 1.5 at 0)</text>

    <!-- RIGHT PANEL: 5-Step Evolution from s_0 = 0.05 -->
    <rect x="490" y="60" width="375" height="325" rx="12" fill="#fff" stroke="#b9cfc3" stroke-width="1.5"/>
    <text x="510" y="88" font-size="16" font-weight="700">2. Five Steps Starting from s₀ = 0.05</text>
    <text x="510" y="110" font-size="13" fill="#52685c">Why a 5-step budget needs a steep initial slope:</text>

    <!-- Table header -->
    <text x="515" y="140" font-size="13.5" font-weight="700">Step k</text>
    <text x="595" y="140" font-size="13.5" font-weight="700" fill="#137b68">Cubic (1.5s − 0.5s³)</text>
    <text x="740" y="140" font-size="13.5" font-weight="700" fill="#b66929">Muon Quintic</text>
    <line x1="510" y1="148" x2="845" y2="148" stroke="#c3d6cc" stroke-width="1.5"/>

    <!-- Rows k = 0..5 -->
    <text x="525" y="172" font-size="14">k = 0</text>
    <text x="615" y="172" font-size="14" fill="#137b68">0.050</text>
    <text x="755" y="172" font-size="14" fill="#b66929">0.050</text>

    <text x="525" y="198" font-size="14">k = 1</text>
    <text x="615" y="198" font-size="14" fill="#137b68">0.075</text>
    <text x="755" y="198" font-size="14" fill="#b66929" font-weight="600">0.172  (×3.43)</text>

    <text x="525" y="224" font-size="14">k = 2</text>
    <text x="615" y="224" font-size="14" fill="#137b68">0.112</text>
    <text x="755" y="224" font-size="14" fill="#b66929" font-weight="600">0.567</text>

    <text x="525" y="250" font-size="14">k = 3</text>
    <text x="615" y="250" font-size="14" fill="#137b68">0.168</text>
    <text x="755" y="250" font-size="14" fill="#b66929" font-weight="700">1.151  (near 1)</text>

    <text x="525" y="276" font-size="14">k = 4</text>
    <text x="615" y="276" font-size="14" fill="#137b68">0.249</text>
    <text x="755" y="276" font-size="14" fill="#b66929" font-weight="700">0.675</text>

    <text x="525" y="302" font-size="14" font-weight="700">k = 5</text>
    <text x="615" y="302" font-size="14" font-weight="700" fill="#137b68">0.366 (still small)</text>
    <text x="755" y="302" font-size="14" font-weight="700" fill="#b66929">1.077  (≈ 1)</text>

    <line x1="510" y1="316" x2="845" y2="316" stroke="#c3d6cc" stroke-width="1.5"/>
    <text x="510" y="340" font-size="13" fill="#52685c">• Cubic converges to 1.000 asymptotically, but</text>
    <text x="518" y="358" font-size="13" fill="#52685c">multiplies small s by at most 1.5⁵ ≈ 7.6× in 5 steps.</text>
    <text x="510" y="376" font-size="13" fill="#173d35" font-weight="600">• Quintic boosts small s by up to 3.44⁵ ≈ 484×.</text>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" role="img" aria-labelledby="title desc">
  <title id="title">Classical cubic versus Muon quintic 1D polynomial curves on [0, 1]</title>
  <desc id="desc">Plot of the 1D scalar map phi(s) on [0, 1] comparing the classical cubic 1.5s - 0.5s^3 against Muon's quintic 3.4445s - 4.7750s^3 + 2.0315s^5, with a shaded target band [0.7, 1.2].</desc>

  <rect width="800" height="350" rx="16" fill="#f4f7f2"/>
  <rect x="20" y="16" width="760" height="318" rx="12" fill="#fff" stroke="#b9cfc3" stroke-width="1.5"/>

  <g font-family="system-ui,sans-serif" fill="#173d35">
    <!-- Header and Legend (completely above plot area y >= 105) -->
    <text x="45" y="46" font-size="17" font-weight="700">1D Scalar Polynomials Applied to Each Singular Value:  s ↦ φ(s)</text>

    <line x1="45" y1="71" x2="73" y2="71" stroke="#b66929" stroke-width="3"/>
    <text x="81" y="75" font-size="12.5" font-weight="700" fill="#b66929">Muon Quintic (3.4445s − 4.7750s³ + 2.0315s⁵)</text>

    <line x1="395" y1="71" x2="423" y2="71" stroke="#137b68" stroke-width="3"/>
    <text x="431" y="75" font-size="12.5" font-weight="700" fill="#137b68">Classical Cubic (1.5s − 0.5s³)</text>

    <line x1="635" y1="71" x2="663" y2="71" stroke="#8fa69b" stroke-width="2" stroke-dasharray="5,4"/>
    <text x="671" y="75" font-size="12.5" fill="#52685c">Identity φ(s) = s</text>

    <!-- Plot area: x in [0, 1] -> [90, 650] (560 px/unit), y in [0, 1.25] -> [280, 105] (140 px/unit) -->
    <!-- Shaded target band [0.7, 1.2] -> y in [182, 112] -->
    <rect x="90" y="112" width="560" height="70" fill="#eaf4ef"/>

    <!-- Horizontal grid lines -->
    <line x1="90" y1="280" x2="650" y2="280" stroke="#c3d6cc" stroke-width="1.5"/>
    <line x1="90" y1="210" x2="650" y2="210" stroke="#dce7e1" stroke-width="1"/>
    <line x1="90" y1="182" x2="650" y2="182" stroke="#c3d6cc" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="90" y1="140" x2="650" y2="140" stroke="#137b68" stroke-width="1.5" stroke-dasharray="4,3"/>
    <line x1="90" y1="112" x2="650" y2="112" stroke="#c3d6cc" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Vertical grid lines -->
    <line x1="90" y1="105" x2="90" y2="280" stroke="#c3d6cc" stroke-width="1.5"/>
    <line x1="230" y1="105" x2="230" y2="280" stroke="#edf2ef" stroke-width="1"/>
    <line x1="370" y1="105" x2="370" y2="280" stroke="#edf2ef" stroke-width="1"/>
    <line x1="510" y1="105" x2="510" y2="280" stroke="#edf2ef" stroke-width="1"/>
    <line x1="650" y1="105" x2="650" y2="280" stroke="#c3d6cc" stroke-width="1.5"/>

    <!-- Y-axis labels (left margin x <= 80) -->
    <text x="80" y="284" text-anchor="end" font-size="12" fill="#52685c">0.0</text>
    <text x="80" y="214" text-anchor="end" font-size="12" fill="#52685c">0.5</text>
    <text x="80" y="186" text-anchor="end" font-size="12" fill="#52685c">0.7</text>
    <text x="80" y="144" text-anchor="end" font-size="12" font-weight="700" fill="#137b68">1.0</text>
    <text x="80" y="116" text-anchor="end" font-size="12" fill="#52685c">1.2</text>

    <!-- X-axis labels (bottom margin y >= 298) -->
    <text x="90" y="300" text-anchor="middle" font-size="12" fill="#52685c">0.0</text>
    <text x="230" y="300" text-anchor="middle" font-size="12" fill="#52685c">0.25</text>
    <text x="370" y="300" text-anchor="middle" font-size="12" fill="#52685c">0.50</text>
    <text x="510" y="300" text-anchor="middle" font-size="12" fill="#52685c">0.75</text>
    <text x="650" y="300" text-anchor="middle" font-size="12" font-weight="700">1.0</text>
    <text x="370" y="322" text-anchor="middle" font-size="13" font-weight="600" fill="#52685c">Input singular value s ∈ [0, 1]</text>

    <!-- Identity diagonal y = s -->
    <line x1="90" y1="280" x2="650" y2="140" stroke="#8fa69b" stroke-width="2" stroke-dasharray="5,4"/>

    <!-- Classical Cubic curve: phi(s) = 1.5s - 0.5s^3 -->
    <polyline points="90.0,280.0 118.0,269.5 146.0,259.1 174.0,248.7 202.0,238.6 230.0,228.6 258.0,218.9 286.0,209.5 314.0,200.5 342.0,191.9 370.0,183.8 398.0,176.2 426.0,169.1 454.0,162.7 482.0,157.0 510.0,152.0 538.0,147.8 566.0,144.5 594.0,142.0 622.0,140.5 650.0,140.0" fill="none" stroke="#137b68" stroke-width="3"/>

    <!-- Muon Quintic curve: phi(s) = 3.4445s - 4.7750s^3 + 2.0315s^5 -->
    <polyline points="90.0,280.0 118.0,256.0 146.0,232.4 174.0,209.9 202.0,189.2 230.0,170.8 258.0,155.3 286.0,143.1 314.0,134.5 342.0,129.6 370.0,128.4 398.0,130.6 426.0,135.7 454.0,143.1 482.0,152.0 510.0,161.4 538.0,170.1 566.0,177.1 594.0,181.5 622.0,182.9 650.0,181.9" fill="none" stroke="#b66929" stroke-width="3"/>

    <!-- Endpoint markers at s = 1.0 (x = 650) -->
    <circle cx="650" cy="140" r="4.5" fill="#137b68"/>
    <circle cx="650" cy="181.9" r="4.5" fill="#b66929"/>

    <!-- Right-margin annotations (x >= 662, outside the plot grid) -->
    <text x="662" y="136" font-size="12" font-weight="700" fill="#137b68">φ(1) = 1.000</text>
    <text x="662" y="156" font-size="11.5" fill="#52685c">Target band</text>
    <text x="662" y="171" font-size="11.5" fill="#52685c">[0.7, 1.2]</text>
    <text x="662" y="192" font-size="12" font-weight="700" fill="#b66929">φ(1) = 0.701</text>
  </g>
</svg>
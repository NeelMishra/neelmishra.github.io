<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">How Newton–Schulz polynomials push singular values toward 1 via matrix multiplications</title>
  <desc id="desc">Left panel plots the 1D scalar polynomials phi_cubic(s) = 1.5s - 0.5s^3 and Muon's phi_quintic(s) = 3.4445s - 4.7750s^3 + 2.0315s^5 on [0, 1.2], showing the steep 3.44x slope near zero that lifts small singular values into the [0.7, 1.2] target band. Right panel illustrates why odd matrix products X X^T X cancel internal orthogonal factors to raise singular values to odd powers and compress the entire singular value spectrum toward 1 in 5 steps.</desc>
  <defs>
    <marker id="ns-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#b66929"/>
    </marker>
    <marker id="ns-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#137b68"/>
    </marker>
  </defs>

  <rect width="900" height="420" rx="18" fill="#f4f7f2"/>

  <g font-family="system-ui,sans-serif" fill="#173d35">
    <text x="35" y="38" font-size="20.5" font-weight="700">How Newton–Schulz Pushes Every Singular Value to 1 Without an SVD</text>

    <!-- LEFT PANEL: Scalar Map phi(s) -->
    <rect x="35" y="56" width="425" height="340" rx="12" fill="#fff" stroke="#b9cfc3" stroke-width="1.5"/>
    <text x="55" y="84" font-size="15.5" font-weight="700">1. The 1D Curve Applied to Each Singular Value</text>
    <text x="55" y="103" font-size="12.5" fill="#52685c">Each step maps every singular value s ↦ φ(s) at once</text>

    <!-- Plot area: x in [0, 1.15] -> [80, 425] (scale 300 px/unit), y in [0, 1.35] -> [335, 132.5] (scale 150 px/unit) -->
    <!-- Shaded target band [0.7, 1.2] -> y in [230, 155] -->
    <rect x="80" y="155" width="345" height="75" fill="#eaf4ef"/>
    <text x="88" y="170" font-size="11.5" font-weight="600" fill="#137b68">Target band around 1.0  ([0.7, 1.2])</text>

    <!-- Grid lines -->
    <line x1="80" y1="335" x2="425" y2="335" stroke="#c3d6cc" stroke-width="1.5"/>
    <line x1="80" y1="260" x2="425" y2="260" stroke="#dce7e1" stroke-width="1"/>
    <line x1="80" y1="185" x2="425" y2="185" stroke="#137b68" stroke-width="1.5" stroke-dasharray="4,3"/>
    <line x1="380" y1="130" x2="380" y2="335" stroke="#dce7e1" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="80" y1="130" x2="80" y2="335" stroke="#c3d6cc" stroke-width="1.5"/>

    <!-- Axis labels -->
    <text x="52" y="339" font-size="12" fill="#52685c">0.0</text>
    <text x="52" y="264" font-size="12" fill="#52685c">0.5</text>
    <text x="52" y="189" font-size="12" font-weight="700" fill="#137b68">1.0</text>
    <text x="76" y="353" font-size="12" fill="#52685c">0</text>
    <text x="222" y="353" font-size="12" fill="#52685c">0.5</text>
    <text x="372" y="353" font-size="12" font-weight="700">1.0</text>
    <text x="180" y="376" font-size="12.5" font-weight="600" fill="#52685c">Input singular value s ∈ [0, 1]</text>

    <!-- Diagonal y = s: (0,0)->(80,335) to (1.15,1.15)->(425,162.5) -->
    <line x1="80" y1="335" x2="425" y2="162.5" stroke="#8fa69b" stroke-width="1.8" stroke-dasharray="5,4"/>
    <text x="392" y="152" font-size="11.5" fill="#52685c">φ(s) = s</text>

    <!-- Cubic curve: phi(s) = 1.5 s - 0.5 s^3 (shifted down by +5px for y0=335) -->
    <polyline points="80.0,335.0 98.0,321.5 116.0,308.1 134.0,294.9 152.0,282.0 170.0,269.5 188.0,257.5 206.0,246.1 224.0,235.4 242.0,225.4 260.0,216.2 278.0,207.9 296.0,200.6 314.0,194.4 332.0,189.4 350.0,185.7 368.0,183.3 380.0,185.0 398.0,185.8 416.0,188.1" fill="none" stroke="#137b68" stroke-width="3"/>

    <!-- Muon Quintic curve: phi(s) = 3.4445 s - 4.7750 s^3 + 2.0315 s^5 -->
    <polyline points="80.0,335.0 98.0,304.2 116.0,274.2 134.0,245.9 152.0,220.2 170.0,197.9 188.0,179.6 206.0,165.8 224.0,156.6 242.0,152.1 260.0,151.9 278.0,155.6 296.0,162.5 314.0,171.7 332.0,182.2 350.0,192.6 368.0,201.4 380.0,229.8 398.0,230.7 416.0,225.1" fill="none" stroke="#b66929" stroke-width="3"/>

    <!-- Key points -->
    <circle cx="380" cy="185" r="4.5" fill="#137b68"/>
    <circle cx="380" cy="229.8" r="4.5" fill="#b66929"/>

    <!-- Curve labels -->
    <text x="102" y="144" font-size="12.5" font-weight="700" fill="#b66929">Muon Quintic (3.44× slope near 0)</text>
    <text x="236" y="280" font-size="12.5" font-weight="700" fill="#137b68">Classical Cubic (1.5× slope)</text>

    <!-- RIGHT PANEL: Domino Cancellation & Spectrum Compression -->
    <rect x="478" y="56" width="387" height="340" rx="12" fill="#fff" stroke="#b9cfc3" stroke-width="1.5"/>
    <text x="498" y="84" font-size="15.5" font-weight="700">2. Why Matrix Products Act on Singular Values</text>
    <text x="498" y="103" font-size="12.5" fill="#52685c">Orthogonal factors cancel inside odd products (VᵀV = I, UᵀU = I):</text>

    <!-- Domino cancellation visual box -->
    <rect x="498" y="114" width="347" height="78" rx="9" fill="#f7faf8" stroke="#c3d6cc"/>
    <text x="512" y="138" font-size="13" font-weight="700" fill="#173d35">(X Xᵀ) X  =  (U Σ Vᵀ)(V Σ Uᵀ)(U Σ Vᵀ)</text>
    <path d="M625,144 Q641,158 657,144" fill="none" stroke="#137b68" stroke-width="2"/>
    <text x="625" y="166" font-size="11" font-weight="700" fill="#137b68">= I</text>
    <path d="M686,144 Q702,158 718,144" fill="none" stroke="#137b68" stroke-width="2"/>
    <text x="686" y="166" font-size="11" font-weight="700" fill="#137b68">= I</text>
    <text x="512" y="182" font-size="13" font-weight="700" fill="#b66929">⇒  U and Vᵀ stay fixed outside; inside is just Σ³ and Σ⁵!</text>

    <!-- Visual spectrum compression across 5 steps -->
    <text x="498" y="216" font-size="14" font-weight="700">How 5 Quintic Steps Equalize the Spectrum:</text>

    <!-- Step 0 -->
    <rect x="498" y="228" width="347" height="46" rx="8" fill="#fbfcfa" stroke="#d8e4dd"/>
    <text x="510" y="246" font-size="12" font-weight="700" fill="#52685c">Step 0 (Normalized X₀ = M / ‖M‖_F)</text>
    <text x="510" y="264" font-size="11.5" fill="#52685c">σ₁ close to 1, but weaker directions σ₂, σ₃ are tiny</text>
    <rect x="745" y="236" width="76" height="7" rx="3" fill="#b66929"/>
    <rect x="745" y="248" width="22" height="7" rx="3" fill="#b66929" opacity="0.75"/>
    <rect x="745" y="260" width="7" height="7" rx="3" fill="#b66929" opacity="0.55"/>

    <!-- Step 2 -->
    <rect x="498" y="282" width="347" height="46" rx="8" fill="#fbfcfa" stroke="#d8e4dd"/>
    <text x="510" y="300" font-size="12" font-weight="700" fill="#b66929">Steps 1–2 (Fast 3.44× Amplification)</text>
    <text x="510" y="318" font-size="11.5" fill="#52685c">Small singular values rapidly triple each iteration</text>
    <rect x="745" y="290" width="72" height="7" rx="3" fill="#b66929"/>
    <rect x="745" y="302" width="58" height="7" rx="3" fill="#b66929" opacity="0.85"/>
    <rect x="745" y="314" width="30" height="7" rx="3" fill="#b66929" opacity="0.7"/>

    <!-- Step 5 -->
    <rect x="498" y="336" width="347" height="48" rx="8" fill="#eef7f3" stroke="#137b68" stroke-width="1.5"/>
    <text x="510" y="355" font-size="12" font-weight="700" fill="#137b68">Step 5 (Output Q ≈ UVᵀ)</text>
    <text x="510" y="373" font-size="11.5" font-weight="600" fill="#173d35">All active directions clustered near 1 (orthogonalized!)</text>
    <rect x="745" y="344" width="74" height="7" rx="3" fill="#137b68"/>
    <rect x="745" y="356" width="78" height="7" rx="3" fill="#137b68"/>
    <rect x="745" y="368" width="71" height="7" rx="3" fill="#137b68"/>
  </g>
</svg>
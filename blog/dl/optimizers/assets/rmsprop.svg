<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" role="img" aria-label="RMSprop normalizes each coordinate by its running root-mean-square gradient"><rect width="900" height="370" rx="16" fill="#f4f7f2"/><g font-family="system-ui,sans-serif" fill="#173d35"><text x="32" y="42" font-size="23" font-weight="700">Step-1 normalization (v₀ = 0, ε ≈ 0)</text><rect x="40" y="85" width="385" height="185" rx="12" fill="white" stroke="#b9cfc3"/><text x="60" y="120" font-size="20" font-weight="700" fill="#137b68">1. Running Second Moment</text><text x="60" y="162" font-size="21">v₁ = (1 − ρ) g₁²</text><text x="60" y="202" font-size="21">√v₁ = √(1 − ρ) |g₁|</text><text x="60" y="242" font-size="16" fill="#52685c">Scales proportionally to |g₁|</text><rect x="475" y="85" width="385" height="185" rx="12" fill="white" stroke="#b9cfc3"/><text x="495" y="120" font-size="20" font-weight="700" fill="#b66929">2. Normalized Step</text><text x="495" y="162" font-size="21">g₁ / √v₁ = sign(g₁) / √(1 − ρ)</text><text x="495" y="202" font-size="21">Δw₁ = −(η / √(1 − ρ)) sign(g₁)</text><text x="495" y="242" font-size="16" fill="#52685c">|g₁| cancels between numerator and denominator</text><text x="40" y="315" font-size="20">For a steady gradient g, v_t = (1 − ρ^t) g² → g², so Δw_t → −η sign(g).</text><text x="40" y="345" font-size="16" fill="#52685c">Each coordinate divides by its own recent root-mean-square magnitude √v_t + ε.</text></g></svg>
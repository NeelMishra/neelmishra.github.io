<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="title desc">
  <title id="title">Lion's two-beta architecture and l-infinity hypercube geometry</title>
  <desc id="desc">Left panel shows how Lion combines m_{t-1} and g_t twice: first with beta_1 = 0.9 to form c_t for the sign step, and second with beta_2 = 0.99 to update the stored momentum m_t. Right panel compares l_2 ball steepest descent against Lion's l_infinity box steepest descent, which steps to a corner (+/- eta, +/- eta).</desc>
  <defs>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#137b68"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#b66929"/>
    </marker>
    <marker id="arr-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#173d35"/>
    </marker>
  </defs>

  <rect width="900" height="400" rx="18" fill="#f4f7f2"/>

  <g font-family="system-ui,sans-serif" fill="#173d35">
    <text x="35" y="40" font-size="22" font-weight="700">Lion: Two Interpolations (β₁, β₂) &amp; Sign-Cube Geometry</text>

    <!-- LEFT PANEL: Two-Beta Pipeline -->
    <rect x="35" y="60" width="465" height="315" rx="12" fill="#fff" stroke="#b9cfc3" stroke-width="1.5"/>
    <text x="55" y="88" font-size="16" font-weight="700">1. Why Lion Uses Two Different Betas (β₁ = 0.9, β₂ = 0.99)</text>

    <!-- Input box -->
    <rect x="55" y="128" width="125" height="115" rx="10" fill="#f4f7f2" stroke="#b9cfc3"/>
    <text x="68" y="156" font-size="13.5" font-weight="700">Inputs at step t</text>
    <text x="68" y="186" font-size="15" font-weight="600" fill="#173d35">• Old mₜ₋₁</text>
    <text x="68" y="216" font-size="15" font-weight="600" fill="#b66929">• Current gₜ</text>

    <!-- Arrows from Input box -->
    <path d="M180,162 L218,142" fill="none" stroke="#137b68" stroke-width="2.5" marker-end="url(#arr-teal)"/>
    <path d="M180,210 L218,238" fill="none" stroke="#b66929" stroke-width="2.5" marker-end="url(#arr-amber)"/>

    <!-- Branch 1: c_t (Step 1) -->
    <rect x="225" y="106" width="255" height="82" rx="10" fill="#fff" stroke="#137b68" stroke-width="2"/>
    <text x="240" y="128" font-size="12.5" font-weight="700" fill="#137b68">STEP 1 · UPDATE DIRECTION (β₁ = 0.9)</text>
    <text x="240" y="153" font-size="16" font-weight="700">cₜ = 0.9 mₜ₋₁ + 0.1 gₜ</text>
    <text x="240" y="175" font-size="13" fill="#137b68" font-weight="600">wₜ = (1 − ηλ)wₜ₋₁ − η sign(cₜ)</text>

    <!-- Branch 2: m_t (Step 2) -->
    <rect x="225" y="206" width="255" height="82" rx="10" fill="#fff" stroke="#b66929" stroke-width="1.5"/>
    <text x="240" y="228" font-size="12.5" font-weight="700" fill="#b66929">STEP 2 · STORED MEMORY (β₂ = 0.99)</text>
    <text x="240" y="253" font-size="16" font-weight="700">mₜ = 0.99 mₜ₋₁ + 0.01 gₜ</text>
    <text x="240" y="275" font-size="13" fill="#52685c">Saved in state (1 scalar / param)</text>

    <text x="55" y="322" font-size="13" fill="#173d35" font-weight="600">Unrolled:  cₜ = 0.1 gₜ + 0.009 (gₜ₋₁ + 0.99 gₜ₋₂ + ···)</text>
    <text x="55" y="344" font-size="12.5" fill="#52685c">β₂ = 0.99 keeps a 100-step memory, while β₁ = 0.9 gives today’s</text>
    <text x="55" y="361" font-size="12.5" fill="#52685c">gradient gₜ a 10× higher weight (0.1 vs. 0.01) so turns happen fast.</text>

    <!-- RIGHT PANEL: L_infinity Hypercube Geometry -->
    <rect x="520" y="60" width="345" height="315" rx="12" fill="#fff" stroke="#b9cfc3" stroke-width="1.5"/>
    <text x="540" y="88" font-size="16" font-weight="700">2. Sign Step = ℓ_∞ Box Corner</text>

    <!-- Coordinate axes centered at (690, 200) -->
    <line x1="565" y1="200" x2="815" y2="200" stroke="#c3d6cc" stroke-width="1.5"/>
    <line x1="690" y1="105" x2="690" y2="295" stroke="#c3d6cc" stroke-width="1.5"/>

    <!-- L_2 circle (radius 64) -->
    <circle cx="690" cy="200" r="64" fill="none" stroke="#8fa69b" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="550" y="135" font-size="12" fill="#52685c">ℓ₂ ball ||Δw||₂ = η</text>

    <!-- L_infinity square [-eta, +eta]^2 (half-side 64 -> x in [626, 754], y in [136, 264]) -->
    <rect x="626" y="136" width="128" height="128" fill="none" stroke="#137b68" stroke-width="2.5"/>
    <text x="735" y="282" font-size="12" font-weight="700" fill="#137b68">ℓ_∞ box ||Δw||_∞ ≤ η</text>

    <!-- Negative mixture vector -c_t pointing shallowly up-right: (690, 200) -> (749, 176) on L2 circle -->
    <line x1="690" y1="200" x2="744" y2="178" stroke="#b66929" stroke-width="2.5" marker-end="url(#arr-amber)"/>
    <text x="758" y="182" font-size="12.5" font-weight="700" fill="#b66929">−η cₜ / ||cₜ||₂</text>

    <!-- Lion step -eta sign(c_t) pointing to corner (754, 136) -->
    <line x1="690" y1="200" x2="749" y2="141" stroke="#137b68" stroke-width="3.2" marker-end="url(#arr-teal)"/>
    <circle cx="754" cy="136" r="5" fill="#137b68"/>
    <text x="702" y="124" font-size="13.5" font-weight="700" fill="#137b68">−η sign(cₜ) = (+η, +η)</text>

    <text x="540" y="322" font-size="13" fill="#173d35" font-weight="600">Every coordinate steps by ±η:</text>
    <text x="540" y="344" font-size="13" fill="#52685c">• In P dimensions, ||Δw||₂ = η√P.</text>
    <text x="540" y="362" font-size="13" fill="#52685c">• Use 3×–10× smaller η than AdamW (and 3×–10× larger λ).</text>
  </g>
</svg>
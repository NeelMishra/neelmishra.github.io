<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-label="Compute the sign mixture before refreshing memory"><rect width="900" height="400" rx="16" fill="#f4f7f2"/><g font-family="system-ui,sans-serif" fill="#173d35"><text x="32" y="42" font-size="23" font-weight="700">Compute the sign mixture before refreshing memory</text><rect x="35" y="115" width="235" height="165" rx="12" fill="white" stroke="#b9cfc3"/><text x="55" y="153" font-size="22">Shared inputs</text><text x="55" y="197" font-size="21">Old memory mₜ₋₁</text><text x="55" y="242" font-size="21">Current gradient gₜ</text><rect x="365" y="80" width="495" height="120" rx="12" fill="white" stroke="#b9cfc3"/><text x="385" y="108" font-size="16">DECIDE TODAY · β₁</text><text x="385" y="146" font-size="24">cₜ = β₁mₜ₋₁ + (1 − β₁)gₜ</text><text x="385" y="179" font-size="16">Use sign(cₜ) for the step</text><rect x="365" y="235" width="495" height="120" rx="12" fill="white" stroke="#b9cfc3"/><text x="385" y="263" font-size="16">REMEMBER FOR LATER · β₂</text><text x="385" y="301" font-size="24">mₜ = β₂mₜ₋₁ + (1 − β₂)gₜ</text><text x="385" y="334" font-size="16">Keep the signed magnitude</text><path d="M270 165L350 140 M270 230L350 280" stroke="#137b68" stroke-width="3" fill="none"/><text x="35" y="385" font-size="19">One persistent buffer. Two distinct uses of the old buffer.</text></g></svg>
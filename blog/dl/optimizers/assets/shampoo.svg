<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-label="Preserve the tensor’s structure when preconditioning"><rect width="900" height="400" rx="16" fill="#f4f7f2"/><g font-family="system-ui,sans-serif" fill="#173d35"><text x="32" y="42" font-size="23" font-weight="700">Preserve the tensor’s structure when preconditioning</text><rect x="35" y="100" width="220" height="150" rx="14" fill="white" stroke="#b9cfc3"/><text x="60" y="156" font-size="37">L⁻¹/⁴</text><text x="60" y="205" font-size="24">2 × 2</text><rect x="325" y="100" width="250" height="150" rx="14" fill="white" stroke="#b9cfc3"/><text x="350" y="156" font-size="37">G</text><text x="350" y="205" font-size="24">2 × 3</text><rect x="645" y="100" width="220" height="150" rx="14" fill="white" stroke="#b9cfc3"/><text x="670" y="156" font-size="37">R⁻¹/⁴</text><text x="670" y="205" font-size="24">3 × 3</text><text x="285" y="181" font-size="32">×</text><text x="605" y="181" font-size="32">×</text><text x="35" y="296" font-size="18">Mix and rescale rows</text><text x="645" y="296" font-size="18">Mix and rescale columns</text><text x="35" y="353" font-size="21">State: 2² + 3² = 13 scalars     Full 6 × 6 history: 36 scalars</text><text x="35" y="381" font-size="16">Counts exclude cached roots and other optimizer state.</text></g></svg>
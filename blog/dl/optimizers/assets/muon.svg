<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" role="img" aria-labelledby="title desc">
  <title id="title">Muon equalizes nonzero singular values while preserving singular directions</title>
  <desc id="desc">Left panel shows a momentum matrix M = U Sigma V^T with singular values (4, 1) stretching a unit circle into an elongated ellipse along u_1 and u_2. Right panel shows its polar factor Q = U V^T with singular values (1, 1), mapping the unit circle to a unit circle along the exact same singular directions.</desc>
  <defs>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#137b68"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#b66929"/>
    </marker>
  </defs>

  <rect width="900" height="410" rx="18" fill="#f4f7f2"/>

  <g font-family="system-ui,sans-serif" fill="#173d35">
    <text x="35" y="40" font-size="22" font-weight="700">How Muon Transforms the Update Matrix: M = UΣVᵀ  →  Q = UVᵀ</text>

    <!-- LEFT PANEL: Raw Momentum Matrix M -->
    <rect x="35" y="60" width="405" height="230" rx="12" fill="#fff" stroke="#b9cfc3" stroke-width="1.5"/>
    <text x="55" y="88" font-size="16" font-weight="700">1. Momentum Matrix M = σ₁u₁v₁ᵀ + σ₂u₂v₂ᵀ</text>
    <text x="55" y="110" font-size="13.5" fill="#52685c">Unequal singular values: σ₁ = 4, σ₂ = 1</text>

    <!-- Reference unit circle centered at (235, 195), r = 36 -->
    <circle cx="235" cy="195" r="36" fill="none" stroke="#c3d6cc" stroke-width="2" stroke-dasharray="4,3"/>

    <!-- Rotated ellipse (rx=135, ry=36, rotated -25 deg around (235, 195)) -->
    <g transform="translate(235,195) rotate(-25)">
      <ellipse cx="0" cy="0" rx="135" ry="36" fill="none" stroke="#b66929" stroke-width="3"/>
      <line x1="0" y1="0" x2="130" y2="0" stroke="#b66929" stroke-width="2.5" marker-end="url(#arr-amber)"/>
      <line x1="0" y1="0" x2="0" y2="-32" stroke="#137b68" stroke-width="2.5" marker-end="url(#arr-teal)"/>
    </g>
    <circle cx="235" cy="195" r="3.5" fill="#173d35"/>
    <text x="322" y="135" font-size="14" font-weight="700" fill="#b66929">σ₁u₁ (4× stretch)</text>
    <text x="155" y="156" font-size="13.5" font-weight="700" fill="#137b68">σ₂u₂ (1×)</text>
    <text x="55" y="274" font-size="13" fill="#52685c">Dominant singular direction σ₁ overwhelms weaker directions.</text>

    <!-- RIGHT PANEL: Orthogonalized Update Q = UV^T -->
    <rect x="460" y="60" width="405" height="230" rx="12" fill="#fff" stroke="#137b68" stroke-width="2"/>
    <text x="480" y="88" font-size="16" font-weight="700" fill="#137b68">2. Polar Factor Q = u₁v₁ᵀ + u₂v₂ᵀ</text>
    <text x="480" y="110" font-size="13.5" fill="#52685c">Equalized singular values: σ₁ = 1, σ₂ = 1</text>

    <!-- Unit circle centered at (660, 195), r = 56 -->
    <g transform="translate(660,195) rotate(-25)">
      <circle cx="0" cy="0" r="56" fill="none" stroke="#137b68" stroke-width="3"/>
      <line x1="0" y1="0" x2="52" y2="0" stroke="#b66929" stroke-width="2.5" marker-end="url(#arr-amber)"/>
      <line x1="0" y1="0" x2="0" y2="-52" stroke="#137b68" stroke-width="2.5" marker-end="url(#arr-teal)"/>
    </g>
    <circle cx="660" cy="195" r="3.5" fill="#173d35"/>
    <text x="716" y="166" font-size="14" font-weight="700" fill="#b66929">1 · u₁ (unit step)</text>
    <text x="562" y="138" font-size="14" font-weight="700" fill="#137b68">1 · u₂ (unit step)</text>
    <text x="480" y="274" font-size="13" fill="#52685c">Same singular vectors (uᵢ, vᵢ), but every active direction gets step 1.</text>

    <!-- BOTTOM PANEL: Steepest Descent Under Three Different Matrix Norms -->
    <rect x="35" y="306" width="830" height="84" rx="12" fill="#fff" stroke="#b9cfc3" stroke-width="1.5"/>
    <text x="55" y="332" font-size="15" font-weight="700">Steepest descent direction argmin ⟨M, D⟩_F under three norm budgets ||D|| ≤ η:</text>
    <text x="55" y="358" font-size="14" fill="#52685c">• Frobenius ||D||_F ≤ η (SGD):  D = −η M / ||M||_F   (keeps σ₁ / σ₂ ratio intact)</text>
    <text x="55" y="378" font-size="14" fill="#b66929" font-weight="600">• Entrywise ||D||_∞ ≤ η (SignSGD / Lion):  D = −η sign(M)   (ignores singular directions)</text>
    <text x="470" y="358" font-size="14" fill="#137b68" font-weight="700">• Spectral ||D||₂ ≤ η (Muon):  D = −η UVᵀ</text>
    <text x="482" y="378" font-size="13.5" fill="#173d35">(equalizes all nonzero singular values to η)</text>
  </g>
</svg>
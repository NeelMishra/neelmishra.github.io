<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">How Muon equalizes singular values while keeping singular directions intact</title>
  <desc id="desc">Three-step visual comparison: (1) Input unit circle with perpendicular axes v_1 and v_2. (2) Raw momentum matrix M = U Sigma V^T stretches the circle into a skewed ellipse where the loud direction sigma_1 dominates and sigma_2 barely moves. (3) Muon's polar update Q = U V^T resets all active singular values to 1, giving every direction an equal unit step.</desc>
  <defs>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#137b68"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#b66929"/>
    </marker>
    <marker id="arr-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#52685c"/>
    </marker>
  </defs>

  <rect width="900" height="430" rx="18" fill="#f4f7f2"/>

  <g font-family="system-ui,sans-serif" fill="#173d35">
    <text x="32" y="38" font-size="20.5" font-weight="700">What Muon Does to a Layer’s Update Matrix:  M = UΣVᵀ  →  Q = UVᵀ</text>

    <!-- PANEL 1: Input Space -->
    <rect x="32" y="56" width="256" height="252" rx="12" fill="#fff" stroke="#b9cfc3" stroke-width="1.5"/>
    <text x="48" y="82" font-size="14.5" font-weight="700">1. Input Directions (V)</text>
    <text x="48" y="101" font-size="12" fill="#52685c">Perpendicular unit vectors v₁, v₂</text>

    <g transform="translate(160,175)">
      <line x1="-80" y1="0" x2="80" y2="0" stroke="#e2ece6" stroke-width="1.5"/>
      <line x1="0" y1="-65" x2="0" y2="65" stroke="#e2ece6" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="52" fill="#f7faf8" stroke="#8fa69b" stroke-width="2" stroke-dasharray="4,3"/>
      <g transform="rotate(15)">
        <line x1="0" y1="0" x2="48" y2="0" stroke="#b66929" stroke-width="2.6" marker-end="url(#arr-amber)"/>
        <line x1="0" y1="0" x2="0" y2="-48" stroke="#137b68" stroke-width="2.6" marker-end="url(#arr-teal)"/>
      </g>
      <circle cx="0" cy="0" r="3.5" fill="#173d35"/>
    </g>
    <text x="206" y="198" font-size="12.5" font-weight="700" fill="#b66929">v₁ (length 1)</text>
    <text x="95" y="132" font-size="12.5" font-weight="700" fill="#137b68">v₂ (length 1)</text>
    <text x="48" y="268" font-size="12" fill="#52685c">All input axes start with equal</text>
    <text x="48" y="285" font-size="12" fill="#52685c">unit length on the circle.</text>

    <!-- Arrow 1 -> 2 -->
    <line x1="292" y1="182" x2="316" y2="182" stroke="#52685c" stroke-width="2" marker-end="url(#arr-flow)"/>

    <!-- PANEL 2: Raw Momentum M -->
    <rect x="322" y="56" width="256" height="252" rx="12" fill="#fff" stroke="#b9cfc3" stroke-width="1.5"/>
    <text x="338" y="82" font-size="14.5" font-weight="700">2. Raw Momentum M = UΣVᵀ</text>
    <text x="338" y="101" font-size="12" fill="#b66929" font-weight="600">Skewed singular values: σ₁ ≫ σ₂</text>

    <g transform="translate(450,168)">
      <circle cx="0" cy="0" r="42" fill="none" stroke="#d5e2db" stroke-width="1.8" stroke-dasharray="4,3"/>
      <g transform="rotate(-22)">
        <ellipse cx="0" cy="0" rx="96" ry="16" fill="#fdf6ef" fill-opacity="0.7" stroke="#b66929" stroke-width="2.5"/>
        <line x1="0" y1="0" x2="91" y2="0" stroke="#b66929" stroke-width="2.6" marker-end="url(#arr-amber)"/>
        <line x1="0" y1="0" x2="0" y2="-14" stroke="#137b68" stroke-width="2.4" marker-end="url(#arr-teal)"/>
      </g>
      <circle cx="0" cy="0" r="3.5" fill="#173d35"/>
    </g>
    <text x="486" y="128" font-size="12.5" font-weight="700" fill="#b66929">σ₁u₁ (huge step)</text>
    <text x="366" y="148" font-size="12.5" font-weight="700" fill="#137b68">σ₂u₂ (tiny)</text>

    <!-- Mini spectrum bars inside Panel 2 -->
    <text x="340" y="250" font-size="11.5" font-weight="700" fill="#52685c">Step size per direction:</text>
    <text x="340" y="269" font-size="11.5" font-weight="700" fill="#b66929">σ₁</text>
    <rect x="362" y="259" width="175" height="11" rx="3" fill="#b66929"/>
    <text x="340" y="287" font-size="11.5" font-weight="700" fill="#137b68">σ₂</text>
    <rect x="362" y="277" width="22" height="11" rx="3" fill="#137b68"/>
    <text x="392" y="287" font-size="11" fill="#52685c">(starved)</text>

    <!-- Arrow 2 -> 3 -->
    <line x1="582" y1="182" x2="606" y2="182" stroke="#137b68" stroke-width="2.2" marker-end="url(#arr-teal)"/>

    <!-- PANEL 3: Muon Polar Update Q -->
    <rect x="612" y="56" width="256" height="252" rx="12" fill="#fff" stroke="#137b68" stroke-width="2.2"/>
    <text x="628" y="82" font-size="14.5" font-weight="700" fill="#137b68">3. Muon Update Q = UVᵀ</text>
    <text x="628" y="101" font-size="12" fill="#137b68" font-weight="600">All active singular values set to 1</text>

    <g transform="translate(740,168)">
      <g transform="rotate(-22)">
        <circle cx="0" cy="0" r="48" fill="#eef7f3" stroke="#137b68" stroke-width="2.8"/>
        <line x1="0" y1="0" x2="44" y2="0" stroke="#b66929" stroke-width="2.6" marker-end="url(#arr-amber)"/>
        <line x1="0" y1="0" x2="0" y2="-44" stroke="#137b68" stroke-width="2.6" marker-end="url(#arr-teal)"/>
      </g>
      <circle cx="0" cy="0" r="3.5" fill="#173d35"/>
    </g>
    <text x="782" y="152" font-size="12.5" font-weight="700" fill="#b66929">1 · u₁</text>
    <text x="665" y="128" font-size="12.5" font-weight="700" fill="#137b68">1 · u₂</text>

    <!-- Mini spectrum bars inside Panel 3 -->
    <text x="630" y="250" font-size="11.5" font-weight="700" fill="#52685c">Step size per direction:</text>
    <text x="630" y="269" font-size="11.5" font-weight="700" fill="#b66929">σ₁ → 1</text>
    <rect x="680" y="259" width="110" height="11" rx="3" fill="#b66929"/>
    <text x="630" y="287" font-size="11.5" font-weight="700" fill="#137b68">σ₂ → 1</text>
    <rect x="680" y="277" width="110" height="11" rx="3" fill="#137b68"/>
    <text x="798" y="287" font-size="11" font-weight="700" fill="#137b68">equal!</text>

    <!-- BOTTOM SUMMARY PANEL -->
    <rect x="32" y="322" width="836" height="88" rx="12" fill="#fff" stroke="#b9cfc3" stroke-width="1.5"/>
    <text x="50" y="346" font-size="14" font-weight="700">How Three Optimizer Families Normalize the Same Momentum Matrix M = ∑ σᵢ uᵢ vᵢᵀ:</text>

    <!-- Card 1: SGD -->
    <rect x="50" y="356" width="256" height="42" rx="7" fill="#fbfcfa" stroke="#d8e4dd"/>
    <text x="62" y="373" font-size="12" font-weight="700" fill="#52685c">Frobenius Norm (SGD / Momentum)</text>
    <text x="62" y="390" font-size="11.5" fill="#52685c">Keeps ratio σ₁ / σ₂ unchanged (skewed)</text>

    <!-- Card 2: Lion -->
    <rect x="322" y="356" width="256" height="42" rx="7" fill="#fbfcfa" stroke="#d8e4dd"/>
    <text x="334" y="373" font-size="12" font-weight="700" fill="#b66929">Entry-wise Sign (SignSGD / Lion)</text>
    <text x="334" y="390" font-size="11.5" fill="#52685c">Sets every entry Mᵢⱼ to ±1 (ignores U, V)</text>

    <!-- Card 3: Muon -->
    <rect x="594" y="356" width="256" height="42" rx="7" fill="#eef7f3" stroke="#137b68" stroke-width="1.5"/>
    <text x="606" y="373" font-size="12" font-weight="700" fill="#137b68">Spectral Norm / Polar (Muon)</text>
    <text x="606" y="390" font-size="11.5" font-weight="600" fill="#173d35">Sets every singular value σᵢ to 1 (keeps U, V)</text>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="title desc">
  <title id="title">Adagrad sparse vs. frequent coordinate scaling and monotonic decay</title>
  <desc id="desc">Left panel compares a sparse coordinate that fires rarely and receives a full step of size eta against a frequent coordinate whose step shrinks as eta / sqrt(t). Right panel plots the monotonically growing sum of squared gradients G_t and the resulting 1/sqrt(t) decay of the effective learning rate.</desc>

  <rect width="900" height="400" rx="18" fill="#f4f7f2"/>

  <g font-family="system-ui,sans-serif" fill="#173d35">
    <text x="35" y="40" font-size="22" font-weight="700">Adagrad: Sparse vs. Frequent Coordinates &amp; Monotonic Decay</text>

    <!-- LEFT PANEL: Sparse vs Frequent Coordinate -->
    <rect x="35" y="60" width="420" height="315" rx="12" fill="#fff" stroke="#b9cfc3" stroke-width="1.5"/>
    <text x="55" y="88" font-size="16" font-weight="700">1. Per-Coordinate Step Size at Step t = 100</text>

    <!-- Sparse Box -->
    <rect x="55" y="106" width="380" height="112" rx="10" fill="#fff" stroke="#137b68" stroke-width="2"/>
    <text x="72" y="130" font-size="13.5" font-weight="700" fill="#137b68">SPARSE COORDINATE (zeros for 99 steps, then g₁₀₀ = 2)</text>
    <text x="72" y="156" font-size="15.5" font-weight="600">G₁₀₀ = 0² + ··· + 0² + 2² = 4</text>
    <text x="72" y="182" font-size="16.5" font-weight="700" fill="#137b68">Δw₁₀₀ = −η · (2 / √4) = −η = −0.100</text>
    <text x="72" y="204" font-size="12.5" fill="#52685c">Rare feature still gets a full step of size η when it appears.</text>

    <!-- Frequent Box -->
    <rect x="55" y="232" width="380" height="122" rx="10" fill="#fff" stroke="#b66929" stroke-width="1.5"/>
    <text x="72" y="256" font-size="13.5" font-weight="700" fill="#b66929">FREQUENT COORDINATE (gₖ = 2 on all 100 steps)</text>
    <text x="72" y="282" font-size="15.5" font-weight="600">G₁₀₀ = 100 × 2² = 400   ⇒   √G₁₀₀ = 20</text>
    <text x="72" y="308" font-size="16.5" font-weight="700" fill="#b66929">Δw₁₀₀ = −η · (2 / 20) = −η / √100 = −0.010</text>
    <text x="72" y="330" font-size="12.5" fill="#52685c">10× smaller step at t = 100 (decays automatically as η / √t).</text>

    <!-- RIGHT PANEL: Monotonic Accumulator vs Effective Rate -->
    <rect x="475" y="60" width="390" height="315" rx="12" fill="#fff" stroke="#b9cfc3" stroke-width="1.5"/>
    <text x="495" y="88" font-size="16" font-weight="700">2. Why Adagrad Eventually Stalls (gₖ² ≥ 0)</text>

    <!-- Plot axes: x in [525, 835] (t = 1..50), y in [120, 290] -->
    <line x1="525" y1="290" x2="835" y2="290" stroke="#c3d6cc" stroke-width="1.5"/>
    <line x1="525" y1="205" x2="835" y2="205" stroke="#dce7e1" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="525" y1="120" x2="835" y2="120" stroke="#dce7e1" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="525" y1="120" x2="525" y2="290" stroke="#c3d6cc" stroke-width="1.5"/>

    <!-- Growing accumulator G_t = t*g^2 (amber line rising linearly from (525, 286) to (835, 128)) -->
    <polyline points="525,286 587,254 649,223 711,191 773,160 835,128" fill="none" stroke="#b66929" stroke-width="3"/>
    <text x="682" y="144" font-size="13.5" font-weight="700" fill="#b66929">Gₜ = ∑ gₖ² (only grows)</text>

    <!-- Decaying effective rate eta / sqrt(t) (teal curve from (525, 125) down toward (835, 267)) -->
    <polyline points="525.0,125.0 537.4,193.3 549.8,216.2 562.2,229.0 574.6,237.4 587.0,243.3 618.0,253.1 649.0,259.1 680.0,263.3 711.0,266.4 773.0,270.8 835.0,273.8" fill="none" stroke="#137b68" stroke-width="3"/>
    <text x="580" y="236" font-size="13.5" font-weight="700" fill="#137b68">Effective rate ηₜ = η / √Gₜ  ∝  1 / √t</text>

    <text x="520" y="308" font-size="12" fill="#52685c">t = 1</text>
    <text x="670" y="308" font-size="12" fill="#52685c">Step t →</text>
    <text x="810" y="308" font-size="12" fill="#52685c">t = 50</text>

    <text x="495" y="336" font-size="13" fill="#173d35" font-weight="600">Since gₖ² ≥ 0, Gₜ never shrinks:</text>
    <text x="495" y="356" font-size="12.5" fill="#52685c">As t → ∞, Gₜ → ∞  ⇒  η / (√Gₜ + ε) → 0 (fixes: Adadelta, RMSprop).</text>
  </g>
</svg>

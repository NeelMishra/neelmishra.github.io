<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-labelledby="title desc">
  <title id="title">Adadelta step pipeline and unit matching</title>
  <desc id="desc">Three-stage update cycle of Adadelta showing how today's gradient updates v_t for the denominator RMS[g]_t, combines with yesterday's update history u_{t-1} in the numerator RMS[d]_{t-1} to form d_t with parameter units, and then updates u_t for the next step.</desc>
  <defs>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#137b68"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#b66929"/>
    </marker>
    <marker id="arr-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#173d35"/>
    </marker>
  </defs>

  <rect width="900" height="390" rx="18" fill="#f4f7f2"/>

  <g font-family="system-ui,sans-serif" fill="#173d35">
    <text x="35" y="42" font-size="22" font-weight="700">Adadelta: Causal Update Order &amp; Unit Matching</text>

    <!-- STEP 1 BOX: Gradient RMS (Denominator) -->
    <rect x="35" y="68" width="255" height="125" rx="12" fill="#fff" stroke="#b9cfc3" stroke-width="1.5"/>
    <text x="52" y="95" font-size="13.5" font-weight="700" fill="#b66929">1 · UPDATE GRADIENT RMS (USES gₜ)</text>
    <text x="52" y="128" font-size="18" font-weight="700">vₜ = ρvₜ₋₁ + (1 − ρ)gₜ²</text>
    <text x="52" y="158" font-size="15" font-weight="600" fill="#b66929">RMS[g]ₜ = √(vₜ + ε)</text>
    <text x="52" y="179" font-size="12.5" fill="#52685c">Units: [loss / param] (denominator)</text>

    <!-- Arrow 1 -> 2 -->
    <line x1="290" y1="130" x2="328" y2="130" stroke="#b66929" stroke-width="3" marker-end="url(#arr-amber)"/>

    <!-- STEP 2 BOX: Compute Proposed Step d_t -->
    <rect x="335" y="68" width="270" height="125" rx="12" fill="#fff" stroke="#137b68" stroke-width="2"/>
    <text x="352" y="95" font-size="13.5" font-weight="700" fill="#137b68">2 · COMPUTE PROPOSED STEP dₜ</text>
    <text x="352" y="132" font-size="19" font-weight="700" fill="#137b68">dₜ = − (RMS[d]ₜ₋₁ / RMS[g]ₜ) · gₜ</text>
    <text x="352" y="160" font-size="14.5" font-weight="600">wₜ = wₜ₋₁ + dₜ</text>
    <text x="352" y="179" font-size="12.5" fill="#52685c">Numerator uses lagged uₜ₋₁ (dₜ not in uₜ₋₁)</text>

    <!-- Arrow 2 -> 3 -->
    <line x1="605" y1="130" x2="643" y2="130" stroke="#137b68" stroke-width="3" marker-end="url(#arr-teal)"/>

    <!-- STEP 3 BOX: Update Step RMS (Numerator for t+1) -->
    <rect x="650" y="68" width="215" height="125" rx="12" fill="#fff" stroke="#b9cfc3" stroke-width="1.5"/>
    <text x="667" y="95" font-size="13.5" font-weight="700" fill="#173d35">3 · RECORD STEP RMS</text>
    <text x="667" y="128" font-size="18" font-weight="700">uₜ = ρuₜ₋₁ + (1 − ρ)dₜ²</text>
    <text x="667" y="158" font-size="15" font-weight="600" fill="#173d35">RMS[d]ₜ = √(uₜ + ε)</text>
    <text x="667" y="179" font-size="12.5" fill="#52685c">Units: [param] (for step t + 1)</text>

    <!-- Feedback loop from Step 3 (u_t) back to Step 2 (as u_{t-1} on next step) -->
    <path d="M757,193 L757,225 L470,225 L470,198" fill="none" stroke="#173d35" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arr-dark)"/>
    <text x="515" y="218" font-size="13" font-weight="700" fill="#173d35">Used as numerator RMS[d]ₜ₋₁ = √(uₜ₋₁ + ε) on the next step</text>

    <!-- BOTTOM PANEL: Why both RMS terms are needed (Dimensional Analysis) -->
    <rect x="35" y="248" width="830" height="116" rx="12" fill="#fff" stroke="#b9cfc3" stroke-width="1.5"/>
    <text x="55" y="278" font-size="16" font-weight="700">Why divide by RMS[g]ₜ and multiply by RMS[d]ₜ₋₁?</text>

    <text x="55" y="308" font-size="15" fill="#b66929" font-weight="600">• Normalized gradient alone:  gₜ / RMS[g]ₜ</text>
    <text x="395" y="308" font-size="15" fill="#52685c">→  [loss / param] ÷ [loss / param] = 1 (dimensionless; lacks parameter scale)</text>

    <text x="55" y="340" font-size="15" fill="#137b68" font-weight="600">• Full Adadelta step:  −(RMS[d]ₜ₋₁ / RMS[g]ₜ) · gₜ</text>
    <text x="395" y="340" font-size="15" fill="#173d35" font-weight="600">→  [param] × 1 = [param] (matches parameter units Δw without a manual η)</text>
  </g>
</svg>
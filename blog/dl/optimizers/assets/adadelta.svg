<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-label="Two memories, updated in a particular order"><rect width="900" height="400" rx="16" fill="#f4f7f2"/><g font-family="system-ui,sans-serif" fill="#173d35"><text x="32" y="42" font-size="23" font-weight="700">Two memories, updated in a particular order</text><rect x="35" y="85" width="360" height="95" rx="12" fill="white" stroke="#b9cfc3"/><rect x="505" y="85" width="360" height="95" rx="12" fill="white" stroke="#b9cfc3"/><rect x="230" y="235" width="450" height="95" rx="12" fill="white" stroke="#b9cfc3"/><text x="55" y="115" font-size="16">1 · INCLUDE TODAY’S GRADIENT</text><text x="55" y="153" font-size="24">vₜ = ρvₜ₋₁ + (1 − ρ)gₜ²</text><text x="525" y="115" font-size="16">2 · COMPUTE THE PROPOSED STEP</text><text x="525" y="153" font-size="20">dₜ = −√(uₜ₋₁ + ε) / √(vₜ + ε) · gₜ</text><text x="250" y="270" font-size="16">3 · NOW REMEMBER THIS STEP</text><text x="250" y="307" font-size="24">uₜ = ρuₜ₋₁ + (1 − ρ)dₜ²</text><text x="420" y="146" font-size="32">→</text><text x="682" y="213" font-size="32">↙</text><text x="35" y="375" font-size="17">The numerator uses old update history. The denominator already knows today’s gradient.</text></g></svg>
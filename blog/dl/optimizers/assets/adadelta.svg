<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Adadelta step pipeline and unit matching</title>
  <desc id="desc">Three-stage update cycle of Adadelta showing how today's gradient updates v_t for the denominator RMS[g]_t, combines with yesterday's update history u_{t-1} in the numerator RMS[d]_{t-1} to form d_t with parameter units, and then updates u_t for the next step.</desc>
  <defs>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#137b68"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#b66929"/>
    </marker>
    <marker id="arr-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#173d35"/>
    </marker>
  </defs>

  <rect width="900" height="420" rx="18" fill="#f4f7f2"/>

  <g font-family="system-ui,sans-serif" fill="#173d35">
    <text x="35" y="40" font-size="21" font-weight="700">Adadelta: Causal Update Order &amp; Unit Matching</text>

    <!-- STEP 1 BOX: Gradient RMS (Denominator) -->
    <rect x="35" y="62" width="245" height="136" rx="12" fill="#fff" stroke="#b9cfc3" stroke-width="1.5"/>
    <text x="52" y="88" font-size="12.5" font-weight="700" fill="#b66929">1 · GRADIENT RMS (DENOMINATOR)</text>
    <text x="52" y="118" font-size="16.5" font-weight="700">vₜ = ρvₜ₋₁ + (1 − ρ)gₜ²</text>
    <text x="52" y="148" font-size="15.5" font-weight="700" fill="#b66929">RMS[g]ₜ = √(vₜ + ε)</text>
    <text x="52" y="176" font-size="11.5" fill="#52685c">Includes gₜ · Units: [loss / param]</text>

    <!-- Arrow 1 -> 2 -->
    <line x1="280" y1="130" x2="313" y2="130" stroke="#b66929" stroke-width="2.8" marker-end="url(#arr-amber)"/>

    <!-- STEP 2 BOX: Compute Proposed Step d_t -->
    <rect x="320" y="62" width="260" height="136" rx="12" fill="#fff" stroke="#137b68" stroke-width="2"/>
    <text x="338" y="88" font-size="12.5" font-weight="700" fill="#137b68">2 · COMPUTE PARAMETER STEP dₜ</text>

    <!-- Stacked fraction for d_t -->
    <text x="338" y="131" font-size="17" font-weight="700" fill="#137b68">dₜ = −</text>
    <text x="438" y="115" text-anchor="middle" font-size="14" font-weight="700" fill="#173d35">RMS[d]ₜ₋₁</text>
    <line x1="392" y1="124" x2="484" y2="124" stroke="#137b68" stroke-width="2"/>
    <text x="438" y="143" text-anchor="middle" font-size="14" font-weight="700" fill="#b66929">RMS[g]ₜ</text>
    <text x="492" y="131" font-size="17" font-weight="700" fill="#137b68">· gₜ</text>

    <text x="338" y="165" font-size="13.5" font-weight="600" fill="#173d35">Update:  wₜ = wₜ₋₁ + dₜ</text>
    <text x="338" y="184" font-size="12" fill="#52685c">Uses lagged uₜ₋₁ and current vₜ</text>

    <!-- Arrow 2 -> 3 -->
    <line x1="580" y1="130" x2="613" y2="130" stroke="#137b68" stroke-width="2.8" marker-end="url(#arr-teal)"/>

    <!-- STEP 3 BOX: Update Step RMS (Numerator for t+1) -->
    <rect x="620" y="62" width="245" height="136" rx="12" fill="#fff" stroke="#b9cfc3" stroke-width="1.5"/>
    <text x="638" y="88" font-size="12.5" font-weight="700" fill="#173d35">3 · RECORD STEP RMS (FOR t + 1)</text>
    <text x="638" y="118" font-size="16.5" font-weight="700">uₜ = ρuₜ₋₁ + (1 − ρ)dₜ²</text>
    <text x="638" y="148" font-size="15.5" font-weight="700" fill="#173d35">RMS[d]ₜ = √(uₜ + ε)</text>
    <text x="638" y="176" font-size="11.5" fill="#52685c">Records dₜ² · Units: [param]</text>

    <!-- Feedback loop from Step 3 (u_t) back to Step 2 (as u_{t-1} on next step) -->
    <path d="M742,198 L742,232 L450,232 L450,204" fill="none" stroke="#173d35" stroke-width="2.2" stroke-dasharray="6,4" marker-end="url(#arr-dark)"/>
    <rect x="466" y="219" width="260" height="22" rx="11" fill="#e6efe9"/>
    <text x="596" y="234" text-anchor="middle" font-size="12" font-weight="700" fill="#173d35">Feeds numerator RMS[d]ₜ₋₁ on step t + 1</text>

    <!-- BOTTOM PANEL: Why both RMS terms are needed (Dimensional Analysis) -->
    <rect x="35" y="256" width="830" height="142" rx="12" fill="#fff" stroke="#b9cfc3" stroke-width="1.5"/>
    <text x="55" y="283" font-size="15.5" font-weight="700">Dimensional Check: Why Divide by RMS[g]ₜ and Multiply by RMS[d]ₜ₋₁?</text>

    <!-- Left comparison card -->
    <rect x="55" y="296" width="385" height="86" rx="8" fill="#fbfcfa" stroke="#d8e4dd" stroke-width="1.2"/>
    <text x="70" y="319" font-size="13.5" font-weight="700" fill="#b66929">1. Normalized Gradient Alone:  gₜ / RMS[g]ₜ</text>
    <text x="70" y="344" font-size="13.5" font-weight="600" fill="#173d35">Units:  [loss / param] ÷ [loss / param] = 1</text>
    <text x="70" y="366" font-size="12.5" fill="#52685c">Dimensionless ratio — lacks parameter step units.</text>

    <!-- Right comparison card -->
    <rect x="460" y="296" width="385" height="86" rx="8" fill="#f2f8f5" stroke="#137b68" stroke-width="1.5"/>
    <text x="475" y="319" font-size="13.5" font-weight="700" fill="#137b68">2. Full Adadelta Step:  −(RMS[d]ₜ₋₁ / RMS[g]ₜ) · gₜ</text>
    <text x="475" y="344" font-size="13.5" font-weight="600" fill="#173d35">Units:  [param] × 1 = [param]  (matches Δw)</text>
    <text x="475" y="366" font-size="12.5" fill="#52685c">Restores parameter units automatically without η.</text>
  </g>
</svg>
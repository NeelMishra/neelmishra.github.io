<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-label="Choose the axes, then adapt along those axes"><rect width="900" height="400" rx="16" fill="#f4f7f2"/><g font-family="system-ui,sans-serif" fill="#173d35"><text x="32" y="42" font-size="23" font-weight="700">Choose the axes, then adapt along those axes</text><rect x="35" y="100" width="245" height="180" rx="12" fill="white" stroke="#b9cfc3"/><text x="50" y="132" font-size="16">1 · CHANGE COORDINATES</text><text x="50" y="188" font-size="24">H = QLᵀ G QR</text><text x="50" y="245" font-size="16">Orthogonal projections</text><rect x="330" y="100" width="240" height="180" rx="12" fill="white" stroke="#b9cfc3"/><text x="345" y="132" font-size="16">2 · ADAPT HERE</text><text x="345" y="188" font-size="24">Adam(H)</text><text x="345" y="245" font-size="16">Signed + squared memory</text><rect x="620" y="100" width="245" height="180" rx="12" fill="white" stroke="#b9cfc3"/><text x="635" y="132" font-size="16">3 · RETURN</text><text x="635" y="188" font-size="24">P = QL A QRᵀ</text><text x="635" y="245" font-size="16">Original coordinates</text><text x="293" y="195" font-size="30">→</text><text x="584" y="195" font-size="30">→</text><text x="35" y="331" font-size="21">The basis determines which directions Adam treats independently.</text><text x="35" y="373" font-size="17">When the basis changes, stored moment coordinates require explicit handling.</text></g></svg>
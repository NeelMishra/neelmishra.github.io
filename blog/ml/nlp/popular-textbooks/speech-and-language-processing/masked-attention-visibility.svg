<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="visibility-title visibility-desc">
<title id="visibility-title">Causal and bidirectional attention permit different connections</title><desc id="visibility-desc">Rows are queries and columns are keys. A causal five-position sequence permits keys j less than or equal to query i. Bidirectional attention permits every non-padding key for every query. A circle means allowed; a cross means blocked, independent of learned attention weights.</desc>

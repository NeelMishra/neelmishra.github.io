<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 502" role="img" aria-labelledby="title desc">
<title id="title">A recurrent weight receives gradient from multiple time steps</title><desc id="desc">Inputs 1, minus 0.5 and 0.25 produce states 0.537050, 0.128918 and 0.247863. The shared recurrent weight 0.8 receives three loss-gradient contributions: zero, minus 0.300219 and minus 0.091607, totaling minus 0.391825.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
<rect width="780" height="502" fill="#fffdf9"/><g font-family="Arial,sans-serif"><text x="28" y="36" font-size="24" fill="#13201a" font-weight="700" text-anchor="start">One recurrence, three uses of the same weights</text><text x="28" y="67" font-size="17" fill="#4a5a53" font-weight="400" text-anchor="start">h₀ = 0     hₜ = tanh(0.8 hₜ₋₁ + 0.6 xₜ)     Final binary loss only</text><text x="140" y="111" font-size="13" fill="#087354" font-weight="700" text-anchor="middle">STEP 1</text><rect x="40" y="128" width="200" height="113" rx="10" fill="#133e32"/><text x="140" y="161" font-size="18" fill="#ffffff" font-weight="400" text-anchor="middle">x = 1</text><text x="140" y="192" font-size="17" fill="#ffffff" font-weight="400" text-anchor="middle">a = 0.600000</text><text x="140" y="223" font-size="19" fill="#ffffff" font-weight="700" text-anchor="middle">h = 0.537050</text><rect x="40" y="328" width="200" height="73" rx="10" fill="#eef4fb"/><text x="140" y="354" font-size="14" fill="#3b6493" font-weight="400" text-anchor="middle">Contribution to dL/du</text><text x="140" y="385" font-size="21" fill="#3b6493" font-weight="700" text-anchor="middle">0.000000</text><path d="M244 196L285 196" fill="none" stroke="#087354" stroke-width="2" marker-end="url(#arrow)"/><text x="265" y="178" font-size="16" fill="#087354" font-weight="700" text-anchor="middle">u</text><path d="M285 277L244 277" fill="none" stroke="#3b6493" stroke-width="2" marker-end="url(#arrow)"/><text x="390" y="111" font-size="13" fill="#087354" font-weight="700" text-anchor="middle">STEP 2</text><rect x="290" y="128" width="200" height="113" rx="10" fill="#133e32"/><text x="390" y="161" font-size="18" fill="#ffffff" font-weight="400" text-anchor="middle">x = -0.5</text><text x="390" y="192" font-size="17" fill="#ffffff" font-weight="400" text-anchor="middle">a = 0.129640</text><text x="390" y="223" font-size="19" fill="#ffffff" font-weight="700" text-anchor="middle">h = 0.128918</text><rect x="290" y="328" width="200" height="73" rx="10" fill="#eef4fb"/><text x="390" y="354" font-size="14" fill="#3b6493" font-weight="400" text-anchor="middle">Contribution to dL/du</text><text x="390" y="385" font-size="21" fill="#3b6493" font-weight="700" text-anchor="middle">-0.300219</text><path d="M494 196L535 196" fill="none" stroke="#087354" stroke-width="2" marker-end="url(#arrow)"/><text x="515" y="178" font-size="16" fill="#087354" font-weight="700" text-anchor="middle">u</text><path d="M535 277L494 277" fill="none" stroke="#3b6493" stroke-width="2" marker-end="url(#arrow)"/><text x="640" y="111" font-size="13" fill="#087354" font-weight="700" text-anchor="middle">STEP 3</text><rect x="540" y="128" width="200" height="113" rx="10" fill="#133e32"/><text x="640" y="161" font-size="18" fill="#ffffff" font-weight="400" text-anchor="middle">x = 0.25</text><text x="640" y="192" font-size="17" fill="#ffffff" font-weight="400" text-anchor="middle">a = 0.253135</text><text x="640" y="223" font-size="19" fill="#ffffff" font-weight="700" text-anchor="middle">h = 0.247863</text><rect x="540" y="328" width="200" height="73" rx="10" fill="#eef4fb"/><text x="640" y="354" font-size="14" fill="#3b6493" font-weight="400" text-anchor="middle">Contribution to dL/du</text><text x="640" y="385" font-size="21" fill="#3b6493" font-weight="700" text-anchor="middle">-0.091607</text><text x="390" y="306" font-size="15" fill="#3b6493" font-weight="700" text-anchor="middle">Backpropagate from the final prediction</text><rect x="28" y="423" width="724" height="59" rx="10" fill="#edf2ec"/><text x="47" y="448" font-size="17" fill="#13201a" font-weight="700" text-anchor="start">Sum every use of u:  0 − 0.300219 − 0.091607 ≈ −0.391825</text><text x="47" y="472" font-size="15" fill="#4a5a53" font-weight="400" text-anchor="start">The first contribution is zero because its previous state h₀ is zero.</text></g></svg>
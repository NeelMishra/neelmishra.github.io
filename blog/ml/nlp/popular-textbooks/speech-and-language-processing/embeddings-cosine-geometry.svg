<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="cosine-title cosine-desc">
<title id="cosine-title">Doubling a vector changes the dot product but preserves cosine</title><desc id="cosine-desc">The plot uses concert and strings counts as coordinates. Violin is (4,3), cello is (3,4), and doubled cello is (6,8). Both cello vectors have cosine 0.96 with violin. Their dot products with violin are 24 and 48.</desc>
<rect width="960" height="600" rx="14" fill="#fffdf9"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#13201a}.muted{fill:#4a5a53}.green{fill:#087354}.orange{fill:#a64719}.white{fill:#fffdf9}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.eyebrow{font-size:17px;font-weight:700;letter-spacing:1.8px}.title{font-size:29px;font-weight:700}.label{font-size:22px;font-weight:700}.small{font-size:19px}</style>
<text x="24" y="30" class="eyebrow green">COSINE GEOMETRY</text>
<text x="24" y="72" class="title">Same angle, different magnitude</text>
<defs><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 Z" fill="#087354"/></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 Z" fill="#a64719"/></marker></defs>
<line x1="88" y1="145" x2="88" y2="505" stroke="#e5dece"/>
<line x1="88" y1="505" x2="448" y2="505" stroke="#e5dece"/>
<text x="88" y="532" class="mono muted" font-size="17" text-anchor="middle">0</text>
<text x="65" y="511" class="mono muted" font-size="17" text-anchor="end">0</text>
<line x1="133" y1="145" x2="133" y2="505" stroke="#e5dece"/>
<line x1="88" y1="460" x2="448" y2="460" stroke="#e5dece"/>
<text x="133" y="532" class="mono muted" font-size="17" text-anchor="middle">1</text>
<text x="65" y="466" class="mono muted" font-size="17" text-anchor="end">1</text>
<line x1="178" y1="145" x2="178" y2="505" stroke="#e5dece"/>
<line x1="88" y1="415" x2="448" y2="415" stroke="#e5dece"/>
<text x="178" y="532" class="mono muted" font-size="17" text-anchor="middle">2</text>
<text x="65" y="421" class="mono muted" font-size="17" text-anchor="end">2</text>
<line x1="223" y1="145" x2="223" y2="505" stroke="#e5dece"/>
<line x1="88" y1="370" x2="448" y2="370" stroke="#e5dece"/>
<text x="223" y="532" class="mono muted" font-size="17" text-anchor="middle">3</text>
<text x="65" y="376" class="mono muted" font-size="17" text-anchor="end">3</text>
<line x1="268" y1="145" x2="268" y2="505" stroke="#e5dece"/>
<line x1="88" y1="325" x2="448" y2="325" stroke="#e5dece"/>
<text x="268" y="532" class="mono muted" font-size="17" text-anchor="middle">4</text>
<text x="65" y="331" class="mono muted" font-size="17" text-anchor="end">4</text>
<line x1="313" y1="145" x2="313" y2="505" stroke="#e5dece"/>
<line x1="88" y1="280" x2="448" y2="280" stroke="#e5dece"/>
<text x="313" y="532" class="mono muted" font-size="17" text-anchor="middle">5</text>
<text x="65" y="286" class="mono muted" font-size="17" text-anchor="end">5</text>
<line x1="358" y1="145" x2="358" y2="505" stroke="#e5dece"/>
<line x1="88" y1="235" x2="448" y2="235" stroke="#e5dece"/>
<text x="358" y="532" class="mono muted" font-size="17" text-anchor="middle">6</text>
<text x="65" y="241" class="mono muted" font-size="17" text-anchor="end">6</text>
<line x1="403" y1="145" x2="403" y2="505" stroke="#e5dece"/>
<line x1="88" y1="190" x2="448" y2="190" stroke="#e5dece"/>
<text x="403" y="532" class="mono muted" font-size="17" text-anchor="middle">7</text>
<text x="65" y="196" class="mono muted" font-size="17" text-anchor="end">7</text>
<line x1="448" y1="145" x2="448" y2="505" stroke="#e5dece"/>
<line x1="88" y1="145" x2="448" y2="145" stroke="#e5dece"/>
<text x="448" y="532" class="mono muted" font-size="17" text-anchor="middle">8</text>
<text x="65" y="151" class="mono muted" font-size="17" text-anchor="end">8</text>
<path d="M88,135 V505 H465" fill="none" stroke="#4a5a53" stroke-width="2"/>
<text x="88" y="118" class="small muted">strings count</text>
<text x="286" y="570" class="small muted" text-anchor="middle">concert count</text>
<line x1="88" y1="505" x2="358" y2="145" stroke="#087354" stroke-width="4" stroke-dasharray="8 5" marker-end="url(#arrow-green)"/>
<line x1="88" y1="505" x2="223" y2="325" stroke="#087354" stroke-width="5" marker-end="url(#arrow-green)"/>
<line x1="88" y1="505" x2="268" y2="370" stroke="#a64719" stroke-width="4" marker-end="url(#arrow-orange)"/>
<text x="277" y="401" class="small orange">violin (4, 3)</text>
<text x="104" y="301" class="small green">cello (3, 4)</text>
<text x="300" y="133" class="label green">2 × cello</text>
<rect x="512" y="130" width="424" height="322" rx="12" fill="#f3f0e8" stroke="#d9cfba"/>
<text x="536" y="170" class="eyebrow muted">COMPARED WITH VIOLIN</text>
<text x="538" y="214" class="small muted">Candidate</text>
<text x="538" y="264" class="label" font-size="24">cello</text>
<text x="538" y="321" class="label" font-size="24">2 × cello</text>
<text x="758" y="214" class="small muted">Dot</text>
<text x="758" y="264" class="mono" font-size="24">24</text>
<text x="758" y="321" class="mono" font-size="24">48</text>
<text x="865" y="214" class="small muted">Cosine</text>
<text x="865" y="264" class="mono" font-size="24">0.96</text>
<text x="865" y="321" class="mono" font-size="24">0.96</text>
<line x1="536" y1="353" x2="912" y2="353" stroke="#d9cfba"/>
<text x="536" y="391" class="label">Multiply by 2:</text>
<text x="536" y="426" class="small green">length × 2; angle unchanged.</text>
<text x="512" y="502" class="small muted">Positive scaling preserves cosine.</text>
<text x="512" y="534" class="small muted">Normalize both vectors and their</text>
<text x="512" y="563" class="small muted">dot product equals their cosine.</text>
</svg>
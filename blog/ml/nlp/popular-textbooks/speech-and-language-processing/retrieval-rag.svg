<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 758" role="img" aria-labelledby="title desc">
<title id="title">A RAG pipeline with source provenance</title><desc id="desc">Offline, source documents become passages with identifiers, then an index. Online, a question drives retrieval, optional reranking, prompt construction, and generation. The prompt preserves D1&#x27;s text and identifier so the answer can cite its evidence.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#33795f"/></marker></defs>
<rect width="920" height="758" fill="#fffdf9"/>
<g font-family="Arial, sans-serif"><text x="30" y="43" font-size="27" font-weight="700" fill="#263d33" text-anchor="start">RAG carries source evidence into the answer</text><text x="30" y="76" font-size="19" font-weight="400" fill="#263d33" text-anchor="start">The retriever selects passages; the generator writes from the selected context.</text><rect x="30" y="105" width="860" height="114" rx="12" fill="#f4efe5" stroke="#d9cfba"/><text x="50" y="134" font-size="16" font-weight="700" fill="#263d33" text-anchor="start">PREPARE THE COLLECTION</text><text x="50" y="169" font-size="20" font-weight="400" fill="#263d33" text-anchor="start">Source documents</text><text x="50" y="196" font-size="20" font-weight="400" fill="#263d33" text-anchor="start">with IDs and dates</text><path d="M259 177 H296" fill="none" stroke="#33795f" stroke-width="2.5" marker-end="url(#arrow)"/><text x="320" y="169" font-size="20" font-weight="400" fill="#263d33" text-anchor="start">Passages / chunks</text><text x="320" y="196" font-size="20" font-weight="400" fill="#263d33" text-anchor="start">retain source pointers</text><path d="M550 177 H586" fill="none" stroke="#33795f" stroke-width="2.5" marker-end="url(#arrow)"/><text x="614" y="169" font-size="20" font-weight="400" fill="#263d33" text-anchor="start">Searchable index</text><text x="614" y="196" font-size="20" font-weight="400" fill="#263d33" text-anchor="start">counts or embeddings</text><path d="M740 222 V248 H431 V275" fill="none" stroke="#33795f" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="280" width="225" height="106" rx="12" fill="#edf3ed" stroke="#c6d5c9"/><text x="50" y="312" font-size="20" font-weight="400" fill="#263d33" text-anchor="start">USER QUESTION</text><text x="50" y="340" font-size="20" font-weight="400" fill="#263d33" text-anchor="start">What stores solar</text><text x="50" y="368" font-size="20" font-weight="400" fill="#263d33" text-anchor="start">energy at home?</text><path d="M258 334 H306" fill="none" stroke="#33795f" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="312" y="280" width="238" height="106" rx="12" fill="#dbeadf" stroke="#c6d5c9"/><text x="332" y="313" font-size="23" font-weight="700" fill="#263d33" text-anchor="start">1. Retrieve</text><text x="332" y="344" font-size="19" font-weight="400" fill="#263d33" text-anchor="start">Find candidates</text><text x="332" y="371" font-size="19" font-weight="400" fill="#263d33" text-anchor="start">from the index</text><path d="M553 334 H601" fill="none" stroke="#33795f" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="607" y="280" width="283" height="106" rx="12" fill="#e9e0ed" stroke="#c6d5c9"/><text x="627" y="313" font-size="22" font-weight="700" fill="#263d33" text-anchor="start">2. Rerank (optional)</text><text x="627" y="344" font-size="19" font-weight="400" fill="#263d33" text-anchor="start">Spend more computation</text><text x="627" y="371" font-size="19" font-weight="400" fill="#263d33" text-anchor="start">on this shortlist</text><path d="M750 390 V423" fill="none" stroke="#33795f" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="430" width="860" height="111" rx="12" fill="#edf3ed" stroke="#c6d5c9"/><text x="50" y="462" font-size="23" font-weight="700" fill="#263d33" text-anchor="start">3. Build the prompt</text><text x="50" y="494" font-size="20" font-weight="400" fill="#263d33" text-anchor="start">Question + selected passages + instructions + stable source IDs</text><text x="50" y="523" font-size="19" font-weight="400" fill="#263d33" text-anchor="start">Example evidence: [D1] home solar battery stores solar energy</text><path d="M170 545 V579" fill="none" stroke="#33795f" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="586" width="265" height="103" rx="12" fill="#dbeadf" stroke="#c6d5c9"/><text x="50" y="620" font-size="23" font-weight="700" fill="#263d33" text-anchor="start">4. Generate</text><text x="50" y="651" font-size="18" font-weight="400" fill="#263d33" text-anchor="start">Condition on the prompt</text><text x="50" y="676" font-size="18" font-weight="400" fill="#263d33" text-anchor="start">and earlier output tokens</text><path d="M299 638 H346" fill="none" stroke="#33795f" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="353" y="586" width="537" height="103" rx="12" fill="#fffdf9" stroke="#c6d5c9"/><text x="373" y="620" font-size="23" font-weight="700" fill="#263d33" text-anchor="start">A home solar battery [D1].</text><text x="373" y="651" font-size="18" font-weight="400" fill="#263d33" text-anchor="start">Illustrative supported answer, written by the author.</text><text x="373" y="676" font-size="18" font-weight="400" fill="#263d33" text-anchor="start">Check that each citation supports its attached claim.</text><text x="30" y="731" font-size="19" font-weight="400" fill="#263d33" text-anchor="start">Missing needed evidence is a retrieval failure. An unsupported claim is an answer failure.</text></g></svg>
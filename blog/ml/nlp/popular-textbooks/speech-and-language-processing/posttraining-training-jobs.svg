<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 598" role="img" aria-labelledby="title desc">
<title id="title">Distinguish supervised, reward, RLHF and DPO training</title><desc id="desc">SFT uses demonstration targets to train the answering policy. Reward fitting uses preferences to train a scalar scorer. PPO-style RLHF trains the policy from fresh outputs and a scorer plus reference. DPO trains the policy from existing pairs and frozen reference likelihoods.</desc>
<rect width="760" height="598" fill="#fffdf9"/>
<g font-family="Arial, sans-serif"><text x="26" y="34" font-size="23" fill="#13201a" font-weight="700" text-anchor="start">Four training jobs, four distinct sources of pressure</text><text x="26" y="64" font-size="15" fill="#4a5a53" font-weight="400" text-anchor="start">Reward-model fitting and policy training update different parameters.</text><rect x="26" y="91" width="145" height="91" rx="9" fill="#133e32"/><text x="98.5" y="141" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle">SFT</text><rect x="193" y="91" width="236" height="91" rx="9" fill="#edf2ec"/><text x="210" y="125" font-size="16" fill="#13201a" font-weight="700" text-anchor="start">Prompt + demonstration</text><text x="210" y="155" font-size="14" fill="#4a5a53" font-weight="400" text-anchor="start">Correct response tokens</text><text x="173" y="142" font-size="22" fill="#4a5a53" font-weight="400" text-anchor="start">→</text><rect x="451" y="91" width="283" height="91" rx="9" fill="#eef4fb"/><text x="468" y="125" font-size="16" fill="#13201a" font-weight="700" text-anchor="start">Token prediction loss</text><text x="468" y="155" font-size="15" fill="#405c75" font-weight="400" text-anchor="start">Update the answering policy</text><text x="431" y="142" font-size="22" fill="#4a5a53" font-weight="400" text-anchor="start">→</text><rect x="26" y="211" width="145" height="91" rx="9" fill="#133e32"/><text x="98.5" y="261" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle">Reward fitting</text><rect x="193" y="211" width="236" height="91" rx="9" fill="#edf2ec"/><text x="210" y="245" font-size="16" fill="#13201a" font-weight="700" text-anchor="start">Prompt + ranked responses</text><text x="210" y="275" font-size="14" fill="#4a5a53" font-weight="400" text-anchor="start">Which answer was preferred?</text><text x="173" y="262" font-size="22" fill="#4a5a53" font-weight="400" text-anchor="start">→</text><rect x="451" y="211" width="283" height="91" rx="9" fill="#eef4fb"/><text x="468" y="245" font-size="16" fill="#13201a" font-weight="700" text-anchor="start">Pairwise ranking loss</text><text x="468" y="275" font-size="15" fill="#405c75" font-weight="400" text-anchor="start">Update the reward scorer</text><text x="431" y="262" font-size="22" fill="#4a5a53" font-weight="400" text-anchor="start">→</text><rect x="26" y="331" width="145" height="91" rx="9" fill="#133e32"/><text x="98.5" y="381" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle">PPO-style RLHF</text><rect x="193" y="331" width="236" height="91" rx="9" fill="#edf2ec"/><text x="210" y="365" font-size="16" fill="#13201a" font-weight="700" text-anchor="start">Fresh policy responses</text><text x="210" y="395" font-size="14" fill="#4a5a53" font-weight="400" text-anchor="start">Frozen scorer + reference</text><text x="173" y="382" font-size="22" fill="#4a5a53" font-weight="400" text-anchor="start">→</text><rect x="451" y="331" width="283" height="91" rx="9" fill="#eef4fb"/><text x="468" y="365" font-size="16" fill="#13201a" font-weight="700" text-anchor="start">Reward-guided RL update</text><text x="468" y="395" font-size="15" fill="#405c75" font-weight="400" text-anchor="start">Update the answering policy</text><text x="431" y="382" font-size="22" fill="#4a5a53" font-weight="400" text-anchor="start">→</text><rect x="26" y="451" width="145" height="91" rx="9" fill="#133e32"/><text x="98.5" y="501" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle">DPO</text><rect x="193" y="451" width="236" height="91" rx="9" fill="#edf2ec"/><text x="210" y="485" font-size="16" fill="#13201a" font-weight="700" text-anchor="start">Existing preference pairs</text><text x="210" y="515" font-size="14" fill="#4a5a53" font-weight="400" text-anchor="start">Frozen reference likelihoods</text><text x="173" y="502" font-size="22" fill="#4a5a53" font-weight="400" text-anchor="start">→</text><rect x="451" y="451" width="283" height="91" rx="9" fill="#eef4fb"/><text x="468" y="485" font-size="16" fill="#13201a" font-weight="700" text-anchor="start">Relative likelihood loss</text><text x="468" y="515" font-size="15" fill="#405c75" font-weight="400" text-anchor="start">Update the answering policy</text><text x="431" y="502" font-size="22" fill="#4a5a53" font-weight="400" text-anchor="start">→</text><text x="26" y="576" font-size="14" fill="#4a5a53" font-weight="400" text-anchor="start">These jobs can be combined across a pipeline; DPO does not require an explicit reward scorer.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="heads-title heads-desc">
<title id="heads-title">Different task heads read different encoder outputs</title><desc id="heads-desc">An encoder produces a CLS vector and one contextual vector per input token. A sequence head reads CLS for a class label; a shared tagging head reads each selected word representation for BIO labels; two span heads score eligible passage positions as answer starts and ends.</desc>
<rect width="960" height="560" rx="14" fill="#fffdf9"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#13201a}.muted{fill:#4a5a53}.green{fill:#087354}.purple{fill:#67508e}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.eyebrow{font-size:17px;font-weight:700;letter-spacing:1.6px}.title{font-size:29px;font-weight:700}.label{font-size:23px;font-weight:700}.small{font-size:19px}</style>
<text x="24" y="30" class="eyebrow green">ADAPTING THE REPRESENTATION</text>
<text x="24" y="72" class="title">One encoder, different supervision shapes</text>
<rect x="24" y="106" width="912" height="104" rx="12" fill="#e8f3ed" stroke="#9ac0ab"/>
<text x="480" y="145" class="label green" text-anchor="middle">Bidirectional transformer encoder</text>
<text x="480" y="182" class="mono" font-size="23" text-anchor="middle">Outputs: h[CLS], h₁, h₂, …, hₙ</text>
<path d="M168 211 V245 M161 238 L168 245 L175 238" fill="none" stroke="#087354" stroke-width="3"/>
<path d="M480 211 V245 M473 238 L480 245 L487 238" fill="none" stroke="#087354" stroke-width="3"/>
<path d="M792 211 V245 M785 238 L792 245 L799 238" fill="none" stroke="#087354" stroke-width="3"/>
<rect x="24" y="263" width="288" height="231" rx="12" fill="#f3f0e8" stroke="#d9cfba"/>
<text x="44" y="301" class="label">One sequence label</text>
<rect x="336" y="263" width="288" height="231" rx="12" fill="#f3f0e8" stroke="#d9cfba"/>
<text x="356" y="301" class="label">Per-word BIO tags</text>
<rect x="648" y="263" width="288" height="231" rx="12" fill="#f3f0e8" stroke="#d9cfba"/>
<text x="668" y="301" class="label">Answer boundaries</text>
<text x="44" y="339" class="mono" font-size="21">Read h[CLS]</text>
<text x="44" y="374" class="small">Classification head</text>
<text x="44" y="408" class="small green">→ positive / negative</text>
<text x="44" y="450" class="small muted">Also works for a pair</text>
<text x="44" y="478" class="small muted">packed into one input.</text>
<text x="356" y="339" class="small">Read each word vector</text>
<text x="356" y="374" class="small">Shared tagging head</text>
<text x="356" y="408" class="mono" font-size="20">Mira → B-PER</text>
<text x="356" y="441" class="mono" font-size="20">Rao → I-PER</text>
<text x="356" y="474" class="mono" font-size="20">joined → O</text>
<text x="668" y="339" class="small">Read passage vectors</text>
<text x="668" y="374" class="small">Two position scorers</text>
<text x="668" y="408" class="mono" font-size="21">P(start = i)</text>
<text x="668" y="441" class="mono" font-size="21">P(end = j)</text>
<text x="668" y="474" class="small green">Require i ≤ j</text>
<text x="480" y="534" class="small muted" text-anchor="middle">The head matches the labels; the encoder supplies context.</text>
</svg>
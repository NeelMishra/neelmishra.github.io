<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Compute character F score from red boat and red boats</title><desc id="desc">Remove spaces from candidate red boat and reference red boats. Seven candidate unigrams all match eight reference unigrams. Six candidate bigrams all match seven reference bigrams. Mean precision is one, mean recall is 97 over 112, and F beta two equals 97 over 109, or point eight eight nine nine zero eight.</desc><rect width="960" height="560" fill="#fffdf7"/><g font-family="Arial, sans-serif" fill="#172b24">
<text x="30" y="44" font-size="25" font-weight="700">A HIGH OVERLAP SCORE CAN STILL MISS A MEANING CHANGE</text>
<text x="30" y="82" font-size="21">Candidate: red boat   |   Reference: red boats   |   Whitespace removed</text>
<text x="30" y="132" font-size="23" font-weight="700">Character unigrams</text>
<rect x="30" y="153" width="47" height="44" rx="5" fill="#dcece0" stroke="#bbccbf"/>
<text x="53" y="183" font-size="24" text-anchor="middle">r</text>
<rect x="87" y="153" width="47" height="44" rx="5" fill="#dcece0" stroke="#bbccbf"/>
<text x="110" y="183" font-size="24" text-anchor="middle">e</text>
<rect x="144" y="153" width="47" height="44" rx="5" fill="#dcece0" stroke="#bbccbf"/>
<text x="167" y="183" font-size="24" text-anchor="middle">d</text>
<rect x="201" y="153" width="47" height="44" rx="5" fill="#dcece0" stroke="#bbccbf"/>
<text x="224" y="183" font-size="24" text-anchor="middle">b</text>
<rect x="258" y="153" width="47" height="44" rx="5" fill="#dcece0" stroke="#bbccbf"/>
<text x="281" y="183" font-size="24" text-anchor="middle">o</text>
<rect x="315" y="153" width="47" height="44" rx="5" fill="#dcece0" stroke="#bbccbf"/>
<text x="338" y="183" font-size="24" text-anchor="middle">a</text>
<rect x="372" y="153" width="47" height="44" rx="5" fill="#dcece0" stroke="#bbccbf"/>
<text x="395" y="183" font-size="24" text-anchor="middle">t</text>
<rect x="429" y="153" width="47" height="44" rx="5" fill="#f5e4d5" stroke="#bbccbf"/>
<text x="452" y="183" font-size="24" text-anchor="middle">s</text>
<text x="532" y="181" font-size="20">7 matches / 7 candidate / 8 reference</text>
<text x="30" y="240" font-size="23" font-weight="700">Character bigrams</text>
<rect x="30" y="260" width="56" height="44" rx="5" fill="#dcece0" stroke="#bbccbf"/>
<text x="58" y="290" font-size="23" text-anchor="middle">re</text>
<rect x="96" y="260" width="56" height="44" rx="5" fill="#dcece0" stroke="#bbccbf"/>
<text x="124" y="290" font-size="23" text-anchor="middle">ed</text>
<rect x="162" y="260" width="56" height="44" rx="5" fill="#dcece0" stroke="#bbccbf"/>
<text x="190" y="290" font-size="23" text-anchor="middle">db</text>
<rect x="228" y="260" width="56" height="44" rx="5" fill="#dcece0" stroke="#bbccbf"/>
<text x="256" y="290" font-size="23" text-anchor="middle">bo</text>
<rect x="294" y="260" width="56" height="44" rx="5" fill="#dcece0" stroke="#bbccbf"/>
<text x="322" y="290" font-size="23" text-anchor="middle">oa</text>
<rect x="360" y="260" width="56" height="44" rx="5" fill="#dcece0" stroke="#bbccbf"/>
<text x="388" y="290" font-size="23" text-anchor="middle">at</text>
<rect x="426" y="260" width="56" height="44" rx="5" fill="#f5e4d5" stroke="#bbccbf"/>
<text x="454" y="290" font-size="23" text-anchor="middle">ts</text>
<text x="532" y="288" font-size="20">6 matches / 6 candidate / 7 reference</text>
<text x="30" y="352" font-size="23">Mean precision P = (7/7 + 6/6) / 2 = 1</text>
<text x="30" y="391" font-size="23">Mean recall R = (7/8 + 6/7) / 2 = 97/112 ≈ 0.866071</text>
<rect x="30" y="422" width="900" height="104" rx="10" fill="#dcece0" stroke="#bbccbf"/>
<text x="50" y="459" font-size="23" font-weight="700">chrF with orders 1–2 and β = 2:</text>
<text x="50" y="499" font-size="28" font-weight="700">5PR / (4P + R) = 97/109 ≈ 0.889908</text>
</g></svg>
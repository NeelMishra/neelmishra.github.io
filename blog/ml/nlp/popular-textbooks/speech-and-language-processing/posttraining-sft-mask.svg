<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 414" role="img" aria-labelledby="title desc">
<title id="title">Response-only supervised loss</title><desc id="desc">Return two colors is the conditioning prompt with zero loss mask. Blue, green and end-of-sequence have mask one and token losses 0.6931, 1.3863 and 0.2231. Their average is 0.7675 nats.</desc>
<rect width="760" height="414" fill="#fffdf9"/>
<g font-family="Arial, sans-serif"><text x="26" y="34" font-size="23" fill="#13201a" font-weight="700" text-anchor="start">Context is visible; only selected targets earn loss</text><text x="26" y="63" font-size="15" fill="#4a5a53" font-weight="400" text-anchor="start">A six-token teaching example; role delimiters are omitted.</text><text x="30" y="97" font-size="13" fill="#4a5a53" font-weight="700" text-anchor="start">PROMPT: CONDITION ON THESE</text><text x="378" y="97" font-size="13" fill="#087354" font-weight="700" text-anchor="start">RESPONSE: SCORE THESE</text><rect x="30" y="114" width="104" height="56" rx="9" fill="#edf2ec"/><text x="82" y="149" font-size="19" fill="#13201a" font-weight="700" text-anchor="middle">Return</text><text x="82" y="239" font-size="25" fill="#68796d" font-weight="700" text-anchor="middle">0</text><text x="82" y="296" font-size="16" fill="#4a5a53" font-weight="400" text-anchor="middle">excluded</text><rect x="146" y="114" width="104" height="56" rx="9" fill="#edf2ec"/><text x="198" y="149" font-size="19" fill="#13201a" font-weight="700" text-anchor="middle">two</text><text x="198" y="239" font-size="25" fill="#68796d" font-weight="700" text-anchor="middle">0</text><text x="198" y="296" font-size="16" fill="#4a5a53" font-weight="400" text-anchor="middle">excluded</text><rect x="262" y="114" width="104" height="56" rx="9" fill="#edf2ec"/><text x="314" y="149" font-size="19" fill="#13201a" font-weight="700" text-anchor="middle">colors</text><text x="314" y="239" font-size="25" fill="#68796d" font-weight="700" text-anchor="middle">0</text><text x="314" y="296" font-size="16" fill="#4a5a53" font-weight="400" text-anchor="middle">excluded</text><rect x="378" y="114" width="104" height="56" rx="9" fill="#133e32"/><text x="430" y="149" font-size="19" fill="#ffffff" font-weight="700" text-anchor="middle">blue</text><text x="430" y="239" font-size="25" fill="#087354" font-weight="700" text-anchor="middle">1</text><text x="430" y="296" font-size="16" fill="#13201a" font-weight="400" text-anchor="middle">0.6931</text><rect x="494" y="114" width="104" height="56" rx="9" fill="#133e32"/><text x="546" y="149" font-size="19" fill="#ffffff" font-weight="700" text-anchor="middle">green</text><text x="546" y="239" font-size="25" fill="#087354" font-weight="700" text-anchor="middle">1</text><text x="546" y="296" font-size="16" fill="#13201a" font-weight="400" text-anchor="middle">1.3863</text><rect x="610" y="114" width="104" height="56" rx="9" fill="#133e32"/><text x="662" y="149" font-size="19" fill="#ffffff" font-weight="700" text-anchor="middle">&lt;eos&gt;</text><text x="662" y="239" font-size="25" fill="#087354" font-weight="700" text-anchor="middle">1</text><text x="662" y="296" font-size="16" fill="#13201a" font-weight="400" text-anchor="middle">0.2231</text><text x="30" y="207" font-size="12" fill="#4a5a53" font-weight="700" text-anchor="start">LOSS MASK</text><text x="30" y="272" font-size="12" fill="#4a5a53" font-weight="700" text-anchor="start">TOKEN LOSS (NATS)</text><path d="M370 85V308" stroke="#b8c7bd" stroke-dasharray="5 5"/><rect x="26" y="324" width="708" height="69" rx="9" fill="#edf2ec"/><text x="44" y="351" font-size="17" fill="#13201a" font-weight="700" text-anchor="start">Mean response loss = (0.6931 + 1.3863 + 0.2231) / 3</text><text x="44" y="379" font-size="16" fill="#4a5a53" font-weight="400" text-anchor="start">0.7675 nats per scored token. Prompt tokens still influence the answer.</text></g></svg>
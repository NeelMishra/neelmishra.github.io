<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="sgns-title sgns-desc">
<title id="sgns-title">One simultaneous SGNS gradient step</title><desc id="sgns-desc">For violin as center, concert is positive and diesel and galaxy are sampled negatives. With learning rate 0.1, the positive score rises while both negative scores fall. The batch loss decreases from 2.6996 to 2.4576.</desc>
<rect width="960" height="500" rx="14" fill="#fffdf9"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#13201a}.muted{fill:#4a5a53}.green{fill:#087354}.orange{fill:#a64719}.white{fill:#fffdf9}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.eyebrow{font-size:17px;font-weight:700;letter-spacing:1.8px}.title{font-size:29px;font-weight:700}.label{font-size:22px;font-weight:700}.small{font-size:19px}</style>
<text x="24" y="30" class="eyebrow green">SKIP-GRAM WITH NEGATIVE SAMPLING</text>
<text x="24" y="72" class="title">One small update, three inspectable changes</text>
<rect x="24" y="102" width="912" height="265" rx="12" fill="#f3f0e8" stroke="#d9cfba"/>
<text x="46" y="139" class="eyebrow muted">PAIR CONTEXT</text>
<text x="230" y="139" class="eyebrow muted">GOAL</text>
<text x="365" y="139" class="eyebrow muted">SCORE z</text>
<text x="645" y="139" class="eyebrow muted">SIGMOID σ(z)</text>
<rect x="36" y="152" width="888" height="58" rx="6" fill="#e8f3ed"/>
<text x="46" y="190" class="label">concert</text>
<text x="230" y="190" class="small green">raise</text>
<text x="365" y="190" class="mono" font-size="22">0 → 0.1463</text>
<text x="645" y="190" class="mono" font-size="20">0.5000 → 0.5365</text>
<rect x="36" y="218" width="888" height="58" rx="6" fill="#fffdf9"/>
<text x="46" y="256" class="label">diesel</text>
<text x="230" y="256" class="small green">lower</text>
<text x="365" y="256" class="mono" font-size="22">1 → 0.8591</text>
<text x="645" y="256" class="mono" font-size="20">0.7311 → 0.7025</text>
<rect x="36" y="284" width="888" height="58" rx="6" fill="#fffdf9"/>
<text x="46" y="322" class="label">galaxy</text>
<text x="230" y="322" class="small green">lower</text>
<text x="365" y="322" class="mono" font-size="22">0 → −0.1463</text>
<text x="645" y="322" class="mono" font-size="20">0.5000 → 0.4635</text>
<rect x="24" y="395" width="444" height="78" rx="12" fill="#e8f3ed"/>
<rect x="486" y="395" width="450" height="78" rx="12" fill="#f8eee3"/>
<text x="44" y="425" class="eyebrow green">CENTER VECTOR</text>
<text x="44" y="455" class="mono" font-size="23">(1, 0) → (0.9269, 0.1)</text>
<text x="508" y="425" class="eyebrow orange">BATCH LOSS</text>
<text x="508" y="455" class="mono" font-size="25">2.6996 → 2.4576</text>
</svg>
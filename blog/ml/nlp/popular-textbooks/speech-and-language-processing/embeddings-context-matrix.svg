<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="contexts-title contexts-desc">
<title id="contexts-title">A context profile is a word vector</title><desc id="contexts-desc">Constructed counts for violin, cello, and engine in the three context columns concert, strings, and fuel. The vectors are (4,3,0), (3,4,0), and (1,0,4), respectively.</desc>
<rect width="960" height="440" rx="14" fill="#fffdf9"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#13201a}.muted{fill:#4a5a53}.green{fill:#087354}.orange{fill:#a64719}.white{fill:#fffdf9}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.eyebrow{font-size:17px;font-weight:700;letter-spacing:1.8px}.title{font-size:29px;font-weight:700}.label{font-size:22px;font-weight:700}.small{font-size:19px}</style>
<text x="24" y="30" class="eyebrow green">DISTRIBUTIONAL REPRESENTATION</text>
<text x="24" y="72" class="title">Compare words through their surroundings</text>
<text x="390" y="114" class="eyebrow muted">CONTEXT FEATURES →</text>
<text x="24" y="149" class="eyebrow muted">TARGET</text>
<text x="365" y="149" class="label" text-anchor="middle">concert</text>
<text x="523" y="149" class="label" text-anchor="middle">strings</text>
<text x="681" y="149" class="label" text-anchor="middle">fuel</text>
<text x="46" y="206" class="label">violin</text>
<text x="780" y="206" class="mono" font-size="24">(4, 3, 0)</text>
<rect x="288" y="166" width="152" height="56" rx="7" fill="#087354"/>
<text x="364" y="204" class="mono white" font-size="28" text-anchor="middle">4</text>
<rect x="446" y="166" width="152" height="56" rx="7" fill="#73b99a"/>
<text x="522" y="204" class="mono" font-size="28" text-anchor="middle">3</text>
<rect x="604" y="166" width="152" height="56" rx="7" fill="#f3f0e8"/>
<text x="680" y="204" class="mono" font-size="28" text-anchor="middle">0</text>
<text x="46" y="270" class="label">cello</text>
<text x="780" y="270" class="mono" font-size="24">(3, 4, 0)</text>
<rect x="288" y="230" width="152" height="56" rx="7" fill="#73b99a"/>
<text x="364" y="268" class="mono" font-size="28" text-anchor="middle">3</text>
<rect x="446" y="230" width="152" height="56" rx="7" fill="#087354"/>
<text x="522" y="268" class="mono white" font-size="28" text-anchor="middle">4</text>
<rect x="604" y="230" width="152" height="56" rx="7" fill="#f3f0e8"/>
<text x="680" y="268" class="mono" font-size="28" text-anchor="middle">0</text>
<text x="46" y="334" class="label">engine</text>
<text x="780" y="334" class="mono" font-size="24">(1, 0, 4)</text>
<rect x="288" y="294" width="152" height="56" rx="7" fill="#e8f3ed"/>
<text x="364" y="332" class="mono" font-size="28" text-anchor="middle">1</text>
<rect x="446" y="294" width="152" height="56" rx="7" fill="#f3f0e8"/>
<text x="522" y="332" class="mono" font-size="28" text-anchor="middle">0</text>
<rect x="604" y="294" width="152" height="56" rx="7" fill="#087354"/>
<text x="680" y="332" class="mono white" font-size="28" text-anchor="middle">4</text>
<rect x="24" y="378" width="912" height="44" rx="12" fill="#e8f3ed"/>
<text x="480" y="407" class="small green" text-anchor="middle">The same coordinate must mean the same context in every row.</text>
</svg>
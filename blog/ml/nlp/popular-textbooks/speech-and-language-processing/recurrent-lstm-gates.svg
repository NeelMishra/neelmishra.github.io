<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-labelledby="title desc">
<title id="title">A numerical LSTM memory update</title><desc id="desc">Retain 0.9 times the old memory 0.8, or 0.72. Write 0.2 times candidate minus 0.5, or minus 0.1. Adding them gives cell state 0.62. The output gate 0.75 times tanh of 0.62 exposes hidden state 0.413346.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
<rect width="780" height="520" fill="#fffdf9"/><g font-family="Arial,sans-serif"><text x="28" y="36" font-size="24" fill="#13201a" font-weight="700" text-anchor="start">Keep, write, then expose: one LSTM coordinate</text><text x="28" y="66" font-size="16" fill="#4a5a53" font-weight="400" text-anchor="start">Gate outputs are given for this step; the network normally computes them.</text><rect x="28" y="106" width="205" height="88" rx="10" fill="#edf2ec"/><text x="130" y="135" font-size="16" fill="#4a5a53" font-weight="400" text-anchor="middle">Previous memory</text><text x="130" y="170" font-size="26" fill="#087354" font-weight="700" text-anchor="middle">0.80</text><path d="M238 150L363 150" fill="none" stroke="#087354" stroke-width="2" marker-end="url(#arrow)"/><text x="300" y="133" font-size="16" fill="#087354" font-weight="700" text-anchor="middle">× f = 0.90</text><rect x="372" y="106" width="139" height="88" rx="10" fill="#edf7f1"/><text x="441" y="160" font-size="27" fill="#087354" font-weight="700" text-anchor="middle">0.72</text><rect x="28" y="235" width="205" height="88" rx="10" fill="#edf2ec"/><text x="130" y="264" font-size="16" fill="#4a5a53" font-weight="400" text-anchor="middle">Candidate content</text><text x="130" y="299" font-size="26" fill="#3b6493" font-weight="700" text-anchor="middle">−0.50</text><path d="M238 279L363 279" fill="none" stroke="#3b6493" stroke-width="2" marker-end="url(#arrow)"/><text x="300" y="262" font-size="16" fill="#3b6493" font-weight="700" text-anchor="middle">× i = 0.20</text><rect x="372" y="235" width="139" height="88" rx="10" fill="#eef4fb"/><text x="441" y="289" font-size="27" fill="#3b6493" font-weight="700" text-anchor="middle">−0.10</text><path d="M515 150H552V214H582M515 279H552V214" fill="none" stroke="#087354" stroke-width="2"/><text x="568" y="204" font-size="24" fill="#087354" font-weight="700" text-anchor="middle">+</text><rect x="588" y="167" width="164" height="96" rx="10" fill="#133e32"/><text x="670" y="197" font-size="16" fill="#ffffff" font-weight="400" text-anchor="middle">New memory cₜ</text><text x="670" y="239" font-size="30" fill="#ffffff" font-weight="700" text-anchor="middle">0.62</text><text x="28" y="368" font-size="13" fill="#ad5728" font-weight="700" text-anchor="start">OUTPUT: READ SOME OF THE MEMORY</text><rect x="28" y="390" width="724" height="73" rx="10" fill="#f6ece2"/><text x="47" y="420" font-size="20" fill="#13201a" font-weight="700" text-anchor="start">hₜ = o × tanh(cₜ) = 0.75 × tanh(0.62)</text><text x="47" y="448" font-size="19" fill="#ad5728" font-weight="700" text-anchor="start">= 0.75 × 0.551128 = 0.413346</text><text x="28" y="496" font-size="15" fill="#4a5a53" font-weight="400" text-anchor="start">cₜ continues along the memory path; hₜ is the exposed state used by other layers.</text></g></svg>
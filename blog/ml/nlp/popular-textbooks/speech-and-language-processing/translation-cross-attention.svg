<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">A numeric cross-attention calculation</title><desc id="desc">While predicting cat, a decoder query scores the three source keys with logarithms of two, six and two. Softmax yields point two, point six and point two. The weighted sum of source values one zero, zero two and two one equals point six, one point four.</desc><rect width="960" height="560" fill="#fffdf7"/><g font-family="Arial, sans-serif" fill="#172b24">
<text x="30" y="44" font-size="25" font-weight="700">RETRIEVE SOURCE INFORMATION WITH A DECODER QUERY</text>
<text x="30" y="80" font-size="21">Predicting cat after start · the. All vectors below are invented.</text>
<rect x="30" y="103" width="900" height="65" rx="10" fill="#e9e2f1" stroke="#bbccbf"/>
<text x="48" y="143" font-size="24" font-weight="700">q = [√2, 0]   ·   dₖ = 2   ·   scoreⱼ = q · kⱼ / √2</text>
<text x="48" y="208" font-size="21" font-weight="700">Source</text>
<text x="181" y="208" font-size="21" font-weight="700">Key kⱼ</text>
<text x="437" y="208" font-size="21" font-weight="700">Scaled score</text>
<text x="602" y="208" font-size="21" font-weight="700">Weight</text>
<text x="763" y="208" font-size="21" font-weight="700">Value vⱼ</text>
<rect x="30" y="228" width="900" height="54" rx="5" fill="#f3f3eb" stroke="#e0e4d8"/>
<text x="48" y="263" font-size="22">le</text>
<text x="181" y="263" font-size="22">[ln 2, 0]</text>
<text x="437" y="263" font-size="22">ln 2</text>
<text x="602" y="263" font-size="22">0.20</text>
<text x="763" y="263" font-size="22">[1, 0]</text>
<rect x="30" y="290" width="900" height="54" rx="5" fill="#dcece0" stroke="#e0e4d8"/>
<text x="48" y="325" font-size="22" font-weight="700">chat</text>
<text x="181" y="325" font-size="22" font-weight="700">[ln 6, 1]</text>
<text x="437" y="325" font-size="22" font-weight="700">ln 6</text>
<text x="602" y="325" font-size="22" font-weight="700">0.60</text>
<text x="763" y="325" font-size="22" font-weight="700">[0, 2]</text>
<rect x="30" y="352" width="900" height="54" rx="5" fill="#f3f3eb" stroke="#e0e4d8"/>
<text x="48" y="387" font-size="22">dort</text>
<text x="181" y="387" font-size="22">[ln 2, −1]</text>
<text x="437" y="387" font-size="22">ln 2</text>
<text x="602" y="387" font-size="22">0.20</text>
<text x="763" y="387" font-size="22">[2, 1]</text>
<text x="30" y="450" font-size="23">Softmax: [2, 6, 2] / (2 + 6 + 2) = [0.20, 0.60, 0.20]</text>
<rect x="30" y="473" width="900" height="58" rx="10" fill="#dcece0" stroke="#bbccbf"/>
<text x="48" y="510" font-size="23" font-weight="700">0.20[1, 0] + 0.60[0, 2] + 0.20[2, 1] = [0.60, 1.40]</text>
</g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 704" role="img" aria-labelledby="title desc">
<title id="title">Bi-encoder, cross-encoder, and late-interaction retrieval</title><desc id="desc">A bi-encoder forms independent query and passage vectors and takes their dot product. A cross-encoder jointly encodes the query and passage before scoring. Late interaction stores token vectors and aggregates their similarities with MaxSim.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#33795f"/></marker></defs>
<rect width="960" height="704" fill="#fffdf9"/>
<g font-family="Arial, sans-serif"><text x="28" y="43" font-size="28" font-weight="700" fill="#263d33" text-anchor="start">Where does the query meet the passage?</text><text x="28" y="75" font-size="19" font-weight="400" fill="#263d33" text-anchor="start">Three ways to trade stored representations for query-time interaction</text><rect x="24" y="96" width="912" height="170" rx="12" fill="#edf3ed" stroke="#c6d5c9"/><rect x="24" y="284" width="912" height="170" rx="12" fill="#edf3ed" stroke="#c6d5c9"/><rect x="24" y="472" width="912" height="170" rx="12" fill="#edf3ed" stroke="#c6d5c9"/><text x="43" y="133" font-size="24" font-weight="700" fill="#263d33" text-anchor="start">Bi-encoder</text><text x="43" y="166" font-size="19" font-weight="400" fill="#263d33" text-anchor="start">Encode separately.</text><text x="43" y="193" font-size="19" font-weight="400" fill="#263d33" text-anchor="start">Meet at one</text><text x="43" y="220" font-size="19" font-weight="400" fill="#263d33" text-anchor="start">dot product.</text><text x="245" y="142" font-size="18" font-weight="400" fill="#263d33" text-anchor="start">query</text><text x="235" y="221" font-size="18" font-weight="400" fill="#263d33" text-anchor="start">passage</text><rect x="330" y="116" width="110" height="46" rx="12" fill="#dbeadf" stroke="#c6d5c9"/><text x="385" y="146" font-size="18" font-weight="700" fill="#263d33" text-anchor="middle">Q encoder</text><rect x="330" y="195" width="110" height="46" rx="12" fill="#e9e0ed" stroke="#c6d5c9"/><text x="385" y="225" font-size="18" font-weight="700" fill="#263d33" text-anchor="middle">D encoder</text><path d="M299 137 H326" fill="none" stroke="#33795f" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M314 216 H326" fill="none" stroke="#33795f" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M440 139 H480" fill="none" stroke="#33795f" stroke-width="2.5" marker-end="url(#arrow)"/><text x="495" y="146" font-size="22" font-weight="700" fill="#263d33" text-anchor="start">q</text><path d="M440 218 H480" fill="none" stroke="#33795f" stroke-width="2.5" marker-end="url(#arrow)"/><text x="495" y="225" font-size="22" font-weight="700" fill="#263d33" text-anchor="start">d</text><path d="M518 140 L561 173" fill="none" stroke="#33795f" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M518 215 L561 188" fill="none" stroke="#33795f" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="566" y="155" width="112" height="49" rx="12" fill="#fffdf9" stroke="#c6d5c9"/><text x="622" y="187" font-size="23" font-weight="700" fill="#263d33" text-anchor="middle">q · d</text><text x="703" y="136" font-size="18" font-weight="400" fill="#263d33" text-anchor="start">Store one vector</text><text x="703" y="163" font-size="18" font-weight="400" fill="#263d33" text-anchor="start">per passage.</text><text x="703" y="190" font-size="18" font-weight="400" fill="#263d33" text-anchor="start">Encode the new</text><text x="703" y="217" font-size="18" font-weight="400" fill="#263d33" text-anchor="start">query once.</text><text x="43" y="321" font-size="24" font-weight="700" fill="#263d33" text-anchor="start">Cross-encoder</text><text x="43" y="354" font-size="19" font-weight="400" fill="#263d33" text-anchor="start">Encode together.</text><text x="43" y="381" font-size="19" font-weight="400" fill="#263d33" text-anchor="start">Every token can</text><text x="43" y="408" font-size="19" font-weight="400" fill="#263d33" text-anchor="start">interact early.</text><text x="245" y="344" font-size="18" font-weight="400" fill="#263d33" text-anchor="start">query</text><text x="245" y="371" font-size="18" font-weight="400" fill="#263d33" text-anchor="start">+ passage</text><path d="M338 351 H360" fill="none" stroke="#33795f" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="366" y="323" width="158" height="68" rx="12" fill="#dbeadf" stroke="#c6d5c9"/><text x="445" y="348" font-size="19" font-weight="700" fill="#263d33" text-anchor="middle">Joint</text><text x="445" y="373" font-size="19" font-weight="700" fill="#263d33" text-anchor="middle">encoder</text><path d="M524 357 H560" fill="none" stroke="#33795f" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="566" y="323" width="112" height="68" rx="12" fill="#fffdf9" stroke="#c6d5c9"/><text x="622" y="348" font-size="18" font-weight="700" fill="#263d33" text-anchor="middle">Relevance</text><text x="622" y="373" font-size="18" font-weight="700" fill="#263d33" text-anchor="middle">head</text><text x="703" y="324" font-size="18" font-weight="400" fill="#263d33" text-anchor="start">Recompute for</text><text x="703" y="351" font-size="18" font-weight="400" fill="#263d33" text-anchor="start">each query–</text><text x="703" y="378" font-size="18" font-weight="400" fill="#263d33" text-anchor="start">passage pair.</text><text x="703" y="405" font-size="18" font-weight="400" fill="#263d33" text-anchor="start">Useful to rerank.</text><text x="43" y="509" font-size="23" font-weight="700" fill="#263d33" text-anchor="start">Late interaction</text><text x="43" y="542" font-size="19" font-weight="400" fill="#263d33" text-anchor="start">Encode separately.</text><text x="43" y="569" font-size="19" font-weight="400" fill="#263d33" text-anchor="start">Meet as sets of</text><text x="43" y="596" font-size="19" font-weight="400" fill="#263d33" text-anchor="start">token vectors.</text><text x="245" y="523" font-size="18" font-weight="400" fill="#263d33" text-anchor="start">query</text><text x="235" y="603" font-size="18" font-weight="400" fill="#263d33" text-anchor="start">passage</text><rect x="335" y="500" width="28" height="35" rx="12" fill="#dbeadf" stroke="#c6d5c9"/><rect x="373" y="500" width="28" height="35" rx="12" fill="#dbeadf" stroke="#c6d5c9"/><rect x="411" y="500" width="28" height="35" rx="12" fill="#dbeadf" stroke="#c6d5c9"/><rect x="449" y="500" width="28" height="35" rx="12" fill="#dbeadf" stroke="#c6d5c9"/><rect x="335" y="579" width="28" height="35" rx="12" fill="#e9e0ed" stroke="#c6d5c9"/><rect x="373" y="579" width="28" height="35" rx="12" fill="#e9e0ed" stroke="#c6d5c9"/><rect x="411" y="579" width="28" height="35" rx="12" fill="#e9e0ed" stroke="#c6d5c9"/><rect x="449" y="579" width="28" height="35" rx="12" fill="#e9e0ed" stroke="#c6d5c9"/><path d="M298 515 H328" fill="none" stroke="#33795f" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M314 594 H328" fill="none" stroke="#33795f" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M489 517 L534 548" fill="none" stroke="#33795f" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M489 596 L534 567" fill="none" stroke="#33795f" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="540" y="525" width="138" height="65" rx="12" fill="#fffdf9" stroke="#c6d5c9"/><text x="609" y="551" font-size="19" font-weight="700" fill="#263d33" text-anchor="middle">MaxSim</text><text x="609" y="576" font-size="19" font-weight="700" fill="#263d33" text-anchor="middle">then sum</text><text x="703" y="512" font-size="18" font-weight="400" fill="#263d33" text-anchor="start">Store token</text><text x="703" y="539" font-size="18" font-weight="400" fill="#263d33" text-anchor="start">vectors. Match</text><text x="703" y="566" font-size="18" font-weight="400" fill="#263d33" text-anchor="start">each query token</text><text x="703" y="593" font-size="18" font-weight="400" fill="#263d33" text-anchor="start">at scoring time.</text><text x="28" y="677" font-size="19" font-weight="400" fill="#263d33" text-anchor="start">The encoders may share weights. Separate encoding is the key distinction.</text></g></svg>
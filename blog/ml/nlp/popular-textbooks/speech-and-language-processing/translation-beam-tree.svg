<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" role="img" aria-labelledby="title desc"><title id="title">Greedy search can discard the best complete path</title><desc id="desc">At the root, the has probability point five five, a point four, and end point zero five. After the, cat has point four five, dog point three five, and end point two. After a, cat has point eight, dog point one five, and end point zero five. All two word paths then end with probability one. The complete path a cat end has probability point three two, greater than greedy the cat end at point two four seven five.</desc><rect width="960" height="660" fill="#fffdf7"/><g font-family="Arial, sans-serif" fill="#172b24">
<text x="30" y="44" font-size="26" font-weight="700">A LOCALLY WEAKER PREFIX CAN FINISH STRONGER</text>
<text x="30" y="79" font-size="20">Arcs show conditional probabilities. Right-hand numbers multiply the path.</text>

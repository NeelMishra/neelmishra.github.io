<svg xmlns="http://www.w3.org/2000/svg" width="800" height="410" viewBox="0 0 800 410" role="img" aria-labelledby="title desc">
<title id="title">A spending tree built from the ten-customer table</title>
<desc id="desc">True branches go left, false branches go right. Edge labels show child cover divided by parent cover. Leaf boxes show predictions and reference counts.</desc>
<rect width="100%" height="100%" fill="#fff"/>
<g font-family="Arial, sans-serif" font-size="17" text-anchor="middle" fill="#172e35">
<path d="M400.0,98 L200.0,172" stroke="#809398" stroke-width="2"/>
<rect x="268.0" y="123.0" width="64" height="23" fill="#fff"/>
<text x="300.0" y="140.0" font-size="15">4/10</text>
<path d="M200.0,228 L100.0,302" stroke="#809398" stroke-width="2"/>
<rect x="118.0" y="253.0" width="64" height="23" fill="#fff"/>
<text x="150.0" y="270.0" font-size="15">3/4</text>
<path d="M200.0,228 L300.0,302" stroke="#809398" stroke-width="2"/>
<rect x="218.0" y="253.0" width="64" height="23" fill="#fff"/>
<text x="250.0" y="270.0" font-size="15">1/4</text>
<path d="M400.0,98 L600.0,172" stroke="#809398" stroke-width="2"/>
<rect x="468.0" y="123.0" width="64" height="23" fill="#fff"/>
<text x="500.0" y="140.0" font-size="15">6/10</text>
<path d="M600.0,228 L500.0,302" stroke="#809398" stroke-width="2"/>
<rect x="518.0" y="253.0" width="64" height="23" fill="#fff"/>
<text x="550.0" y="270.0" font-size="15">2/6</text>
<path d="M600.0,228 L700.0,302" stroke="#809398" stroke-width="2"/>
<rect x="618.0" y="253.0" width="64" height="23" fill="#fff"/>
<text x="650.0" y="270.0" font-size="15">4/6</text>
<rect x="323.0" y="42" width="154" height="64" rx="9" fill="#f1f5f7" stroke="#237267"/>
<text x="400.0" y="68" font-weight="700">New customer?</text>
<text x="400.0" y="92" font-size="15">10 customers</text>
<rect x="123.0" y="172" width="154" height="64" rx="9" fill="#f1f5f7" stroke="#237267"/>
<text x="200.0" y="198" font-weight="700">Basic plan?</text>
<text x="200.0" y="222" font-size="15">4 customers</text>
<rect x="23.0" y="302" width="154" height="64" rx="9" fill="#e8f4ef" stroke="#237267"/>
<text x="100.0" y="328" font-weight="700">Predict $10</text>
<text x="100.0" y="352" font-size="15">3 customers</text>
<rect x="223.0" y="302" width="154" height="64" rx="9" fill="#e8f4ef" stroke="#237267"/>
<text x="300.0" y="328" font-weight="700">Predict $30</text>
<text x="300.0" y="352" font-size="15">1 customer</text>
<rect x="523.0" y="172" width="154" height="64" rx="9" fill="#f1f5f7" stroke="#237267"/>
<text x="600.0" y="198" font-weight="700">Low usage?</text>
<text x="600.0" y="222" font-size="15">6 customers</text>
<rect x="423.0" y="302" width="154" height="64" rx="9" fill="#e8f4ef" stroke="#237267"/>
<text x="500.0" y="328" font-weight="700">Predict $50</text>
<text x="500.0" y="352" font-size="15">2 customers</text>
<rect x="623.0" y="302" width="154" height="64" rx="9" fill="#e8f4ef" stroke="#237267"/>
<text x="700.0" y="328" font-weight="700">Predict $90</text>
<text x="700.0" y="352" font-size="15">4 customers</text>
<text x="400" y="400" font-size="15" fill="#566b70">Yes → left · No → right · Counts come from the ten customers in the table</text>
</g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="800" height="410" viewBox="0 0 800 410" role="img" aria-labelledby="title desc">
<title id="title">The correlated-feature example: split on A first</title>
<desc id="desc">True branches go left, false branches go right. Edge labels show child cover divided by parent cover. Leaf boxes show predictions and reference counts.</desc>
<rect width="100%" height="100%" fill="#fff"/>
<g font-family="Arial, sans-serif" font-size="17" text-anchor="middle" fill="#172e35">
<path d="M400.0,98 L133.33333333333334,172" stroke="#809398" stroke-width="2"/>
<rect x="234.66666666666669" y="123.0" width="64" height="23" fill="#fff"/>
<text x="266.6666666666667" y="140.0" font-size="15">5/10</text>
<path d="M400.0,98 L533.3333333333334,172" stroke="#809398" stroke-width="2"/>
<rect x="434.6666666666667" y="123.0" width="64" height="23" fill="#fff"/>
<text x="466.6666666666667" y="140.0" font-size="15">5/10</text>
<path d="M533.3333333333334,228 L400.0,302" stroke="#809398" stroke-width="2"/>
<rect x="434.6666666666667" y="253.0" width="64" height="23" fill="#fff"/>
<text x="466.6666666666667" y="270.0" font-size="15">1/5</text>
<path d="M533.3333333333334,228 L666.6666666666666,302" stroke="#809398" stroke-width="2"/>
<rect x="568.0" y="253.0" width="64" height="23" fill="#fff"/>
<text x="600.0" y="270.0" font-size="15">4/5</text>
<rect x="323.0" y="42" width="154" height="64" rx="9" fill="#f1f5f7" stroke="#237267"/>
<text x="400.0" y="68" font-weight="700">A ≤ 0.5</text>
<text x="400.0" y="92" font-size="15">cover = 10</text>
<rect x="56.33333333333334" y="172" width="154" height="64" rx="9" fill="#e8f4ef" stroke="#237267"/>
<text x="133.33333333333334" y="198" font-weight="700">Predict 10</text>
<text x="133.33333333333334" y="222" font-size="15">cover = 5</text>
<rect x="456.33333333333337" y="172" width="154" height="64" rx="9" fill="#f1f5f7" stroke="#237267"/>
<text x="533.3333333333334" y="198" font-weight="700">B ≤ 0.5</text>
<text x="533.3333333333334" y="222" font-size="15">cover = 5</text>
<rect x="323.0" y="302" width="154" height="64" rx="9" fill="#e8f4ef" stroke="#237267"/>
<text x="400.0" y="328" font-weight="700">Predict 20</text>
<text x="400.0" y="352" font-size="15">cover = 1</text>
<rect x="589.6666666666666" y="302" width="154" height="64" rx="9" fill="#e8f4ef" stroke="#237267"/>
<text x="666.6666666666666" y="328" font-weight="700">Predict 50</text>
<text x="666.6666666666666" y="352" font-size="15">cover = 4</text>
<text x="400" y="400" font-size="15" fill="#566b70">True → left · False → right · Edge fractions apply when that feature is hidden</text>
</g></svg>

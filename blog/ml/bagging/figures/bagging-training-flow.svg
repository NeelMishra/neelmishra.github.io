<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" role="img" aria-labelledby="title desc"><title id="title">Bagging trains separate resampled learners</title><desc id="desc">One training dataset supplies three bootstrap resamples. Each resample independently supplies a tree. Tree outputs are combined only after the trees are trained.</desc><rect width="400" height="420" rx="12" fill="#fafaf7"/><g font-family="Arial,sans-serif" fill="#233f36" text-anchor="middle">
<text x="200" y="32" font-size="24" font-weight="bold">Bagging: branch, then combine</text>
<rect x="85" y="60" width="230" height="48" rx="8" fill="#edf7f2" stroke="#087f6d"/><text x="200" y="90" font-size="20">Training rows</text>
<path d="M200 108 V127 M70 147 V127 H330 V147 M200 127 V147" stroke="#71877c" stroke-width="2" fill="none"/>
<g fill="#eff3fc" stroke="#526eb6"><rect x="15" y="150" width="110" height="64" rx="8"/><rect x="145" y="150" width="110" height="64" rx="8"/><rect x="275" y="150" width="110" height="64" rx="8"/></g>
<g font-size="18"><text x="70" y="176">Resample 1</text><text x="70" y="201">→ fit tree 1</text><text x="200" y="176">Resample 2</text><text x="200" y="201">→ fit tree 2</text><text x="330" y="176">Resample 3</text><text x="330" y="201">→ fit tree 3</text></g>
<text x="200" y="249" font-size="17">No tree needs another tree’s predictions</text>
<path d="M70 262 V284 H330 V262 M200 262 V307" stroke="#71877c" stroke-width="2" fill="none"/>
<rect x="45" y="309" width="310" height="52" rx="8" fill="#edf7f2" stroke="#087f6d"/><text x="200" y="341" font-size="20">Average outputs or combine votes</text>
<text x="200" y="395" font-size="17">The branches can train concurrently.</text></g></svg>

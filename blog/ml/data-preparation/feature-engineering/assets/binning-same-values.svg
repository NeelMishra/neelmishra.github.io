<path d="M 205.000000 154 v 4" stroke="#718077"/>
<text x="205.000000" y="177" text-anchor="middle">40</text>
<path d="M 295.000000 154 v 4" stroke="#718077"/>
<text x="295.000000" y="177" text-anchor="middle">60</text>
<circle data-value="0" cx="25.000000" cy="124.300000" r="3.2" fill="#20392f"/>
<circle data-value="1" cx="29.500000" cy="115.300000" r="3.2" fill="#20392f"/>
<circle data-value="2" cx="34.000000" cy="106.300000" r="3.2" fill="#20392f"/>
<circle data-value="3" cx="38.500000" cy="124.300000" r="3.2" fill="#20392f"/>

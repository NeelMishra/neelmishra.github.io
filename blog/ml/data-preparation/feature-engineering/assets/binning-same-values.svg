<svg xmlns="http://www.w3.org/2000/svg" width="320" height="606" viewBox="0 0 320 606" role="img" aria-labelledby="title description">
<title id="title">Three partitions of the same twelve values</title>
<desc id="description">Equal-width cuts 20 and 40 give counts 9, 0, 3. Linear-quantile cuts 3⅔ and 7⅓ give counts 4, 4, 4. K-means cuts 22 and 47.5 give counts 9, 1, 2. Counts run left to right. All panels show the same observations and horizontal scale; vertical staggering only separates nearby dots. Colored area is not probability or density.</desc>
<!-- Reproduce with binning-same-values.py. All labels use 18 SVG units. -->
<rect width="320" height="606" fill="#fffdf8"/>
<g fill="#20392f" font-family="Arial, sans-serif" font-size="18">
<g id="uniform-panel">
<text x="16" y="24" font-weight="700">Equal width</text>
<text x="16" y="50">Counts: 9, 0, 3</text>
<rect data-bin="0" x="25.000000" y="64" width="90.000000" height="90" fill="#23775d" fill-opacity="0.12"/>
<rect data-bin="1" x="115.000000" y="64" width="90.000000" height="90" fill="#b45a29" fill-opacity="0.12"/>
<rect data-bin="2" x="205.000000" y="64" width="90.000000" height="90" fill="#375d8c" fill-opacity="0.12"/>
<path data-cut="20.0" d="M 115.000000 64 V 154" fill="none" stroke="#6b746f" stroke-width="1.2" stroke-dasharray="3 3"/>
<path data-cut="40.0" d="M 205.000000 64 V 154" fill="none" stroke="#6b746f" stroke-width="1.2" stroke-dasharray="3 3"/>
<path d="M 16 154 H 304" fill="none" stroke="#718077" stroke-width="1.2"/>
<path d="M 25.000000 154 v 4" stroke="#718077"/>
<text x="25.000000" y="177" text-anchor="middle">0</text>
<path d="M 115.000000 154 v 4" stroke="#718077"/>

    <dc:title>L2 normalization retains direction and merges positive multiples</dc:title>
    <dc:description>Rows A=(3,4) and B=(6,8) both become (0.6,0.8). C=(-3,0) becomes (-1,0). The zero row D remains at the origin, outside the unit circle.</dc:description>

<svg xmlns="http://www.w3.org/2000/svg" width="320" height="396" viewBox="0 0 320 396" role="img" aria-labelledby="title description">
<title id="title">L2 normalization keeps direction and removes length</title>
<desc id="description">The horizontal axis is the first normalized coordinate; the vertical axis is the second. Both axes use the same scale. A and B coincide at (0.6, 0.8) on the dashed unit circle. C reaches (−1, 0). The zero row D remains at the origin and has no direction.</desc>
<style>text{font:18px Arial,sans-serif;fill:#172c24} .heading{font-weight:700}.axis{stroke:#a1ada2;stroke-width:1.2}</style>
<defs><marker id="arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L6 3L0 6" fill="none" stroke="context-stroke"/></marker></defs>
<rect width="320" height="396" rx="10" fill="#fffaf2"/>
<text x="16" y="26" class="heading">L2-normalized rows</text>
<circle cx="158" cy="154" r="94" fill="none" stroke="#9cac9e" stroke-width="1.5" stroke-dasharray="5 4"/>
<path d="M35 154H286M158 40V270" class="axis"/>
<text x="286" y="180" text-anchor="middle">x₁</text>
<text x="169" y="45">x₂</text>
<path d="M64 150v8M154 248h8" class="axis"/>
<text x="64" y="180" text-anchor="middle">−1</text>
<text x="147" y="254" text-anchor="end">−1</text>
<path d="M252 150v8M154 60h8" class="axis"/>
<text x="252" y="180" text-anchor="middle">1</text>
<text x="147" y="66" text-anchor="end">1</text>
<path d="M158 154L214.400 78.800" fill="none" stroke="#078d6b" stroke-width="2.3" marker-end="url(#arrow)"/>
<circle cx="214.400" cy="78.800" r="4" fill="#078d6b"/>
<path d="M158 154L64.000 154.000" fill="none" stroke="#a55b26" stroke-width="2.3" marker-end="url(#arrow)"/>
<circle cx="64.000" cy="154.000" r="4" fill="#a55b26"/>
<circle cx="158" cy="154" r="3.5" fill="#172c24"/>
<text x="230" y="83">A, B</text>
<text x="64" y="141" text-anchor="middle">C</text>
<text x="169" y="178">D</text>
<text x="16" y="297">Dashed circle: length 1</text>
<text x="16" y="325">A and B → (0.6, 0.8)</text>
<text x="16" y="353">C → (−1, 0)</text>
<text x="16" y="381">D → (0, 0); no direction</text>
</svg>

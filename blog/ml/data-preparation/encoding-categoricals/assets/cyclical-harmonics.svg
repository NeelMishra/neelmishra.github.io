 <title>One daily sine/cosine pair cannot fit two symmetric daily peaks</title>
 <metadata>
  <rdf:RDF xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
   <cc:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
    <dc:title>One daily sine/cosine pair cannot fit two symmetric daily peaks</dc:title>
    <dc:description>Constructed hourly outcomes have peaks at 6 and 18. Least squares with one sine/cosine pair is constant at 10; adding the second harmonic fits the outcomes exactly.</dc:description>

<svg xmlns="http://www.w3.org/2000/svg" width="320" height="420" viewBox="0 0 320 420" role="img" aria-labelledby="title description">
<title id="title">Recorded parcel lengths and a review interval</title>
<desc id="description">The eight reference lengths run from 48 to 55 cm. The green review interval spans 44.5 to 58.5 cm. A, B and E record 150 cm; C records 51 cm; D records an invalid negative 5 cm. These are recorded values, before investigating source evidence.</desc>
<style>text{font:18px Arial,sans-serif;fill:#172c24} .unusual{fill:#91491f}.invalid{fill:#a12f35}</style>
<rect width="320" height="420" rx="10" fill="#fffaf2"/>
<rect x="14" y="14" width="18" height="18" fill="#dcece4" stroke="#6e9d85"/>
<text x="42" y="29">IQR review interval</text>
<text x="42" y="53">44.5–58.5 cm</text>
<rect x="123.603" y="70" width="18.495" height="280" fill="#dcece4"/>
<path d="M64.816 70V355" stroke="#c9d1ca" stroke-width="1"/>
<text x="64.816" y="376" text-anchor="middle">0</text>
<path d="M130.868 70V355" stroke="#c9d1ca" stroke-width="1"/>
<text x="130.868" y="376" text-anchor="middle">50</text>
<path d="M196.921 70V355" stroke="#c9d1ca" stroke-width="1"/>
<text x="196.921" y="376" text-anchor="middle">100</text>
<path d="M262.974 70V355" stroke="#c9d1ca" stroke-width="1"/>
<text x="262.974" y="376" text-anchor="middle">150</text>
<path d="M45 70V350H296" fill="none" stroke="#50665b" stroke-width="1.2"/>
<text x="38" y="91" text-anchor="end">Ref.</text>
<text x="157" y="91">48–55</text>
<circle cx="128.226" cy="85" r="2.3" fill="#596e62"/>
<circle cx="129.547" cy="85" r="2.3" fill="#596e62"/>
<circle cx="130.868" cy="85" r="2.3" fill="#596e62"/>
<circle cx="132.189" cy="85" r="2.3" fill="#596e62"/>
<circle cx="133.511" cy="85" r="2.3" fill="#596e62"/>
<circle cx="134.832" cy="85" r="2.3" fill="#596e62"/>
<circle cx="136.153" cy="85" r="2.3" fill="#596e62"/>
<circle cx="137.474" cy="85" r="2.3" fill="#596e62"/>
<text x="38" y="136" text-anchor="end">A</text>
<circle cx="262.974" cy="130" r="4" fill="#91491f"/>
<text x="251.974" y="136" text-anchor="end" class="unusual">150</text>
<text x="38" y="181" text-anchor="end">B</text>
<circle cx="262.974" cy="175" r="4" fill="#91491f"/>
<text x="251.974" y="181" text-anchor="end" class="unusual">150</text>
<text x="38" y="226" text-anchor="end">C</text>
<circle cx="132.189" cy="220" r="4" fill="#235d80"/>
<text x="143.189" y="226" text-anchor="start" class="">51</text>
<text x="38" y="271" text-anchor="end">D</text>
<path d="M54.211 261l8 8m-8 0l8-8" stroke="#a12f35" stroke-width="2" fill="none"/>
<text x="69.211" y="271" text-anchor="start" class="invalid">−5</text>
<text x="38" y="316" text-anchor="end">E</text>
<circle cx="262.974" cy="310" r="4" fill="#91491f"/>
<text x="251.974" y="316" text-anchor="end" class="unusual">150</text>

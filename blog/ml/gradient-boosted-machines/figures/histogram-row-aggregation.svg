<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 475" role="img" aria-labelledby="title desc">
<title id="title">Four rows become two histogram bins</title>
<desc id="desc">Rows with feature values one and two each have gradient minus three and curvature one. They form the first bin with gradient sum minus six and curvature sum two. Values eight and nine each have gradient plus three and curvature one; their bin sums are plus six and two. Only the cut at five is searched; cuts at one point five and eight point five are inside bins and skipped.</desc>
<rect width="320" height="475" rx="12" fill="#fafaf7"/><g font-family="Arial,sans-serif" fill="#233f36" text-anchor="middle">
<text x="160" y="28" font-size="20" font-weight="bold">Rows → bins → candidate cuts</text>
<rect x="8" y="50" width="67" height="89" rx="7" fill="#edf7f2" stroke="#087f6d"/>
<text x="41.5" y="75" font-size="19" font-weight="bold">x = 1</text>
<text x="41.5" y="103" font-size="18">g = −3</text>
<text x="41.5" y="127" font-size="18">h = 1</text>
<rect x="87" y="50" width="67" height="89" rx="7" fill="#edf7f2" stroke="#087f6d"/>
<text x="120.5" y="75" font-size="19" font-weight="bold">x = 2</text>
<text x="120.5" y="103" font-size="18">g = −3</text>
<text x="120.5" y="127" font-size="18">h = 1</text>
<rect x="166" y="50" width="67" height="89" rx="7" fill="#eff3fc" stroke="#526eb6"/>
<text x="199.5" y="75" font-size="19" font-weight="bold">x = 8</text>
<text x="199.5" y="103" font-size="18">g = +3</text>
<text x="199.5" y="127" font-size="18">h = 1</text>
<rect x="245" y="50" width="67" height="89" rx="7" fill="#eff3fc" stroke="#526eb6"/>
<text x="278.5" y="75" font-size="19" font-weight="bold">x = 9</text>
<text x="278.5" y="103" font-size="18">g = +3</text>
<text x="278.5" y="127" font-size="18">h = 1</text>
<path d="M41.5 140 V155 H120.5 V140 M81 155 V174 M199.5 140 V155 H278.5 V140 M239 155 V174" stroke="#82978b" stroke-width="2" fill="none"/>
<path d="M76 166 L81 174 L86 166 M234 166 L239 174 L244 166" fill="none" stroke="#82978b" stroke-width="2"/>
<rect x="8" y="179" width="146" height="89" rx="8" fill="#edf7f2" stroke="#087f6d"/>
<text x="81" y="203" font-size="19" font-weight="bold">Bin: x &lt; 5</text>
<text x="81" y="231" font-size="20">G = −6</text>
<text x="81" y="255" font-size="20">H = 2</text>
<rect x="166" y="179" width="146" height="89" rx="8" fill="#eff3fc" stroke="#526eb6"/>
<text x="239" y="203" font-size="19" font-weight="bold">Bin: x ≥ 5</text>
<text x="239" y="231" font-size="20">G = +6</text>
<text x="239" y="255" font-size="20">H = 2</text>
<text x="160" y="302" font-size="19" font-weight="bold">Which cuts remain available?</text>
<rect x="8" y="326" width="88" height="103" rx="8" fill="#f1f1ee" stroke="#87978d" stroke-dasharray="4"/>
<text x="56" y="355" font-size="22" font-weight="bold">1.5</text>
<text x="56" y="384" font-size="19">Skipped</text>
<text x="56" y="411" font-size="18">inside bin</text>
<rect x="116" y="326" width="88" height="103" rx="8" fill="#edf7f2" stroke="#087f6d" stroke-dasharray="0"/>
<text x="160" y="355" font-size="22" font-weight="bold">5</text>
<text x="160" y="384" font-size="19">Scored</text>
<text x="160" y="411" font-size="18">bin edge</text>
<rect x="224" y="326" width="88" height="103" rx="8" fill="#f1f1ee" stroke="#87978d" stroke-dasharray="4"/>
<text x="268" y="355" font-size="22" font-weight="bold">8.5</text>
<text x="268" y="384" font-size="19">Skipped</text>
<text x="268" y="411" font-size="18">inside bin</text>
<text x="160" y="459" font-size="18">G sums gradients; H sums curvatures.</text></g></svg>

<circle cx="295.0000" cy="146.7556" r="5" fill="#fffdf9" stroke="#203d34" stroke-width="2.5"/>
<text x="43.0000" y="286" font-size="18" text-anchor="middle">1</text>
<text x="85.0000" y="286" font-size="18" text-anchor="middle">2</text>
<text x="127.0000" y="286" font-size="18" text-anchor="middle">3</text>

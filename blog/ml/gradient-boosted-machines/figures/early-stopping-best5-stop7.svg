<svg xmlns="http://www.w3.org/2000/svg" width="320" height="330" viewBox="0 0 320 330" role="img" aria-labelledby="title desc">
<title id="title">Keep the best model at round five; stop training at round seven</title>
<desc id="desc">Illustrative losses over seven rounds. The green training curve is 0.75, 0.60, 0.46, 0.36, 0.28, 0.23, 0.19. The orange validation curve is 0.80, 0.64, 0.53, 0.48, 0.46, 0.47, 0.49. Its minimum is at round five. The next two rounds do not improve it, so patience two stops training at round seven.</desc>
<rect width="320" height="330" fill="#fffdf9"/>
<g font-family="Arial, sans-serif" fill="#203d34">
<text x="6" y="29" font-size="18" font-weight="700">Loss</text>
<line x1="43" x2="295" y1="260.0000" y2="260.0000" stroke="#dce4dd"/>
<text x="34" y="266.0000" font-size="18" text-anchor="end">0.0</text>
<line x1="43" x2="295" y1="213.7778" y2="213.7778" stroke="#dce4dd"/>
<text x="34" y="219.7778" font-size="18" text-anchor="end">0.2</text>
<line x1="43" x2="295" y1="167.5556" y2="167.5556" stroke="#dce4dd"/>
<text x="34" y="173.5556" font-size="18" text-anchor="end">0.4</text>
<line x1="43" x2="295" y1="121.3333" y2="121.3333" stroke="#dce4dd"/>
<text x="34" y="127.3333" font-size="18" text-anchor="end">0.6</text>
<line x1="43" x2="295" y1="75.1111" y2="75.1111" stroke="#dce4dd"/>
<text x="34" y="81.1111" font-size="18" text-anchor="end">0.8</text>
<path d="M43 52 V260 H295" fill="none" stroke="#9dab9f"/>
<line x1="211.0000" x2="211.0000" y1="44" y2="260" stroke="#1d4ed8" stroke-width="1.8" stroke-dasharray="5 5"/>
<text x="211.0000" y="29" font-size="18" font-weight="700" fill="#1d4ed8" text-anchor="end">Keep 5</text>
<line x1="295.0000" x2="295.0000" y1="44" y2="260" stroke="#203d34" stroke-width="1.8" stroke-dasharray="5 5"/>
<text x="295.0000" y="29" font-size="18" font-weight="700" fill="#203d34" text-anchor="end">Stop 7</text>
<polyline id="training-loss" points="43.0000,86.6667 85.0000,121.3333 127.0000,153.6889 169.0000,176.8000 211.0000,195.2889 253.0000,206.8444 295.0000,216.0889" fill="none" stroke="#16785a" stroke-width="2.5"/>
<circle cx="43.0000" cy="86.6667" r="3" fill="#16785a"/>
<circle cx="85.0000" cy="121.3333" r="3" fill="#16785a"/>
<circle cx="127.0000" cy="153.6889" r="3" fill="#16785a"/>
<circle cx="169.0000" cy="176.8000" r="3" fill="#16785a"/>
<circle cx="211.0000" cy="195.2889" r="3" fill="#16785a"/>
<circle cx="253.0000" cy="206.8444" r="3" fill="#16785a"/>
<circle cx="295.0000" cy="216.0889" r="3" fill="#16785a"/>
<polyline id="validation-loss" points="43.0000,75.1111 85.0000,112.0889 127.0000,137.5111 169.0000,149.0667 211.0000,153.6889 253.0000,151.3778 295.0000,146.7556" fill="none" stroke="#b35426" stroke-width="2.5"/>
<circle cx="43.0000" cy="75.1111" r="3" fill="#b35426"/>
<circle cx="85.0000" cy="112.0889" r="3" fill="#b35426"/>
<circle cx="127.0000" cy="137.5111" r="3" fill="#b35426"/>
<circle cx="169.0000" cy="149.0667" r="3" fill="#b35426"/>

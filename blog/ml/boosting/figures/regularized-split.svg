<svg xmlns="http://www.w3.org/2000/svg" width="560" height="620" viewBox="0 0 560 620" role="img" aria-labelledby="title desc">
  <title id="title">A split separates opposite corrections</title>
  <desc id="desc">Four rows start at prediction zero. Feature values one and two have target three; values three and four have target minus three. A single leaf has gradient sum zero and correction zero. Splitting between two and three gives gradient sums minus six and plus six, each with curvature sum two. With lambda one, leaf corrections are plus two and minus two. Learning rate 0.1 gives new predictions plus 0.2 and minus 0.2.</desc>
  <rect width="560" height="620" rx="12" fill="#ffffff"/>
  <g font-family="Arial, sans-serif" fill="#203d34" text-anchor="middle">
    <text x="280" y="34" font-size="23" font-weight="700">One leaf hides opposite errors</text>
    <text x="280" y="61" font-size="18" fill="#566d63">All four current predictions are 0</text>
    <rect x="20" y="80" width="520" height="111" rx="10" fill="#f3f7f4"/>
    <text x="60" y="109" font-size="18" text-anchor="start">x</text>
    <text x="145" y="109" font-size="20">1</text><text x="250" y="109" font-size="20">2</text><text x="355" y="109" font-size="20">3</text><text x="460" y="109" font-size="20">4</text>
    <text x="39" y="161" font-size="18" text-anchor="start">target</text>
    <circle cx="145" cy="154" r="24" fill="#16785a"/><circle cx="250" cy="154" r="24" fill="#16785a"/>
    <circle cx="355" cy="154" r="24" fill="#315db4"/><circle cx="460" cy="154" r="24" fill="#315db4"/>
    <g fill="#ffffff" font-size="20" font-weight="700"><text x="145" y="161">+3</text><text x="250" y="161">+3</text><text x="355" y="161">−3</text><text x="460" y="161">−3</text></g>
    <path d="M280 193 V214" stroke="#86998e" stroke-width="2"/>
    <rect x="90" y="214" width="380" height="87" rx="10" fill="#f3f7f4" stroke="#98aba0"/>
    <text x="280" y="242" font-size="20" font-weight="700">Keep one leaf: G = 0, H = 4</text>
    <text x="280" y="274" font-size="21">Correction = 0</text>
    <text x="280" y="336" font-size="21" font-weight="700">Or split at x &lt; 2.5</text>
    <path d="M280 350 L145 381 M280 350 L415 381" stroke="#86998e" stroke-width="2" fill="none"/>
    <rect x="20" y="381" width="250" height="128" rx="10" fill="#edf7f2" stroke="#16785a"/>
    <rect x="290" y="381" width="250" height="128" rx="10" fill="#eff3fc" stroke="#315db4"/>
    <text x="145" y="410" font-size="19" font-weight="700">Left: rows 1, 2</text>
    <text x="415" y="410" font-size="19" font-weight="700">Right: rows 3, 4</text>
    <text x="145" y="444" font-size="19">G = −6, H = 2</text>
    <text x="415" y="444" font-size="19">G = +6, H = 2</text>
    <text x="145" y="480" font-size="23" font-weight="700" fill="#126248">w = +6 / 3 = +2</text>
    <text x="415" y="480" font-size="23" font-weight="700" fill="#284d96">w = −6 / 3 = −2</text>
    <text x="280" y="540" font-size="19">λ = 1 adds 1 to each denominator</text>
    <rect x="20" y="556" width="520" height="43" rx="9" fill="#f3f7f4"/>
    <text x="280" y="584" font-size="20" font-weight="700">Learning rate 0.1 → predictions ±0.2</text>
  </g>
</svg>

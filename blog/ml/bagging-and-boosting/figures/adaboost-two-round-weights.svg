<svg xmlns="http://www.w3.org/2000/svg" width="560" height="690" viewBox="0 0 560 690" role="img" aria-labelledby="title desc">
<title id="title">Training priorities across two AdaBoost rounds</title>
<desc id="desc">All panels share a weight scale from zero to one half. Initial weights are one fifth each. After round one, the weights are one half, one eighth, one eighth, one eighth, one eighth. After round two they are one third, one quarter, one quarter, one twelfth, one twelfth. Crosses mark mistakes by the latest learner, not the final ensemble.</desc>
<rect width="560" height="690" rx="12" fill="#ffffff"/>
<g font-family="Arial, sans-serif" fill="#203d34">
<text x="280" y="31" font-size="23" font-weight="700" text-anchor="middle">Which rows matter to the next learner?</text>
<text x="280" y="59" font-size="18" text-anchor="middle" fill="#566d63">Bar height = example weight; each panel sums to 1</text>
<rect x="15" y="80" width="530" height="190" rx="10" fill="#f6f8f5"/>
<text x="30" y="105" font-size="20" font-weight="700">Before training · equal weights</text>
<line x1="66" x2="525" y1="142.0" y2="142.0" stroke="#cbd7d0" stroke-dasharray="4 4"/>
<text x="55" y="148.0" text-anchor="end" font-size="17">0.5</text>
<text x="55" y="243" text-anchor="end" font-size="17">0</text>
<line x1="66" x2="525" y1="237" y2="237" stroke="#86998e"/>
<rect x="82" y="199.000" width="56" height="38.000" rx="3" fill="#71847a"/>
<text x="110" y="193.000" text-anchor="middle" font-size="18" font-weight="700">1/5</text>
<text x="110" y="262" text-anchor="middle" font-size="17">row 1</text>
<rect x="170" y="199.000" width="56" height="38.000" rx="3" fill="#71847a"/>
<text x="198" y="193.000" text-anchor="middle" font-size="18" font-weight="700">1/5</text>
<text x="198" y="262" text-anchor="middle" font-size="17">row 2</text>
<rect x="258" y="199.000" width="56" height="38.000" rx="3" fill="#71847a"/>
<text x="286" y="193.000" text-anchor="middle" font-size="18" font-weight="700">1/5</text>
<text x="286" y="262" text-anchor="middle" font-size="17">row 3</text>
<rect x="346" y="199.000" width="56" height="38.000" rx="3" fill="#71847a"/>
<text x="374" y="193.000" text-anchor="middle" font-size="18" font-weight="700">1/5</text>
<text x="374" y="262" text-anchor="middle" font-size="17">row 4</text>
<rect x="434" y="199.000" width="56" height="38.000" rx="3" fill="#71847a"/>
<text x="462" y="193.000" text-anchor="middle" font-size="18" font-weight="700">1/5</text>
<text x="462" y="262" text-anchor="middle" font-size="17">row 5</text>
<rect x="15" y="278" width="530" height="190" rx="10" fill="#f6f8f5"/>
<text x="30" y="303" font-size="20" font-weight="700">After round 1 · learner 1 missed row 1</text>
<line x1="66" x2="525" y1="340.0" y2="340.0" stroke="#cbd7d0" stroke-dasharray="4 4"/>
<text x="55" y="346.0" text-anchor="end" font-size="17">0.5</text>
<text x="55" y="441" text-anchor="end" font-size="17">0</text>
<line x1="66" x2="525" y1="435" y2="435" stroke="#86998e"/>
<rect x="82" y="340.000" width="56" height="95.000" rx="3" fill="#b35426"/>
<text x="110" y="334.000" text-anchor="middle" font-size="18" font-weight="700">1/2</text>
<text x="110" y="460" text-anchor="middle" font-size="17">row 1</text>
<text x="110" y="367.000" text-anchor="middle" fill="#ffffff" font-size="25" font-weight="700">×</text>
<rect x="170" y="411.250" width="56" height="23.750" rx="3" fill="#16785a"/>
<text x="198" y="405.250" text-anchor="middle" font-size="18" font-weight="700">1/8</text>
<text x="198" y="460" text-anchor="middle" font-size="17">row 2</text>
<rect x="258" y="411.250" width="56" height="23.750" rx="3" fill="#16785a"/>
<text x="286" y="405.250" text-anchor="middle" font-size="18" font-weight="700">1/8</text>
<text x="286" y="460" text-anchor="middle" font-size="17">row 3</text>
<rect x="346" y="411.250" width="56" height="23.750" rx="3" fill="#16785a"/>
<text x="374" y="405.250" text-anchor="middle" font-size="18" font-weight="700">1/8</text>
<text x="374" y="460" text-anchor="middle" font-size="17">row 4</text>
<rect x="434" y="411.250" width="56" height="23.750" rx="3" fill="#16785a"/>
<text x="462" y="405.250" text-anchor="middle" font-size="18" font-weight="700">1/8</text>
<text x="462" y="460" text-anchor="middle" font-size="17">row 5</text>
<rect x="15" y="476" width="530" height="190" rx="10" fill="#f6f8f5"/>

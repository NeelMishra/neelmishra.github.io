<line x1="66" x2="525" y1="538.0" y2="538.0" stroke="#cbd7d0" stroke-dasharray="4 4"/>
<text x="55" y="544.0" text-anchor="end" font-size="17">0.5</text>
<text x="55" y="639" text-anchor="end" font-size="17">0</text>
<line x1="66" x2="525" y1="633" y2="633" stroke="#86998e"/>
<rect x="82" y="569.667" width="56" height="63.333" rx="3" fill="#16785a"/>
<text x="110" y="563.667" text-anchor="middle" font-size="18" font-weight="700">1/3</text>
<text x="110" y="658" text-anchor="middle" font-size="17">row 1</text>
<rect x="170" y="585.500" width="56" height="47.500" rx="3" fill="#b35426"/>
<text x="198" y="579.500" text-anchor="middle" font-size="18" font-weight="700">1/4</text>
<text x="198" y="658" text-anchor="middle" font-size="17">row 2</text>
<text x="198" y="612.500" text-anchor="middle" fill="#ffffff" font-size="25" font-weight="700">×</text>
<rect x="258" y="585.500" width="56" height="47.500" rx="3" fill="#b35426"/>
<text x="286" y="579.500" text-anchor="middle" font-size="18" font-weight="700">1/4</text>
<text x="286" y="658" text-anchor="middle" font-size="17">row 3</text>
<text x="286" y="612.500" text-anchor="middle" fill="#ffffff" font-size="25" font-weight="700">×</text>
<rect x="346" y="617.167" width="56" height="15.833" rx="3" fill="#16785a"/>
<text x="374" y="611.167" text-anchor="middle" font-size="18" font-weight="700">1/12</text>
<text x="374" y="658" text-anchor="middle" font-size="17">row 4</text>
<rect x="434" y="617.167" width="56" height="15.833" rx="3" fill="#16785a"/>
<text x="462" y="611.167" text-anchor="middle" font-size="18" font-weight="700">1/12</text>

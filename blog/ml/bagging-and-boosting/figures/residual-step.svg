<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="title desc"><title id="title">One squared-error boosting step</title><desc id="desc">Targets 2, 4, 8, 10; baseline 6; updated predictions 4.5, 4.5, 7.5, 7.5.</desc><rect width="760" height="420" fill="white"/><g font-family="Arial, sans-serif" font-size="17" fill="#223a30"><text x="75" y="30" font-weight="700" font-size="22">One boosting step reduces the residuals</text><text x="75" y="55" fill="#53695e">Mean baseline = 6  ·  stump correction = ±3  ·  learning rate = 0.5</text><line x1="75" y1="335" x2="715" y2="335" stroke="#dce5df" /><text x="60" y="341" text-anchor="end">0</text><line x1="75" y1="287" x2="715" y2="287" stroke="#dce5df" /><text x="60" y="293" text-anchor="end">2</text><line x1="75" y1="239" x2="715" y2="239" stroke="#dce5df" /><text x="60" y="245" text-anchor="end">4</text><line x1="75" y1="191" x2="715" y2="191" stroke="#dce5df" /><text x="60" y="197" text-anchor="end">6</text><line x1="75" y1="143" x2="715" y2="143" stroke="#dce5df" /><text x="60" y="149" text-anchor="end">8</text><line x1="75" y1="95" x2="715" y2="95" stroke="#dce5df" /><text x="60" y="101" text-anchor="end">10</text><line x1="75" y1="191" x2="715" y2="191" stroke="#85938c" stroke-width="2" stroke-dasharray="7 5"/><line x1="75" y1="227.0" x2="370" y2="227.0" stroke="#16785a" stroke-width="4"/><line x1="370" y1="155.0" x2="715" y2="155.0" stroke="#16785a" stroke-width="4"/><line x1="370" y1="227.0" x2="370" y2="155.0" stroke="#16785a" stroke-width="2" stroke-dasharray="4 4"/><line x1="100" y1="287" x2="100" y2="227.0" stroke="#b27a48" stroke-width="2"/><circle cx="100" cy="287" r="6" fill="#315db4"/><text x="100" y="360" text-anchor="middle">1</text><line x1="280" y1="239" x2="280" y2="227.0" stroke="#b27a48" stroke-width="2"/><circle cx="280" cy="239" r="6" fill="#315db4"/><text x="280" y="360" text-anchor="middle">2</text><line x1="460" y1="143" x2="460" y2="155.0" stroke="#b27a48" stroke
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" role="img" aria-labelledby="title desc"><title id="title">Boosting trains learners in dependent rounds</title><desc id="desc">Start from an initial ensemble state. Fit the next learner using current correction targets or example weights, update the ensemble, and use that updated state to fit the following learner.</desc><rect width="400" height="420" rx="12" fill="#fafaf7"/><g font-family="Arial,sans-serif" fill="#233f36" text-anchor="middle">
<text x="200" y="32" font-size="24" font-weight="bold">Boosting: fit, update, repeat</text>
<rect x="45" y="60" width="310" height="46" rx="8" fill="#edf7f2" stroke="#087f6d"/><text x="200" y="89" font-size="20">Initial predictions / weights</text>
<path d="M200 107 V130" stroke="#71877c" stroke-width="2"/><path d="M194 122 L200 130 L206 122" stroke="#71877c" stroke-width="2" fill="none"/>
<rect x="45" y="133" width="310" height="63" rx="8" fill="#eff3fc" stroke="#526eb6"/><text x="200" y="159" font-size="20">Fit learner 1</text><text x="200" y="183" font-size="17">using the current training priorities</text>
<path d="M200 197 V221" stroke="#71877c" stroke-width="2"/><path d="M194 213 L200 221 L206 213" stroke="#71877c" stroke-width="2" fill="none"/>
<rect x="45" y="224" width="310" height="51" rx="8" fill="#fff2e8" stroke="#b15a25"/><text x="200" y="255" font-size="20">Update the ensemble and priorities</text>
<path d="M200 276 V300" stroke="#71877c" stroke-width="2"/><path d="M194 292 L200 300 L206 292" stroke="#71877c" stroke-width="2" fill="none"/>
<rect x="45" y="303" width="310" height="63" rx="8" fill="#eff3fc" stroke="#526eb6"/><text x="200" y="329" font-size="20">Fit learner 2</text><text x="200" y="353" font-size="17">using the updated training priorities</text>
<text x="200" y="395" font-size="17">Round 2 depends on round 1.</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 775" role="img" aria-labelledby="title desc">
<title id="title">One network, three contexts</title>
<desc id="desc">Hand-set cat and dog embeddings give similar output distributions. Swapping word order changes the probabilities. Exact probabilities are recorded in the accompanying JSON.</desc>
<rect width="480" height="775" rx="16" fill="#fafaf7"/>
<g font-family="Arial, sans-serif" fill="#213d35">
<text x="24" y="35" font-size="23" font-weight="bold">One network, three contexts</text>
<text x="24" y="64" font-size="17">Hand-set weights; the same network in every row</text>
<text x="24" y="103" font-size="21" font-weight="bold">the cat → ?</text>
<text x="24" y="139" font-size="19">the</text>
<rect x="104" y="122" width="62.45" height="22" fill="#087f6d" rx="3"/>
<text x="443" y="139" font-size="19" text-anchor="end">0.104</text>
<text x="24" y="168" font-size="19">cat</text>
<rect x="104" y="151" width="65.35" height="22" fill="#087f6d" rx="3"/>
<text x="443" y="168" font-size="19" text-anchor="end">0.109</text>
<text x="24" y="197" font-size="19">dog</text>
<rect x="104" y="180" width="67.83" height="22" fill="#087f6d" rx="3"/>
<text x="443" y="197" font-size="19" text-anchor="end">0.113</text>
<text x="24" y="226" font-size="19">sat</text>
<rect x="104" y="209" width="239.97" height="22" fill="#087f6d" rx="3"/>
<text x="443" y="226" font-size="19" text-anchor="end">0.400</text>
<text x="24" y="255" font-size="19">ran</text>
<rect x="104" y="238" width="164.40" height="22" fill="#087f6d" rx="3"/>
<text x="443" y="255" font-size="19" text-anchor="end">0.274</text>
<path d="M104 271 H404" stroke="#9caeaa"/>
<text x="104" y="292" font-size="16" text-anchor="middle">0</text>
<text x="254.0" y="292" font-size="16" text-anchor="middle">0.25</text>
<text x="404.0" y="292" font-size="16" text-anchor="middle">0.5</text>
<text x="24" y="312" font-size="21" font-weight="bold">the dog → ?</text>
<text x="24" y="348" font-size="19">the</text>
<rect x="104" y="331" width="63.50" height="22" fill="#526eb6" rx="3"/>
<text x="443" y="348" font-size="19" text-anchor="end">0.106</text>
<text x="24" y="377" font-size="19">cat</text>
<rect x="104" y="360" width="64.51" height="22" fill="#526eb6" rx="3"/>
<text x="443" y="377" font-size="19" text-anchor="end">0.108</text>
<text x="24" y="406" font-size="19">dog</text>
<rect x="104" y="389" width="66.21" height="22" fill="#526eb6" rx="3"/>
<text x="443" y="406" font-size="19" text-anchor="end">0.110</text>
<text x="24" y="435" font-size="19">sat</text>
<rect x="104" y="418" width="237.09" height="22" fill="#526eb6" rx="3"/>
<text x="443" y="435" font-size="19" text-anchor="end">0.395</text>
<text x="24" y="464" font-size="19">ran</text>
<rect x="104" y="447" width="168.68" height="22" fill="#526eb6" rx="3"/>
<text x="443" y="464" font-size="19" text-anchor="end">0.281</text>
<path d="M104 480 H404" stroke="#9caeaa"/>
<text x="104" y="501" font-size="16" text-anchor="middle">0</text>
<text x="254.0" y="501" font-size="16" text-anchor="middle">0.25</text>
<text x="404.0" y="501" font-size="16" text-anchor="middle">0.5</text>
<text x="24" y="521" font-size="21" font-weight="bold">cat the → ?</text>
<text x="24" y="557" font-size="19">the</text>
<rect x="104" y="540" width="82.83" height="22" fill="#b15a25" rx="3"/>
<text x="443" y="557" font-size="19" text-anchor="end">0.138</text>
<text x="24" y="586" font-size="19">cat</text>
<rect x="104" y="569" width="94.54" height="22" fill="#b15a25" rx="3"/>
<text x="443" y="586" font-size="19" text-anchor="end">0.158</text>
<text x="24" y="615" font-size="19">dog</text>
<rect x="104" y="598" width="100.26" height="22" fill="#b15a25" rx="3"/>
<text x="443" y="615" font-size="19" text-anchor="end">0.167</text>
<text x="24" y="644" font-size="19">sat</text>
<rect x="104" y="627" width="194.54" height="22" fill="#b15a25" rx="3"/>
<text x="443" y="644" font-size="19" text-anchor="end">0.324</text>
<text x="24" y="673" font-size="19">ran</text>
<rect x="104" y="656" width="127.83" height="22" fill="#b15a25" rx="3"/>
<text x="443" y="673" font-size="19" text-anchor="end">0.213</text>
<path d="M104 689 H404" stroke="#9caeaa"/>
<text x="104" y="710" font-size="16" text-anchor="middle">0</text>
<text x="254.0" y="710" font-size="16" text-anchor="middle">0.25</text>
<text x="404.0" y="710" font-size="16" text-anchor="middle">0.5</text>
<text x="24" y="733" font-size="17">Horizontal axis: next-word probability.</text>
<text x="24" y="758" font-size="17">Each five-word distribution sums to 1.</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 330" role="img" aria-labelledby="title desc">
<title id="title">Source reversal changes individual alignment gaps, not their mean in this toy timeline</title>
<desc id="desc">Forward gaps are 4, 4, 4, 4. Reversed gaps are 1, 3, 5, 7. Both average 4. The highlighted first pair becomes closer.</desc>
<rect width="320" height="330" rx="12" fill="#fffdf8"/>
<style>text{font-family:Arial,sans-serif;fill:#172820;font-size:14px}.token{font-size:16px;font-weight:bold}.label{font-size:13px}</style>
<text x="8" y="20" font-weight="bold">Forward source: gaps 4, 4, 4, 4</text>
<rect x="3" y="76" width="34" height="32" rx="5" fill="#e1f3eb"/>
<text class="token" x="20" y="97" text-anchor="middle">x1</text>
<rect x="43" y="76" width="34" height="32" rx="5" fill="#e1f3eb"/>
<text class="token" x="60" y="97" text-anchor="middle">x2</text>
<rect x="83" y="76" width="34" height="32" rx="5" fill="#e1f3eb"/>
<text class="token" x="100" y="97" text-anchor="middle">x3</text>
<rect x="123" y="76" width="34" height="32" rx="5" fill="#e1f3eb"/>
<text class="token" x="140" y="97" text-anchor="middle">x4</text>
<rect x="163" y="76" width="34" height="32" rx="5" fill="#e5eaf5"/>
<text class="token" x="180" y="97" text-anchor="middle">y1</text>
<rect x="203" y="76" width="34" height="32" rx="5" fill="#e5eaf5"/>
<text class="token" x="220" y="97" text-anchor="middle">y2</text>
<rect x="243" y="76" width="34" height="32" rx="5" fill="#e5eaf5"/>
<text class="token" x="260" y="97" text-anchor="middle">y3</text>
<rect x="283" y="76" width="34" height="32" rx="5" fill="#e5eaf5"/>
<text class="token" x="300" y="97" text-anchor="middle">y4</text>
<path d="M 20 74 C 20 35, 180 35, 180 74" fill="none" stroke="#ba562d" stroke-width="2.5"/>
<text x="100" y="42" text-anchor="middle">4 steps</text>
<text class="label" x="80" y="126" text-anchor="middle">source positions</text>
<text class="label" x="240" y="126" text-anchor="middle">target positions</text>
<text x="8" y="151">Minimum: 4 · Mean: 4</text>
<text x="8" y="188" font-weight="bold">Reversed source: gaps 1, 3, 5, 7</text>
<rect x="3" y="244" width="34" height="32" rx="5" fill="#e1f3eb"/>
<text class="token" x="20" y="265" text-anchor="middle">x4</text>
<rect x="43" y="244" width="34" height="32" rx="5" fill="#e1f3eb"/>
<text class="token" x="60" y="265" text-anchor="middle">x3</text>
<rect x="83" y="244" width="34" height="32" rx="5" fill="#e1f3eb"/>
<text class="token" x="100" y="265" text-anchor="middle">x2</text>
<rect x="123" y="244" width="34" height="32" rx="5" fill="#e1f3eb"/>
<text class="token" x="140" y="265" text-anchor="middle">x1</text>
<rect x="163" y="244" width="34" height="32" rx="5" fill="#e5eaf5"/>
<text class="token" x="180" y="265" text-anchor="middle">y1</text>
<rect x="203" y="244" width="34" height="32" rx="5" fill="#e5eaf5"/>
<text class="token" x="220" y="265" text-anchor="middle">y2</text>

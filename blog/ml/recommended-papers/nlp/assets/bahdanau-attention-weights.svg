<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 290" role="img" aria-labelledby="title desc">
<title id="title">Original additive attention weights</title>
<desc id="desc">Source columns red and square. Target row carré assigns 0.2463 and 0.7537; row rouge assigns 0.7537 and 0.2463. Every row sums to one.</desc>
<rect width="320" height="290" rx="12" fill="#f8faf8"/>
<g font-family="Arial,sans-serif" font-size="16" fill="#243f35">
<text x="160" y="28" text-anchor="middle" font-weight="bold">Same source, two queries</text>
<text x="153" y="62" text-anchor="middle">red</text><text x="247" y="62" text-anchor="middle">square</text>
<text x="16" y="115">carré</text>
<rect x="110" y="78" width="86" height="66" rx="6" fill="#e3f1eb" stroke="#709788"/>
<text x="153" y="117" text-anchor="middle" font-weight="bold">0.2463</text>
<rect x="204" y="78" width="86" height="66" rx="6" fill="#9cd9c5" stroke="#709788"/>
<text x="247" y="117" text-anchor="middle" font-weight="bold">0.7537</text>
<text x="16" y="195">rouge</text>
<rect x="110" y="158" width="86" height="66" rx="6" fill="#9cd9c5" stroke="#709788"/>
<text x="153" y="197" text-anchor="middle" font-weight="bold">0.7537</text>
<rect x="204" y="158" width="86" height="66" rx="6" fill="#e3f1eb" stroke="#709788"/>
<text x="247" y="197" text-anchor="middle" font-weight="bold">0.2463</text>
<text x="160" y="254" text-anchor="middle">Each target row sums to 1.</text>
<text x="160" y="278" text-anchor="middle">Hand-set states and weights</text></g></svg>

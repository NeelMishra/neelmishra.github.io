xt-anchor="middle" font-weight="700">B</text><text x="87" y="265" font-family="Arial,sans-serif" font-size="14" fill="#203d34" text-anchor="middle">3 rows</text><rect x="136" y="117" width="76" height="36" rx="7" fill="#fffdf9" stroke="#203d34" stroke-width="1.4"></rect><text x="174" y="140" font-family="Arial,sans-serif" font-size="14" fill="#203d34" text-anchor="middle">x₂ &lt; 5</text><line x1="174" y1="153" x2="145" y2="209" stroke="#cbd7d0" stroke-width="1.6"></line><text x="147.5" y="178" font-family="Arial,sans-serif" font-size="14" fill="#203d34" text-anchor="middle">yes</text><line x1="174" y1="153" x2="203" y2="209" stroke="#cbd7d0" stroke-width="1.6"></line><text x="200.5" y="178" font-family="Arial,sans-serif" font-size="14" fill="#203d34" text-anchor="middle">no</text><circle cx="145" cy="228" r="17" fill="#b35426"></circle><text x="145" y="234" font-family="Arial,sans-serif" font-size="17" fill="#fffdf9" text-anchor="middle" font-weight="700">B</text><text x="145" y="265" font-family="Arial,sans-serif" font-size="14" fill="#203d34" text-anchor="middle">3 rows</text><circle cx="203" cy="228" r="17" fill="#16785a"></circle><text x="203" y="234" font-family="Arial,sans-serif" font-size="17" fill="#fffdf9" text-anchor="middle" font-weight="700">A</text><text x="203" y="265" font-family="Arial,sans-serif" font-size="14" fill="#203d34" text-anchor="middle">3 rows</text></svg>
